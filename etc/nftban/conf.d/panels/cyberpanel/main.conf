# =============================================================================
# NFTBan CyberPanel Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: CyberPanel (OpenLiteSpeed) firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/cyberpanel/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# CYBERPANEL INSTALLATION
# -----------------------------------------------------------------------------

# CyberPanel installation path
NFTBAN_CYBERPANEL_PATH="/usr/local/CyberCP"

# CyberPanel panel ports
NFTBAN_CYBERPANEL_PANEL_PORT="8090"  # CyberPanel Admin
NFTBAN_CYBERPANEL_OLS_ADMIN="7080"   # OpenLiteSpeed Admin

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
#
# -----------------------------------------------------------------------------
# Based on CyberPanel recommended firewall rules
# See: https://cyberpanel.net/

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995), OpenLiteSpeed Admin(7080), CyberPanel(8090)
NFTBAN_CYBERPANEL_TCP_IN="20,21,25,53,80,110,143,443,465,587,993,995,7080,8090"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        Ident(113), HTTPS(443), Submission(587), IMAPS(993), POP3S(995)
NFTBAN_CYBERPANEL_TCP_OUT="20,21,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_CYBERPANEL_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123)
NFTBAN_CYBERPANEL_UDP_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
#
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

# TCP INPUT (incoming connections) - IPv6
NFTBAN_CYBERPANEL_TCP6_IN="20,21,25,53,80,110,143,443,465,587,993,995,7080,8090"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_CYBERPANEL_TCP6_OUT="20,21,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_CYBERPANEL_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_CYBERPANEL_UDP6_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_CYBERPANEL_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_CYBERPANEL_CUSTOM_TCP_IN=""
NFTBAN_CYBERPANEL_CUSTOM_TCP_OUT=""
NFTBAN_CYBERPANEL_CUSTOM_UDP_IN=""
NFTBAN_CYBERPANEL_CUSTOM_UDP_OUT=""

NFTBAN_CYBERPANEL_CUSTOM_TCP6_IN=""
NFTBAN_CYBERPANEL_CUSTOM_TCP6_OUT=""
NFTBAN_CYBERPANEL_CUSTOM_UDP6_IN=""
NFTBAN_CYBERPANEL_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# CyberPanel login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_CYBERPANEL_ENABLED="true"

# Log file location
LOGIN_SERVICE_CYBERPANEL_LOG="/usr/local/CyberCP/logs/access.log"
LOGIN_SERVICE_CYBERPANEL_ERROR="/usr/local/CyberCP/logs/error.log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Use SSL/TLS for panel access (HTTPS on port 8090)
# • Enable login monitoring (automatic brute-force protection)
# • Configure ModSecurity for web application firewall
# • Restrict admin panel access to specific IPs if possible
# • Enable two-factor authentication in CyberPanel
# • Keep CyberPanel and OpenLiteSpeed updated to latest versions
# • Disable root login via SSH
# • Configure rate limiting in OpenLiteSpeed

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
