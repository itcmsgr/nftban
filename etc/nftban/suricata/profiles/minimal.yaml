# =============================================================================
# NFTBan Suricata Profile: Minimal
# =============================================================================
# Target: 2 cores, 2 GB RAM
# Focus: Stability over coverage
# Use Case: Small VPS, minimal resource footprint
#
# BASELINE CORRECTIONS (v1.12.6, updated v1.12.7):
# - tpacket-v3: yes (better batching under load, all distros default to V2)
# - ring-size: 20000 (PRIMARY memory factor: ~80MB with 2 threads)
# - mpm-algo: hs (Hyperscan pattern matching, auto-fallback safe)
# - stream.inline: yes (faster alert emission per Victor Julien)
# - checksum-validation: no (kernel/NIC already validates)
# - stream.bypass: yes with depth: 1mb (skip long-session deep inspection)
# - CPU affinity: yes (prevents scheduler jitter)
#
# MEMORY FORMULA (verified Feb 2026 via strace):
# RAM ≈ ring-size × 2KB × capture_threads
# - ring-size 20000 × 2KB × 2 threads = ~80MB (safe for 2GB RAM)
# - If packet drops occur, increase to 50000 (~200MB)
# - V2 vs V3 difference is minimal; V3 better under load
# =============================================================================

%YAML 1.1
---

# Packet capture interface
af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    ring-size: 20000           # ~80MB with 2 threads, safe for 2GB RAM
    use-mmap: yes
    tpacket-v3: yes            # Better batching under load (all distros default to V2)

# Threading configuration
threading:
  set-cpu-affinity: yes        # BASELINE: prevents scheduler jitter
  detect-thread-ratio: 1.0     # Conservative
  cpu-affinity:
    management-cpu-set:
      cpu: [ 0 ]
    worker-cpu-set:
      cpu: [ 1 ]

# Flow timeout settings (AGGRESSIVE)
flow:
  memcap: 64mb                 # Low memory footprint
  hash-size: 65536
  prealloc: 10000
  timeout:
    new: 30
    established: 60            # AGGRESSIVE timeout
    closed: 0
    bypassed: 100
    emergency-new: 10
    emergency-established: 30
    emergency-closed: 0

# Stream engine
stream:
  memcap: 32mb                 # Reduced
  checksum-validation: no      # BASELINE: kernel/NIC already validates
  inline: yes                  # BASELINE: faster alert emission (Victor Julien)
  bypass: yes                  # BASELINE: skip long-session deep inspection
  reassembly:
    depth: 1mb                 # BASELINE: bypass after 1MB transferred

# HTTP configuration (DISABLED body inspection)
app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 0          # DISABLED
          response-body-limit: 0         # DISABLED
          request-body-minimal-inspect-size: 0
          request-body-inspect-window: 0
          response-body-minimal-inspect-size: 0
          response-body-inspect-window: 0

    tls:
      enabled: yes
      detection-ports:
        dp: 443

    ssh:
      enabled: yes

    dns:
      enabled: yes
      tcp:
        enabled: yes
      udp:
        enabled: yes

    # Disable resource-intensive protocols
    smtp:
      enabled: no
    smb:
      enabled: no
    dcerpc:
      enabled: no
    ftp:
      enabled: no
    mysql:
      enabled: no

# Logging configuration
outputs:
  - fast:
      enabled: no

  # 1) NFTBan daemon reads ONLY this file (alert-only, minimal I/O)
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/nftban/suricata/eve-alerts.json
      threaded: yes

      types:
        - alert:
            payload: no
            packet: no
            metadata: yes

  # 2) Optional admin/audit log (OFF by default to avoid I/O storms)
  - eve-log:
      enabled: no
      filetype: regular
      filename: /var/log/nftban/suricata/eve-audit.json
      threaded: yes

      types:
        - alert
        - http
        - dns
        - tls

# Detection engine
detect:
  profile: low                   # Low CPU usage
  mpm-algo: hs                   # BASELINE: Hyperscan (auto-fallback if unavailable)
  custom-values:
    toclient-groups: 2
    toserver-groups: 2
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

# Profiling (disabled for performance)
profiling:
  rules:
    enabled: no
  keywords:
    enabled: no

# Rule reload settings
detect-engine:
  - profile: minimal
  - sgh-mpm-context: auto
  - inspection-recursion-limit: 3000
  - rule-reload: true

# Default rule path
default-rule-path: /var/lib/suricata/rules

# Rule files (managed by NFTBan)
rule-files:
  - /etc/nftban/suricata/rules/enabled.list

# Classification file
classification-file: /etc/suricata/classification.config

# Reference config file
reference-config-file: /etc/suricata/reference.config

# GeoIP database (if available)
geoip-database: /var/lib/GeoIP/GeoLite2-Country.mmdb

# =============================================================================
# NFTBan Integration Notes:
# - This profile is auto-selected for systems with 2 cores / 2GB RAM
# - HTTP body inspection is DISABLED (request: 0, response: 0)
# - Flow timeouts are AGGRESSIVE (60s established)
# - Only essential protocols enabled
# - Ring size: 50k frames (vs 100k standard, 300k maximum)
# - Detection profile: LOW (vs MEDIUM/HIGH)
# - Output: alert-only to eve-alerts.json (daemon path)
# - Audit log: disabled by default (eve-audit.json)
#
# BASELINE CORRECTIONS (v1.12.6, updated v1.12.7):
# - ring-size: 20000 - ~80MB with 2 threads, safe for 2GB RAM (increase if drops)
# - tpacket-v3: yes - Better batching under load (all distros default to V2)
# - mpm-algo: hs - Hyperscan pattern matching, auto-fallback safe
# - stream.inline: yes - Faster alert emission per Victor Julien guidance
# - checksum-validation: no - Kernel/NIC already validates, avoid redundant work
# - stream.bypass: yes - Skip long-session deep inspection (NFTBan uses early signals)
# - CPU affinity: yes - Prevents scheduler jitter even on 2-core systems
#
# TUNING: If packet drops occur, increase ring-size to 50000 (~200MB)
# =============================================================================
