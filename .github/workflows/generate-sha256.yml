name: Generate SHA256 Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate SHA256SUMS.txt
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating SHA256SUMS.txt for all tracked files..."

          # Generate checksums for all tracked files except SHA256SUMS.txt itself
          # Format: <hash>  <filepath> (two spaces, sorted by filepath)
          while IFS= read -r file; do
            sha256sum "$file"
          done < <(git ls-files ':!:SHA256SUMS.txt') | sort -k2 > SHA256SUMS.txt.tmp

          # Check if file changed
          if [[ -f SHA256SUMS.txt ]] && cmp -s SHA256SUMS.txt.tmp SHA256SUMS.txt; then
            echo "No changes to SHA256SUMS.txt"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm -f SHA256SUMS.txt.tmp
          else
            mv SHA256SUMS.txt.tmp SHA256SUMS.txt
            echo "SHA256SUMS.txt updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"

            # Show stats
            file_count=$(wc -l < SHA256SUMS.txt)
            echo "Total files tracked: $file_count"
          fi

      - name: Commit and push changes
        if: steps.generate.outputs.changed == 'true'
        run: |
          git add SHA256SUMS.txt
          git commit -m "chore: update SHA256SUMS.txt (automated)

          - Reflects current state of all tracked files
          - Deletions/additions automatically included
          - Sorted by filepath for stability
          - Generated via GitHub Actions workflow

          🤖 Automated checksum update"

          git push origin main
