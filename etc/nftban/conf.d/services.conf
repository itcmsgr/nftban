# =============================================================================
# NFTBan - Services Control Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# File: /etc/nftban/conf.d/services.conf
# Purpose: Control which services NFTBan manages and auto-starts
#
# meta:name="services.conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2025-11-05"
# meta:description="Control which services NFTBan manages and auto-starts"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/services.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# This file provides configuration-based control over service management,
# allowing you to disable features without using systemctl commands.
# =============================================================================

# =============================================================================
# MASTER SWITCHES
# =============================================================================

# Master switch - disable NFTBan completely
# If set to "false", all NFTBan functionality will be disabled
# Default: true
NFTBAN_ENABLED="true"

# =============================================================================
# NFTABLES SERVICE CONTROL
# =============================================================================

# Control whether NFTBan manages nftables service
# Set to "false" to prevent NFTBan from managing nftables at all
# Default: true
NFTABLES_ENABLED="true"

# Auto-start nftables service if it's not running
# Set to "false" to prevent NFTBan from auto-starting nftables
# Note: This does NOT affect systemd auto-start on boot
# Default: false (don't auto-start, let systemd handle it)
NFTABLES_AUTO_START="false"

# =============================================================================
# SURICATA IDS SERVICE CONTROL (NFTBan v1.0+)
# =============================================================================

# Control whether NFTBan manages Suricata IDS service
# Suricata replaces fail2ban as the primary intrusion detection system
# Set to "false" to prevent NFTBan from managing Suricata
# Default: true
SURICATA_ENABLED="false"

# Auto-start Suricata service if it's not running
# Set to "false" to prevent NFTBan from auto-starting Suricata
# Note: This does NOT affect systemd auto-start on boot
# Default: false (don't auto-start, let systemd handle it)
SURICATA_AUTO_START="false"

# =============================================================================
# LOGIN MONITOR MODULE (NFTBan v1.0+)
# =============================================================================
# NOTE: Login monitor has its own detailed configuration file:
#   /etc/nftban/conf.d/login_alert.conf
#
# Key settings in login_alert.conf:
#   NFTBAN_LOGIN_ALERT_ENABLED="true"   - Enable/disable login alerting
#   NFTBAN_LOGIN_ALERT_SSH="true"       - Monitor SSH logins
#   NFTBAN_LOGIN_ALERT_SU="true"        - Monitor su commands
#   NFTBAN_LOGIN_ALERT_SUDO="true"      - Monitor sudo commands
#   NFTBAN_LOGIN_ALERT_GEOIP="true"     - Include GeoIP in alerts
#   NFTBAN_LOGIN_FAILED_THRESHOLD="3"   - Failed attempts before alert
#
# To enable/disable login monitoring:
#   nftban login enable
#   nftban login disable
#   nftban login status

# =============================================================================
# BOOT BEHAVIOR CONTROL
# =============================================================================

# Control whether services should start on system boot
# Set to "false" to disable all auto-start behavior during boot
# Note: This is a hint for init scripts, actual boot control is via systemd
# Default: true
SERVICES_START_ON_BOOT="true"

# =============================================================================
# USAGE EXAMPLES
# =============================================================================

# Example 1: Disable NFTBan completely
# -----------------------
# NFTBAN_ENABLED="false"
#
# Effect: NFTBan commands will exit early with "disabled" message

# Example 2: Disable nftables management
# -----------------------
# NFTABLES_ENABLED="false"
#
# Effect: NFTBan won't touch nftables rules or service

# Example 3: Prevent Suricata auto-start
# -----------------------
# SURICATA_AUTO_START="false"
#
# Effect: NFTBan won't start Suricata if it's stopped

# Example 4: Recovery mode (disable all auto-starts)
# -----------------------
# NFTABLES_AUTO_START="false"
# SURICATA_AUTO_START="false"
# SERVICES_START_ON_BOOT="false"
#
# Effect: Nothing starts automatically, manual control only

# =============================================================================
# NOTES
# =============================================================================

# These settings control NFTBan's BEHAVIOR, not systemd service state
# To prevent services from starting at boot, use systemd:
#   systemctl disable nftban
#   systemctl disable nftables
#   systemctl disable suricata

# To temporarily stop services:
#   systemctl stop nftban
#   systemctl stop nftables
#   systemctl stop suricata

# To permanently disable (prevent any start):
#   systemctl mask nftban
#   systemctl mask nftables
#   systemctl mask suricata
