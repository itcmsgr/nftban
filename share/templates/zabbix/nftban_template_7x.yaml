                      name: itemid.0
                      value:
                        key: nftban.status
                        host: NFTBan
                - type: item_value
                  name: 'Mode'
                  x: '6'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.mode
                        host: NFTBan
                - type: item_value
                  name: 'Version'
