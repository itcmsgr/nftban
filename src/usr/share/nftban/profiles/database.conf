# =============================================================================
# NFTBan Security Profile: Database Server
# =============================================================================
# Optimized for: MySQL, PostgreSQL, MongoDB protection
# Best for: Database servers, data storage
# =============================================================================

PROFILE_NAME="database"
PROFILE_DESCRIPTION="Database Server - MySQL, PostgreSQL protection"

# =============================================================================
# DDOS PROTECTION
# =============================================================================

DDOS_PROTECTION_ENABLED="true"

# SYN Flood: Disabled (low connection volume)
DDOS_SYNFLOOD_ENABLED="false"

# Connection Limits: Database-specific
DDOS_CONNLIMIT_ENABLED="true"
DDOS_CONNLIMIT_SSH="5"
DDOS_CONNLIMIT_HTTP="0"
DDOS_CONNLIMIT_HTTPS="0"
DDOS_CONNLIMIT_FTP="0"
DDOS_CONNLIMIT_SMTP="0"
DDOS_CONNLIMIT_POP3="0"
DDOS_CONNLIMIT_IMAP="0"
DDOS_CONNLIMIT_MYSQL="5"        # DB connections
DDOS_CONNLIMIT_POSTGRESQL="5"

# Port Flood: Protect DB ports
DDOS_PORTFLOOD_ENABLED="true"
DDOS_PORTFLOOD_RATE="300/second"
DDOS_PORTFLOOD_BURST="500"
DDOS_PORTFLOOD_SSH="5/300"

# ICMP Flood
DDOS_ICMPFLOOD_ENABLED="true"
DDOS_ICMPFLOOD_RATE="30/second"
DDOS_ICMPFLOOD_BURST="60"

# =============================================================================
# PORT SCAN DETECTION: Very Aggressive
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="120"      # 2 minutes
PORTSCAN_THRESHOLD="5"          # Very low threshold
PORTSCAN_DIVERSITY="false"      # Strict detection
PORTSCAN_AUTO_BAN="true"
PORTSCAN_BAN_TYPE="permanent"   # Permanent bans!
PORTSCAN_MONITOR_PORTS="closed"
PORTSCAN_MONITOR_ICMP="true"
