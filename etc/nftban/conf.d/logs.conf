# =============================================================================
# Operator authority for the capacity-derived log-retention policy (v1.222.0+).
#
# THIS FILE is the ONLY place to override retention. NFTBan derives a bounded
# logrotate policy from the /var/log filesystem capacity + host profile and
# renders it to /etc/logrotate.d/nftban (and nftban-suricata). That generated
# file is DERIVED STATE — do NOT edit it; your edits are lost on the next
# regeneration. Set overrides here instead. Inspect the effective policy with:
#     nftban logs retention status        (human)
#     nftban logs retention status --json (machine)
#
# Default behavior is SAFE with no configuration: automatic mode sizes retention
# to fit ~15% of /var/log capacity while preserving each family's forensic floor.
# Overrides here survive package upgrades (this file is operator config).
# Invalid values fail validation (nftban config validate) — they are never
# silently ignored.
# -----------------------------------------------------------------------------

# Retention mode:
#   auto  — capacity/profile-derived policy (default, recommended)
#   fixed — honor the explicit overrides below as authoritative
# ("off" is intentionally NOT supported — disabling rotation risks disk-fill.)
LOG_RETENTION_MODE="auto"

# ---- Optional overrides (leave commented for automatic behavior) ------------

# Maximum share of the /var/log filesystem CAPACITY the NFTBan log budget may
# use, as a percentage (1-90). Default 15.
#LOG_RETENTION_MAX_PERCENT="15"

# Absolute cap on the total NFTBan log budget, in BYTES (0 = no absolute cap;
# the percentage applies). A cap below the minimum forensic floor is raised to
# the floor — the forensic minimum is always preserved.
#LOG_RETENTION_MAX_BYTES="0"

# Per-family MINIMUM retention TARGET in days (default 7). This target is
# translated into the forensic floor NFTBan actually enforces: a number of
# rotated GENERATIONS plus a BYTE budget. It is NOT a guaranteed elapsed-day
# count — under heavy write pressure a family can reach its size cap and rotate
# sooner, so the elapsed days may be fewer while the generation+byte floor still
# holds. A family's own (higher) forensic floor still wins.
#LOG_RETENTION_MIN_DAYS="7"

# Per-family MAXIMUM retention TARGET in days (ceiling; default 90). An upper
# bound on the retention target; never reduces a family below its forensic floor.
#LOG_RETENTION_MAX_DAYS="90"

# Force the retention profile instead of auto-detecting from disk capacity:
#   auto | small | standard | high-volume
#LOG_RETENTION_PROFILE="auto"
