# =============================================================================
# NFTBan CWP (CentOS Web Panel) Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: CentOS Web Panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/cwp/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# CWP INSTALLATION
# -----------------------------------------------------------------------------

# CWP installation path
NFTBAN_CWP_PATH="/usr/local/cwpsrv"

# CWP panel ports
NFTBAN_CWP_PANEL_PORT="2030"      # CWP HTTP
NFTBAN_CWP_PANEL_SSL_PORT="2031"  # CWP HTTPS
NFTBAN_CWP_USER_PORT="2082"       # User Panel HTTP
NFTBAN_CWP_USER_SSL_PORT="2083"   # User Panel HTTPS

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
# -----------------------------------------------------------------------------
# Based on CWP recommended firewall rules
# See: https://control-webpanel.com/

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995), CWP Admin(2030), CWP Admin SSL(2031), User Panel(2082),
#        User Panel SSL(2083), WHM(2086), WHM SSL(2087), Webmail(2095),
#        Webmail SSL(2096)
NFTBAN_CWP_TCP_IN="20,21,22,25,53,80,110,143,443,465,587,993,995,2030,2031,2082,2083,2086,2087,2095,2096"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        Ident(113), HTTPS(443), Submission(587), IMAPS(993), POP3S(995),
#        CWP Updates(2080), CWP SSL(2443)
NFTBAN_CWP_TCP_OUT="20,21,22,25,53,80,110,113,443,587,993,995,2080,2443"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_CWP_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123)
NFTBAN_CWP_UDP_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

# TCP INPUT (incoming connections) - IPv6
NFTBAN_CWP_TCP6_IN="20,21,22,25,53,80,110,143,443,465,587,993,995,2030,2031,2082,2083,2086,2087,2095,2096"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_CWP_TCP6_OUT="20,21,22,25,53,80,110,113,443,587,993,995,2080,2443"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_CWP_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_CWP_UDP6_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_CWP_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_CWP_CUSTOM_TCP_IN=""
NFTBAN_CWP_CUSTOM_TCP_OUT=""
NFTBAN_CWP_CUSTOM_UDP_IN=""
NFTBAN_CWP_CUSTOM_UDP_OUT=""

NFTBAN_CWP_CUSTOM_TCP6_IN=""
NFTBAN_CWP_CUSTOM_TCP6_OUT=""
NFTBAN_CWP_CUSTOM_UDP6_IN=""
NFTBAN_CWP_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# CWP login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_CWP_ENABLED="true"

# Log file location
LOGIN_SERVICE_CWP_LOG="/usr/local/cwpsrv/logs/access_log"
LOGIN_SERVICE_CWP_ERROR="/usr/local/cwpsrv/logs/error_log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Use SSL/TLS for panel access (port 2031)
# • Enable login monitoring (automatic brute-force protection)
# • Configure CSF/LFD for additional protection
# • Restrict admin panel access to specific IPs if possible
# • Enable two-factor authentication in CWP
# • Keep CWP updated to latest version
# • Disable root login via SSH
# • Configure ModSecurity for web application firewall

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
