# =============================================================================
# NFTBan - Docker Image Build & Publish
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Build and publish Docker images to GitHub Container Registry
#
# This workflow satisfies OpenSSF Scorecard "Packaging" requirement by
# publishing to a package registry (ghcr.io).
# =============================================================================

name: Docker

on:
  push:
    branches: [main, master]
    # v1.234.0 (owner): no push on v* tags. A tag now produces only a DRAFT release;
    # versioned images (vX.Y.Z / X.Y.Z / X.Y) are published by release-publish.yml,
    # which dispatches this workflow on the tag ref AFTER RC acceptance.
  workflow_dispatch:
    inputs:
      release_commit:
        description: "On a tag ref: the accepted release commit (40-hex); the image must be built from it"
        required: false
        type: string
  pull_request:
    branches: [main, master, 'hotfix/**']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.117 D-DOCKER-SHA-LENGTH-OBSERVATION fix:
      # docker/metadata-action@v5 does NOT honor `length=N` on `type=sha`
      # (the attribute is parsed but ignored — v1.116.0 release evidence:
      # `length=8` was specified yet `sha-3ea0488` 7-char was published).
      # `type=sha,format=short` uses git's `core.abbrev` (typically 7 chars,
      # hard-coded `context.sha.substr(0, 7)` in the action source). The
      # documented escape hatch is `type=raw,value=...` with a pre-computed
      # value, which is what this step + raw rule below provide.
      - name: Compute 8-char short SHA for Docker tag
        id: short_sha
        run: |
          short_sha=$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)
          printf 'SHA_SHORT=%s\n' "$short_sha" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # v-prefixed semver tag — restores v1.108.0-era convenience tag.
            # Pairs with the non-v {{version}} rule below so both `1.116.0`
            # and `v1.116.0` resolve. Closes V114 PR #620 Docker tag scheme
            # drift observation (V116 P2 scope).
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 8-char short SHA via raw template — closes V117
            # D-DOCKER-SHA-LENGTH-OBSERVATION (v1.116.0 closure §6).
            # See the `Compute 8-char short SHA` step above for the
            # workaround rationale (length= is silently ignored on type=sha
            # in metadata-action@v5).
            type=raw,value=sha-${{ env.SHA_SHORT }},enable=true,priority=100

      # v1.234.0 (owner): a versioned image is its own artifact. It is built ONCE from the
      # accepted release commit, checked, and only that checked image is pushed.
      - name: Release image binds to the accepted commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::versioned images are published only by release-publish.yml (workflow_dispatch)"; exit 1
          fi
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_commit (40-hex) is required for a tag ref"; exit 1; }
          [[ "$GITHUB_SHA" == "$RELEASE_COMMIT" ]] || { echo "::error::tag ref is $GITHUB_SHA, accepted release commit is $RELEASE_COMMIT"; exit 1; }
          echo "image source = accepted release commit $GITHUB_SHA"

      - name: Build (load locally, no push yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image checks (before any push)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          img=$(awk 'NF { print; exit }' <<<"$TAGS")
          rev=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$img")
          [[ "$rev" == "$GITHUB_SHA" ]] || { echo "::error::image revision label '$rev' != source commit $GITHUB_SHA"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$img")
            tagver="${GITHUB_REF#refs/tags/}"
            [[ "${ver#v}" == "${tagver#v}" ]] || { echo "::error::image version label '$ver' != tag $tagver"; exit 1; }
          fi
          docker run --rm --entrypoint /bin/sh "$img" -c 'test -x /usr/sbin/nftban && test -x /usr/bin/nftban-core && test -x /usr/bin/nftband'
          help_out=$(docker run --rm "$img" help 2>&1)
          # rc 0 is not enough: measured on lab3 (2026-10-05) `help` exits 0 while printing
          # "ERROR: No configuration file found for alpine …". A RELEASE image must start clean.
          if [[ "$GITHUB_REF" == refs/tags/* ]] && grep -qE '^ERROR' <<<"$help_out"; then
            echo "::error title=Release image not usable::'nftban help' reports an error in the image:"
            grep -E '^ERROR' <<<"$help_out" || true
            exit 1
          fi
          echo "image checks PASS: $img (revision $rev)"

      - name: Push the checked image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [[ -n "$t" ]] || continue
            docker push "$t"
          done <<<"$TAGS"
