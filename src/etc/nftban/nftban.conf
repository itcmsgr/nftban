# =============================================================================
# NFTBan Configuration File
# =============================================================================
# Version: 0.32.0
#
# ⚠️  WARNING: This file is OVERWRITTEN on package upgrades!
# ⚠️  Use /etc/nftban/nftban.conf.local for your customizations
#
# =============================================================================

# Version
NFTBAN_VERSION="0.32.3"

# Debug mode (true/false)
NFTBAN_DEBUG_MODE="false"

# =============================================================================
# Safety Configuration
# =============================================================================

# Startup delay in seconds (0 = no delay, default: 300 = 5 minutes)
# Gives administrator time to login after reboot before firewall activates
# CRITICAL for servers without console access
NFTBAN_STARTUP_DELAY="300"

# =============================================================================
# FHS Directory Paths
# =============================================================================

NFTBAN_CONFIG_DIR="/etc/nftban"
NFTBAN_LIB_DIR="/usr/lib/nftban"
NFTBAN_SHARE_DIR="/usr/share/nftban"
NFTBAN_STATE_DIR="/var/lib/nftban"
NFTBAN_LOG_DIR="/var/log/nftban"
NFTBAN_CACHE_DIR="/var/cache/nftban"
NFTBAN_RUN_DIR="/run/nftban"

# =============================================================================
# User Customizations
# =============================================================================
# Create /etc/nftban/nftban.conf.local for your settings
# It will NEVER be overwritten by package updates
#
# Example:
#   NFTBAN_DEBUG_MODE="true"
#   NFTBAN_BANNER_MODE="simple"
#
# =============================================================================

# End of nftban.conf
