# Mail Server Port Protection
# Common mail server ports for SMTP, IMAP, POP3
# Enable only the ports your mail server uses

# Configuration format: PORT|PROTOCOL|DIRECTION
# T = TCP, U = UDP
# I = INPUT, O = OUTPUT, F = FORWARD

# SMTP (Simple Mail Transfer Protocol)
# Port 25 - Standard SMTP (unencrypted, used for server-to-server)
25|T|I

# SMTP Submission (Encrypted client submission)
# Port 587 - SMTP Submission with STARTTLS (recommended for clients)
587|T|I

# SMTPS (SMTP over SSL/TLS)
# Port 465 - SMTPS (legacy, but still widely used)
465|T|I

# IMAP (Internet Message Access Protocol)
# Port 143 - IMAP (unencrypted, not recommended)
# 143|T|I

# IMAPS (IMAP over SSL/TLS)
# Port 993 - IMAPS (secure, recommended)
993|T|I

# POP3 (Post Office Protocol v3)
# Port 110 - POP3 (unencrypted, not recommended)
# 110|T|I

# POP3S (POP3 over SSL/TLS)
# Port 995 - POP3S (secure, if POP3 is needed)
995|T|I

# Notes:
# - Uncomment ports 143 and 110 only if you need unencrypted IMAP/POP3
# - For production, use only encrypted ports (587, 465, 993, 995)
# - Port 25 is always needed for server-to-server mail delivery
