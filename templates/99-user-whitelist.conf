# ═══════════════════════════════════════════════════════════════════════════════
# NFTBan User Whitelist - Manual Entries
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
#   Add trusted IPs that should NEVER be banned (office IPs, admin IPs, etc.)
#
# PRIORITY:
#   ✅ HIGHEST - Whitelist ALWAYS wins over blacklist
#   • IPs in this file will NEVER be banned
#   • Takes precedence over all blacklists and feeds
#
# FORMAT:
#   <IP_ADDRESS>  # <COMMENT>
#
# EXAMPLES:
#   1.2.3.4                    # Office static IP
#   5.6.7.8                    # Home IP - John Admin
#   10.0.0.0/24                # Internal network (CIDR notation)
#   2001:db8::1                # IPv6 address
#   2001:db8::/32              # IPv6 CIDR
#
# IMPORTANT:
#   • One IP per line
#   • Comments start with #
#   • Supports both IPv4 and IPv6
#   • Supports CIDR notation (e.g., 192.168.1.0/24)
#   • Changes take effect after: nftban reload
#
# QUICK COMMANDS:
#   # Add your current IP automatically
#   sudo nftban whitelist-system whitelistme
#
#   # Manually add an IP
#   echo "1.2.3.4  # Trusted admin" | sudo tee -a /etc/nftban/whitelist.d/99-user-whitelist.conf
#
#   # Reload to apply changes
#   sudo nftban reload
#
