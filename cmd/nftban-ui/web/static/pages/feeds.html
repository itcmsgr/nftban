<style>
/* Feeds Page Styles */
.feeds-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}
.feeds-stat-card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
}
.feeds-stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
}
.feeds-stat-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 5px;
}
.feed-card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    transition: all 0.2s;
}
.feed-card.enabled {
    border-left: 3px solid #22c55e;
}
.feed-card.disabled {
    opacity: 0.6;
    border-left: 3px solid #6b7280;
}
.feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.feed-name {
    font-weight: 600;
    font-size: 14px;
}
.feed-stats {
    display: flex;
    gap: 15px;
    font-size: 12px;
    color: var(--text-muted);
}
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}
.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #6b7280;
    transition: 0.3s;
    border-radius: 24px;
}
.toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}
input:checked + .toggle-slider {
    background-color: #22c55e;
}
input:checked + .toggle-slider:before {
    transform: translateX(20px);
}
</style>

<h2><i class="fa fa-rss"></i> Threat Feeds</h2>
<p class="text-muted">Threat intelligence feeds for automatic IP blocking</p>

<!-- Controls -->
<div class="card" style="margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <div>
            <span style="font-size: 14px; margin-right: 10px;">Feeds Service:</span>
            <span id="feeds-status" style="font-weight: 600; padding: 5px 12px; border-radius: 4px; background: #6b7280; color: white;">Checking...</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="updateAllFeeds()" class="btn-primary" style="background: #3b82f6;">
                <i class="fa fa-download"></i> Update All Feeds
            </button>
            <button onclick="loadFeedsData()" class="btn-primary">
                <i class="fa fa-rotate"></i> Refresh
            </button>
        </div>
    </div>
    <div id="feeds-msg" style="margin-top: 15px; display: none; padding: 10px; border-radius: 6px;"></div>
</div>

<!-- Statistics -->
<div class="feeds-stats-grid">
    <div class="feeds-stat-card">
        <div class="feeds-stat-value" id="feeds-active">0</div>
        <div class="feeds-stat-label">Active Feeds</div>
    </div>
    <div class="feeds-stat-card">
        <div class="feeds-stat-value" id="feeds-total">0</div>
        <div class="feeds-stat-label">Available Feeds</div>
    </div>
    <div class="feeds-stat-card">
        <div class="feeds-stat-value" style="color: #ef4444;" id="feeds-ips">0</div>
        <div class="feeds-stat-label">Total Blocked IPs</div>
    </div>
    <div class="feeds-stat-card">
        <div class="feeds-stat-value" style="color: #3b82f6;" id="feeds-last-update">-</div>
        <div class="feeds-stat-label">Last Update</div>
    </div>
</div>

<!-- Activity Log -->
<div class="card" id="feeds-log-card" style="margin-bottom: 20px; display: none;">
    <h3><i class="fa fa-terminal"></i> Activity Log</h3>
    <div id="feeds-log" style="background: #1a1a2e; color: #0f0; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;">
    </div>
</div>

<!-- Feeds Grid -->
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3><i class="fa fa-shield-halved"></i> Threat Intelligence Feeds</h3>
        <input type="text" id="feeds-search" placeholder="Search feeds..." onkeyup="filterFeeds()"
               style="padding: 8px 15px; border: 1px solid var(--border); border-radius: 6px; width: 250px; background: var(--bg); color: var(--text);">
    </div>
    <div id="feeds-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
        <p class="text-center text-muted">Loading feeds...</p>
    </div>
</div>

<script>
// Load feeds data
async function loadFeedsData() {
    try {
        const response = await apiRequest('/feeds');
        let data = response;
        if (data.data) data = data.data;
        if (data.data) data = data.data;

        const feeds = data.feeds || [];
        const totalIPs = data.total_ips || 0;

        // Update stats
        const activeFeeds = feeds.filter(f => f.enabled).length;
        document.getElementById('feeds-active').textContent = activeFeeds;
        document.getElementById('feeds-total').textContent = feeds.length;
        document.getElementById('feeds-ips').textContent = formatNumber(totalIPs);

        // Update status
        const statusEl = document.getElementById('feeds-status');
        if (feeds.length > 0) {
            statusEl.textContent = 'ACTIVE';
            statusEl.style.background = '#22c55e';
        } else {
            statusEl.textContent = 'NO FEEDS';
            statusEl.style.background = '#f59e0b';
        }

        // Find last update
        let lastUpdate = null;
        feeds.forEach(f => {
            if (f.last_update && (!lastUpdate || f.last_update > lastUpdate)) {
                lastUpdate = f.last_update;
            }
        });
        document.getElementById('feeds-last-update').textContent = lastUpdate ? lastUpdate.split(' ')[0] : '-';

        renderFeeds(feeds);
    } catch (err) {
        console.error('[FEEDS] Error:', err);
        document.getElementById('feeds-grid').innerHTML = '<p class="text-center text-danger">Failed to load feeds</p>';
    }
}

function renderFeeds(feeds) {
    const container = document.getElementById('feeds-grid');

    if (feeds.length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No feeds configured. Run "nftban feeds enable" to add feeds.</p>';
        return;
    }

    let html = '';
    feeds.forEach(feed => {
        const isEnabled = feed.enabled === true;
        const ipCount = feed.ip_count || 0;
        const lastUpdate = feed.last_update || 'Never';
        const feedId = feed.id || feed.name.toLowerCase().replace(/\s+/g, '_');

        html += `
        <div class="feed-card ${isEnabled ? 'enabled' : 'disabled'}" data-name="${feed.name.toLowerCase()}">
            <div class="feed-header">
                <span class="feed-name">
                    <i class="fa fa-rss" style="margin-right: 8px; color: ${isEnabled ? '#22c55e' : '#6b7280'};"></i>
                    ${feed.name}
                </span>
                <label class="toggle-switch">
                    <input type="checkbox" ${isEnabled ? 'checked' : ''}
                           onchange="toggleFeed('${feedId}', this.checked)"
                           data-feed="${feedId}">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="feed-stats">
                <span><i class="fa fa-list-ol"></i> ${formatNumber(ipCount)} IPs</span>
                <span><i class="fa fa-clock"></i> ${lastUpdate}</span>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toString();
}

function filterFeeds() {
    const search = document.getElementById('feeds-search').value.toLowerCase();
    const cards = document.querySelectorAll('.feed-card');
    cards.forEach(card => {
        const name = card.getAttribute('data-name') || '';
        card.style.display = name.includes(search) ? '' : 'none';
    });
}

function logMsg(msg, type = 'info') {
    const logCard = document.getElementById('feeds-log-card');
    const logEl = document.getElementById('feeds-log');
    logCard.style.display = 'block';
    const time = new Date().toLocaleTimeString();
    const color = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#0f0';
    logEl.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}

async function toggleFeed(feedId, enable) {
    const action = enable ? 'enable' : 'disable';
    const feedName = feedId.toUpperCase();

    logMsg(`${action === 'enable' ? 'Enabling' : 'Disabling'} feed: ${feedName}...`);

    try {
        const response = await apiRequest('/feeds/control', {
            method: 'POST',
            body: JSON.stringify({ action: action, feed: feedId })
        });

        if (response.success) {
            logMsg(`✓ Feed ${feedName} ${action}d successfully`, 'success');
            if (enable) {
                logMsg(`Downloading IP list for ${feedName}...`);
            }
            setTimeout(() => {
                loadFeedsData();
                logMsg(`✓ Stats updated`, 'success');
            }, 1500);
        } else {
            logMsg(`✗ Failed: ${response.error || 'Unknown error'}`, 'error');
            const toggle = document.querySelector(`input[data-feed="${feedId}"]`);
            if (toggle) toggle.checked = !enable;
        }
    } catch (err) {
        logMsg(`✗ Error: ${err.message}`, 'error');
        const toggle = document.querySelector(`input[data-feed="${feedId}"]`);
        if (toggle) toggle.checked = !enable;
    }
}

async function updateAllFeeds() {
    logMsg('Updating all enabled feeds...');
    logMsg('This may take a moment, please wait...');

    try {
        const response = await apiRequest('/sync-feeds', { method: 'POST' });

        if (response.success) {
            logMsg('✓ All feeds updated successfully', 'success');
            setTimeout(() => {
                loadFeedsData();
                logMsg('✓ Stats refreshed', 'success');
            }, 1500);
        } else {
            logMsg(`✗ Failed: ${response.error || 'Unknown error'}`, 'error');
        }
    } catch (err) {
        logMsg(`✗ Error: ${err.message}`, 'error');
    }
}

// Initialize
loadFeedsData();

// Auto-refresh every 60 seconds
setInterval(loadFeedsData, 60000);
</script>
