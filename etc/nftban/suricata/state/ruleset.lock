# nftban Suricata Ruleset Lock File
# =================================
# This file pins ruleset versions and stores checksums for integrity verification.
# It is automatically updated by nftban when rules are downloaded or modified.
#
# Format: YAML
# 
# When a ruleset update is performed:
#   1. Current state is backed up to last-good/
#   2. New rules are downloaded and validated
#   3. This lock file is updated with new version/checksums
#   4. If validation fails, rollback from last-good/ is performed
#
# Manual edits to this file are not recommended.
# Use 'nftban suricata update' to modify ruleset versions.

version: "1.0"
last_update: null  # ISO 8601 timestamp of last successful update

# Ruleset source configuration
sources:
  # ET Open rules (Emerging Threats)
  et-open:
    enabled: true
    version: null      # Pinned version (null = latest)
    checksum: null     # SHA256 of downloaded archive
    url: "https://rules.emergingthreats.net/open/suricata-%SURICATA_VERSION%/emerging.rules.tar.gz"
    
  # Abuse.ch SSL blocklist
  abuse-ssl:
    enabled: false
    version: null
    checksum: null
    url: "https://sslbl.abuse.ch/blacklist/sslblacklist.rules"

  # Abuse.ch botnet C2
  abuse-botnet:
    enabled: false
    version: null
    checksum: null
    url: "https://feodotracker.abuse.ch/downloads/feodo.rules"

# Local rule file checksums (for detecting manual modifications)
local_checksums:
  local.rules: null
  disable.conf: null
  enable.conf: null
  categories.enabled: null

# Rollback information
rollback:
  available: false
  timestamp: null
  reason: null
