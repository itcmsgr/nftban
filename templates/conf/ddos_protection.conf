# NFTBan DDoS Protection Configuration Template
# Version: init 1.0
# Template Name: ddos_protection.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
# =============================================================================
#
# ⚠️  CRITICAL WARNING - READ BEFORE ENABLING ANY FEATURE ⚠️
#
# DDoS protection features can BLOCK LEGITIMATE TRAFFIC if misconfigured!
# All features are DISABLED by default for safety.
#
# BEFORE ENABLING ANY FEATURE:
# 1. Understand what the feature does and how it affects your traffic
# 2. Test in a non-production environment first
# 3. Monitor logs closely after enabling
# 4. Be prepared to disable immediately if issues occur
# 5. Have console/VNC access ready in case of lockout
#
# COMMON MISTAKES TO AVOID:
# - Enabling connection limits too low → blocks legitimate users
# - Enabling rate limits without understanding traffic patterns → service disruption
# - Enabling UDP flood protection on DNS/NTP servers → breaks services
# - Enabling all features at once → hard to troubleshoot issues
#
# RECOMMENDED APPROACH:
# - Enable ONE feature at a time
# - Monitor for 24-48 hours before enabling next feature
# - Start with conservative (high) limits, then gradually tighten
# - Always whitelist your own IP before testing
#
# =============================================================================

# =============================================================================
# MASTER SWITCH - GLOBAL DDOS PROTECTION
# =============================================================================
# ⚠️  WARNING: This controls ALL DDoS protection features below
# When set to "0", ALL DDoS protection is disabled (SAFE DEFAULT)
# When set to "1", individual features below become active based on their settings
#
# Recommended: Keep at "0" until you understand and configure each feature
# =============================================================================

# Enable/disable all DDoS protection features (master switch)
# "0" = ALL DDoS protection DISABLED (SAFE)
# "1" = Enable individual features (configured below)
DDOS_PROTECTION_ENABLED="0"

# Log all DDoS protection actions
# "1" = Log actions (recommended when testing)
# "0" = No logging (reduces log size)
DDOS_LOGGING_ENABLED="1"

# Send email alerts for DDoS attacks
# "1" = Send alerts (can be noisy during attack)
# "0" = No email alerts
DDOS_EMAIL_ALERTS="0"

# =============================================================================
# SYN FLOOD PROTECTION
# =============================================================================
# ⚠️  WARNING: SYN flood protection affects ALL new TCP connections!
#
# What it does:
# - Limits the rate of new TCP connection attempts (SYN packets)
# - Protects against TCP SYN flood attacks
#
# When to enable:
# - You are currently under SYN flood attack
# - You have evidence of SYN flooding in network stats
#
# Side effects when enabled:
# - Legitimate users may experience connection delays during traffic spikes
# - May slow down page loads for high-traffic websites
# - Can impact load balancers and CDNs
#
# Testing:
# 1. Enable with high limits first: SYNFLOOD_RATE="500/second"
# 2. Monitor: watch -n1 'nft list ruleset | grep -A5 syn'
# 3. Check logs: tail -f /var/log/nftban/ddos.log
# 4. Gradually decrease if attack continues
#
# Recommended: DISABLED unless under active attack
# =============================================================================

# Enable/disable SYN flood protection
# "0" = DISABLED (SAFE DEFAULT - recommended)
# "1" = ENABLED (use only during active SYN flood attack)
SYNFLOOD_ENABLE="0"

# Rate limit for SYN packets (format: X/time_unit)
# Time units: second, minute, hour, day
# Conservative (safe): "500/second" - allows high burst traffic
# Normal: "100/second" - good for most servers
# Aggressive: "50/second" - use only during severe attack
SYNFLOOD_RATE="100/second"

# Burst allowance before rate limiting kicks in
# Conservative: "500" - allows legitimate traffic bursts
# Normal: "150" - balanced protection
# Aggressive: "50" - strict limiting
SYNFLOOD_BURST="150"

# Log dropped SYN flood packets
# "1" = Log (shows attack patterns, increases log size)
# "0" = Silent drop (cleaner logs)
SYNFLOOD_LOG="1"

# =============================================================================
# CONNECTION LIMIT PROTECTION
# =============================================================================
# ⚠️  WARNING: Connection limits can block legitimate users!
#
# What it does:
# - Limits concurrent connections per IP address to specific ports
# - Prevents connection exhaustion attacks
#
# When to enable:
# - You see connection exhaustion in server stats
# - Single IPs holding many connections
# - Server running out of available connections
#
# Side effects when enabled:
# - Users behind NAT/proxy may hit limits (entire office shares one IP)
# - Mobile users switching networks may hit limits
# - Legitimate bots/crawlers may be blocked
#
# Special considerations:
# - Corporate networks: Many users share one IP (use higher limits)
# - CDNs (Cloudflare, etc.): Connections come from CDN IPs (whitelist CDN)
# - Load balancers: All traffic from LB IP (whitelist LB)
#
# Testing:
# 1. Start with VERY HIGH limits (2x-3x normal usage)
# 2. Monitor actual connection counts: netstat -an | grep ESTABLISHED | wc -l
# 3. Check for blocked IPs: grep CONNLIMIT /var/log/nftban/ddos.log
# 4. Gradually decrease limits if needed
#
# Recommended: DISABLED by default - enable per-service only if needed
# =============================================================================

# Enable/disable connection limit protection
# "0" = DISABLED (SAFE DEFAULT - recommended)
# "1" = ENABLED (use with caution)
CONNLIMIT_ENABLE="0"

# SSH connection limit per IP address
# Conservative: "10" - allows multiple terminal sessions
# Normal: "5" - good for most users
# Strict: "3" - single user with reconnections
# "0" = No limit (DISABLED for this service)
CONNLIMIT_SSH="0"

# HTTP connection limit per IP address
# Conservative: "100" - allows many browser tabs/resources
# Normal: "50" - good for most websites
# Strict: "20" - small sites with low traffic
# "0" = No limit (DISABLED for this service)
CONNLIMIT_HTTP="0"

# HTTPS connection limit per IP address
# Same guidelines as HTTP
# "0" = No limit (DISABLED for this service)
CONNLIMIT_HTTPS="0"

# FTP connection limit per IP address
# Conservative: "10" - allows multiple file transfers
# Normal: "5" - single user session
# Strict: "3" - minimal
# "0" = No limit (DISABLED for this service)
CONNLIMIT_FTP="0"

# SMTP connection limit per IP address
# Conservative: "20" - allows mail servers with multiple workers
# Normal: "10" - good for most mail servers
# Strict: "5" - small mail servers
# "0" = No limit (DISABLED for this service)
CONNLIMIT_SMTP="0"

# POP3 connection limit per IP address
# Conservative: "10"
# Normal: "5"
# Strict: "3"
# "0" = No limit (DISABLED for this service)
CONNLIMIT_POP3="0"

# IMAP connection limit per IP address
# Conservative: "10"
# Normal: "5"
# Strict: "3"
# "0" = No limit (DISABLED for this service)
CONNLIMIT_IMAP="0"

# MySQL/MariaDB connection limit per IP address
# Conservative: "50" - allows connection pooling
# Normal: "20" - good for most applications
# Strict: "10" - small applications
# "0" = No limit (DISABLED for this service)
CONNLIMIT_MYSQL="0"

# PostgreSQL connection limit per IP address
# Same guidelines as MySQL
# "0" = No limit (DISABLED for this service)
CONNLIMIT_POSTGRESQL="0"

# Custom connection limits for additional ports
# Format: "port;limit,port;limit,..."
# Example: "8080;30,9000;15"
# Empty = No custom limits (SAFE DEFAULT)
CONNLIMIT_CUSTOM=""

# Log connection limit violations
# "1" = Log (helps identify false positives)
# "0" = Silent reject
CONNLIMIT_LOG="1"

# Action when connection limit exceeded
# "reject" = Send TCP RST (recommended - frees resources immediately)
# "drop" = Silent drop (hides firewall, but ties up resources)
CONNLIMIT_ACTION="reject"

# =============================================================================
# PORT FLOOD PROTECTION (Rate Limiting)
# =============================================================================
# ⚠️  WARNING: Rate limits can block legitimate traffic spikes!
#
# What it does:
# - Limits NEW connection attempts per time period
# - Different from connection limits (which count concurrent connections)
#
# When to enable:
# - You see rapid connection attempts in logs
# - Evidence of brute force attacks
# - Slowloris attacks detected
#
# Side effects when enabled:
# - Legitimate traffic spikes blocked (e.g., newsletter link clicked by many users)
# - API clients may hit limits
# - Monitoring systems making frequent checks may be blocked
#
# Special considerations:
# - APIs: May need higher limits or whitelist API clients
# - High-traffic sites: Start with very high limits
# - Brute force protection: SSH rate limiting is effective
#
# Testing:
# 1. Enable ONLY for services under attack
# 2. Start with generous limits
# 3. Monitor: grep PORTFLOOD /var/log/nftban/ddos.log
# 4. Tighten only if attack continues
#
# Recommended: DISABLED by default - enable per-service during attacks
# =============================================================================

# Enable/disable port flood protection
# "0" = DISABLED (SAFE DEFAULT - recommended)
# "1" = ENABLED (use with caution)
PORTFLOOD_ENABLE="0"

# SSH port flood protection
# Format: "max_connections/time_in_seconds"
# Conservative: "10/300" - 10 attempts per 5 minutes
# Normal: "5/300" - 5 attempts per 5 minutes (anti-brute-force)
# Strict: "3/600" - 3 attempts per 10 minutes
# "0" = No limit (DISABLED for SSH)
PORTFLOOD_SSH="0"

# HTTP port flood protection
# Format: "max_connections/time_in_seconds"
# Conservative: "100/10" - 100 connections per 10 seconds
# Normal: "50/10" - 50 connections per 10 seconds
# Strict: "20/5" - 20 connections per 5 seconds
# "0" = No limit (DISABLED for HTTP)
PORTFLOOD_HTTP="0"

# HTTPS port flood protection
# Same guidelines as HTTP
# "0" = No limit (DISABLED for HTTPS)
PORTFLOOD_HTTPS="0"

# FTP port flood protection
# Format: "max_connections/time_in_seconds"
# Conservative: "20/60" - 20 attempts per minute
# Normal: "10/60" - 10 attempts per minute
# Strict: "5/60" - 5 attempts per minute
# "0" = No limit (DISABLED for FTP)
PORTFLOOD_FTP="0"

# SMTP port flood protection
# Format: "max_connections/time_in_seconds"
# Conservative: "10/300" - 10 attempts per 5 minutes
# Normal: "5/300" - 5 attempts per 5 minutes (anti-spam)
# Strict: "3/300" - 3 attempts per 5 minutes
# "0" = No limit (DISABLED for SMTP)
PORTFLOOD_SMTP="0"

# Custom port flood limits for additional ports
# Format: "port;rate/time,port;rate/time,..."
# Example: "8080;30/10,9000;15/60"
# Empty = No custom limits (SAFE DEFAULT)
PORTFLOOD_CUSTOM=""

# Log port flood violations
# "1" = Log (shows attack patterns)
# "0" = Silent drop
PORTFLOOD_LOG="1"

# =============================================================================
# ICMP FLOOD PROTECTION (Ping Flood)
# =============================================================================
# ⚠️  WARNING: ICMP rate limiting can break monitoring!
#
# What it does:
# - Limits ICMP echo requests (ping) per second
# - Prevents ping flood attacks
#
# When to enable:
# - You see ICMP flood in network stats
# - Bandwidth saturation from ICMP traffic
#
# Side effects when enabled:
# - External monitoring (uptime robots) may fail
# - Network diagnostic tools may not work properly
# - Traceroute may be affected
#
# Special considerations:
# - Monitoring services: Whitelist monitoring IPs first
# - Network diagnostics: May need to temporarily disable
# - ICMP is low bandwidth: Usually not a priority to block
#
# Testing:
# 1. Check if uptime monitoring works: curl https://uptime-robot-ip
# 2. Whitelist monitoring IPs before enabling
# 3. Test ping: ping -c10 your-server-ip
#
# Recommended: DISABLED by default - low priority threat
# =============================================================================

# Enable/disable ICMP rate limiting
# "0" = DISABLED (SAFE DEFAULT - recommended)
# "1" = ENABLED (may break monitoring)
ICMP_RATELIMIT_ENABLE="0"

# Incoming ICMP echo request (ping) rate limit
# Format: "X/time_unit" (second, minute, hour, day)
# Conservative: "10/second" - allows monitoring
# Normal: "5/second" - balanced
# Strict: "1/second" - tight limiting
# "0" = No limit (DISABLED)
ICMP_IN_RATE="0"

# Outgoing ICMP echo request rate limit
# Usually not needed unless preventing abuse from local users
# "0" = No limit (DISABLED - recommended)
ICMP_OUT_RATE="0"

# Drop ICMP timestamp requests (type 13)
# "1" = Drop (required for PCI compliance)
# "0" = Allow (SAFE DEFAULT)
ICMP_TIMESTAMP_DROP="0"

# Drop ICMP address mask requests (type 17)
# "1" = Drop (good security practice)
# "0" = Allow
ICMP_ADDRESSMASK_DROP="0"

# Log ICMP rate limit violations
# "1" = Log (can be very noisy)
# "0" = Silent drop (RECOMMENDED)
ICMP_LOG="0"

# =============================================================================
# UDP FLOOD PROTECTION
# =============================================================================
# ⚠️  DANGER: UDP flood protection can break critical services!
#
# What it does:
# - Limits outbound UDP packet rate
# - Prevents UDP flood attacks from compromised server
#
# When to enable:
# - Your server is sending massive UDP floods (compromised)
# - You detect malicious scripts sending UDP
#
# Side effects when enabled:
# - DNS resolution may break (if running DNS server)
# - NTP time sync may fail (if running NTP server)
# - SNMP monitoring breaks (if running SNMP)
# - VoIP/gaming servers unusable
#
# ⚠️  CRITICAL: DO NOT ENABLE if you run:
# - DNS server (named, bind, unbound)
# - NTP server (ntpd, chronyd)
# - SNMP monitoring (snmpd)
# - Game servers (Minecraft, etc.)
# - VoIP servers (Asterisk, FreeSWITCH)
# - VPN servers (OpenVPN, WireGuard)
#
# Testing (ONLY if you don't run UDP services):
# 1. Verify no DNS server: systemctl status named bind9 unbound
# 2. Verify no NTP server: systemctl status ntpd chronyd
# 3. Enable with very high limits
# 4. Test DNS: dig @8.8.8.8 google.com
# 5. Monitor: grep UDPFLOOD /var/log/nftban/ddos.log
#
# Recommended: DISABLED (too dangerous for most servers)
# =============================================================================

# Enable/disable UDP flood protection
# "0" = DISABLED (SAFE DEFAULT - strongly recommended)
# "1" = ENABLED (DANGER - breaks DNS/NTP/SNMP/VPN)
UDPFLOOD_ENABLE="0"

# UDP packet rate limit
# Format: "X/time_unit"
# Conservative: "1000/second" - allows UDP services
# Normal: "100/second" - may break services
# Strict: "50/second" - definitely breaks services
UDPFLOOD_RATE="100/second"

# UDP burst allowance
# Conservative: "5000" - allows traffic spikes
# Normal: "500"
# Strict: "100"
UDPFLOOD_BURST="500"

# Usernames/services to exclude from UDP flood protection
# Comma-separated list - these are NEVER rate limited
# Common: "named,ntpd,snmpd,chronyd,unbound"
# Note: root (UID 0) is always excluded
UDPFLOOD_ALLOWUSER="named,ntpd,chronyd,snmpd"

# Log UDP flood violations
# "1" = Log (helps diagnose service breakage)
# "0" = Silent drop
UDPFLOOD_LOG="1"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================
# ⚠️  WARNING: Only change these if you understand nftables internals

# Minimum time between DDoS rule updates (seconds)
# Prevents rapid rule changes that could impact performance
# Recommended: 60 seconds (do not change unless necessary)
DDOS_UPDATE_INTERVAL="60"

# Maximum entries in DDoS tracking tables
# Limits memory usage for connection tracking
# Too low: Legitimate connections dropped
# Too high: Excessive memory usage
# Recommended: 65536 (good for most systems)
# High traffic: 131072
DDOS_MAX_ENTRIES="65536"

# Enable experimental DDoS features
# "0" = DISABLED (SAFE - recommended for production)
# "1" = ENABLED (testing only, may be unstable)
DDOS_EXPERIMENTAL="0"

# =============================================================================
# QUICK START GUIDE
# =============================================================================
#
# SCENARIO 1: Under SSH brute force attack
# ----------------------------------------
# 1. Set: DDOS_PROTECTION_ENABLED="1"
# 2. Set: PORTFLOOD_ENABLE="1"
# 3. Set: PORTFLOOD_SSH="5/300"
# 4. Reload: nftban ddos reload
# 5. Monitor: tail -f /var/log/nftban/ddos.log
#
# SCENARIO 2: Under SYN flood attack
# ----------------------------------
# 1. Whitelist your IP: nftban whitelist add YOUR_IP
# 2. Set: DDOS_PROTECTION_ENABLED="1"
# 3. Set: SYNFLOOD_ENABLE="1"
# 4. Set: SYNFLOOD_RATE="500/second" (start high)
# 5. Reload: nftban ddos reload
# 6. Monitor: watch -n1 'nft list ruleset | grep syn'
# 7. Gradually decrease rate if attack continues
#
# SCENARIO 3: Connection exhaustion
# ---------------------------------
# 1. Check current connections: netstat -an | grep ESTABLISHED | wc -l
# 2. Set: DDOS_PROTECTION_ENABLED="1"
# 3. Set: CONNLIMIT_ENABLE="1"
# 4. Set limits PER SERVICE (start at 2x normal usage)
# 5. Example: CONNLIMIT_HTTP="100" (if normal is 50)
# 6. Reload: nftban ddos reload
# 7. Monitor: grep CONNLIMIT /var/log/nftban/ddos.log
# 8. Decrease limits gradually
#
# SCENARIO 4: Disable all DDoS protection (emergency)
# ---------------------------------------------------
# 1. Set: DDOS_PROTECTION_ENABLED="0"
# 2. Reload: nftban ddos reload
# 3. Everything disabled immediately
#
# =============================================================================
# SUPPORT AND TROUBLESHOOTING
# =============================================================================
#
# If you experience issues after enabling DDoS protection:
#
# 1. IMMEDIATE: Disable master switch
#    DDOS_PROTECTION_ENABLED="0"
#    nftban ddos reload
#
# 2. Check logs:
#    tail -f /var/log/nftban/ddos.log
#    grep -i ddos /var/log/nftban/nftban.log
#
# 3. Check which IPs are being blocked:
#    nftban ddos status
#    nftban ddos stats
#
# 4. Whitelist legitimate IPs:
#    nftban whitelist add IP_ADDRESS "reason"
#
# 5. Test one feature at a time:
#    Enable ONLY ONE feature, monitor for 24 hours
#
# 6. Contact support:
#    Email: contact@itcms.gr
#    Include: logs, configuration, symptoms
#
# =============================================================================
# END OF CONFIGURATION
# =============================================================================
