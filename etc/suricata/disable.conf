# =============================================================================
# Suricata Rule Disable Configuration - NFTBan Optimized (DEFAULT)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Disable unnecessary rules to reduce CPU/RAM and noise
# Location: /etc/suricata/disable.conf
#
# ⚠️  DO NOT EDIT THIS FILE - Your changes will be overwritten on updates!
# ✅  Create /etc/suricata/disable.conf.local for custom additions
#
# Format: re:<pattern>  or  gid:X,sid:Y
# Patterns are matched against rule files and rule metadata
#
# Usage: suricata-update --disable-conf /etc/suricata/disable.conf \
#                        --disable-conf /etc/suricata/disable.conf.local
# =============================================================================

# =============================================================================
# INFORMATIONAL & POLICY RULES (High Noise, Low Security Value)
# =============================================================================
# These rules generate alerts for normal behavior, not attacks
# Disabling saves CPU and reduces log noise

# Informational alerts (no security value)
re:ET INFO
re:SURICATA STREAM
re:INFO

# Policy enforcement (user behavior monitoring, not server security)
re:ET POLICY
re:POLICY

# User-Agent strings (noisy, not attack indicators)
re:User-Agent


# =============================================================================
# WINDOWS-SPECIFIC PROTOCOLS (NOT NEEDED on Linux Servers)
# =============================================================================
# Disabling these saves significant CPU/RAM on Linux-only environments

# SMB/CIFS (Windows file sharing)
re:SMB
re:CIFS
re:NETBIOS
re:NetBIOS

# Windows RPC
re:DCE.*RPC
re:DCERPC
re:MSRPC

# Remote Desktop Protocol
re:RDP
re:Remote.*Desktop

# Windows-specific exploits
re:MS0
re:Microsoft.*Windows.*Attack


# =============================================================================
# DATABASE PROTOCOLS (Disable if Not Running DB Servers)
# =============================================================================
# Uncomment if you DON'T run database servers
# Comment out the ones you DO use

re:MYSQL
re:MySQL
re:MariaDB
re:MSSQL
re:MS SQL
re:PostgreSQL
re:Oracle
re:MongoDB
re:Redis
re:Cassandra


# =============================================================================
# VOIP & TELEPHONY (Disable if Not Running VoIP)
# =============================================================================
# SIP, RTP, telephony protocols - not needed for web/mail servers

re:SIP
re:VOIP
re:VoIP
re:RTP
re:H323
re:Asterisk
re:telephony


# =============================================================================
# INDUSTRIAL PROTOCOLS (SCADA/ICS - NOT NEEDED for Standard Servers)
# =============================================================================
# These are for industrial control systems, power plants, etc.

re:SCADA
re:ICS
re:MODBUS
re:DNP3
re:S7
re:BACnet
re:ENIP
re:Ethernet/IP


# =============================================================================
# CHAT, P2P, GAMING (NOT NEEDED for Servers)
# =============================================================================
# These are for monitoring user activity on corporate networks

# Chat & Instant Messaging
re:CHAT
re:IRC
re:XMPP
re:Jabber
re:Skype
re:Telegram
re:WhatsApp

# Peer-to-Peer File Sharing
re:P2P
re:BitTorrent
re:eDonkey
re:Gnutella
re:Kazaa

# Gaming Platforms
re:Steam
re:Xbox
re:PlayStation
re:Battle.net


# =============================================================================
# DNS INFORMATIONAL RULES (Optional - Can Be Noisy)
# =============================================================================
# DNS query logging generates massive logs
# Keep DNS *attack* detection, disable informational DNS queries
# UNCOMMENT if you want to disable DNS noise:

# re:ET DNS query
# re:DNS query for


# =============================================================================
# NOISY SCANNING RULES (Optional - If Too Many Alerts)
# =============================================================================
# Port scans from the internet are common
# If you get too many scan alerts, uncomment these:

# Internal network Nmap scans (common in legitimate scanning)
re:ET SCAN Nmap Scripting Engine
re:ET SCAN Possible Nmap User-Agent

# Generic port scan alerts (if overwhelming)
# re:ET SCAN
# re:port scan


# =============================================================================
# TLS/SSL DEEP INSPECTION (CPU-Heavy - Disable if Not Needed)
# =============================================================================
# TLS certificate validation and deep inspection uses CPU
# Basic TLS monitoring is still active via app-layer
# UNCOMMENT to disable deep TLS rule matching:

# re:TLS
# re:SSL
# re:certificate


# =============================================================================
# STREAMING MEDIA (NOT NEEDED for Servers)
# =============================================================================
re:streaming
re:YouTube
re:Netflix
re:Spotify
re:media.*stream


# =============================================================================
# CLOUD SERVICE DETECTION (Usually Informational)
# =============================================================================
# Detecting connections to cloud services (AWS, GCP, Azure, etc.)
# UNCOMMENT if too noisy:

# re:Amazon
# re:AWS
# re:Google Cloud
# re:Azure
# re:Dropbox


# =============================================================================
# CRYPTOCURRENCY (Optional)
# =============================================================================
# Disable if you don't care about crypto traffic detection
# KEEP cryptominer detection enabled (it's in enable.conf)
# This only disables legitimate crypto traffic alerts:

re:Bitcoin.*wallet
re:Ethereum.*wallet
re:cryptocurrency.*exchange


# =============================================================================
# PROTOCOL-SPECIFIC OPTIMIZATIONS
# =============================================================================

# HTTP noise reduction (comment-out to keep)
# re:ET WEB_SPECIFIC_APPS Google
# re:ET WEB_SPECIFIC_APPS Facebook

# FTP informational (if you don't run FTP)
# Already handled by not enabling FTP in enable.conf

# TFTP (Trivial FTP - rarely used)
re:TFTP
re:Trivial


# =============================================================================
# NOTES FOR MAIL & FTP SERVERS
# =============================================================================
# If you run mail or FTP servers, you need to COMMENT OUT the disable lines
# OR simply don't enable them in enable.conf
#
# For mail servers: DON'T disable SMTP/IMAP/POP3 here
# For FTP servers: DON'T disable FTP here
# =============================================================================


# =============================================================================
# ADVANCED: DISABLE SPECIFIC RULE SIDS
# =============================================================================
# If specific rules cause false positives, disable by SID:
# Example:
# 2001219  # ET SCAN SSH BruteForce Tool (if you use legit SSH scanners)


# =============================================================================
# TESTING & VALIDATION
# =============================================================================
# After editing this file:
#   1. Update rules:
#      suricata-update --enable-conf /etc/suricata/enable.conf \
#                      --disable-conf /etc/suricata/disable.conf
#
#   2. Test config:
#      suricata -T -c /etc/suricata/suricata.yaml
#
#   3. Check how many rules are loaded:
#      grep "rule reload complete" /var/log/suricata/suricata.log
#
#   4. Restart Suricata:
#      systemctl restart suricata
#
#   5. Monitor resource usage:
#      systemd-cgtop | grep suricata
#      ps aux | grep suricata
# =============================================================================
