# =============================================================================
# NFTBan Distribution Configuration - CentOS Stream 10
# =============================================================================

[distro]
id = centos
name = CentOS Stream
version = 10
family = rhel
version_codename = stream10

[package_manager]
type = dnf
install_cmd = dnf install -y
update_cmd = dnf update -y
upgrade_cmd = dnf upgrade -y
search_cmd = dnf search
info_cmd = dnf info

[packages]
victoriametrics = victoriametrics
nftables = nftables
curl = curl
iproute = iproute
bash = bash
systemd = systemd
suricata = suricata
suricata_update = suricata-update
mail = s-nail
golang = golang
golang_min_version = 1.21
jq = jq
wget = wget
git = git
prometheus = golang-github-prometheus
node_exporter = golang-github-prometheus-node-exporter

[services]
cron = crond
rsyslog = rsyslog
suricata = suricata
suricata_update = suricata-update
nftables = nftables
sshd = sshd
sshd_session = sshd-session
polkit = polkit
prometheus = prometheus
node_exporter = prometheus-node-exporter

[paths]
nft = /usr/sbin/nft
mail = /usr/bin/mail
systemctl = /usr/bin/systemctl
cron_d = /etc/cron.d
systemd_system = /usr/lib/systemd/system
suricata = /usr/sbin/suricata
suricatasc = /usr/bin/suricatasc
suricata_conf = /etc/suricata
suricata_yaml = /etc/suricata/suricata.yaml
suricata_eve_log = /var/log/nftban/suricata/eve.json
suricata_log_dir = /var/log/nftban/suricata
suricata_rules_dir = /var/lib/suricata/rules

[repository]
epel_required = true
epel_package = epel-release
epel_install_cmd = dnf install -y epel-release

[features]
systemd_support = true
firewalld_default = true
selinux_default = enforcing
