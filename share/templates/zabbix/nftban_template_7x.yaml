zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4675ab6fcf4848498b422688a63c3539
      name: 'Templates/Security'

  templates:
    - uuid: caa4388471284b988b0777dbc45b58ae
      template: 'NFTBan'
      name: 'NFTBan Firewall'
      description: |
        NFTBan monitoring template for Zabbix 7.x

        Monitors:
        - Daemon status, version, uptime
        - Ban statistics (total, 24h, rate, throughput)
        - Runtime metrics (heap, GC, goroutines) via IPC
        - IPC statistics (requests, latency, errors)
        - Network connections (active, established, wait states)
        - System metrics (memory%, iowait%, disk%)
        - Module status per enabled module
        - Feed status and IP counts
        - GeoIP statistics
        - nftables rule/packet counts
        - Full server inventory (OS, IPs, hardware)

        Smart Update Intervals:
        - Critical (30s): daemon status
        - Dynamic (1m): bans, memory, load
        - Semi-static (5m): runtime, IPC
        - Inventory (1h): OS, IPs, hardware

        Requirements:
        - NFTBan v1.4.0+
        - Zabbix 7.x with Trapper support

        Documentation: https://nftban.com/docs/zabbix
      vendor:
        name: NFTBan
        version: '1.4.0'
      groups:
        - name: 'Templates/Security'

      # =======================================================================
      # MACROS
      # =======================================================================
      macros:
        - macro: '{$NFTBAN.BAN.RATE.WARN}'
          value: '100'
          description: 'Ban rate per minute warning threshold'
        - macro: '{$NFTBAN.BAN.RATE.HIGH}'
          value: '500'
          description: 'Ban rate per minute high threshold'
        - macro: '{$NFTBAN.MEMORY.WARN}'
          value: '524288000'
          description: 'Memory warning threshold (500MB)'
        - macro: '{$NFTBAN.MEMORY.HIGH}'
          value: '1073741824'
          description: 'Memory high threshold (1GB)'
        - macro: '{$NFTBAN.GEOIP.AGE.WARN}'
          value: '30'
          description: 'GeoIP database age warning (days)'
        - macro: '{$NFTBAN.UPDATE.INTERVAL}'
          value: '1m'
          description: 'Metric update interval'

      # =======================================================================
      # ITEMS - DAEMON INFO
      # =======================================================================
      items:
        # --- Daemon Status ---
        - uuid: 84d6ff78e2fe41fd99d6c157678ba889
          name: 'NFTBan: Daemon status'
          type: TRAP
          key: nftban.status
          value_type: UNSIGNED
          description: 'Daemon status: 1=running, 0=stopped'
          tags:
            - tag: component
              value: daemon
            - tag: scope
              value: availability
          triggers:
            - uuid: 27631da6d99e4d1d99bb65b01d799333
              expression: 'last(/NFTBan/nftban.status)=0'
              name: 'NFTBan daemon is down'
              priority: DISASTER
              description: 'NFTBan daemon is not running. Firewall protection may be compromised.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 25e7c989769f42168bf787cf047c4ff2
              expression: 'nodata(/NFTBan/nftban.status,5m)=1'
              name: 'NFTBan metrics not received for 5 minutes'
              priority: HIGH
              description: 'No metrics received from NFTBan exporter. Check if the Zabbix exporter is running and network connectivity.'
              tags:
                - tag: scope
                  value: availability
                - tag: component
                  value: metrics

        - uuid: 19c8f64c56724f99b5b8cb42c571e521
          name: 'NFTBan: Version'
          type: TRAP
          key: nftban.version
          value_type: CHAR
          description: 'NFTBan daemon version'
          tags:
            - tag: component
              value: daemon
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 328f9cae25ea48fabe6fe0a16d2e5808
          name: 'NFTBan: Uptime'
          type: TRAP
          key: nftban.uptime
          value_type: FLOAT
          units: s
          description: 'Daemon uptime in seconds'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: 0a19aab5a864425491f45a6e7733e81f
              expression: 'last(/NFTBan/nftban.uptime)<300'
              name: 'NFTBan daemon restarted recently'
              priority: INFO
              description: 'NFTBan daemon uptime is less than 5 minutes.'
              manual_close: 'YES'

        - uuid: 923f1f9c6dd4434fba3cd8db3e4f2789
          name: 'NFTBan: PID'
          type: TRAP
          key: nftban.pid
          value_type: UNSIGNED
          description: 'Daemon process ID'
          tags:
            - tag: component
              value: daemon

        - uuid: 8f337a2aa2a04482aecf1f5eb85c9129
          name: 'NFTBan: Operating mode'
          type: TRAP
          key: nftban.mode
          value_type: CHAR
          description: 'Operating mode: normal, degraded, survival'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: c4f4a427e6924341828dffcf333190f1
              expression: 'last(/NFTBan/nftban.mode)<>"normal" and length(last(/NFTBan/nftban.mode))>0'
              name: 'NFTBan in {ITEM.VALUE} mode'
              priority: WARNING
              description: 'NFTBan is running in degraded or survival mode due to resource pressure.'

        # --- Ban Statistics ---
        - uuid: 3ae9d60db1dc435198f7704abeebdf4f
          name: 'NFTBan: Active bans'
          type: TRAP
          key: nftban.active.count
          value_type: UNSIGNED
          description: 'Currently active ban count'
          tags:
            - tag: component
              value: bans

        - uuid: bae0a514bbd54143a61a68f0141073df
          name: 'NFTBan: Bans (24h)'
          type: TRAP
          key: nftban.bans.24h
          value_type: UNSIGNED
          description: 'Bans in last 24 hours'
          tags:
            - tag: component
              value: bans
          triggers:
            - uuid: 22bbe01a683f47d397e4760f0d27a918
              expression: 'last(/NFTBan/nftban.bans.24h)>1000'
              name: 'High ban rate (>{ITEM.VALUE}/24h)'
              priority: WARNING
              description: 'More than 1000 bans in the last 24 hours indicates increased attack activity.'
            - uuid: c306ff60960a42a887cc2fc98951e0d9
              expression: 'last(/NFTBan/nftban.bans.24h)>5000'
              name: 'Mass attack detected (>{ITEM.VALUE}/24h)'
              priority: HIGH
              description: 'More than 5000 bans in 24 hours suggests a coordinated attack.'

        - uuid: 88ac53e9d30a473f9b3fc4c6a614b378
          name: 'NFTBan: Bans (1h)'
          type: TRAP
          key: nftban.bans.1h
          value_type: UNSIGNED
          description: 'Bans in last hour'
          tags:
            - tag: component
              value: bans

        - uuid: 8253f7d299674800bb8ffc999dd563a0
          name: 'NFTBan: Ban rate'
          type: TRAP
          key: nftban.bans.rate
          value_type: FLOAT
          units: '/min'
          description: 'Current ban rate per minute'
          tags:
            - tag: component
              value: bans
          triggers:
            - uuid: f3f16cf5771b4e76ae6be554f69b237f
              expression: 'last(/NFTBan/nftban.bans.rate)>{$NFTBAN.BAN.RATE.WARN}'
              name: 'NFTBan ban rate warning ({ITEM.VALUE}/min)'
              priority: WARNING
              description: 'Ban rate exceeds warning threshold.'
            - uuid: 0118d4b7ffe243e8bf0b31baefad4a28
              expression: 'last(/NFTBan/nftban.bans.rate)>{$NFTBAN.BAN.RATE.HIGH}'
              name: 'NFTBan ban rate critical ({ITEM.VALUE}/min)'
              priority: HIGH
              description: 'Ban rate exceeds critical threshold - possible attack in progress.'

        - uuid: 733d7cf84b1c484faac9bda23573ae21
          name: 'NFTBan: Total bans'
          type: TRAP
          key: nftban.bans.total
          value_type: UNSIGNED
          description: 'Total bans since daemon start'
          tags:
            - tag: component
              value: bans

        - uuid: c09ac1273a12446c874a6dfd23bc77b3
          name: 'NFTBan: Permanent bans'
          type: TRAP
          key: nftban.permanent.count
          value_type: UNSIGNED
          description: 'Permanent ban count'
          tags:
            - tag: component
              value: bans

        - uuid: 6ea172c0a00c49e1bfd8358ce55d7579
          name: 'NFTBan: Whitelist count'
          type: TRAP
          key: nftban.whitelist.count
          value_type: UNSIGNED
          description: 'Whitelist entry count'
          tags:
            - tag: component
              value: bans

        # --- Memory Metrics ---
        - uuid: 63fe69b81c714fa1b693159affb4aa50
          name: 'NFTBan: Memory RSS'
          type: TRAP
          key: nftban.memory.rss
          value_type: UNSIGNED
          units: B
          description: 'Process resident set size'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 93578c2977f1490ea110e3c0d31c0251
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.WARN}'
              name: 'NFTBan memory usage high (>{ITEM.VALUE})'
              priority: WARNING
              description: 'NFTBan memory usage exceeds warning threshold.'
            - uuid: 1f7326cefbc647b5b49c5f0698dc0da6
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.HIGH}'
              name: 'NFTBan memory usage critical (>{ITEM.VALUE})'
              priority: HIGH
              description: 'NFTBan memory usage exceeds critical threshold.'

        - uuid: 235e38a7f29a41e5863b2f1ab5883c95
          name: 'NFTBan: Open file descriptors'
          type: TRAP
          key: nftban.fds.open
          value_type: UNSIGNED
          description: 'Open file descriptors'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: e277cf81f812493092c1673072fb1793
              expression: 'last(/NFTBan/nftban.fds.open)>1000'
              name: 'NFTBan open FDs > 1000'
              priority: WARNING
              description: 'High number of open file descriptors may indicate a leak.'

        - uuid: 616130360cd54df2b10084b5203ba1d6
          name: 'NFTBan: Goroutines'
          type: TRAP
          key: nftban.goroutines
          value_type: UNSIGNED
          description: 'Active goroutine count'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 4a8573370f2b4deebfa8a75119884dc7
              expression: 'last(/NFTBan/nftban.goroutines)>500'
              name: 'NFTBan goroutine count high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High goroutine count may indicate a leak or high load.'

        - uuid: de51817289a94ede8c16ca22c6fd1a3c
          name: 'NFTBan: Threads'
          type: TRAP
          key: nftban.threads
          value_type: UNSIGNED
          description: 'OS thread count'
          tags:
            - tag: component
              value: memory

        # --- Module Metrics ---
        - uuid: 905133410242405b8a929e40f0357ffe
          name: 'NFTBan: Modules enabled'
          type: TRAP
          key: nftban.modules.enabled
          value_type: UNSIGNED
          description: 'Number of enabled modules'
          tags:
            - tag: component
              value: modules

        - uuid: b95ca33b99ae475ea53528301254ba57
          name: 'NFTBan: Modules active'
          type: TRAP
          key: nftban.modules.active
          value_type: UNSIGNED
          description: 'Number of currently active modules'
          tags:
            - tag: component
              value: modules

        - uuid: 695e3d6f1f87434a9f3f44cccc878d77
          name: 'NFTBan: Modules failed'
          type: TRAP
          key: nftban.modules.failed
          value_type: UNSIGNED
          description: 'Number of failed modules'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 324e7dd2d0d24beb93aa818c72d3a86d
              expression: 'last(/NFTBan/nftban.modules.failed)>0'
              name: 'NFTBan module(s) failed ({ITEM.VALUE})'
              priority: HIGH
              description: 'One or more NFTBan modules have failed.'

        # --- nftables Metrics ---
        - uuid: 0a77d0b21da04e12a5d55a435bc3d6c1
          name: 'NFTBan: nftables sets'
          type: TRAP
          key: nftban.nft.sets_total
          value_type: UNSIGNED
          description: 'Total nftables sets'
          tags:
            - tag: component
              value: nftables

        - uuid: 48b8a404c0104abcb66c744f2bd0ff32
          name: 'NFTBan: nftables elements'
          type: TRAP
          key: nftban.nft.elements_total
          value_type: UNSIGNED
          description: 'Total set elements across all sets'
          tags:
            - tag: component
              value: nftables
          triggers:
            - uuid: 16bedb67a7544f4a9f677a9aa67c7bd4
              expression: 'last(/NFTBan/nftban.nft.elements_total)>100000'
              name: 'NFTBan large ruleset (>{ITEM.VALUE} elements)'
              priority: WARNING
              description: 'Large number of set elements may impact performance.'

        - uuid: 779de555f2234970a03896a608c60025
          name: 'NFTBan: nftables rules'
          type: TRAP
          key: nftban.nft.rules_total
          value_type: UNSIGNED
          description: 'Total nftables rules'
          tags:
            - tag: component
              value: nftables

        - uuid: 520a1c97281d4cd7868f3eafef6422f2
          name: 'NFTBan: Packets blocked (IPv4)'
          type: TRAP
          key: nftban.nft.packets_blocked_ipv4
          value_type: UNSIGNED
          description: 'Total packets blocked (IPv4)'
          tags:
            - tag: component
              value: nftables

        - uuid: a84e8635c81447f4af31ee3733f1afc1
          name: 'NFTBan: Packets blocked (IPv6)'
          type: TRAP
          key: nftban.nft.packets_blocked_ipv6
          value_type: UNSIGNED
          description: 'Total packets blocked (IPv6)'
          tags:
            - tag: component
              value: nftables

        # --- Feeds Metrics ---
        - uuid: 3103c2dc666e409e87b5ac0f4d1b505d
          name: 'NFTBan: Feeds enabled'
          type: TRAP
          key: nftban.feeds.enabled
          value_type: UNSIGNED
          description: 'Number of enabled threat feeds'
          tags:
            - tag: component
              value: feeds

        - uuid: 3714743fd16c45a48ef73be48a99dc05
          name: 'NFTBan: Feeds loaded'
          type: TRAP
          key: nftban.feeds.loaded
          value_type: UNSIGNED
          description: 'Number of successfully loaded feeds'
          tags:
            - tag: component
              value: feeds

        - uuid: c9f9b6db1fea4c1db3a03f5604ae569c
          name: 'NFTBan: Feeds failed'
          type: TRAP
          key: nftban.feeds.failed
          value_type: UNSIGNED
          description: 'Number of failed feed loads'
          tags:
            - tag: component
              value: feeds
          triggers:
            - uuid: 1dcdba9b59484fe6bb08d1a12b61a005
              expression: 'last(/NFTBan/nftban.feeds.failed)>0'
              name: 'NFTBan feed load failures ({ITEM.VALUE})'
              priority: WARNING
              description: 'One or more threat feeds failed to load.'

        - uuid: 666baed63dbe43ed9c076e6c04764800
          name: 'NFTBan: Feeds total IPs'
          type: TRAP
          key: nftban.feeds.ips_total
          value_type: UNSIGNED
          description: 'Total IPs from all feeds'
          tags:
            - tag: component
              value: feeds

        # --- GeoIP Metrics ---
        - uuid: 20893376cd974096b63ab5cfde46516b
          name: 'NFTBan: GeoIP database age'
          type: TRAP
          key: nftban.geoip.database_age
          value_type: UNSIGNED
          units: days
          description: 'Age of GeoIP database in days'
          tags:
            - tag: component
              value: geoip
          triggers:
            - uuid: 4ccf5bf184ff43879486ce6bc20a1240
              expression: 'last(/NFTBan/nftban.geoip.database_age)>{$NFTBAN.GEOIP.AGE.WARN}'
              name: 'NFTBan GeoIP database outdated ({ITEM.VALUE} days)'
              priority: WARNING
              description: 'GeoIP database should be updated for accurate geolocation.'

        - uuid: 1a840bc094ad4b9683df26c3dbf4f358
          name: 'NFTBan: Countries blocked'
          type: TRAP
          key: nftban.geoip.countries_blocked
          value_type: UNSIGNED
          description: 'Number of blocked countries'
          tags:
            - tag: component
              value: geoip

        # --- Watchdog Metrics ---
        - uuid: a0813397c7964cc1a9b211247df8ba11
          name: 'NFTBan: Watchdog status'
          type: TRAP
          key: nftban.watchdog.status
          value_type: FLOAT
          description: 'Watchdog status: 1=ok, 0=disabled, -1=error'
          tags:
            - tag: component
              value: watchdog

        - uuid: f61faf5eeb8a4b7abcd6df284bb49e32
          name: 'NFTBan: CPU pressure score'
          type: TRAP
          key: nftban.watchdog.cpu_score
          value_type: FLOAT
          description: 'CPU pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog
          triggers:
            - uuid: b12a14fa39904cce9cce90ca56854b40
              expression: 'last(/NFTBan/nftban.watchdog.cpu_score)>80'
              name: 'NFTBan CPU pressure high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High CPU pressure may cause NFTBan to enter degraded mode.'

        - uuid: d41abbb1c9764a8982a08bc7a8ff8631
          name: 'NFTBan: Memory pressure score'
          type: TRAP
          key: nftban.watchdog.mem_score
          value_type: FLOAT
          description: 'Memory pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog
          triggers:
            - uuid: 928288cdf1f1482592fcb28a1a6e543f
              expression: 'last(/NFTBan/nftban.watchdog.mem_score)>80'
              name: 'NFTBan memory pressure high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High memory pressure may cause NFTBan to enter degraded mode.'

        - uuid: e5f2a31da50046288255a1e9d8cb0546
          name: 'NFTBan: I/O pressure score'
          type: TRAP
          key: nftban.watchdog.io_score
          value_type: FLOAT
          description: 'I/O pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog

        # --- Health Check ---
        - uuid: 3b193e2345f24393abf54c48b9905823
          name: 'NFTBan: Health status'
          type: TRAP
          key: nftban.health.status
          value_type: UNSIGNED
          description: 'Overall health: 1=healthy, 0=unhealthy'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 93d26643051a4fb2b20e0cee87c74c06
              expression: 'last(/NFTBan/nftban.health.status)=0'
              name: 'NFTBan health check failed'
              priority: HIGH
              description: 'NFTBan health check reporting unhealthy status.'

        - uuid: 89864ef858d74e7d8dcb1aa8bc709e5f
          name: 'NFTBan: Health checks passed'
          type: TRAP
          key: nftban.health.passed
          value_type: UNSIGNED
          description: 'Number of health checks passed'
          tags:
            - tag: component
              value: health

        - uuid: 1aab3a2663f9417eaa02a8566666f2a3
          name: 'NFTBan: Health checks failed'
          type: TRAP
          key: nftban.health.failed
          value_type: UNSIGNED
          description: 'Number of health checks failed'
          tags:
            - tag: component
              value: health

        # --- Server Inventory ---
        - uuid: 8f627d9d2df14498a1160fbd235ed714
          name: 'NFTBan: Server hostname'
          type: TRAP
          key: nftban.server.hostname
          value_type: CHAR
          description: 'Server hostname (short)'
          inventory_link: NAME
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 17341c0f7c0d4455af1371032d321fd0
          name: 'NFTBan: Server FQDN'
          type: TRAP
          key: nftban.server.fqdn
          value_type: CHAR
          description: 'Fully qualified domain name'
          inventory_link: ALIAS
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 4bac8e7622c041918828deb3810d71b5
          name: 'NFTBan: Server OS'
          type: TRAP
          key: nftban.server.os
          value_type: CHAR
          description: 'Operating system name and version'
          inventory_link: OS
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 377684b0f4b94ddea8aa6c1b2851c7c7
          name: 'NFTBan: Server OS release'
          type: TRAP
          key: nftban.server.os_release
          value_type: CHAR
          description: 'OS release/distribution (e.g., Ubuntu 24.04, Fedora 42)'
          inventory_link: OS_SHORT
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: d1636939a26c414f8ec9af07484b97f5
          name: 'NFTBan: Server kernel'
          type: TRAP
          key: nftban.server.kernel
          value_type: CHAR
          description: 'Kernel version'
          inventory_link: SOFTWARE
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 09a8ce10543048c5a24cd15d5f421382
          name: 'NFTBan: Server architecture'
          type: TRAP
          key: nftban.server.arch
          value_type: CHAR
          description: 'System architecture (x86_64, aarch64, etc.)'
          inventory_link: TYPE
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 50f5aa19b3124a409944bfa7c015d860
          name: 'NFTBan: Server CPU cores'
          type: TRAP
          key: nftban.server.cpu_cores
          value_type: UNSIGNED
          description: 'Number of CPU cores'
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: e828ebef8e4646468cbed406811305b4
          name: 'NFTBan: Server CPU model'
          type: TRAP
          key: nftban.server.cpu_model
          value_type: CHAR
          description: 'CPU model name'
          inventory_link: HARDWARE
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 9dd7a9fe33fc46019b3276a434f11f0e
          name: 'NFTBan: Server memory total'
          type: TRAP
          key: nftban.server.memory_total
          value_type: UNSIGNED
          units: B
          description: 'Total physical memory'
          tags:
            - tag: component
              value: inventory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: bd83f72334334dfe94860a22bff9c187
          name: 'NFTBan: Server memory available'
          type: TRAP
          key: nftban.server.memory_available
          value_type: UNSIGNED
          units: B
          description: 'Available physical memory'
          tags:
            - tag: component
              value: server

        - uuid: 705f6c4186764fae8ae97566585fcee6
          name: 'NFTBan: Server uptime'
          type: TRAP
          key: nftban.server.uptime
          value_type: UNSIGNED
          units: s
