# =============================================================================
# NFTBan v1.3.0 - Connectors Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Configuration for generic connector export (Elasticsearch, Kafka, etc.)
#
# meta:name="connectors_conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2026-01-22"
# meta:description="Generic connector export configuration for ES, Kafka, syslog, webhook, file"
#
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars="NFTBAN_CONNECTORS_ENABLED,NFTBAN_CONNECTOR_ELASTICSEARCH_ENABLED,NFTBAN_CONNECTOR_KAFKA_ENABLED"
# meta:inventory.config_files="/etc/nftban/conf.d/connectors.conf"
# meta:inventory.systemd_units="nftban-unified-exporter.timer"
# meta:inventory.network="outbound:9200/tcp,outbound:9092/tcp,outbound:514/udp"
# meta:inventory.privileges="none"
#
# Copy this file to /etc/nftban/conf.d/connectors.conf and customize
# =============================================================================

# -----------------------------------------------------------------------------
# CONNECTOR FRAMEWORK SETTINGS
# -----------------------------------------------------------------------------

# Enable/disable connector framework (YES/NO)
NFTBAN_CONNECTORS_ENABLED="NO"

# Export interval in seconds (default: 60)
NFTBAN_CONNECTORS_INTERVAL="60"

# Batch size for exports (default: 100)
NFTBAN_CONNECTORS_BATCH_SIZE="100"

# Retry failed exports (YES/NO)
NFTBAN_CONNECTORS_RETRY_ENABLED="YES"

# Retry count on failure
NFTBAN_CONNECTORS_RETRIES="3"

# Retry delay in seconds
NFTBAN_CONNECTORS_RETRY_DELAY="5"

# -----------------------------------------------------------------------------
# ELASTICSEARCH CONNECTOR
# -----------------------------------------------------------------------------

# Enable Elasticsearch export (YES/NO)
NFTBAN_CONNECTOR_ELASTICSEARCH_ENABLED="NO"

# Elasticsearch URL (e.g., http://localhost:9200)
NFTBAN_CONNECTOR_ELASTICSEARCH_URL=""

# Index name pattern (default: nftban-{YYYY.MM.DD})
NFTBAN_CONNECTOR_ELASTICSEARCH_INDEX="nftban"

# Index date pattern (e.g., daily, weekly, monthly)
NFTBAN_CONNECTOR_ELASTICSEARCH_DATE_PATTERN="daily"

# Authentication (basic or api_key)
NFTBAN_CONNECTOR_ELASTICSEARCH_AUTH=""

# Basic auth username
NFTBAN_CONNECTOR_ELASTICSEARCH_USER=""

# Basic auth password
NFTBAN_CONNECTOR_ELASTICSEARCH_PASS=""

# API key (alternative to basic auth)
NFTBAN_CONNECTOR_ELASTICSEARCH_API_KEY=""

# Enable TLS/SSL (YES/NO)
NFTBAN_CONNECTOR_ELASTICSEARCH_TLS="NO"

# Skip TLS certificate verification (YES/NO) - NOT RECOMMENDED
NFTBAN_CONNECTOR_ELASTICSEARCH_TLS_INSECURE="NO"

# CA certificate file
NFTBAN_CONNECTOR_ELASTICSEARCH_CA=""

# -----------------------------------------------------------------------------
# KAFKA CONNECTOR
# -----------------------------------------------------------------------------

# Enable Kafka export (YES/NO)
NFTBAN_CONNECTOR_KAFKA_ENABLED="NO"

# Kafka bootstrap servers (comma-separated)
NFTBAN_CONNECTOR_KAFKA_BROKERS=""

# Topic name (default: nftban)
NFTBAN_CONNECTOR_KAFKA_TOPIC="nftban"

# Partition key field (e.g., hostname, empty for round-robin)
NFTBAN_CONNECTOR_KAFKA_PARTITION_KEY=""

# Security protocol: plaintext, ssl, sasl_plaintext, sasl_ssl
NFTBAN_CONNECTOR_KAFKA_SECURITY_PROTOCOL="plaintext"

# SASL mechanism: plain, scram-sha-256, scram-sha-512
NFTBAN_CONNECTOR_KAFKA_SASL_MECHANISM=""

# SASL username
NFTBAN_CONNECTOR_KAFKA_SASL_USER=""

# SASL password
NFTBAN_CONNECTOR_KAFKA_SASL_PASS=""

# SSL CA certificate
NFTBAN_CONNECTOR_KAFKA_SSL_CA=""

# -----------------------------------------------------------------------------
# SYSLOG CONNECTOR
# -----------------------------------------------------------------------------

# Enable syslog export (YES/NO)
NFTBAN_CONNECTOR_SYSLOG_ENABLED="NO"

# Syslog server hostname or IP
NFTBAN_CONNECTOR_SYSLOG_SERVER=""

# Syslog port (default: 514)
NFTBAN_CONNECTOR_SYSLOG_PORT="514"

# Protocol: udp, tcp, tcp+tls
NFTBAN_CONNECTOR_SYSLOG_PROTOCOL="udp"

# Facility: local0-local7, user, daemon, etc.
NFTBAN_CONNECTOR_SYSLOG_FACILITY="local0"

# Format: rfc5424, rfc3164, json
NFTBAN_CONNECTOR_SYSLOG_FORMAT="rfc5424"

# App name in syslog message
NFTBAN_CONNECTOR_SYSLOG_APP_NAME="nftban"

# -----------------------------------------------------------------------------
# WEBHOOK CONNECTOR
# -----------------------------------------------------------------------------

# Enable webhook export (YES/NO)
NFTBAN_CONNECTOR_WEBHOOK_ENABLED="NO"

# Webhook URL (POST endpoint)
NFTBAN_CONNECTOR_WEBHOOK_URL=""

# HTTP headers (JSON format)
NFTBAN_CONNECTOR_WEBHOOK_HEADERS='{}'

# Authentication type: none, basic, bearer, api_key
NFTBAN_CONNECTOR_WEBHOOK_AUTH="none"

# Basic auth username
NFTBAN_CONNECTOR_WEBHOOK_USER=""

# Basic auth password
NFTBAN_CONNECTOR_WEBHOOK_PASS=""

# Bearer token
NFTBAN_CONNECTOR_WEBHOOK_TOKEN=""

# API key header name
NFTBAN_CONNECTOR_WEBHOOK_API_KEY_HEADER="X-API-Key"

# API key value
NFTBAN_CONNECTOR_WEBHOOK_API_KEY=""

# Content-Type header (default: application/json)
NFTBAN_CONNECTOR_WEBHOOK_CONTENT_TYPE="application/json"

# Timeout in seconds
NFTBAN_CONNECTOR_WEBHOOK_TIMEOUT="10"

# -----------------------------------------------------------------------------
# FILE CONNECTOR
# -----------------------------------------------------------------------------

# Enable file export (YES/NO)
NFTBAN_CONNECTOR_FILE_ENABLED="NO"

# Output file path
NFTBAN_CONNECTOR_FILE_PATH="/var/lib/nftban/exports/metrics.ndjson"

# File format: ndjson, json, csv
NFTBAN_CONNECTOR_FILE_FORMAT="ndjson"

# Rotation: none, daily, size
NFTBAN_CONNECTOR_FILE_ROTATION="daily"

# Max file size in MB (for size rotation)
NFTBAN_CONNECTOR_FILE_MAX_SIZE="100"

# Number of rotated files to keep
NFTBAN_CONNECTOR_FILE_KEEP="7"

# Compression: none, gzip
NFTBAN_CONNECTOR_FILE_COMPRESSION="gzip"

# -----------------------------------------------------------------------------
# DATA SELECTION
# -----------------------------------------------------------------------------
# Control what data is exported to connectors

# Export metrics data
NFTBAN_CONNECTORS_EXPORT_METRICS="YES"

# Export ban events
NFTBAN_CONNECTORS_EXPORT_BANS="YES"

# Export unban events
NFTBAN_CONNECTORS_EXPORT_UNBANS="YES"

# Export alert events
NFTBAN_CONNECTORS_EXPORT_ALERTS="YES"

# Export health status
NFTBAN_CONNECTORS_EXPORT_HEALTH="YES"

# -----------------------------------------------------------------------------
# TROUBLESHOOTING
# -----------------------------------------------------------------------------

# Enable debug logging for connectors
NFTBAN_CONNECTORS_DEBUG="NO"
