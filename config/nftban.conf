# =============================================================================
# NFTBAN Configuration File - UNIFIED ARCHITECTURE v7.1.0
# =============================================================================
# This configuration now includes unified NFTables set names
# Put your custom overrides in: /etc/nftban/config/nftban.conf.local
# =============================================================================

# =============================================================================
# BASE CONFIGURATION
# =============================================================================
BASE_DIR="/etc/nftban"
BIN_DIR="$BASE_DIR/bin"
LIB_DIR="$BASE_DIR/lib"
CONFIG_DIR="$BASE_DIR/config"
FILTERS_DIR="$CONFIG_DIR/filters"
ACTIONS_DIR="$CONFIG_DIR/actions"
WHITELIST_DIR="$CONFIG_DIR/whitelist"
FEEDS_CONFIG_DIR="$CONFIG_DIR/feeds"
DATA_DIR="$BASE_DIR/data"
FEEDS_DATA_DIR="$DATA_DIR/feeds"
CACHE_DIR="$DATA_DIR/cache"
DB_DIR="$DATA_DIR/db"
LOG_DIR="/var/log/nftban"
SCRIPTS_DIR="$BASE_DIR/scripts"

# =============================================================================
# UNIFIED NFTABLES SET NAMES (NEW - v7.1.0)
# =============================================================================
# These define the actual set names used in nftables
# All modules will use these variables instead of hardcoding names
# DO NOT change these unless you understand nftables set management

# Core nftables settings
NFTBAN_NFT_FAMILY="inet"
NFTBAN_NFT_TABLE="nftban_global"

# Whitelist sets
NFTBAN_WHITELIST_SET_V4="whitelist_v4"
NFTBAN_WHITELIST_SET_V6="whitelist_v6"

# Temporary ban sets (with timeout support)
NFTBAN_TEMPBAN_SET_V4="temp_ban_v4"
NFTBAN_TEMPBAN_SET_V6="temp_ban_v6"

# Permanent blacklist sets
NFTBAN_BLACKLIST_SET_V4="user_blacklist_v4"
NFTBAN_BLACKLIST_SET_V6="user_blacklist_v6"
NFTBAN_SYSTEM_BLACKLIST_SET_V4="system_blacklist_v4"
NFTBAN_SYSTEM_BLACKLIST_SET_V6="system_blacklist_v6"

# GEO blocking sets (UNIFIED - single set with country comments)
NFTBAN_GEO_SET_V4="geo_block_v4"
NFTBAN_GEO_SET_V6="geo_block_v6"

# Threat intelligence feeds sets (UNIFIED - single set with provider comments)
NFTBAN_FEEDS_SET_V4="feeds_v4"
NFTBAN_FEEDS_SET_V6="feeds_v6"

# =============================================================================
# EMAIL SETTINGS
# =============================================================================
NFTBAN_F2B_RECIPIENT="admin@yourdomain.com"
NFTBAN_F2B_SENDER="nftban@$(hostname -f)"
NFTBAN_F2B_ALERT_ENABLED="true"
NFTBAN_EMAIL_ENABLED="false"
NFTBAN_EMAIL_RECIPIENT=""
NFTBAN_EMAIL_SENDER="nftban@$(hostname -f)"

# =============================================================================
# DEFAULT SETTINGS
# =============================================================================
NFTBAN_F2B_DEF_BAN_TIME="3600"
NFTBAN_F2B_DEF_FIND_TIME="600"
NFTBAN_F2B_DEF_MAX_RETRY="5"
NFTBAN_F2B_BACKEND="systemd"

# =============================================================================
# WHITELIST CONFIGURATION
# =============================================================================
# Whitelist file location
NFTBAN_F2B_IGNOREIP="$CONFIG_DIR/nftban-fail2ban-ip-whitelist.conf.local"

# Auto-whitelist trusted IPs
NFTBAN_ENABLE_AUTO_WHITELIST="true"

# =============================================================================
# RATE LIMITING & SAFETY
# =============================================================================
# Limit to avoid ban misconfiguration (bans per minute)
BAN_RATE_LIMIT_PER_MINUTE="10"
NFTBAN_RATE_LIMIT_PER_MIN="60"

# Maximum concurrent bans allowed
NFTBAN_MAX_CONCURRENT_BANS="1000"

# Cleanup interval for expired bans (seconds)
NFTBAN_CLEANUP_INTERVAL="3600"

# Persistent offender threshold (number of bans before permanent blacklist)
NFTBAN_PERSISTENT_THRESHOLD="3"

# Default ban time (seconds)
NFTBAN_DEFAULT_BAN_TIME="3600"

# =============================================================================
# GEO-BLOCKING CONFIGURATION
# =============================================================================
# Enable/disable geo-blocking
NFTBAN_ENABLE_GEO_BLOCKING="true"

# Whitelist countries (space-separated ISO country codes)
GEO_WHITELIST_COUNTRIES="GR US"

# System-wide blacklist countries (space-separated ISO country codes)
GEO_SYSTEM_BLACKLIST_COUNTRIES=""

# GEO IP database URL base
NFTBAN_GEO_DB_URL="https://raw.githubusercontent.com/sapics/ip-location-db/main/dbip-country"

# =============================================================================
# GEOIP & WHOIS LOOKUP
# =============================================================================
# Enable GeoIP lookups for ban notifications
NFTBAN_GEOIP_ENABLE="false"

# Enable WHOIS lookups for ban notifications
NFTBAN_WHOIS_ENABLE="false"

# =============================================================================
# DYNAMIC JAIL GENERATION
# =============================================================================
# Enable automatic jail generation from logfiles in monitored directories
NFTBAN_DYNAMIC_JAILS_ENABLED="true"

# Directories to monitor for log files (space-separated)
NFTBAN_DYNAMIC_LOG_DIRS="/var/log /var/log/nginx /var/log/apache2"

# Pattern matching for log files to monitor
NFTBAN_DYNAMIC_LOG_PATTERN="*.log"

# Exclude specific log files or patterns (space-separated)
NFTBAN_DYNAMIC_LOG_EXCLUDE="wtmp btmp lastlog journal/* syslog kern.log dmesg"

# Default filter to use for dynamic jails
NFTBAN_DYNAMIC_DEFAULT_FILTER="common"

# Rescan interval in seconds (0 = only on setup)
NFTBAN_DYNAMIC_RESCAN_INTERVAL="3600"

# Auto-detect service type from log path
NFTBAN_DYNAMIC_AUTO_DETECT_SERVICE="true"

# Minimum file size to consider (bytes, 0 = no minimum)
NFTBAN_DYNAMIC_MIN_FILESIZE="100"

# Maximum number of dynamic jails (0 = unlimited)
NFTBAN_DYNAMIC_MAX_JAILS="50"

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Log level: DEBUG, INFO, WARN, ERROR
NFTBAN_LOG_LEVEL="INFO"
DEBUG_ENABLED="false"

# Main log file
NFTBAN_LOG_FILE="/var/log/nftban/nftban.log"

# Maximum log file size before rotation
NFTBAN_LOG_MAX_SIZE="10M"

# Number of days to retain logs
NFTBAN_LOG_RETENTION_DAYS="30"

# Enable verbose logging
NFTBAN_DEBUG_MODE="false"

# =============================================================================
# THREAT INTELLIGENCE FEEDS (UNIFIED ARCHITECTURE)
# =============================================================================
# Enable threat intelligence feeds
NFTBAN_FEEDS_ENABLED="true"

# Feeds configuration file
NFTBAN_FEEDS_CONFIG="$FEEDS_CONFIG_DIR/feeds.conf"

# Feeds data directory
NFTBAN_FEEDS_DATA_DIR="$FEEDS_DATA_DIR"

# Auto-update interval in seconds (43200 = 12 hours, 0 = disabled)
NFTBAN_FEEDS_UPDATE_INTERVAL="43200"

# Auto-import feeds into nftables on update
NFTBAN_FEEDS_AUTO_IMPORT="true"

# DEPRECATED: Old feed set names (kept for compatibility, not used in v7.1+)
# Use NFTBAN_FEEDS_SET_V4/V6 instead
NFTBAN_FEEDS_NFT_SET="feeds_v4"
NFTBAN_FEEDS_NFT_TABLE="inet nftban_global"

# Maximum feed file age before forcing update (seconds)
NFTBAN_FEEDS_MAX_AGE="86400"

# Timeout for feed downloads (seconds)
NFTBAN_FEEDS_DOWNLOAD_TIMEOUT="20"

# Respect whitelist when importing feeds
NFTBAN_FEEDS_RESPECT_WHITELIST="true"

# Maximum number of IPs to import per feed (0 = unlimited)
NFTBAN_FEEDS_MAX_IPS_PER_FEED="0"

# Maximum total entries across all feeds (safety limit)
NFTBAN_FEEDS_MAX_ENTRIES="500000"

# Minimum entries in feed to be considered valid
NFTBAN_FEEDS_MIN_ENTRIES="50"

# Maximum consecutive failures before disabling feed
NFTBAN_FEEDS_MAX_FAILURES="3"

# Memory limit for feeds processing (MB)
NFTBAN_FEEDS_MEMORY_LIMIT="512"

# Enable feed health monitoring
NFTBAN_FEEDS_HEALTH_CHECK="true"

# Remove IPs from old feeds that are no longer present
NFTBAN_FEEDS_CLEAN_OLD_IPS="true"

# Alert threshold for large feed changes (percentage)
NFTBAN_FEEDS_LARGE_CHANGE_ALERT_PERCENT="30"

# -----------------------------------------------------------------------------
# FEED ENABLE/DISABLE CONTROLS (Master Control)
# -----------------------------------------------------------------------------
# Enable individual feeds. Set to "true" to enable, "false" to disable.
# Leave empty "" to use the default from feeds.conf

# Abuse.ch Feeds
NFTBAN_FEED_FEODO_ENABLED=""
NFTBAN_FEED_SSLBL_ENABLED=""
NFTBAN_FEED_URLHAUS_ENABLED=""

# Spamhaus Feeds
NFTBAN_FEED_SPAMHAUS_DROP_ENABLED=""
NFTBAN_FEED_SPAMHAUS_EDROP_ENABLED=""
NFTBAN_FEED_SPAMHAUS_ENABLED=""

# DShield
NFTBAN_FEED_DSHIELD_ENABLED=""

# Blocklist.de Feeds
NFTBAN_FEED_BLOCKLISTDE_ALL_ENABLED=""
NFTBAN_FEED_BLOCKLISTDE_SSH_ENABLED=""
NFTBAN_FEED_BLOCKLISTDE_MAIL_ENABLED=""
NFTBAN_FEED_BLOCKLISTDE_APACHE_ENABLED=""

# Emerging Threats
NFTBAN_FEED_ET_COMPROMISED_ENABLED=""
NFTBAN_FEED_EMERGING_COMPROMISED_ENABLED=""

# FireHOL Feeds
NFTBAN_FEED_FIREHOL_L1_ENABLED=""
NFTBAN_FEED_FIREHOL_L2_ENABLED=""

# Talos Intelligence
NFTBAN_FEED_TALOS_ENABLED=""

# GreenSnow
NFTBAN_FEED_GREENSNOW_ENABLED=""

# Darklist.de
NFTBAN_FEED_DARKLIST_ENABLED=""

# BotVrij
NFTBAN_FEED_BOTVRIJ_ENABLED=""

# Custom Feeds
NFTBAN_FEED_CUSTOM1_ENABLED=""
NFTBAN_FEED_CUSTOM2_ENABLED=""
NFTBAN_FEED_CUSTOM3_ENABLED=""

# =============================================================================
# ADVANCED FEATURES
# =============================================================================
# Enable reputation scoring system
NFTBAN_ENABLE_REPUTATION_SCORING="false"

# Reputation database file
NFTBAN_REPUTATION_DB="$DATA_DIR/reputation.db"

# Reputation score threshold for auto-ban (0-100)
NFTBAN_REPUTATION_THRESHOLD="75"

# =============================================================================
# NOTIFICATION CHANNELS
# =============================================================================
# Webhook notifications
NFTBAN_WEBHOOK_ENABLED="false"
NFTBAN_WEBHOOK_URL=""
NFTBAN_WEBHOOK_METHOD="POST"

# Slack notifications
NFTBAN_SLACK_ENABLED="false"
NFTBAN_SLACK_WEBHOOK_URL=""

# Discord notifications
NFTBAN_DISCORD_ENABLED="false"
NFTBAN_DISCORD_WEBHOOK_URL=""

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# NFTables update batch size
NFTBAN_NFT_BATCH_SIZE="100"

# Database query cache timeout (seconds)
NFTBAN_CACHE_TIMEOUT="300"

# Worker threads for parallel processing
NFTBAN_WORKER_THREADS="4"

# =============================================================================
# CLOUDFLARE INTEGRATION
# =============================================================================
# Enable Cloudflare IP whitelist
CLOUDFLARE_ENABLED="false"

# Cloudflare API settings (if using API-based updates)
CLOUDFLARE_API_KEY=""
CLOUDFLARE_API_EMAIL=""

# =============================================================================
# JAIL CONFIGURATIONS
# =============================================================================
# Example: SSH Jail
NFTBAN_F2B_SSHD_JAIL="true"
NFTBAN_F2B_SSHD_BAN_TIME="3600"
NFTBAN_F2B_SSHD_MAX_RETRY="5"
NFTBAN_F2B_SSHD_FIND_TIME="600"
NFTBAN_F2B_SSHD_FILTER="sshd"
NFTBAN_F2B_SSHD_LOGPATH="/var/log/auth.log"
NFTBAN_F2B_SSHD_PORT="ssh"

# =============================================================================
# BACKUP & RECOVERY
# =============================================================================
# Enable automatic configuration backups
NFTBAN_AUTO_BACKUP="true"

# Backup directory
NFTBAN_BACKUP_DIR="$BASE_DIR/backups"

# Number of backups to retain
NFTBAN_BACKUP_RETENTION="10"

# =============================================================================
# SYSTEM INTEGRATION
# =============================================================================
# Integration with system services
NFTBAN_SYSTEMD_INTEGRATION="true"

# Restart fail2ban on configuration changes
NFTBAN_AUTO_RESTART_F2B="true"

# Reload nftables on rule changes
NFTBAN_AUTO_RELOAD_NFT="true"

# =============================================================================
# SEARCH INDEX CONFIGURATION
# =============================================================================
# Enable consolidated search index
NFTBAN_SEARCH_ENABLED="true"

# Search index auto-rebuild
NFTBAN_SEARCH_AUTO_REBUILD="true"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
# Remember: Put your customizations in nftban.conf.local
# This file may be regenerated by setup scripts
# =============================================================================
