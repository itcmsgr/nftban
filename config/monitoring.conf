# =============================================================================
# NFTBan Monitoring Configuration
# =============================================================================
# This file contains default monitoring thresholds and settings.
# To customize, create monitoring.conf.local in this directory.
# Values in monitoring.conf.local will override these defaults.
#
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Version: 0.8.0
# Date: 2025-10-20
# =============================================================================

# =============================================================================
# DISK SPACE MONITORING
# =============================================================================
# Alert when disk usage exceeds these percentages
# Checked filesystems: /, /var, /tmp, /home
# Alerts are immediate (no duration requirement)

NFTBAN_MONITOR_DISK_WARN=80     # Warning threshold (%)
NFTBAN_MONITOR_DISK_CRIT=90     # Critical threshold (%)
NFTBAN_MONITOR_DISK_EMERG=95    # Emergency threshold (%)

# =============================================================================
# MEMORY MONITORING
# =============================================================================
# Alert when memory usage exceeds these percentages
# AND remains above threshold for specified duration (prevents false alarms)

NFTBAN_MONITOR_MEM_WARN=80      # Warning threshold (%)
NFTBAN_MONITOR_MEM_CRIT=90      # Critical threshold (%)
NFTBAN_MONITOR_MEM_EMERG=95     # Emergency threshold (%)

# Duration requirements (seconds) - sustained violation before alerting
NFTBAN_MONITOR_MEM_DURATION_WARN=300    # 5 minutes
NFTBAN_MONITOR_MEM_DURATION_CRIT=300    # 5 minutes
NFTBAN_MONITOR_MEM_DURATION_EMERG=180   # 3 minutes

# =============================================================================
# CPU MONITORING
# =============================================================================
# Alert when CPU usage exceeds these percentages
# AND remains above threshold for specified duration (prevents false alarms)

NFTBAN_MONITOR_CPU_WARN=80      # Warning threshold (%)
NFTBAN_MONITOR_CPU_CRIT=90      # Critical threshold (%)
NFTBAN_MONITOR_CPU_EMERG=95     # Emergency threshold (%)

# Duration requirements (seconds) - sustained violation before alerting
NFTBAN_MONITOR_CPU_DURATION_WARN=600    # 10 minutes
NFTBAN_MONITOR_CPU_DURATION_CRIT=300    # 5 minutes
NFTBAN_MONITOR_CPU_DURATION_EMERG=180   # 3 minutes

# =============================================================================
# INODE MONITORING
# =============================================================================
# Alert when inode usage exceeds these percentages
# Checked filesystems: /, /var, /tmp, /home
# Alerts are immediate (no duration requirement)

NFTBAN_MONITOR_INODE_WARN=80    # Warning threshold (%)
NFTBAN_MONITOR_INODE_CRIT=90    # Critical threshold (%)
NFTBAN_MONITOR_INODE_EMERG=95   # Emergency threshold (%)

# =============================================================================
# ALERT SETTINGS
# =============================================================================

# Alert cooldown period (seconds) - prevents alert spam
# After sending an alert, the same alert won't be sent again until cooldown expires
NFTBAN_MONITOR_ALERT_COOLDOWN=3600  # 1 hour

# Email alert recipient (uses NFTBAN_ADMIN_EMAIL from main config if not set)
# NFTBAN_MONITOR_EMAIL="admin@example.com"

# =============================================================================
# MONITORING SCHEDULE
# =============================================================================
# Note: Monitoring is typically run via systemd timer or cron
# Recommended: Every 5 minutes
#
# Systemd: /etc/systemd/system/nftban-monitor.timer
# Cron:    */5 * * * * /usr/local/bin/nftban monitor run
# =============================================================================

# =============================================================================
# EXAMPLES
# =============================================================================
#
# Example 1: Less sensitive (datacenter with stable load)
# NFTBAN_MONITOR_DISK_WARN=85
# NFTBAN_MONITOR_DISK_CRIT=92
# NFTBAN_MONITOR_DISK_EMERG=97
# NFTBAN_MONITOR_CPU_DURATION_WARN=1800  # 30 minutes
#
# Example 2: More sensitive (mission critical system)
# NFTBAN_MONITOR_DISK_WARN=70
# NFTBAN_MONITOR_DISK_CRIT=85
# NFTBAN_MONITOR_DISK_EMERG=90
# NFTBAN_MONITOR_CPU_DURATION_WARN=300   # 5 minutes
#
# Example 3: Disable specific monitoring
# NFTBAN_MONITOR_DISK_WARN=100  # Never trigger
# =============================================================================
