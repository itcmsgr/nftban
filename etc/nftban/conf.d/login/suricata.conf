# -----------------------------------------------------------------------------
# SURICATA MODE SETTINGS
# -----------------------------------------------------------------------------
# EVE JSON parsing for authentication events

# EVE JSON Log Path (Suricata alert output)
LOGIN_SURICATA_EVE_FILE="/var/log/suricata/eve.json"

# Alternative: Unix socket for real-time alerts (faster, optional)
LOGIN_SURICATA_EVE_SOCKET=""

# -----------------------------------------------------------------------------
# AUTHENTICATION EVENT DETECTION
# -----------------------------------------------------------------------------
# Suricata rules can detect various auth failures at network level

# Enable SSH auth failure detection
LOGIN_SURICATA_DETECT_SSH="true"

# Enable FTP auth failure detection
LOGIN_SURICATA_DETECT_FTP="true"

# Enable SMTP auth failure detection
LOGIN_SURICATA_DETECT_SMTP="true"

# Enable POP3/IMAP auth failure detection
LOGIN_SURICATA_DETECT_MAIL="true"

# Enable HTTP auth failure detection (401 responses)
LOGIN_SURICATA_DETECT_HTTP="true"

# Enable generic protocol anomalies (potential auth attacks)
LOGIN_SURICATA_DETECT_ANOMALIES="true"

# -----------------------------------------------------------------------------
# ALERT FILTERING
# -----------------------------------------------------------------------------
# Filter Suricata alerts for auth-related events

# Signature patterns to match (regex, pipe-separated)
LOGIN_SURICATA_SIG_PATTERNS="[Aa]uth|[Ll]ogin|[Pp]assword|[Cc]redential|[Bb]rute|SSH|FTP|SMTP|POP3|IMAP"

# Event types to monitor (from EVE JSON)
LOGIN_SURICATA_EVENT_TYPES="alert,ssh,anomaly"

# Alert categories to monitor
LOGIN_SURICATA_CATEGORIES="attempted-admin,unsuccessful-user,default-login-attempt"

# Signature IDs for auth failures (Suricata ET rules)
# SSH brute force: 2001219, 2003068
# FTP brute force: 2001068, 2001069
# SMTP auth failure: 2005001
LOGIN_SURICATA_SIG_IDS="2001219,2003068,2001068,2001069,2005001"

# -----------------------------------------------------------------------------
# SSH PROTOCOL LOGGING
# -----------------------------------------------------------------------------
# Suricata's SSH protocol logging (requires eve-log ssh type)

# Use SSH protocol logs for auth event extraction
LOGIN_SURICATA_USE_SSH_LOG="true"

# SSH protocol version to monitor ("1.99", "2.0", or "all")
LOGIN_SURICATA_SSH_PROTOCOL_VERSION="all"

# Detect client version patterns (potential attack tools)
LOGIN_SURICATA_SSH_CLIENT_PATTERNS="libssh|paramiko|dropbear|putty"

# Detect scanner signatures in SSH banner
LOGIN_SURICATA_SSH_SCANNER_PATTERNS="[Nn]map|[Ss]can|[Aa]udit|[Bb]rute"

# -----------------------------------------------------------------------------
# SCORING THRESHOLDS
# -----------------------------------------------------------------------------
# Score-based decision making (0.0 - 1.0 scale)

# Base score per alert severity (Suricata severity 1-4)
LOGIN_SURICATA_SCORE_SEVERITY_1="0.10"   # Low
LOGIN_SURICATA_SCORE_SEVERITY_2="0.20"   # Medium
LOGIN_SURICATA_SCORE_SEVERITY_3="0.35"   # High
LOGIN_SURICATA_SCORE_SEVERITY_4="0.50"   # Critical

# Bonus score for specific attack types
LOGIN_SURICATA_SCORE_BRUTE_FORCE="0.25"
LOGIN_SURICATA_SCORE_CREDENTIAL_STUFFING="0.30"
LOGIN_SURICATA_SCORE_DICTIONARY_ATTACK="0.25"
LOGIN_SURICATA_SCORE_PASSWORD_SPRAY="0.30"

# Repetition multiplier (alerts from same IP in window)
LOGIN_SURICATA_SCORE_REPEAT_3="0.10"     # 3+ alerts
LOGIN_SURICATA_SCORE_REPEAT_5="0.15"     # 5+ alerts
LOGIN_SURICATA_SCORE_REPEAT_10="0.25"    # 10+ alerts

# Multi-protocol bonus (attacking multiple services)
LOGIN_SURICATA_SCORE_MULTI_PROTOCOL="0.20"

# Feed reputation bonus (if IP is in threat feeds)
LOGIN_SURICATA_SCORE_BAD_REPUTATION="0.15"

# GeoIP risk bonus (high-risk countries)
LOGIN_SURICATA_SCORE_HIGH_RISK_GEO="0.10"

# Known attack tool detected
LOGIN_SURICATA_SCORE_KNOWN_TOOL="0.20"

# -----------------------------------------------------------------------------
# ACTION THRESHOLDS
# -----------------------------------------------------------------------------
# What to do based on final score

# Observe only (log, no block)
LOGIN_SURICATA_THRESHOLD_OBSERVE="0.25"

# Short block (temporary)
LOGIN_SURICATA_THRESHOLD_BLOCK_SHORT="0.45"

# Long block (extended)
LOGIN_SURICATA_THRESHOLD_BLOCK_LONG="0.65"

# Permanent block candidate
LOGIN_SURICATA_THRESHOLD_BLOCK_PERMANENT="0.85"

# -----------------------------------------------------------------------------
# BLOCKING POLICY
# -----------------------------------------------------------------------------
# Ban durations for each threshold level

LOGIN_SURICATA_BAN_DURATION_SHORT="900"        # 15 minutes
LOGIN_SURICATA_BAN_DURATION_LONG="3600"        # 1 hour
LOGIN_SURICATA_BAN_DURATION_PERMANENT="86400"  # 24 hours

# Score decay time (seconds) - how long before score resets
LOGIN_SURICATA_SCORE_DECAY="1800"

# Time window for counting repeated alerts (seconds)
LOGIN_SURICATA_ALERT_WINDOW="300"

# -----------------------------------------------------------------------------
# INTEGRATION WITH OTHER MODULES
# -----------------------------------------------------------------------------
# Enable correlation with other nftban modules

# Use threat feeds for reputation scoring
LOGIN_SURICATA_USE_FEEDS="true"

# Use GeoIP for risk scoring
LOGIN_SURICATA_USE_GEOIP="true"

# Cross-reference with classic mode (dual detection = higher score)
LOGIN_SURICATA_USE_CLASSIC_CORRELATION="true"

# Cross-reference with portscan module (recon before attack?)
LOGIN_SURICATA_USE_PORTSCAN_CORRELATION="true"

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------
# EVE JSON parsing settings

# Batch size for processing alerts
LOGIN_SURICATA_BATCH_SIZE="100"

# Poll interval for EVE file (milliseconds)
LOGIN_SURICATA_POLL_INTERVAL_MS="500"

# Maximum alerts to process per second (rate limiting)
LOGIN_SURICATA_MAX_ALERTS_PER_SEC="500"

# Maximum tracked IPs
LOGIN_SURICATA_MAX_TRACKED_IPS="50000"

# State file for persistent tracking
LOGIN_SURICATA_STATE_FILE="/var/lib/nftban/login-suricata-state.db"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log file for suricata mode events

LOGIN_SURICATA_LOG_FILE="/var/log/nftban/login-suricata.log"

# Log level: DEBUG, INFO, WARN, ERROR
LOGIN_SURICATA_LOG_LEVEL="INFO"

# Log all alerts (verbose)
LOGIN_SURICATA_LOG_ALL_ALERTS="false"

# Log scoring decisions
LOGIN_SURICATA_LOG_SCORES="true"

# Log protocol details
LOGIN_SURICATA_LOG_PROTOCOL_DETAILS="true"

# =============================================================================
# END OF SURICATA MODE CONFIGURATION
# =============================================================================
