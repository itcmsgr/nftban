# =============================================================================
#
# RESPONSE ACTIONS
# ================
# These settings control what NFTBan does when it processes a Suricata alert
# from an enabled detection category.
#
# Available actions:
#   observe        — log + metric only, no ban
#   ban_short      — temporary ban (default: 1 hour)
#   ban_long       — longer ban (default: 24 hours)
#   ban_permanent  — permanent ban (no TTL)
#
# All bans go through daemon IPC → kernel nftables (INV-S-004).
# These settings control NFTBan's response, NOT Suricata's behavior.
#
# To customize: copy to actions.conf.local and edit.
# =============================================================================

# --- Authentication attacks ---
ACTION_SSH_BRUTEFORCE="ban_long"
ACTION_AUTH_BYPASS="ban_permanent"

# --- Network attacks ---
ACTION_PORTSCAN="ban_short"
ACTION_DDOS="ban_long"

# --- Web application attacks ---
ACTION_WEB_ATTACKS="ban_short"
ACTION_SQLI="ban_long"
ACTION_XSS="observe"

# --- Exploit / RCE ---
ACTION_EXPLOIT="ban_long"
ACTION_RCE="ban_permanent"

# --- Malware / C2 ---
ACTION_MALWARE="ban_permanent"
ACTION_C2="ban_permanent"

# --- Information leak ---
ACTION_INFO_LEAK="observe"

# --- Policy violations ---
ACTION_POLICY="observe"

# =============================================================================
# BAN DURATIONS (seconds)
# =============================================================================
# Override default durations per action type.

BAN_SHORT_DURATION="3600"       # 1 hour
BAN_LONG_DURATION="86400"       # 24 hours
# ban_permanent has no duration (kernel set with no timeout)
