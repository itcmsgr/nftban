  risk: advanced
  audience: [cli]
  capability: policy_change
  mutates: conditional
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban login enable"
    - "nftban login status"
    - "nftban login disable"
    - "nftban login stats"
    - "nftban login logs"
  subcommands:
    enable:
      mutates: true
      description: "Enable login monitoring (auto-installs service)"
      arguments:
        target:
          type: enum
          required: false
          values: [ssh, su, sudo, console, service, all]
          default: service
    disable:
      mutates: true
      description: "Disable login monitoring"
      arguments:
        target:
          type: enum
          required: false
          values: [ssh, su, sudo, console, service, all]
          default: service
    status:
      mutates: false
      description: "Show login monitor status"
      options:
