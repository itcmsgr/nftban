      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Feed staging area (temporary download/validation)"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/state
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Critical runtime state files"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/suricata
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Suricata integration state"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/suricata/cache
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Suricata SID-statistics cache (sid-stats.json snapshot)"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"
      note: |
        v1.175 FHS-SMELL-SIDSTATS: the daemon's suricata SID-stats snapshot moved here from
        /etc/nftban/suricata/cache/sid-stats.json (mutable runtime cache must not live under
        /etc, which FHS reserves for config). nftban-owned because the daemon (User=nftban)
        rewrites it on every auto-save tick via safety.SafeWriteFile (atomic since v1.171).
        cache.go migrates the old /etc copy on first startup. See internal/suricata/stats/cache.go.

    - path: /var/lib/nftban/alerts
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Service-failure alert bookkeeping (throttle timestamps + diagnostic reports)"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"
      note: |
        v1.175 ALERT-THROTTLE-FHS: nftban-owned home for nftban-alert@.service bookkeeping.
        The alert worker runs User=nftban; its throttle file + diagnostics previously sat
        directly under root-owned 0750 /var/lib/nftban (not group-writable) → EACCES → throttle
        never persisted (v1.174 only made those writes non-fatal). Relocating throttle to
        /var/lib/nftban/alerts/throttle_<svc> and diagnostics to /var/lib/nftban/alerts/<svc>_<ts>.txt
        (both nftban:nftban) lets throttling actually persist. See cli/sbin/nftban-service-alert.

    - path: /var/lib/nftban/update-backups
      artifact_class: state
      mode: "0750"
      owner: root
      group: nftban
      description: "Update rollback backups (root-owned for integrity)"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/watchdog
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Watchdog reports and state"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/reports/archive
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "Archived reports"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/pro
      artifact_class: state
      mode: "0750"
      owner: root
      group: nftban
      description: "Pro subscription data"
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

    - path: /var/lib/nftban/botscan
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "BotScan scanner persistent state (v1.185.1): scan-rotate rotation cursor written by the unprivileged nftban-botscan.service processor (User=nftban). Must be tmpfiles/package-created — the processor runs as nftban and cannot reliably create a subdir under /var/lib/nftban (root:nftban 0750), so the in-script mkdir fails silently and the rotation cursor never persists."
      created_by: tmpfiles
      tmpfiles_reconcile: "z"
    - path: /var/lib/nftban/botscan/spool
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "BotScan disk-backed read-authority spool (v1.209.3): moved off /run tmpfs so spool pages are reclaimable page-cache rather than unevictable tmpfs pages charged to the collector's 256M cgroup (fixes collector OOM on heavy hosts). nftban:nftban access-log lines written by nftban-botscan-collector.service and read+reaped by the unprivileged nftban-botscan.service scanner; bounded by a total-dir cap + backpressure."
      created_by: tmpfiles
      tmpfiles_reconcile: "z"
    - path: /var/lib/nftban/botscan/proc-offsets
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "BotScan scanner forward-cursor offsets (v1.209.3 made explicit): per-spool-file inode:offset state the scanner advances while draining the disk-backed spool. Reaping a fully-consumed spool file removes its cursor here too, keeping cursor and spool in sync."
      created_by: tmpfiles
      tmpfiles_reconcile: "z"
    - path: /var/lib/nftban/botscan-collector
      artifact_class: state
      mode: "0750"
      owner: nftban
      group: nftban
      description: "BotScan read-collector per-source incremental offset state (v1.178-A). Separate from the scanner's spool offsets so privileged reads only emit new bytes per cycle."
      created_by: tmpfiles
      tmpfiles_reconcile: "z"

