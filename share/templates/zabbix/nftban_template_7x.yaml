        - uuid: 9c3a7b1d-6e8f-4a2b-8c5d-7e9f1a3b5c61
          name: 'NFTBan: Module - Suricata status'
          type: TRAPPER
          key: nftban.module.suricata.status
          value_type: FLOAT
          description: '1=active, 0=disabled, -1=failed'
        - uuid: 1e5c9d3f-8a0b-4c4d-ae7f-9a1b3c5d7e81
