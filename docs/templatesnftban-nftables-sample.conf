#!/bin/bash

################################################################################
# Configuration Init of nfttables : nftables sample conf
#
# Version: 1.1.0
# Author: ITCMS Team (Antonios Voulvoulis) + Debian/Ubuntu Support
# Description:
# A balanced tuning I recommend:
# SSH (22, 2222) → 5 per source (blocks brute-force attempts).
# SMTP/IMAP/POP (25, 465, 587, 110, 143, 993, 995) → 20 per source (enough for normal mail clients).
# Web (80, 443, 853) → 200 per source (modern browsers easily open 50–100 concurrent connections).
# File/Custom ports (20, 21, 139, 445, 35000–35999, 55000, 10050, 10051, etc.) → 50 per source (reasonable, prevents abuse).
#
################################################################################

#!/usr/sbin/nft -f

#
# Flush all existing rulesets.
#
flush ruleset

#
# Include the whitelist file. This must be the first thing loaded
# to ensure the whitelist rules take precedence over all others.
#
include "/root/nftables/itcms-nftables-whitelist.conf"
#
# Create a table for the IPv4 and IPv6 families.
#
table ip filter {
    #
    # Define sets for efficient port management
    #
    set tcp_in_ports {
        type inet_service; flags interval;
        elements = { 139, 445, 35000-35999, 20, 21, 22, 25, 53, 853, 80, 110, 143, 443, 465, 587, 993, 995, 2222, 55000, 10050, 10051, 700, 800 }
    }

    set tcp_out_ports {
        type inet_service; flags interval;
        elements = { 445, 143, 20, 21, 22, 25, 43, 53, 853, 80, 110, 113, 443, 587, 993, 995, 2222, 700, 800, 10050, 10051 }
    }

    set udp_out_ports {
        type inet_service; flags interval;
        elements = { 53 }
    }

    chain INPUT {
        type filter hook input priority filter; policy drop;

        # Allow incoming ICMP Time Exceeded packets for mtr
        icmp type time-exceeded accept

        # Allow incoming DNS queries (UDP on port 53)
        udp dport 53 accept

        iif "lo" accept
        # The whitelist set is defined in whitelist.nft and used here
        ip saddr @whitelist_v4 accept
        ct state { established, related } accept
        tcp dport @tcp_in_ports accept
        log prefix "nftables: "
    }

    chain OUTPUT {
        type filter hook output priority filter; policy drop;

        # Allow outgoing ICMP Echo Requests for mtr
        icmp type echo-request accept

        oif "lo" accept
        # The whitelist set is defined in whitelist.nft and used here
        ip daddr @whitelist_v4 accept
        ct state { established, related } accept
        tcp dport @tcp_out_ports accept
        udp dport @udp_out_ports accept
    }

    chain FORWARD {
        type filter hook forward priority filter; policy drop;
    }
}

table ip6 filter {
    set tcp6_in_ports {
        type inet_service; flags interval;
        elements = { 35000-35999, 20, 21, 22, 25, 53, 853, 80, 110, 143, 443, 465, 587, 993, 995, 2222 }
    }

    set tcp6_out_ports {
        type inet_service; flags interval;
        elements = { 143, 20, 21, 22, 25, 43, 53, 853, 80, 110, 113, 443, 587, 993, 995, 2222 }
    }

    set udp6_out_ports {
        type inet_service; flags interval;
        elements = { 53 }
    }

    chain INPUT {
        type filter hook input priority filter; policy drop;

        # Allow ICMP Time Exceeded packets for mtr
        icmp type time-exceeded accept
        # Allow ICMP6 Time Exceeded packets for mtr
        icmpv6 type time-exceeded accept
        
        # Allow incoming DNS queries (UDP on port 53)
        udp dport 53 accept

        iif "lo" accept
        # The whitelist set is defined in whitelist.nft and used here
        ip6 saddr @whitelist_v6 accept
        ct state { established, related } accept
        tcp dport @tcp6_in_ports accept
        log prefix "nftables: "
    }

    chain OUTPUT {
        type filter hook output priority filter; policy drop;

        # Allow ICMP Echo Requests for mtr
        icmp type echo-request accept
        # Allow ICMP6 Echo Requests for mtr
        icmpv6 type echo-request accept

        oif "lo" accept
        # The whitelist set is defined in whitelist.nft and used here
        ip6 daddr @whitelist_v6 accept
        ct state { established, related } accept
        tcp dport @tcp6_out_ports accept
        udp dport @udp6_out_ports accept
    }

    chain FORWARD {
        type filter hook forward priority filter; policy drop;
    }
}
