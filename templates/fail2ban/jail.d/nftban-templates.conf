
# Template for critical services
[critical-template]
action = %(action_)s
         advanced-email[
             notify_start=true,
             notify_stop=true,
             notify_ban=true,
             notify_unban=true,
             include_whois=true,
             include_nslookup=true,
             include_reverse_dns=true
         ]

# Template for basic monitoring
[basic-template]
action = %(action_)s
         advanced-email[
             notify_ban=true,
             notify_unban=false,
             include_whois=false,
             include_nslookup=true
         ]

# Template for service status only
[status-template]
action = %(action_)s
         advanced-email[
             notify_start=true,
             notify_stop=true,
             notify_ban=false,
             notify_unban=false
         ]
