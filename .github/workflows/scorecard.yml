# =============================================================================
# NFTBan - OpenSSF Scorecard
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Automated security health assessment via OpenSSF Scorecard
#
# Runs on:
#   - Weekly on Monday at 6:00 AM UTC
#   - Push to main branch
#
# Outputs:
#   - SARIF report uploaded to GitHub Security tab
#   - Scorecard badge data for repository
# =============================================================================

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 AM UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@f5c2471be782132e47a6e6f9c725e56730d6e9a3 # v3.32.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
        # Note: No run: steps allowed when publish_results: true
        # See: https://github.com/ossf/scorecard-action#workflow-restrictions
