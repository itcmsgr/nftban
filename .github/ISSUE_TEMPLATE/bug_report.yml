---
name: "🐛 Bug Report (Linux Servers)"
description: "Report an issue with nftban on Debian/Ubuntu/RHEL/Rocky/Alma/Fedora"
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: ["itcmsgr"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this template
        Use this form to report bugs reproducible on Linux servers (Debian/Ubuntu/RHEL/Rocky/Alma/Fedora).
        Please include exact commands, outputs, and versions. Mask any sensitive data (real IPs, keys, domains).

        **Quick option:** Run `sudo nftban support` to generate a support bundle with all diagnostic info automatically collected (secrets are redacted). Attach the generated `.tar.gz` file to this issue.

        **Not for feature requests** — use "💡 Feature Request" instead.

        Thank you for helping improve nftban!

  - type: input
    id: summary
    attributes:
      label: "Bug Summary"
      description: "One sentence summary of what is wrong"
      placeholder: "Example: GeoIP update succeeds but sets remain empty"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps and commands that lead to the issue"
      value: |
        1. …
        2. …
        3. …
        4. Observed error: …
      placeholder: |
        1. Run: sudo nftban geoip update
        2. Check: sudo nft list set ip nftban_v4 feeds
        3. Compare: journalctl -u nftban --no-pager -n 50
        4. Error appears: …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      placeholder: "What should have happened instead?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      placeholder: "What actually happened? Include error messages."
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: "Operating System / Distribution"
      description: "Select the closest match"
      options:
        - "Debian 12 (Bookworm)"
        - "Debian 11 (Bullseye)"
        - "Ubuntu 24.04 LTS"
        - "Ubuntu 22.04 LTS"
        - "Ubuntu 20.04 LTS"
        - "RHEL / Rocky / Alma 9"
        - "RHEL / Rocky / Alma 8"
        - "Fedora 35+"
        - "Other (specify below)"
    validations:
      required: true

  - type: input
    id: distro_other
    attributes:
      label: "If Other, specify"
      placeholder: "e.g., Proxmox 8 (Debian base), Amazon Linux 2023"
    validations:
      required: false

  - type: input
    id: kernel
    attributes:
      label: "Kernel Version"
      placeholder: "e.g., 6.8.0-35-generic (run: uname -r)"
    validations:
      required: false

  - type: input
    id: nftban_version
    attributes:
      label: "nftban Version / Commit"
      placeholder: "e.g., v0.9.0-beta, commit abc1234 (run: nftban --version)"
    validations:
      required: true

  - type: input
    id: nftables_version
    attributes:
      label: "nftables Version"
      placeholder: "Output of: nft --version"
    validations:
      required: false

  - type: dropdown
    id: install_method
    attributes:
      label: "Installation Method"
      options:
        - "Two-step script (download then run)"
        - "One-liner curl | bash"
        - "Manual (cloned repo)"
        - "Other"
    validations:
      required: true

  - type: checkboxes
    id: modules
    attributes:
      label: "Affected Areas (check all that apply)"
      options:
        - label: "Core / CLI"
        - label: "Installer / Uninstall"
        - label: "Fail2Ban integration"
        - label: "DDoS module"
        - label: "Port scan module"
        - label: "GeoIP / Geo blocking"
        - label: "Threat feeds"
        - label: "Whitelist / Blacklist"
        - label: "Cloudflare integration"
        - label: "Stats / Smoketest"
    validations:
      required: false

  - type: textarea
    id: commands
    attributes:
      label: "Commands and Outputs"
      description: "Paste relevant commands and their outputs. Mask sensitive data."
      placeholder: |
        Command:
        sudo nftban status

        Output:
        <paste here>

        Command:
        sudo nft list tables

        Output:
        <paste here>
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs"
      description: "Paste relevant log lines (journalctl or /var/log/*). Use code fences."
      placeholder: |
        ```text
        journalctl -u nftban --no-pager -n 200
        (paste output here)
        ```
    validations:
      required: false

  - type: textarea
    id: health_check
    attributes:
      label: "Health Check Output"
      description: "Output of: sudo nftban health check"
      placeholder: |
        ```text
        sudo nftban health check
        (paste output here)
        ```
    validations:
      required: false

  - type: textarea
    id: nftables_ruleset
    attributes:
      label: "nftables Ruleset (if firewall issue)"
      description: "Output of: sudo nft list ruleset (can be large - attach file if needed)"
      placeholder: |
        ```text
        sudo nft list tables
        (paste output here, or attach full ruleset as file)
        ```
    validations:
      required: false

  - type: checkboxes
    id: environment
    attributes:
      label: "Environment (check all that apply)"
      options:
        - label: "Running in container (Docker/Podman)"
        - label: "Running in VM (KVM/VMware/VirtualBox)"
        - label: "Cloud provider (AWS/GCP/Azure/DO)"
        - label: "SELinux enforcing"
        - label: "AppArmor enabled"
        - label: "Custom nftables rules outside NFTBan"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      placeholder: "Workarounds tried, related issues, environment peculiarities"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Tip:** For fastest resolution, attach a support bundle:
        ```bash
        sudo nftban support
        # Then attach /tmp/nftban-support-*.tar.gz to this issue
        ```
