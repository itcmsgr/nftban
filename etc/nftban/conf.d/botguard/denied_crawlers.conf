#
# Format: BOT_NAME|ENABLED
#
#   BOT_NAME  Crawler identity (matched against User-Agent or rDNS)
#   ENABLED   "true" to deny, "false" to allow
#
# Denied crawlers are immediately banned when identified.
# Even if they pass FCrDNS verification, deny list takes precedence.
#
# Lines starting with # are comments. Empty lines are ignored.
# =============================================================================

GPTBOT|true
CLAUDEBOT|true
BYTESPIDER|true
CCBOT|true
SEMRUSHBOT|true
AHREFSBOT|true
DOTBOT|true
PETALBOT|true
