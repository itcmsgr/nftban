# =============================================================================
# GLOBAL DDOS PROTECTION SETTINGS
# =============================================================================

# Enable/disable all DDoS protection features (master switch)
# Set to "0" to disable all DDoS protection, "1" to enable
DDOS_PROTECTION_ENABLED="1"

# Log all DDoS protection actions
# Set to "1" to enable logging, "0" to disable
DDOS_LOGGING_ENABLED="1"

# Send email alerts for DDoS attacks
# Set to "1" to enable email alerts, "0" to disable
DDOS_EMAIL_ALERTS="1"

# =============================================================================
# SYN FLOOD PROTECTION
# =============================================================================
# Protects against TCP SYN flood attacks by rate limiting new TCP connections
# with the SYN flag set. This is one of the most common DDoS attack types.
#
# Note: This should ONLY be enabled if you know you are under a SYN flood
# attack as it will slow down all new connections from any IP address to the
# server if triggered.
# =============================================================================

# Enable/disable SYN flood protection
# Set to "0" to disable, "1" to enable
SYNFLOOD_ENABLE="0"

# Rate limit for SYN packets (format: X/time_unit)
# Time units: second, minute, hour, day
# Example: "100/second" allows 100 SYN packets per second per IP
# Recommended: 100/second for high-traffic servers, 50/second for normal use
SYNFLOOD_RATE="100/second"

# Burst allowance - number of packets allowed before rate limiting kicks in
# This allows legitimate connection bursts without triggering protection
# Recommended: 150 packets for high-traffic, 100 for normal use
SYNFLOOD_BURST="150"

# Log dropped SYN flood packets
# Set to "1" to log, "0" to silently drop
SYNFLOOD_LOG="1"

# =============================================================================
# CONNECTION LIMIT PROTECTION
# =============================================================================
# Limits the number of concurrent connections per IP address to specific ports.
# This prevents connection exhaustion attacks and resource abuse.
#
# This feature uses nftables connection tracking (conntrack) to count active
# connections per IP address. Works on all modern kernels (3.13+).
# =============================================================================

# Enable/disable connection limit protection
# Set to "0" to disable, "1" to enable
CONNLIMIT_ENABLE="1"

# SSH connection limit per IP address
# Recommended: 3-5 for SSH to allow legitimate reconnections
# Set to "0" to disable limit for SSH
CONNLIMIT_SSH="5"

# HTTP connection limit per IP address
# Recommended: 20-50 depending on legitimate traffic patterns
# Set to "0" to disable limit for HTTP
CONNLIMIT_HTTP="20"

# HTTPS connection limit per IP address
# Recommended: 20-50 depending on legitimate traffic patterns
# Set to "0" to disable limit for HTTPS
CONNLIMIT_HTTPS="20"

# FTP connection limit per IP address
# Recommended: 3-5 for FTP
# Set to "0" to disable limit for FTP
CONNLIMIT_FTP="3"

# SMTP connection limit per IP address
# Recommended: 5-10 for SMTP
# Set to "0" to disable limit for SMTP
CONNLIMIT_SMTP="5"

# POP3 connection limit per IP address
# Recommended: 5-10 for POP3
# Set to "0" to disable limit for POP3
CONNLIMIT_POP3="5"

# IMAP connection limit per IP address
# Recommended: 5-10 for IMAP
# Set to "0" to disable limit for IMAP
CONNLIMIT_IMAP="5"

# MySQL/MariaDB connection limit per IP address
# Recommended: 10-20 for database servers
# Set to "0" to disable limit for MySQL
CONNLIMIT_MYSQL="10"

# PostgreSQL connection limit per IP address
# Recommended: 10-20 for database servers
# Set to "0" to disable limit for PostgreSQL
CONNLIMIT_POSTGRESQL="10"

# Custom connection limits for additional ports
# Format: "port;limit,port;limit,..."
# Example: "8080;30,9000;15" sets port 8080 to max 30 connections, port 9000 to 15
# Leave empty to disable custom limits
CONNLIMIT_CUSTOM=""

# Log connection limit violations
# Set to "1" to log, "0" to silently reject
CONNLIMIT_LOG="1"

# Action when connection limit is exceeded
# "reject" - Send TCP RST (recommended - frees resources immediately)
# "drop" - Silently drop (hides firewall presence but ties up resources)
CONNLIMIT_ACTION="reject"

# =============================================================================
# PORT FLOOD PROTECTION
# =============================================================================
# Rate limits new connections to specific ports over time. Unlike connection
# limits which count concurrent connections, this limits the rate of new
# connection attempts per time period.
#
# This is effective against slowloris attacks and brute force attempts.
# =============================================================================

# Enable/disable port flood protection
# Set to "0" to disable, "1" to enable
PORTFLOOD_ENABLE="1"

# SSH port flood protection
# Format: "max_connections/time_in_seconds"
# Example: "5/300" allows 5 new connections per 300 seconds (5 minutes)
# Recommended: 5/300 for SSH (prevents brute force while allowing reconnections)
# Set to "0" to disable for SSH
PORTFLOOD_SSH="5/300"

# HTTP port flood protection
# Format: "max_connections/time_in_seconds"
# Example: "20/5" allows 20 new connections per 5 seconds
# Recommended: 20/5 for normal sites, increase for high-traffic sites
# Set to "0" to disable for HTTP
PORTFLOOD_HTTP="20/5"

# HTTPS port flood protection
# Format: "max_connections/time_in_seconds"
# Recommended: Same as HTTP
# Set to "0" to disable for HTTPS
PORTFLOOD_HTTPS="20/5"

# FTP port flood protection
# Format: "max_connections/time_in_seconds"
# Recommended: 10/60 for FTP
# Set to "0" to disable for FTP
PORTFLOOD_FTP="10/60"

# SMTP port flood protection
# Format: "max_connections/time_in_seconds"
# Recommended: 5/300 for SMTP (prevents spam bots)
# Set to "0" to disable for SMTP
PORTFLOOD_SMTP="5/300"

# Custom port flood limits for additional ports
# Format: "port;rate/time,port;rate/time,..."
# Example: "8080;30/10,9000;15/60"
#   - Port 8080: max 30 connections per 10 seconds
#   - Port 9000: max 15 connections per 60 seconds
# Leave empty to disable custom limits
PORTFLOOD_CUSTOM=""

# Log port flood violations
# Set to "1" to log, "0" to silently drop
PORTFLOOD_LOG="1"

# =============================================================================
# ICMP FLOOD PROTECTION
# =============================================================================
# Rate limits ICMP echo requests (ping) to prevent ICMP flood attacks.
# Also provides option to drop ICMP timestamp requests for PCI compliance.
# =============================================================================

# Enable/disable ICMP rate limiting
# Set to "0" to disable, "1" to enable
# Note: Disabling ICMP completely may break external uptime monitoring
ICMP_RATELIMIT_ENABLE="1"

# Incoming ICMP echo request (ping) rate limit
# Format: "X/time_unit" where time unit is: second, minute, hour, day
# Example: "1/second" allows 1 ping per second per IP
# Recommended: "1/second" or "5/second"
# Set to "0" to disable incoming ICMP rate limiting
ICMP_IN_RATE="1/second"

# Outgoing ICMP echo request (ping) rate limit
# Usually not needed unless preventing abuse from local users
# Recommended: "0" (disabled) unless you have specific requirements
# Set to "0" to disable outgoing ICMP rate limiting
ICMP_OUT_RATE="0"

# Drop ICMP timestamp requests (type 13)
# PCI compliance tools may require this to be enabled
# However, it has minimal security benefit and may impact network performance
# Recommended: "0" (disabled) unless required for PCI compliance
# Set to "1" to drop ICMP timestamp requests
ICMP_TIMESTAMP_DROP="0"

# Drop ICMP address mask requests (type 17)
# Rarely used, can be dropped for security
# Recommended: "1" (enabled)
# Set to "1" to drop ICMP address mask requests
ICMP_ADDRESSMASK_DROP="1"

# Log ICMP rate limit violations
# Set to "1" to log, "0" to silently drop
ICMP_LOG="0"

# =============================================================================
# UDP FLOOD PROTECTION
# =============================================================================
# Limits outbound UDP packet floods, typically originating from exploit scripts
# uploaded through vulnerable web applications.
#
# IMPORTANT: Use with caution on servers running UDP-intensive services like:
# - DNS (named/bind)
# - NTP (ntpd)
# - SNMP
# You may need to adjust limits or add services to the allowlist.
# =============================================================================

# Enable/disable UDP flood protection
# Set to "0" to disable, "1" to enable
# Recommended: "0" (disabled by default) - enable only if needed
UDPFLOOD_ENABLE="0"

# UDP packet rate limit
# Format: "X/time_unit"
# Example: "100/second" allows 100 UDP packets per second per process
# Recommended: 100/second for normal use, adjust if running UDP services
UDPFLOOD_RATE="100/second"

# UDP burst allowance
# Allows burst of UDP packets before rate limiting kicks in
# Recommended: 500 packets
UDPFLOOD_BURST="500"

# Usernames/services to exclude from UDP flood protection
# Comma-separated list of usernames that should not be rate limited
# Common exclusions: named (DNS), ntpd (NTP), snmpd (SNMP)
# Note: root (UID 0) is always excluded
# Example: "named,ntpd,snmpd"
UDPFLOOD_ALLOWUSER="named,ntpd"

# Log UDP flood violations
# Set to "1" to log, "0" to silently drop
UDPFLOOD_LOG="1"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Minimum time between DDoS rule updates (seconds)
# Prevents excessive rule changes that could impact performance
# Recommended: 60 seconds
DDOS_UPDATE_INTERVAL="60"

# Maximum entries in DDoS tracking tables
# Limits memory usage for connection tracking
# Recommended: 65536 for most systems
DDOS_MAX_ENTRIES="65536"

# Enable experimental DDoS features
# Set to "1" to enable experimental/testing features
# Recommended: "0" for production systems
DDOS_EXPERIMENTAL="0"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
