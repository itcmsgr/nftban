# -----------------------------------------------------------------------------
# CLASSIC MODE SETTINGS
# -----------------------------------------------------------------------------
# Log-based portscan detection using nftables and kernel log parsing.
# No external IDS required - pure nftables implementation.

# Log prefix for nftables rules (used to identify portscan events)
PORTSCAN_CLASSIC_LOG_PREFIX="NFTBAN_PORTSCAN:"

# Log file to monitor (usually kern.log or messages)
PORTSCAN_CLASSIC_LOG_FILE="/var/log/kern.log"

# Alternative log files to check (comma-separated)
PORTSCAN_CLASSIC_LOG_FILE_ALT="/var/log/messages,/var/log/syslog"

# Use journalctl for kernel logs on systemd systems
# Values: "auto" (detect automatically), "true" (force journalctl), "false" (file only)
# Auto-detection: Uses journalctl if no traditional log files exist
PORTSCAN_CLASSIC_USE_JOURNALCTL="auto"

# -----------------------------------------------------------------------------
# DETECTION THRESHOLDS
# -----------------------------------------------------------------------------
# Number of unique ports to trigger portscan detection

# Minimum unique ports from same IP in time window
PORTSCAN_CLASSIC_MIN_PORTS="5"

# Time window for counting ports (seconds)
PORTSCAN_CLASSIC_TIME_WINDOW="60"

# Minimum unique IPs targeted to detect horizontal scan
PORTSCAN_CLASSIC_MIN_TARGETS="3"

# -----------------------------------------------------------------------------
# GENERIC-SCAN CORROBORATION (v1.149.0 — false-ban hardening)
# -----------------------------------------------------------------------------
# The "generic" classification fires on MIN_PORTS distinct ports alone. Rapid
# low-port bursts are already caught upstream by the strobe path, and diverse
# scans by the vertical/block paths — so the uncorroborated "generic" remainder
# is non-rapid, single-target, MIN_PORTS..(VERTICAL-1) distinct ports: the
# profile of bursty/NAT/admin multi-service traffic (e.g. an admin connecting to
# ssh+http+https+smtp+... = 5-6 ports), NOT a scan. Auto-banning it produced the
# real-world false-ban that motivated this lane.
#
# When corroboration is enabled, a "generic" detection auto-bans ONLY if the
# distinct-port count reaches the corroboration floor (default: the vertical
# threshold). Below the floor it is downgraded to log/alert (NO ban). Set to
# "false" to restore the pre-v1.149 behavior (generic bans at MIN_PORTS).
#
# NOTE: corroboration is intentionally DIVERSITY-based only. Sensitive-port or
# event-volume corroboration would re-ban the very incident this fixes (SSH/22 is
# a sensitive port; SYN-retransmit feedback inflates volume), so they are not used.
PORTSCAN_CLASSIC_GENERIC_CORROBORATE="true"
# Distinct-port floor required to corroborate a "generic" auto-ban.
# Empty → falls back to PORTSCAN_CLASSIC_VERTICAL_PORTS.
PORTSCAN_CLASSIC_GENERIC_CORROBORATE_PORTS=""

# -----------------------------------------------------------------------------
# SCAN TYPE DETECTION
# -----------------------------------------------------------------------------
# Different thresholds for different scan types

# Vertical scan: Single IP scanning multiple ports on one target
PORTSCAN_CLASSIC_VERTICAL_PORTS="10"
PORTSCAN_CLASSIC_VERTICAL_WINDOW="60"

# Horizontal scan: Single IP scanning same port on multiple targets
PORTSCAN_CLASSIC_HORIZONTAL_TARGETS="5"
PORTSCAN_CLASSIC_HORIZONTAL_WINDOW="30"

# Block scan: Single IP scanning port ranges
PORTSCAN_CLASSIC_BLOCK_RANGE="20"
PORTSCAN_CLASSIC_BLOCK_WINDOW="120"

# Strobe scan: Rapid scanning of common ports
PORTSCAN_CLASSIC_STROBE_PORTS="5"
PORTSCAN_CLASSIC_STROBE_WINDOW="10"

# -----------------------------------------------------------------------------
# COMMON PORT MONITORING
# -----------------------------------------------------------------------------
# Log connections to these ports (comma-separated)

# Critical ports to always log
PORTSCAN_CLASSIC_LOG_PORTS_CRITICAL="22,23,3389,5900"

# Service ports to log
PORTSCAN_CLASSIC_LOG_PORTS_SERVICES="21,25,53,80,110,143,443,465,587,993,995,3306,5432"

# High ports to sample log (random sampling, not all)
PORTSCAN_CLASSIC_LOG_PORTS_HIGH_RANGE="1024-65535"
PORTSCAN_CLASSIC_LOG_PORTS_HIGH_SAMPLE_RATE="0.1"

# Enable logging of all closed port connections
PORTSCAN_CLASSIC_LOG_CLOSED_PORTS="true"

# Enable logging of all new connections (verbose, use with caution)
PORTSCAN_CLASSIC_LOG_ALL_NEW="false"

# -----------------------------------------------------------------------------
# BLOCKING POLICY
# -----------------------------------------------------------------------------
# What to do when portscan is detected

# Action: block, log, alert, or block_and_alert
PORTSCAN_CLASSIC_ACTION="block"

# Ban duration based on scan type (seconds)
PORTSCAN_CLASSIC_BAN_VERTICAL="1800"      # 30 minutes
PORTSCAN_CLASSIC_BAN_HORIZONTAL="3600"    # 1 hour
PORTSCAN_CLASSIC_BAN_BLOCK="7200"         # 2 hours
PORTSCAN_CLASSIC_BAN_STROBE="600"         # 10 minutes

# Default ban duration
PORTSCAN_CLASSIC_BAN_DEFAULT="1800"

# Progressive banning: increase duration on repeat offenders
PORTSCAN_CLASSIC_PROGRESSIVE_BAN="true"
PORTSCAN_CLASSIC_PROGRESSIVE_MULTIPLIER="2"
PORTSCAN_CLASSIC_PROGRESSIVE_MAX="86400"

# -----------------------------------------------------------------------------
# STATE TRACKING
# -----------------------------------------------------------------------------
# In-memory tracking configuration

# State file for persistent tracking across restarts
PORTSCAN_CLASSIC_STATE_FILE="/var/lib/nftban/portscan-state.db"

# Maximum IPs to track in memory
PORTSCAN_CLASSIC_MAX_TRACKED_IPS="10000"

# Cleanup interval for stale entries (seconds)
PORTSCAN_CLASSIC_CLEANUP_INTERVAL="300"

# State entry TTL (seconds)
PORTSCAN_CLASSIC_STATE_TTL="3600"

# -----------------------------------------------------------------------------
# NFTABLES RULES
# -----------------------------------------------------------------------------
# Rule generation settings

# Use nftables meters for rate tracking
PORTSCAN_CLASSIC_USE_METERS="true"

# Meter names
PORTSCAN_CLASSIC_METER_SYN="portscan_syn_meter"
PORTSCAN_CLASSIC_METER_NEW="portscan_new_meter"

# Log rate limit (prevent log flooding)
PORTSCAN_CLASSIC_LOG_RATE="10/second"
PORTSCAN_CLASSIC_LOG_BURST="50"

# -----------------------------------------------------------------------------
# AUTO-TUNING (OPTIONAL)
# -----------------------------------------------------------------------------
# Automatically adjust thresholds based on traffic patterns

# Enable auto-tuning
PORTSCAN_CLASSIC_AUTO_TUNE="false"

# Learning period (seconds) - observe before tuning
PORTSCAN_CLASSIC_AUTO_TUNE_PERIOD="3600"

# Baseline connection rate (if auto-tune disabled)
PORTSCAN_CLASSIC_BASELINE_RATE="100"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Module-specific logging
# IMPORTANT: This is the MODULE OUTPUT log, NOT the kernel input source.
# The kernel input source is PORTSCAN_CLASSIC_LOG_FILE defined above (line 32).
# These MUST be different variables to avoid the log-path collision bug.

PORTSCAN_CLASSIC_MODULE_LOG="/var/log/nftban/portscan-classic.log"
PORTSCAN_CLASSIC_LOG_LEVEL="INFO"

# Log all detections (including below threshold)
PORTSCAN_CLASSIC_LOG_ALL_DETECTIONS="false"

# Log port connection details
PORTSCAN_CLASSIC_LOG_PORT_DETAILS="true"

# =============================================================================
# END OF CLASSIC MODE CONFIGURATION
# =============================================================================
