# Purpose: Optimize kernel parameters for high-throughput firewall operations.
# These settings tune conntrack, TCP stack, and network buffers for servers
# running NFTBan with large ban sets and high connection rates.
#
# To override: create /etc/sysctl.d/99-local.conf with your custom values
# To disable:  remove this file or rename to .bak
# =============================================================================

# --- Connection Tracking ---
# Increase conntrack table size for servers with many concurrent connections.
# Default is typically 65536; 262144 handles ~250K simultaneous connections.
net.netfilter.nf_conntrack_max = 262144

# Reduce established connection timeout from 5 days to 10 minutes.
# Frees conntrack entries faster on firewalls that see many short-lived connections.
net.netfilter.nf_conntrack_tcp_timeout_established = 600

# --- TCP SYN Protection ---
# Enable SYN cookies to protect against SYN flood attacks.
net.ipv4.tcp_syncookies = 1

# Increase SYN backlog for servers under heavy connection pressure.
net.ipv4.tcp_max_syn_backlog = 8192

# --- TCP Tuning ---
# Increase listen backlog for services accepting many connections.
net.core.somaxconn = 4096

# Reduce FIN-WAIT-2 timeout to free sockets faster (default 60s).
net.ipv4.tcp_fin_timeout = 15

# Widen ephemeral port range for outbound connections.
net.ipv4.ip_local_port_range = 1024 65535
