# =============================================================================
# NFTBan - CI: Smoke Test
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Minimal runtime validation — CLI runs, JSON output valid
# =============================================================================

name: Smoke Test

on:
  pull_request:
    branches: [main, master, 'hotfix/**']
    paths:
      - 'cli/**'
      - 'cmd/**'
      - 'internal/**'
      - 'install/**'
      - 'packaging/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    # v1.157 PR-C: setup-go installs the exact go.mod patch (1.26.9); a single
    # unconditional setup-go feeds every go command in this job, so
    # GOTOOLCHAIN=local safely avoids a redundant toolchain re-download.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.26.9`).
          go-version: '1.26.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq

      - name: Build CLI binary
        run: go build -trimpath -o bin/nftban-core ./cmd/nftban-core/

      # v1.235 batch C (GATE-CLI-SMOKE-G20-PASSES-VACUOUSLY-ALL-SKIPPED, option b):
      # the validator is what the truth checks T1/T2 run; without it every check
      # skipped and the gate reported PASS having run nothing.
      - name: Build validator binary
        run: go build -trimpath -o bin/nftban-validate ./cmd/nftban-validate/

      - name: Install shell components
        run: |
          # Minimal install — CLI scripts + config only (no systemd, no daemon)
          sudo mkdir -p /usr/lib/nftban/bin /usr/lib/nftban/cli /etc/nftban
          sudo cp bin/nftban-core /usr/lib/nftban/bin/
          # Same path and mode the packages install (build_nftban.sh: bin/nftban-validate)
          sudo install -m 0755 bin/nftban-validate /usr/lib/nftban/bin/nftban-validate
          sudo cp -r cli/lib/nftban/* /usr/lib/nftban/
          sudo cp cli/sbin/nftban /usr/sbin/nftban
          sudo chmod +x /usr/sbin/nftban /usr/lib/nftban/bin/nftban-core
          # Minimal config
          sudo cp -r etc/nftban/* /etc/nftban/ 2>/dev/null || true
          # The packages install the main config from install/config/ (not etc/),
          # mode 0640 root:nftban; without it the config check C1 skipped. The
          # runner user is not an operator (not in group nftban), so every CLI
          # step below runs as root, as the installed product is operated.
          sudo install -m 0640 install/config/nftban.conf /etc/nftban/nftban.conf
          # VERSION file
          sudo cp VERSION /usr/lib/nftban/

      - name: Smoke test — version
        run: |
          # CLI may exit non-zero without daemon — check output, not exit code
          OUTPUT=$(sudo nftban version 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "version" || { echo "::error::version produced no output"; exit 1; }

      - name: Smoke test — version JSON
        run: |
          # CLI wrapper appends "# NFTBAN_CMD_EXIT: ..." to stdout — strip before jq
          sudo nftban version --json 2>/dev/null | grep -v '^#' > /tmp/version.json || true
          if [[ -s /tmp/version.json ]]; then
            if jq empty /tmp/version.json 2>/dev/null; then
              echo "✓ version --json: valid JSON"
              jq . /tmp/version.json
            else
              echo "::warning::version --json output is not valid JSON"
              cat /tmp/version.json
            fi
          else
            echo "[SKIP] version --json produced no output"
          fi

      - name: Smoke test — help
        run: |
          OUTPUT=$(sudo nftban help 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "usage\|command\|help" || { echo "::error::help produced no output"; exit 1; }

      - name: Smoke test — fhs verify
        run: sudo nftban fhs verify 2>&1 | head -20 || true

      - name: "G20 Smoke Gate — registry-driven smoke"
        run: |
          # Root, like the installed product. Daemon/metrics/module checks still
          # SKIP here (no systemd daemon) and are printed NOT_IN_SCOPE; the checks
          # whose prerequisites this job provisions (validator, config) must PASS.
          # skip != pass: 0 pass or a required SKIP fails (scripts/ci/check-smoke-g20.sh).
          sudo bin/nftban-core smoke --json > /tmp/g20.json 2> /tmp/g20.err || true
          cat /tmp/g20.json
          cat /tmp/g20.err
          bash scripts/ci/check-smoke-g20.sh /tmp/g20.json
