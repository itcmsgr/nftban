# =============================================================================
# NFTBan Tunnel Suspicion Module Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# meta:name="tunnel_main_conf"
# meta:type="config"
# meta:version="1.0.0"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:description="DNS tunnel suspicion monitoring configuration"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/tunnel/main.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# **Description**
# Configure DNS tunnel suspicion monitoring. This module analyzes DNS query
# logs from local resolvers (BIND, Unbound, dnsmasq, systemd-resolved) to
# detect potential DNS tunneling activity (iodine, dnscat2, dns2tcp, etc.).
#
# IMPORTANT: This module is ADVISORY ONLY. It never blocks or bans any IP.
# It produces suspicion scores and reports for operator review.
#
# **State Location**
# State files stored in: /var/lib/nftban/tunnel/
# Logs written to: /var/log/nftban/tunnel.log
# =============================================================================

# Enable/disable tunnel suspicion monitoring
# Note: Advisory-only — never blocks or bans. Safe to enable.
NFTBAN_TUNNEL_ENABLED="NO"

# Scan interval (how often the timer runs, in minutes)
# Default: 5 minutes (via systemd timer)
NFTBAN_TUNNEL_SCAN_INTERVAL="5"

# =============================================================================
# DNS LOG SOURCES
# =============================================================================
# Auto-detect: Module tries each resolver in order (BIND → Unbound → dnsmasq → resolved)
# Override: Set to specific resolver if auto-detect picks wrong one
# Values: auto, bind, unbound, dnsmasq, resolved
NFTBAN_TUNNEL_DNS_SOURCE="auto"

# Custom DNS log paths (override auto-detection)
# Leave empty for auto-detection
NFTBAN_TUNNEL_BIND_LOG=""
NFTBAN_TUNNEL_UNBOUND_LOG=""
NFTBAN_TUNNEL_DNSMASQ_LOG=""
# systemd-resolved uses journalctl (no log file)

# =============================================================================
# SCORING THRESHOLDS
# =============================================================================
# Each signal contributes to a 0-100 composite score per source IP.
# Score = weighted sum of normalized signal values.

# Suspicion levels (score ranges)
NFTBAN_TUNNEL_THRESHOLD_LOW="30"       # 30-59: Low suspicion (informational)
NFTBAN_TUNNEL_THRESHOLD_MEDIUM="60"    # 60-79: Medium suspicion (review)
NFTBAN_TUNNEL_THRESHOLD_HIGH="80"      # 80-100: High suspicion (investigate)

# =============================================================================
# SIGNAL WEIGHTS (must sum to 100)
# =============================================================================
# Adjust weights to tune which signals matter most.
# Default weights are calibrated for common DNS tunnel tools.

# Signal 1: Label Entropy — high-entropy labels suggest encoded data
# iodine/dnscat2 encode data as base32/base64/hex in subdomain labels
NFTBAN_TUNNEL_WEIGHT_ENTROPY="25"

# Signal 2: TXT Record Frequency — excessive TXT queries suggest data exfil
# DNS tunnels use TXT records as the primary data channel (high capacity)
NFTBAN_TUNNEL_WEIGHT_TXT_FREQ="20"

# Signal 3: Subdomain Depth — deeply nested subdomains suggest encoding
# Tunneling tools chain multiple labels: data.data.data.tunnel.example.com
NFTBAN_TUNNEL_WEIGHT_SUBDOMAIN_DEPTH="20"

# Signal 4: Query Volume — abnormally high query rate from single source
# DNS tunnels generate far more queries than normal browsing
NFTBAN_TUNNEL_WEIGHT_QUERY_VOLUME="20"

# Signal 5: NXDOMAIN Ratio — high NXDOMAIN rate suggests probing/encoding
# Encoded labels often hit non-existent domains
NFTBAN_TUNNEL_WEIGHT_NXDOMAIN_RATIO="15"

# =============================================================================
# SIGNAL PARAMETERS
# =============================================================================

# Entropy threshold: labels with entropy above this are suspicious (bits/char)
# Normal domains: ~2.5-3.5, DNS tunnels: ~3.8-4.5+
NFTBAN_TUNNEL_ENTROPY_THRESHOLD="3.5"

# TXT query ratio threshold: fraction of TXT queries vs total (0.0-1.0)
# Normal: <0.05, DNS tunnels: >0.3
NFTBAN_TUNNEL_TXT_RATIO_THRESHOLD="0.15"

# Subdomain depth threshold: labels deeper than this are suspicious
# Normal: 2-3 levels, DNS tunnels: 5+
NFTBAN_TUNNEL_SUBDOMAIN_DEPTH_THRESHOLD="4"

# Query volume threshold: queries per source IP per scan interval
# Normal: <50 in 5 min, DNS tunnels: >200 in 5 min
NFTBAN_TUNNEL_QUERY_VOLUME_THRESHOLD="100"

# NXDOMAIN ratio threshold: fraction of NXDOMAIN responses (0.0-1.0)
# Normal: <0.1, DNS tunnels: >0.3
NFTBAN_TUNNEL_NXDOMAIN_RATIO_THRESHOLD="0.20"

# =============================================================================
# ALERTING
# =============================================================================

# Send email alert when HIGH suspicion detected
NFTBAN_TUNNEL_ALERT_ON_HIGH="YES"

# Alert email address (defaults to main nftban alert email)
NFTBAN_TUNNEL_ALERT_EMAIL=""

# Minimum interval between alerts for same source IP (seconds)
# Prevents alert storms during sustained tunneling
NFTBAN_TUNNEL_ALERT_COOLDOWN="3600"

# =============================================================================
# STATE MANAGEMENT
# =============================================================================

# How long to keep state for inactive source IPs (hours)
NFTBAN_TUNNEL_STATE_TTL="24"

# Maximum number of tracked source IPs (memory safety)
NFTBAN_TUNNEL_MAX_TRACKED_IPS="1000"

# State directory
NFTBAN_TUNNEL_STATE_DIR="${NFTBAN_DATA_DIR:-/var/lib/nftban}/tunnel"

# Log file
NFTBAN_TUNNEL_LOG="${NFTBAN_LOG_DIR:-/var/log/nftban}/tunnel.log"

# =============================================================================
# EXCLUSIONS
# =============================================================================

# Domains to exclude from analysis (comma-separated, glob patterns allowed)
# Exclude known high-entropy CDN domains to reduce false positives
NFTBAN_TUNNEL_EXCLUDE_DOMAINS=""

# Example:
# NFTBAN_TUNNEL_EXCLUDE_DOMAINS="*.cdn.cloudflare.com,*.akamaiedge.net,*.cloudfront.net"

# Source IPs to exclude from analysis (comma-separated, CIDR allowed)
NFTBAN_TUNNEL_EXCLUDE_IPS=""

# Example:
# NFTBAN_TUNNEL_EXCLUDE_IPS="127.0.0.1,::1,10.0.0.0/8"
