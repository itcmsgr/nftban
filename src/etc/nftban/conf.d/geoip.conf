# =============================================================================
# NFTBan GeoIP Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# File: /etc/nftban/conf.d/geoip.conf
# Purpose: Configure MaxMind GeoIP database integration
# =============================================================================

# MaxMind License Key (required for GeoLite2 database download)
# Get your free license key at: https://www.maxmind.com/en/geolite2/signup
MAXMIND_LICENSE_KEY="your_license_key_here"

# GeoIP Database Location
GEOIP_DATABASE="/var/lib/nftban/geoip/GeoLite2-City.mmdb"
GEOIP_DATABASE_DIR="/var/lib/nftban/geoip"

# Auto-Update Settings
GEOIP_AUTO_UPDATE="true"
GEOIP_UPDATE_INTERVAL="weekly"  # daily, weekly, monthly

# Database Edition (GeoLite2-City includes country + city data)
GEOIP_EDITION="GeoLite2-City"

# Download Settings
GEOIP_DOWNLOAD_URL="https://download.maxmind.com/app/geoip_download"
GEOIP_TIMEOUT="300"  # seconds

# Binary Location
GEOIP_BINARY="/usr/sbin/nftban-geoip"

# Enable GeoIP Lookups
GEOIP_ENABLED="true"

# Cache Settings
GEOIP_CACHE_ENABLED="true"
GEOIP_CACHE_TTL="3600"  # 1 hour

# =============================================================================
# USAGE NOTES
# =============================================================================
#
# 1. Initial Setup:
#    sudo nftban geoip download
#
# 2. Enable Auto-Updates:
#    sudo systemctl enable --now nftban-geoip-update.timer
#
# 3. Manual Update:
#    sudo nftban geoip update
#
# 4. Check Status:
#    sudo nftban geoip status
#
# 5. Test Lookup:
#    nftban geoip lookup 8.8.8.8
#
# =============================================================================
