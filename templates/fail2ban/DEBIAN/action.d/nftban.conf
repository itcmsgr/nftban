# =============================================================================
# NFTBan Fail2Ban Action - Smart Ban with Whitelist Check
# Version: 2.0.0 (v0.9.0+ with universal search)
# =============================================================================
# This action checks whitelist BEFORE banning to prevent blocking trusted IPs
# Uses universal search module for consistent IP management
# =============================================================================

[Definition]

# Option: actionstart
# Notes: command executed on startup
actionstart = 

# Option: actionstop
# Notes: command executed on shutdown
actionstop = 

# Option: actioncheck
# Notes: command executed before each actionban to verify setup
actioncheck = 

# Option: actionban
# Notes: command executed when banning an IP with WHITELIST CHECK
actionban = /usr/local/bin/nftban --fail2ban-ban <ip> --jail=<name>

# Option: actionunban
# Notes: command executed when unbanning an IP
actionunban = /usr/local/bin/nftban --fail2ban-unban <ip> --jail=<name>

[Init]
# Default name of the chain
name = default

