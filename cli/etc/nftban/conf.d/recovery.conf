#
# This configuration file controls the emergency recovery and rollback system
# that prevents permanent SSH lockout after server reboot or rule changes.
#
# See: /usr/share/doc/nftban/RECOVERY_GUIDE.md
# =============================================================================

# =============================================================================
# COMMIT-CONFIRM SAFETY SYSTEM
# =============================================================================
# NFTBan uses a "commit-confirm" pattern (similar to JunOS) to protect against
# SSH lockout. When you apply new rules, they activate immediately but must be
# confirmed within the grace period or they automatically rollback.
#
# How it works:
#   1. Apply rules with: nftban-apply
#   2. Verify SSH/connectivity works
#   3. Confirm with: nftban-confirm (within grace period)
#   4. If not confirmed, automatic rollback to last-known-good rules
#
# This prevents permanent lockouts from bad firewall rules!

# Enable commit-confirm safety system
# When enabled, all rule changes require explicit confirmation
# DEFAULT: "true" - always use safety system (recommended!)
# Set to "false" ONLY if you have alternative recovery methods (console access)
NFTBAN_RECOVERY_ENABLED="true"

# Grace period before automatic rollback (seconds)
# How long you have to confirm new rules before they auto-rollback
# Recommended values:
#   - 300 (5 minutes) - Good for most servers
#   - 600 (10 minutes) - Extra time for complex testing
#   - 120 (2 minutes) - Quick testing on local VMs
# DEFAULT: 300 seconds (5 minutes)
NFTBAN_REBOOT_GRACE_PERIOD="300"

# SSH connectivity test before applying rules
# Performs local SSH connection test before activating firewall
# If test fails, rules are NOT applied (fail-safe)
# CRITICAL SAFETY FEATURE - keeps SSH accessible
# DEFAULT: "true" - always test (recommended!)
NFTBAN_SSH_TEST_BEFORE_APPLY="true"

# SSH test port (default: 22)
# Port to test for SSH connectivity during safety checks
# Change if you run SSH on non-standard port
NFTBAN_SSH_TEST_PORT="22"

# =============================================================================
# AUTOMATIC ROLLBACK ON BOOT
# =============================================================================
# These settings control what happens when the server reboots

# Auto-reset firewall rules on boot (before applying nftban rules)
# DEFAULT: "false" - rules persist (normal production behavior)
# Set to "true" ONLY during testing to start fresh each boot
# WARNING: In production, this removes all protection after reboot!
NFTBAN_RESET_ON_BOOT="false"

# Auto-apply rules after reboot with commit-confirm
# Automatically apply nftban rules after grace period
# If SSH test fails during application, rules are NOT applied (fail-safe)
# DEFAULT: "true" - apply rules automatically (with safety checks)
NFTBAN_REBOOT_AUTO_APPLY="true"

# =============================================================================
# ALERTING & NOTIFICATIONS
# =============================================================================

# Send alert if rollback activates
# Notifies admin when rules were rolled back (not confirmed in time)
# Requires mail notification to be configured (see mail.conf)
# DEFAULT: "true" - notify on rollback
NFTBAN_ROLLBACK_ALERT="true"

# Alert email address for recovery events
# Leave empty to use default from mail.conf (MAIL_TO)
# Set specific address for critical recovery alerts
NFTBAN_ROLLBACK_ALERT_EMAIL=""

# =============================================================================
# EMERGENCY RECOVERY OPTIONS
# =============================================================================

# Emergency rule reset command (via console/IPMI only)
# This bypasses all safety checks and clears all rules immediately
# DEFAULT: "false" - disable emergency reset in production
# Enable ONLY if you have console/IPMI access and need emergency recovery
NFTBAN_EMERGENCY_RESET_ENABLED="false"

# Baseline ruleset for emergency recovery
# A minimal "known safe" ruleset that allows SSH and management access
# Used when backup rules are missing or corrupted
# DEFAULT: "/etc/nftban/baseline.nft"
NFTBAN_BASELINE_RULES="/etc/nftban/baseline.nft"

# =============================================================================
# KERNEL COMMAND LINE KILL-SWITCH
# =============================================================================
# You can disable nftban entirely at boot by adding to kernel command line:
#   nftban=disabled
#
# How to use:
#   1. At GRUB menu, press 'e' to edit boot entry
#   2. Add 'nftban=disabled' to kernel line
#   3. Press Ctrl+X to boot
#   4. NFTBan will not start, SSH will work
#   5. Fix firewall rules, reboot normally
#
# For repeated use, create a GRUB menu entry with nftban=disabled

# =============================================================================
# BACKUP & RESTORE
# =============================================================================

# Backup ruleset location
# Last-known-good ruleset saved before each rule change
# DEFAULT: "/var/lib/nftban/backup.rules"
NFTBAN_BACKUP_RULES="/var/lib/nftban/backup.rules"

# Keep backup history
# Save multiple backup generations for rollback
# DEFAULT: "3" - keep 3 most recent backups
NFTBAN_BACKUP_GENERATIONS="3"

# =============================================================================
# ADVANCED OPTIONS
# =============================================================================

# Rollback check interval (seconds)
# How often the timer checks if rollback deadline passed
# DEFAULT: 15 - check every 15 seconds
# Lower = more responsive, Higher = less overhead
NFTBAN_ROLLBACK_CHECK_INTERVAL="15"

# Rollback flag file location
# Runtime file that tracks rollback deadline
# DEFAULT: "/run/nftban.rollback.deadline"
NFTBAN_ROLLBACK_FLAG="/run/nftban.rollback.deadline"

# =============================================================================
# TESTING & LAB ENVIRONMENTS
# =============================================================================
# For lab/testing environments, you may want more aggressive safety:

# Example lab server config (uncomment to use):
# NFTBAN_REBOOT_GRACE_PERIOD="600"        # 10 minutes to test
# NFTBAN_RESET_ON_BOOT="true"             # Start fresh each boot
# NFTBAN_ROLLBACK_CHECK_INTERVAL="10"     # Check every 10 seconds

# Example production server config (recommended):
# NFTBAN_REBOOT_GRACE_PERIOD="300"        # 5 minutes to confirm
# NFTBAN_RESET_ON_BOOT="false"            # Persistent rules
# NFTBAN_SSH_TEST_BEFORE_APPLY="true"     # Always test SSH
# NFTBAN_ROLLBACK_ALERT="true"            # Alert on issues

# =============================================================================
# CONSOLE/IPMI RECOVERY PROCEDURES
# =============================================================================
# If you get locked out and cannot SSH:
#
# 1. Access console (IPMI/iDRAC/iLO/VNC/Serial Console)
# 2. Log in as root
# 3. Check rules: nft list ruleset
# 4. Emergency options:
#    a) Rollback to backup:   nftban-rollback --force
#    b) Flush all rules:      nft flush ruleset
#    c) Load baseline:        nft -f /etc/nftban/baseline.nft
# 5. Fix issue, test SSH works
# 6. Reboot with: nftban=disabled (optional, to skip nftban at boot)
#
# See RECOVERY_GUIDE.md for detailed procedures
# =============================================================================

# =============================================================================
# EXAMPLE SCENARIOS
# =============================================================================
#
# Scenario 1: Deploying new rules on production server
#   1. sudo nftban-apply                # Apply with safety
#   2. Test SSH from another terminal   # Verify connectivity
#   3. sudo nftban-confirm              # Confirm within 5 minutes
#
# Scenario 2: Testing rules on lab server
#   1. sudo nftban-apply                # Apply with safety
#   2. Wait and test thoroughly
#   3. If good: sudo nftban-confirm
#   4. If bad: just wait, auto-rollback in 5 minutes
#
# Scenario 3: Emergency - locked out
#   1. Access console (IPMI/VNC)
#   2. sudo nftban-rollback --force     # Immediate rollback
#   3. SSH should work now
#
# Scenario 4: Server reboot with bad rules
#   1. Reboot with nftban=disabled in GRUB
#   2. Fix rules
#   3. Reboot normally
#
# =============================================================================

# =============================================================================
# INTEGRATION WITH OTHER TOOLS
# =============================================================================

# NFTBan ban sets
# Manual bans and blacklist entries are NOT affected by rollback
# They persist in separate nftables sets

# Integration with threat feeds
# Feed-based blocks are NOT affected by rollback
# They persist in separate nftables sets
# See: feeds.conf

# What gets rolled back:
#   - Main firewall rules (input/forward/output chains)
#   - Port access rules
#   - Rate limits and connection tracking
#   - Custom user rules
#
# What DOES NOT get rolled back:
#   - Manual bans and blacklist entries (separate set)
#   - Threat feed blocks (separate set)
#   - Whitelist entries (separate set)

