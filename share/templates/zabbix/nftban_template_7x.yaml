      # =======================================================================
      # DISCOVERY RULES (LLD)
      # =======================================================================
      discovery_rules:
        # --- Module Discovery ---
        - uuid: lld1a2b3c4d5e6f7a8b9c0d1e2f3a4b5
          name: 'NFTBan: Module discovery'
          type: TRAP
          key: nftban.discovery.modules
          description: 'Discover all NFTBan modules'
          item_prototypes:
            - uuid: lip1b2c3d4e5f6a7b8c9d0e1f2a3b4c5
              name: 'NFTBan: Module {#MODULE} status'
              type: TRAP
              key: 'nftban.module.status[{#MODULE}]'
              value_type: SIGNED
              description: 'Module {#MODULE} status: 1=ok, 0=error, -1=disabled'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
            - uuid: lip2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
              name: 'NFTBan: Module {#MODULE} bans'
              type: TRAP
              key: 'nftban.module.bans[{#MODULE}]'
              value_type: UNSIGNED
              description: 'Bans from module {#MODULE}'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
          trigger_prototypes:
            - uuid: ltp1d4e5f6a7b8c9d0e1f2a3b4c5d6e7
              expression: 'last(/NFTBan/nftban.module.status[{#MODULE}])=0'
              name: 'NFTBan module {#MODULE} failed'
              priority: HIGH
              description: 'Module {#MODULE} is in error state.'

        # --- Feed Discovery ---
        - uuid: lld2b3c4d5e6f7a8b9c0d1e2f3a4b5c6
          name: 'NFTBan: Feed discovery'
          type: TRAP
          key: nftban.discovery.feeds
          description: 'Discover configured threat feeds'
          item_prototypes:
            - uuid: lip3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
              name: 'NFTBan: Feed {#FEED} status'
              type: TRAP
              key: 'nftban.feed.status[{#FEED}]'
              value_type: UNSIGNED
              description: 'Feed {#FEED} status: 1=ok, 0=error'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: lip4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
              name: 'NFTBan: Feed {#FEED} IPs'
              type: TRAP
              key: 'nftban.feed.ips[{#FEED}]'
              value_type: UNSIGNED
              description: 'IPs loaded from {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: lip4f6a7b8c9d0e1f2a3b4c5d6e7f8a9
              name: 'NFTBan: Feed {#FEED} last update'
              type: TRAP
              key: 'nftban.feed.last_update[{#FEED}]'
              value_type: UNSIGNED
              units: unixtime
              description: 'Last update timestamp for {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
          trigger_prototypes:
            - uuid: ltp2e5f6a7b8c9d0e1f2a3b4c5d6e7f8
              expression: 'last(/NFTBan/nftban.feed.status[{#FEED}])=0'
              name: 'NFTBan feed {#FEED} failed'
              priority: WARNING
              description: 'Threat feed {#FEED} failed to load.'

        # --- Country Discovery ---
        - uuid: lld3c4d5e6f7a8b9c0d1e2f3a4b5c6d7
          name: 'NFTBan: Country discovery'
          type: TRAP
          key: nftban.discovery.countries
          description: 'Discover countries with ban activity'
          item_prototypes:
            - uuid: lip5f6a7b8c9d0e1f2a3b4c5d6e7f8a9
              name: 'NFTBan: Country {#COUNTRY} bans'
              type: TRAP
              key: 'nftban.country.bans[{#COUNTRY}]'
              value_type: UNSIGNED
              description: 'Active bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'
            - uuid: lip6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
              name: 'NFTBan: Country {#COUNTRY} bans (24h)'
              type: TRAP
              key: 'nftban.country.bans_24h[{#COUNTRY}]'
              value_type: UNSIGNED
              description: '24h bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'

      # =======================================================================
      # DASHBOARDS (Zabbix 7.0 format)
      # =======================================================================
      dashboards:
        - uuid: dash1a2b3c4d5e6f7a8b9c0d1e2f3a4b5
          name: 'NFTBan Overview'
          auto_start: 'YES'
          pages:
            - name: 'Main'
              widgets:
                - type: item
                  name: 'Status'
                  width: '6'
                  height: '2'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.status
                        host: NFTBan
                - type: item
                  name: 'Mode'
                  x: '6'
                  width: '6'
                  height: '2'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.mode
                        host: NFTBan
                - type: item
                  name: 'Version'
                  x: '12'
                  width: '6'
                  height: '2'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.version
                        host: NFTBan
                - type: item
                  name: 'Active Bans'
                  x: '18'
                  width: '6'
                  height: '2'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.active.count
                        host: NFTBan
                - type: graph
                  name: 'Ban Activity (24h)'
                  y: '2'
                  width: '12'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.bans.24h
                        host: NFTBan
                - type: graph
                  name: 'Memory Usage'
                  x: '12'
                  y: '2'
                  width: '12'
                  height: '5'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.memory.rss
                        host: NFTBan
                - type: graph
                  name: 'Pressure Scores'
                  y: '7'
                  width: '12'
                  height: '4'
                  fields:
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.watchdog.cpu_score
                        host: NFTBan
                    - type: ITEM
                      name: itemid
                      value:
                        key: nftban.watchdog.mem_score
                        host: NFTBan
                - type: problems
                  name: 'Problems'
                  x: '12'
                  y: '7'
                  width: '12'
                  height: '4'
                  fields:
                    - type: STRING
                      name: tags.0.tag
                      value: component
                    - type: INTEGER
                      name: severities
                      value: '62'
