# Fail2ban filter for ModSecurity v3 (libmodsecurity3)
# Detects blocked requests in ModSecurity JSON audit logs
#
# Author: NFTBan Project
# Date: 2025-10-30

[Definition]

# ModSecurity v3 logs in JSON format
# Match client_ip and http_code 403 (Forbidden) or 406 (Not Acceptable)
#
# Pattern 1: General blocked requests (403/406)
# Pattern 2: Specific xmlrpc.php attacks (high severity)
failregex = ^\s*\{\s*"transaction":\s*\{\s*"client_ip":"<HOST>",.*?"http_code":(?:403|406),.*
            ^.*"client_ip":"<HOST>",.*?"uri":"//xmlrpc\.php".*

# ModSecurity timestamp format in JSON logs
# Example: "Mon Oct 30 14:23:45 2025"
datepattern = %%a %%b  %%d %%H:%%M:%%S %%Y

# Optional: Ignore known false positives
ignoreregex =

[Init]
# Default values
# maxretry = 9
# findtime = 600 (10 minutes)
# bantime = 3600 (1 hour)
