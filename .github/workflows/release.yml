# =============================================================================
# NFTBan v1.0.0 - GitHub Actions Release Workflow
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Automated package building and release on version tags
# Triggers: Push to v* tags (e.g., v1.0.0, v1.0.1)
#
# What this does:
#   1. Builds Go binaries (nftban-core, nftban-api-server) for x86_64
#   2. Creates RPM packages for EL9, EL10
#   3. Creates DEB packages for Ubuntu 22.04/24.04, Debian 12/13
#   4. Generates SHA256SUMS for all artifacts
#   5. Creates distro-specific package names (nftban-el9-x86_64.rpm, etc.)
#   6. Creates MANIFEST.txt (file inventory)
#   7. Generates SBOM (sbom.spdx.json) for supply-chain compliance
#   8. Uploads everything to GitHub Release
# =============================================================================

name: Release Packages

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal top-level permissions (OpenSSF Scorecard compliance)
permissions: read-all

jobs:
  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.24'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la bin/

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          - distro: el10
            container: almalinux:10
            name_suffix: el10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            set -e  # Exit on any error

            # Install build dependencies (curl required for yq download)
            dnf -y install --allowerasing rpm-build rpmdevtools tar gzip systemd-rpm-macros make curl

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh rpm || { echo '❌ RPM build failed!'; exit 1; }

            # Verify RPM was created
            if ! ls /workspace/build/packages/RPMS/*/*.rpm 2>/dev/null; then
              echo '❌ No RPM files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          echo "=== Looking for RPM files ==="
          find build -name "*.rpm" -type f 2>/dev/null || echo "No RPM files found"

          RPM_FOUND=0
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Found RPM: $rpm"
              cp "$rpm" "dist/packages/nftban-${{ matrix.name_suffix }}-x86_64.rpm"
              RPM_FOUND=1
            fi
          done

          if [[ $RPM_FOUND -eq 0 ]]; then
            echo "❌ FATAL: No RPM files found in build/packages/RPMS/"
            echo "Build directory contents:"
            ls -laR build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi

          echo "=== dist/packages contents ==="
          ls -la dist/packages/

      # Install rpm2cpio for validation (not available on Ubuntu by default)
      - name: Install rpm2cpio
        run: sudo apt-get update && sudo apt-get install -y rpm2cpio cpio

      # CRITICAL: Validate packaged binaries match source binaries
      # This prevents stale/cached binaries from being packaged
      - name: Validate RPM contains correct binaries
        run: |
          echo "=== Validating RPM binary integrity ==="
          RPM_FILE="dist/packages/nftban-${{ matrix.name_suffix }}-x86_64.rpm"

          if [[ ! -f "$RPM_FILE" ]]; then
            echo "❌ FATAL: RPM file not found: $RPM_FILE"
            exit 1
          fi

          # Extract binaries from RPM
          mkdir -p /tmp/rpm-check
          cd /tmp/rpm-check
          rpm2cpio "$GITHUB_WORKSPACE/$RPM_FILE" | cpio -idm 2>/dev/null || {
            echo "❌ FATAL: Failed to extract RPM"
            exit 1
          }

          # Compare hashes with source binaries
          for binary in nftband nftban-core; do
            SOURCE_HASH=$(sha256sum "$GITHUB_WORKSPACE/bin/$binary" | cut -d' ' -f1)
            PKG_HASH=$(sha256sum "./usr/lib/nftban/bin/$binary" | cut -d' ' -f1)

            echo "Checking $binary:"
            echo "  Source: $SOURCE_HASH"
            echo "  Package: $PKG_HASH"

            if [[ "$SOURCE_HASH" != "$PKG_HASH" ]]; then
              echo "❌ FATAL: $binary hash mismatch in ${{ matrix.name_suffix }} RPM!"
              echo "The packaged binary does not match the freshly built binary."
              echo "This indicates stale binaries were packaged."
              exit 1
            fi
            echo "  ✓ Hash matches"
          done

          echo "✅ All RPM binaries validated successfully"
          rm -rf /tmp/rpm-check

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12
          - distro: debian13
            container: debian:trixie
            name_suffix: debian13

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            set -e  # Exit on any error

            # Install build dependencies (with retry for transient mirror issues)
            for i in 1 2 3; do
              apt-get update && apt-get install -y dpkg-dev build-essential file curl && break
              echo \"Retry \$i: apt-get failed, retrying in 5s...\"
              sleep 5
            done

            # Build DEB
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh deb || { echo '❌ DEB build failed!'; exit 1; }

            # Verify DEB was created
            if ! ls /workspace/build/packages/*.deb 2>/dev/null; then
              echo '❌ No DEB files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          DEB_FOUND=0
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Found DEB: $deb"
              cp "$deb" "dist/packages/nftban-${{ matrix.name_suffix }}-amd64.deb"
              DEB_FOUND=1
            fi
          done

          if [[ $DEB_FOUND -eq 0 ]]; then
            echo "❌ FATAL: No DEB files found in build/packages/"
            ls -laR build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi

          ls -la dist/packages/

      # CRITICAL: Validate packaged binaries match source binaries
      - name: Validate DEB contains correct binaries
        run: |
          echo "=== Validating DEB binary integrity ==="
          DEB_FILE="dist/packages/nftban-${{ matrix.name_suffix }}-amd64.deb"

          # Extract binaries from DEB
          mkdir -p /tmp/deb-check
          dpkg-deb -x "$DEB_FILE" /tmp/deb-check

          # Compare hashes with source binaries
          for binary in nftband nftban-core; do
            SOURCE_HASH=$(sha256sum "bin/$binary" | cut -d' ' -f1)
            PKG_HASH=$(sha256sum "/tmp/deb-check/usr/lib/nftban/bin/$binary" | cut -d' ' -f1)

            echo "Checking $binary:"
            echo "  Source: $SOURCE_HASH"
            echo "  Package: $PKG_HASH"

            if [[ "$SOURCE_HASH" != "$PKG_HASH" ]]; then
              echo "❌ FATAL: $binary hash mismatch in ${{ matrix.name_suffix }} DEB!"
              echo "The packaged binary does not match the freshly built binary."
              exit 1
            fi
            echo "  ✓ Hash matches"
          done

          echo "✅ All DEB binaries validated successfully"
          rm -rf /tmp/deb-check

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

  # ==========================================================================
  # CREATE RELEASE
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/edit GitHub Releases
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate VERSION file matches git tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match git tag (v$TAG_VERSION). Update the VERSION file before tagging a release."
            exit 1
          fi
          echo "VERSION file ($FILE_VERSION) matches git tag (v$TAG_VERSION)"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/
          # Continue even if some artifacts are missing (build failures)
          # The consolidate step will report what's actually available
          merge-multiple: true

      - name: Consolidate packages
        run: |
          mkdir -p dist/packages dist/binaries

          # Copy all RPM packages
          find all-packages -name "*.rpm" -exec cp {} dist/packages/ \;

          # Copy all DEB packages
          find all-packages -name "*.deb" -exec cp {} dist/packages/ \;

          # Copy raw Go binaries that SLSA can't build (require CGO/PAM)
          # NOTE: nftban-core and nftban-ui are built by SLSA workflow with provenance
          if [ -d "all-packages" ]; then
            for binary in nftband nftban-ui-auth; do
              if [ -f "all-packages/${binary}" ]; then
                cp "all-packages/${binary}" "dist/packages/${binary}-linux-amd64"
                chmod +x "dist/packages/${binary}-linux-amd64"
              fi
            done
          fi

          echo "=== All packages ==="
          ls -lh dist/packages/

      - name: Clean up old release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          # CRITICAL FIX: Delete ALL existing assets that we're about to upload
          # This ensures re-runs of the workflow always upload fresh binaries
          # Without this, softprops/action-gh-release silently skips existing files
          ASSETS_TO_REPLACE=(
            "nftban-el9-x86_64.rpm"
            "nftban-el10-x86_64.rpm"
            "nftban-ubuntu22.04-amd64.deb"
            "nftban-ubuntu24.04-amd64.deb"
            "nftban-debian12-amd64.deb"
            "nftban-debian13-amd64.deb"
            "nftband-linux-amd64"
            "nftban-ui-auth-linux-amd64"
            "SHA256SUMS"
            "MANIFEST.txt"
            "VERIFY.txt"
            "sbom.spdx.json"
          )

          echo "Deleting existing assets to ensure fresh upload..."
          for asset in "${ASSETS_TO_REPLACE[@]}"; do
            echo "  Deleting: $asset"
            gh release delete-asset "$VERSION" "$asset" --yes 2>/dev/null || true
          done

          # Also clean up unexpected assets
          EXPECTED_PACKAGES=(
            "${ASSETS_TO_REPLACE[@]}"
            "nftban-core-linux-amd64"
            "nftban-ui-linux-amd64"
            "nftban-core-linux-amd64.intoto.jsonl"
            "nftban-ui-linux-amd64.intoto.jsonl"
          )

          CURRENT_ASSETS=$(gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in $CURRENT_ASSETS; do
            if [[ ! " ${EXPECTED_PACKAGES[*]} " =~ " ${asset} " ]]; then
              echo "Removing unexpected asset: $asset"
              gh release delete-asset "$VERSION" "$asset" --yes || true
            fi
          done

      - name: Generate SHA256SUMS
        run: |
          cd dist/packages
          rm -f SHA256SUMS

          # Generate checksums for all packages and binaries
          shopt -s nullglob
          packages=(*.rpm *.deb)
          binaries=(nftban-core-linux-amd64 nftband-linux-amd64 nftban-ui-linux-amd64 nftban-ui-auth-linux-amd64)

          # Combine all files that exist
          all_files=()
          for f in "${packages[@]}" "${binaries[@]}"; do
            [[ -f "$f" ]] && all_files+=("$f")
          done

          if [ ${#all_files[@]} -gt 0 ]; then
            sha256sum "${all_files[@]}" | sort > SHA256SUMS
            echo "=== SHA256SUMS ==="
            cat SHA256SUMS
          else
            echo "WARNING: No packages or binaries found"
            touch SHA256SUMS
          fi

      - name: Generate MANIFEST.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > MANIFEST.txt << MANIFEST_EOF
          NFTBan ${VERSION} - Release Artifacts
          ===================================

          RPM Packages (EL Family):
            nftban-el9-x86_64.rpm      Rocky / Alma / RHEL / CentOS Stream 9
            nftban-el10-x86_64.rpm     Rocky / Alma / RHEL / CentOS Stream 10

          DEB Packages (Ubuntu + Debian):
            nftban-ubuntu24.04-amd64.deb   Ubuntu 24.04 (Noble) - Tier 0
            nftban-debian12-amd64.deb      Debian 12 (Bookworm) - Tier 0
            nftban-debian13-amd64.deb      Debian 13 (Trixie) - Tier 1
            nftban-ubuntu22.04-amd64.deb   Ubuntu 22.04 (Jammy) - Tier 2

          Package Sizes:
          MANIFEST_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' MANIFEST.txt

          for file in *.rpm *.deb; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              printf "  %-35s %12d bytes\n" "$file" "$size" >> MANIFEST.txt
            fi
          done

          echo "=== MANIFEST.txt ==="
          cat MANIFEST.txt

      - name: Create VERIFY.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > VERIFY.txt << 'VERIFY_EOF'
          NFTBan - Package Verification & Installation Guide
          ===================================================

          1. Download the package for your distribution:

             # Rocky / Alma / RHEL / CentOS Stream 9
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el9-x86_64.rpm

             # Rocky / Alma / RHEL / CentOS Stream 10
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el10-x86_64.rpm

             # Ubuntu 24.04 (Noble) - Tier 0
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu24.04-amd64.deb

             # Debian 12 (Bookworm) - Tier 0
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-debian12-amd64.deb

             # Debian 13 (Trixie) - Tier 1
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-debian13-amd64.deb

             # Ubuntu 22.04 (Jammy) - Tier 2
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu22.04-amd64.deb

          2. Verify package integrity:

             wget https://github.com/itcmsgr/nftban/releases/latest/download/SHA256SUMS
             sha256sum -c SHA256SUMS --ignore-missing

          3. Install package:

             # Rocky / Alma / RHEL
             sudo dnf install -y nftban-<distro>-x86_64.rpm

             # Ubuntu / Debian
             sudo dpkg -i nftban-<distro>-amd64.deb
             sudo apt-get install -f -y

          4. Enable and verify:

             sudo nftban enable
             nftban --version
             nftban health summary

          Documentation: https://github.com/itcmsgr/nftban#readme
          VERIFY_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' VERIFY.txt

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          path: .
          format: spdx-json
          output-file: dist/packages/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # v1.19.0: Validate SBOM is valid SPDX JSON (R26)
      - name: Validate SBOM
        run: |
          echo "Validating SBOM..."
          if [ ! -f "dist/packages/sbom.spdx.json" ]; then
            echo "::warning::SBOM file not generated by action, creating minimal SBOM"
            VERSION="${GITHUB_REF#refs/tags/v}"
            cat > dist/packages/sbom.spdx.json << SBOM_EOF
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "nftban-${VERSION}",
            "documentNamespace": "https://github.com/itcmsgr/nftban/releases/tag/v${VERSION}",
            "creationInfo": {
              "created": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "creators": ["Tool: anchore/sbom-action"],
              "licenseListVersion": "3.19"
            },
            "packages": [
              {
                "SPDXID": "SPDXRef-Package-nftban",
                "name": "nftban",
                "versionInfo": "${VERSION}",
                "downloadLocation": "https://github.com/itcmsgr/nftban/releases/tag/v${VERSION}",
                "licenseConcluded": "MPL-2.0",
                "licenseDeclared": "MPL-2.0"
              }
            ]
          }
          SBOM_EOF
            sed -i 's/^          //' dist/packages/sbom.spdx.json
          fi
          python3 -c "
          import json, sys
          with open('dist/packages/sbom.spdx.json') as f:
              sbom = json.load(f)
          assert 'spdxVersion' in sbom, 'Missing spdxVersion'
          assert 'packages' in sbom, 'Missing packages'
          print(f'SBOM valid: {sbom[\"spdxVersion\"]}, {len(sbom[\"packages\"])} packages')
          "
          echo "SBOM validation passed"

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          if [ -f "CHANGELOG.md" ]; then
            awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | \
              sed '/^## \[/d' | head -n -1 > dist/packages/RELEASE_NOTES.md || \
              echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          else
            echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          fi

          # Add package list to release notes
          cat >> dist/packages/RELEASE_NOTES.md << 'NOTES_EOF'

          ## Available Packages

          ### RPM (x86_64)
          | Distribution | Package | Tier |
          |--------------|---------|------|
          | Rocky / Alma / RHEL 9 | `nftban-el9-x86_64.rpm` | Tier 0 |
          | Rocky / Alma / RHEL 10 | `nftban-el10-x86_64.rpm` | Tier 1 |

          ### DEB (amd64)
          | Distribution | Package | Tier |
          |--------------|---------|------|
          | Ubuntu 24.04 (Noble) | `nftban-ubuntu24.04-amd64.deb` | Tier 0 |
          | Debian 12 (Bookworm) | `nftban-debian12-amd64.deb` | Tier 0 |
          | Debian 13 (Trixie) | `nftban-debian13-amd64.deb` | Tier 1 |
          | Ubuntu 22.04 (Jammy) | `nftban-ubuntu22.04-amd64.deb` | Tier 2 |
          NOTES_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' dist/packages/RELEASE_NOTES.md

          echo "=== RELEASE_NOTES.md ==="
          cat dist/packages/RELEASE_NOTES.md

      - name: Upload packages to GitHub Release (without SHA256SUMS)
        # NOTE: nftban-core and nftban-ui are uploaded by SLSA workflow with provenance
        # SHA256SUMS is uploaded separately AFTER we verify the uploaded assets match
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            dist/packages/*.rpm
            dist/packages/*.deb
            dist/packages/nftband-linux-amd64
            dist/packages/nftban-ui-auth-linux-amd64
            dist/packages/MANIFEST.txt
            dist/packages/VERIFY.txt
            dist/packages/sbom.spdx.json
          body_path: dist/packages/RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate SHA256SUMS from uploaded release assets
        # CRITICAL FIX (v1.21.3): SHA256SUMS must be computed from the ACTUAL
        # uploaded assets, not from local files. GitHub Release asset storage
        # may reprocess uploads, causing hash mismatches between local files
        # and downloaded assets. This step downloads all assets back from the
        # release, recomputes checksums, and uploads the correct SHA256SUMS.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Regenerating SHA256SUMS from actual release assets..."

          # Wait for assets to be fully available
          sleep 15

          # Download all package assets from the release
          mkdir -p /tmp/release-verify
          cd /tmp/release-verify

          ASSETS=(
            "nftban-el9-x86_64.rpm"
            "nftban-el10-x86_64.rpm"
            "nftban-debian12-amd64.deb"
            "nftban-debian13-amd64.deb"
            "nftban-ubuntu22.04-amd64.deb"
            "nftban-ubuntu24.04-amd64.deb"
            "nftband-linux-amd64"
            "nftban-ui-auth-linux-amd64"
          )

          rm -f SHA256SUMS
          for asset in "${ASSETS[@]}"; do
            echo "Downloading $asset..."
            gh release download "$VERSION" -p "$asset" -O "$asset" --clobber 2>/dev/null || {
              echo "WARN: $asset not found in release (may be from SLSA workflow)"
              continue
            }
          done

          # Also try to get SLSA-built binaries
          for slsa_asset in "nftban-core-linux-amd64" "nftban-ui-linux-amd64"; do
            gh release download "$VERSION" -p "$slsa_asset" -O "$slsa_asset" --clobber 2>/dev/null || true
          done

          # Generate checksums from downloaded files
          shopt -s nullglob
          all_files=(*.rpm *.deb *-linux-amd64)
          if [ ${#all_files[@]} -gt 0 ]; then
            sha256sum "${all_files[@]}" | sort > SHA256SUMS
            echo "=== SHA256SUMS (from downloaded assets) ==="
            cat SHA256SUMS
          else
            echo "ERROR: No assets downloaded!"
            exit 1
          fi

          # Delete old SHA256SUMS and upload the correct one
          gh release delete-asset "$VERSION" "SHA256SUMS" --yes 2>/dev/null || true
          gh release upload "$VERSION" SHA256SUMS --clobber

          echo "SHA256SUMS uploaded successfully (computed from actual release assets)"
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/release-verify

  # ==========================================================================
  # POST-RELEASE VERIFICATION
  # ==========================================================================
  # Downloads packages from GitHub and validates binary integrity
  # This is the FINAL safety check - catches upload failures and stale caches
  verify-release:
    name: Verify Release Integrity
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      # Checkout required for gh CLI to know the repository context
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            VERSION
          sparse-checkout-cone-mode: false

      - name: Wait for release to be available
        run: sleep 30  # GitHub needs time to make assets available

      - name: Download and verify all packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          REPO_DIR="$GITHUB_WORKSPACE"
          echo "=== Verifying release $VERSION ==="

          # Download standalone binary (this is the reference)
          echo "Downloading reference binary..."
          gh release download "$VERSION" -p "nftband-linux-amd64" -O /tmp/nftband-reference
          REFERENCE_HASH=$(sha256sum /tmp/nftband-reference | cut -d' ' -f1)
          REFERENCE_SIZE=$(stat -c%s /tmp/nftband-reference)
          echo "Reference nftband: $REFERENCE_SIZE bytes, hash: $REFERENCE_HASH"

          # Function to check package
          check_package() {
            local pkg_name="$1"
            local pkg_type="$2"
            local extract_cmd="$3"

            echo ""
            echo "--- Checking $pkg_name ---"

            # Must be in repo dir for gh to work
            cd "$REPO_DIR"
            gh release download "$VERSION" -p "$pkg_name" -O "/tmp/$pkg_name" || {
              echo "❌ FAILED to download $pkg_name"
              return 1
            }

            mkdir -p /tmp/extract
            cd /tmp/extract
            eval "$extract_cmd"

            if [[ -f "./usr/lib/nftban/bin/nftband" ]]; then
              PKG_HASH=$(sha256sum ./usr/lib/nftban/bin/nftband | cut -d' ' -f1)
              PKG_SIZE=$(stat -c%s ./usr/lib/nftban/bin/nftband)
              echo "Package nftband: $PKG_SIZE bytes, hash: $PKG_HASH"

              if [[ "$PKG_HASH" != "$REFERENCE_HASH" ]]; then
                echo "❌ FATAL: Hash mismatch in $pkg_name!"
                echo "Expected: $REFERENCE_HASH"
                echo "Got:      $PKG_HASH"
                exit 1
              fi
              echo "✅ $pkg_name verified"
            else
              echo "❌ nftband not found in $pkg_name"
              exit 1
            fi

            rm -rf /tmp/extract/*
          }

          # Install extraction tools
          sudo apt-get update && sudo apt-get install -y rpm2cpio cpio

          # Check all RPMs
          check_package "nftban-el9-x86_64.rpm" "rpm" "rpm2cpio /tmp/nftban-el9-x86_64.rpm | cpio -idm 2>/dev/null"
          check_package "nftban-el10-x86_64.rpm" "rpm" "rpm2cpio /tmp/nftban-el10-x86_64.rpm | cpio -idm 2>/dev/null"

          # Check all DEBs
          check_package "nftban-debian12-amd64.deb" "deb" "dpkg-deb -x /tmp/nftban-debian12-amd64.deb ."
          check_package "nftban-debian13-amd64.deb" "deb" "dpkg-deb -x /tmp/nftban-debian13-amd64.deb ."
          check_package "nftban-ubuntu22.04-amd64.deb" "deb" "dpkg-deb -x /tmp/nftban-ubuntu22.04-amd64.deb ."
          check_package "nftban-ubuntu24.04-amd64.deb" "deb" "dpkg-deb -x /tmp/nftban-ubuntu24.04-amd64.deb ."

          echo ""
          echo "============================================="
          echo "✅ ALL PACKAGES VERIFIED - Binary Integrity"
          echo "All 6 packages contain identical nftband binary"
          echo "Reference hash: $REFERENCE_HASH"
          echo "============================================="

      - name: Verify SHA256SUMS matches all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "=== Verifying SHA256SUMS for release $VERSION ==="

          mkdir -p /tmp/checksum-verify
          cd /tmp/checksum-verify

          # Download SHA256SUMS from release
          gh release download "$VERSION" -p "SHA256SUMS" -O SHA256SUMS \
              -R "$GITHUB_REPOSITORY" || {
            echo "❌ FATAL: SHA256SUMS not found in release!"
            exit 1
          }

          echo "--- SHA256SUMS contents ---"
          cat SHA256SUMS

          # Download every package and binary that should be in SHA256SUMS
          EXPECTED_ASSETS=(
            "nftban-el9-x86_64.rpm"
            "nftban-el10-x86_64.rpm"
            "nftban-debian12-amd64.deb"
            "nftban-debian13-amd64.deb"
            "nftban-ubuntu22.04-amd64.deb"
            "nftban-ubuntu24.04-amd64.deb"
            "nftband-linux-amd64"
            "nftban-ui-auth-linux-amd64"
          )

          DOWNLOAD_FAILURES=0
          for asset in "${EXPECTED_ASSETS[@]}"; do
            echo "Downloading $asset for checksum verification..."
            gh release download "$VERSION" -p "$asset" -O "$asset" \
                -R "$GITHUB_REPOSITORY" 2>/dev/null || {
              echo "WARN: $asset not available (may be from SLSA workflow)"
              continue
            }
          done

          # Also try SLSA-built binaries
          for slsa_asset in "nftban-core-linux-amd64" "nftban-ui-linux-amd64"; do
            gh release download "$VERSION" -p "$slsa_asset" -O "$slsa_asset" \
                -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          done

          # Verify each downloaded file against SHA256SUMS
          VERIFY_FAILURES=0
          for file in *.rpm *.deb *-linux-amd64; do
            [ -f "$file" ] || continue
            ACTUAL_HASH=$(sha256sum "$file" | cut -d' ' -f1)
            EXPECTED_HASH=$(grep "  ${file}$" SHA256SUMS | cut -d' ' -f1 || true)

            if [ -z "$EXPECTED_HASH" ]; then
              # Try alternate format (two spaces or single space)
              EXPECTED_HASH=$(grep "${file}" SHA256SUMS | head -1 | awk '{print $1}')
            fi

            if [ -z "$EXPECTED_HASH" ]; then
              echo "❌ $file: NOT LISTED in SHA256SUMS"
              VERIFY_FAILURES=$((VERIFY_FAILURES + 1))
            elif [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
              echo "❌ $file: CHECKSUM MISMATCH"
              echo "   Expected: $EXPECTED_HASH"
              echo "   Actual:   $ACTUAL_HASH"
              VERIFY_FAILURES=$((VERIFY_FAILURES + 1))
            else
              echo "✅ $file: checksum verified"
            fi
          done

          # Also verify SHA256SUMS doesn't list files that don't exist in release
          while IFS= read -r line; do
            LISTED_FILE=$(echo "$line" | awk '{print $2}')
            [ -z "$LISTED_FILE" ] && continue
            if [ ! -f "$LISTED_FILE" ]; then
              echo "⚠️  SHA256SUMS lists $LISTED_FILE but it was not downloadable"
            fi
          done < SHA256SUMS

          if [ "$VERIFY_FAILURES" -gt 0 ]; then
            echo ""
            echo "❌ FATAL: $VERIFY_FAILURES SHA256SUMS verification failures!"
            echo "The SHA256SUMS file does not match the actual release assets."
            echo "This means 'nftban update' will fail for users."
            exit 1
          fi

          echo ""
          echo "============================================="
          echo "✅ SHA256SUMS VERIFIED - All checksums match"
          echo "============================================="

          rm -rf /tmp/checksum-verify
