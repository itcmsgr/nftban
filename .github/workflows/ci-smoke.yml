# =============================================================================
# NFTBan - CI: Smoke Test
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Minimal runtime validation — CLI runs, JSON output valid
# =============================================================================

name: Smoke Test

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cli/**'
      - 'cmd/**'
      - 'internal/**'
      - 'install/**'
      - 'packaging/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq libpam0g-dev

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate templ files
        run: $(go env GOPATH)/bin/templ generate

      - name: Build CLI binary
        run: go build -trimpath -o bin/nftban-core ./cmd/nftban-core/

      - name: Install shell components
        run: |
          # Minimal install — CLI scripts + config only (no systemd, no daemon)
          sudo mkdir -p /usr/lib/nftban/bin /usr/lib/nftban/cli /etc/nftban
          sudo cp bin/nftban-core /usr/lib/nftban/bin/
          sudo cp -r cli/lib/nftban/* /usr/lib/nftban/
          sudo cp cli/sbin/nftban /usr/sbin/nftban
          sudo chmod +x /usr/sbin/nftban /usr/lib/nftban/bin/nftban-core
          # Minimal config
          sudo cp -r etc/nftban/* /etc/nftban/ 2>/dev/null || true
          # VERSION file
          sudo cp VERSION /usr/lib/nftban/

      - name: Smoke test — version
        run: nftban version

      - name: Smoke test — version --json
        run: |
          OUTPUT=$(nftban version --json 2>/dev/null || nftban version 2>&1)
          echo "$OUTPUT"
          # Verify it's parseable (non-empty, no crash)
          [[ -n "$OUTPUT" ]]

      - name: Smoke test — help
        run: nftban help

      - name: Smoke test — fhs verify
        run: nftban fhs verify 2>&1 | head -20 || true

      - name: Summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Command | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| nftban version | $(nftban version >/dev/null 2>&1 && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| nftban help | $(nftban help >/dev/null 2>&1 && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
