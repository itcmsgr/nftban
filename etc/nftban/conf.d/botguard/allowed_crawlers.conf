# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/botguard/allowed_crawlers.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# Format: BOT_NAME|DOMAIN_SUFFIX|VERIFY_MODE|MAX_CONN|MAX_RATE|BURST
#
#   BOT_NAME      Identifier (used in logs, deny list matching)
#   DOMAIN_SUFFIX Comma-separated rDNS suffix match domains
#   VERIFY_MODE   Verification method: "fcrdns" (Forward-Confirmed rDNS)
#   MAX_CONN      Max concurrent connections allowed for this bot
#   MAX_RATE      nft rate limit string (e.g. "80/second")
#   BURST         nft burst value
#
# FCrDNS verification:
#   1. Reverse DNS:  IP → hostname
#   2. Suffix check: hostname must end with one of the listed domains
#   3. Forward DNS:  hostname → IP list, original IP must be present
#
# Lines starting with # are comments. Empty lines are ignored.
# =============================================================================

GOOGLEBOT|googlebot.com,google.com|fcrdns|400|80/second|160
BINGBOT|search.msn.com|fcrdns|300|60/second|120
YANDEXBOT|yandex.ru,yandex.net,yandex.com|fcrdns|200|40/second|80
DUCKDUCKBOT|duckduckgo.com|fcrdns|200|40/second|80
FACEBOOKBOT|facebook.com,fbcdn.net|fcrdns|200|40/second|80
APPLEBOT|applebot.apple.com|fcrdns|200|40/second|80
LINKEDINBOT|linkedin.com|fcrdns|150|30/second|60
TWITTERBOT|twttr.com|fcrdns|150|30/second|60
