# -----------------------------------------------------------------------------
# MODULE ENABLE/DISABLE
# -----------------------------------------------------------------------------
# Master switch for login monitoring
LOGIN_ENABLED="true"

# -----------------------------------------------------------------------------
# MODE SELECTION
# -----------------------------------------------------------------------------
# Choose login monitoring mode:
#
#   auto     - Auto-detect: use Suricata if available, otherwise Classic
#   classic  - Force Classic mode (journalctl/log parsing)
#   suricata - Force Suricata mode (EVE JSON auth failure alerts)
#   hybrid   - Use both: Classic parsing + Suricata correlation
#
LOGIN_MODE="auto"

# -----------------------------------------------------------------------------
# AUTO-DETECTION SETTINGS
# -----------------------------------------------------------------------------
# How to detect if Suricata is available for auth failure correlation

# Check if Suricata service is running
LOGIN_AUTO_CHECK_SERVICE="true"

# Check if Suricata binary exists
LOGIN_AUTO_CHECK_BINARY="true"

# Check if EVE JSON file exists and is being written to
LOGIN_AUTO_CHECK_EVE_FILE="true"

# Suricata service name (for systemctl check)
LOGIN_SURICATA_SERVICE_NAME="suricata"

# Suricata binary path (for existence check)
LOGIN_SURICATA_BINARY="/usr/bin/suricata"

# EVE file freshness threshold (seconds)
LOGIN_EVE_FRESHNESS_THRESHOLD="60"

# -----------------------------------------------------------------------------
# HYBRID MODE SETTINGS
# -----------------------------------------------------------------------------
# When LOGIN_MODE="hybrid", both Classic and Suricata run together
# NOTE: Hybrid mode variables are planned for future implementation.
# Currently, hybrid mode falls back to classic+suricata co-monitoring.

# Classic mode provides: journalctl monitoring for immediate response
# Suricata mode provides: network-level auth failure detection + correlation

# In hybrid mode, Classic handles log-based detection
# LOGIN_HYBRID_CLASSIC_DETECT="true"

# In hybrid mode, Suricata adds correlation and network-level detection
# LOGIN_HYBRID_SURICATA_CORRELATE="true"

# Cross-reference: if Suricata sees auth failure + Classic sees same IP = higher risk
# LOGIN_HYBRID_CROSS_REFERENCE="true"

# -----------------------------------------------------------------------------
# SERVICE AUTO-DETECTION
# -----------------------------------------------------------------------------
# Automatically detect which services are installed and enable monitoring

# Auto-detect installed services
LOGIN_AUTO_DETECT_SERVICES="true"

# Services to check for (will only monitor if detected)
# Each service has detailed config in services.conf
# NOTE: Auto-detection handles service discovery. Override in main.conf.local if needed.
# LOGIN_SERVICES_TO_CHECK="ssh,dovecot,exim,postfix,roundcube,wordpress,xmlrpc,directadmin,pure-ftpd"

# -----------------------------------------------------------------------------
# GLOBAL ACTION SETTINGS
# -----------------------------------------------------------------------------
# What to do when login failures are detected

# Action mode: "alert" (notify only), "ban" (auto-block), "both"
LOGIN_ACTION_MODE="both"

# Use nftban command for blocking (uses NFTBAN_BIN from /etc/nftban/nftban.conf)
# This can be overridden but defaults to the centralized path
LOGIN_BAN_COMMAND="${NFTBAN_BIN:-/usr/sbin/nftban} ban"

# Default ban duration for auto-ban (seconds)
LOGIN_DEFAULT_BAN_DURATION="3600"

# Ban reason prefix
LOGIN_BAN_REASON_PREFIX="login-monitor"

# -----------------------------------------------------------------------------
# PERSISTENT OFFENDER ESCALATION (DEPRECATED)
# -----------------------------------------------------------------------------
# DEPRECATED since v1.6.1: Persistent offender escalation is now centralized in
# /etc/nftban/conf.d/persistent.conf (works across ALL modules: loginmon, portscan,
# ddos, suricata, manual). These login-specific variables are no longer consumed
# by code. Configure escalation in persistent.conf / persistent.conf.local instead.
#
# Variables below retained for backwards compatibility but have NO EFFECT:

# Enable persistent offender tracking
# LOGIN_PERSISTENT_OFFENDER_ENABLED="true"

# State file for tracking repeat offenders
# LOGIN_PERSISTENT_STATE_FILE="/var/lib/nftban/login-persistent-offenders.db"

# Escalation levels (ban_count:duration_seconds)
# After X bans within the tracking period, apply new duration
# LOGIN_ESCALATION_LEVEL_1="3:7200"      # 3 bans -> 2 hours
# LOGIN_ESCALATION_LEVEL_2="5:14400"     # 5 bans -> 4 hours
# LOGIN_ESCALATION_LEVEL_3="8:43200"     # 8 bans -> 12 hours
# LOGIN_ESCALATION_LEVEL_4="12:86400"    # 12 bans -> 24 hours (permanent candidate)

# After this many bans, add to permanent blacklist
# LOGIN_PERMANENT_BAN_THRESHOLD="15"

# Tracking period for counting bans (seconds)
# LOGIN_PERSISTENT_TRACKING_PERIOD="86400"

# -----------------------------------------------------------------------------
# WHITELIST
# -----------------------------------------------------------------------------
# IPs/networks that should NEVER be blocked for failed logins
#
# NOTE: Whitelist is now CENTRALIZED in /etc/nftban/whitelist.d/*.conf
# Use: nftban whitelist add <ip> [comment]
# All modules share the same whitelist (SINGLE SOURCE OF TRUTH)

# Auto-whitelist localhost
LOGIN_WHITELIST_LOCALHOST="true"

# Auto-whitelist private networks (RFC1918)
LOGIN_WHITELIST_PRIVATE="true"

# Auto-whitelist server's own IPs (PLANNED - not yet implemented)
# LOGIN_WHITELIST_SELF="true"

# -----------------------------------------------------------------------------
# GEOIP ENRICHMENT (DEPRECATED)
# -----------------------------------------------------------------------------
# DEPRECATED since v1.5.0: GeoIP configuration is now centralized in
# /etc/nftban/conf.d/geoip/main.conf (shared by ALL modules).
# These login-specific variables are no longer consumed by code.
#
# Variables below retained for backwards compatibility but have NO EFFECT:

# Enable GeoIP lookups
# LOGIN_GEOIP_ENABLED="true"

# GeoIP database path
# LOGIN_GEOIP_DATABASE="/usr/share/GeoIP/GeoLite2-Country.mmdb"

# High-risk countries (2-letter ISO codes, comma-separated)
# Connections from these countries get higher risk score
# LOGIN_HIGH_RISK_COUNTRIES="CN,RU,KP,IR"

# GeoIP risk score bonus for high-risk countries
# LOGIN_GEOIP_RISK_BONUS="0.15"

# -----------------------------------------------------------------------------
# GLOBAL LIMITS (PLANNED - not yet consumed by code)
# -----------------------------------------------------------------------------
# These safety limits are defined for future implementation.
# Currently, limits are handled by the nftables set size and daemon watchdog.

# Maximum IPs to block (prevent runaway blocking)
# LOGIN_MAX_BLOCKED_IPS="10000"

# Maximum block duration (seconds) - safety cap
# LOGIN_MAX_BAN_DURATION="604800"

# Minimum time between blocks of same IP (seconds)
# LOGIN_MIN_REBLOCK_INTERVAL="60"

# Maximum events to process per second (rate limiting)
# LOGIN_MAX_EVENTS_PER_SEC="100"

# -----------------------------------------------------------------------------
# NOTIFICATIONS (DEPRECATED)
# -----------------------------------------------------------------------------
# DEPRECATED since v1.5.0: Notification settings are now centralized in
# /etc/nftban/conf.d/mail.conf (email) and /etc/nftban/conf.d/connectors.conf
# (webhooks). These login-specific variables are no longer consumed by code.
#
# Variables below retained for backwards compatibility but have NO EFFECT:

# Enable email notifications
# LOGIN_NOTIFY_EMAIL="false"
# LOGIN_NOTIFY_EMAIL_TO=""

# Email format: "html" or "text"
# LOGIN_NOTIFY_EMAIL_FORMAT="html"

# Enable webhook notifications
# LOGIN_NOTIFY_WEBHOOK="false"
# LOGIN_NOTIFY_WEBHOOK_URL=""

# Notify on every ban (can be noisy)
# LOGIN_NOTIFY_ON_BAN="true"

# Notify only on high-risk events (score >= threshold)
# LOGIN_NOTIFY_THRESHOLD="0.60"

# Aggregate notifications (send summary instead of individual)
# LOGIN_NOTIFY_AGGREGATE="false"
# LOGIN_NOTIFY_AGGREGATE_INTERVAL="300"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Module logging settings
# LOGIN_LOG_FILE is actively used. Other logging variables are planned
# for future Go module integration (currently uses standard Go logging).

# Log file for login monitor events
LOGIN_LOG_FILE="/var/log/nftban/login-monitor.log"

# Log level: DEBUG, INFO, WARN, ERROR
# LOGIN_LOG_LEVEL="INFO"

# Log all auth events (verbose, useful for debugging)
# LOGIN_LOG_ALL_EVENTS="false"

# Log scoring decisions
# LOGIN_LOG_SCORES="true"

# Log successful logins (for correlation)
# LOGIN_LOG_SUCCESSFUL="false"

# =============================================================================
# Source-visibility acknowledgement (v1.200 / VAL-LOGINMON-002)
# =============================================================================
# A LoginMon source that is "present but produced no readable logs" is reported
# as an actionable WARN in `nftban health` (e.g. Roundcube installed but
# log_logins is off, or a web/FTP auth log path NFTBan cannot read). If a stack
# is starved BY DESIGN on this host (e.g. you intentionally do not collect
# Roundcube login logs), acknowledge it here: an acked source is reported as INFO
# ("operator-acked") instead of WARN. The finding stays VISIBLE — it is never
# silently hidden. Unacknowledged starved sources REMAIN WARN.
#
# Space-separated source names: webauth ftpauth roundcube
# Default (empty) = nothing acked = normal WARN behavior.
# Override per host in main.conf.local (no-clobber).
# LOGINMON_SOURCE_ACK=""

# =============================================================================
# END OF MAIN CONFIGURATION
