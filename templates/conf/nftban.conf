# =============================================================================
# NFTBAN Configuration File (Reference / DO NOT EDIT)
# This file is refreshed by nftban_init_fail2ban_conf.sh on every `setup` run.
# Put your real changes in: /etc/nftban/config/nftban.conf.local
# =============================================================================

# =============================================================================
# MASTER CONTROL
# =============================================================================
# Enable/disable NFTBan entirely
# When set to "false", NFTBan is completely disabled (fail-safe default)
# Set to "true" after installation and configuration is complete
NFTBAN_ENABLED="false"

# =============================================================================
# BASE CONFIGURATION
# =============================================================================
BASE_DIR="/etc/nftban"
BIN_DIR="$BASE_DIR/bin"
LIB_DIR="$BASE_DIR/lib"
CONFIG_DIR="$BASE_DIR/config"
FILTERS_DIR="$CONFIG_DIR/filters"
ACTIONS_DIR="$CONFIG_DIR/actions"
WHITELIST_DIR="$CONFIG_DIR/whitelist"
FEEDS_CONFIG_DIR="$CONFIG_DIR/feeds"
DATA_DIR="$BASE_DIR/data"
FEEDS_DATA_DIR="$DATA_DIR/feeds"
CACHE_DIR="$DATA_DIR/cache"
DB_DIR="$DATA_DIR/db"
LOG_DIR="/var/log/nftban"
SCRIPTS_DIR="$BASE_DIR/scripts"

# =============================================================================
# EMAIL SETTINGS
# =============================================================================
NFTBAN_F2B_RECIPIENT="admin@yourdomain.com"
NFTBAN_F2B_SENDER="nftban@$(hostname -f)"
NFTBAN_F2B_ALERT_ENABLED="true"

# =============================================================================
# LOGIN MONITORING & SECURITY ALERTS
# =============================================================================
# Enable/disable login monitoring system
# When enabled, monitors system login events and sends real-time alerts
NFTBAN_F2B_LOGIN_MONITOR="false"

# Alert on root user direct logins (SSH, console, etc.)
# Recommended: "true" - Root should rarely login directly
# Best practice: Use sudo instead of root login
NFTBAN_F2B_ROOT_LOGIN_ALERT="true"

# Alert on sudo command execution
# Monitors all sudo usage for security auditing
# WARNING: Can generate many alerts on active systems
# Recommended: "false" unless you need strict sudo auditing
NFTBAN_F2B_SUDO_ALERT="false"

# Alert on successful SSH logins
# Monitors all SSH authentication events
# Useful for detecting unauthorized access attempts
# Recommended: "true" for critical servers, "false" for development
NFTBAN_F2B_SSH_LOGIN_ALERT="false"

# Alert on failed login attempts threshold
# Number of failed attempts before triggering alert
NFTBAN_F2B_FAILED_LOGIN_THRESHOLD="5"

# Login monitor check interval (seconds)
# How often to scan logs for login events (default: 60 seconds)
NFTBAN_F2B_LOGIN_CHECK_INTERVAL="60"

# Monitor log files for login events (space-separated)
NFTBAN_F2B_LOGIN_LOGFILES="/var/log/auth.log /var/log/secure"

# Alert cooldown period (seconds)
# Minimum time between alerts for same event type (prevents spam)
NFTBAN_F2B_ALERT_COOLDOWN="300"

# =============================================================================
# SSH CONNECTION & SESSION MANAGEMENT
# =============================================================================
# Enable SSH connection monitoring
# Default: "false" for safety - enable after testing
NFTBAN_SSH_CONNECTION_MONITOR="false"

# Alert on SSH session from new/unknown IPs
# Tracks known SSH client IPs and alerts on connections from new sources
NFTBAN_SSH_NEW_IP_ALERT="false"

# SSH session timeout (seconds, 0 = no timeout)
# Automatically terminate idle SSH sessions
NFTBAN_SSH_SESSION_TIMEOUT="0"

# Maximum concurrent SSH sessions per user
# Limit simultaneous SSH connections (0 = unlimited)
NFTBAN_SSH_MAX_SESSIONS_PER_USER="0"

# Track SSH session metadata (login time, duration, commands, etc.)
NFTBAN_SSH_SESSION_TRACKING="false"

# =============================================================================
# REBOOT SAFETY & SSH LOCKOUT PREVENTION (CRITICAL)
# =============================================================================
# IMPORTANT: These settings prevent permanent SSH lockout after server reboot
# or nftban rule misconfiguration.
#
# WARNING: Enable ONLY for testing/lab environments!
# In production, rules should persist across reboots.
# Resetting on every reboot defeats the purpose of a firewall.

# Enable reboot safety system
# When enabled, nftban rules are temporarily cleared on boot until verified safe
# DEFAULT: "false" - rules persist across reboots (production behavior)
# Set to "true" ONLY for testing new configurations on lab servers
NFTBAN_REBOOT_SAFETY_ENABLED="false"

# Auto-reset firewall rules on boot (before applying nftban rules)
# DEFAULT: "false" - rules persist (normal production behavior)
# Set to "true" ONLY during testing to start fresh each boot
# WARNING: In production, this removes all protection after reboot!
NFTBAN_RESET_ON_BOOT="false"

# Grace period after reboot before applying rules (seconds)
# Gives admin time to SSH in and verify connectivity before firewall activates
# Recommended: 300 (5 minutes) - enough time to login and check
NFTBAN_REBOOT_GRACE_PERIOD="300"

# Auto-sync rules after reboot
# Automatically verify and re-apply nftban rules after grace period
# If SSH test fails during sync, rules are NOT applied (fail-safe)
NFTBAN_REBOOT_AUTO_SYNC="true"

# Test SSH connectivity before applying rules
# Performs local SSH connection test before activating firewall
# If test fails, rules are NOT applied and alert is sent
# CRITICAL SAFETY FEATURE - keeps SSH accessible
NFTBAN_SSH_TEST_BEFORE_APPLY="true"

# SSH test port (default: 22)
# Port to test for SSH connectivity during safety checks
NFTBAN_SSH_TEST_PORT="22"

# Send alert if reboot safety activates
# Notifies admin when rules were not applied due to safety check failure
NFTBAN_REBOOT_SAFETY_ALERT="true"

# Cron-based safety check
# Install @reboot cron job for additional safety verification
# Works alongside systemd service for redundancy
# DEFAULT: "false" - only needed when reboot safety is enabled
# Set to "true" ONLY in testing/lab environments
NFTBAN_INSTALL_REBOOT_CRON="false"

# Emergency rule reset command
# Command to emergency-reset nftban if locked out (via console/IPMI)
# Example: /usr/local/bin/nftban emergency-reset
# This command bypasses all safety checks and clears all rules immediately
# DEFAULT: "false" - disable emergency reset in production
# Enable ONLY if you have console/IPMI access and need emergency recovery option
NFTBAN_EMERGENCY_RESET_ENABLED="false"

# =============================================================================
# DEFAULT SETTINGS
# =============================================================================
NFTBAN_F2B_DEF_BAN_TIME="3600"
NFTBAN_F2B_DEF_FIND_TIME="600"
NFTBAN_F2B_DEF_MAX_RETRY="5"
NFTBAN_F2B_BACKEND="systemd"

# =============================================================================
# WHITELIST CONFIGURATION
# =============================================================================
# User whitelist file - ONE FILE for all whitelisting
# This file is used by BOTH nftban AND fail2ban
# Managed by CLI: nftban whitelist add/remove OR nftban fail2ban ignoreip add/remove
# Location: /etc/nftban/config/whitelist-user.conf
NFTBAN_WHITELIST_USER="$CONFIG_DIR/whitelist-user.conf"

# Fail2ban will read IPs from whitelist-user.conf and add them to ignoreip
# No separate files - ONE source of truth
NFTBAN_F2B_IGNOREIP_FILE="$NFTBAN_WHITELIST_USER"

# Legacy fail2ban whitelist file (deprecated, use whitelist-user.conf instead)
NFTBAN_F2B_IGNOREIP="$BASE_DIR/config/nftban-fail2ban-ip-whitelist.conf.local"

# Auto-whitelist trusted IPs
NFTBAN_ENABLE_AUTO_WHITELIST="true"

# =============================================================================
# CLOUDFLARE WHITELIST CONFIGURATION
# =============================================================================
# Cloudflare IP ranges source URLs
CLOUDFLARE_IPV4_URL="https://www.cloudflare.com/ips-v4"
CLOUDFLARE_IPV6_URL="https://www.cloudflare.com/ips-v6"

# Cloudflare whitelist file locations
CLOUDFLARE_IPV4_WHITELIST_FILE="/etc/nftban/config/cloudflare-whitelist_ipsv4.conf"
CLOUDFLARE_IPV6_WHITELIST_FILE="/etc/nftban/config/cloudflare-whitelist_ipsv6.conf"

# Enable/Disable Cloudflare IP whitelisting
# NOTE: Cloudflare module currently expects uppercase "TRUE"/"FALSE"
# Keep as uppercase until module is updated
CLOUDFLARE_IPV4_WHITELIST="FALSE"
CLOUDFLARE_IPV6_WHITELIST="FALSE"

# =============================================================================
# RATE LIMITING & SAFETY
# =============================================================================
# Limit to avoid ban misconfiguration (bans per minute)
BAN_RATE_LIMIT_PER_MINUTE="10"

# Maximum concurrent bans allowed
NFTBAN_MAX_CONCURRENT_BANS="1000"

# Cleanup interval for expired bans (seconds)
NFTBAN_CLEANUP_INTERVAL="3600"

# =============================================================================
# GEO-BLOCKING CONFIGURATION
# =============================================================================
# Enable/disable geo-blocking
NFTBAN_ENABLE_GEO_BLOCKING="true"

# Whitelist countries (space-separated ISO country codes)
GEO_WHITELIST_COUNTRIES="GR"

# System-wide blacklist countries (space-separated ISO country codes)
GEO_SYSTEM_BLACKLIST_COUNTRIES=""

# =============================================================================
# DYNAMIC JAIL GENERATION
# =============================================================================
# Enable automatic jail generation from logfiles in monitored directories
NFTBAN_DYNAMIC_JAILS_ENABLED="true"

# Directories to monitor for log files (space-separated)
NFTBAN_DYNAMIC_LOG_DIRS="/var/log /var/log/nginx /var/log/apache2"

# Pattern matching for log files to monitor
# Examples: "*.log" or "access*.log error*.log"
NFTBAN_DYNAMIC_LOG_PATTERN="*.log"

# Exclude specific log files or patterns (space-separated)
NFTBAN_DYNAMIC_LOG_EXCLUDE="wtmp btmp lastlog journal/* syslog kern.log dmesg"

# Default filter to use for dynamic jails (if specific filter not found)
NFTBAN_DYNAMIC_DEFAULT_FILTER="common"

# Rescan interval in seconds (0 = only on setup, no periodic rescans)
NFTBAN_DYNAMIC_RESCAN_INTERVAL="3600"

# Auto-detect service type from log path (true/false)
NFTBAN_DYNAMIC_AUTO_DETECT_SERVICE="true"

# Minimum file size to consider for dynamic jail (in bytes, 0 = no minimum)
NFTBAN_DYNAMIC_MIN_FILESIZE="100"

# Maximum number of dynamic jails to create (0 = unlimited)
NFTBAN_DYNAMIC_MAX_JAILS="50"

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Log level: DEBUG, INFO, WARN, ERROR
NFTBAN_LOG_LEVEL="INFO"

# Main log file
NFTBAN_LOG_FILE="/var/log/nftban/nftban.log"

# Maximum log file size before rotation
NFTBAN_LOG_MAX_SIZE="10M"

# Number of days to retain logs
NFTBAN_LOG_RETENTION_DAYS="30"

# Enable verbose logging for troubleshooting
NFTBAN_DEBUG_MODE="false"

# =============================================================================
# ADVANCED FEATURES
# =============================================================================
# Enable reputation scoring system
NFTBAN_ENABLE_REPUTATION_SCORING="false"

# Reputation database file
NFTBAN_REPUTATION_DB="$BASE_DIR/data/reputation.db"

# Reputation score threshold for auto-ban (0-100)
NFTBAN_REPUTATION_THRESHOLD="75"

# =============================================================================
# NOTIFICATION CHANNELS
# =============================================================================
# Webhook notifications
NFTBAN_WEBHOOK_ENABLED="false"
NFTBAN_WEBHOOK_URL=""
NFTBAN_WEBHOOK_METHOD="POST"

# Slack notifications
NFTBAN_SLACK_ENABLED="false"
NFTBAN_SLACK_WEBHOOK_URL=""

# Discord notifications
NFTBAN_DISCORD_ENABLED="false"
NFTBAN_DISCORD_WEBHOOK_URL=""

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# NFTables update batch size
NFTBAN_NFT_BATCH_SIZE="100"

# Database query cache timeout (seconds)
NFTBAN_CACHE_TIMEOUT="300"

# Worker threads for parallel processing
NFTBAN_WORKER_THREADS="4"

# =============================================================================
# JAIL CONFIGURATIONS
# =============================================================================
# Template for jail configurations:
# Every jail configuration follows this pattern:
#
# NFTBAN_F2B_{jailname}_JAIL="true"
# NFTBAN_F2B_{jailname}_BAN_TIME="1800"
# NFTBAN_F2B_{jailname}_MAX_RETRY="3"
# NFTBAN_F2B_{jailname}_FIND_TIME="600"
# NFTBAN_F2B_{jailname}_FILTER="filter-name"
# NFTBAN_F2B_{jailname}_LOGPATH="/path/to/log"
# NFTBAN_F2B_{jailname}_PORT="service-port"
#
# Add your static jail configurations below or in nftban.conf.local

# -----------------------------------------------------------------------------
# SSH Jail - Protects against SSH brute-force attacks
# -----------------------------------------------------------------------------
NFTBAN_F2B_SSHD_JAIL="true"
NFTBAN_F2B_SSHD_BAN_TIME="7200"
NFTBAN_F2B_SSHD_MAX_RETRY="3"
NFTBAN_F2B_SSHD_FIND_TIME="600"
NFTBAN_F2B_SSHD_FILTER="sshd"
NFTBAN_F2B_SSHD_LOGPATH="/var/log/auth.log"
NFTBAN_F2B_SSHD_PORT="ssh"

# -----------------------------------------------------------------------------
# Postfix Jail - Protects mail server from SMTP abuse
# -----------------------------------------------------------------------------
NFTBAN_F2B_POSTFIX_JAIL="true"
NFTBAN_F2B_POSTFIX_BAN_TIME="3600"
NFTBAN_F2B_POSTFIX_MAX_RETRY="5"
NFTBAN_F2B_POSTFIX_FIND_TIME="600"
NFTBAN_F2B_POSTFIX_FILTER="postfix"
NFTBAN_F2B_POSTFIX_LOGPATH="/var/log/maillog"
NFTBAN_F2B_POSTFIX_PORT="smtp,465,submission"

# -----------------------------------------------------------------------------
# Postfix SASL Jail - Protects against SMTP AUTH brute-force
# -----------------------------------------------------------------------------
NFTBAN_F2B_POSTFIX_SASL_JAIL="true"
NFTBAN_F2B_POSTFIX_SASL_BAN_TIME="3600"
NFTBAN_F2B_POSTFIX_SASL_MAX_RETRY="3"
NFTBAN_F2B_POSTFIX_SASL_FIND_TIME="600"
NFTBAN_F2B_POSTFIX_SASL_FILTER="postfix-sasl"
NFTBAN_F2B_POSTFIX_SASL_LOGPATH="/var/log/maillog"
NFTBAN_F2B_POSTFIX_SASL_PORT="smtp,465,submission"

# -----------------------------------------------------------------------------
# Recidive Jail - Long-term ban for repeat offenders
# Automatically bans IPs that get banned multiple times
# -----------------------------------------------------------------------------
NFTBAN_F2B_RECIDIVE_JAIL="true"
NFTBAN_F2B_RECIDIVE_BAN_TIME="604800"
NFTBAN_F2B_RECIDIVE_MAX_RETRY="3"
NFTBAN_F2B_RECIDIVE_FIND_TIME="86400"
NFTBAN_F2B_RECIDIVE_FILTER="recidive"
NFTBAN_F2B_RECIDIVE_LOGPATH="/var/log/fail2ban.log"
NFTBAN_F2B_RECIDIVE_BANACTION="nftables-allports"

# =============================================================================
# BACKUP & RECOVERY
# =============================================================================
# Enable automatic configuration backups
NFTBAN_AUTO_BACKUP="true"

# Backup directory
NFTBAN_BACKUP_DIR="$BASE_DIR/backups"

# Number of backups to retain
NFTBAN_BACKUP_RETENTION="10"

# =============================================================================
# SYSTEM INTEGRATION
# =============================================================================
# Integration with system services
NFTBAN_SYSTEMD_INTEGRATION="true"

# Restart fail2ban on configuration changes
NFTBAN_AUTO_RESTART_F2B="true"

# Reload nftables on rule changes
NFTBAN_AUTO_RELOAD_NFT="true"

# =============================================================================
# THREAT INTELLIGENCE FEEDS SYSTEM
# =============================================================================
# NFTBan Threat Feeds protect your server by automatically downloading and
# blocking IPs from trusted threat intelligence sources.
#
# HOW IT WORKS:
#   1. Feeds download malicious IP lists from trusted sources
#   2. IPs are validated and deduplicated
#   3. IPs are checked against your whitelist (never block whitelisted IPs)
#   4. Malicious IPs are added to nftables @feeds set
#   5. Traffic from these IPs is automatically dropped
#
# STORAGE LOCATIONS:
#   - Feed IPs saved to: /etc/nftban/config/feeds/<feed-name>-blacklist.conf
#   - Temporary cache: /var/cache/nftban/feeds/
#   - Logs: /var/log/nftban/feeds.log
#
# MANAGEMENT COMMANDS:
#   nftban feeds init              Initialize feeds system
#   nftban feeds list              List all available feeds
#   nftban feeds enable <feed>     Enable a specific feed
#   nftban feeds disable <feed>    Disable a specific feed
#   nftban feeds update [feed]     Update feeds (all or specific)
#   nftban feeds status            Show detailed status
#   nftban feeds timer-install     Install automatic update timer
#
# SAFETY FEATURES:
#   - Whitelisted IPs are never blocked (even if in feeds)
#   - Memory limits prevent system overload
#   - Download timeouts prevent hanging
#   - Validation ensures only valid IPs are added
#   - All feeds DISABLED by default (safe init state)
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Feed Settings
# -----------------------------------------------------------------------------
# Master switch for entire feed system
NFTBAN_FEEDS_ENABLED="FALSE"

# Download timeout for feed sources (seconds)
NFTBAN_FEEDS_DOWNLOAD_TIMEOUT="30"

# Minimum valid entries to accept feed (prevents accepting empty/broken feeds)
NFTBAN_FEEDS_MIN_ENTRIES="10"

# Maximum entries per feed (prevents memory exhaustion)
NFTBAN_FEEDS_MAX_ENTRIES="500000"

# Memory limit for feed processing (MB)
NFTBAN_FEEDS_MEMORY_LIMIT="512"

# -----------------------------------------------------------------------------
# Individual Feed Providers
# -----------------------------------------------------------------------------
# Each feed has 4 settings:
#   _ENABLED   - "TRUE" to enable, "FALSE" to disable (changed by enable/disable commands)
#   _INTERVAL  - Update frequency: HOURLY, DAILY, or WEEKLY
#   _URL       - Feed source URL (visible for transparency)
#   _FILE      - Where IPs are stored locally
#
# IMPORTANT: All feeds are DISABLED by default for safety.
# Enable only the feeds you need with: sudo nftban feeds enable <feed_id>
# =============================================================================

# =============================================================================
# Feed #1: Spamhaus DROP List
# =============================================================================
# Description: Known spam sources and hijacked networks
# Reputation: Excellent - Industry standard, very reliable
# Update Recommendation: DAILY (list is stable, changes infrequently)
# Typical Size: ~1,000 entries (CIDR ranges)
# Use Case: Recommended for ALL servers (email, web, any service)
# -----------------------------------------------------------------------------
NFTBAN_FEED_SPAMHAUS_ENABLED="FALSE"
NFTBAN_FEED_SPAMHAUS_INTERVAL="DAILY"
NFTBAN_FEED_SPAMHAUS_URL="https://www.spamhaus.org/drop/drop.txt"
NFTBAN_FEED_SPAMHAUS_FILE="${CONFIG_DIR}/feeds/spamhaus-blacklist.conf"

# =============================================================================
# Feed #2: Blocklist.de - All Attacks
# =============================================================================
# Description: Aggregated list of all attack types (SSH, mail, Apache, etc.)
# Reputation: Good - Community-driven, regularly updated
# Update Recommendation: HOURLY (high activity, frequent changes)
# Typical Size: ~50,000 entries
# Use Case: General protection for servers with multiple services
# Note: This is LARGER than individual service feeds (ssh/mail/apache)
# -----------------------------------------------------------------------------
NFTBAN_FEED_BLOCKLISTDE_ALL_ENABLED="FALSE"
NFTBAN_FEED_BLOCKLISTDE_ALL_INTERVAL="HOURLY"
NFTBAN_FEED_BLOCKLISTDE_ALL_URL="https://lists.blocklist.de/lists/all.txt"
NFTBAN_FEED_BLOCKLISTDE_ALL_FILE="${CONFIG_DIR}/feeds/blocklistde-all-blacklist.conf"

# =============================================================================
# Feed #3: Blocklist.de - SSH Attacks
# =============================================================================
# Description: SSH brute-force attackers only
# Reputation: Good - Focused on SSH attacks
# Update Recommendation: HOURLY (SSH attacks are constant)
# Typical Size: ~15,000 entries
# Use Case: Essential for any server with SSH exposed
# Note: Smaller than "all" feed, use if you only need SSH protection
# -----------------------------------------------------------------------------
NFTBAN_FEED_BLOCKLISTDE_SSH_ENABLED="FALSE"
NFTBAN_FEED_BLOCKLISTDE_SSH_INTERVAL="HOURLY"
NFTBAN_FEED_BLOCKLISTDE_SSH_URL="https://lists.blocklist.de/lists/ssh.txt"
NFTBAN_FEED_BLOCKLISTDE_SSH_FILE="${CONFIG_DIR}/feeds/blocklistde-ssh-blacklist.conf"

# =============================================================================
# Feed #4: Blocklist.de - Mail Attacks
# =============================================================================
# Description: Mail server attackers (SMTP, IMAP, POP3 abuse)
# Reputation: Good - Focused on mail-related attacks
# Update Recommendation: DAILY (mail attacks less frequent than SSH)
# Typical Size: ~10,000 entries
# Use Case: Mail servers (Postfix, Dovecot, Exim, etc.)
# -----------------------------------------------------------------------------
NFTBAN_FEED_BLOCKLISTDE_MAIL_ENABLED="FALSE"
NFTBAN_FEED_BLOCKLISTDE_MAIL_INTERVAL="DAILY"
NFTBAN_FEED_BLOCKLISTDE_MAIL_URL="https://lists.blocklist.de/lists/mail.txt"
NFTBAN_FEED_BLOCKLISTDE_MAIL_FILE="${CONFIG_DIR}/feeds/blocklistde-mail-blacklist.conf"

# =============================================================================
# Feed #5: Blocklist.de - Apache/Web Attacks
# =============================================================================
# Description: Apache/Nginx web server attackers
# Reputation: Good - Focused on HTTP/HTTPS attacks
# Update Recommendation: DAILY (web attacks moderately frequent)
# Typical Size: ~8,000 entries
# Use Case: Web servers (Apache, Nginx, Lighttpd, etc.)
# -----------------------------------------------------------------------------
NFTBAN_FEED_BLOCKLISTDE_APACHE_ENABLED="FALSE"
NFTBAN_FEED_BLOCKLISTDE_APACHE_INTERVAL="DAILY"
NFTBAN_FEED_BLOCKLISTDE_APACHE_URL="https://lists.blocklist.de/lists/apache.txt"
NFTBAN_FEED_BLOCKLISTDE_APACHE_FILE="${CONFIG_DIR}/feeds/blocklistde-apache-blacklist.conf"

# =============================================================================
# Feed #6: Abuse.ch Feodo Tracker
# =============================================================================
# Description: Botnet C&C servers (command & control)
# Reputation: Excellent - Run by abuse.ch, highly trusted
# Update Recommendation: DAILY (botnets change infrastructure regularly)
# Typical Size: ~500 entries
# Use Case: Recommended for ALL servers (prevents botnet communication)
# -----------------------------------------------------------------------------
NFTBAN_FEED_ABUSECH_ENABLED="FALSE"
NFTBAN_FEED_ABUSECH_INTERVAL="DAILY"
NFTBAN_FEED_ABUSECH_URL="https://feodotracker.abuse.ch/downloads/ipblocklist.txt"
NFTBAN_FEED_ABUSECH_FILE="${CONFIG_DIR}/feeds/abusech-blacklist.conf"

# =============================================================================
# Feed #7: DShield Top 20
# =============================================================================
# Description: Top 20 attacking IP addresses (SANS Internet Storm Center)
# Reputation: Excellent - Run by SANS, highly reputable
# Update Recommendation: HOURLY (these are the most active attackers RIGHT NOW)
# Typical Size: Only 20 entries (very small, low overhead)
# Use Case: MUST-HAVE for all servers (tiny list, huge impact)
# Note: This is the smallest feed but blocks the most aggressive attackers
# -----------------------------------------------------------------------------
NFTBAN_FEED_DSHIELD_ENABLED="FALSE"
NFTBAN_FEED_DSHIELD_INTERVAL="HOURLY"
NFTBAN_FEED_DSHIELD_URL="https://isc.sans.edu/api/sources/attacks/20/"
NFTBAN_FEED_DSHIELD_FILE="${CONFIG_DIR}/feeds/dshield-blacklist.conf"

# =============================================================================
# Feed #8: TOR Exit Nodes
# =============================================================================
# Description: TOR network exit node IP addresses
# Reputation: Official TOR project list, 100% accurate
# Update Recommendation: DAILY (TOR network changes daily)
# Typical Size: ~1,000 entries
# Use Case: Block anonymous TOR traffic (admin panels, sensitive services)
# WARNING: Blocking TOR may affect legitimate privacy-focused users
# Only enable if you have a specific reason to block TOR traffic
# -----------------------------------------------------------------------------
NFTBAN_FEED_TOR_ENABLED="FALSE"
NFTBAN_FEED_TOR_INTERVAL="DAILY"
NFTBAN_FEED_TOR_URL="https://check.torproject.org/torbulkexitlist"
NFTBAN_FEED_TOR_FILE="${CONFIG_DIR}/feeds/tor-blacklist.conf"

# =============================================================================
# Feed #9: Emerging Threats Compromised IPs
# =============================================================================
# Description: Known compromised hosts and malware distribution
# Reputation: Excellent - Proofpoint Emerging Threats, industry leader
# Update Recommendation: DAILY (compromised hosts discovered daily)
# Typical Size: ~5,000 entries
# Use Case: Recommended for ALL servers (blocks compromised/infected hosts)
# Note: Proactive protection against malware and C&C traffic
# -----------------------------------------------------------------------------
NFTBAN_FEED_EMERGING_THREATS_ENABLED="FALSE"
NFTBAN_FEED_EMERGING_THREATS_INTERVAL="DAILY"
NFTBAN_FEED_EMERGING_THREATS_URL="https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt"
NFTBAN_FEED_EMERGING_THREATS_FILE="${CONFIG_DIR}/feeds/emerging-threats-blacklist.conf"

# =============================================================================
# RECOMMENDED FEED COMBINATIONS
# =============================================================================
# Minimal Protection (Low Resource Usage):
#   - DShield Top 20 (MUST HAVE - only 20 IPs!)
#   - Spamhaus DROP (industry standard)
#   Total: ~1,020 IPs
#
# Standard Protection (Balanced):
#   - DShield Top 20
#   - Spamhaus DROP
#   - Abuse.ch Feodo Tracker
#   - Blocklist.de SSH (if SSH exposed)
#   Total: ~17,000 IPs
#
# Maximum Protection (High Resource Usage):
#   - All feeds enabled
#   Total: ~90,000 IPs
#
# To enable recommended feeds:
#   sudo nftban feeds enable dshield
#   sudo nftban feeds enable spamhaus
#   sudo nftban feeds enable abusech
#   sudo nftban feeds enable blocklistde_ssh
#   sudo nftban feeds timer-install
# =============================================================================

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
# Remember: Do not edit this file directly!
# Use /etc/nftban/config/nftban.conf.local for your customizations.
# =============================================================================
