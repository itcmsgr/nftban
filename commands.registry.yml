metrics:
  category: intelligence_reporting
  description: "Metrics collection with Prometheus/VictoriaMetrics"
  risk: setup
  audience: [cli]
  capability: service_control
  mutates: conditional
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  # ==========================================================================
  # AGENT/STORAGE MODEL
  # ==========================================================================
  # Two-step selection: Agent (what collects) + Storage (where stored)
  #
  # AGENT OPTIONS:
  #   prometheus  - Prometheus scrapes metrics (can also store locally)
  #   vmagent     - vmagent scrapes metrics (ships via remote_write)
  #   none        - No agent (use external scraper)
  #
  # STORAGE OPTIONS:
  #   prometheus-local - Store in local Prometheus TSDB
  #   vm-local         - Store in local VictoriaMetrics
  #   remote           - Ship to remote endpoint via remote_write
  # ==========================================================================
  options:
    # Collection agent
    agent:
      type: enum
      values: [prometheus, vmagent, none]
      default: prometheus
      description: "Metrics collection agent"
    # Storage target
    storage:
      type: enum
      values: [prometheus-local, vm-local, remote]
      default: prometheus-local
      description: "Where metrics are stored/shipped"
    # Remote endpoint (required when storage=remote)
    remote-write-url:
      type: url
      required_when: "storage=remote"
      description: "Remote write endpoint URL"
    # Retention period
    retention:
      type: duration
      default: "90d"
      description: "Data retention for local storage"
    # VM version override
    vm-version:
      type: string
      default: "v1.99.0"
      description: "VictoriaMetrics version to install"
    # Auth token file
    token:
      type: filepath
      description: "Bearer token file for remote auth"
    # External labels
    labels:
      type: string
      description: "External labels (key=val,key=val)"
    # DEPRECATED
    backend:
      type: enum
      values: [prometheus, victoriametrics]
      deprecated: true
      description: "DEPRECATED: Use --agent/--storage instead"
  # ==========================================================================
  # INSTALLATION MODES
  # ==========================================================================
  modes:
    # --- PROMETHEUS SETUPS ---
    A:
      name: "Prometheus Local"
      agent: prometheus
      storage: prometheus-local
      description: "Prometheus all-in-one: scrapes + stores locally"
      command: "nftban metrics enable --agent=prometheus"
      installs: [prometheus, node_exporter]
    C1:
      name: "Prometheus + VictoriaMetrics"
      agent: prometheus
      storage: vm-local
      description: "Prometheus scrapes -> VictoriaMetrics stores locally"
      command: "nftban metrics enable --agent=prometheus --storage=vm-local"
      installs: [prometheus, victoriametrics, node_exporter]
    # --- VMAGENT SETUPS ---
    B:
      name: "vmagent Remote"
      agent: vmagent
      storage: remote
      description: "vmagent ships to YOUR remote backend"
      command: "nftban metrics enable --agent=vmagent"
      installs: [vmagent, node_exporter]
      requires: [remote-write-url]
    C2:
      name: "vmagent + VictoriaMetrics"
      agent: vmagent
      storage: vm-local
      description: "vmagent scrapes -> local VictoriaMetrics stores"
      command: "nftban metrics enable --agent=vmagent --storage=vm-local"
      installs: [vmagent, victoriametrics, node_exporter]
    # --- SPECIAL MODES ---
    pro:
      name: "NFTBan Pro"
      agent: vmagent
      storage: remote
      description: "Ship to pro.nftban.com (subscription required)"
      command: "nftban metrics enable --pro"
      installs: [vmagent, node_exporter]
      requires: [pro_token]
    external:
      name: "External Agent"
      agent: none
      storage: remote
      description: "Only expose exporters, use your own agent"
      command: "nftban metrics enable --agent=none --storage=remote"
      installs: [node_exporter]
  # ==========================================================================
  # EXAMPLES
  # ==========================================================================
  examples:
    # Prometheus setups
    - "nftban metrics enable --agent=prometheus"
    - "nftban metrics enable --agent=prometheus --storage=vm-local"
    # vmagent setups
    - "nftban metrics enable --agent=vmagent --storage=remote"
    - "nftban metrics enable --agent=vmagent --storage=vm-local"
    # NFTBan Pro
    - "nftban metrics enable --pro"
    # Status
    - "nftban metrics status"
    - "nftban metrics pipeline --json"
    # Enterprise key
    - "nftban metrics enterprise-key set"
    - "nftban metrics enterprise-key status"
  # ==========================================================================
  # SUBCOMMANDS
  # ==========================================================================
  subcommands:
    status:
      mutates: false
      description: "Show metrics stack status"
    enable:
      mutates: true
      description: "Enable metrics with specified agent/storage"
    disable:
      mutates: true
      description: "Disable metrics collection"
    pipeline:
      mutates: false
      description: "Validate metrics pipeline health"
    set-backend:
      mutates: true
      deprecated: true
      description: "DEPRECATED: Use enable with --agent/--storage"
    enterprise-key:
      mutates: conditional
      description: "Manage VictoriaMetrics Enterprise trial keys"
      subcommands:
        set: {mutates: true, description: "Set enterprise trial key"}
        remove: {mutates: true, description: "Remove enterprise key"}
        status: {mutates: false, description: "Show enterprise key status"}
        validate: {mutates: false, description: "Validate key permissions"}
        fix-permissions: {mutates: true, description: "Fix key permissions"}

# =============================================================================
# ZABBIX EXPORTER (v1.3.0+)
# =============================================================================
zabbix:
  category: intelligence_reporting
  description: "Zabbix trapper export with multi-target support and LLD"
  risk: core
  audience: [cli]
  capability: service_control
  mutates: conditional
  supports_dry_run: true
  requires_root: false
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban zabbix status"
    - "nftban zabbix test"
    - "nftban zabbix push"
    - "nftban zabbix push --dry-run"
    - "nftban zabbix reload"
    - "nftban zabbix discovery"
    - "nftban zabbix template --version 7.0"
    - "nftban zabbix config"
  subcommands:
    setup:
      mutates: true
      description: "Interactive setup wizard"
      options:
        --server: {type: string, description: "Zabbix server address"}
        --port: {type: int, default: 10051, description: "Zabbix server port"}
        --hostname:
          type: string
          default: "auto"
          description: "Host name in Zabbix"
        --tls: {type: bool, description: "Enable TLS encryption"}
        --psk: {type: bool, description: "Use PSK authentication"}
        --non-interactive: {type: bool, description: "Non-interactive mode"}
    status:
      mutates: false
      description: "Show Zabbix exporter status and target health"
      options:
        --json: {type: bool, description: "Output in JSON format"}
        --verbose: {type: bool, description: "Show detailed info"}
    test:
      mutates: false
      description: "Test connectivity to Zabbix server"
      options:
        --verbose: {type: bool, description: "Show detailed test output"}
        --dry-run: {type: bool, description: "Preview without sending"}
        --quiet: {type: bool, description: "Minimal output"}
    push:
      mutates: false
      description: "Force immediate metrics push"
      options:
        --dry-run: {type: bool, description: "Preview metrics without sending"}
    reload:
      mutates: false
      description: "Re-read config and push metrics"
    template:
      mutates: false
      description: "Export Zabbix template (5.x/6.x/7.x)"
      options:
        --format:
          type: enum
          values: [xml, yaml]
          default: xml
          description: "Output format"
        --version:
          type: string
          default: "5.0"
          description: "Zabbix version (5.0/6.0/7.0)"
        --output: {type: string, description: "Output file path"}
    discovery:
      mutates: false
      description: "Trigger LLD discovery data send"
      arguments:
        type:
          type: enum
          required: false
          values: [modules, interfaces, countries, feeds, timers, all]
          default: all
    targets:
      mutates: conditional
      description: "Manage multiple Zabbix targets"
      subcommands:
        list:
          mutates: false
          description: "List configured targets"
          options:
            --json: {type: bool, description: "Output in JSON format"}
        add:
          mutates: true
          description: "Add a new target"
          arguments:
            name: {type: string, required: true, description: "Target name"}
          options:
            --server:
              type: string
              required: true
              description: "Zabbix server address"
            --port:
              type: int
              default: 10051
              description: "Zabbix server port"
            --filter:
              type: string
              default: "all"
              description: "Metrics filter"
        enable:
          mutates: true
          description: "Enable a target"
          arguments:
            name: {type: string, required: true, description: "Target name"}
        disable:
          mutates: true
          description: "Disable a target"
          arguments:
            name: {type: string, required: true, description: "Target name"}
        remove:
          mutates: true
          description: "Remove a target"
          arguments:
            name: {type: string, required: true, description: "Target name"}
    config:
      mutates: conditional
      description: "Show/modify Zabbix configuration"
      subcommands:
        show:
          mutates: false
          description: "Show current configuration"
          options:
            --json: {type: bool, description: "Output in JSON format"}
        set:
          mutates: true
          description: "Set configuration value"
          arguments:
            key:
              type: string
              required: true
              description: "Configuration key"
            value:
              type: string
              required: true
              description: "Configuration value"
        enable:
          mutates: true
          description: "Enable Zabbix integration"
        disable:
          mutates: true
          description: "Disable Zabbix integration"

