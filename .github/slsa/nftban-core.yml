# =============================================================================
# NFTBan Core - SLSA GoReleaser Configuration
# =============================================================================
# This config tells the SLSA builder how to build nftban-core
# Reference: https://github.com/slsa-framework/slsa-github-generator

version: 1

# Environment variables available during build
# Note: VERSION is passed via evaluated-envs in workflow, not defined here
env:
  - CGO_ENABLED=0

# Build flags
# Note: -mod=readonly not supported by SLSA builder
flags:
  - -trimpath

# Linker flags (inject version info)
ldflags:
  - -s -w
  - -X main.GitCommit={{ .Commit }}
  - -X main.BuildDate={{ .CommitDate }}
  - -X github.com/itcmsgr/nftban/pkg/version.FullVersion={{ .Env.VERSION }}

# Build targets (single target per config - SLSA builder requirement)
goos: linux
goarch: amd64

# Main package path
main: ./cmd/nftban-core

# Output binary name pattern
binary: nftban-core-{{ .Os }}-{{ .Arch }}
