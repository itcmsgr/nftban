# =============================================================================
# NFTBan Suricata Profile: Maximum
# =============================================================================
# Target: 8+ cores, 8-16 GB RAM
# Focus: Deep inspection and comprehensive coverage
# Use Case: High-traffic servers, dedicated security appliances
#
# BASELINE CORRECTIONS (v1.12.6):
# - tpacket-v3: yes (75-81% memory savings on RHEL-family)
# - mpm-algo: hs (Hyperscan pattern matching, auto-fallback safe)
# - stream.inline: yes (faster alert emission per Victor Julien)
# - checksum-validation: no (kernel/NIC already validates)
# - stream.bypass: yes with depth: 1mb (skip long-session deep inspection)
# =============================================================================

%YAML 1.1
---

# Packet capture interface
af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    ring-size: 300000          # LARGE buffer
    use-mmap: yes
    tpacket-v3: yes            # BASELINE: 75-81% memory savings on RHEL

# Threading configuration
threading:
  set-cpu-affinity: yes        # Pin threads to CPUs
  detect-thread-ratio: 2.0     # Aggressive parallelism
  cpu-affinity:
    management-cpu-set:
      cpu: [ 0 ]
    worker-cpu-set:
      cpu: [ 1, 2, 3, 4, 5, 6, 7 ]
      mode: exclusive

# Flow timeout settings (ALIGNED: 60s established per NFTBan constraint)
flow:
  memcap: 256mb                # High memory allocation
  hash-size: 262144
  prealloc: 40000
  timeout:
    new: 30
    established: 60            # ALIGNED with NFTBan constraint (was 300)
    closed: 0
    bypassed: 100
    emergency-new: 10
    emergency-established: 30
    emergency-closed: 0

# Stream engine
stream:
  memcap: 128mb                # Large stream memory
  checksum-validation: no      # BASELINE: kernel/NIC already validates
  inline: yes                  # BASELINE: faster alert emission (Victor Julien)
  bypass: yes                  # BASELINE: skip long-session deep inspection
  reassembly:
    depth: 1mb                 # BASELINE: bypass after 1MB transferred
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

# HTTP configuration (FULL body inspection)
app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 30kb       # FULL request inspection
          response-body-limit: 0         # DISABLED per NFTBan constraint
          request-body-minimal-inspect-size: 8192
          request-body-inspect-window: 8192
          response-body-minimal-inspect-size: 8192
          response-body-inspect-window: 8192
          double-decode-path: yes
          double-decode-query: yes

    tls:
      enabled: yes
      detection-ports:
        dp: 443
      ja3-fingerprints: yes

    ssh:
      enabled: yes

    dns:
      enabled: yes
      tcp:
        enabled: yes
      udp:
        enabled: yes

    smtp:
      enabled: yes
      raw-extraction: yes        # Full SMTP inspection
      mime:
        decode-mime: yes
        decode-base64: yes
        decode-quoted-printable: yes

    mysql:
      enabled: yes

    # ALL protocols enabled
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445

    dcerpc:
      enabled: yes

    ftp:
      enabled: yes

    nfs:
      enabled: yes

    tftp:
      enabled: yes

    ikev2:
      enabled: yes

    krb5:
      enabled: yes

    ntp:
      enabled: yes

    dhcp:
      enabled: yes

    rfb:
      enabled: yes

    sip:
      enabled: yes

# Logging configuration (ALIGNED with NFTBan constraints)
outputs:
  - fast:
      enabled: no

  # 1) NFTBan daemon reads ONLY this file (alert-only, minimal I/O)
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/nftban/suricata/eve-alerts.json
      threaded: yes

      types:
        - alert:
            payload: no          # DISABLED per NFTBan constraint
            packet: no           # DISABLED per NFTBan constraint
            metadata: yes

  # 2) Optional admin/audit log (OFF by default to avoid I/O storms)
  #    Enable manually for deep forensics when needed
  - eve-log:
      enabled: no
      filetype: regular
      filename: /var/log/nftban/suricata/eve-audit.json
      threaded: yes

      types:
        - alert:
            payload: yes
            payload-buffer-size: 8kb
            payload-printable: yes
            packet: yes
            metadata: yes
            tagged-packets: yes
        - anomaly:
            enabled: yes
            types:
              applayer: yes
              stream: yes
              decode: yes
        - http:
            extended: yes
            dump-all-headers: yes
        - dns:
            query: yes
            answer: yes
            version: 2
        - tls:
            extended: yes
            session-resumption: yes
            custom: [subject, issuer, session_resumed, fingerprint, sni, version, not_before, not_after, certificate, chain, ja3, ja3s]
        - ssh
        - smtp:
            extended: yes
        # NOTE: flow/netflow/stats moved to separate optional log
        # to prevent I/O storms on audit path

  # 3) Optional performance/stats log (OFF by default)
  #    Enable for capacity planning or debugging only
  - eve-log:
      enabled: no
      filetype: regular
      filename: /var/log/nftban/suricata/eve-stats.json
      threaded: yes

      types:
        - stats:
            totals: yes
            threads: yes
        - flow
        - netflow

# Detection engine (HIGH performance)
detect:
  profile: high                # HIGH CPU usage for deep inspection
  mpm-algo: hs                 # BASELINE: Hyperscan (auto-fallback if unavailable)
  custom-values:
    toclient-groups: 4
    toserver-groups: 4
  sgh-mpm-context: full
  inspection-recursion-limit: 3000

# Profiling (OFF by default - enable only for tuning sessions)
profiling:
  rules:
    enabled: no
    filename: /var/log/nftban/suricata/rule_perf.log
    append: yes
  keywords:
    enabled: no
    filename: /var/log/nftban/suricata/keyword_perf.log
    append: yes

# Detection engine configuration
detect-engine:
  - profile: high
  - sgh-mpm-context: full
  - inspection-recursion-limit: 3000
  - rule-reload: true

# Default rule path
default-rule-path: /var/lib/suricata/rules

# Rule files (managed by NFTBan)
rule-files:
  - /etc/nftban/suricata/rules/enabled.list

# Classification file
classification-file: /etc/suricata/classification.config

# Reference config file
reference-config-file: /etc/suricata/reference.config

# GeoIP database
geoip-database: /var/lib/GeoIP/GeoLite2-Country.mmdb

# File extraction (optional, disabled by default for performance)
# Uncomment to enable file extraction:
#file-store:
#  enabled: yes
#  dir: /var/log/suricata/files
#  write-fileinfo: yes
#  force-hash: [md5, sha256]
#  force-filestore: no
#  stream-depth: 1mb
#  max-open-files: 1000

# =============================================================================
# NFTBan Integration Notes:
# - This profile is for HIGH-END servers (8+ cores / 8-16GB RAM)
# - HTTP request body inspection ENABLED (30KB), response body DISABLED
# - Flow timeouts: ALIGNED (60s established per NFTBan constraint)
# - ALL protocols enabled (HTTP, TLS, SSH, DNS, SMTP, MySQL, SMB, DCERPC, FTP, etc.)
# - Ring size: 300k frames (6x minimal profile)
# - Detection profile: HIGH (most aggressive)
# - CPU affinity enabled (pin threads)
# - Output: alert-only to eve-alerts.json (daemon path)
# - Audit log: disabled by default (eve-audit.json)
# - Stats log: disabled by default (eve-stats.json) - for capacity planning only
#
# BASELINE CORRECTIONS (v1.12.6):
# - tpacket-v3: yes - Recommended by Suricata, 75-81% memory savings on RHEL
# - mpm-algo: hs - Hyperscan pattern matching, auto-fallback safe
# - stream.inline: yes - Faster alert emission per Victor Julien guidance
# - checksum-validation: no - Kernel/NIC already validates, avoid redundant work
# - stream.bypass: yes - Skip long-session deep inspection (NFTBan uses early signals)
# =============================================================================
