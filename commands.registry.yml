port:
  category: infrastructure
  description: "Port allow/block management with protocol and direction control (IPv4+IPv6 applied automatically)"
  risk: advanced
  audience: [cli]
  capability: policy_change
  mutates: conditional
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  notes:
    - "All port rules apply to both IPv4 and IPv6 automatically"
    - "Direction is required: in (inbound), out (outbound), or inout (bidirectional)"
    - "Protocol is required: tcp, udp, or both"
  examples:
    - "nftban port status                    # Show all port rules and listening ports"
    - "nftban port add 80 tcp in             # Allow HTTP inbound (IPv4+IPv6)"
    - "nftban port add 443 both inout        # Allow HTTPS TCP+UDP bidirectional"
    - "nftban port add 10050 tcp in          # Allow Zabbix agent inbound"
    - "nftban port add 25 tcp out            # Allow SMTP outbound only"
    - "nftban port add 53 udp inout          # Allow DNS UDP bidirectional"
    - "nftban port remove 8080               # Remove port 8080 from whitelist"
    - "nftban port block 3389                # Block RDP (alias for remove)"
    - "nftban port unblock 3389              # Unblock RDP (adds with both/inout)"
    - "nftban port status --json             # JSON output for scripting"
  subcommands:
    status:
      mutates: false
      description: "Show port status (listening ports vs firewall rules, IPv4+IPv6)"
      syntax: "nftban port status [--json]"
      options:
        --json: {type: bool, description: "Output in JSON format"}
      notes:
        - "Shows which ports are listening and which are allowed in firewall"
        - "Compares active listeners against nftables whitelist rules"
    list:
      mutates: false
      deprecated: true
      description: "DEPRECATED alias of 'status' (dispatch arm 'status|list' maps to the same handler)"
    detailed:
      mutates: false
      description: "Show detailed status with BIND address and PROCESS columns"
      syntax: "nftban port detailed"
    add:
      mutates: true
      description: "Add port to whitelist (IPv4+IPv6 applied automatically)"
      syntax: "nftban port add <port> <protocol> <direction>"
      arguments:
        port:
          type: int
          required: true
          description: "Port number (1-65535)"
        protocol:
          type: enum
          values: [tcp, udp, both]
          required: true
          description: "Protocol: tcp, udp, or both (tcp+udp)"
        direction:
          type: enum
          values: [in, out, inout]
          required: true
          description: "Direction: in (inbound only), out (outbound only), or inout (bidirectional)"
      notes:
        - "Rules are added to both IPv4 and IPv6 nftables sets"
        - "Use 'both' protocol for services that need TCP and UDP (e.g., DNS)"
        - "Use 'inout' direction for bidirectional traffic (most services)"
    remove:
      mutates: true
      description: "Remove port from whitelist (removes from all protocols/directions)"
      syntax: "nftban port remove <port>"
      arguments:
        port: {type: int, required: true, description: "Port number (1-65535)"}
    block:
      mutates: true
      description: "Block port - alias for remove (removes from whitelist)"
      syntax: "nftban port block <port>"
      arguments:
        port: {type: int, required: true, description: "Port number (1-65535)"}
    unblock:
      mutates: true
      description: "Unblock port - quick whitelist with protocol=both, direction=inout"
      syntax: "nftban port unblock <port>"
      arguments:
        port: {type: int, required: true, description: "Port number (1-65535)"}
      notes:
        - "Shortcut equivalent to: nftban port add <port> both inout"
        - "Use 'add' command for more specific protocol/direction control"
    html-report:
      mutates: false
      description: "Generate HTML port status report (includes IPv4+IPv6 rules)"
      syntax: "nftban port html-report"
    mail-report:
      mutates: false
      description: "Email port status report"
      syntax: "nftban port mail-report [recipient]"
      arguments:
        path: {type: string, required: false, description: "Report file path"}
        recipient: {type: string, required: false, description: "Email recipient"}
    allow-panel:
      mutates: true
      description: "Allow control panel ports (auto-adds IPv4+IPv6 rules for panel services)"
      syntax: "nftban port allow-panel <panel>"
      arguments:
        panel: {type: enum, values: [directadmin], required: true, description: "Panel name"}
      notes:
        - "Automatically whitelists all ports required by the control panel"
        - "See 'nftban panel' command for more panel options"
    allow:
      mutates: true
      description: "Per-IP per-port access control using nft concat sets (v1.41.0)"
      syntax: "nftban port allow <action> <port> from <ip> [--proto tcp|udp] [--timeout 1h] [--comment text]"
      notes:
        - "Uses nft concat sets (ipv4_addr . inet_service) for IP+port access"
        - "Rules apply AFTER blacklist — banned IPs are always dropped"
        - "Persisted to /etc/nftban/access.d/port_allow.conf"
        - "Requires kernel 5.6+ for concat set timeout support"
      subcommands:
        add:
          mutates: true
          description: "Grant per-IP access to a specific port"
          syntax: "nftban port allow add <port> from <ip> [--proto tcp|udp] [--timeout 1h] [--comment text]"
          arguments:
            port: {type: int, required: true, description: "Port number (1-65535)"}
            ip: {type: string, required: true, description: "IPv4 or IPv6 address"}
          options:
            --proto: {type: enum, values: [tcp, udp], default: tcp, description: "Protocol"}
            --timeout: {type: string, default: "0", description: "Timeout duration (e.g., 1h, 30m, 7d). 0 = permanent"}
            --comment: {type: string, description: "Optional comment"}
        remove:
          mutates: true
          description: "Revoke per-IP port access"
          syntax: "nftban port allow remove <port> from <ip> [--proto tcp|udp]"
        list:
          mutates: false
          description: "List all per-IP port access rules"
          syntax: "nftban port allow list [--json]"
          options:
            --json: {type: bool, description: "Output in JSON format"}
        flush:
          mutates: true
          description: "Remove all per-IP port access rules"
          syntax: "nftban port allow flush [--yes]"
    egress:
      mutates: conditional
      description: "Outbound port policy audit and enforcement"
      syntax: "nftban port egress <command>"
      notes:
        - "Phase 1: Learning mode (policy accept) with audit logging"
        - "Phase 2: Audit unknown outbound ports from kernel logs"
        - "Phase 3: Enforce restrictive outbound policy (policy drop)"
        - "Use 'nftban emulate --out <ip:port>' to test specific outbound connections"
      subcommands:
        stats:
          mutates: false
          description: "Show outbound traffic counters and allowed ports"
          syntax: "nftban port egress stats"
        audit:
          mutates: false
          description: "Parse kernel logs to find unknown outbound ports"
          syntax: "nftban port egress audit [hours]"
          arguments:
            hours:
              type: int
              required: false
              default: 24
              description: "Hours of logs to analyze (default: 24)"
        recommend:
          mutates: false
          description: "Suggest policy additions based on audit observations"
          syntax: "nftban port egress recommend"
          notes:
            - "Requires prior 'nftban port egress audit' to collect data"
            - "Shows commands to add missing ports"
        enforce:
          mutates: true
          description: "Enable restrictive outbound policy (policy drop)"
          syntax: "nftban port egress enforce"
          notes:
            - "Requires confirmation - type 'ENFORCE' to proceed"
            - "Only allowed ports will work after enforcement"
            - "Use 'nftban emulate --out' to test before enforcing"

