# =============================================================================
# NFTBan v1.3.0 - Zabbix Exporter Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Zabbix trapper protocol export settings
#
# IMPORTANT: Do NOT edit this file - it will be overwritten on updates!
# Create /etc/nftban/conf.d/zabbix.conf.local for your customizations.
#
# meta:name="zabbix.conf"
# meta:type="config"
# meta:description="Default Zabbix exporter settings"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units="nftban-unified-exporter.timer"
# meta:inventory.network="outbound:10051/tcp"
# meta:inventory.privileges="user"
# =============================================================================
#
# FIREWALL REQUIREMENTS:
# ----------------------
# NFTBan needs OUTBOUND access to your Zabbix server on port 10051 (trapper).
# When NFTBAN_ZABBIX_FIREWALL_AUTO=true AND NFTBAN_ZABBIX_ENABLED=true:
#   - NFTBan automatically adds outbound rule: TCP to ZABBIX_SERVER:10051
#   - Rule is added when service is ENABLED (not during install)
#   - Rule is removed when Zabbix export is disabled
#
# Manual firewall setup (if auto is disabled):
#   nft add rule inet nftban output ip daddr <ZABBIX_SERVER> tcp dport 10051 accept
#
# QUICK SETUP:
# ------------
# 1. Create /etc/nftban/conf.d/zabbix.conf.local with:
#      NFTBAN_ZABBIX_ENABLED="true"
#      NFTBAN_ZABBIX_SERVER="your-zabbix-server.example.com"
# 2. Enable the timer: systemctl enable --now nftban-unified-exporter.timer
# 3. Test: nftban zabbix test
#
# =============================================================================

# =============================================================================
# ZABBIX EXPORT - MAIN SETTINGS
# =============================================================================

# Enable Zabbix trapper export (requires server configuration)
NFTBAN_ZABBIX_ENABLED="false"

# Primary Zabbix server hostname or IP (REQUIRED when enabled)
# Example: "zabbix.example.com" or "192.168.1.100"
# Set this in zabbix.conf.local
NFTBAN_ZABBIX_SERVER=""

# Zabbix trapper port (default: 10051)
# This is the port Zabbix server listens on for trapper data
NFTBAN_ZABBIX_PORT="10051"

# Auto-configure firewall for Zabbix outbound connection
# When true: Automatically allows outbound TCP to ZABBIX_SERVER:ZABBIX_PORT
NFTBAN_ZABBIX_FIREWALL_AUTO="true"

# Host name as registered in Zabbix
# "auto" = use system hostname
NFTBAN_ZABBIX_HOSTNAME="auto"

# Metrics push interval in seconds
NFTBAN_ZABBIX_INTERVAL="60"

# =============================================================================
# MULTI-TARGET / FAILOVER
# =============================================================================

# Secondary Zabbix server (for failover)
NFTBAN_ZABBIX_SERVER_SECONDARY=""
NFTBAN_ZABBIX_PORT_SECONDARY="10051"

# Send mode: all, primary, failover
# - all:      Send to all configured servers
# - primary:  Send only to primary server
# - failover: Send to primary, fall back to secondary on failure
NFTBAN_ZABBIX_SEND_MODE="failover"

# =============================================================================
# TLS / PSK ENCRYPTION (Zabbix 5.x+)
# =============================================================================

# Enable TLS encryption
NFTBAN_ZABBIX_TLS_ENABLED="false"

# PSK identity string (must match Zabbix host configuration)
NFTBAN_ZABBIX_TLS_PSK_IDENTITY=""

# Path to PSK file (hex string, 32-128 characters)
NFTBAN_ZABBIX_TLS_PSK_FILE=""

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Maximum metrics per batch send
NFTBAN_ZABBIX_BATCH_SIZE="100"

# Retry attempts on connection failure
NFTBAN_ZABBIX_RETRY_COUNT="3"

# Seconds between retries
NFTBAN_ZABBIX_RETRY_INTERVAL="5"

# LLD discovery refresh interval (0 = sync with metrics interval)
NFTBAN_ZABBIX_LLD_INTERVAL="0"

# =============================================================================
# DEBUG
# =============================================================================

# Enable debug logging for Zabbix exporter
NFTBAN_ZABBIX_DEBUG="false"
