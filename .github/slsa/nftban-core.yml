# =============================================================================
# NFTBan Core - SLSA GoReleaser Configuration
# =============================================================================
# This config tells the SLSA builder how to build nftban-core
# Reference: https://github.com/slsa-framework/slsa-github-generator

version: 1

# Environment variables available during build
# Note: VERSION is passed via evaluated-envs in workflow, not defined here
env:
  - CGO_ENABLED=0

# Build flags
# Note: -mod=readonly not supported by SLSA builder
flags:
  - -trimpath

# Linker flags (inject version info)
# Note: Only {{ .Env.VERSION }} is supported (passed via evaluated-envs)
# {{ .Commit }} and {{ .CommitDate }} are not valid SLSA builder templates
#
# ⛔ THE -X TARGET MUST BE A STRING *VARIABLE*. This previously read
#    `...pkg/version.FullVersion=`, but FullVersion is a FUNC (version.go:103).
#    `-X` only rewrites string vars; naming a func symbol is a SILENT NO-OP --
#    the link succeeds, emits no warning, and the binary keeps the "dev"
#    default. Measured on lab4 (go1.25.12) against the exact package shape:
#
#      -X ...version.FullVersion=v9.9.9  -> build rc=0, Version=dev,  FullVersion=vdev
#      -X ...version.Version=v9.9.9      -> build rc=0, Version=v9.9.9
#
#    So every nftban-core the SLSA builder has ever produced reported "vdev".
#    A green build is not an injected build.
#
#    VERSION here is github.ref_name (release.yml:626), which on a tag push
#    carries the 'v'; build.sh:106 injects the bare $(cat VERSION). Both render
#    correctly because FullVersion() is prefix-idempotent as of v1.231.0. The
#    raw `version.Version` string still differs in FORM between the two build
#    paths -- see the note on release.yml:306 -- which is tracked separately.
ldflags:
  - -s -w
  - -X github.com/itcmsgr/nftban/pkg/version.Version={{ .Env.VERSION }}

# Build targets (single target per config - SLSA builder requirement)
goos: linux
goarch: amd64

# Main package path
main: ./cmd/nftban-core

# Output binary name pattern
binary: nftban-core-{{ .Os }}-{{ .Arch }}
