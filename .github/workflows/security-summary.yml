# =============================================================================
# NFTBan - Security Summary & Alerts
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Aggregate security findings from all tools and create summary report
#
# Runs on:
#   - Daily at 7:00 AM UTC
#   - Manual trigger
#
# Features:
#   - Aggregates alerts from all security tools
#   - Creates GitHub Issue if HIGH/CRITICAL found
#   - Generates security report artifact
#   - Tracks vulnerability trends
# =============================================================================

name: Security Summary

on:
  schedule:
    - cron: '0 7 * * *'  # Daily 7:00 AM UTC
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create issue even if no critical findings'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: security-summary
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate Security Findings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # v1.237 (CI-SECURITY-SUMMARY-REPORTS-CLEAN-WITH-ALERTS-AND-MALFORMED-COUNTS, GitHub #1323): the old
      # collection counted severity GROUPS, not alerts (any number of High showed as 1), read only the
      # first page, and turned an API failure into "0" (a 403 body plus "0" became a table cell).
      # Malformed values then broke the totals and the status fell through to CLEAN. Now:
      #   - every page is read (--paginate) and each alert is counted;
      #   - a source that cannot be read is UNKNOWN, never 0, and its error is shown in the report;
      #   - the overall status comes from known counts; an unreadable source can never yield CLEAN.
      - name: Collect alerts
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # collect <key> <endpoint> <jq emitting one severity per open alert>
          collect() {
            local key=$1 ep=$2 expr=$3 out rc
            out=$(gh api --paginate "repos/${REPO}/${ep}?state=open&per_page=100" --jq "$expr" 2>"err_${key}.txt"); rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "${key}_state=UNKNOWN" >> "$GITHUB_OUTPUT"
              echo "${key}_error=$(head -c 300 "err_${key}.txt" | tr '\n\r|' '   ')" >> "$GITHUB_OUTPUT"
              echo "${key}: UNKNOWN (api rc=$rc): $(head -c 300 "err_${key}.txt")"
              return 0
            fi
            local s n
            echo "${key}_state=OK" >> "$GITHUB_OUTPUT"
            for s in critical high medium low; do
              n=$(printf '%s\n' "$out" | grep -cx "$s" || true)
              echo "${key}_${s}=$n" >> "$GITHUB_OUTPUT"
            done
            n=$(printf '%s\n' "$out" | grep -c . || true)
            echo "${key}_total=$n" >> "$GITHUB_OUTPUT"
            echo "${key}: OK total=$n"
          }
          collect cs code-scanning/alerts '.[] | (.rule.security_severity_level // "none")'
          collect db dependabot/alerts    '.[] | (.security_vulnerability.severity // "none")'
          collect ss secret-scanning/alerts '.[] | "secret"'

      - name: Generate Security Report
        id: report
        env:
          O_CS_STATE: ${{ steps.collect.outputs.cs_state }}
          O_CS_ERR: ${{ steps.collect.outputs.cs_error }}
          O_CS_C: ${{ steps.collect.outputs.cs_critical }}
          O_CS_H: ${{ steps.collect.outputs.cs_high }}
          O_CS_M: ${{ steps.collect.outputs.cs_medium }}
          O_CS_L: ${{ steps.collect.outputs.cs_low }}
          O_CS_T: ${{ steps.collect.outputs.cs_total }}
          O_DB_STATE: ${{ steps.collect.outputs.db_state }}
          O_DB_ERR: ${{ steps.collect.outputs.db_error }}
          O_DB_C: ${{ steps.collect.outputs.db_critical }}
          O_DB_H: ${{ steps.collect.outputs.db_high }}
          O_DB_M: ${{ steps.collect.outputs.db_medium }}
          O_DB_L: ${{ steps.collect.outputs.db_low }}
          O_DB_T: ${{ steps.collect.outputs.db_total }}
          O_SS_STATE: ${{ steps.collect.outputs.ss_state }}
          O_SS_ERR: ${{ steps.collect.outputs.ss_error }}
          O_SS_T: ${{ steps.collect.outputs.ss_total }}
        run: |
          set -u
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          # cell <state> <value>: UNKNOWN when the source could not be read
          cell() { if [ "$1" = OK ]; then printf '%s' "${2:-0}"; else printf 'UNKNOWN'; fi; }
          num()  { if [ "$1" = OK ]; then printf '%s' "${2:-0}"; else printf '0'; fi; }

          TOTAL_CRITICAL=$(( $(num "$O_CS_STATE" "$O_CS_C") + $(num "$O_DB_STATE" "$O_DB_C") ))
          TOTAL_HIGH=$(( $(num "$O_CS_STATE" "$O_CS_H") + $(num "$O_DB_STATE" "$O_DB_H") ))
          TOTAL_MEDIUM=$(( $(num "$O_CS_STATE" "$O_CS_M") + $(num "$O_DB_STATE" "$O_DB_M") ))
          SECRETS=$(num "$O_SS_STATE" "$O_SS_T")
          TOTAL_KNOWN=$(( $(num "$O_CS_STATE" "$O_CS_T") + $(num "$O_DB_STATE" "$O_DB_T") + SECRETS ))
          UNREADABLE=""
          [ "$O_CS_STATE" = OK ] || UNREADABLE="$UNREADABLE code-scanning"
          [ "$O_DB_STATE" = OK ] || UNREADABLE="$UNREADABLE dependabot"
          [ "$O_SS_STATE" = OK ] || UNREADABLE="$UNREADABLE secret-scanning"

          # Determine status from KNOWN counts; an unreadable source can never yield CLEAN.
          if [ "$TOTAL_CRITICAL" -gt 0 ] || [ "$SECRETS" -gt 0 ]; then STATUS="CRITICAL"; EMOJI="🔴"
          elif [ "$TOTAL_HIGH" -gt 0 ]; then STATUS="HIGH"; EMOJI="🟠"
          elif [ "$TOTAL_MEDIUM" -gt 0 ]; then STATUS="MEDIUM"; EMOJI="🟡"
          elif [ -n "$UNREADABLE" ]; then STATUS="UNKNOWN"; EMOJI="⚪"
          elif [ "$TOTAL_KNOWN" -gt 0 ]; then STATUS="LOW"; EMOJI="🔵"
          else STATUS="CLEAN"; EMOJI="🟢"
          fi
          TOTAL_CELL="$TOTAL_KNOWN"; [ -n "$UNREADABLE" ] && TOTAL_CELL="${TOTAL_KNOWN}+UNKNOWN"

          # Create report
          cat > security-report.md << EOF
          # $EMOJI NFTBan Security Summary - $DATE

          ## Overall Status: **$STATUS**

          | Category | Critical | High | Medium | Low | Total |
          |----------|----------|------|--------|-----|-------|
          | Code Scanning (security severity) | $(cell "$O_CS_STATE" "$O_CS_C") | $(cell "$O_CS_STATE" "$O_CS_H") | $(cell "$O_CS_STATE" "$O_CS_M") | $(cell "$O_CS_STATE" "$O_CS_L") | $(cell "$O_CS_STATE" "$O_CS_T") |
          | Dependabot | $(cell "$O_DB_STATE" "$O_DB_C") | $(cell "$O_DB_STATE" "$O_DB_H") | $(cell "$O_DB_STATE" "$O_DB_M") | $(cell "$O_DB_STATE" "$O_DB_L") | $(cell "$O_DB_STATE" "$O_DB_T") |
          | Secret Scanning | - | - | - | - | $(cell "$O_SS_STATE" "$O_SS_T") |
          | **Total** | **$TOTAL_CRITICAL** | **$TOTAL_HIGH** | **$TOTAL_MEDIUM** | - | **$TOTAL_CELL** |

          Code-scanning Total includes alerts without a security severity (code-quality findings).
          EOF
          if [ -n "$UNREADABLE" ]; then
            {
              echo
              echo "## Access failures (reported as UNKNOWN, not 0)"
              echo
              [ "$O_CS_STATE" = OK ] || echo "- code-scanning: ${O_CS_ERR}"
              [ "$O_DB_STATE" = OK ] || echo "- dependabot: ${O_DB_ERR}"
              [ "$O_SS_STATE" = OK ] || echo "- secret-scanning: ${O_SS_ERR}"
            } >> security-report.md
          fi
          cat >> security-report.md << EOF

          ## Quick Links

          - [Code Scanning Alerts](https://github.com/${{ github.repository }}/security/code-scanning)
          - [Dependabot Alerts](https://github.com/${{ github.repository }}/security/dependabot)
          - [Secret Scanning](https://github.com/${{ github.repository }}/security/secret-scanning)
          - [Security Overview](https://github.com/${{ github.repository }}/security)
          - [OpenSSF Scorecard](https://securityscorecards.dev/viewer/?uri=github.com/${{ github.repository }})

          ## Automated Fixes

          - **Dependabot PRs**: Check [Pull Requests](https://github.com/${{ github.repository }}/pulls?q=is%3Aopen+label%3Adependencies) for auto-fix PRs
          - **go mod tidy**: Run locally to update go.sum after merging dependency PRs

          ---
          *Generated by Security Summary workflow*
          EOF

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "total_critical=$TOTAL_CRITICAL" >> "$GITHUB_OUTPUT"
          echo "total_high=$TOTAL_HIGH" >> "$GITHUB_OUTPUT"
          echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"
          echo "emoji=$EMOJI" >> "$GITHUB_OUTPUT"

          cat security-report.md

      - name: Upload Security Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-${{ github.run_number }}
          path: security-report.md
          retention-days: 90

      - name: Create Issue for Critical/High Findings
        if: steps.report.outputs.status == 'CRITICAL' || steps.report.outputs.status == 'HIGH'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if issue already exists (search by title pattern instead of label)
          EXISTING=$(gh issue list --state open --json title --jq '[.[] | select(.title | startswith("🔴 Security Alert:"))] | length')

          if [ "$EXISTING" -eq 0 ]; then
            # Create issue without labels (labels may not exist in repo)
            gh issue create \
              --title "🔴 Security Alert: ${{ steps.report.outputs.status }} findings (${{ steps.report.outputs.total_critical }} critical, ${{ steps.report.outputs.total_high }} high)" \
              --body-file security-report.md
            echo "Created new security alert issue"
          else
            echo "Security alert issue already exists, skipping creation"
          fi

      - name: Summary
        run: |
          echo "## Security Summary" >> $GITHUB_STEP_SUMMARY
          cat security-report.md >> $GITHUB_STEP_SUMMARY
