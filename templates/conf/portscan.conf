# =============================================================================
# NFTBan Port Scan Detection Configuration Template
# Version: init 1.0
# Template Name: portscan.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
# =============================================================================
#
# ⚠️  CRITICAL WARNING - READ BEFORE ENABLING PORT SCAN DETECTION ⚠️
#
# Port scan detection can cause MANY FALSE POSITIVES and ban legitimate users!
# All detection is DISABLED by default for safety.
#
# COMMON FALSE POSITIVE SCENARIOS:
# 1. Web browsers - Modern browsers open many connections to different ports
# 2. Mobile apps - Apps often probe multiple services on startup
# 3. Load balancers - Health checks may look like port scans
# 4. Monitoring tools - Nagios, Zabbix, etc. check multiple ports
# 5. CDNs - Cloudflare, Akamai may probe multiple ports
# 6. Security scanners - Legitimate vulnerability scanners (Nessus, OpenVAS)
# 7. Network discovery - DHCP, mDNS, UPnP can trigger false positives
# 8. Legitimate bots - Search engines, API clients, feed readers
#
# BEFORE ENABLING PORT SCAN DETECTION:
# 1. Understand your legitimate traffic patterns first
# 2. Whitelist ALL monitoring tools, load balancers, CDNs
# 3. Start in DRY-RUN mode (detect but don't ban)
# 4. Monitor logs for 1-2 weeks to identify false positives
# 5. Tune thresholds based on your specific environment
# 6. Enable AUTO-BAN only after confirming low false positive rate
# 7. Have console/VNC access ready in case of lockout
#
# RECOMMENDED APPROACH:
# 1. Enable PORTSCAN_ENABLED="1" (detection only)
# 2. Keep PORTSCAN_AUTO_BAN="0" (no automatic banning)
# 3. Set PORTSCAN_DRY_RUN="1" (testing mode)
# 4. Monitor logs: tail -f /var/log/nftban/portscan-detection.log
# 5. Whitelist false positives as you find them
# 6. After 1-2 weeks, if clean, enable auto-ban
#
# DANGER SCENARIOS:
# - Corporate NAT: One IP = hundreds of users = guaranteed false positive
# - High-traffic sites: Legitimate users may trigger thresholds
# - APIs: Clients probing multiple endpoints look like port scans
# - IPv6: Single user can have many IPs, making detection unreliable
#
# =============================================================================

# =============================================================================
# MASTER SWITCH - GLOBAL PORT SCAN DETECTION
# =============================================================================
# ⚠️  WARNING: Port scan detection has HIGH false positive rates!
#
# When set to "0", ALL port scan detection is disabled (SAFE DEFAULT)
# When set to "1", detection runs but behavior depends on other settings
#
# Recommended workflow:
# Phase 1 (1-2 weeks): PORTSCAN_ENABLED="1", AUTO_BAN="0", DRY_RUN="1"
#                      → Collect data, identify false positives
# Phase 2 (1 week):    PORTSCAN_ENABLED="1", AUTO_BAN="0", DRY_RUN="0"
#                      → Log real detections, refine whitelist
# Phase 3 (ongoing):   PORTSCAN_ENABLED="1", AUTO_BAN="1", DRY_RUN="0"
#                      → Only after confirming low false positive rate
# =============================================================================

# Enable/disable port scan detection (master switch)
# "0" = ALL port scan detection DISABLED (SAFE DEFAULT)
# "1" = Enable detection (behavior controlled by settings below)
PORTSCAN_ENABLED="0"

# Log all port scan detections
# "1" = Log detections (recommended for monitoring)
# "0" = No logging (not recommended)
PORTSCAN_LOGGING="1"

# Send email alerts for detected port scans
# "1" = Send email alerts (can be VERY noisy)
# "0" = No email alerts (recommended until tuned)
PORTSCAN_EMAIL_ALERTS="0"

# =============================================================================
# DETECTION PARAMETERS
# =============================================================================
# ⚠️  WARNING: Low thresholds = High false positive rate!
#
# Port scan detection works by counting how many DIFFERENT ports an IP
# accesses within a time window. The challenge is distinguishing between:
#
# LEGITIMATE:
# - Web browser loading a page with resources on ports 80, 443, 8080
# - Mobile app checking APIs on ports 443, 8443, 9443
# - Monitoring tool checking services on ports 22, 80, 443, 3306, 5432
#
# MALICIOUS:
# - Nmap scanning ports 1-65535
# - Masscan probing common vulnerable ports
# - Manual scanning for open services
#
# The difference is SUBTLE and depends on your environment!
#
# Testing approach:
# 1. Start with HIGH thresholds (low sensitivity)
# 2. Monitor for 1-2 weeks
# 3. Check logs: grep "Port scan detected" /var/log/nftban/portscan-detection.log
# 4. Investigate each detection - legitimate or malicious?
# 5. If mostly malicious, lower threshold slightly
# 6. If mostly legitimate, raise threshold or whitelist IPs
# =============================================================================

# Detection interval in seconds
# How often to check for port scan activity
# Lower = faster detection but higher CPU usage
# Higher = slower detection but lower overhead
# Conservative: "600" (10 minutes) - low overhead
# Normal: "300" (5 minutes) - balanced
# Aggressive: "60" (1 minute) - fast detection, higher CPU
# "0" = Disabled (manual checking only)
PORTSCAN_CHECK_INTERVAL="300"

# Time window for counting port access attempts (seconds)
# Port scans are detected when an IP accesses multiple different ports
# within this time window
# Conservative: "900" (15 minutes) - fewer false positives
# Normal: "300" (5 minutes) - balanced
# Aggressive: "60" (1 minute) - more detections, more false positives
PORTSCAN_TIME_WINDOW="300"

# Threshold: Number of different ports to trigger detection
# An IP must access this many DIFFERENT ports within the time window
# to be flagged as a port scanner
# Conservative: "30" - only catches aggressive scans
# Normal: "20" - balanced detection
# Aggressive: "10" - catches more scans, many false positives
# Strict: "5" - HIGH false positive rate (not recommended)
PORTSCAN_THRESHOLD="20"

# Minimum diversity: Require ports to be spread across ranges
# Helps avoid false positives from services using sequential ports
# Examples of legitimate sequential port usage:
# - FTP passive mode: Uses sequential high ports
# - SIP/VoIP: Multiple sequential RTP ports
# - Clustered services: Sequential ports (8001, 8002, 8003)
# "1" = Require at least 2 different port ranges (recommended)
# "0" = Count all ports regardless of range (more false positives)
PORTSCAN_DIVERSITY="1"

# =============================================================================
# BAN SETTINGS
# =============================================================================
# ⚠️  CRITICAL: Auto-ban can lock out legitimate users!
#
# BEFORE ENABLING AUTO-BAN:
# 1. Run in detection-only mode for 1-2 weeks
# 2. Review all detections in logs
# 3. Confirm >95% are actual malicious scans
# 4. Whitelist all false positives
# 5. Test with DRY_RUN="1" for another week
# 6. Only then enable AUTO_BAN
#
# FALSE POSITIVE EXAMPLE:
# - User behind corporate NAT browses your site
# - NAT IP accesses ports: 80, 443, 8080, 8443, 3000, 9000
# - Threshold triggered → User banned → Support ticket → Bad experience
#
# Recommended: Keep AUTO_BAN="0" until thoroughly tested
# =============================================================================

# Auto-ban detected scanners
# "0" = DISABLED - Only log detections (SAFE DEFAULT - strongly recommended)
# "1" = ENABLED - Automatically ban detected scanners (use with extreme caution)
PORTSCAN_AUTO_BAN="0"

# Ban type when port scan detected (only applies if AUTO_BAN="1")
# "temporary" = Temporary ban with timeout (safer)
# "permanent" = Permanent ban until manually removed (more aggressive)
PORTSCAN_BAN_TYPE="temporary"

# Ban duration in seconds (only applies if BAN_TYPE="temporary")
# Conservative: "1800" (30 minutes) - short timeout for false positives
# Normal: "3600" (1 hour) - balanced
# Aggressive: "86400" (24 hours) - long ban
PORTSCAN_BAN_TIME="3600"

# =============================================================================
# PORT MONITORING
# =============================================================================
# ⚠️  WARNING: What you monitor determines false positive rate!
#
# Monitoring strategies:
#
# 1. "closed" - Monitor ONLY ports you DON'T use (RECOMMENDED)
#    Pros: Lower false positives (legitimate users use open ports)
#    Cons: Misses scans of your actual services
#    Best for: Most servers
#
# 2. "all" - Monitor ALL ports including open ones
#    Pros: Complete visibility of all scan activity
#    Cons: HIGH false positive rate (browsers, apps probe open ports)
#    Best for: Honeypots, research environments
#
# 3. "custom" - Monitor specific port list
#    Pros: Fine-grained control
#    Cons: Requires deep knowledge of your traffic patterns
#    Best for: Advanced users with specific requirements
#
# Recommended: Start with "closed" for lower false positives
# =============================================================================

# Which ports to monitor for scan detection
# "closed" = Only monitor ports NOT in your allow list (SAFE DEFAULT)
# "all" = Monitor all ports 0-65535 (high false positive rate)
# "custom" = Use PORTSCAN_CUSTOM_PORTS list below
PORTSCAN_MONITOR_PORTS="closed"

# Custom port list (only used if PORTSCAN_MONITOR_PORTS="custom")
# Format: "port1,port2,port3-port4,..."
# Example: "1-1024,3306,5432,8080-8090"
# Empty = Not used (SAFE DEFAULT)
PORTSCAN_CUSTOM_PORTS=""

# Monitor ICMP packets as part of scan detection
# Many scanners send ICMP (ping) before scanning ports
# However, legitimate monitoring also uses ping
# "1" = Include ICMP in detection (may increase false positives)
# "0" = Ignore ICMP (SAFE DEFAULT)
PORTSCAN_MONITOR_ICMP="0"

# Monitor invalid packets (malformed, bad checksums, etc.)
# Some advanced scan tools send invalid packets to fingerprint firewall
# However, network issues can also cause invalid packets
# "1" = Include invalid packets in detection
# "0" = Ignore invalid packets (SAFE DEFAULT)
PORTSCAN_MONITOR_INVALID="0"

# =============================================================================
# WHITELIST & EXCEPTIONS
# =============================================================================
# ⚠️  CRITICAL: Whitelist BEFORE enabling detection!
#
# MUST WHITELIST (before enabling detection):
# 1. Your own IP addresses (admin workstations)
# 2. Monitoring tools (Nagios, Zabbix, Prometheus, etc.)
# 3. Load balancers (HAProxy, Nginx, AWS ELB, etc.)
# 4. CDN IPs (Cloudflare, Akamai, Fastly, etc.)
# 5. Backup systems (may probe multiple services)
# 6. Security scanners (if you use vulnerability scanning)
# 7. API clients (if they probe multiple endpoints)
# 8. Partner/vendor IPs (if they integrate with multiple services)
#
# How to whitelist:
# 1. Edit file: /etc/nftban/config/portscan_whitelist.conf
# 2. Add one IP/CIDR per line: 203.0.113.100
# 3. Add comment: 203.0.113.100  # Nagios monitoring server
# 4. Reload: nftban portscan reload
#
# Testing:
# After whitelisting, verify: nftban portscan check <IP>
# Should show: "IP is whitelisted for port scan detection"
# =============================================================================

# Whitelist file for IPs that should never be flagged for port scanning
# This is separate from the main nftban whitelist
# Format: One IP or CIDR per line, optional comment after #
# File will be created automatically if it doesn't exist
PORTSCAN_WHITELIST_FILE="${NFTBAN_CONFIG_DIR}/portscan_whitelist.conf"

# Automatically whitelist known legitimate security scanners
# Examples: Shodan.io (research), Censys.io (research), BinaryEdge
# "1" = Auto-whitelist known scanners (not recommended - research scanners)
# "0" = Detect all scanners (SAFE DEFAULT)
PORTSCAN_WHITELIST_KNOWN_SCANNERS="0"

# Known scanner IP ranges to whitelist (if WHITELIST_KNOWN_SCANNERS="1")
# Common examples:
#   Shodan.io: 104.131.0.69, 198.20.69.74, 66.240.236.119
#   Censys.io: 192.35.168.0/23, 162.142.125.0/24, 167.248.133.0/24
# Add your own monitoring tools here
# Empty = None (SAFE DEFAULT)
PORTSCAN_KNOWN_SCANNERS=""

# =============================================================================
# LOGGING & ALERTING
# =============================================================================
# ⚠️  WARNING: Email alerts can be VERY noisy!
#
# Port scan detection can generate hundreds of alerts per day:
# - Internet is constantly scanned by bots
# - Research institutions scan continuously
# - Malware-infected hosts scan randomly
# - Your inbox will be flooded if email alerts enabled
#
# Recommended approach:
# 1. Enable logging (PORTSCAN_LOGGING="1")
# 2. Disable email alerts initially (PORTSCAN_EMAIL_ALERTS="0")
# 3. Review logs daily: tail -f /var/log/nftban/portscan-detection.log
# 4. After tuning, enable rate-limited alerts (ALERT_LIMIT="3")
# 5. Use daily reports instead of real-time alerts
# =============================================================================

# Log file location
PORTSCAN_LOG_FILE="${NFTBAN_LOG_DIR}/portscan-detection.log"

# Database file for tracking port access patterns
PORTSCAN_DB_FILE="${NFTBAN_DATA_DIR}/portscan-tracker.db"

# Maximum log file size (in MB) before rotation
# "0" = No automatic rotation
# Recommended: "10" MB for normal activity
PORTSCAN_MAX_LOG_SIZE="10"

# How long to keep detection records in database (seconds)
# Old records are automatically purged to save space
# Conservative: "604800" (1 week) - long history
# Normal: "86400" (1 day) - balanced
# Aggressive: "3600" (1 hour) - minimal storage
PORTSCAN_DB_RETENTION="86400"

# Alert rate limiting (prevents email spam)
# Maximum alerts per IP per time period
# Example: LIMIT="3" + PERIOD="3600" = max 3 alerts per IP per hour
# Recommended: Keep rate limiting ENABLED
PORTSCAN_ALERT_LIMIT="3"
PORTSCAN_ALERT_PERIOD="3600"

# Include detailed port list in alert emails
# "1" = Include all accessed ports (verbose, useful for analysis)
# "0" = Summary only (cleaner emails)
PORTSCAN_ALERT_INCLUDE_PORTS="1"

# =============================================================================
# ADVANCED DETECTION OPTIONS
# =============================================================================
# ⚠️  WARNING: Advanced detection increases false positive rate!
#
# Basic detection: Count distinct ports accessed
# Advanced detection: Analyze HOW ports are scanned
#
# Advanced techniques detect:
# - SYN scans (half-open connections)
# - UDP scans (connectionless probes)
# - Stealth scans (FIN, NULL, XMAS flag combinations)
#
# Problem: Some legitimate tools also use these techniques!
# - Network diagnostic tools (nmap for admins)
# - Load balancers (SYN health checks)
# - Firewalls (connection testing)
#
# Recommended: Keep advanced detection DISABLED unless you understand
# your environment deeply and have already tuned basic detection
# =============================================================================

# SYN scan detection
# Detects TCP SYN packets without completed handshake
# Common in nmap default scans
# "1" = Detect SYN scans (may flag load balancer health checks)
# "0" = Ignore SYN patterns (SAFE DEFAULT)
PORTSCAN_DETECT_SYN_SCAN="0"

# UDP scan detection
# UDP scans are harder to detect but common in reconnaissance
# However, legitimate services also use UDP extensively
# "1" = Monitor UDP packets (may flag DNS, NTP, VPN, gaming)
# "0" = TCP only (SAFE DEFAULT)
PORTSCAN_DETECT_UDP_SCAN="0"

# Stealth scan detection (FIN, NULL, XMAS scans)
# These use unusual TCP flag combinations to evade firewalls
# Requires deep packet inspection and more CPU
# Very rare in legitimate traffic
# "1" = Detect stealth scans (low false positive but higher CPU)
# "0" = Ignore stealth patterns (SAFE DEFAULT)
PORTSCAN_DETECT_STEALTH="0"

# Aggressive detection mode
# ⚠️  DANGER: Significantly increases false positive rate!
# When enabled:
# - Reduces PORTSCAN_THRESHOLD by 50% (e.g., 20 → 10)
# - Reduces PORTSCAN_TIME_WINDOW by 50% (e.g., 300 → 150)
# - Enables ALL detection types (SYN, UDP, Stealth)
# - Increases sensitivity across the board
# "1" = Aggressive mode (NOT recommended except for honeypots)
# "0" = Normal operation (SAFE DEFAULT)
PORTSCAN_AGGRESSIVE_MODE="0"

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Maximum IPs to track simultaneously
# Limits memory usage for port scan tracking
# Each tracked IP uses ~1-2KB of memory
# Conservative: "1000" IPs = ~2MB memory
# Normal: "5000" IPs = ~10MB memory
# High: "10000" IPs = ~20MB memory
PORTSCAN_MAX_TRACKED_IPS="5000"

# Cleanup interval for expired tracking data (seconds)
# How often to purge old entries from memory
# Lower = more CPU usage, fresher data
# Higher = less CPU usage, stale data lingers
# Recommended: "600" (10 minutes)
PORTSCAN_CLEANUP_INTERVAL="600"

# Use nftables logging for detection
# Method 1 (nftables): Fast, efficient, requires nftables log rules
# Method 2 (syslog): Slower, works without nftables, parses system logs
# "1" = Use nftables logging (recommended if available)
# "0" = Parse system logs (fallback)
PORTSCAN_USE_NFTABLES_LOG="1"

# nftables log prefix for port scan detection
# Must match the log prefix in your nftables rules
# Default: "nftban: portscan: "
# Change only if you customize nftables logging
PORTSCAN_NFT_LOG_PREFIX="nftban: portscan: "

# =============================================================================
# INTEGRATION
# =============================================================================

# Automatically add repeat offenders to permanent blacklist
# If an IP is detected scanning N times, add to permanent blacklist
# "0" = Disabled (SAFE DEFAULT)
# "3" = Blacklist after 3 detections
# "5" = Blacklist after 5 detections
PORTSCAN_AUTO_BLACKLIST_THRESHOLD="0"

# Notify other nftban instances in cluster (if clustering enabled)
# Share port scan detection data across multiple servers
# "1" = Share data with cluster
# "0" = Local only (SAFE DEFAULT)
PORTSCAN_CLUSTER_NOTIFY="0"

# Integration with Fail2Ban
# Create Fail2Ban jail entries for detected port scanners
# "1" = Enable Fail2Ban integration
# "0" = Standalone operation (SAFE DEFAULT)
PORTSCAN_FAIL2BAN_INTEGRATION="0"

# =============================================================================
# REPORTING
# =============================================================================

# Generate daily port scan reports
# Summary of detected scans sent via email
# Less noisy than real-time alerts
# "1" = Send daily reports
# "0" = No reports (SAFE DEFAULT)
PORTSCAN_DAILY_REPORT="0"

# Report email recipient (uses NFTBAN_EMAIL_RECIPIENT if empty)
# Leave empty to use default email from main config
PORTSCAN_REPORT_EMAIL=""

# Include top scanner IPs in reports
# How many top scanning IPs to include
# Recommended: "20"
PORTSCAN_REPORT_TOP_COUNT="20"

# Include geographical data in reports (requires GeoIP module)
# Shows country/city of scanning IPs
# "1" = Include geo data (if GeoIP available)
# "0" = No geo data
PORTSCAN_REPORT_INCLUDE_GEO="1"

# =============================================================================
# TESTING & DEBUGGING
# =============================================================================
# ⚠️  IMPORTANT: Use these settings during initial deployment!
#
# Deployment workflow:
# Week 1-2: DRY_RUN="1", ENABLED="1", AUTO_BAN="0"
#           → Collect data without banning
#           → Identify false positives
#           → Build whitelist
# Week 3:   DRY_RUN="0", ENABLED="1", AUTO_BAN="0"
#           → Real logging, no banning
#           → Verify detections are accurate
# Week 4+:  DRY_RUN="0", ENABLED="1", AUTO_BAN="1" (only if <5% false positives)
#           → Production mode
# =============================================================================

# Dry-run mode: Detect but don't ban
# Perfect for testing and tuning thresholds
# "1" = Testing mode - log detections, NO banning (RECOMMENDED for initial setup)
# "0" = Production mode - ban if AUTO_BAN enabled
PORTSCAN_DRY_RUN="1"

# Verbose logging for debugging
# Creates detailed logs for troubleshooting
# "1" = Debug logs (large log files)
# "0" = Normal logging (SAFE DEFAULT)
PORTSCAN_DEBUG="0"

# Log all port access attempts (extremely verbose!)
# ⚠️  WARNING: Can create GIGABYTES of logs on busy servers!
# Only enable for short-term troubleshooting
# "1" = Log every single port access (NOT recommended)
# "0" = Log detections only (SAFE DEFAULT)
PORTSCAN_LOG_ALL_ATTEMPTS="0"

# =============================================================================
# QUICK START SCENARIOS
# =============================================================================
#
# SCENARIO 1: Initial setup and testing (RECOMMENDED)
# ----------------------------------------------------
# 1. Whitelist your IPs: edit /etc/nftban/config/portscan_whitelist.conf
# 2. Set: PORTSCAN_ENABLED="1"
# 3. Set: PORTSCAN_AUTO_BAN="0"
# 4. Set: PORTSCAN_DRY_RUN="1"
# 5. Set: PORTSCAN_THRESHOLD="20" (conservative)
# 6. Reload: nftban portscan reload
# 7. Monitor: tail -f /var/log/nftban/portscan-detection.log
# 8. Run for 1-2 weeks, build whitelist
# 9. When <5% false positives, enable AUTO_BAN
#
# SCENARIO 2: High-security environment (after testing)
# -----------------------------------------------------
# 1. Complete SCENARIO 1 first
# 2. Set: PORTSCAN_THRESHOLD="10" (more sensitive)
# 3. Set: PORTSCAN_TIME_WINDOW="180" (shorter window)
# 4. Set: PORTSCAN_AUTO_BAN="1"
# 5. Set: PORTSCAN_AUTO_BLACKLIST_THRESHOLD="3"
# 6. Monitor closely for false positives
#
# SCENARIO 3: Disable all port scan detection (emergency)
# -------------------------------------------------------
# 1. Set: PORTSCAN_ENABLED="0"
# 2. Reload: nftban portscan reload
# 3. All detection stops immediately
#
# SCENARIO 4: Logging only (no banning)
# -------------------------------------
# 1. Set: PORTSCAN_ENABLED="1"
# 2. Set: PORTSCAN_AUTO_BAN="0"
# 3. Set: PORTSCAN_DRY_RUN="0"
# 4. Monitor: grep "Port scan" /var/log/nftban/portscan-detection.log
# 5. Use for visibility without enforcement
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# PROBLEM: Too many false positives
# SOLUTION:
# 1. Increase PORTSCAN_THRESHOLD (e.g., 20 → 30)
# 2. Increase PORTSCAN_TIME_WINDOW (e.g., 300 → 600)
# 3. Whitelist offending IPs
# 4. Change PORTSCAN_MONITOR_PORTS from "all" to "closed"
# 5. Disable PORTSCAN_MONITOR_ICMP and PORTSCAN_MONITOR_INVALID
#
# PROBLEM: Not detecting real scans
# SOLUTION:
# 1. Decrease PORTSCAN_THRESHOLD (e.g., 20 → 10)
# 2. Decrease PORTSCAN_TIME_WINDOW (e.g., 300 → 180)
# 3. Enable PORTSCAN_DETECT_SYN_SCAN
# 4. Check if real scans are from whitelisted IPs
#
# PROBLEM: Legitimate user got banned
# SOLUTION:
# 1. Immediately: nftban whitelist add <IP> "legitimate user"
# 2. Unban: nftban unban <IP>
# 3. Add to portscan whitelist: echo "<IP>  # User name" >> /etc/nftban/config/portscan_whitelist.conf
# 4. Review detection logs to understand why triggered
# 5. Adjust thresholds if needed
#
# PROBLEM: High CPU usage
# SOLUTION:
# 1. Increase PORTSCAN_CHECK_INTERVAL (e.g., 300 → 600)
# 2. Increase PORTSCAN_CLEANUP_INTERVAL (e.g., 600 → 900)
# 3. Reduce PORTSCAN_MAX_TRACKED_IPS (e.g., 5000 → 2000)
# 4. Disable PORTSCAN_LOG_ALL_ATTEMPTS if enabled
# 5. Disable PORTSCAN_DETECT_STEALTH (high CPU)
#
# PROBLEM: Large log files
# SOLUTION:
# 1. Reduce PORTSCAN_MAX_LOG_SIZE (e.g., 10 → 5)
# 2. Reduce PORTSCAN_DB_RETENTION (e.g., 86400 → 3600)
# 3. Disable PORTSCAN_DEBUG if enabled
# 4. Ensure PORTSCAN_LOG_ALL_ATTEMPTS="0"
#
# For support: contact@itcms.gr
#
# =============================================================================
# END OF CONFIGURATION
# =============================================================================
