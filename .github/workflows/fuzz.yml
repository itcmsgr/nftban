# =============================================================================
# NFTBan - Fuzz Testing Workflow
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Run fuzz tests to catch parsing regressions and edge cases
#
# Runs on:
#   - Push to main branch
#   - Weekly schedule (Sunday at 3:00 AM UTC)
#   - Manual workflow dispatch
#
# Tests security-critical parsing functions:
#   - FuzzParseLogLine: Login detection across SSH, Mail, FTP, Panel logs
#   - FuzzParseFeedLine: IP/CIDR feed line parsing
#   - FuzzValidateAndNormalizeIP: IP validation and normalization
# =============================================================================

name: Fuzz Tests

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 3:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # ===========================================================================
  # FUZZ TESTING
  # ===========================================================================
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v5.6.0
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-fuzz-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-fuzz-
            ${{ runner.os }}-go-

      - name: Cache fuzz corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.3.0
        with:
          path: |
            ~/.cache/go-build/fuzz
          key: ${{ runner.os }}-fuzz-corpus-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-

      - name: Run FuzzParseLogLine
        run: |
          echo "=== Fuzzing FuzzParseLogLine (30s) ==="
          echo "Tests login detection across SSH, Mail, FTP, and Panel log formats"
          go test -fuzz=FuzzParseLogLine -fuzztime=30s ./pkg/parser/

      - name: Run FuzzParseFeedLine
        run: |
          echo "=== Fuzzing FuzzParseFeedLine (30s) ==="
          echo "Tests IP/CIDR feed line parsing with comments and whitespace"
          go test -fuzz=FuzzParseFeedLine -fuzztime=30s ./pkg/parser/

      - name: Run FuzzValidateAndNormalizeIP
        run: |
          echo "=== Fuzzing FuzzValidateAndNormalizeIP (30s) ==="
          echo "Tests IP validation and normalization functions"
          go test -fuzz=FuzzValidateAndNormalizeIP -fuzztime=30s ./pkg/parser/

      - name: Summary
        if: always()
        run: |
          echo "## Fuzz Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz Target | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| FuzzParseLogLine | 30s |" >> $GITHUB_STEP_SUMMARY
          echo "| FuzzParseFeedLine | 30s |" >> $GITHUB_STEP_SUMMARY
          echo "| FuzzValidateAndNormalizeIP | 30s |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total fuzz time: ~90 seconds" >> $GITHUB_STEP_SUMMARY
