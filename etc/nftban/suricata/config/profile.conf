# =============================================================================
#
# Available profiles:
#   minimal  - <10k rules, ~150MB RAM (Debian) / ~600MB RAM (RHEL)
#   standard - <25k rules, ~400MB RAM (Debian) / ~1.5GB RAM (RHEL)
#   maximum  - <60k rules, ~800MB RAM (Debian) / ~2.5GB RAM (RHEL)
#
# Profile mode:
#   auto   - Re-detect optimal profile on each update (based on CPU/RAM)
#   pinned - Keep the specified profile, don't auto-detect
# =============================================================================

# Profile mode: "auto" or "pinned"
NFTBAN_SURICATA_PROFILE_MODE="auto"

# Active profile (will be auto-detected if mode=auto and this is empty)
NFTBAN_SURICATA_PROFILE=""
