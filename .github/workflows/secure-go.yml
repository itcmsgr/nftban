# =============================================================================
# NFTBan - Secure Go
# =============================================================================
# SPDX-License-Identifier: MPL-2.0

name: Secure Go

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  # ---- v1.229.4 VAF-C1b · PATH A — FRESHNESS AUTHORITY ----
  # ⛔ NO SOURCE CHANGE != NO NEW VULNERABILITY INFORMATION.
  # A code-change trigger cannot be the freshness authority for externally evolving
  # security knowledge: the advisory database moves on days nobody touches Go.
  # MEASURED before this change: 16 of the last 20 runs reported a PASSING required
  # security context with no vulnerability observation at all.
  # Cadence matches osv-scanner.yml so both Tier-A vulnerability instruments share one
  # observation rhythm.
  # ⛔ WEEKLY SCHEDULE != RELEASE-TIME FRESHNESS PROOF. This bounds the background blind
  # window to seven days; a release must obtain FRESH evidence for its exact candidate
  # SHA via workflow_dispatch. "The cron happened sometime this week" is not release
  # evidence.
  schedule:
    # v1.229.4 VAF-C1b freshness authority. Cadence matches osv-scanner.yml so both Tier-A
    # vulnerability instruments share one observation rhythm.
    # ⛔ NO SOURCE CHANGE != NO NEW VULNERABILITY INFORMATION — the advisory database moves
    # on days nobody touches Go, which is why a code-change trigger cannot be the freshness
    # authority. MEASURED before C1b: 16 of 20 runs reported a PASSING required security
    # context with zero vulnerability observation.
    # ⛔ WEEKLY SCHEDULE != RELEASE-TIME FRESHNESS PROOF. This bounds the background blind
    # window to seven days; a release must dispatch a fresh run against its exact candidate
    # SHA. "The cron happened sometime this week" is not release evidence.
    # REAL_SCHEDULE_PROOF was obtained under a temporary hourly cadence and the canonical
    # weekly cadence is restored here: run 32292159901, event=schedule, head 4dccb4f8,
    # analyze RAN, govulncheck RAN, gate reason "freshness event (schedule)".
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 AM UTC
  workflow_dispatch:

concurrency:
  group: secure-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # needed to upload SARIF
  actions: read

jobs:
  filter:
    name: Detect Go changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'pkg/**'
              - 'internal/**'

  analyze:
    name: Go Security Analysis
    needs: filter
    # ---- v1.229.4 VAF-C1b · EVENT AUTHORITY IS NOT FILTER AUTHORITY ----
    # A freshness event REQUIRES the scan because of WHAT EVENT IT IS, never because
    # paths-filter happened to report a change. On a `schedule` event the filter has no
    # meaningful diff base, so its output must not be consulted there at all.
    # `always()` is deliberate: if the filter job itself fails, a freshness run must still
    # scan. On the PR/push path a failed filter leaves go_changed empty, this condition is
    # false, analyze is skipped — and the gate below classifies that as UNKNOWN, not "OK".
    if: >-
      always() && (
        needs.filter.outputs.go_changed == 'true' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.13`).
          # GOTOOLCHAIN=local intentionally NOT set: this job `go install`s
          # third-party tools (staticcheck, gosec) whose own go directive may
          # require a newer toolchain; local would block that auto-fetch.
          go-version: '1.25.13'

      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "::error ::Run 'go mod tidy' locally and commit changes" && exit 1)

      - name: Build
        run: go build ./...

      - name: Unit tests (race + coverage)
        run: go test -race -cover -v ./...

      # ---- Staticcheck: Go code quality ----
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      # ---- Gosec: security lint with SARIF upload ----
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec (SARIF)
        id: gosec
        run: |
          # ---- v1.229.4 VAF-0 Stage 3B · G1-W1 — FAILURE MUST BE CONSUMED ----
          # This was `gosec ... || true`: a claim-bearing producer's status discarded with no
          # downstream consumer, so a gosec that CRASHED was indistinguishable from a gosec
          # that found nothing. ⛔ TOOL EXECUTION FAILURE != NO FINDINGS.
          # gosec exits non-zero when it REPORTS ISSUES, which is why the status was
          # suppressed — but suppression is only legitimate when the status is captured and
          # classified. It is now both.
          set +e
          "$(go env GOPATH)/bin/gosec" -nosec -fmt sarif -out gosec.sarif ./...
          GOSEC_RC=$?
          set -e
          echo "gosec_rc=${GOSEC_RC}" >> "$GITHUB_OUTPUT"
          echo "gosec rc=${GOSEC_RC}"
          # ⛔ ARTIFACT VALIDITY IS THE DISCRIMINATOR, NOT THE EXIT CODE. A non-zero rc WITH a
          # parseable SARIF means findings (Tier-B corroborating, reported not blocking); a
          # missing or unparseable SARIF means the tool did not complete an observation.
          if [[ ! -s gosec.sarif ]]; then
            echo "::error title=gosec execution failure::gosec exited ${GOSEC_RC} and produced no SARIF. This is a TOOL FAILURE, not a clean scan — no gosec conclusion can be drawn for this run."
            exit 1
          fi
          if ! python3 -c "import json,sys; json.load(open('gosec.sarif'))" 2>/dev/null; then
            echo "::error title=gosec artifact unparseable::gosec.sarif exists but is not valid JSON (rc=${GOSEC_RC}). ⛔ An unparseable artifact is NOT an empty one."
            exit 1
          fi
          echo "gosec produced a parseable SARIF (rc=${GOSEC_RC}; non-zero here means findings, which are Tier-B corroborating evidence)"

      - name: Fix gosec SARIF relationships
        run: |
          # gosec produces invalid SARIF with string relationships instead of objects
          # Fix: remove invalid relationships arrays or convert to valid format
          python3 << 'PY'
          import json
          try:
              with open('gosec.sarif', 'r') as f:
                  sarif = json.load(f)
              # Fix relationships in rules - must be array of objects, not strings
              for run in sarif.get('runs', []):
                  driver = run.get('tool', {}).get('driver', {})
                  for rule in driver.get('rules', []):
                      if 'relationships' in rule:
                          # Remove invalid relationships (gosec outputs strings instead of objects)
                          del rule['relationships']
              with open('gosec.sarif', 'w') as f:
                  json.dump(sarif, f, indent=2)
              print("Fixed gosec SARIF relationships")
          except Exception as e:
              print(f"Warning: Could not fix SARIF: {e}")
          PY

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: gosec.sarif
          category: gosec

      # ---- govulncheck: NATIVE SARIF (v1.229.4 PR-B) ----
      #
      # ⛔ THE CONVERTER WAS DELETED, NOT REPAIRED.
      # It read `govulncheck -json` as ONE JSON OBJECT PER LINE, but govulncheck emits
      # MULTI-LINE pretty-printed objects, so `json.loads(line)` threw on the first
      # record. Its own except-branch then WROTE AN EMPTY SARIF ("results": []), which
      # uploaded as a clean scan. Reproduced on lab2: the real tool reports 7 results
      # (5 reachable) on the same tree the dashboard showed as results=0.
      #
      # VAF v2: NATIVE ARTIFACT FIRST — where a tool emits SARIF, SARIF is the envelope.
      # A second translation authority between the scanner and the verdict is exactly
      # what manufactured the false zero.  G4: NO MANUFACTURED OBSERVATION SUCCESS.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck (native SARIF)
        id: gvc
        run: |
          # ⛔ In SARIF/JSON mode govulncheck EXITS 0 EVEN WITH FINDINGS.
          #    GOVULNCHECK_RC0 != NO_VULNERABILITIES  (verified: rc=0 with 7 results)
          #    A non-zero rc here therefore means the TOOL failed, not that findings exist.
          set +e
          "$(go env GOPATH)/bin/govulncheck" -format sarif ./... > govulncheck.sarif 2> govulncheck.err
          GVC_RC=$?
          set -e
          echo "gvc_rc=${GVC_RC}" >> "$GITHUB_OUTPUT"
          echo "govulncheck rc=${GVC_RC} (0 is expected in sarif mode, findings or not)"
          if [[ "$GVC_RC" -ne 0 ]]; then
            echo "::error::GOVULNCHECK_EXECUTION_FAILURE — the tool exited ${GVC_RC} in SARIF mode, which indicates a TOOL failure, not a finding count. No vulnerability conclusion can be drawn."
            sed 's/^/    /' govulncheck.err | head -20
            exit 1
          fi
          # ⛔ NEVER synthesise a SARIF here. An absent artifact is an OBSERVATION
          #    FAILURE, not an empty result set.
          if [[ ! -s govulncheck.sarif ]]; then
            echo "::error::OBSERVATION_FAILURE — govulncheck exited 0 but produced no SARIF. The output contract was violated; this is NOT a clean result."
            exit 1
          fi

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      # v1.229.4 PR-B. Verdict LAST, from the scanner-native SARIF, so finding evidence
      # is uploaded before any failure is raised.
      #
      #   The native artifact carries REACHABILITY, which the deleted converter destroyed
      #   by flattening every finding to "warning":
      #       level=error  -> call-reachable from this source tree
      #       level=note   -> vulnerable code present, not proven reachable
      #   ⛔ REACHABILITY != EXPLOITABILITY. Neither level is an exploitability claim.
      - name: govulncheck verdict (scanner-native results)
        if: always()
        run: |
          if [[ ! -s govulncheck.sarif ]]; then
            echo "::error::OBSERVATION_FAILURE — no govulncheck SARIF to classify. NOT a clean result."
            exit 1
          fi
          COUNTS=$(python3 -c "
          import json,sys
          try:
              d=json.load(open('govulncheck.sarif'))
          except Exception:
              print('PARSE_FAILURE'); sys.exit(0)
          res=[r for run in d.get('runs',[]) for r in run.get('results',[])]
          e=sum(1 for r in res if r.get('level')=='error')
          n=sum(1 for r in res if r.get('level')=='note')
          print(f'{len(res)} {e} {n}')")
          if [[ "$COUNTS" == "PARSE_FAILURE" ]]; then
            echo "::error::OBSERVATION_FAILURE — govulncheck.sarif is not parseable. ⛔ An unparseable artifact is NOT an empty one."
            exit 1
          fi
          set -- $COUNTS
          TOTAL=$1; REACHABLE=$2; PRESENT=$3
          echo "govulncheck native SARIF: total=${TOTAL} reachable(error)=${REACHABLE} present-only(note)=${PRESENT}"
          if [[ "$REACHABLE" -gt 0 ]]; then
            echo "::error title=govulncheck reachable vulnerabilities::${REACHABLE} vulnerability/vulnerabilities are CALL-REACHABLE from this source tree (${TOTAL} total, ${PRESENT} present-but-not-reachable). See the Security tab, category govulncheck. ⛔ Reachability is not exploitability."
            exit 1
          fi
          if [[ "$TOTAL" -gt 0 ]]; then
            echo "::error title=govulncheck vulnerable code present::${TOTAL} finding(s) present but NOT proven call-reachable. This needs disposition, not dismissal."
            exit 1
          fi
          echo "CLEAN — govulncheck completed, SARIF validated, zero results."

      # ---- Trivy: filesystem vulnerability scanning ----
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.34.1
        continue-on-error: true  # Don't fail workflow if Trivy has issues
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Report findings but don't fail workflow

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

      # ---- Generate security summary ----
      - name: Generate security summary
        if: always()
        run: |
          echo "## Go Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tools Run" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **staticcheck**: Go code quality and bug detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **gosec**: Security vulnerability scanner" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **govulncheck**: Go vulnerability database scanner" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **trivy**: Filesystem vulnerability scanner (HIGH/CRITICAL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security → Code scanning alerts tab for detailed findings." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "All Go code has been analyzed for:" >> $GITHUB_STEP_SUMMARY
          echo "- Known CVEs in dependencies (govulncheck)" >> $GITHUB_STEP_SUMMARY
          echo "- Insecure coding patterns (gosec)" >> $GITHUB_STEP_SUMMARY
          echo "- Code quality issues (staticcheck)" >> $GITHUB_STEP_SUMMARY
          echo "- Race conditions (go test -race)" >> $GITHUB_STEP_SUMMARY
          echo "- Filesystem vulnerabilities (trivy)" >> $GITHUB_STEP_SUMMARY

  # Required-check pass-through for non-Go PRs
  # When paths-filter skips the analyze job, this ensures the required check still passes
  secure-go-gate:
    name: Build, Test, Scan (Go)
    if: always()
    needs: [filter, analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          # ===================================================================
          # v1.229.4 VAF-C1b — THE REQUIRED GATE MUST BE TRUTHFUL
          # ===================================================================
          # Three distinct false-green mechanisms were REPRODUCED against the previous
          # form of this block, on unmodified main, before this fix was designed:
          #
          #   PATH A  no Go change -> "security scan skipped (OK)"
          #           A code-change trigger was acting as the freshness authority.
          #           MEASURED: 16 of 20 runs passed with zero observation.
          #
          #   PATH B  filter job FAILS -> outputs empty -> "" != "true"
          #           -> "No Go changes detected — security scan skipped (OK)", rc=0.
          #           BYTE-IDENTICAL to a legitimate no-change PR.
          #           ⛔ FAILED PRODUCER + EMPTY OUTPUT != "NO GO CHANGE"
          #
          #   PATH C  go_changed=true but analyze skipped -> "Go security analysis passed"
          #           The gate asserted a COMPLETED ANALYSIS THAT NEVER RAN.
          #           B is a false skip; C is a false pass.
          #
          # ⛔ "SKIPPED" is an EXECUTION FACT. "SKIPPED (OK)" is a POLICY VERDICT that
          #    requires authority proving the observation was not required.
          # ⛔ DEFAULT DENY: any state not explicitly recognised fails.
          FILTER_RESULT="${{ needs.filter.result }}"
          GO_CHANGED="${{ needs.filter.outputs.go_changed }}"
          ANALYZE_RESULT="${{ needs.analyze.result }}"
          EVENT="${{ github.event_name }}"
          echo "filter.result=${FILTER_RESULT} go_changed='${GO_CHANGED}' analyze.result=${ANALYZE_RESULT} event=${EVENT}"

          # ---- EVENT AUTHORITY (evaluated FIRST, independent of the filter) ----
          # A freshness event requires the scan because of the EVENT, never because the
          # filter said so. Checking this before the filter authority also keeps scheduled
          # runs from depending on paths-filter health, which has no diff base on schedule.
          SCAN_REQUIRED=false
          REQUIRED_BECAUSE=""
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" ]]; then
            SCAN_REQUIRED=true
            REQUIRED_BECAUSE="freshness event (${EVENT})"
          else
            # ---- FILTER AUTHORITY (PR/push path only) ----
            if [[ "$FILTER_RESULT" != "success" ]]; then
              echo "::error title=Go security coverage UNKNOWN::The change-detection job did not succeed (filter.result=${FILTER_RESULT}), so whether a Go security scan was required is UNKNOWN. ⛔ A FAILED PRODUCER'S EMPTY OUTPUT IS NOT A NEGATIVE DECISION — this is not 'no Go changes'."
              exit 1
            fi
            if [[ "$GO_CHANGED" != "true" && "$GO_CHANGED" != "false" ]]; then
              echo "::error title=Go security coverage UNKNOWN::The change-detection job succeeded but produced no usable go_changed value (got '${GO_CHANGED}'). The requirement cannot be determined, so it is not satisfied."
              exit 1
            fi
            if [[ "$GO_CHANGED" == "true" ]]; then
              SCAN_REQUIRED=true
              REQUIRED_BECAUSE="Go subject changed in this delta"
            fi
          fi

          # ---- NO-SUBJECT-CHANGE PATH ----
          # The PR gate passes, but it must make NO current-security claim. Coverage for an
          # unchanged subject is owed to the weekly schedule, not to this run.
          if [[ "$SCAN_REQUIRED" != "true" ]]; then
            echo "Go security analysis NOT REQUIRED for this source delta (no Go subject change)."
            echo "⛔ This is an EXECUTION FACT, not a security verdict. It asserts nothing about"
            echo "   current vulnerability state: advisories change without this repository changing."
            echo "   Current coverage is supplied by the weekly scheduled run, not by this gate."
            exit 0
          fi

          # ---- SCAN REQUIRED: the analysis must actually have COMPLETED ----
          echo "Go security analysis REQUIRED — ${REQUIRED_BECAUSE}."
          case "$ANALYZE_RESULT" in
            success)
              echo "Go security analysis passed"
              ;;
            failure)
              echo "::error title=Go security analysis failed::govulncheck/gosec/Trivy reported a failure on a run where the scan was REQUIRED (${REQUIRED_BECAUSE})."
              exit 1
              ;;
            cancelled)
              echo "::error title=Go security analysis cancelled::The scan was REQUIRED (${REQUIRED_BECAUSE}) but was cancelled. No conclusion can be drawn."
              exit 1
              ;;
            skipped)
              echo "::error title=Go security analysis DID NOT RUN::The scan was REQUIRED (${REQUIRED_BECAUSE}) but the analysis job was SKIPPED. ⛔ AN ABSENT ANALYSIS IS NOT A PASSING ANALYSIS."
              exit 1
              ;;
            *)
              echo "::error title=Go security analysis state unrecognised::analyze.result='${ANALYZE_RESULT}' on a run where the scan was REQUIRED (${REQUIRED_BECAUSE}). ⛔ DEFAULT DENY — an unclassified state is not a pass."
              exit 1
              ;;
          esac
