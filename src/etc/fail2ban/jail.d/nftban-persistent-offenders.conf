# NFTBan Fail2ban Jail - Persistent Offenders
#
# Monitors the NFTBan fail2ban log for repeat offenders.
# IPs that get banned multiple times receive longer bans.
#
# Configuration:
# - maxretry: 3 bans within 24 hours
# - findtime: 24 hours (86400 seconds)
# - bantime: 1 week (604800 seconds)
#
# This creates a tiered ban system:
# - First ban: Normal duration (per jail config)
# - Second ban: Normal duration (per jail config)
# - Third ban: 1 week (this jail triggers)
#
# Uses custom NFTBan filter to parse ban logs
# Based on DirectAdmin production configuration

[nftban-persistent-offenders]

# Disabled by default - enable after main jails are working
enabled   = false

# Use NFTBan custom persistent offenders filter
filter    = nftban-persistent-offenders

# NFTBan fail2ban action log (created by nftban action)
logpath   = /var/log/nftban/fail2ban.log
            /var/log/itcms-fail2ban.log

# Trigger after 3 bans in 24 hours
maxretry  = 3
findtime  = 24h

# Long ban for persistent offenders (1 week)
bantime   = 7d

# Use NFTBan action
action    = nftban[name=persistent-offenders]
