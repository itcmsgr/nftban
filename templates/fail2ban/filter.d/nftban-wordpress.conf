# nftban-managed: yes
# nftban-templates-version: 1
# Simple WordPress auth/lockout patterns (access logs). Validate with fail2ban-regex on your log format!

[Definition]
failregex = ^<HOST> - .* "(POST|GET) /(wp-login\.php|wp-admin/).*" (200|401|403) .*
            ^<HOST> - .* "POST /xmlrpc\.php.*" (200|401|403) .*
ignoreregex =
