# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
# =============================================================================

# =============================================================================
# INTERFACE MODE
# =============================================================================
# auto   - NFTBan auto-detects the best interface (default)
# manual - Use interfaces specified in SURICATA_IFACES

SURICATA_IFACE_MODE="auto"

# =============================================================================
# MANUAL INTERFACES
# =============================================================================
# Comma-separated list of interfaces to use when SURICATA_IFACE_MODE="manual"
# Only used when mode=manual
#
# Examples:
#   SURICATA_IFACES="eth0"
#   SURICATA_IFACES="eth0,eth1"
#   SURICATA_IFACES="br0"

SURICATA_IFACES=""

# =============================================================================
# MULTI-INTERFACE MODE
# =============================================================================
# Allow auto-detection to configure multiple interfaces
# false = Require manual selection if >1 capture interface detected
# true  = Auto-configure all external/public interfaces
#
# Default: false (conservative - require explicit opt-in for multi-interface)

SURICATA_ALLOW_MULTI="false"

# =============================================================================
# VIRTUAL INTERFACE INCLUSION
# =============================================================================
# Include virtual interfaces (docker0, virbr0, veth*, etc.) in detection
# false = Exclude virtual interfaces (default, recommended)
# true  = Include virtual interfaces in detection
#
# Virtual patterns excluded by default:
#   lo, docker*, cni*, flannel, virbr*, veth*, br-*, zt, tailscale*,
#   wg*, tun*, tap*, podman*, cali*, lxc*

SURICATA_INCLUDE_VIRTUAL="false"

# =============================================================================
# AF-PACKET CLUSTER ID
# =============================================================================
# Base cluster ID for multi-interface af-packet configuration
# Each additional interface gets cluster_id_base + 1, +2, etc.
#
# Default: 99 (Suricata default is 99)

SURICATA_CLUSTER_ID_BASE="99"

# =============================================================================
# AUTO-POPULATED (Informational)
# =============================================================================
# These values are updated by nftban suricata iface commands

SURICATA_LAST_DETECTION=""
SURICATA_LAST_CANDIDATES=""
