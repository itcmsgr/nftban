# =============================================================================
# NFTBan - CI: Architecture Policy
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enforce architecture invariants and code policy gates
#
# Checks:
#   - Repository authority / history epoch (v1.227.1): the checkout must BE the
#     canonical repository — resolved toplevel identity (not a --git-dir success,
#     which walks upward into any ancestor repo), no borrowed alternates,
#     canonical origin, post-rewrite epoch ancestry, tag parity
#   - nft write policy (single-writer via daemon)
#   - Netlink import boundary (CLI must use IPC)
#   - Public API surface guard (only pkg/ipc + pkg/version)
#   - Suppression comment audit (//lint:ignore only, no //nolint:)
#   - Import boundary guard (CLI cannot import nftbackend)
#   - FHS spec generated files match committed versions
#   - Distro config completeness (all .conf files valid)
#   - Hardcoded path detector (paths should come from distro config)
#   - systemd directive version guard (min systemd 249)
#   - nft template placeholder guard (rendered config must be boot-safe)
#   - Anchor jump placement lint G1-G3 (v1.64.0)
#   - Anchor marker count validation (v1.64.0)
#   - Bash hazard lint H1-H2 (v1.66.3): nft -a flag + set -e traps
#   - Update safety lint U1-U2 (v1.70.0): rebuild failure must be fatal
#   - Module isolation lint R-10 (v1.110.0): distinct ModuleName + EventBan
#     source-label + Status.Extra cross-module key isolation (with baseline)
# =============================================================================

name: Architecture Policy

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # allow on-branch validation of architecture gates pre-PR

concurrency:
  group: ci-arch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-check:
    name: Policy Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # v1.227.1 PR-H1: the repository-authority gate evaluates history-epoch
          # ancestry and local/remote tag parity. Both are meaningless in the
          # default shallow, tagless checkout — a shallow clone cannot answer
          # "does HEAD descend from the post-rewrite anchor". The gate refuses to
          # guess (A4 fails closed), so full history and tags are REQUIRED here.
          fetch-depth: 0
          fetch-tags: true

      # =====================================================================
      # REPOSITORY AUTHORITY (must run first — every check below assumes the
      # checkout is the canonical repository and the correct history epoch)
      # =====================================================================

      - name: Check repository authority and history epoch
        run: ./scripts/ci/check-repo-authority.sh --mode ci

      - name: Repository authority — hermetic negative tests
        # Proves the gate REJECTS known-bad repositories (ancestor-walk trap,
        # borrowed alternates, wrong epoch, stale main, shallow, tag drift).
        # A gate never exercised against bad input is an unverified claim.
        run: ./scripts/ci/tests/check-repo-authority_test.sh

      # =====================================================================
      # EXISTING CHECKS
      # =====================================================================

      - name: Check nft write policy
        run: ./scripts/ci/check-nft-writes.sh
        env:
          # Explicit: NEVER use --warn-all in CI (would disable enforcement)
          WARN_ALL: "0"

      # Central-comms Lane A0 ratchet: mail transport primitives only inside
      # core/nftban_mail.sh; current known bypasses are allowlisted as DEBT (A1
      # burns them down). Any NEW direct send fails the PR.
      - name: Check comms no-direct-send policy
        run: ./scripts/ci/check-comms-direct-send.sh

      # v1.192 transition-atomicity class (D-NFTBAN-SOAK-...-DROP-WINDOW + F-FEED/F-GEO):
      # forbid flush/delete-then-repopulate in a separate transaction on the live
      # nftban table (V-NFT-REBUILD-ATOMICITY) or shared sets (V-NFT-SET-REFRESH-ATOMICITY).
      - name: Check nft transition atomicity
        run: ./scripts/ci/check-nft-atomicity.sh

      # v1.228.5 completion guard. Prevents reintroduction of the defect class where a
      # branch-significant failure is consumed with its evidence discarded. The measured
      # defect: `sync --quick ... || true` let firewall rebuild report rc=0 and
      # "all checks passed" while the durable whitelist.d layer — including the ACTIVE
      # ADMIN SSH IP in 00-session.conf — was never projected into the running set.
      # Also rejects rebuild callers that branch on rc with stderr sent to /dev/null,
      # which leaves the operator a failure with no cause. Executable lines only:
      # comments must keep documenting the defect and tests must keep asserting its
      # absence, so neither may trip the guard.
      - name: Check rebuild evidence authority (v1.228.5, BLOCKING)
        run: ./scripts/ci/check-rebuild-evidence-authority.sh

      # v1.228.5 FHS/log authority. A logrotate stanza may only target /var/log:
      # nftban_var_lib_t has no logrotate_t access, so ONE bad stanza fails the whole
      # system-wide logrotate run. Reads the GENERATOR (inventory.go), not just the
      # template, because /etc/logrotate.d/nftban is %ghost and regenerated at postinstall.
      # R-4 asserts every MIGRATED pattern has a retention owner; R-5 asserts no
      # package-owned config or writer default resolves back under /var/lib
      # (DEFAULT_PATH_CORRECT != EFFECTIVE_PATH_CORRECT).
      - name: Check logrotate FHS authority (v1.228.5, BLOCKING)
        run: ./scripts/ci/check-logrotate-fhs-authority.sh

      # v1.228.5 GUARD-THE-GUARD, BLOCKING. The rule above shipped in two non-discriminating
      # states: R-4 returned PASS after extracting ZERO patterns, and R-5 was blind to Go,
      # systemd, packaging and JSON — so it could not catch the defect it was written for.
      # A guard that cannot fail is not protection, and nothing detects that from its own
      # green output. This injects each defect class and requires a FAIL, then injects a
      # correct construct and requires a PASS. Mutations are restored and the tree is
      # verified byte-identical afterwards.
      - name: Check logrotate FHS guard is falsifiable (v1.228.5, BLOCKING)
        run: ./scripts/ci/check-logrotate-fhs-authority-falsifiability.sh

      # v1.228.6 BLOCKING. The nft meter shorthand creates an IMPLICIT dynamic set:
      # 65535 cap, no timeout, monotonic growth — and on nft <= 1.0.9 an inline meter
      # that cannot be listed as a set or flushed. Measured result (2026-08-04): four
      # production resolvers served DNS outages from saturated ddos_dns_udp state and
      # srv3 was ~16h from total TCP lockout. R1 rejects the shorthand in every render
      # source; R2 requires size+timeout+dynamic on every limiter declaration; R3
      # enforces v4/v6 parity; R4 pins the pre-rendered boot copy to the template
      # (the 28-anchor count cannot see a divergent limiter definition); R5 requires
      # a deliberate at-capacity policy row per limiter in
      # scripts/ci/data/nft-limiter-capacity-policy.tsv.
      - name: Check nft bounded limiters (v1.228.6, BLOCKING)
        run: ./scripts/ci/check-nft-bounded-limiters.sh

      # v1.228.6 GUARD-THE-GUARD, BLOCKING — same discipline as the logrotate guard
      # above: inject each violation class, require a FAIL that names it; inject prose
      # mentioning the construct, require a PASS; verify restoration.
      - name: Check bounded-limiter guard is falsifiable (v1.228.6, BLOCKING)
        run: ./scripts/ci/check-nft-bounded-limiters-falsifiability.sh

      # v1.228.7 BLOCKING — INCOMPLETE_SHELL_TO_GO_MIGRATION guard. A shell->Go
      # migration is complete only when EVERY consumer is repointed. GeoIP moved
      # into `nftban-core geoip` but six consumers kept resolving the retired
      # standalone bin/.real/nftban-geoip-* — so country-blocking was dead
      # fleet-wide for months (measured on dns1) with no test catching it. This
      # fails on any EXECUTABLE reference to a retired entrypoint listed in
      # scripts/ci/data/retired-entrypoints.tsv; comment lines and RETIRED-OK:
      # markers are allowlisted so a reintroduction-guard may name the path.
      - name: Check retired-binary references (v1.228.7, BLOCKING)
        run: ./scripts/ci/check-retired-binary-references.sh

      # v1.228.5 recurrence guard. Correctness derives from a DECLARED artifact_class in
      # the canonical build/fhs-spec.yaml rather than pinned path strings, so a newly
      # added artifact cannot pass by being merely self-consistent — the failure mode that
      # let the original misplacement survive years of green tests.
      - name: Check artifact class authority (v1.228.5, BLOCKING)
        run: ./scripts/ci/check-artifact-class-authority.sh

      # Build provenance: the packaging build must never silently package a stale
      # bin/* artifact. Source builds rebuild+verify; prebuilt packaging is explicit
      # and manifest-verified. Runs the hermetic provenance test suite.
      - name: Check build provenance (anti-stale-prebuilt)
        run: ./scripts/ci/check-build-provenance.sh

      # Uninstall firewall safety: package removal must never leave an NFTBan base
      # chain with policy drop and no accept rules (the v1.221.2 uninstall-
      # connectivity defect — a bare `nft flush table ip nftban` on non-purge
      # remove kept the drop-policy input chain and locked out inbound SSH/ping
      # until reboot). Rejects flush-without-delete in DEB/RPM maintainer scripts.
      - name: Check uninstall firewall safety (no drop-policy chain after removal)
        run: ./scripts/ci/check-uninstall-firewall-safety.sh

      # ── v1.226.0 PR-D: index-driven shell-test execution, STRICT ENFORCEMENT ──
      #   The canonical authority index (scripts/ci/test-authority-index.tsv) DRIVES
      #   execution. policy-gates AND ci-bash are BLOCKING. PR-C's informational
      #   ci-bash baseline is retired: PR-D challenged all 19 exposed failures — 15
      #   were stale/obsolete test expectations corrected test-only (product
      #   unchanged); 4 remain under an audited, expiring quarantine (still executed +
      #   reported, excluded from the blocking tally only via valid metadata + matched
      #   failure pattern). See scripts/ci/ci-bash-red-baseline-audit.md (dispositions).
      - name: Shell-test runner + strict/quarantine self-tests (v1.226.0 PR-D, BLOCKING)
        run: |
          bash scripts/ci/run-test-suite-selftest.sh
          bash scripts/ci/pr-d-strict-selftest.sh
      - name: Quarantine registry validity (v1.226.0 PR-D, BLOCKING)
        run: bash scripts/ci/check-quarantine-registry.sh
      # v1.228.2: DIAGNOSTIC ONLY — this does not replace the runner's own
      # pre-flight. run-test-suite.sh already calls `test-authority.py check`
      # before the suite starts and fails on a stale index; that guard works and
      # is retained as the single runner authority. What it does NOT give a
      # reviewer is a reviewable diff, so this step renders the index to a
      # TEMPORARY path and diffs it. Neither path mutates the checkout: a CI job
      # validates repository state, it never repairs it.
      #
      # Why this exists: the generated index is a MULTI-LANE authority. In the
      # v1.228.2 stack four PRs added tests; one regenerated the index while it
      # was last in merge order, a rebase then landed another test after it, and
      # the composed tree was stale. Every individual PR was green. That is a
      # post-rebase PROCESS failure, not a missing guard.
      - name: test-authority index freshness (diagnostic diff)
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          python3 scripts/ci/test-authority.py generate --output "$tmp"
          if ! diff -u scripts/ci/test-authority-index.tsv "$tmp"; then
              echo "::error::test-authority index is stale"
              echo "::error::Regenerate with: python3 scripts/ci/test-authority.py generate"
              echo "::error::The generated index belongs to the LAST PR in merge order and must be regenerated after every rebase, cherry-pick, merge or stack reorder."
              exit 2
          fi

      - name: Policy Gates shell-test suite — index-driven (v1.226.0 PR-D, BLOCKING)
        run: bash scripts/ci/run-test-suite.sh run --gate policy-gates
      # ci-bash: BLOCKING. Every non-quarantined ci-bash test must pass; the 4
      # quarantined tests still execute + report but are bound to their registered
      # failure pattern (a pass, a category change, disappearance, or an over-ceiling
      # count all BLOCK). CI green here means all non-quarantined required shell tests
      # passed — not that failures were hidden.
      - name: CI-bash suite — BLOCKING with audited quarantine (v1.226.0 PR-D)
        run: bash scripts/ci/run-test-suite.sh run --gate ci-bash --quarantine scripts/ci/ci-bash-quarantine.tsv
      # deferred + lab-manual: visible, never executed, never counted PASS
      - name: Deferred / lab-manual shell tests — report-only (v1.226.0 PR-D)
        run: |
          bash scripts/ci/run-test-suite.sh report --gate deferred
          bash scripts/ci/run-test-suite.sh report --gate lab-manual

      # v1.194 (8C): protection-claim matrix gate. Fails the PR if the matrix
      # regresses — wrong row count, missing/empty fields, invalid OWNER/MODE/
      # CLASSIFICATION enum, a claimed-enforce row orphaned to owner=NONE
      # (not unowned/deferred), or a dead knob (WordPressXMLRPC/WordPressWPLogin)
      # represented as a live ban authority.
      - name: Check protection-claim matrix (8C)
        run: ./scripts/ci/check-protection-claim-matrix.sh

      # v1.196 (PR-F): IPv4/IPv6 parity. Fails if a family-keyed nft set/check
      # exists for one family without the other (both ip+ip6 nftban tables; every
      # *_ipv4 has *_ipv6 and the canonical set inventories of the two tables match),
      # or if a family-sensitive matrix fixture silently covers only one family
      # (without a PARITY-GUARD-EXEMPT marker).
      - name: Check IPv4/IPv6 parity (PR-F)
        run: ./scripts/ci/check-ipv4-ipv6-parity.sh

      # v1.197 (PR-LICENSE/L1): Core license-metadata gate. Fails the PR if the
      # RPM spec generator or the rendered Core spec declares a copyleft
      # (GPL/LGPL/AGPL) license in its License field (the historical copyleft
      # defect), if the spec stops shipping %license LICENSE, or if a high-level
      # public surface (README, LICENSE, NOTICE.md, TRADEMARK.md, Dockerfile OCI
      # label) self-declares a copyleft license. Comparative or blocked-policy
      # mentions are allowed.
      - name: Check Core license metadata (PR-LICENSE)
        run: ./scripts/ci/check-license-metadata.sh

      # v1.228.4 PR-1: nft consumer execution authority. A shipped unit that shells
      # out to nft while its RestrictAddressFamilies omits AF_NETLINK fails with
      # EAFNOSUPPORT before nft parses its arguments — and because the probes
      # discard stderr, that surfaced as a false "firewall table absent" verdict on
      # 11/11 measured hosts while systemd still reported Result=success.
      # Asserts inventory<->unit parity both ways, that confirmed consumers declare
      # AF_NETLINK, that bounded-trace non-consumers withhold it, that no
      # unprivileged unit gains CAP_NET_ADMIN silently, and that the Queue/BotScan
      # denial for v1.228.4 stays honoured. The temporary expected_open_violations
      # baseline in build/nft-consumer-authority.yaml keeps this PASS while PR-1
      # ships the guard ahead of the PR-2 correction; it must reach zero in PR-2.
      #
      # rc is captured INDEPENDENTLY of any output pipeline. `guard | tail` returns
      # tail's status and has silently converted rc1 into job success three times
      # in this codebase — see COMMAND_RC_EVIDENCE rule.
      # v1.228.4 PR-3: nft probe authority. G-1 keeps the maintenance path fully
      # typed; G-2 rejects NEW code that turns a generic nft failure into absence,
      # rebuild authority, or a healthy verdict; G-3 is a ratchet on the remaining
      # legacy debt (95 sites) so it can shrink but never grow.
      #
      # rc captured INDEPENDENTLY of any output pipeline — `guard | tail` returns
      # tail's status and has silently converted rc1 into job success three times
      # in this codebase.
      - name: Check nft probe authority G-1/G-2/G-3 (v1.228.4 PR-3, BLOCKING)
        run: |
          set +e
          output="$(./scripts/ci/check-nft-probe-authority.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "::error::nft probe authority guard failed (rc=$rc) — use nftban_nft_probe_table/_set; see scripts/ci/nft-probe-debt-baseline.txt"
            exit "$rc"
          fi

      - name: Check nft consumer execution authority (v1.228.4 PR-1, BLOCKING)
        run: |
          set +e
          output="$(./scripts/ci/check-nft-consumer-authority.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "::error::nft consumer execution authority guard failed (rc=$rc) — see build/nft-consumer-authority.yaml"
            exit "$rc"
          fi

      # v1.205 CLI surface parity: registry ↔ bash-completion ↔ dispatch (authority
      # = shell dispatch). Classifies MISSING/STALE/RETIRED/ALIAS_NOT_MARKED/etc.;
      # fails on real drift (e.g. retired 'gui' resurfacing in completion, a real
      # dispatch command missing from the registry, an unmarked alias/deprecated verb).
      - name: Check CLI surface parity (registry/completion/dispatch)
        run: ./scripts/ci/check-cli-surface-parity.sh

      # v1.226.0 PR-A (Test-Suite Single Authority, Phase B substrate): the
      # canonical governance of a shell test (owner / execution class / gate /
      # environment requirements) lives in per-test `# meta:ta.*` headers; the
      # tracked index (test-authority-index.tsv) is a GENERATED, non-authoritative
      # projection. These three steps are BLOCKING:
      #   1. self-tests   — the tool's own fixture suite (parsing, validation,
      #                      exit codes, determinism); no live corpus dependency.
      #   2. validate     — TRANSITION mode: fails on malformed metadata / duplicate
      #                      id|path / invalid values on migrated files. Legacy
      #                      (un-migrated) tests are permitted — PR-A does NOT
      #                      activate the strict unclassified-test gate (that is PR-D).
      #   3. check        — the generated index must be fresh (regenerate on any
      #                      header change). Hermetic; no root, network, or package.
      # Schema: scripts/ci/test-authority-schema.md
      - name: Shell-test authority — self-tests (v1.226.0 PR-A)
        run: python3 scripts/ci/test-authority-selftest.py
      - name: Shell-test authority — validate metadata (STRICT zero-unclassified, v1.226.0 PR-D)
        run: python3 scripts/ci/test-authority.py validate --mode strict
      - name: Shell-test authority — index freshness (v1.226.0 PR-A)
        run: python3 scripts/ci/test-authority.py check

      # SEC-INFRA dual-scope privacy gates (GO_IMPLEMENT_SEC_INFRA_DUAL_SCOPE_PRIVACY_GATES).
      #
      # Gate A (BLOCKING): the publication surface only — files a user RECEIVES or
      # READS, enumerated from scripts/ci/release-surface.txt (binary-package
      # payload + compiled-in source + public docs). Fails the build on any
      # UNAPPROVED REAL identifier (REAL_OPERATOR_IDENTIFIER / SHIPPED_PUBLIC_SURFACE)
      # reaching users. Synthetic attacker/example IPs in test fixtures classify as
      # advisory and do NOT block. Findings are REDACTED (no raw secrets in logs).
      # This gate enforces NFTBAN_RELEASE_PUBLICATION = BLOCKED at the source tree;
      # the release job must also run it over the package staging tree before publish.
      # v1.226.0 privacy hotfix: the scanner's own self-tests are BLOCKING — they prove
      # the escaped-dot IPv4 bypass stays closed (a real dotted-quad written as a shell
      # grep pattern with backslash-escaped dots must not evade the deny-authority or the
      # IPv4 detector) and that the hardening introduces no false positives. Synthetic
      # fixtures only; no real identifier is present. Runs before the release-surface gate.
      - name: Privacy scanner self-tests + escaped-IPv4 bypass regression (BLOCKING)
        run: python3 scripts/ci/privacy-scan-selftest.py
      # v1.226.0 privacy defense-in-depth. Generic gates need no secret and always block.
      # The independent private deny gate auto-activates when the maintainer secret is present
      # and is advisory/NOT_RUN otherwise — fork PRs get no secrets, so it never blocks
      # untrusted contributors while the generic gates always do. This workflow uses
      # `pull_request` (NOT pull_request_target): fork code runs read-only, no secrets.
      - name: Private-identifier gate self-tests (BLOCKING)
        run: python3 scripts/ci/private-identifier-gate-selftest.py
      - name: Generic whole-tree privacy scan — includes scanner source (BLOCKING)
        run: python3 scripts/ci/privacy-scan.py --scope repository --strict
      # Inputs pass via env (never interpolated into the shell) — avoids run-step injection.
      # The diff uses the PR base SHA (a parent of the checked-out merge commit), fetched
      # shallowly so the three-dot diff has its merge-base.
      - name: Generic changed-line privacy scan (BLOCKING, PRs)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/ci/privacy-scan.py --changed-lines "$BASE_SHA" --strict
      - name: Private-identifier deny gate — whole tree (advisory; auto-activates with secret)
        env:
          NFTBAN_PRIVACY_DENYLIST: ${{ secrets.NFTBAN_PRIVACY_DENYLIST }}
          NFTBAN_PRIVACY_FP_KEY: ${{ secrets.NFTBAN_PRIVACY_FP_KEY }}
        run: python3 scripts/ci/private-identifier-gate.py --whole-tree --mode advisory
      - name: Private-identifier deny gate — changed lines (advisory; auto-activates with secret)
        if: github.event_name == 'pull_request'
        env:
          NFTBAN_PRIVACY_DENYLIST: ${{ secrets.NFTBAN_PRIVACY_DENYLIST }}
          NFTBAN_PRIVACY_FP_KEY: ${{ secrets.NFTBAN_PRIVACY_FP_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/ci/private-identifier-gate.py --changed-lines "$BASE_SHA" --mode advisory

      - name: Check privacy — RELEASE surface (SEC-INFRA Gate A, BLOCKING)
        run: python3 scripts/ci/privacy-scan.py --scope release --strict

      # Gate B (ADVISORY): the full tracked tree, categorized. Surfaces the
      # remaining privacy debt (synthetic test-fixture IPs, pseudonymous dev paths,
      # historical documentation) without failing the build — the debt is
      # classified, never silently excluded. Flip to blocking once the test-fixture
      # remediation is validated on a Go-capable host.
      - name: Check privacy — REPOSITORY debt (SEC-INFRA Gate B, advisory)
        continue-on-error: true
        run: python3 scripts/ci/privacy-scan.py --scope repository --report

      - name: Check netlink import policy
        run: |
          echo "=== Checking netlink import architecture policy ==="
          VIOLATIONS=0

          echo "Checking cmd/nftban-core for forbidden netlink imports..."
          if grep -r "github.com/google/nftables" cmd/nftban-core/ 2>/dev/null; then
            echo "::error::cmd/nftban-core imports netlink directly — CLI must use IPC (pkg/ipc)"
            VIOLATIONS=1
          else
            echo "✓ cmd/nftban-core: No direct netlink imports"
          fi

          echo ""
          echo "Verifying daemon uses netlink (expected)..."
          if grep -q "github.com/google/nftables" cmd/nftband/main.go 2>/dev/null || \
             grep -q "nftbackend" cmd/nftband/main.go 2>/dev/null; then
            echo "✓ cmd/nftband: Uses nftbackend (correct — daemon owns nft writes)"
          fi

          if [[ $VIOLATIONS -gt 0 ]]; then
            exit 1
          fi
          echo "✓ Netlink import policy: PASSED"

      - name: Public API surface guard
        run: |
          echo "=== Checking public API boundary (pkg/) ==="
          VIOLATIONS=0
          for gofile in $(find pkg/ -name "*.go" -type f 2>/dev/null); do
            dir=$(dirname "$gofile")
            case "$dir" in
              pkg/ipc|pkg/ipc/*|pkg/version|pkg/version/*) ;;
              *)
                echo "::error::$gofile is outside allowed pkg/ directories — move to internal/"
                VIOLATIONS=1
                ;;
            esac
          done
          if [[ $VIOLATIONS -gt 0 ]]; then
            exit 1
          fi
          echo "✓ Public API surface: PASS (only pkg/ipc and pkg/version)"

      - name: Suppression comment audit
        run: |
          echo "=== Auditing suppression comments ==="
          NOSEC_COUNT=$(grep -r '#nosec' --include="*.go" . 2>/dev/null | wc -l || echo 0)
          NOLINT_COUNT=$(grep -r '//nolint:' --include="*.go" . 2>/dev/null | wc -l || echo 0)
          LINT_IGNORE_COUNT=$(grep -r '//lint:ignore' --include="*.go" . 2>/dev/null | wc -l || echo 0)
          echo "  #nosec:        $NOSEC_COUNT"
          echo "  //nolint::     $NOLINT_COUNT"
          echo "  //lint:ignore: $LINT_IGNORE_COUNT"
          echo ""
          if [[ "$NOLINT_COUNT" -gt 0 ]]; then
            echo "::error::Found $NOLINT_COUNT //nolint: directives — use //lint:ignore <CHECK> <reason>"
            grep -rn '//nolint:' --include="*.go" . 2>/dev/null || true
            exit 1
          fi
          echo "✓ Suppression audit: PASS"

      - name: Import boundary guard
        run: |
          echo "=== Checking import boundaries ==="
          if grep -r 'internal/nftbackend' cmd/nftban-core/ --include="*.go" 2>/dev/null; then
            echo "::error::cmd/nftban-core/ imports internal/nftbackend — CLI must use pkg/ipc"
            exit 1
          fi
          echo "✓ Import boundary: PASS (CLI does not import nftbackend)"

      - name: FHS spec generated files check
        run: |
          echo "=== Verifying FHS spec generated files are up to date ==="
          if ! ./build/generate-fhs-outputs.sh --check; then
            echo ""
            echo "::error::Generated FHS files are out of date — run: ./build/generate-fhs-outputs.sh"
            exit 1
          fi
          echo "✓ FHS spec: PASS (generated files match YAML spec)"

      - name: Systemd install-list generated file check
        run: |
          echo "=== Verifying systemd install-list is up to date ==="
          if ! ./build/generate-systemd-install-list.sh --check; then
            echo ""
            echo "::error::install/packaging/systemd/nftban-systemd-install.list is stale — run: ./build/generate-systemd-install-list.sh"
            exit 1
          fi
          echo "✓ Systemd install-list: PASS (matches install/systemd source)"

      - name: docs/systemd/UNITS.md count parity
        run: |
          echo "=== Verifying docs/systemd/UNITS.md counts match install list ==="
          list=install/packaging/systemd/nftban-systemd-install.list
          fs_timer=$(grep -cE '\.timer$' "$list")
          fs_svc=$(grep -cE '\.service$' "$list")
          fs_socket=$(grep -cE '\.socket$' "$list")
          doc_timer=$(grep -oE '^## Timers \([0-9]+\)' docs/systemd/UNITS.md | grep -oE '[0-9]+' || echo 0)
          doc_svc=$(grep -oE '^## Services \([0-9]+\)' docs/systemd/UNITS.md | grep -oE '[0-9]+' || echo 0)
          doc_socket=$(grep -oE '^## Sockets \([0-9]+\)' docs/systemd/UNITS.md | grep -oE '[0-9]+' || echo 0)
          fail=0
          [ "$fs_timer" = "$doc_timer" ] || { echo "::error::timer count drift: list=$fs_timer doc=$doc_timer"; fail=1; }
          [ "$fs_svc" = "$doc_svc" ] || { echo "::error::service count drift: list=$fs_svc doc=$doc_svc"; fail=1; }
          [ "$fs_socket" = "$doc_socket" ] || { echo "::error::socket count drift: list=$fs_socket doc=$doc_socket"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "✓ docs/systemd/UNITS.md counts: PASS ($fs_timer timers, $fs_svc services, $fs_socket socket)"

      - name: Systemd maintainer-script generated files check
        run: |
          echo "=== Verifying systemd maintainer-script artifacts are up to date ==="
          if ! ./build/generate-systemd-maintainer-scripts.sh --check; then
            echo ""
            echo "::error::Systemd maintainer-script artifacts are stale — run: ./build/generate-systemd-maintainer-scripts.sh"
            exit 1
          fi
          echo "✓ Systemd maintainer-scripts: PASS (matches generator output)"

      - name: C3 maintainer-script structural assertions (A5)
        run: |
          echo "=== A5: structural assertions on generated cleanup artifacts ==="
          rpm_art=install/packaging/rpm/nftban-preun-systemd-cleanup.inc
          deb_art=install/packaging/deb/nftban-prerm-systemd-cleanup.inc
          fail=0
          # A5.1 — both artifacts contain mask_if_exists helper
          grep -qE '^mask_if_exists\(\)' "$rpm_art" || { echo "::error::RPM artifact missing mask_if_exists() helper"; fail=1; }
          grep -qE '^mask_if_exists\(\)' "$deb_art" || { echo "::error::DEB artifact missing mask_if_exists() helper"; fail=1; }
          # A5.2 — both artifacts have the readlink /dev/null boundary check
          grep -qE 'readlink "/etc/systemd/system/\$unit".*= *"/dev/null"' "$rpm_art" || { echo "::error::RPM artifact missing readlink /dev/null check (A1 policy)"; fail=1; }
          grep -qE 'readlink "/etc/systemd/system/\$unit".*= *"/dev/null"' "$deb_art" || { echo "::error::DEB artifact missing readlink /dev/null check (A1 policy)"; fail=1; }
          # A5.3 — no unconditional `systemctl mask nftban-ui*` literal outside mask_if_exists in any maintainer-script source
          if grep -nE 'systemctl mask "[^"]*nftban-ui[^"]*"' packaging/build_nftban.sh packaging/deb/prerm 2>/dev/null \
             | grep -v 'mask_if_exists'; then
              echo "::error::unconditional systemctl mask nftban-ui* found outside mask_if_exists (A1 regression)"
              fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "✓ C3 structural assertions: PASS (mask_if_exists + /dev/null boundary + no unconditional mask)"

      # =====================================================================
      # MFST-C6 (v1.107): packaging-wire structural assertions (AM-4)
      # =====================================================================
      # Proves both packagers consume generated manifest authority artifacts.
      # If a future edit silently replaces a generator-driven %include / while-read
      # loop with hardcoded content, these greps fail before the build runs.
      #   AM-4.1: RPM Source1 + %include of nftban-files.inc
      #   AM-4.2: DEB build_deb() while-read of nftban.dirs
      #   AM-4.3: RPM/DEB consume nftban-systemd-install.list
      - name: MFST-C6 packaging-wire structural assertions (AM-4)
        run: |
          echo "=== MFST-C6 / AM-4: packaging-wire structural assertions ==="
          spec=packaging/build_nftban.sh
          fail=0

          # AM-4.1 — RPM consumes generated nftban-files.inc
          grep -qE '^Source1:[[:space:]]+nftban-files\.inc' "$spec" \
            || { echo "::error::AM-4.1: RPM Source1: nftban-files.inc missing in $spec"; fail=1; }
          grep -qE '^%include[[:space:]]+%\{_sourcedir\}/nftban-files\.inc' "$spec" \
            || { echo "::error::AM-4.1: %include %{_sourcedir}/nftban-files.inc missing in $spec"; fail=1; }

          # AM-4.2 — DEB build_deb() consumes generated nftban.dirs via while-read
          if ! awk '/^build_deb\(\)/,/^\}/' "$spec" \
               | grep -qE 'install/packaging/deb/nftban\.dirs'; then
            echo "::error::AM-4.2: build_deb() does not reference install/packaging/deb/nftban.dirs in $spec"
            fail=1
          fi
          if ! awk '/^build_deb\(\)/,/^\}/' "$spec" \
               | grep -qE 'while[[:space:]]+(IFS=.*[[:space:]]+)?read'; then
            echo "::error::AM-4.2: build_deb() lacks while-read loop consuming nftban.dirs in $spec"
            fail=1
          fi

          # AM-4.3 — RPM and DEB both consume generated nftban-systemd-install.list
          grep -qE '^Source2:[[:space:]]+nftban-systemd-install\.list' "$spec" \
            || { echo "::error::AM-4.3: RPM Source2: nftban-systemd-install.list missing in $spec"; fail=1; }
          # %install RPM body must reference the generated install list
          grep -qE '%\{_sourcedir\}/nftban-systemd-install\.list' "$spec" \
            || { echo "::error::AM-4.3: RPM %install does not reference %{_sourcedir}/nftban-systemd-install.list in $spec"; fail=1; }
          # build_deb() must reference the generated install list
          if ! awk '/^build_deb\(\)/,/^\}/' "$spec" \
               | grep -qE 'install/packaging/systemd/nftban-systemd-install\.list'; then
            echo "::error::AM-4.3: build_deb() does not reference install/packaging/systemd/nftban-systemd-install.list in $spec"
            fail=1
          fi

          [ "$fail" = "0" ] || exit 1
          echo "✓ MFST-C6 / AM-4: PASS (RPM Source1+%include + DEB while-read + RPM/DEB systemd-install-list)"

      # =====================================================================
      # MFST-C6 (v1.107): UNITS.md per-row parity (E6)
      # =====================================================================
      # Closes content-gap left by the existing count-only check above.
      # Asserts every active unit listed in nftban-systemd-install.list (the C1
      # source-of-truth) appears as a backticked table row in UNITS.md.
      - name: MFST-C6 docs/systemd/UNITS.md table-row parity (E6)
        run: |
          echo "=== MFST-C6 / E6: UNITS.md per-row parity vs systemd install list ==="
          list=install/packaging/systemd/nftban-systemd-install.list
          doc=docs/systemd/UNITS.md
          fail=0
          missing=0
          while IFS= read -r unit; do
            # Skip blank lines and comments
            case "$unit" in
              ''|\#*) continue ;;
            esac
            # Each unit must appear as a backticked token somewhere in UNITS.md
            if ! grep -qF "\`${unit}\`" "$doc"; then
              echo "::error::E6: docs/systemd/UNITS.md missing row for unit: ${unit}"
              missing=$((missing + 1))
              fail=1
            fi
          done < "$list"
          [ "$fail" = "0" ] || { echo "::error::E6: ${missing} unit(s) missing from $doc"; exit 1; }
          echo "✓ MFST-C6 / E6: PASS (every unit in $list has a backticked row in $doc)"

      # =====================================================================
      # NEW CHECKS (v1.50.1 — Distribution Compatibility Audit)
      # =====================================================================

      - name: Distro config completeness
        run: |
          echo "=== Validating distribution config files ==="
          ./cli/lib/nftban/tests/validate_distro_configs.sh etc/nftban/distros/

      - name: Hardcoded path detector
        run: |
          echo "=== Checking for hardcoded binary paths ==="
          #
          # Shell scripts should use distro config variables, not hardcoded paths.
          # Allowed exceptions:
          #   - etc/nftban/distros/*.conf (distro configs define the paths)
          #   - cli/lib/nftban/tests/ (test fixtures)
          #   - cli/lib/nftban/data/ (FHS spec, schemas)
          #   - install/ (install scripts target known paths)
          #   - packaging/ (RPM/DEB specs target known paths)
          #   - .github/ (CI scripts)
          #
          VIOLATIONS=0
          TMPFILE=$(mktemp)
          trap 'rm -f "$TMPFILE"' EXIT

          # Detect hardcoded /var/log/secure or /var/log/auth.log in runtime code
          # These differ between RHEL (/var/log/secure) and Debian (/var/log/auth.log)
          grep -rn '/var/log/secure\|/var/log/auth\.log' \
              --include="*.sh" \
              cli/lib/nftban/core/ \
              cli/lib/nftban/cli/ \
              cli/lib/nftban/lib/ \
              cli/lib/nftban/setup/ \
              2>/dev/null | \
              grep -v '#.*hardcoded\|DISTRO_PATHS\|fallback\|default\|example\|# ' | \
              grep -v 'nftban_distro_config\.sh' \
              >> "$TMPFILE" || true

          COUNT=$(wc -l < "$TMPFILE" | tr -d ' ')
          if [[ "$COUNT" -gt 0 ]]; then
            echo "⚠ Found $COUNT hardcoded auth log paths (should use DISTRO_PATHS[auth_log]):"
            cat "$TMPFILE"
            echo ""
            echo "NOTE: Reporting as warning — fix in future PR"
          else
            echo "✓ No hardcoded auth log paths in runtime code"
          fi

          # Detect hardcoded /sbin/nft (Debian legacy path) — should always be /usr/sbin/nft or variable
          grep -rn '"/sbin/nft"\|/sbin/nft ' \
              --include="*.sh" --include="*.go" \
              cli/lib/nftban/core/ \
              cli/lib/nftban/cli/ \
              cli/lib/nftban/lib/ \
              cmd/ internal/ \
              2>/dev/null | \
              grep -v '#.*\|//.*\|test\|example' \
              > "$TMPFILE" || true

          COUNT=$(wc -l < "$TMPFILE" | tr -d ' ')
          if [[ "$COUNT" -gt 0 ]]; then
            echo ""
            echo "::error::Found $COUNT references to /sbin/nft (legacy path) — use /usr/sbin/nft or distro config"
            cat "$TMPFILE"
            VIOLATIONS=1
          else
            echo "✓ No legacy /sbin/nft paths"
          fi

          if [[ $VIOLATIONS -gt 0 ]]; then
            exit 1
          fi
          echo ""
          echo "✓ Hardcoded path check: PASS"

      - name: systemd directive version guard
        run: |
          echo "=== Checking systemd directives against minimum version (249) ==="
          #
          # NFTBan supports systemd 249+ (EL9 baseline).
          # Flag directives that require newer systemd versions.
          #
          VIOLATIONS=0

          # Directives requiring systemd >= 250+
          FORBIDDEN_DIRECTIVES=(
            "SetCredential="         # 250
            "LoadCredential="        # 250
            "LoadCredentialEncrypted=" # 250
            "RuntimeRandomizedExtraSec=" # 251
            "ExecSearchPath="        # 252
            "OpenFile="              # 253
            "MemoryZSwapMax="        # 254
            "CoredumpReceive="       # 255
            "ExitType="              # 256
            "SurviveFinalKillSignal=" # 256
          )

          for directive in "${FORBIDDEN_DIRECTIVES[@]}"; do
            name="${directive%=}"
            if grep -rn "$directive" install/systemd/ 2>/dev/null | grep -v '^#' | grep -v '#.*'; then
              echo "::error::Found $name in systemd units — requires systemd > 249 (min supported)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [[ $VIOLATIONS -gt 0 ]]; then
            exit 1
          fi
          echo "✓ All systemd directives compatible with systemd 249+ (EL9 baseline)"

      - name: nft template placeholder guard
        run: |
          echo "=== Verifying boot-safety of shipped nft config ==="
          #
          # Invariant: install/nftables/nftables.conf must NEVER contain placeholders.
          # It is included by systemd nftables.service at boot — raw placeholders = no firewall.
          #
          # The template (nftables.conf.tpl) SHOULD have placeholders.
          #

          # 1. Rendered config must be placeholder-free
          if grep -qE '__[A-Z_]{3,}__' install/nftables/nftables.conf 2>/dev/null; then
            echo "::error::install/nftables/nftables.conf contains placeholders — BOOT UNSAFE!"
            echo "This file is loaded by nftables.service at boot. Placeholders cause nft syntax errors."
            echo "Render with safe defaults: __SSH_PORT__→22, __CT_LIMIT_SSH__→15, etc."
            grep -n '__[A-Z_]\+__' install/nftables/nftables.conf
            exit 1
          fi
          echo "✓ Rendered config (nftables.conf) is placeholder-free"

          # 2. Template must HAVE placeholders (sanity check)
          if [[ -f install/nftables/nftables.conf.tpl ]]; then
            if ! grep -qE '__[A-Z_]{3,}__' install/nftables/nftables.conf.tpl; then
              echo "::error::install/nftables/nftables.conf.tpl has NO placeholders — template is broken"
              exit 1
            fi
            echo "✓ Template (nftables.conf.tpl) contains placeholders"
          fi

          # 3. Safe config must not have CT_LIMIT placeholders
          if [[ -f install/nftables/nftables-safe.conf ]]; then
            if grep -qE '__CT_LIMIT_[A-Z]+__' install/nftables/nftables-safe.conf; then
              echo "::error::nftables-safe.conf contains CT_LIMIT placeholders — must use hardcoded defaults"
              exit 1
            fi
            echo "✓ Safe config has no CT_LIMIT placeholders"
          fi

          echo ""
          echo "✓ Boot-safety check: PASS"

