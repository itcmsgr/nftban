# =============================================================================
# NFTBan v1.0.0 - GitHub Actions Release Workflow
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Automated package building and release on version tags
# Triggers: Push to v* tags (e.g., v1.0.0, v1.0.1)
#
# What this does:
#   1. Builds Go binaries (nftban-core) for x86_64
#   2. Creates RPM packages for EL9, EL10
#   3. Creates DEB packages for Ubuntu 22.04/24.04, Debian 12/13
#   4. Generates SHA256SUMS.build (local ground truth checksums)
#   5. Creates distro-specific package names (nftban-el9-x86_64.rpm, etc.)
#   6. Creates MANIFEST.txt (file inventory)
#   7. Generates SBOM (sbom.spdx.json) for supply-chain compliance
#   8. Uploads everything to GitHub Release as DRAFT
#   9. verify-release job downloads assets, verifies against SHA256SUMS.build,
#      generates final SHA256SUMS from downloaded assets, publishes release
#
# INTEGRITY ARCHITECTURE (v1.21.5 — Dual-Checksum Handshake):
#   - SHA256SUMS.build = checksums from LOCAL build artifacts (ground truth)
#   - SHA256SUMS       = checksums from DOWNLOADED release assets (what users get)
#   - Release stays DRAFT until verify-release confirms:
#     1. All assets are downloadable (retry loop, not fixed sleep)
#     2. Downloaded checksums match build checksums (no upload corruption)
#     3. Binaries inside packages match standalone binary
#   - Only then: upload final SHA256SUMS + publish release
# =============================================================================

name: Release Packages

on:
  push:
    tags:
      - "v*"
  # v1.221.1: manual dry-run surface. publish=false (default) runs the SAME jobs and
  # artifact-assembly logic (build-once → Mode-3 package → assemble SBOM/checksums/
  # MANIFEST/VERIFY → verify parity) but uploads NO GitHub release. Tag push remains
  # the authoritative publication mechanism.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub release (false = dry-run; assemble + verify, no upload)"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal top-level permissions (OpenSSF Scorecard compliance)
permissions: read-all

jobs:
  # ==========================================================================
  # RELEASE PREFLIGHT — generated-artifact drift, BEFORE anything is built
  # ==========================================================================
  # ⛔ WHY THIS JOB EXISTS. Every generator drift check lives in
  # ci-architecture.yml, whose trigger is push[main,master,develop] and
  # pull_request — NOT tags. release.yml ran none of them. So a tag pushed from a
  # commit carrying a stale generated artifact WOULD PUBLISH, and the only thing
  # standing between that and a bad release was the procedural rule "never tag a
  # commit that has not had a green ci-architecture run". A load-bearing human
  # rule is exactly what this release cycle has been removing everywhere else.
  #
  # It runs FIRST and gates build-binaries, so it fails before any artifact is
  # built, signed, uploaded or published — not merely before the final flip to
  # --draft=false.
  #
  # ⛔ IT REUSES THE CANONICAL GENERATORS. Their --check modes are the authority;
  # nothing about generation is reimplemented here. If a generator gains a new
  # committed output, add it there, not to this workflow.
  release-preflight:
    name: Release preflight (generated-artifact + conffile authority)
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like every other action in this workflow (B4). fetch-depth: 0
      # is REQUIRED, not cosmetic: the conffile gate resolves its baseline with
      # `git describe --tags`, which returns nothing in a shallow checkout — the
      # gate would then exit 2 on every run, or worse, be given a baseline that
      # silently does not exist.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: FHS outputs are current (VERSION-coupled)
        run: ./build/generate-fhs-outputs.sh --check

      - name: systemd install list is current
        run: ./build/generate-systemd-install-list.sh --check

      - name: systemd maintainer scripts are current
        run: ./build/generate-systemd-maintainer-scripts.sh --check

      - name: VERSION / VERSION_DATE / CHANGELOG cohere
        run: ./scripts/ci/check-version-date-coherence.sh

      # ⛔ B3. The shipped-conffile mutation gate must be INVOKED here, not merely
      #    exist in scripts/ci/. A guard with unit tests but no call site provides
      #    ZERO release protection while reading, on a green board, exactly like one
      #    that does. No `|| true`, no `continue-on-error`: a non-zero rc must fail
      #    this job, and this job gates every build/publish job in the file.
      - name: No shipped conffile silently mutated since the last release
        run: ./scripts/ci/check-conffile-mutation.sh

      # Integration negative control for the step above. B3 was an INTEGRATION-EDGE
      # failure (the guard existed and passed its own tests while protecting
      # nothing), so proving the script can fail is NOT sufficient — we invoke it
      # through the same command line the real step uses, on a planted mutation.
      # Integration negative control for the step above. B3 was an INTEGRATION-EDGE
      # failure (the guard existed and passed its own tests while protecting
      # nothing), so proving the script can fail is NOT sufficient — we invoke it
      # through the same command line the real step uses, on a planted mutation.
      #
      # ⛔ THE MUTATION MUST BE COMMITTED. check-conffile-mutation.sh compares GIT
      #    REFS (`git ls-tree`, `git rev-parse "$BASE:$f"` / `"$CAND:$f"`), never the
      #    working tree. An earlier revision of this step appended to the file on
      #    disk and left it uncommitted, so the guard could not see it and the
      #    self-test reported "the gate is blind" against a gate that was working
      #    correctly. GUARD SUBJECT MUST EQUAL GUARD INPUT: the control has to place
      #    the mutation in the candidate ref the guard actually reads.
      #    Measured: worktree-only mutation -> rc=0 (invisible); committed -> rc=1.
      #
      # ⛔ THIS STEP HARD-RESETS THE CHECKOUT. It is safe in CI (fresh checkout, and
      #    it restores the exact starting commit), but running it by hand in a
      #    worktree that has UNCOMMITTED work will discard that work. Commit first.
      - name: Self-test - a mutated shipped conffile must fail preflight
        run: |
          set -uo pipefail
          SUBJ=install/config/nftban.conf
          test -f "$SUBJ" || { echo "::error::$SUBJ absent - self-test would be vacuous"; exit 1; }

          ORIG_HEAD="$(git rev-parse HEAD)"
          ORIG_TREE="$(git rev-parse 'HEAD^{tree}')"
          ORIG_BLOB="$(git rev-parse "HEAD:$SUBJ")"

          # Restore the exact starting commit no matter how the arms below exit.
          cleanup() {
            git reset -q --hard "$ORIG_HEAD" 2>/dev/null || true
            git clean -qfd -- "$SUBJ" 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '\n# deliberate conffile mutation injected by the preflight self-test\n' >> "$SUBJ"
          git -c user.email=ci@nftban.com -c user.name="NFTBan CI" \
              commit -aqm "preflight self-test: deliberate conffile mutation" \
            || { echo "::error::self-test could not commit the deliberate mutation"; exit 1; }

          MUTATED_HEAD="$(git rev-parse HEAD)"
          MUTATED_BLOB="$(git rev-parse "HEAD:$SUBJ")"

          # ⛔ PROVE THE CANDIDATE REF ACTUALLY CHANGED. Without this, a commit that
          #    silently recorded nothing would make the arm below vacuous again.
          if [ "$MUTATED_HEAD" = "$ORIG_HEAD" ]; then
            echo "::error::self-test did not advance HEAD - the guard would see the original ref"; exit 1
          fi
          if [ "$MUTATED_BLOB" = "$ORIG_BLOB" ]; then
            echo "::error::self-test did not change $SUBJ in the candidate ref (blob unchanged) - vacuous"; exit 1
          fi
          echo "self-test: candidate ref carries the mutation (${ORIG_BLOB:0:12} -> ${MUTATED_BLOB:0:12})"

          # THE CONTROL: the gate must now FAIL, and must name the mutated path.
          OUT="$(./scripts/ci/check-conffile-mutation.sh 2>&1)"; RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "$OUT"
            echo "::error::conffile gate PASSED on a deliberately mutated shipped conffile - the gate is blind"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -q "$SUBJ"; then
            echo "$OUT"
            echo "::error::gate failed but did not name $SUBJ - it failed for the wrong reason"
            exit 1
          fi

          # Restore and prove the restoration is exact.
          git reset -q --hard "$ORIG_HEAD"
          [ "$(git rev-parse HEAD)" = "$ORIG_HEAD" ] \
            || { echo "::error::self-test did not restore HEAD"; exit 1; }
          [ "$(git rev-parse 'HEAD^{tree}')" = "$ORIG_TREE" ] \
            || { echo "::error::self-test did not restore the tree"; exit 1; }
          [ -z "$(git status --porcelain)" ] \
            || { echo "::error::self-test left the working tree dirty"; git status --porcelain; exit 1; }

          # And the gate must pass again on the restored tree.
          ./scripts/ci/check-conffile-mutation.sh >/dev/null \
            || { echo "::error::gate fails on the RESTORED tree - restoration was not clean"; exit 1; }
          echo "self-test OK: mutation detected in the candidate ref, clean once restored"

      # Proves the drift check can actually fail. A guard that has never been
      # observed failing is a guard nobody has tested.
      - name: Self-test — a stale generated artifact must be detected
        run: |
          set -euo pipefail
          cp cli/lib/nftban/core/nftban_fhs_spec.sh /tmp/fhs.orig
          printf '\n# deliberate drift injected by the preflight self-test\n' \
            >> cli/lib/nftban/core/nftban_fhs_spec.sh
          if ./build/generate-fhs-outputs.sh --check >/dev/null 2>&1; then
            cp /tmp/fhs.orig cli/lib/nftban/core/nftban_fhs_spec.sh
            echo "::error::drift check PASSED on a deliberately stale artifact - the gate is blind"
            exit 1
          fi
          cp /tmp/fhs.orig cli/lib/nftban/core/nftban_fhs_spec.sh
          ./build/generate-fhs-outputs.sh --check
          echo "self-test OK: drift detected when injected, clean once restored"

  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    name: Build Go binaries
    needs: release-preflight
    runs-on: ubuntu-latest
    # v1.226.0: this job runs the fail-closed publication privacy gate, whose
    # secrets (NFTBAN_PRIVACY_DENYLIST / NFTBAN_PRIVACY_FP_KEY) live ONLY on the
    # protected `privacy-gate` environment (not repo-level, by design). Declare the
    # environment so they resolve here — preserving maintainer approval + scoping.
    environment: privacy-gate
    # v1.157 PR-C: setup-go installs the exact go.mod patch (1.25.13); a single
    # unconditional setup-go feeds the build, so GOTOOLCHAIN=local avoids a
    # redundant toolchain re-download. Compiler version is unchanged (1.25.13),
    # so binary output stays byte-reproducible.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # v1.226.0 privacy defense-in-depth: publication is FAIL-CLOSED on the private
      # identifier gate. Without the maintainer-provided denylist + fingerprint-key
      # secrets, or if a known-real identifier is present in the tree, the release is
      # BLOCKED (exit 2/1). The secret is a maintainer action to provision before a
      # release; until then, publication cannot proceed — which is the intended state.
      - name: Private-identifier deny gate — whole tree (PUBLICATION, FAIL-CLOSED)
        env:
          NFTBAN_PRIVACY_DENYLIST: ${{ secrets.NFTBAN_PRIVACY_DENYLIST }}
          NFTBAN_PRIVACY_FP_KEY: ${{ secrets.NFTBAN_PRIVACY_FP_KEY }}
        run: python3 scripts/ci/private-identifier-gate.py --whole-tree --mode publication
      - name: Generic release-surface + whole-tree privacy scan (BLOCKING)
        run: |
          python3 scripts/ci/privacy-scan.py --scope release --strict
          python3 scripts/ci/privacy-scan.py --scope repository --strict
          python3 scripts/ci/privacy-scan-selftest.py
          python3 scripts/ci/private-identifier-gate-selftest.py

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.13`).
          go-version: '1.25.13'

      - name: Build binaries
        run: |
          # ===================================================================
          # v1.229.4 SC-B — +dirty BUILD-STATE DIAGNOSTIC (observation only)
          # ===================================================================
          # Both shipped binaries embed a `+dirty` module version, and the CAUSE IS NOT
          # KNOWN. Three hypotheses were tested by reading and REJECTED: `chmod +x
          # build.sh` is a no-op (already 100755), build.sh's `rm -f go.work` targets an
          # UNTRACKED file, and bin/ is gitignored. The remaining candidates cannot be
          # separated by reading -- they depend on what the runner's tree actually looks
          # like at the instant `go build` runs.
          #
          # ⛔ OBSERVATION ONLY. No fix is attempted here. GO_SC_ITEM5_FIX = NO until the
          #    cause is proven; a speculative fix could change version-stamping semantics.
          #
          # The witness must BIND three things that are otherwise reported separately:
          #     TREE STATE AT THE BUILD INSTANT  +  BUILD COMMAND  +  RESULTING go version -m
          # Captured immediately before the build, not at some earlier convenient point --
          # an earlier snapshot would not describe the state Go actually stamped.
          echo "=== SC-B: tree state at the build instant ==="
          echo "HEAD=$(git rev-parse HEAD)"
          echo "--- git status --porcelain=v1 (empty = clean) ---"
          git status --porcelain=v1 || true
          echo "--- git diff --name-status (unstaged) ---"
          git diff --name-status || true
          echo "--- git diff --cached --name-status (staged) ---"
          git diff --cached --name-status || true
          # ⛔ NAMES AND STATUS ONLY. No content, no environment, no secrets are printed.
          DIRTY_COUNT="$(git status --porcelain=v1 | wc -l | tr -d ' ')"
          echo "SC-B DIRTY_PATH_COUNT=${DIRTY_COUNT}"
          if [ "${DIRTY_COUNT}" -eq 0 ]; then
            echo "SC-B CLASSIFICATION=TREE_CLEAN_AT_BUILD — if the binary still stamps +dirty,"
            echo "                    the cause is the Go/VCS build invocation, not the worktree."
          else
            echo "SC-B CLASSIFICATION=TREE_DIRTY_AT_BUILD — the paths listed above are the producer."
          fi

          echo "=== SC-B: build command ==="
          echo "SC-B BUILD_COMMAND=./build.sh"
          chmod +x build.sh
          ./build.sh
          ls -la bin/

          echo "=== SC-B: resulting binary stamping ==="
          # ⛔ The two shipped binaries use DIFFERENT version forms (nftban-core carries a
          #    pseudo-version, nftband carries v1.229.3). That asymmetry is unexplained and
          #    is part of what this witness must answer.
          for b in bin/nftban-core bin/nftband; do
            if [ -f "$b" ]; then
              echo "--- $b ---"
              go version -m "$b" 2>/dev/null | head -4 || true
            fi
          done
          echo "=== SC-B: post-build tree state (did the build itself dirty the tree?) ==="
          git status --porcelain=v1 || true

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          - distro: el10
            container: almalinux:10
            name_suffix: el10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            set -e  # Exit on any error

            # Install build dependencies (curl required for yq download)
            # v1.147: selinux-policy-devel needed to compile the nftban SELinux .pp (spec BuildRequires)
            # v1.221.1: jq is a mandatory Mode-3 (--use-prebuilt) manifest-verification
            #   dependency; file is used by the DEB/RPM parity checks. Mirrors the
            #   proven prerequisites in build-packages.yml (which already runs Mode 3).
            dnf -y install --allowerasing rpm-build rpmdevtools tar gzip systemd-rpm-macros make curl selinux-policy-devel jq file

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            # v1.221.1 hotfix: explicit Mode-3 verified-prebuilt — package the binaries
            # built once by the build-binaries job (downloaded into /workspace/bin).
            # Build-hygiene (#1108) made source-mode the default (Go required) and these
            # containers have no Go; bare 'build_nftban.sh rpm' fails closed. Mirrors
            # build-packages.yml. Never install Go here (would lose by-construction parity).
            ./build_nftban.sh rpm --use-prebuilt --prebuilt-manifest /workspace/bin/build-manifest.json || { echo '❌ RPM build failed!'; exit 1; }

            # Verify RPM was created
            if ! ls /workspace/build/packages/RPMS/*/*.rpm 2>/dev/null; then
              echo '❌ No RPM files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          echo "=== Looking for RPM files ==="
          find build -name "*.rpm" -type f 2>/dev/null || echo "No RPM files found"

          RPM_FOUND=0
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Found RPM: $rpm"
              cp "$rpm" "dist/packages/nftban-${{ matrix.name_suffix }}-x86_64.rpm"
              RPM_FOUND=1
            fi
          done

          if [[ $RPM_FOUND -eq 0 ]]; then
            echo "❌ FATAL: No RPM files found in build/packages/RPMS/"
            echo "Build directory contents:"
            ls -laR build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi

          echo "=== dist/packages contents ==="
          ls -la dist/packages/

      # Install rpm2cpio for validation (not available on Ubuntu by default)
      - name: Install rpm2cpio
        run: sudo apt-get update && sudo apt-get install -y rpm2cpio cpio

      # CRITICAL: Validate packaged binaries match source binaries
      # This prevents stale/cached binaries from being packaged
      - name: Validate RPM contains correct binaries
        run: |
          echo "=== Validating RPM binary integrity ==="
          RPM_FILE="dist/packages/nftban-${{ matrix.name_suffix }}-x86_64.rpm"

          if [[ ! -f "$RPM_FILE" ]]; then
            echo "❌ FATAL: RPM file not found: $RPM_FILE"
            exit 1
          fi

          # Extract binaries from RPM
          mkdir -p /tmp/rpm-check
          cd /tmp/rpm-check
          rpm2cpio "$GITHUB_WORKSPACE/$RPM_FILE" | cpio -idm 2>/dev/null || {
            echo "❌ FATAL: Failed to extract RPM"
            exit 1
          }

          # Compare hashes with source binaries
          for binary in nftband nftban-core; do
            SOURCE_HASH=$(sha256sum "$GITHUB_WORKSPACE/bin/$binary" | cut -d' ' -f1)
            PKG_HASH=$(sha256sum "./usr/lib/nftban/bin/$binary" | cut -d' ' -f1)

            echo "Checking $binary:"
            echo "  Source: $SOURCE_HASH"
            echo "  Package: $PKG_HASH"

            if [[ "$SOURCE_HASH" != "$PKG_HASH" ]]; then
              echo "❌ FATAL: $binary hash mismatch in ${{ matrix.name_suffix }} RPM!"
              echo "The packaged binary does not match the freshly built binary."
              echo "This indicates stale binaries were packaged."
              exit 1
            fi
            echo "  ✓ Hash matches"
          done

          echo "✅ All RPM binaries validated successfully"
          rm -rf /tmp/rpm-check

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: ubuntu26.04
            container: ubuntu:26.04
            name_suffix: ubuntu26.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12
          - distro: debian13
            container: debian:trixie
            name_suffix: debian13

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -e BUILD_DISTRO=${{ matrix.name_suffix }} -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            set -e  # Exit on any error

            # Install build dependencies (with retry for transient mirror issues)
            # v1.221.1: jq is a mandatory Mode-3 (--use-prebuilt) manifest-verification
            #   dependency. Mirrors build-packages.yml (which already runs Mode 3).
            for i in 1 2 3; do
              apt-get update && apt-get install -y dpkg-dev build-essential file curl jq && break
              echo \"Retry \$i: apt-get failed, retrying in 5s...\"
              sleep 5
            done

            # Build DEB (BUILD_DISTRO passed from CI for distro validation in preinst)
            chmod +x packaging/build_nftban.sh
            cd packaging
            # v1.221.1 hotfix: explicit Mode-3 verified-prebuilt (see RPM job note above).
            ./build_nftban.sh deb --use-prebuilt --prebuilt-manifest /workspace/bin/build-manifest.json || { echo '❌ DEB build failed!'; exit 1; }

            # Verify DEB was created
            if ! ls /workspace/build/packages/*.deb 2>/dev/null; then
              echo '❌ No DEB files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          DEB_FOUND=0
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Found DEB: $deb"
              cp "$deb" "dist/packages/nftban-${{ matrix.name_suffix }}-amd64.deb"
              DEB_FOUND=1
            fi
          done

          if [[ $DEB_FOUND -eq 0 ]]; then
            echo "❌ FATAL: No DEB files found in build/packages/"
            ls -laR build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi

          ls -la dist/packages/

      # CRITICAL: Validate packaged binaries match source binaries
      - name: Validate DEB contains correct binaries
        run: |
          echo "=== Validating DEB binary integrity ==="
          DEB_FILE="dist/packages/nftban-${{ matrix.name_suffix }}-amd64.deb"

          # Extract binaries from DEB
          mkdir -p /tmp/deb-check
          dpkg-deb -x "$DEB_FILE" /tmp/deb-check

          # Compare hashes with source binaries
          for binary in nftband nftban-core; do
            SOURCE_HASH=$(sha256sum "bin/$binary" | cut -d' ' -f1)
            PKG_HASH=$(sha256sum "/tmp/deb-check/usr/lib/nftban/bin/$binary" | cut -d' ' -f1)

            echo "Checking $binary:"
            echo "  Source: $SOURCE_HASH"
            echo "  Package: $PKG_HASH"

            if [[ "$SOURCE_HASH" != "$PKG_HASH" ]]; then
              echo "❌ FATAL: $binary hash mismatch in ${{ matrix.name_suffix }} DEB!"
              echo "The packaged binary does not match the freshly built binary."
              exit 1
            fi
            echo "  ✓ Hash matches"
          done

          echo "✅ All DEB binaries validated successfully"
          rm -rf /tmp/deb-check

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

  # ==========================================================================
  # CREATE RELEASE
  # ==========================================================================
  # ==========================================================================
  # v1.229.4 R2 — the SLSA builder is now a JOB HERE, not a separate workflow
  # ==========================================================================
  # It used to live in slsa-go-releaser.yml, triggered `on: workflow_run` AFTER this
  # workflow completed — which is precisely why nftban-core did not exist when the
  # checksum authority finalized SHA256SUMS, and why the release was already PUBLIC
  # before its provenance was verified.
  #
  # ⛔ upload-assets: false IS LOAD-BEARING AND MUST STAY EXPLICIT.
  #    The pinned builder declares `upload-assets` with DEFAULT TRUE, and its upload job
  #    fires on  inputs.upload-assets && (startsWith(github.ref,'refs/tags/') || ...).
  #    On a tag push it therefore uploads to the release EVEN WITH upload-tag-name empty.
  #    OMITTING THIS INPUT RE-ENABLES A THIRD-PARTY PUBLISHER. Absence is the unsafe state.
  #      THIRD_PARTY_RELEASE_UPLOAD_CAPABILITY = OFF
  #    is the invariant; removing upload-tag-name alone does NOT achieve it.
  #
  # The binary and its provenance are still produced: the builder's `build-dry` and
  # `provenance` jobs are UNGUARDED by upload-assets, and expose go-binary-name /
  # go-provenance-name as workflow artifacts. Only the terminal upload job is gated.
  build-nftban-core:
    name: Build nftban-core (SLSA3)
    needs: [build-binaries]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.13`) so the SLSA builder
      # selects the same toolchain patch. GOTOOLCHAIN cannot be injected into a
      # third-party reusable workflow, so it is left to the builder.
      go-version: "1.25.13"
      config-file: .github/slsa/nftban-core.yml
      evaluated-envs: "VERSION:${{ github.ref_name }}"
      # ⛔ DO NOT REMOVE. See the block above: absent == true == third-party publisher ON.
      upload-assets: false

  create-release:
    name: Create GitHub Release
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/edit GitHub Releases
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # v1.227.1 PR-H1: full history + tags are required by the repository
          # authority gate below (epoch ancestry and tag parity cannot be
          # evaluated in a shallow, tagless checkout).
          fetch-depth: 0
          fetch-tags: true

      # v1.227.1 PR-H1: never publish from a repository that is not the canonical
      # authority. A release assembled from a wrong-epoch object store would ship
      # artifacts built from pre-rewrite sources, including scrubbed private data.
      # This runs BEFORE assembly verification: authority first, contents second.
      - name: Verify repository authority and history epoch
        run: ./scripts/ci/check-repo-authority.sh --mode ci

      # v1.221.1: resolve the release version from the tag on a real publish, or from
      # the VERSION file on a manual dry-run (no tag). REF is v-prefixed, VER is not.
      # Exported to the job env so downstream steps work identically on both paths.
      - name: Resolve release version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          else
            REF="v$(cat VERSION)"
          fi
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "VER=${REF#v}" >> "$GITHUB_ENV"
          echo "Resolved release version: REF=$REF VER=${REF#v}"

      - name: Validate VERSION file matches git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match git tag (v$TAG_VERSION). Update the VERSION file before tagging a release."
            exit 1
          fi
          echo "VERSION file ($FILE_VERSION) matches git tag (v$TAG_VERSION)"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/
          # Continue even if some artifacts are missing (build failures)
          # The consolidate step will report what's actually available
          merge-multiple: true

      - name: Consolidate packages
        run: |
          mkdir -p dist/packages dist/binaries

          # Copy all RPM packages
          find all-packages -name "*.rpm" -exec cp {} dist/packages/ \;

          # Copy all DEB packages
          find all-packages -name "*.deb" -exec cp {} dist/packages/ \;

          # Copy raw Go binaries that SLSA can't build (require CGO)
          # NOTE: nftban-core is built by SLSA workflow with provenance.
          if [ -d "all-packages" ]; then
            for binary in nftband; do
              if [ -f "all-packages/${binary}" ]; then
                cp "all-packages/${binary}" "dist/packages/${binary}-linux-amd64"
                chmod +x "dist/packages/${binary}-linux-amd64"
              fi
            done
          fi

          echo "=== All packages ==="
          ls -lh dist/packages/

      # A1: this step DELETES assets from the release named by $REF. It had no
      # guard, and on a workflow_dispatch $REF resolves from the VERSION file — so
      # once a release for the current VERSION exists, a publish=false "dry run"
      # would delete that live release's assets. The v1.228.12 dry run only
      # no-op'd because the release did not exist yet: TIMING, NOT A GUARD.
      # Same condition as the publish steps below.
      #   DRY_RUN MUST NOT MUTATE A PUBLISHED RELEASE
      - name: Clean up old release assets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$REF"

          # CRITICAL FIX: Delete ALL existing assets that we're about to upload
          # This ensures re-runs of the workflow always upload fresh binaries
          # Without this, softprops/action-gh-release silently skips existing files
          ASSETS_TO_REPLACE=(
            "nftban-el9-x86_64.rpm"
            "nftban-el10-x86_64.rpm"
            "nftban-ubuntu22.04-amd64.deb"
            "nftban-ubuntu24.04-amd64.deb"
            "nftban-ubuntu26.04-amd64.deb"
            "nftban-debian12-amd64.deb"
            "nftban-debian13-amd64.deb"
            "nftband-linux-amd64"
            "SHA256SUMS"
            "SHA256SUMS.build"
            "MANIFEST.txt"
            "VERIFY.txt"
            "sbom.spdx.json"
          )

          echo "Deleting existing assets to ensure fresh upload..."
          for asset in "${ASSETS_TO_REPLACE[@]}"; do
            echo "  Deleting: $asset"
            gh release delete-asset "$VERSION" "$asset" --yes 2>/dev/null || true
          done

          # Also clean up unexpected assets
          EXPECTED_PACKAGES=(
            "${ASSETS_TO_REPLACE[@]}"
            "RELEASE_NOTES.md"
            "nftban-core-linux-amd64"
            "nftban-core-linux-amd64.intoto.jsonl"
          )

          CURRENT_ASSETS=$(gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in $CURRENT_ASSETS; do
            if [[ ! " ${EXPECTED_PACKAGES[*]} " =~ " ${asset} " ]]; then
              echo "Removing unexpected asset: $asset"
              gh release delete-asset "$VERSION" "$asset" --yes || true
            fi
          done

      - name: Generate SHA256SUMS.build (local ground truth)
        # SHA256SUMS.build = checksums of LOCAL build artifacts BEFORE upload
        # This is the ground truth that verify-release will compare against
        # to detect upload corruption or GitHub asset reprocessing issues
        run: |
          cd dist/packages
          rm -f SHA256SUMS SHA256SUMS.build

          # Generate checksums for all packages and binaries
          shopt -s nullglob
          packages=(*.rpm *.deb)
          binaries=(nftban-core-linux-amd64 nftband-linux-amd64)

          # Combine all files that exist
          all_files=()
          for f in "${packages[@]}" "${binaries[@]}"; do
            [[ -f "$f" ]] && all_files+=("$f")
          done

          if [ ${#all_files[@]} -gt 0 ]; then
            sha256sum "${all_files[@]}" | sort > SHA256SUMS.build
            echo "=== SHA256SUMS.build (local ground truth) ==="
            cat SHA256SUMS.build
            echo ""
            echo "Files checksummed: ${#all_files[@]}"
          else
            echo "::error::No packages or binaries found for checksum generation"
            exit 1
          fi

      - name: Generate MANIFEST.txt
        run: |
          cd dist/packages
          VERSION="$REF"

          cat > MANIFEST.txt << MANIFEST_EOF
          NFTBan ${VERSION} - Release Artifacts
          ===================================

          RPM Packages (EL Family):
            nftban-el9-x86_64.rpm      Rocky / Alma / RHEL / CentOS Stream 9
            nftban-el10-x86_64.rpm     Rocky / Alma / RHEL / CentOS Stream 10

          DEB Packages (Ubuntu + Debian):
            nftban-ubuntu24.04-amd64.deb   Ubuntu 24.04 (Noble) - Tier 0
            nftban-ubuntu26.04-amd64.deb   Ubuntu 26.04 (Resolute) - Tier 0
            nftban-debian12-amd64.deb      Debian 12 (Bookworm) - Tier 0
            nftban-debian13-amd64.deb      Debian 13 (Trixie) - Tier 1
            nftban-ubuntu22.04-amd64.deb   Ubuntu 22.04 (Jammy) - Tier 2

          Package Sizes:
          MANIFEST_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' MANIFEST.txt

          for file in *.rpm *.deb; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              printf "  %-35s %12d bytes\n" "$file" "$size" >> MANIFEST.txt
            fi
          done

          echo "=== MANIFEST.txt ==="
          cat MANIFEST.txt

      - name: Create VERIFY.txt
        run: |
          cd dist/packages
          VERSION="$REF"

          cat > VERIFY.txt << 'VERIFY_EOF'
          NFTBan - Package Verification & Installation Guide
          ===================================================

          1. Download the package for your distribution:

             # Rocky / Alma / RHEL / CentOS Stream 9
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el9-x86_64.rpm

             # Rocky / Alma / RHEL / CentOS Stream 10
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el10-x86_64.rpm

             # Ubuntu 24.04 (Noble) - Tier 0
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu24.04-amd64.deb

             # Ubuntu 26.04 (Resolute) - Tier 0
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu26.04-amd64.deb

             # Debian 12 (Bookworm) - Tier 0
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-debian12-amd64.deb

             # Debian 13 (Trixie) - Tier 1
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-debian13-amd64.deb

             # Ubuntu 22.04 (Jammy) - Tier 2
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu22.04-amd64.deb

          2. Verify package integrity:

             wget https://github.com/itcmsgr/nftban/releases/latest/download/SHA256SUMS

             # Verify the file you downloaded, BY NAME.
             # --ignore-missing skips entries for files you did not download, so on its
             # own it cannot tell you whether YOUR file was covered at all: verifying
             # nothing and verifying successfully look identical.
             grep " nftban-<distro>-<arch>.<ext>$" SHA256SUMS | sha256sum -c -

             # If that prints no line, your file has NO published checksum.
             # That is NOT a pass. Do not install it; report it instead.

             # Only after the per-file check above confirms coverage exists:
             sha256sum -c SHA256SUMS --ignore-missing

          2b. Verify the RELEASE POPULATION is complete (not just your file):

             # v1.229.4 published a SHA256SUMS listing nftban-core-linux-amd64 while that
             # file was absent from the release. --ignore-missing skips absent entries, so
             # the command above reports success for a release that is missing an artifact
             # it claims to cover. Coverage of YOUR file is not completeness of the RELEASE.
             #
             # This lists every file SHA256SUMS claims but that you do not have. If you
             # downloaded the whole release and any line appears, the release is incomplete:

             while read -r _ f; do [ -e "$f" ] || echo "MISSING FROM RELEASE: $f"; done < SHA256SUMS

             # No output = every claimed artifact is present.
             # Any output = do not treat this release as complete; report it.

          3. Install package:

             # Rocky / Alma / RHEL
             sudo dnf install -y nftban-<distro>-x86_64.rpm

             # Ubuntu / Debian (apt-get update required on fresh servers)
             sudo apt-get update
             sudo apt-get install -y ./nftban-<distro>-amd64.deb

          4. Enable and verify:

             sudo nftban enable
             nftban --version
             nftban health summary

          Documentation: https://github.com/itcmsgr/nftban#readme
          VERIFY_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' VERIFY.txt

      # v1.157 PR-D: pre-download + cache syft via the sbom-action's own
      # download-syft sub-action (same pinned SHA) BEFORE the SBOM step. The
      # SBOM step then reuses the cached binary instead of fetching syft fresh
      # from github.com, which intermittently returned HTTP 504 and hard-failed
      # the release. syft-version is pinned to the action's current default so
      # the SBOM output is unchanged.
      - name: Pre-download + cache syft (SBOM tool)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3

      # ⛔ SBOM SUBJECT POPULATION == SHIPPED RELEASE ASSETS.
      #    `path: .` scans the WHOLE WORKSPACE. Before v1.229.4 that happened to be
      #    harmless: the SLSA builder lived in a separate workflow, so its artifacts
      #    were never here. R2 made the builder a job of THIS workflow, and
      #    "Download all artifacts" pulls every artifact into all-packages/ — including
      #    slsa-builder-go-linux-amd64. The published v1.229.4 SBOM therefore inventoried
      #    a BUILD TOOL as release content, and attributed a go1.23.1 stdlib to a release
      #    built with 1.25.13:
      #
      #        v1.229.3   202 packages   0 slsa-builder refs   stdlib go1.25.12
      #        v1.229.4   415 packages   1 slsa-builder ref    stdlib go1.23.1 + go1.25.13
      #
      #    ⛔ The defect is SUBJECT SELECTION, not the presence of a version string.
      #       Filtering "go1.23.1" out afterwards, or excluding the builder by name, would
      #       treat the symptom and leave the next build tool to reappear silently.
      #       dist/packages/ is the assembled shipped payload — scan exactly that.
      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/packages
          format: spdx-json
          output-file: dist/packages/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          # v1.157 PR-D: pin syft to the pre-cached version so the step reuses
          # the cached binary (no fresh github.com download / HTTP 504).
          syft-version: v1.42.3

      # v1.19.0: Validate SBOM is valid SPDX JSON (R26)
      - name: Validate SBOM
        run: |
          # ===================================================================
          # v1.229.4 VAF-0 Stage 3A — EVIDENCE_MANUFACTURED (G4)
          # ===================================================================
          # THE DEFECT THIS REPLACES. When the authoritative producer
          # (anchore/sbom-action) did not emit dist/packages/sbom.spdx.json, this step
          # FABRICATED a one-package substitute and then "validated" it:
          #
          #     if [ ! -f "$SBOM" ]; then
          #       echo "::warning::SBOM file not generated by action, creating minimal SBOM"
          #       cat > "$SBOM" <<SBOM_EOF   ...   SBOM_EOF     # <-- manufactured evidence
          #     fi
          #     python3 -c "assert 'spdxVersion' in sbom; assert 'packages' in sbom"
          #
          # The check then asserted only the two fields the stub supplied BY CONSTRUCTION,
          # so it always passed — and the substitute was published as the release SBOM.
          # ⛔ Worse, the stub declared  "creators": ["Tool: anchore/sbom-action"]  —
          #    fabricated evidence IMPERSONATING the producer that had just failed.
          #
          #     PRODUCER FAILURE / SUBJECT ABSENCE
          #     != AUTHORITY TO MANUFACTURE OBSERVATION EVIDENCE
          #
          # ⛔ This step no longer writes sbom.spdx.json under ANY condition. It is a
          #    validator; only the authoritative producer may create the artifact.
          set -uo pipefail
          SBOM="dist/packages/sbom.spdx.json"
          echo "Validating SBOM (validator only — this step never creates the artifact)..."

          if [ ! -f "$SBOM" ]; then
            echo "::error title=SBOM absent::The authoritative producer (anchore/sbom-action) did not emit ${SBOM}. ⛔ A MISSING SBOM IS NOT AN EMPTY SBOM, and this step will NOT synthesize a substitute — a fabricated SBOM would be published as if the producer had succeeded."
            exit 1
          fi
          if [ ! -s "$SBOM" ]; then
            echo "::error title=SBOM empty::${SBOM} exists but is zero bytes. The producer did not complete a valid observation."
            exit 1
          fi

          # ⛔ A MALFORMED AUTHORITATIVE ARTIFACT MUST NOT BE OVERWRITTEN WITH A VALID-LOOKING
          #    ONE. Report it; never repair it.
          # ⛔ CAPTURE AND CONSUME THE VALIDATOR'S STATUS. `set -e` is deliberately NOT
          #    used here, so a failing python3 would otherwise print its error and let the
          #    step fall through to a success message — the very failure-swallow class
          #    (G1) this Stage repairs. An earlier revision of THIS FIX did exactly that.
          set +e
          python3 - "$SBOM" <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              with open(path) as f:
                  sbom = json.load(f)
          except Exception as e:
              print("::error title=SBOM not parseable::%s is not valid JSON (%s). "
                    "An unparseable artifact is NOT an empty one, and it will NOT be replaced." % (path, e))
              sys.exit(1)
          missing = [k for k in ("spdxVersion", "packages") if k not in sbom]
          if missing:
              print("::error title=SBOM structurally invalid::%s is missing required field(s): %s"
                    % (path, ", ".join(missing)))
              sys.exit(1)
          pkgs = sbom.get("packages") or []
          if not isinstance(pkgs, list) or len(pkgs) == 0:
              print("::error title=SBOM has no packages::%s declares zero packages. "
                    "A zero-package SBOM is not evidence about this release." % path)
              sys.exit(1)
          print("SBOM valid: %s, %d packages" % (sbom["spdxVersion"], len(pkgs)))
          PY
          SBOM_RC=$?
          set -e
          if [ "$SBOM_RC" -ne 0 ]; then
            echo "::error title=SBOM validation failed::The authoritative SBOM did not satisfy validation (rc=${SBOM_RC}). ⛔ No substitute was created."
            exit 1
          fi
          echo "SBOM validation passed (authoritative artifact, not synthesized)"
      - name: Extract release notes
        run: |
          VERSION="$REF"

          if [ -f "CHANGELOG.md" ]; then
            awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | \
              sed '/^## \[/d' | head -n -1 > dist/packages/RELEASE_NOTES.md || \
              echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          else
            echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          fi

          # Add package list to release notes
          cat >> dist/packages/RELEASE_NOTES.md << 'NOTES_EOF'

          ## Available Packages

          ### RPM (x86_64)
          | Distribution | Package | Tier |
          |--------------|---------|------|
          | Rocky / Alma / RHEL 9 | `nftban-el9-x86_64.rpm` | Tier 0 |
          | Rocky / Alma / RHEL 10 | `nftban-el10-x86_64.rpm` | Tier 1 |

          ### DEB (amd64)
          | Distribution | Package | Tier |
          |--------------|---------|------|
          | Ubuntu 24.04 (Noble) | `nftban-ubuntu24.04-amd64.deb` | Tier 0 |
          | Ubuntu 26.04 (Resolute) | `nftban-ubuntu26.04-amd64.deb` | Tier 0 |
          | Debian 12 (Bookworm) | `nftban-debian12-amd64.deb` | Tier 0 |
          | Debian 13 (Trixie) | `nftban-debian13-amd64.deb` | Tier 1 |
          | Ubuntu 22.04 (Jammy) | `nftban-ubuntu22.04-amd64.deb` | Tier 2 |
          NOTES_EOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' dist/packages/RELEASE_NOTES.md

          echo "=== RELEASE_NOTES.md ==="
          cat dist/packages/RELEASE_NOTES.md

      # v1.221.1: assert the assembled release directory (runs on every path; the
      # authoritative dry-run evidence). Proves 7 packages + binary + supply-chain
      # files exist and that the DEB and RPM package byte-identical daemons.
      - name: Verify assembled release directory
        # Verifies the PRE-SLSA asset set that this workflow (Release Packages) owns.
        # nftban-core-linux-amd64 + its .intoto.jsonl are produced by the DOWNSTREAM
        # SLSA workflow (gated on a successful Release Packages run) and are NOT
        # expected here. The final SHA256SUMS is produced by verify-release at publish;
        # on a dry-run we compute it over the checksummable assets to prove the set is
        # complete and checksummable. (v1.221.1)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          # v1.221.2: delegate ALL assembly verification to one shared, mode-aware,
          # explicitly-exiting script invoked identically on BOTH the dry-run and the
          # tag-push paths. This removes the v1.221.1 push-path regression where the
          # inline step's trailing bare "test && echo" conditional returned non-zero
          # on a real tag push and failed the step. The script computes the
          # mode-specific expected counts (push=12, dry-run=13) and never publishes.
          sudo apt-get update && sudo apt-get install -y rpm2cpio cpio >/dev/null 2>&1 || true
          MODE=push
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH" != "true" ]; then MODE=dry-run; fi
          echo "verify mode resolved: EVENT=$EVENT_NAME PUBLISH=${PUBLISH:-} -> MODE=$MODE"
          chmod +x scripts/ci/verify-release-assembly.sh
          scripts/ci/verify-release-assembly.sh --mode "$MODE" --dist-dir dist/packages --expect-commit "$EXPECT_COMMIT"

      - name: Upload assembled release directory (artifact, for dry-run inspection)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-dist
          path: dist/packages/
          retention-days: 3

      - name: Upload packages to DRAFT GitHub Release
        # v1.221.1: skipped on a manual dry-run (publish=false) — the assembly above
        # still runs and is verified below; only the GitHub upload is withheld.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        # INTEGRITY ARCHITECTURE (v1.21.5):
        # - Upload as DRAFT so no user sees unverified assets
        # - Include SHA256SUMS.build as ground truth reference
        # - verify-release job will: download with retry, verify checksums,
        #   generate final SHA256SUMS, then publish the release
        # NOTE: nftban-core is uploaded by SLSA workflow with provenance.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/packages/*.rpm
            dist/packages/*.deb
            dist/packages/nftband-linux-amd64
            dist/packages/SHA256SUMS.build
            dist/packages/MANIFEST.txt
            dist/packages/VERIFY.txt
            dist/packages/sbom.spdx.json
          body_path: dist/packages/RELEASE_NOTES.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # VERIFY & PUBLISH RELEASE (Dual-Checksum Integrity Gate)
  # ==========================================================================
  # This job is the ONLY path to publishing a release. It:
  #   1. Downloads all assets from the DRAFT release (with retry loop)
  #   2. Verifies downloaded checksums match SHA256SUMS.build (upload integrity)
  #   3. Extracts and verifies binaries inside RPM/DEB packages (binary integrity)
  #   4. Generates final SHA256SUMS from downloaded assets (what users will verify)
  #   5. Uploads SHA256SUMS and publishes the release (draft=false)
  #
  # If ANY check fails, the release stays as DRAFT and is never exposed to users.
  verify-release:
    name: Verify & Publish Release
    needs: [create-release, build-nftban-core]
    # v1.221.1: this job downloads + verifies + PUBLISHES the draft release. On a
    # manual dry-run (workflow_dispatch, publish=false) no release exists, so the
    # whole job is skipped. Tag push always runs it.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload SHA256SUMS and publish (edit draft)
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # ⛔ WORKSPACE PRECONDITION. This job's claim-bearing steps READ repo-resident
          #    declarations, so a checkout that omits them leaves the step unable to run at
          #    all. The v1.229.4 first tag attempt failed here — unpublished — because the
          #    workspace contained only VERSION:
          #        Verify SLSA Provenance -> scripts/ci/data/slsa-subjects.tsv
          #        PR-D binary witness    -> scripts/ci/data/release-binary-witness-subjects.tsv
          #        Gate 3 SHA256SUMS      -> scripts/ci/data/release-binary-witness-subjects.tsv
          #    STEP LOGIC VALID != STEP INPUT REACHABLE. Each declaration was correct; none
          #    was in the workspace, and no PR could observe it because this job only runs
          #    on a tag.
          #
          #    ⛔ Deliberately EXPLICIT rather than a full checkout. This job downloads the
          #    PUBLISHED assets and verifies those; the narrower its view of the repository,
          #    the less it can accidentally verify against a source tree instead of against
          #    what actually shipped. Adding a repo-resident input to this job REQUIRES
          #    adding it here — check-verify-release-workspace.sh fails the build otherwise.
          sparse-checkout: |
            VERSION
            go.mod
            scripts/ci/data/slsa-subjects.tsv
            scripts/ci/data/release-binary-witness-subjects.tsv
          sparse-checkout-cone-mode: false

      # v1.221.1: resolve REF/VER in THIS job (job-scoped env from create-release
      # does not carry over). Tag push → from tag; (dry-run never reaches here).
      - name: Resolve release version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          else
            REF="v$(cat VERSION)"
          fi
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "VER=${REF#v}" >> "$GITHUB_ENV"

      - name: Install extraction tools
        run: sudo apt-get update && sudo apt-get install -y rpm2cpio cpio

      - name: Download all release assets (with retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$REF"
          echo "=== Downloading assets for $VERSION ==="

          mkdir -p /tmp/release-verify
          cd /tmp/release-verify

          # Expected release assets (explicit list — no glob guessing)
          EXPECTED_ASSETS=(
            "nftban-el9-x86_64.rpm"
            "nftban-el10-x86_64.rpm"
            "nftban-debian12-amd64.deb"
            "nftban-debian13-amd64.deb"
            "nftban-ubuntu22.04-amd64.deb"
            "nftban-ubuntu24.04-amd64.deb"
            "nftban-ubuntu26.04-amd64.deb"
            "nftband-linux-amd64"
            "SHA256SUMS.build"
          )

          # Retry loop: GitHub may not make draft assets available immediately
          MAX_ATTEMPTS=8
          RETRY_DELAY=15

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "--- Download attempt $attempt/$MAX_ATTEMPTS ---"
            ALL_FOUND=true
            MISSING=()

            for asset in "${EXPECTED_ASSETS[@]}"; do
              if [ -f "$asset" ]; then
                continue  # Already downloaded
              fi

              cd "$GITHUB_WORKSPACE"
              gh release download "$VERSION" -p "$asset" -D /tmp/release-verify --clobber 2>/dev/null || {
                ALL_FOUND=false
                MISSING+=("$asset")
                continue
              }
              echo "  Downloaded: $asset"
            done

            if $ALL_FOUND; then
              echo ""
              echo "All ${#EXPECTED_ASSETS[@]} assets downloaded successfully on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo ""
              echo "::error::Failed to download all assets after $MAX_ATTEMPTS attempts"
              echo "Missing assets: ${MISSING[*]}"
              # All listed assets are required after v1.100.1b.A (no optional UI binaries left).
              REQUIRED_MISSING="${#MISSING[@]}"
              for m in "${MISSING[@]}"; do
                echo "  FATAL: $m is required!"
              done
              if [ "$REQUIRED_MISSING" -gt 0 ]; then
                exit 1
              fi
              break
            fi

            echo "  Missing ${#MISSING[@]} assets, retrying in ${RETRY_DELAY}s..."
            sleep "$RETRY_DELAY"
          done

          # Also try SLSA-built binaries (optional — uploaded by separate workflow)
          cd "$GITHUB_WORKSPACE"
          for slsa_asset in "nftban-core-linux-amd64"; do
            gh release download "$VERSION" -p "$slsa_asset" -D /tmp/release-verify --clobber 2>/dev/null && \
              echo "Downloaded SLSA asset: $slsa_asset" || true
          done

          echo ""
          echo "=== Downloaded files ==="
          ls -lh /tmp/release-verify/

      - name: "Gate 1: Verify downloads match build checksums (upload integrity)"
        run: |
          echo "=== GATE 1: Upload Integrity Check ==="
          echo "Comparing downloaded assets against SHA256SUMS.build (local ground truth)"
          echo ""

          cd /tmp/release-verify

          if [ ! -f "SHA256SUMS.build" ]; then
            echo "::error::SHA256SUMS.build not found in release assets!"
            echo "The build ground truth manifest is missing — cannot verify upload integrity."
            exit 1
          fi

          echo "--- SHA256SUMS.build contents ---"
          cat SHA256SUMS.build
          echo ""

          # Verify every file listed in SHA256SUMS.build
          GATE1_FAILURES=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            EXPECTED_HASH=$(echo "$line" | awk '{print $1}')
            LISTED_FILE=$(echo "$line" | awk '{print $2}')
            [ -z "$LISTED_FILE" ] && continue

            if [ ! -f "$LISTED_FILE" ]; then
              echo "::error::$LISTED_FILE: listed in SHA256SUMS.build but not downloaded"
              GATE1_FAILURES=$((GATE1_FAILURES + 1))
              continue
            fi

            ACTUAL_HASH=$(sha256sum "$LISTED_FILE" | cut -d' ' -f1)
            if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
              echo "::error::$LISTED_FILE: UPLOAD CORRUPTION DETECTED"
              echo "  Build hash:     $EXPECTED_HASH"
              echo "  Downloaded hash: $ACTUAL_HASH"
              GATE1_FAILURES=$((GATE1_FAILURES + 1))
            else
              echo "  $LISTED_FILE: build == download"
            fi
          done < SHA256SUMS.build

          if [ "$GATE1_FAILURES" -gt 0 ]; then
            echo ""
            echo "::error::GATE 1 FAILED: $GATE1_FAILURES upload integrity failures!"
            echo "Downloaded assets do not match build artifacts."
            echo "Release will NOT be published."
            exit 1
          fi

          echo ""
          echo "GATE 1 PASSED: All downloaded assets match build checksums"

      - name: "Gate 2: Verify binary integrity inside packages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$REF"
          REPO_DIR="$GITHUB_WORKSPACE"
          echo "=== GATE 2: Binary Integrity Check ==="
          echo "Verifying nftband binary inside each RPM/DEB matches standalone binary"
          echo ""

          cd /tmp/release-verify

          # Reference: standalone binary
          if [ ! -f "nftband-linux-amd64" ]; then
            echo "::error::nftband-linux-amd64 not found — cannot verify packages"
            exit 1
          fi
          REFERENCE_HASH=$(sha256sum nftband-linux-amd64 | cut -d' ' -f1)
          REFERENCE_SIZE=$(stat -c%s nftband-linux-amd64)
          echo "Reference nftband: $REFERENCE_SIZE bytes, hash: $REFERENCE_HASH"

          check_package() {
            local pkg_name="$1"
            local extract_cmd="$2"

            echo ""
            echo "--- Checking $pkg_name ---"

            if [ ! -f "$pkg_name" ]; then
              echo "::error::$pkg_name not found in downloads"
              return 1
            fi

            rm -rf /tmp/extract && mkdir -p /tmp/extract
            cd /tmp/extract
            eval "$extract_cmd"

            if [[ -f "./usr/lib/nftban/bin/nftband" ]]; then
              PKG_HASH=$(sha256sum ./usr/lib/nftban/bin/nftband | cut -d' ' -f1)
              PKG_SIZE=$(stat -c%s ./usr/lib/nftban/bin/nftband)
              echo "Package nftband: $PKG_SIZE bytes, hash: $PKG_HASH"

              if [[ "$PKG_HASH" != "$REFERENCE_HASH" ]]; then
                echo "::error::FATAL: Hash mismatch in $pkg_name!"
                echo "Expected: $REFERENCE_HASH"
                echo "Got:      $PKG_HASH"
                cd /tmp/release-verify
                return 1
              fi
              echo "  $pkg_name: binary verified"
            else
              echo "::error::nftband not found inside $pkg_name"
              cd /tmp/release-verify
              return 1
            fi

            cd /tmp/release-verify
          }

          GATE2_FAILURES=0

          # Check all RPMs
          check_package "nftban-el9-x86_64.rpm" \
            "rpm2cpio /tmp/release-verify/nftban-el9-x86_64.rpm | cpio -idm 2>/dev/null" || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          check_package "nftban-el10-x86_64.rpm" \
            "rpm2cpio /tmp/release-verify/nftban-el10-x86_64.rpm | cpio -idm 2>/dev/null" || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          # Check all DEBs
          check_package "nftban-debian12-amd64.deb" \
            "dpkg-deb -x /tmp/release-verify/nftban-debian12-amd64.deb ." || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          check_package "nftban-debian13-amd64.deb" \
            "dpkg-deb -x /tmp/release-verify/nftban-debian13-amd64.deb ." || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          check_package "nftban-ubuntu22.04-amd64.deb" \
            "dpkg-deb -x /tmp/release-verify/nftban-ubuntu22.04-amd64.deb ." || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          check_package "nftban-ubuntu24.04-amd64.deb" \
            "dpkg-deb -x /tmp/release-verify/nftban-ubuntu24.04-amd64.deb ." || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          check_package "nftban-ubuntu26.04-amd64.deb" \
            "dpkg-deb -x /tmp/release-verify/nftban-ubuntu26.04-amd64.deb ." || \
            GATE2_FAILURES=$((GATE2_FAILURES + 1))

          rm -rf /tmp/extract

          if [ "$GATE2_FAILURES" -gt 0 ]; then
            echo ""
            echo "::error::GATE 2 FAILED: $GATE2_FAILURES binary integrity failures!"
            echo "Release will NOT be published."
            exit 1
          fi

          echo ""
          echo "GATE 2 PASSED: All 6 packages contain identical nftband binary"
          echo "Reference hash: $REFERENCE_HASH"

      # =====================================================================
      # v1.229.4 PR-D — BINARY GOVULNCHECK WITNESS OVER SHIPPED ARTIFACTS
      # =====================================================================
      # F1 measured the same subject two ways on the same day:
      #     source mode   error = REACHABLE from this module's code   -> 5 error / 2 note
      #     binary mode   error = symbol PRESENT in the binary        -> 7 error / 0 note
      # Both are correct answers to DIFFERENT questions, and the binary is what ships, so
      # source-mode CI cannot close the release claim on its own.
      #
      # ⛔ NO NEW SCANNER AUTHORITY AND NO INTERPRETATION LAYER. Same pinned govulncheck
      #    as secure-go, its NATIVE SARIF, classified from the scanner's own `level` field.
      #    The deleted converter is not reintroduced in any form.
      #
      # ⛔ Runs BEFORE publication, consistent with SC-A: a witness after publication
      #    detects rather than prevents.
      # ---- v1.229.4 R2: the SLSA subject now arrives BEFORE finalization ----
      # These downloads pull the builder's WORKFLOW ARTIFACTS (not release assets), which
      # is why upload-assets: false does not deprive us of anything. They land alongside
      # the release assets already fetched above, so Gate 3 sees the complete population.
      - name: Download nftban-core artifact (SLSA builder)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-nftban-core.outputs.go-binary-name }}
          path: /tmp/release-verify

      - name: Download nftban-core provenance (SLSA builder)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-nftban-core.outputs.go-provenance-name }}
          path: /tmp/release-verify

      - name: Install SLSA Verifier
        run: |
          curl -sSfL https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64 \
            -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier

      - name: Verify SLSA Provenance
        run: |
          # =================================================================
          # v1.229.4 VAF-0 Stage 1 — SLSA_VALIDATION_FALSE_GREEN
          # =================================================================
          # THREE WITNESSES AGAINST ONE VALIDATOR. The previous form was:
          #
          #     VERIFY_FAILED=0
          #     for binary in dist/nftban-*; do
          #       if [ -f "$provenance" ]; then slsa-verifier ... || VERIFY_FAILED=1; fi
          #     done
          #     [[ $VERIFY_FAILED -ne 0 ]] && exit 1
          #
          #   L1 ZERO_SUBJECT_ITERATION           glob matches nothing -> 0 iterations ->
          #                                       VERIFY_FAILED stays 0 -> "verified"
          #   L2 REQUIRED_SUBJECT_ABSENCE_SKIPPED no else on the -f test -> A SHIPPED BINARY
          #                                       WITH NO PROVENANCE PASSED THE PROVENANCE
          #                                       CHECK. This was a live FALSE SECURITY
          #                                       CLAIM about a specific artifact, not a
          #                                       missing defence.
          #   L3 EXPECTED_POPULATION_NOT_ASSERTED nothing declared what SHOULD be verified
          #
          # ⛔ Adding an `else` alone would close L2 and leave L1 and L3. The population must
          #    come from a DECLARATION THAT REALITY CANNOT EDIT:
          #        PROVENANCE_FILES_FOUND must NOT define PROVENANCE_FILES_EXPECTED
          set -uo pipefail
          DECL="scripts/ci/data/slsa-subjects.tsv"
          VERIFIER="${SLSA_VERIFIER_BIN:-slsa-verifier}"
          [[ -f "$DECL" ]] || { echo "::error title=SLSA subject declaration missing::$DECL is absent. The expected population cannot be established, so nothing can be verified. ⛔ A MISSING DECLARATION IS NOT AN EMPTY POPULATION."; exit 1; }

          EXPECTED_COUNT="$(awk -F'\t' '$1=="expected_count"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          SOURCE_URI="$(awk -F'\t' '$1=="source_uri"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]] || { echo "::error title=SLSA declaration invalid::expected_count is missing or non-numeric."; exit 1; }
          [[ -n "$SOURCE_URI" ]] || { echo "::error title=SLSA declaration invalid::source_uri is missing."; exit 1; }

          # ---- CARDINALITY PRECONDITION: a zero-subject run is never a pass -------------
          DECLARED=$(awk -F'\t' '$1=="subject" && NF>=3' "$DECL" | wc -l | tr -d ' ')
          echo "declared SLSA subjects: ${DECLARED} (expected_count=${EXPECTED_COUNT})"
          if [[ "$DECLARED" -eq 0 ]]; then
            echo "::error title=SLSA population empty::The declaration lists ZERO subjects. ⛔ 0 SUBJECTS != 0 FAILURES, and 0 FAILURES != PASS."
            exit 1
          fi
          if [[ "$DECLARED" -ne "$EXPECTED_COUNT" ]]; then
            echo "::error title=SLSA declaration incoherent::${DECLARED} subject row(s) but expected_count=${EXPECTED_COUNT}. A subject was added or removed without updating the count."
            exit 1
          fi

          # ---- verify EACH DECLARED subject; absence is a FAILURE, never a skip ---------
          VERIFIED=0
          FAILED=0
          while IFS=$'\t' read -r _tag binary provenance; do
            [[ -n "${binary:-}" ]] || continue
            echo "--- declared subject: ${binary}"
            if [[ ! -f "/tmp/release-verify/${binary}" ]]; then
              echo "::error title=SLSA subject binary missing::Declared subject '"${binary}"' is not present in dist/. It was expected to ship. ⛔ ABSENCE IS NOT A SKIP."
              FAILED=$((FAILED+1)); continue
            fi
            if [[ ! -f "/tmp/release-verify/${provenance}" ]]; then
              echo "::error title=SLSA provenance missing::Declared subject '"${binary}"' SHIPS WITHOUT PROVENANCE ('"${provenance}"' absent). ⛔ This is the exact state the previous validator passed silently."
              FAILED=$((FAILED+1)); continue
            fi
            if "$VERIFIER" verify-artifact "/tmp/release-verify/${binary}" \
                 --provenance-path "/tmp/release-verify/${provenance}" \
                 --source-uri "$SOURCE_URI"; then
              VERIFIED=$((VERIFIED+1))
              echo "    provenance verified and bound to ${binary}"
            else
              echo "::error title=SLSA provenance binding failed::Provenance did not verify against '"${binary}"'."
              FAILED=$((FAILED+1))
            fi
          done < <(awk -F'\t' '$1=="subject" && NF>=3 {print $1"\t"$2"\t"$3}' "$DECL")

          # ---- OBSERVED-COUNT POSTCONDITION -------------------------------------------
          echo "verified ${VERIFIED}/${EXPECTED_COUNT} declared subject(s); failures=${FAILED}"
          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error title=SLSA verification failed::${FAILED} declared subject(s) could not be verified."
            exit 1
          fi
          if [[ "$VERIFIED" -ne "$EXPECTED_COUNT" ]]; then
            echo "::error title=SLSA coverage incomplete::verified ${VERIFIED} of ${EXPECTED_COUNT} declared subjects. ⛔ EVERY DECLARED SUBJECT MUST BE ACCOUNTED FOR — a partial pass is not a pass."
            exit 1
          fi
          echo "SLSA provenance verified for all ${VERIFIED} declared subject(s)."


      - name: Set up Go (PR-D binary witness)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.13`).
          go-version: '1.25.13'

      - name: PR-D binary govulncheck witness over shipped artifacts
        run: |
          set -uo pipefail
          DECL="scripts/ci/data/release-binary-witness-subjects.tsv"
          if [ ! -f "$DECL" ]; then
            echo "::error title=Binary witness declaration missing::$DECL is absent; the expected subject population cannot be established. A MISSING DECLARATION IS NOT AN EMPTY POPULATION."
            exit 1
          fi
          EXPECTED="$(awk -F'\t' '$1=="expected_total"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          case "$EXPECTED" in ''|*[!0-9]*) echo "::error title=Binary witness declaration invalid::expected_total missing or non-numeric."; exit 1;; esac
          DECLARED=$(awk -F'\t' '$1=="subject" && NF>=2' "$DECL" | wc -l | tr -d ' ')
          echo "declared binary-witness subjects: ${DECLARED} (expected_total=${EXPECTED})"
          # CARDINALITY PRECONDITION: a zero-subject witness reports success having examined
          # nothing. 0 SUBJECTS != 0 FINDINGS, and 0 FINDINGS != PASS.
          if [ "$DECLARED" -eq 0 ] || [ "$DECLARED" -ne "$EXPECTED" ]; then
            echo "::error title=Binary witness population invalid::declared=${DECLARED} expected_total=${EXPECTED}; a zero or incoherent population cannot pass."
            exit 1
          fi

          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          GVC="$(go env GOPATH)/bin/govulncheck"
          WITNESSED=0; FAILED=0

          awk -F'\t' '$1=="subject" && NF>=2 {print $2}' "$DECL" > /tmp/prd-subjects.txt
          while IFS= read -r base; do
            [ -n "$base" ] || continue
            ART="/tmp/release-verify/${base}"
            echo "--- declared subject: ${base}"
            if [ ! -f "$ART" ]; then
              echo "::error title=Binary witness subject missing::Declared subject ${base} was not downloaded from the release. ABSENCE IS NOT A SKIP."
              FAILED=$((FAILED+1)); continue
            fi
            echo "    embedded toolchain: $(go version -m "$ART" 2>/dev/null | head -1 | awk '{print $2}')"
            set +e
            "$GVC" -mode=binary -format sarif "$ART" > "/tmp/prd.sarif" 2> "/tmp/prd.err"
            GVC_RC=$?
            set -e
            # In SARIF mode govulncheck EXITS 0 EVEN WITH FINDINGS; a non-zero rc means the
            # TOOL failed. RC IS NEVER THE VERDICT.
            if [ "$GVC_RC" -ne 0 ]; then
              echo "::error title=Binary witness execution failure::govulncheck exited ${GVC_RC} in SARIF mode for ${base} - a TOOL failure, not a finding count. No conclusion can be drawn."
              tail -5 /tmp/prd.err | sed 's/^/      /'
              FAILED=$((FAILED+1)); continue
            fi
            if [ ! -s /tmp/prd.sarif ]; then
              echo "::error title=Binary witness produced no artifact::govulncheck exited 0 but emitted no SARIF for ${base}; the output contract was violated. This is NOT a clean result."
              FAILED=$((FAILED+1)); continue
            fi
            SUMMARY="$(python3 -c "$(printf '%s\n' \
              "import json,sys" \
              "try: d=json.load(open('/tmp/prd.sarif'))" \
              "except Exception: print('PARSE_FAILURE'); sys.exit(0)" \
              "res=[r for run in d.get('runs',[]) for r in run.get('results',[])]" \
              "e=sum(1 for r in res if r.get('level')=='error')" \
              "ids=' '.join(sorted({r.get('ruleId','?') for r in res}))" \
              "print('%d %d %s'%(len(res),e,ids))")")"
            case "$SUMMARY" in
              PARSE_FAILURE*)
                echo "::error title=Binary witness artifact unparseable::SARIF for ${base} is not parseable. An unparseable artifact is NOT an empty one."
                FAILED=$((FAILED+1)); continue;;
            esac
            TOTAL="$(printf '%s' "$SUMMARY" | awk '{print $1}')"
            PRESENT="$(printf '%s' "$SUMMARY" | awk '{print $2}')"
            IDS="$(printf '%s' "$SUMMARY" | cut -d' ' -f3-)"
            echo "    native SARIF: total=${TOTAL} present-in-binary(error)=${PRESENT}"
            if [ "$TOTAL" -gt 0 ]; then
              echo "::error title=Binary witness findings::${base} SHIPS WITH ${TOTAL} vulnerability finding(s) present in the binary: ${IDS}. BINARY-MODE error MEANS THE VULNERABLE SYMBOL IS PRESENT IN THE SHIPPED ARTIFACT - not the same claim as source-mode reachability."
              FAILED=$((FAILED+1)); continue
            fi
            WITNESSED=$((WITNESSED+1))
            echo "    clean: no vulnerable symbols present in the shipped binary"
          done < /tmp/prd-subjects.txt

          echo "witnessed ${WITNESSED}/${EXPECTED} declared subject(s); failures=${FAILED}"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=Binary witness failed::${FAILED} declared subject(s) did not pass the shipped-binary witness."
            exit 1
          fi
          # OBSERVED-COUNT POSTCONDITION: a partial pass is not a pass.
          if [ "$WITNESSED" -ne "$EXPECTED" ]; then
            echo "::error title=Binary witness coverage incomplete::witnessed ${WITNESSED} of ${EXPECTED} declared subjects; EVERY DECLARED SUBJECT MUST BE ACCOUNTED FOR."
            exit 1
          fi
          echo "PR-D: all ${WITNESSED} declared shipped binaries carry no vulnerable symbols."

      # =================================================================
      # v1.229.6 GATE 4 — SHIPPED BINARY BUILD METADATA
      # =================================================================
      # ⛔ WHY THIS EXISTS. v1.229.5 PUBLISHED with nftban-core carrying
      #    vcs.modified=true. "+dirty absent" was a declared release stop condition, but
      #    it lived only in a post-publication witness — so every machine gate passed
      #    legitimately and the release went out.
      #
      #        POST-PUBLICATION WITNESS CANNOT ENFORCE A PRE-PUBLICATION REQUIREMENT
      #
      #    A release requirement must exist as a PRE-PUBLICATION MACHINE GATE before it
      #    may be used as a release stop condition. A witness confirms; a gate enforces.
      #
      # ⛔ OBSERVATION ONLY. Reads embedded Go build metadata with grep. It NEVER executes
      #    a shipped binary — the release path must not run the artifact it verifies.
      - name: "Gate 4: Shipped binary build metadata (compiler + clean tree)"
        run: |
          set -uo pipefail
          cd /tmp/release-verify

          CANONICAL_GO="$(awk '/^go /{print $2; exit}' "$GITHUB_WORKSPACE/go.mod")"
          if [ -z "$CANONICAL_GO" ]; then
            echo "::error title=Canonical Go version unresolved::could not read the go directive from go.mod. UNKNOWN IS NOT PASS."
            exit 1
          fi
          echo "canonical Go from go.mod: ${CANONICAL_GO}"

          DECL="$GITHUB_WORKSPACE/scripts/ci/data/release-binary-witness-subjects.tsv"
          if [ ! -f "$DECL" ]; then
            echo "::error title=Binary metadata declaration missing::${DECL} is absent; the subject population cannot be established. A MISSING DECLARATION IS NOT AN EMPTY POPULATION."
            exit 1
          fi

          FAILED=0
          CHECKED=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if [ ! -f "$subject" ]; then
              echo "::error title=Binary metadata subject missing::${subject} is declared but not present at verification. ABSENCE IS NOT A SKIP."
              FAILED=$((FAILED+1)); continue
            fi
            COMPILERS="$(grep -aoE 'go1\.[0-9]+(\.[0-9]+)?' "$subject" | sort -u | paste -sd, -)"
            MODIFIED="$(grep -aoE 'vcs\.modified=(true|false)' "$subject" | sort -u | paste -sd, -)"
            echo "  ${subject}: compiler=[${COMPILERS}] ${MODIFIED:-<absent>}"

            # ⛔ UNREADABLE OR ABSENT METADATA IS NOT A PASS.
            if [ -z "$COMPILERS" ] || [ -z "$MODIFIED" ]; then
              echo "::error title=Binary metadata unreadable::${subject} exposes no usable Go build metadata (compiler='${COMPILERS}' modified='${MODIFIED}'). UNKNOWN IS NOT PASS."
              FAILED=$((FAILED+1)); continue
            fi
            case ",${COMPILERS}," in
              *",go${CANONICAL_GO},"*) : ;;
              *) echo "::error title=Compiler mismatch::${subject} was built with [${COMPILERS}], which does not include the canonical go${CANONICAL_GO}."
                 FAILED=$((FAILED+1)); continue ;;
            esac
            if [ "$MODIFIED" != "vcs.modified=false" ]; then
              echo "::error title=Dirty build tree::${subject} carries ${MODIFIED}. The build tree was not clean, so the provenance is qualified. PUBLICATION IS BLOCKED."
              FAILED=$((FAILED+1)); continue
            fi
            CHECKED=$((CHECKED+1))
          done < <(awk -F'\t' '$1=="subject" && NF>=2 {print $2}' "$DECL")

          EXPECTED="$(awk -F'\t' '$1=="expected_total"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          echo "clean subjects: ${CHECKED}/${EXPECTED}  failures: ${FAILED}"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=Binary metadata gate failed::${FAILED} shipped binary/binaries failed the build-metadata contract. The release stays a DRAFT."
            exit 1
          fi
          if [ "$CHECKED" != "$EXPECTED" ]; then
            echo "::error title=Binary metadata coverage incomplete::verified ${CHECKED} of ${EXPECTED} declared subjects. ⛔ PARTIAL COVERAGE IS NOT A PASS."
            exit 1
          fi
          echo "OK: every declared shipped binary is go${CANONICAL_GO} and built from a clean tree"

      - name: "Gate 3: Generate final SHA256SUMS from downloaded assets"
        run: |
          echo "=== GATE 3: Generate Public SHA256SUMS ==="
          echo "Computing checksums from DOWNLOADED assets (what users will actually get)"
          echo ""

          cd /tmp/release-verify

          # Generate SHA256SUMS from all downloadable package/binary files
          # Excludes: SHA256SUMS.build (internal), MANIFEST.txt, VERIFY.txt, sbom (metadata)
          shopt -s nullglob
          # ---- v1.229.4 item 4 / R2: REQUIRED SUBJECTS, NOT WHATEVER GLOBS ----
          # Before R2 this globbed and nftban-core was silently absent, because its builder
          # ran in a later workflow. `binaries=(nftban-core... nftband...)` upstream DECLARED
          # it required, while a `[[ -f ]]` skip and a `>0` count let it vanish without a word.
          #     DECLARED REQUIRED + SILENTLY SKIPPED = the false-green shape
          # The declaration below is the SAME file PR-D uses, so the witness population and
          # the checksum population cannot drift apart.
          DECL="$GITHUB_WORKSPACE/scripts/ci/data/release-binary-witness-subjects.tsv"
          if [ ! -f "$DECL" ]; then
            echo "::error title=Checksum subject declaration missing::$DECL is absent; the required checksum population cannot be established. A MISSING DECLARATION IS NOT AN EMPTY POPULATION."
            exit 1
          fi
          MISSING=0
          while IFS= read -r req; do
            [ -n "$req" ] || continue
            if [ ! -f "$req" ]; then
              echo "::error title=Required checksum subject missing::${req} is a DECLARED required checksum subject but is not present at finalization. ABSENCE IS NOT A SKIP."
              MISSING=$((MISSING+1))
            fi
          done < <(awk -F'\t' '$1=="subject" && NF>=2 {print $2}' "$DECL")
          if [ "$MISSING" -ne 0 ]; then
            echo "::error title=Checksum population incomplete::${MISSING} declared subject(s) absent; SHA256SUMS will NOT be finalized over an incomplete population."
            exit 1
          fi
          all_files=(*.rpm *.deb *-linux-amd64)

          if [ ${#all_files[@]} -eq 0 ]; then
            echo "::error::No package/binary files found for checksum generation"
            exit 1
          fi

          sha256sum "${all_files[@]}" | sort > SHA256SUMS
          echo "--- SHA256SUMS (from downloaded assets) ---"
          cat SHA256SUMS
          echo ""
          echo "Files checksummed: ${#all_files[@]}"
          echo ""

          # Final cross-check: SHA256SUMS must match SHA256SUMS.build for common files
          echo "--- Cross-checking SHA256SUMS vs SHA256SUMS.build ---"
          CROSS_FAILURES=0
          while IFS= read -r line; do
            FILE=$(echo "$line" | awk '{print $2}')
            DOWNLOAD_HASH=$(echo "$line" | awk '{print $1}')
            BUILD_HASH=$(grep "  ${FILE}$" SHA256SUMS.build 2>/dev/null | awk '{print $1}')
            # Try alternate format
            [ -z "$BUILD_HASH" ] && BUILD_HASH=$(grep "${FILE}" SHA256SUMS.build 2>/dev/null | head -1 | awk '{print $1}')

            if [ -n "$BUILD_HASH" ]; then
              if [ "$DOWNLOAD_HASH" = "$BUILD_HASH" ]; then
                echo "  $FILE: SHA256SUMS == SHA256SUMS.build"
              else
                echo "::error::$FILE: SHA256SUMS != SHA256SUMS.build (should never happen at this point)"
                CROSS_FAILURES=$((CROSS_FAILURES + 1))
              fi
            else
              # ---- v1.229.4 R2: NO BUILD HASH IS A CLASSIFICATION, NOT A SKIP ----
              # This branch did not exist. `if [ -n "$BUILD_HASH" ]` with no else meant a
              # file present in the PUBLIC SHA256SUMS but absent from SHA256SUMS.build was
              # silently not cross-checked at all. That was invisible before R2 because
              # every file in the population came from build-binaries. R2 adds nftban-core,
              # which the SLSA builder produces and which is NOT reliably in
              # SHA256SUMS.build (create-release does not depend on build-nftban-core), so
              # the release would have published its checksum with the cross-check quietly
              # doing nothing.
              #
              # ⛔ UNCHECKABLE-BY-DESIGN != ACCIDENTALLY-UNCHECKED. Only a subject DECLARED
              #    to derive integrity from signed provenance may lack a build hash, and
              #    that provenance was already verified earlier in this job. Anything else
              #    is a real gap and fails.
              AUTHORITY="$(awk -F'\t' -v f="$FILE" '$1=="subject" && $2==f {print $3; exit}' "$DECL")"
              if [ "$AUTHORITY" = "slsa-provenance" ]; then
                echo "  $FILE: no build checksum BY DECLARATION (integrity authority = slsa-provenance, verified earlier in this job)"
              else
                echo "::error title=Checksum cross-check silently skipped::${FILE} is in the public SHA256SUMS but has no entry in SHA256SUMS.build, and is not declared as deriving integrity from signed provenance (declared authority: '${AUTHORITY:-<undeclared>}'). ABSENCE OF A GROUND TRUTH IS NOT A PASS."
                CROSS_FAILURES=$((CROSS_FAILURES + 1))
              fi
            fi
          done < SHA256SUMS

          if [ "$CROSS_FAILURES" -gt 0 ]; then
            echo "::error::GATE 3 FAILED: Cross-check detected inconsistency"
            exit 1
          fi

          echo ""
          echo "GATE 3 PASSED: SHA256SUMS generated and cross-validated"

      - name: Upload SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$REF"
          echo "=== Publishing release $VERSION ==="

          cd /tmp/release-verify

          # ⛔ The publisher reads the SAME declaration the verifier used. Deriving these
          #    names from whatever happens to be on disk would let the upload set be
          #    defined by reality instead of by declaration — the tautology every other
          #    gate in this job exists to avoid.
          DECL="$GITHUB_WORKSPACE/scripts/ci/data/slsa-subjects.tsv"
          if [ ! -f "$DECL" ]; then
            echo "::error title=Publisher declaration missing::$DECL is absent; the required publication population cannot be established."
            exit 1
          fi
          SLSA_BINARY="$(awk -F'\t' '$1=="subject"{print $2; exit}' "$DECL")"
          SLSA_PROVENANCE="$(awk -F'\t' '$1=="subject"{print $3; exit}' "$DECL")"
          if [ -z "$SLSA_BINARY" ] || [ -z "$SLSA_PROVENANCE" ]; then
            echo "::error title=Publisher declaration invalid::no subject row with a binary and provenance in $DECL"
            exit 1
          fi
          echo "declared provenance-bearing subject: $SLSA_BINARY (+ $SLSA_PROVENANCE)"

          # ---- v1.229.5: THE SOLE PUBLISHER MUST ACTUALLY UPLOAD WHAT IT VERIFIED -------
          # v1.229.4 shipped WITHOUT nftban-core and its provenance. R2 disabled the
          # third-party builder's upload (correctly), but slsa-go-releaser.yml also held
          # OUR OWN "Upload to GitHub Release" step, and deleting the file removed both.
          # The binary was built, provenance-verified, witnessed and checksummed — and
          # then never uploaded, because nothing was left that could upload it.
          #
          #     ONE_PUBLISHER held. COMPLETE_PUBLISHED_POPULATION did not.
          #
          # ⛔ Uniqueness of the publishing authority says nothing about completeness of
          #    its output. These are two invariants, and only the first was proven.
          echo "Uploading provenance-bearing artifacts..."
          for f in "${SLSA_BINARY}" "${SLSA_PROVENANCE}"; do
            if [ ! -f "$f" ]; then
              echo "::error title=Publisher input missing::${f} was verified earlier in this job but is not present at upload time. VERIFIED IS NOT PUBLISHED."
              exit 1
            fi
            gh release upload "$VERSION" "$f" --clobber -R "$GITHUB_REPOSITORY"
          done

          # Upload final SHA256SUMS (computed from downloaded assets)
          echo "Uploading SHA256SUMS..."
          gh release upload "$VERSION" SHA256SUMS --clobber \
            -R "$GITHUB_REPOSITORY"

          # ---- FINAL PUBLISHED-POPULATION CHECK (must precede publication) -------------
          # ⛔ Every gate before this one reasoned about files on the RUNNER. This is the
          #    only assertion about what a USER can actually obtain. SHA256SUMS is the
          #    public claim, so anything it lists must exist as a published asset — that
          #    is exactly what v1.229.4 violated, and it violated it while every earlier
          #    gate passed legitimately.
          #
          #    VERIFIED_RELEASE_POPULATION == PUBLISHED_RELEASE_POPULATION
          echo "=== FINAL: verified population == published population ==="
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > /tmp/published-assets.txt
          echo "--- published assets ---"; cat /tmp/published-assets.txt

          MISSING=0
          # (a) everything the PUBLIC checksum file claims must be obtainable
          while IFS= read -r claimed; do
            [ -n "$claimed" ] || continue
            if ! grep -qxF "$claimed" /tmp/published-assets.txt; then
              echo "::error title=Published population incomplete::SHA256SUMS lists '${claimed}' but it is NOT a published asset. A CHECKSUM FOR AN UNOBTAINABLE FILE IS A FALSE CLAIM."
              MISSING=$((MISSING+1))
            fi
          done < <(awk '{print $2}' SHA256SUMS | sed 's/^\*//')

          # (b) declared provenance-bearing subjects must ship WITH their provenance
          for req in "${SLSA_BINARY}" "${SLSA_PROVENANCE}"; do
            if ! grep -qxF "$req" /tmp/published-assets.txt; then
              echo "::error title=Published population incomplete::Declared subject '${req}' was verified in this job but is NOT a published asset. VERIFIED IS NOT PUBLISHED."
              MISSING=$((MISSING+1))
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "::error title=Publication blocked::${MISSING} required artifact(s) absent from the release. ⛔ The release stays a DRAFT — an incomplete population is not published."
            exit 1
          fi
          echo "OK: every checksummed and declared artifact is present in the release"

          # Publish: remove draft flag
          echo "Publishing release (draft=false)..."
          gh release edit "$VERSION" --draft=false \
            -R "$GITHUB_REPOSITORY"

          echo ""
          echo "============================================="
          echo "RELEASE $VERSION PUBLISHED"
          echo "============================================="
          echo ""
          echo "Integrity verification summary:"
          echo "  Gate 1: Upload integrity    (build == download checksums)"
          echo "  Gate 2: Binary integrity    (standalone == packaged binaries)"
          echo "  Gate 3: Public SHA256SUMS   (generated from downloaded assets)"
          echo ""
          echo "All gates passed. Release is live."

          rm -rf /tmp/release-verify
