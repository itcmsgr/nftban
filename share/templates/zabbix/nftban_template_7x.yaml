zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b3621348-568c-4022-b3a7-83846bc8a1aa
      name: 'Templates/Security'
  templates:
    - uuid: 76c37c2a-70dc-451a-9298-e9bb80c930ec
      template: 'NFTBan'
      name: 'NFTBan Firewall Monitoring'
      description: |
        NFTBan monitoring template for Zabbix 7.x
        Requirements:
        - NFTBan v1.4.0+
        - Zabbix 7.x with Trapper support

        Data is pushed via zabbix_sender (no agent required).
      vendor:
        name: NFTBan
        version: '1.4.0'
      groups:
        - name: 'Templates/Security'
      items:
        # =====================================================================
        # DAEMON STATUS
        # =====================================================================
        - uuid: ecd5f00d-352d-4a88-8f67-a1a92e6bff02
          name: 'NFTBan: Daemon status'
          type: TRAPPER
          key: nftban.daemon.up
          value_type: UNSIGNED
          description: '1 if daemon running, 0 if down'
          triggers:
            - uuid: eb2ef648-894b-4bce-8733-ddeb163045b0
              expression: 'last(/NFTBan/nftban.daemon.up)=0'
              name: 'NFTBan daemon is down'
              priority: DISASTER
            - uuid: 751aef14-149a-4a41-a901-624b9446a382
              expression: 'nodata(/NFTBan/nftban.daemon.up,5m)=1'
              name: 'NFTBan metrics not received for 5 minutes'
              priority: HIGH
        - uuid: 7fe3f0a7-88b3-4d1c-af6d-25f112dc52c5
          name: 'NFTBan: Version'
          type: TRAPPER
          key: nftban.version
          value_type: CHAR
          description: 'NFTBan version string'
        - uuid: 4847ad4a-222b-4e70-a5ca-7c7a5b971782
          name: 'NFTBan: Uptime'
          type: TRAPPER
          key: nftban.uptime
          value_type: FLOAT
          units: s
          description: 'Daemon uptime in seconds'
        - uuid: 209290b4-41f6-43db-b79b-84600a4b4202
          name: 'NFTBan: PID'
          type: TRAPPER
          key: nftban.pid
          value_type: UNSIGNED
          description: 'Daemon process ID'
        - uuid: 6258109c-e082-4583-813f-dac966b9375e
          name: 'NFTBan: Operating mode'
          type: TRAPPER
          key: nftban.mode
          value_type: CHAR
          description: 'Operating mode: normal, degraded, survival'
        # =====================================================================
        # BAN STATISTICS
        # =====================================================================
        - uuid: 4d7c8fb6-193a-4b7f-a8ef-1c5368dbbc45
          name: 'NFTBan: Active bans'
          type: TRAPPER
          key: nftban.blocks.total
          value_type: UNSIGNED
          description: 'Total currently blocked IPs'
        - uuid: 774f2c7f-089a-49ee-af92-60227064bad0
          name: 'NFTBan: Bans (24h)'
          type: TRAPPER
          key: nftban.bans.last.24h
          value_type: UNSIGNED
          description: 'Bans in last 24 hours'
        - uuid: 073cbb52-2241-4c45-a951-4ff41eab0a7d
          name: 'NFTBan: Bans (1h)'
          type: TRAPPER
          key: nftban.bans.last.1h
          value_type: UNSIGNED
          description: 'Bans in last hour'
        - uuid: c9604ea2-ba87-4ec5-9399-86b4758d21a2
          name: 'NFTBan: Ban rate'
          type: TRAPPER
          key: nftban.throughput.bans.per.minute
          value_type: FLOAT
          units: '/min'
          description: 'Current ban rate per minute'
        - uuid: 731eaad7-9495-4d89-b86e-13872210c130
          name: 'NFTBan: Total bans'
          type: TRAPPER
          key: nftban.bans.total
          value_type: UNSIGNED
          description: 'Cumulative total bans'
        - uuid: a3213a82-a720-4b46-bd62-7ec287352672
          name: 'NFTBan: Permanent bans (IPv4)'
          type: TRAPPER
          key: nftban.blacklist.ipv4.perm
          value_type: UNSIGNED
          description: 'Permanent IPv4 bans'
        - uuid: a3213a83-a720-4b46-bd62-7ec287352673
          name: 'NFTBan: Permanent bans (IPv6)'
          type: TRAPPER
          key: nftban.blacklist.ipv6.perm
          value_type: UNSIGNED
          description: 'Permanent IPv6 bans'
        - uuid: b4324a93-b831-4c57-ae73-8fd398463784
          name: 'NFTBan: Temporary bans (IPv4)'
          type: TRAPPER
          key: nftban.blacklist.ipv4.temp
          value_type: UNSIGNED
          description: 'Temporary IPv4 bans'
        - uuid: b4324a94-b831-4c57-ae73-8fd398463785
          name: 'NFTBan: Temporary bans (IPv6)'
          type: TRAPPER
          key: nftban.blacklist.ipv6.temp
          value_type: UNSIGNED
          description: 'Temporary IPv6 bans'
        - uuid: cc61d2bc-7944-4c61-9bd5-3bee5048bde7
          name: 'NFTBan: Whitelist count'
          type: TRAPPER
          key: nftban.whitelist.total
          value_type: UNSIGNED
          description: 'Total whitelisted IPs'
        # =====================================================================
        # RESOURCE METRICS
        # =====================================================================
        - uuid: d3132fbb-b12e-4919-98cd-c1ea0c398fe1
          name: 'NFTBan: Memory RSS'
          type: TRAPPER
          key: nftban.memory.rss
          value_type: UNSIGNED
          units: B
          description: 'Daemon memory usage (RSS)'
        - uuid: d86e7c8c-851c-43a8-819f-43790d524bbd
          name: 'NFTBan: Open file descriptors'
          type: TRAPPER
          key: nftban.fds.open
          value_type: UNSIGNED
          description: 'Open file descriptors'
        - uuid: 0c2af91a-438c-468d-b967-8f053df3e0af
          name: 'NFTBan: Goroutines'
          type: TRAPPER
          key: nftban.goroutines
          value_type: UNSIGNED
          description: 'Active goroutines'
        - uuid: 19fbf451-3ab4-4aea-84bf-45c3b7757977
