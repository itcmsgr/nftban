#
# nftban Suricata Rule Disable Configuration
# ==========================================
# This file specifies rules to DISABLE (suppress) from active rulesets.
# Disabled rules will not generate alerts or take actions.
#
# Syntax options:
#   <sid>                    - Disable a specific rule by SID
#   <sid1>-<sid2>            - Disable a range of SIDs
#   re:<regex>               - Disable rules matching regex pattern
#   group:<category>         - Disable entire category (see categories.enabled)
#
# Examples:
#   2100498                  - Disable SID 2100498
#   2100000-2100999          - Disable SID range
#   re:.*GPL.*               - Disable all GPL-licensed rules
#   re:.*POLICY.*            - Disable all POLICY rules
#   group:deleted            - Disable 'deleted' category
#
# Common suppressions:
#   - Noisy rules that generate false positives
#   - Rules for protocols not in use on your network
#   - Rules superseded by local rules
#
# This file is processed by suricata-update.
# See: https://suricata-update.readthedocs.io/en/latest/

# ===========================================================================
