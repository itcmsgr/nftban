# NFTBan Fail2ban Jail - Pure-FTPd Server
#
# Monitors Pure-FTPd authentication failures.
# Protects FTP and FTPS ports from brute force attacks.
#
# Configuration:
# - maxretry: 9 failed attempts
# - findtime: 20 minutes (1200 seconds)
# - bantime: 2 hours
#
# Based on DirectAdmin production configuration

[nftban-pure-ftpd]

# Disabled by default - enable if Pure-FTPd is installed
enabled   = false

# FTP service ports
port      = ftp,ftp-data,ftps,ftps-data

# Use standard pure-ftpd filter
filter    = pure-ftpd

# Pure-FTPd log location (varies by system)
logpath   = /var/log/messages
            /var/log/syslog
            /var/log/pure-ftpd/pure-ftpd.log

# Higher threshold for FTP (clients often mistype)
maxretry  = 9
findtime  = 20m

# Medium ban duration (2 hours)
bantime   = 2h

# Backend detection
backend   = auto

# Use NFTBan action
action    = nftban[name=pure-ftpd]
