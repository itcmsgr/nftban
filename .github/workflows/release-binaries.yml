name: Release Go Binaries
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-matrix:
    name: Build (${{ matrix.go }} • ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x"]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build nftban-feeds (${{ matrix.arch }})
        run: |
          mkdir -p dist
          cd go-feeds
          GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags "-s -w" \
            -o ../dist/nftban-feeds-${{ matrix.arch }} ./cmd/nftban-feeds
      - name: Build nftban-geoip (${{ matrix.arch }})
        run: |
          mkdir -p dist
          cd go-geoip
          GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags "-s -w" \
            -o ../dist/nftban-geoip-${{ matrix.arch }} ./cmd/nftban-geoip
      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nftban-binaries-${{ matrix.arch }}
          path: dist/*-${{ matrix.arch }}
  assemble-release:
    name: Assemble & Sign Artifacts
    needs: [build-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          shopt -s globstar nullglob
          mv dist/**/nftban-* dist/ || true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          for f in nftban-*; do sha256sum "$f" >> SHA256SUMS; done
      # GPG-sign the checksum file (OPTIONAL). Only runs if secrets are configured.
      - name: Import GPG key
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Sign SHA256SUMS
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        working-directory: dist
        run: |
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nftban-*
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
