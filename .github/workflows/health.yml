---
name: Project Health

"on":
  push:
    branches: ["**"]  # run on all branches
  pull_request:  # and on PRs
  workflow_dispatch:  # manual trigger
  schedule:
    - cron: "17 3 * * 1"  # weekly (Mon 03:17 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # default: read-only (security best practice)

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # elevated only for auto-commit step
      security-events: write  # for secret scanning results

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full clone not strictly needed, but safe
          persist-credentials: false  # security: don't persist token

      - name: Ensure health script is executable
        run: chmod +x .ci/health_check.sh

      - name: Set up Node.js (for jscpd / markdownlint-cli2)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install linters & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt yamllint jq \
            devscripts nftables
          npm i -g markdownlint-cli2

      - name: Run health check
        run: .ci/health_check.sh

      - name: Secret scan with TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          base: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Upload STATUS.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-status
          path: STATUS.md
          if-no-files-found: error
          retention-days: 7

      # Optional: commit STATUS.md changes back to main
      # (keeps README link always fresh)
      - name: Auto-commit STATUS.md (main branch only)
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- STATUS.md; then
            # Re-authenticate for push (persist-credentials: false above)
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add STATUS.md
            git commit -m "chore: update STATUS.md [skip ci]"
            # Use GITHUB_TOKEN for push
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}"
            REPO_URL="${REPO_URL}@github.com/${{ github.repository }}.git"
            git push "${REPO_URL}" HEAD:main
          fi
