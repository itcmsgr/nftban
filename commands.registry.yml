rbl:
  category: active_protection
  description: "RBL (Real-time Blackhole List) monitoring for server IP reputation"
  risk: core
  audience: [cli, auditor]
  capability: status_read
  mutates: conditional
  supports_dry_run: false
  requires_root: conditional
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban rbl status"
    - "nftban rbl check"
    - "nftban rbl check --ip 1.2.3.4"
    - "nftban rbl check --fresh --verbose"
    - "nftban rbl server check"
    - "nftban rbl server check --alert"
    - "nftban rbl list"
    - "nftban rbl list --verbose"
    - "nftban rbl enable"
    - "nftban rbl disable"
    - "nftban rbl cache show"
    - "nftban rbl cache purge"
    - "nftban rbl critical list"
    - "nftban rbl critical add 1.2.3.4 mail"
    - "nftban rbl critical remove 1.2.3.4"
    - "nftban rbl alert test --ip 1.2.3.4"
    - "nftban rbl watchlist list"
    - "nftban rbl watchlist add 198.51.100.5 'Customer ABC mail'"
    - "nftban rbl watchlist check --alert"
    - "nftban rbl check --sequential"
    - "nftban rbl status --json"
  subcommands:
    check:
      mutates: false
      description: "Check IP(s) against RBL servers (parallel DNS by default)"
      options:
        --ip: "Check specific IP address"
        --fresh: "Ignore cache, force fresh check"
        --json: "Output in JSON format"
        --verbose: "Show all results including clean"
        --quiet: "Minimal output (for cron)"
        --alert: "Send alert email if listings found"
        --sequential: "Use sequential DNS (default: parallel)"
    server:
      mutates: false
      description: "Full server assessment (all IPs + hostname)"
      subcommands:
        check: {mutates: false, description: "Check all server IPs against RBLs (--sequential for slow mode)"}
    status:
      mutates: false
      description: "Show RBL monitoring status"
    list:
      mutates: false
      description: "List configured RBL providers"
    enable:
      mutates: true
      requires_root: true
      description: "Enable scheduled RBL checks (systemd timer)"
    disable:
      mutates: true
      requires_root: true
      description: "Disable scheduled RBL checks"
    cache:
      mutates: conditional
      description: "Manage RBL cache"
      subcommands:
        show: {mutates: false, description: "Show cache statistics"}
        purge: {mutates: true, description: "Purge cache (all or by IP)"}
    alert:
      mutates: false
      description: "Alert system management"
      subcommands:
        test: {mutates: false, description: "Send test alert email"}
    critical:
      mutates: conditional
      description: "Manage critical IPs for monitoring (mail, web, panel servers)"
      subcommands:
        list: {mutates: false, description: "Show configured critical IPs"}
        add: {mutates: true, requires_root: true, description: "Add critical IP with tag"}
        remove: {mutates: true, requires_root: true, description: "Remove critical IP"}
    watchlist:
      mutates: conditional
      description: "Monitor external IPs of interest (customers, partners, etc.)"
      subcommands:
        list: {mutates: false, description: "Show all watched IPs"}
        add: {mutates: true, requires_root: true, description: "Add IP to watchlist with description"}
        remove: {mutates: true, requires_root: true, description: "Remove IP from watchlist"}
        check: {mutates: false, description: "Check all watched IPs against RBLs (--alert to send notifications)"}

