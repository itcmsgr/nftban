# =============================================================================
# NFTBan DirectAdmin Panel Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: DirectAdmin control panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/directadmin/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# DIRECTADMIN INSTALLATION
# -----------------------------------------------------------------------------

# DirectAdmin installation path
NFTBAN_DIRECTADMIN_PATH="/usr/local/directadmin"

# DirectAdmin panel port (default: 2222)
NFTBAN_DIRECTADMIN_PANEL_PORT="2222"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION
# -----------------------------------------------------------------------------
# Based on DirectAdmin recommended firewall rules
# See: https://help.directadmin.com/item.php?id=3
#
# ⚠️  IMPORTANT: SSH port 22 is AUTOMATICALLY managed by NFTBan
#    SSH is a critical safety port defined in /etc/nftban/ports.d/00-ssh.conf
#    DO NOT add port 22 to panel configs - it's handled separately to prevent lockout
#

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SMTP(25), DNS(53), DNS-over-TLS(853),
#        HTTP(80), POP3(110), IMAP(143), HTTPS(443), SMTPS(465),
#        Submission(587), IMAPS(993), POP3S(995), Panel(2222),
#        Passive FTP(35000-35999)
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port
NFTBAN_DIRECTADMIN_TCP_IN="20,21,25,53,853,80,110,143,443,465,587,993,995,2222,35000-35999"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SMTP(25), DNS(53), DNS-over-TLS(853),
#        HTTP(80), POP3(110), Ident(113), IMAP(143), HTTPS(443),
#        SMTPS(465), Submission(587), IMAPS(993), POP3S(995), Panel(2222)
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port
NFTBAN_DIRECTADMIN_TCP_OUT="20,21,25,53,853,80,110,113,143,443,465,587,993,995,2222"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), DNS-over-TLS(853), HTTP/3(80), QUIC(443)
NFTBAN_DIRECTADMIN_UDP_IN="20,21,53,853,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), DNS-over-TLS(853), Ident(113), NTP(123), QUIC(443)
NFTBAN_DIRECTADMIN_UDP_OUT="20,21,53,853,113,123,443"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port

# TCP INPUT (incoming connections) - IPv6
NFTBAN_DIRECTADMIN_TCP6_IN="20,21,25,53,853,80,110,143,443,465,587,993,995,2222,35000-35999"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_DIRECTADMIN_TCP6_OUT="20,21,25,53,853,80,110,113,143,443,465,587,993,995,2222"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_DIRECTADMIN_UDP6_IN="20,21,53,853,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_DIRECTADMIN_UDP6_OUT="20,21,53,853,113,123,443"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_DIRECTADMIN_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_DIRECTADMIN_CUSTOM_TCP_IN=""
NFTBAN_DIRECTADMIN_CUSTOM_TCP_OUT=""
NFTBAN_DIRECTADMIN_CUSTOM_UDP_IN=""
NFTBAN_DIRECTADMIN_CUSTOM_UDP_OUT=""

NFTBAN_DIRECTADMIN_CUSTOM_TCP6_IN=""
NFTBAN_DIRECTADMIN_CUSTOM_TCP6_OUT=""
NFTBAN_DIRECTADMIN_CUSTOM_UDP6_IN=""
NFTBAN_DIRECTADMIN_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# CLOUDFLARE INTEGRATION
# -----------------------------------------------------------------------------
# DirectAdmin licensing servers are behind CloudFlare CDN
# CloudFlare IP whitelist is REQUIRED for licensing to work

# Auto-enable CloudFlare whitelist? (YES|NO|ASK)
# YES  - Automatically enable CloudFlare whitelist (recommended)
# NO   - Skip CloudFlare whitelist (you must enable manually!)
# ASK  - Prompt user during setup (default)
NFTBAN_DIRECTADMIN_AUTO_CLOUDFLARE="ASK"

# Update CloudFlare IP list automatically? (YES|NO)
NFTBAN_DIRECTADMIN_UPDATE_CLOUDFLARE="YES"

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# DirectAdmin login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_DIRECTADMIN_ENABLED="true"

# Log file location
LOGIN_SERVICE_DIRECTADMIN_LOG="/var/log/directadmin/login.log"
LOGIN_SERVICE_DIRECTADMIN_ERROR="/var/log/directadmin/errortaskq.log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Enable CloudFlare IP whitelist (REQUIRED for licensing)
# • Use SSL/TLS for panel access (port 2222 with SSL)
# • Enable login monitoring (automatic brute-force protection)
# • Configure fail2ban DirectAdmin jail for additional protection
# • Restrict panel access to specific IPs if possible
# • Enable two-factor authentication in DirectAdmin
# • Keep DirectAdmin updated to latest version

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
