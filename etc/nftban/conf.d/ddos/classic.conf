# -----------------------------------------------------------------------------
# CLASSIC MODE SETTINGS
# -----------------------------------------------------------------------------
# These settings control the standalone nftables-based DDoS protection.
# No external IDS required - pure kernel-level enforcement.

# SYN Flood Protection
# --------------------
# Rate limit for new TCP SYN packets per source IP
DDOS_CLASSIC_SYN_RATE="25/second"
DDOS_CLASSIC_SYN_BURST="50"

# Connection Limits (per source IP)
# ---------------------------------
# Maximum concurrent connections per service
DDOS_CLASSIC_SSH_CONN_LIMIT="10"
DDOS_CLASSIC_HTTP_CONN_LIMIT="100"
DDOS_CLASSIC_HTTPS_CONN_LIMIT="100"
DDOS_CLASSIC_SMTP_CONN_LIMIT="20"
DDOS_CLASSIC_DNS_CONN_LIMIT="50"

# Generic connection limit for unlisted ports
DDOS_CLASSIC_GENERIC_CONN_LIMIT="50"

# ICMP Rate Limiting
# ------------------
# Rate limit for ICMP echo requests (ping flood protection)
DDOS_CLASSIC_ICMP_RATE="10/second"
DDOS_CLASSIC_ICMP_BURST="20"

# ICMPv6 Rate Limiting
DDOS_CLASSIC_ICMPV6_RATE="10/second"
DDOS_CLASSIC_ICMPV6_BURST="20"

# UDP Flood Protection
# --------------------
# Rate limit for UDP packets (DNS amplification, etc.)
DDOS_CLASSIC_UDP_RATE="100/second"
DDOS_CLASSIC_UDP_BURST="200"

# Port Flood Protection
# ---------------------
# Rate limit for connection attempts across multiple ports (scan detection)
DDOS_CLASSIC_PORT_FLOOD_RATE="50/second"
DDOS_CLASSIC_PORT_FLOOD_BURST="100"

# -----------------------------------------------------------------------------
# AUTO-TUNING (Based on System Resources)
# -----------------------------------------------------------------------------
# Enable auto-tuning of thresholds based on CPU cores and RAM
DDOS_CLASSIC_AUTO_TUNE="true"

# CPU load threshold to trigger aggressive blocking (percentage of cores)
# Example: 0.9 = 90% of available cores
DDOS_CLASSIC_LOAD_TRIP_MULTIPLIER="0.90"
DDOS_CLASSIC_LOAD_CLEAR_MULTIPLIER="0.60"

# Conntrack pressure thresholds (percentage of nf_conntrack_max)
DDOS_CLASSIC_CONNTRACK_TRIP_PERCENT="85"
DDOS_CLASSIC_CONNTRACK_CLEAR_PERCENT="70"

# -----------------------------------------------------------------------------
# BLOCKING POLICY
# -----------------------------------------------------------------------------
# Default ban duration for detected attackers (seconds)
DDOS_CLASSIC_BAN_DURATION_SHORT="300"      # 5 minutes (first offense)
DDOS_CLASSIC_BAN_DURATION_MEDIUM="1800"    # 30 minutes (repeat offense)
DDOS_CLASSIC_BAN_DURATION_LONG="3600"      # 1 hour (persistent attacker)

# Escalation: number of hits before increasing ban duration
DDOS_CLASSIC_ESCALATE_THRESHOLD="3"

# -----------------------------------------------------------------------------
# METER/SET NAMES (nftables)
# -----------------------------------------------------------------------------
# Names for nftables meters used in rate limiting
DDOS_CLASSIC_SYN_METER="ddos_syn_flood"
DDOS_CLASSIC_ICMP_METER="ddos_icmp_flood"
DDOS_CLASSIC_UDP_METER="ddos_udp_flood"
DDOS_CLASSIC_PORT_METER="ddos_port_flood"

# Set name for blocked IPs
DDOS_CLASSIC_BLOCK_SET="ddos_blocked"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log file for classic mode events
DDOS_CLASSIC_LOG_FILE="/var/log/nftban/ddos-classic.log"

# Log level: DEBUG, INFO, WARN, ERROR
DDOS_CLASSIC_LOG_LEVEL="INFO"

# Log dropped packets (may be verbose under attack)
DDOS_CLASSIC_LOG_DROPS="false"

# -----------------------------------------------------------------------------
# SANITY CHECK SETTINGS (Packet Validation - Stage 3)
# -----------------------------------------------------------------------------
# Sanity checks run BEFORE SYNPROXY to drop invalid/malformed packets early.
# This filters out garbage traffic like Christmas tree packets, NULL scans,
# and fragmented attacks before any rate limiting occurs.
#
# Drops:
#   - Christmas tree packets (all TCP flags set)
#   - NULL packets (no TCP flags set)
#   - New connections that aren't SYN (stateful bypass attempts)
#   - Packets with invalid conntrack state
#   - Fragmented packets to high ports (amplification attacks)

# Chain name for sanity check rules
DDOS_SANITY_CHAIN="ddos_sanity"

# Log invalid packets before dropping (may be verbose under attack)
# Set to "true" to enable logging for debugging/analysis
DDOS_SANITY_LOG_INVALID="false"

# Log prefix for sanity check drops
DDOS_SANITY_LOG_PREFIX="NFTBAN_SANITY:"

# -----------------------------------------------------------------------------
# SYNPROXY SETTINGS (SYN Cookie-like Protection)
# -----------------------------------------------------------------------------
# SYNPROXY provides kernel-level TCP handshake proxy for SYN flood protection.
# It handles the 3-way handshake before passing connections to the real service.
#
# IMPORTANT: SYNPROXY requires conntrack and must be applied before SYN rate
# limiting. It's more efficient than rate limiting for high-volume attacks.

# Enable SYNPROXY protection
DDOS_SYNPROXY_ENABLED="true"

# MSS (Maximum Segment Size) - should match your network MTU minus headers
# Default: 1460 for standard Ethernet (1500 MTU - 40 bytes TCP/IP headers)
DDOS_SYNPROXY_MSS="1460"

# WSCALE (Window Scale Factor) - controls TCP window size multiplier
# Range: 0-14, Higher = larger receive window
# 7 = 128x multiplier (typical for high-speed networks)
DDOS_SYNPROXY_WSCALE="7"

# Enable SACK (Selective Acknowledgment) negotiation
# SACK improves retransmission efficiency on lossy networks
DDOS_SYNPROXY_SACK="true"

# Enable TIMESTAMP option negotiation
# Timestamps improve RTT measurement and PAWS protection
DDOS_SYNPROXY_TSTAMP="true"

# Ports to protect with SYNPROXY (comma-separated)
# Default: Common services vulnerable to SYN floods
# WARNING: SSH port is NEVER applied to SYNPROXY (stripped at deploy time).
# notrack on SSH breaks conntrack for whitelisted IPs → SSH lockout under attack.
DDOS_SYNPROXY_PORTS="80,443,25,587,993,995,3306,5432,6379,27017"

# Chain name for SYNPROXY rules
DDOS_SYNPROXY_CHAIN="ddos_synproxy"

# Log SYNPROXY events (first SYN for each new IP per minute)
DDOS_SYNPROXY_LOG_NEW="false"
DDOS_SYNPROXY_LOG_PREFIX="NFTBAN_SYNPROXY:"

# -----------------------------------------------------------------------------
# PENALTY LADDER SETS (Graduated Response with Auto-Expiry)
# -----------------------------------------------------------------------------
# These sets provide escalating responses to suspicious IPs.
# IPs are added programmatically and auto-expire after timeout.
#
# Ladder progression:
#   1. ddos_limit_10s  -> Light rate limiting (10s auto-clear)
#   2. ddos_limit_5m   -> Moderate rate limiting (5m auto-clear)
#   3. ddos_drop_5m    -> Packet drop (5m auto-clear)
#   4. ddos_ban_1h     -> Full ban (1h auto-clear)

# Set names for penalty ladder (IPv4 - IPv6 versions have "6" suffix)
DDOS_PENALTY_SET_LIMIT_10S="ddos_limit_10s"
DDOS_PENALTY_SET_LIMIT_5M="ddos_limit_5m"
DDOS_PENALTY_SET_DROP_5M="ddos_drop_5m"
DDOS_PENALTY_SET_BAN_1H="ddos_ban_1h"

# Timeout durations for each penalty level
DDOS_PENALTY_TIMEOUT_10S="10s"
DDOS_PENALTY_TIMEOUT_5M="5m"
DDOS_PENALTY_TIMEOUT_1H="1h"

# Rate limits for penalty ladder enforcement
DDOS_PENALTY_LIMIT_10S_RATE="50/second"   # Light throttle
DDOS_PENALTY_LIMIT_10S_BURST="100"
DDOS_PENALTY_LIMIT_5M_RATE="10/second"    # Severe throttle
DDOS_PENALTY_LIMIT_5M_BURST="20"

# -----------------------------------------------------------------------------
# PREFIX AGGREGATION (Distributed Attack Detection)
# -----------------------------------------------------------------------------
# Prefix aggregation tracks by network prefix (/24 for IPv4, /64 for IPv6)
# instead of individual IPs to detect distributed botnets that use many
# source IPs from the same subnet.
#
# When enabled, applies BEFORE per-IP rate limiting (Stage 1.5):
#   Stage 1   - SYNPROXY (kernel-level SYN proxy)
#   Stage 1.5 - Prefix Aggregation (subnet-level rate limiting)
#   Stage 2   - Classic Rate Limiting (per-IP limits)

# Enable prefix aggregation (detects distributed attacks)
DDOS_PREFIX_ENABLED="true"

# Network prefix masks for aggregation
DDOS_PREFIX_IPV4_MASK="/24"    # 255.255.255.0 - aggregate by /24 subnet
DDOS_PREFIX_IPV6_MASK="/64"    # Aggregate by /64 subnet

# Rate limits for aggregated prefixes (higher than per-IP since many IPs share)
DDOS_PREFIX_SYN_RATE="100/second"
DDOS_PREFIX_SYN_BURST="200"
DDOS_PREFIX_CONN_RATE="500/second"
DDOS_PREFIX_CONN_BURST="1000"

# Meter names for prefix aggregation
DDOS_PREFIX_METER_SYN="ddos_prefix_syn"
DDOS_PREFIX_METER_CONN="ddos_prefix_conn"

# Chain name for prefix aggregation rules
DDOS_PREFIX_CHAIN="ddos_prefix"

# -----------------------------------------------------------------------------
# HIGH ATTRIBUTION BANS (Stage 4)
# -----------------------------------------------------------------------------
# These bans only trigger when attribution is strong - proving the IP is real,
# not spoofed. This prevents false positives from reflection/amplification attacks.
#
# Ban criteria (require at least one):
#   1. Completed TCP handshakes + sustained abuse (proves real IP)
#   2. Repeated SYNPROXY failures (failed to complete handshake multiple times)
#   3. Persistence across time windows (not just a burst)

# Require handshake completion before banning (default: true)
# When true, only IPs that completed TCP 3-way handshake can be banned
DDOS_BAN_REQUIRE_HANDSHAKE="true"

# Require multiple signals before banning (default: true)
# When true, IP must trigger multiple detection types or persist across windows
DDOS_BAN_REQUIRE_MULTI_SIGNAL="true"

# Minimum hits before considering a ban
DDOS_BAN_MIN_HITS="5"

# Time window for hit counting (seconds)
DDOS_BAN_WINDOW="60"

# Set name for banned IPs (IPv6 version will have "6" suffix)
DDOS_BAN_SET="ddos_banned"

# Default ban timeout (nftables timeout format: s/m/h/d)
DDOS_BAN_TIMEOUT="1h"

# Log ban events
DDOS_BAN_LOG="true"
DDOS_BAN_LOG_PREFIX="NFTBAN_BAN:"

# =============================================================================
# END OF CLASSIC MODE CONFIGURATION
# =============================================================================
