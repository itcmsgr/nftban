<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTBan - Ban List</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
    <header>
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="nav-brand">NFTBan</div>
            <ul class="nav-menu">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li><a href="/ban-list.html" class="active" aria-current="page">Ban List</a></li>
                <li><a href="/metrics.html">Metrics</a></li>
                <li><span class="nav-user" id="nav-user" aria-label="Current user"></span></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Banned IP Addresses</h1>

        <!-- Search and Filter -->
        <div class="section">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search IP address..." aria-label="Search banned IPs">
            </div>
        </div>

        <!-- Statistics -->
        <div class="metrics-grid">
            <div class="metric-item">
                <div class="metric-label">Total Banned</div>
                <div id="total-banned" class="metric-value">Loading...</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Banned Today</div>
                <div id="banned-today" class="metric-value">Loading...</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Banned This Week</div>
                <div id="banned-week" class="metric-value">Loading...</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Active Rules</div>
                <div id="active-rules" class="metric-value">Loading...</div>
            </div>
        </div>

        <!-- Bulk Actions -->
        <div class="section">
            <div class="ban-list-actions">
                <button id="select-all-btn" class="btn btn-sm" onclick="toggleSelectAll()">Select All</button>
                <button id="bulk-unban-btn" class="btn btn-danger btn-sm" onclick="bulkUnban()" disabled>
                    Unban Selected (<span id="selected-count">0</span>)
                </button>
                <button class="btn btn-sm" onclick="exportList()">Export CSV</button>
            </div>
        </div>

        <!-- Ban List Table -->
        <div class="section">
            <div id="ban-list" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()" aria-label="Select all IPs"></th>
                            <th>IP Address</th>
                            <th>Reason</th>
                            <th>Banned At</th>
                            <th>Source</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ban-list-body">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    Showing <span id="showing-count">0</span> of <span id="total-count">0</span> banned IPs
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn btn-sm" onclick="loadPage(currentPage - 1)" disabled>Previous</button>
                    <button id="next-btn" class="btn btn-sm" onclick="loadPage(currentPage + 1)" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Load JavaScript -->
    <script src="/assets/js/session.js"></script>
    <script src="/assets/js/common.js"></script>
    <script>
        // Show username in nav
        const user = Session.getUser();
        document.getElementById('nav-user').textContent = `${user.username} (${user.role})`;

        let currentPage = 1;
        let pageSize = 50;
        let allBannedIPs = [];
        let filteredIPs = [];
        let selectedIPs = new Set();

        // Load banned IPs list
        async function loadBannedIPs() {
            try {
                const data = await API.get('/list');
                allBannedIPs = data.ips || [];
                filteredIPs = [...allBannedIPs];

                // Update statistics
                document.getElementById('total-banned').textContent = formatNumber(allBannedIPs.length);

                // For now, mock the time-based stats (requires backend support)
                document.getElementById('banned-today').textContent = '0';
                document.getElementById('banned-week').textContent = '0';
                document.getElementById('active-rules').textContent = formatNumber(allBannedIPs.length);

                // Reset pagination
                currentPage = 1;
                selectedIPs.clear();
                updateSelectedCount();

                // Display first page
                displayPage();

            } catch (error) {
                handleError(error, 'Failed to load banned IPs');
            }
        }

        // Display current page
        function displayPage() {
            const tbody = document.getElementById('ban-list-body');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageIPs = filteredIPs.slice(start, end);

            if (pageIPs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No banned IPs found</td></tr>';
                document.getElementById('showing-count').textContent = '0';
            } else {
                tbody.innerHTML = pageIPs.map(ip => {
                    const isSelected = selectedIPs.has(ip);
                    return `
                        <tr>
                            <td data-label="Select">
                                <input type="checkbox"
                                    class="ip-checkbox"
                                    value="${ip}"
                                    ${isSelected ? 'checked' : ''}
                                    onchange="toggleIPSelection('${ip}')"
                                    aria-label="Select ${ip}">
                            </td>
                            <td data-label="IP Address" class="ip-cell">${ip}</td>
                            <td data-label="Reason">Manual ban</td>
                            <td data-label="Banned At" class="timestamp-cell">-</td>
                            <td data-label="Source">Web GUI</td>
                            <td data-label="Actions">
                                <button
                                    onclick="unbanIP('${ip}')"
                                    class="btn btn-sm"
                                    aria-label="Unban IP address ${ip}"
                                    title="Unban ${ip}">
                                    Unban
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('showing-count').textContent = `${start + 1}-${Math.min(end, filteredIPs.length)}`;
            }

            document.getElementById('total-count').textContent = formatNumber(filteredIPs.length);

            // Update pagination buttons
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= filteredIPs.length;

            // Update select all checkbox
            updateSelectAllCheckbox();
        }

        // Load specific page
        function loadPage(page) {
            if (page < 1) return;
            const maxPage = Math.ceil(filteredIPs.length / pageSize);
            if (page > maxPage) return;

            currentPage = page;
            displayPage();
        }

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();

            if (searchTerm === '') {
                filteredIPs = [...allBannedIPs];
            } else {
                filteredIPs = allBannedIPs.filter(ip => ip.toLowerCase().includes(searchTerm));
            }

            currentPage = 1;
            displayPage();
        });

        // Toggle individual IP selection
        function toggleIPSelection(ip) {
            if (selectedIPs.has(ip)) {
                selectedIPs.delete(ip);
            } else {
                selectedIPs.add(ip);
            }
            updateSelectedCount();
            updateSelectAllCheckbox();
        }

        // Toggle select all
        function toggleSelectAll() {
            const checkbox = document.getElementById('select-all-checkbox');
            const pageIPs = getPageIPs();

            if (checkbox.checked) {
                pageIPs.forEach(ip => selectedIPs.add(ip));
            } else {
                pageIPs.forEach(ip => selectedIPs.delete(ip));
            }

            updateSelectedCount();
            displayPage();
        }

        // Get IPs on current page
        function getPageIPs() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            return filteredIPs.slice(start, end);
        }

        // Update select all checkbox state
        function updateSelectAllCheckbox() {
            const checkbox = document.getElementById('select-all-checkbox');
            const pageIPs = getPageIPs();
            const allSelected = pageIPs.length > 0 && pageIPs.every(ip => selectedIPs.has(ip));
            checkbox.checked = allSelected;
        }

        // Update selected count
        function updateSelectedCount() {
            const count = selectedIPs.size;
            document.getElementById('selected-count').textContent = count;
            document.getElementById('bulk-unban-btn').disabled = count === 0;
        }

        // Unban single IP
        async function unbanIP(ip) {
            if (!confirm(`Unban IP ${ip}?`)) return;

            try {
                await API.post('/unban', { ip });
                showNotification(`IP ${ip} unbanned successfully`, 'success');
                selectedIPs.delete(ip);
                loadBannedIPs();
            } catch (error) {
                handleError(error, 'Failed to unban IP');
            }
        }

        // Bulk unban
        async function bulkUnban() {
            const count = selectedIPs.size;
            if (count === 0) return;

            if (!confirm(`Unban ${count} selected IP${count > 1 ? 's' : ''}?`)) return;

            let succeeded = 0;
            let failed = 0;

            for (const ip of selectedIPs) {
                try {
                    await API.post('/unban', { ip });
                    succeeded++;
                } catch (error) {
                    console.error(`Failed to unban ${ip}:`, error);
                    failed++;
                }
            }

            if (succeeded > 0) {
                showNotification(`Successfully unbanned ${succeeded} IP${succeeded > 1 ? 's' : ''}`, 'success');
            }
            if (failed > 0) {
                showNotification(`Failed to unban ${failed} IP${failed > 1 ? 's' : ''}`, 'error');
            }

            selectedIPs.clear();
            loadBannedIPs();
        }

        // Export to CSV
        function exportList() {
            const csv = ['IP Address,Reason,Banned At,Source'];
            filteredIPs.forEach(ip => {
                csv.push(`${ip},Manual ban,-,Web GUI`);
            });

            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nftban-banned-ips-${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showNotification('Ban list exported successfully', 'success');
        }

        // Hide bulk actions for non-admin roles
        if (user.role === 'operator' || user.role === 'panel-user') {
            document.querySelector('.ban-list-actions').style.display = 'none';
            document.getElementById('select-all-checkbox').style.display = 'none';
            document.querySelectorAll('.ip-checkbox').forEach(cb => cb.style.display = 'none');
        }

        // Initial load
        loadBannedIPs();

        // Auto-refresh every 30 seconds
        autoRefresh(loadBannedIPs, 30);
    </script>
</body>
</html>
