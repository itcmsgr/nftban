# =============================================================================
# CMS / WEB APPLICATIONS
# =============================================================================
# Template for adding new CMS:
#   1. Copy a section below (e.g., JOOMLA)
#   2. Change SERVICE name (LOGIN_SERVICE_NEWCMS_*)
#   3. Update log paths, patterns, thresholds
#   4. Set appropriate RISK_MULTIPLIER and CONFIDENCE
#
# Confidence levels:
#   HIGH   = 1.3+ multiplier, low threshold (5), aggressive ban
#   MEDIUM = 0.8-1.0 multiplier, medium threshold (20-30), moderate ban
#   LOW    = 0.6-0.8 multiplier, high threshold (50+), short ban
# =============================================================================

# -----------------------------------------------------------------------------
# WORDPRESS XML-RPC (HIGH CONFIDENCE - Aggressive)
# -----------------------------------------------------------------------------
# Monitors: xmlrpc.php abuse (brute force, amplification attacks)
# Source: Apache/Nginx access logs
# Confidence: HIGH - xmlrpc abuse is rarely legitimate at scale
# NFTBan native [nftban-apache-xmlrpc] filter
#
# Why HIGH confidence:
#   - system.multicall allows 1000s of password attempts per request
#   - Legitimate xmlrpc usage is rare (REST API replaced it)
#   - Automated attacks target this endpoint specifically

LOGIN_SERVICE_WP_XMLRPC_ENABLED="true"

# Log sources (Apache/Nginx access logs)
LOGIN_SERVICE_WP_XMLRPC_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_WP_XMLRPC_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_WP_XMLRPC_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns
LOGIN_SERVICE_WP_XMLRPC_PATTERN_POST="POST.*/xmlrpc\\.php"
LOGIN_SERVICE_WP_XMLRPC_PATTERN_MULTICALL="system\\.multicall"
LOGIN_SERVICE_WP_XMLRPC_PATTERN_PINGBACK="pingback\\.ping"

# Thresholds (STRICT but safe - use .local to lower if needed)
LOGIN_SERVICE_WP_XMLRPC_FAIL_THRESHOLD="10"
LOGIN_SERVICE_WP_XMLRPC_FAIL_WINDOW="300"

# Ban durations (LONG - serious abuse)
LOGIN_SERVICE_WP_XMLRPC_BAN_SHORT="3600"
LOGIN_SERVICE_WP_XMLRPC_BAN_LONG="21600"

# Persistent offender (temp bans first, permanent only after many repeats)
LOGIN_SERVICE_WP_XMLRPC_PERM_THRESHOLD="5"
LOGIN_SERVICE_WP_XMLRPC_PERM_PERIOD="86400"

# Risk multiplier (HIGH confidence)
LOGIN_SERVICE_WP_XMLRPC_RISK_MULTIPLIER="1.3"
LOGIN_SERVICE_WP_XMLRPC_CONFIDENCE="high"

# -----------------------------------------------------------------------------
# WORDPRESS LOGIN (MEDIUM CONFIDENCE - Rate-Based)
# -----------------------------------------------------------------------------
# Monitors: wp-login.php request rate (velocity-based detection)
# Source: Apache/Nginx access logs
# Confidence: MEDIUM - cannot distinguish success/fail from access logs
# NFTBan native [nftban-apache-wp-login] filter
#
# Why MEDIUM confidence:
#   - HTTP 200/302 can be success OR failure
#   - Must use rate limiting, not success/fail detection
#   - Higher threshold to avoid false positives

LOGIN_SERVICE_WP_LOGIN_ENABLED="true"

# Log sources
LOGIN_SERVICE_WP_LOGIN_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_WP_LOGIN_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_WP_LOGIN_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns (rate-based, not success/fail)
LOGIN_SERVICE_WP_LOGIN_PATTERN_POST="POST.*/wp-login\\.php"
LOGIN_SERVICE_WP_LOGIN_PATTERN_GET="GET.*/wp-login\\.php"
LOGIN_SERVICE_WP_LOGIN_PATTERN_ADMIN="GET.*/wp-admin/.*\" 302"

# Exclude patterns (reduce false positives)
LOGIN_SERVICE_WP_LOGIN_EXCLUDE_AJAX="/wp-admin/admin-ajax\\.php"
LOGIN_SERVICE_WP_LOGIN_EXCLUDE_API="/wp-json/"
LOGIN_SERVICE_WP_LOGIN_EXCLUDE_CRON="/wp-cron\\.php"
LOGIN_SERVICE_WP_LOGIN_EXCLUDE_UPLOADS="/wp-content/uploads/"

# Thresholds (SAFE defaults - use .local to lower if needed)
LOGIN_SERVICE_WP_LOGIN_FAIL_THRESHOLD="50"
LOGIN_SERVICE_WP_LOGIN_FAIL_WINDOW="600"

# Ban durations (MODERATE)
LOGIN_SERVICE_WP_LOGIN_BAN_SHORT="1800"
LOGIN_SERVICE_WP_LOGIN_BAN_LONG="3600"

# Persistent offender (moderate escalation)
LOGIN_SERVICE_WP_LOGIN_PERM_THRESHOLD="5"
LOGIN_SERVICE_WP_LOGIN_PERM_PERIOD="86400"

# Risk multiplier (MEDIUM confidence)
LOGIN_SERVICE_WP_LOGIN_RISK_MULTIPLIER="0.8"
LOGIN_SERVICE_WP_LOGIN_CONFIDENCE="medium"

# -----------------------------------------------------------------------------
# JOOMLA ADMIN (MEDIUM CONFIDENCE - Rate-Based)
# -----------------------------------------------------------------------------
# Monitors: Joomla administrator login rate
# Source: Apache/Nginx access logs
# Confidence: MEDIUM - same rate-based approach as WordPress
# Gating: Auto-enabled when /administrator/ requests detected
#
# Joomla paths:
#   - /administrator/index.php (main admin login)
#   - /administrator/ (admin area)
#   - /index.php?option=com_users&view=login (frontend login)

LOGIN_SERVICE_JOOMLA_ENABLED="true"

# Log sources
LOGIN_SERVICE_JOOMLA_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_JOOMLA_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_JOOMLA_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns
LOGIN_SERVICE_JOOMLA_PATTERN_ADMIN="(POST|GET).*/administrator/index\\.php"
LOGIN_SERVICE_JOOMLA_PATTERN_LOGIN="POST.*/administrator/.*task=login"
LOGIN_SERVICE_JOOMLA_PATTERN_FRONTEND="POST.*/index\\.php\\?option=com_users.*login"

# Exclude patterns
LOGIN_SERVICE_JOOMLA_EXCLUDE_AJAX="/administrator/index\\.php\\?option=com_ajax"
LOGIN_SERVICE_JOOMLA_EXCLUDE_MEDIA="/media/"
LOGIN_SERVICE_JOOMLA_EXCLUDE_IMAGES="/images/"

# Thresholds (SAFE defaults - use .local to lower if needed)
LOGIN_SERVICE_JOOMLA_FAIL_THRESHOLD="40"
LOGIN_SERVICE_JOOMLA_FAIL_WINDOW="600"

# Ban durations
LOGIN_SERVICE_JOOMLA_BAN_SHORT="1800"
LOGIN_SERVICE_JOOMLA_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_JOOMLA_PERM_THRESHOLD="5"
LOGIN_SERVICE_JOOMLA_PERM_PERIOD="86400"

# Risk multiplier (admin area = higher value)
LOGIN_SERVICE_JOOMLA_RISK_MULTIPLIER="1.0"
LOGIN_SERVICE_JOOMLA_CONFIDENCE="medium"

# -----------------------------------------------------------------------------
# DRUPAL LOGIN (MEDIUM CONFIDENCE - Rate-Based)
# -----------------------------------------------------------------------------
# Monitors: Drupal user login rate
# Source: Apache/Nginx access logs
# Confidence: MEDIUM - rate-based detection
# Gating: Auto-enabled when /user/login requests detected
#
# Drupal paths:
#   - /user/login (main login)
#   - /user/register (registration - can be abused)
#   - /admin/ (admin area, requires login)

LOGIN_SERVICE_DRUPAL_ENABLED="true"

# Log sources
LOGIN_SERVICE_DRUPAL_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_DRUPAL_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_DRUPAL_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns
LOGIN_SERVICE_DRUPAL_PATTERN_LOGIN="POST.*/user/login"
LOGIN_SERVICE_DRUPAL_PATTERN_REGISTER="POST.*/user/register"
LOGIN_SERVICE_DRUPAL_PATTERN_ADMIN="(POST|GET).*/admin/.*\" 302"

# Exclude patterns
LOGIN_SERVICE_DRUPAL_EXCLUDE_AJAX="/ajax/"
LOGIN_SERVICE_DRUPAL_EXCLUDE_FILES="/sites/default/files/"
LOGIN_SERVICE_DRUPAL_EXCLUDE_API="/jsonapi/"

# Thresholds (SAFE defaults - use .local to lower if needed)
LOGIN_SERVICE_DRUPAL_FAIL_THRESHOLD="40"
LOGIN_SERVICE_DRUPAL_FAIL_WINDOW="600"

# Ban durations
LOGIN_SERVICE_DRUPAL_BAN_SHORT="1800"
LOGIN_SERVICE_DRUPAL_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_DRUPAL_PERM_THRESHOLD="5"
LOGIN_SERVICE_DRUPAL_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_DRUPAL_RISK_MULTIPLIER="1.0"
LOGIN_SERVICE_DRUPAL_CONFIDENCE="medium"

