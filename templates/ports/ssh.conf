# SSH Port Protection (CRITICAL - Always Allow)
# This ensures SSH remains accessible even if other rules fail
# Priority: HIGHEST (loaded first, applied before any DROP rules)

# Port: 22 (SSH)
# Protocol: TCP
# Direction: INPUT (incoming connections)
# Action: ACCEPT
# IPv4 and IPv6: Both enabled

# Configuration format: PORT|PROTOCOL|DIRECTION
# T = TCP, U = UDP
# I = INPUT, O = OUTPUT, F = FORWARD

22|T|I
