# NFTBan Fail2ban Jail - Apache Web Scanning Attacks
#
# Monitors Apache logs for reconnaissance and file enumeration attacks.
# Detects multiple 403/404 responses indicating scanning behavior.
#
# Configuration:
# - maxretry: 10 forbidden/not-found responses
# - findtime: 1 minute (60 seconds) - short window for rapid scans
# - bantime: 1 hour
#
# Uses custom NFTBan filter with wp-cron.php exclusion
# Based on DirectAdmin production configuration

[nftban-apache-scan]

# Disabled by default - enable if Apache is installed
enabled   = false

# HTTP/HTTPS ports
port      = http,https

# Use NFTBan custom scan detection filter
filter    = nftban-apache-scan

# Apache access log location (supports wildcards)
logpath   = /var/log/httpd/domains/*.log
            /var/log/apache2/domains/*.log
            /var/log/httpd/*access*.log
            /var/log/apache2/*access*.log

# Moderate threshold for scan detection
maxretry  = 10

# Short window to catch rapid scans
findtime  = 1m

# Short ban (1 hour)
bantime   = 1h

# Use NFTBan action
action    = nftban[name=apache-scan]
