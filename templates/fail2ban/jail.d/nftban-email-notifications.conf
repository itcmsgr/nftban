[DEFAULT]
# Global email settings
destemail = admin@yourdomain.com
sender = fail2ban@yourdomain.com

# Example 1: Full monitoring for SSH with all notifications
[sshd-full]
enabled = true
port = ssh
logpath = %(sshd_log)s
maxretry = 3
bantime = 86400

action = %(action_)s
         advanced-email[
             destemail="security@example.com",
             notify_start=true,
             notify_stop=true, 
             notify_ban=true,
             notify_unban=true,
             include_whois=true,
             include_nslookup=true,
             include_reverse_dns=true
         ]

# Example 2: Only ban notifications with minimal info
[sshd-basic]
enabled = true
port = ssh
logpath = %(sshd_log)s
maxretry = 3

action = %(action_)s
         advanced-email[
             destemail="alerts@example.com",
             notify_ban=true,
             notify_unban=false,
             include_whois=false,
             include_nslookup=true
         ]

# Example 3: Service monitoring with start/stop notifications
[nginx-404]
enabled = true
port = http,https
logpath = /var/log/nginx/access.log
maxretry = 5

action = %(action_)s
         advanced-email[
             destemail="webmaster@example.com",
             notify_start=true,
             notify_stop=true,
             notify_ban=true,
             notify_unban=false,
             include_whois=true
         ]

# Example 4: Critical service with all notifications
[ssh-ddos]
enabled = true
port = ssh
logpath = %(sshd_log)s
maxretry = 5
findtime = 300
bantime = 604800

action = %(action_)s
         advanced-email[
             destemail="critical@example.com",
             notify_start=true,
             notify_stop=true,
             notify_ban=true,
             notify_unban=true,
             include_whois=true,
             include_nslookup=true,
             include_reverse_dns=true
         ]
