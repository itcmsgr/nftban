2. Create the Dynamic Jail Generator Script
Create /usr/local/bin/generate-alert-jails.sh:

bash
#!/bin/bash

# Fail2Ban Alert Jail Generator
CONFIG_FILE="/etc/fail2ban/alert-config.conf"
JAIL_DIR="/etc/fail2ban/jail.d"
TEMP_DIR="/tmp/fail2ban-alerts"

# Create temporary directory
mkdir -p "$TEMP_DIR"

# Function to read config value
get_config() {
    local section="$1"
    local key="$2"
    local default="$3"
    
    value=$(awk -F= -v section="[$section]" -v key="$key" '
        $0 == section { in_section=1; next }
        in_section && /^\[/ { in_section=0; next }
        in_section && $1 == key { gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit }
    ' "$CONFIG_FILE" 2>/dev/null)
    
    echo "${value:-$default}"
}

# Read configuration values
DESTEMAIL=$(get_config "AlertSettings" "destemail" "root@localhost")
SENDER=$(get_config "AlertSettings" "sender" "fail2ban@localhost")
NOTIFY_START=$(get_config "AlertSettings" "notify_start" "true")
NOTIFY_STOP=$(get_config "AlertSettings" "notify_stop" "true")
INCLUDE_WHOIS=$(get_config "AlertSettings" "include_whois" "true")
ALERT_WHOIS=$(get_config "AlertSettings" "alert_include_whois_info" "true")

# Read alert types
ALERT_SYSTEM=$(get_config "AlertSettings" "alert_for_system_login" "false")
ALERT_SSH=$(get_config "AlertSettings" "alert_for_ssh_login" "false")
ALERT_SUDO=$(get_config "AlertSettings" "alert_for_sudo_usage" "false")
ALERT_ROOT=$(get_config "AlertSettings" "alert_for_root_login" "false")

# Read thresholds
MAXRETRY=$(get_config "AlertSettings" "maxretry" "1")
FINDTIME=$(get_config "AlertSettings" "findtime" "86400")

# Read custom emails
SSH_EMAIL=$(get_config "AlertSettings" "ssh_login_email" "$DESTEMAIL")
SUDO_EMAIL=$(get_config "AlertSettings" "sudo_usage_email" "$DESTEMAIL")
ROOT_EMAIL=$(get_config "AlertSettings" "root_login_email" "$DESTEMAIL")
SYSTEM_EMAIL=$(get_config "AlertSettings" "system_login_email" "$DESTEMAIL")

# Create alert-only action if it doesn't exist
cat > "$TEMP_DIR/alert-only.conf" << 'EOL'
[Definition]
actionstart = 
    if [ "%(<notify_start>s)" = "true" ]; then
        printf "Fail2Ban alert monitoring %(<name>)s started at %(timestamp)s\n" | 
        mail -s "Fail2Ban Alert: %(<name>)s monitoring started" "%(<destemail>)s"
    fi

actionstop = 
    if [ "%(<notify_stop>s)" = "true" ]; then
        printf "Fail2Ban alert monitoring %(<name>)s stopped at %(timestamp)s\n" | 
        mail -s "Fail2Ban Alert: %(<name>)s monitoring stopped" "%(<destemail>)s"
    fi

actionban = 
    IP=<ip>
    SUBJECT="ALERT: %(<name>)s event detected"
    BODY="SECURITY ALERT:\n\n"
    BODY="$BODY IP: $IP\n"
    BODY="$BODY Host: %(<host>)s\n"
    BODY="$BODY Service: %(<name>)s\n"
    BODY="$BODY Time: %(timestamp)s\n"
    BODY="$BODY Log: %(<logpath>)s\n"
    
    if [ "%(<include_whois>s)" = "true" ] && [ -x "$(command -v whois)" ]; then
        WHOIS=$(whois $IP 2>/dev/null | head -20)
        BODY="$BODY\nWhois Info:\n$WHOIS\n"
    fi
    
    printf "$BODY" | mail -s "$SUBJECT" "%(<destemail>)s"
    
    echo "Alert sent for %(<name>)s event from IP: $IP"

actionunban =
actioncheck =

[Init]
destemail = root@localhost
notify_start = true
notify_stop = true
include_whois = true
EOL

# Generate jail files based on configuration
echo "# Auto-generated Fail2Ban Alert Jails" > "$TEMP_DIR/99-alert-jails.conf"
echo "# Generated on $(date)" >> "$TEMP_DIR/99-alert-jails.conf"
echo "" >> "$TEMP_DIR/99-alert-jails.conf"

# SSH Login Alerts
if [ "$ALERT_SSH" = "true" ]; then
    cat >> "$TEMP_DIR/99-alert-jails.conf" << EOL
[ssh-login-alerts]
enabled = true
port = ssh
logpath = /var/log/auth.log
filter = sshd
maxretry = $MAXRETRY
findtime = $FINDTIME
bantime = -1
action = alert-only[destemail="$SSH_EMAIL", notify_start="$NOTIFY_START", notify_stop="$NOTIFY_STOP", include_whois="$ALERT_WHOIS"]

EOL
fi

# System Login Alerts
if [ "$ALERT_SYSTEM" = "true" ]; then
    cat >> "$TEMP_DIR/99-alert-jails.conf" << EOL
[system-login-alerts]
enabled = true
logpath = /var/log/auth.log
filter = system-login-success
maxretry = $MAXRETRY
findtime = $FINDTIME
bantime = -1
action = alert-only[destemail="$SYSTEM_EMAIL", notify_start="$NOTIFY_START", notify_stop="$NOTIFY_STOP", include_whois="$ALERT_WHOIS"]

EOL
fi

# Sudo Usage Alerts
if [ "$ALERT_SUDO" = "true" ]; then
    cat >> "$TEMP_DIR/99-alert-jails.conf" << EOL
[sudo-usage-alerts]
enabled = true
logpath = /var/log/auth.log
filter = sudo
maxretry = $MAXRETRY
findtime = $FINDTIME
bantime = -1
action = alert-only[destemail="$SUDO_EMAIL", notify_start="$NOTIFY_START", notify_stop="$NOTIFY_STOP", include_whois="$ALERT_WHOIS"]

EOL
fi

# Root Login Alerts
if [ "$ALERT_ROOT" = "true" ]; then
    cat >> "$TEMP_DIR/99-alert-jails.conf" << EOL
[root-login-alerts]
enabled = true
logpath = /var/log/auth.log
filter = sshd
failregex = ^%(__prefix_line)sAccepted .* for root from <H>
maxretry = $MAXRETRY
findtime = $FINDTIME
bantime = -1
action = alert-only[destemail="$ROOT_EMAIL", notify_start="$NOTIFY_START", notify_stop="$NOTIFY_STOP", include_whois="$ALERT_WHOIS"]

EOL
fi

# Deploy generated files
echo "Deploying generated configuration..."
cp "$TEMP_DIR/alert-only.conf" "/etc/fail2ban/action.d/alert-only.conf"
cp "$TEMP_DIR/99-alert-jails.conf" "$JAIL_DIR/99-alert-jails.conf"

# Set proper permissions
chmod 644 "/etc/fail2ban/action.d/alert-only.conf"
chmod 644 "$JAIL_DIR/99-alert-jails.conf"

echo "Configuration generated successfully!"
echo "Summary:"
echo " - SSH Login Alerts: $ALERT_SSH"
echo " - System Login Alerts: $ALERT_SYSTEM"
echo " - Sudo Usage Alerts: $ALERT_SUDO"
echo " - Root Login Alerts: $ALERT_ROOT"
echo ""
echo "Run 'sudo systemctl reload fail2ban' to apply changes"
