# =============================================================================
# NFTBan GEO Blacklist Configuration Template
# Version: init 1.0
# Template Name: geo-blacklist.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
#
# Description:
# This file contains a list of country codes (ISO 3166-1 alpha-2) to BLOCK.
# Used when GEO_BLOCKING_MODE="blacklist" in geo-blocking.conf
#
# Behavior:
# - This file is NEVER overwritten by NFTBan (user-managed)
# - Users may edit manually or via CLI: nftban geo block <COUNTRY>
# - Countries listed here will have ALL their IP ranges blocked
# - Changes take effect after: nftban geo reload
#
# Format:
# - One country code per line (2-letter ISO code)
# - Comments start with #
# - Empty lines ignored
# - Case insensitive (CN = cn = Cn)
#
# Priority:
# - Whitelist ALWAYS overrides blacklist
# - If country in both geo-whitelist.conf and geo-blacklist.conf → ALLOWED
#
# Commands:
# - Block country:   nftban geo block CN "reason"
# - Unblock country: nftban geo unblock CN
# - List blocked:    nftban geo list
# - Reload all:      nftban geo reload
#
# Warning:
# - DO NOT block countries where you have legitimate users!
# - DO NOT block your own country (use GEO_ALLOW_SERVER_COUNTRY="TRUE")
# - Research before adding - false positives affect entire countries
# - Keep this list MINIMAL - only proven attack sources
# - Review regularly - threat landscape changes
# =============================================================================

# =============================================================================
# HIGH-RISK COUNTRIES (Most Commonly Blocked)
# =============================================================================
# ⚠️  WARNING: These are EXAMPLES only!
# Do NOT blindly uncomment without researching your specific situation!
#
# Attack patterns vary by:
# - Your industry (finance, healthcare, retail, etc.)
# - Your geographic location
# - Your service type (web, email, SSH, etc.)
# - Current geopolitical situation
#
# Research YOUR logs before blocking!
# Command: nftban stats country
# =============================================================================

# EXAMPLES - UNCOMMENT ONLY IF RELEVANT TO YOUR SITUATION:

# CN  # China - High volume of automated attacks, but also huge legitimate user base
# RU  # Russia - Common source of attacks, but has legitimate users
# KP  # North Korea - Rare legitimate traffic, high risk
# IR  # Iran - Sanctioned in some regions, verify legal requirements
# VN  # Vietnam - Growing attack source
# BD  # Bangladesh - Significant bot activity
# PK  # Pakistan - High spam/attack volume
# IN  # India - Mixed - huge population, both legitimate and attack traffic

# =============================================================================
# TEMPORARY BLOCKS (During Active Attacks)
# =============================================================================
# Use this section for temporary blocks during ongoing attacks
# Add date and reason for each
# Review and remove after attack subsides
#
# Example format:
# XX  # Blocked: 2025-01-15 - DDoS attack from this region, remove after 7 days
# =============================================================================



