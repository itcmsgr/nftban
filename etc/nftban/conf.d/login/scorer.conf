# =============================================================================
#
# HOW THE SCORER WORKS:
# --------------------
# Each login failure detection adds points to the IP's score.
# When the score reaches a threshold, a ban is triggered.
#
# Example: SSH failed password (10 pts) x 5 attempts = 50 pts -> Temp Ban
#
# Score scale: 0-100+
# - 0-44:   No action (still tracking)
# - 45-64:  Temp ban (default 15 minutes)
# - 65-99:  Escalated ban (2h -> 4h -> 12h -> 24h)
# - 100+:   Permanent ban
#
# Scores decay over time (5 points every 5 minutes by default)
#
# =============================================================================

# NAMING CONVENTION NOTE:
# This file uses bare names (THRESHOLD_*, SCORE_DECAY_*, *_SCORE) without the
# LOGIN_ prefix used by other login config files. This is intentional because:
#   1. scorer.conf is consumed directly by Go internal/loginmon/module.go
#   2. Go parses these as typed config keys (not shell environment variables)
#   3. Renaming would break the Go module's config parser
# User overrides go in scorer.conf.local (same key names).

# -----------------------------------------------------------------------------
# BAN THRESHOLDS
# -----------------------------------------------------------------------------
# Score needed to trigger each ban level (scale: 0-100+)

# Temporary ban threshold (short duration)
THRESHOLD_TEMP_BAN="45"

# Escalation threshold (increasing durations)
THRESHOLD_ESCALATE="65"

# Permanent ban threshold
THRESHOLD_PERMANENT="100"

# -----------------------------------------------------------------------------
# BAN DURATIONS
# -----------------------------------------------------------------------------
# How long each ban lasts (Go duration format: 15m, 2h, 24h, etc.)

# Initial temporary ban duration
TEMP_BAN_DURATION="15m"

# Escalation durations are defined in code as: 2h, 4h, 12h, 24h
# These are applied progressively for repeat offenders

# -----------------------------------------------------------------------------
# SCORE DECAY
# -----------------------------------------------------------------------------
# Scores decay over time if no new failures are detected
# This allows IPs to recover from occasional mistakes

# How often to decay scores
SCORE_DECAY_INTERVAL="5m"

# Points to subtract per decay interval
SCORE_DECAY_AMOUNT="5"

# -----------------------------------------------------------------------------
# IP RETENTION
# -----------------------------------------------------------------------------
# How long to remember an IP after its last activity

# After this duration with score=0, IP data is cleaned up
IP_RETENTION_DURATION="24h"

# =============================================================================
# PER-SERVICE SCORE DELTAS
# =============================================================================
# How many points to add per detection for each service/reason
#
# TUNING GUIDE:
# - Lower scores = more attempts before ban
# - Higher scores = faster ban
# - Root/admin attempts typically get higher scores
# - Scanners (preauth disconnect) get high scores

# -----------------------------------------------------------------------------
# SSH SCORES
# -----------------------------------------------------------------------------
# SSH is typically the most attacked service

# Basic "Failed password for user" message
SSH_FAILED_PASSWORD_SCORE="10"

# "Invalid user" - attempting unknown users (enumeration)
SSH_INVALID_USER_SCORE="15"

# "Disconnected from ... preauth" - scanner behavior
SSH_PREAUTH_SCORE="20"

# "Too many authentication failures" - aggressive scanner
SSH_TOO_MANY_SCORE="30"

# Bonus points when attempting root login
SSH_ROOT_ATTEMPT_BONUS="10"

# -----------------------------------------------------------------------------
# MAIL SERVER SCORES
# -----------------------------------------------------------------------------
# Dovecot, Postfix, Exim authentication failures

# Dovecot IMAP/POP3 auth failure
DOVECOT_AUTH_FAIL_SCORE="15"

# Postfix SASL authentication failure
POSTFIX_SASL_SCORE="15"

# Exim authentication failure
EXIM_AUTH_FAIL_SCORE="15"

# -----------------------------------------------------------------------------
# FTP SCORES
# -----------------------------------------------------------------------------
# Pure-FTPd, vsftpd, ProFTPD authentication failures

# FTP authentication failure (any FTP server)
FTP_AUTH_FAIL_SCORE="15"

# -----------------------------------------------------------------------------
# CONTROL PANEL SCORES
# -----------------------------------------------------------------------------
# DirectAdmin, cPanel, Plesk login failures

# DirectAdmin admin/user login failure
DIRECTADMIN_LOGIN_SCORE="20"

# cPanel/WHM login failure
CPANEL_LOGIN_SCORE="20"

# Plesk login failure
PLESK_LOGIN_SCORE="20"

# -----------------------------------------------------------------------------
# WORDPRESS SCORES
# -----------------------------------------------------------------------------
# WordPress xmlrpc and wp-login attacks

# XML-RPC attack (often used for amplification/brute force)
WORDPRESS_XMLRPC_SCORE="25"

# wp-login.php brute force
WORDPRESS_WPLOGIN_SCORE="20"

# =============================================================================
# EXAMPLES
# =============================================================================
#
# Example 1: SSH brute force with 5 failed passwords
# -------------------------------------------------
# 5 x SSH_FAILED_PASSWORD_SCORE (10) = 50 pts
# 50 >= THRESHOLD_TEMP_BAN (45) -> 15 minute temp ban
#
# Example 2: SSH scanner trying invalid users + root
# -------------------------------------------------
# 2 x SSH_INVALID_USER_SCORE (15) = 30 pts
# 1 x SSH_ROOT_ATTEMPT_BONUS (10) = 10 pts
# 1 x SSH_PREAUTH_SCORE (20) = 20 pts
# Total: 60 pts -> Still temp ban range, but close to escalation
#
# Example 3: Multi-service attack (mail + ssh)
# -------------------------------------------------
# 2 x DOVECOT_AUTH_FAIL_SCORE (15) = 30 pts
# 2 x SSH_FAILED_PASSWORD_SCORE (10) = 20 pts
# Total: 50 pts -> Temp ban
#
# Example 4: Aggressive scanner
# -------------------------------------------------
# 3 x SSH_TOO_MANY_SCORE (30) = 90 pts
# 1 x SSH_PREAUTH_SCORE (20) = 20 pts
# Total: 110 pts -> PERMANENT BAN
#
# =============================================================================
# END OF SCORER CONFIGURATION
# =============================================================================
