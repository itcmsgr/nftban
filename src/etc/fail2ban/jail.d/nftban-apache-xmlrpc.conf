# NFTBan Fail2ban Jail - WordPress XML-RPC Attacks
#
# Monitors Apache logs for XML-RPC brute force attacks.
# XML-RPC is commonly targeted for WordPress password guessing.
#
# Configuration:
# - maxretry: 9 POST requests to xmlrpc.php
# - findtime: 20 minutes (1200 seconds)
# - bantime: 2 hours
#
# Uses custom NFTBan filter
# Based on DirectAdmin production configuration

[nftban-apache-xmlrpc]

# Disabled by default - enable if WordPress is hosted
enabled   = false

# HTTP/HTTPS ports
port      = http,https

# Use NFTBan custom XML-RPC filter
filter    = nftban-apache-xmlrpc

# Apache access log location (supports wildcards)
logpath   = /var/log/httpd/domains/*.log
            /var/log/apache2/domains/*.log
            /var/log/httpd/*access*.log
            /var/log/apache2/*access*.log

# Moderate threshold for XML-RPC
maxretry  = 9
findtime  = 20m

# Medium ban (2 hours)
bantime   = 2h

# Use NFTBan action
action    = nftban[name=apache-xmlrpc]
