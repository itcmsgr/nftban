# -----------------------------------------------------------------------------
# CPANEL/WHM (Control Panel) - HIGH CONFIDENCE
# -----------------------------------------------------------------------------
# Monitors: cPanel/WHM login failures
# Source: /usr/local/cpanel/logs/login_log
# Confidence: HIGH - control panel = high value target
# Gating: Auto-enabled when /usr/local/cpanel exists
#
# cPanel log paths:
#   - /usr/local/cpanel/logs/login_log (login events)
#   - /usr/local/cpanel/logs/access_log (HTTP access)
#   - /usr/local/cpanel/logs/error_log (errors)
#
# cPanel ports:
#   - 2082/2083 (cPanel HTTP/HTTPS)
#   - 2086/2087 (WHM HTTP/HTTPS)
#   - 2095/2096 (Webmail HTTP/HTTPS)

LOGIN_SERVICE_CPANEL_ENABLED="true"

# Log file paths
LOGIN_SERVICE_CPANEL_LOG="/usr/local/cpanel/logs/login_log"
LOGIN_SERVICE_CPANEL_ACCESS="/usr/local/cpanel/logs/access_log"
LOGIN_SERVICE_CPANEL_ERROR="/usr/local/cpanel/logs/error_log"
LOGIN_SERVICE_CPANEL_CPHULK="/usr/local/cpanel/logs/cphulkd.log"

# Detection patterns (login_log format: timestamp|ip|user|action|result)
LOGIN_SERVICE_CPANEL_PATTERN_FAILED="FAILED|failed|Invalid"
LOGIN_SERVICE_CPANEL_PATTERN_BRUTEFORCE="brute.*force|blocked|banned"
LOGIN_SERVICE_CPANEL_PATTERN_INVALID="invalid.*password|invalid.*user|unknown.*user"

# Thresholds (SAFE defaults - use .local to lower if needed)
LOGIN_SERVICE_CPANEL_FAIL_THRESHOLD="8"
LOGIN_SERVICE_CPANEL_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_CPANEL_BAN_SHORT="900"
LOGIN_SERVICE_CPANEL_BAN_LONG="3600"

# Persistent offender (strict for panel)
LOGIN_SERVICE_CPANEL_PERM_THRESHOLD="8"
LOGIN_SERVICE_CPANEL_PERM_PERIOD="86400"

# Risk multiplier (HIGH - control panel = critical)
LOGIN_SERVICE_CPANEL_RISK_MULTIPLIER="1.5"
LOGIN_SERVICE_CPANEL_CONFIDENCE="high"

# Gating markers (auto-detection)
LOGIN_SERVICE_CPANEL_MARKER_DIR="/usr/local/cpanel"
LOGIN_SERVICE_CPANEL_MARKER_BIN="/usr/local/cpanel/cpanel"

