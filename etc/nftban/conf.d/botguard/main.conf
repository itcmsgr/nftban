# =============================================================================
#
# HTTP Bot Guard uses a three-clock hybrid architecture:
#
#   Clock 1 (Kernel):  nft meter marks suspect IPs per-packet (zero-latency)
#   Clock 2 (Go):      Classification loop reads suspects, decides, enforces
#   Clock 3 (Shell):   Botscan batch pattern matching (10-minute cycles)
#
# Kernel DETECTS (suspect set) → Go DECIDES (allow/ban/grey) → Kernel ENFORCES
#
# =============================================================================

# -----------------------------------------------------------------------------
# MODULE CONTROL
# -----------------------------------------------------------------------------
# Enable HTTP Bot Guard module
# When disabled, kernel DDoS protection (ct count + rate meters) still active
HTTP_BOTGUARD_ENABLED="false"

# -----------------------------------------------------------------------------
# CLASSIFICATION LOOP (Clock 2 - Go Daemon)
# -----------------------------------------------------------------------------
# Normal interval: how often Go reads suspect set and classifies (seconds)
HTTP_BOT_FAST_LOOP_INTERVAL="60"

# Pressure interval: reduced interval when conntrack utilization > 70% (seconds)
HTTP_BOT_FAST_LOOP_PRESSURE_INTERVAL="40"

# -----------------------------------------------------------------------------
# HYSTERESIS THRESHOLDS (per IP connection count)
# -----------------------------------------------------------------------------
# Trip: start analyzing this IP
HTTP_BOT_TRIP_CONN="200"

# Clear: stop analyzing (gap = 50 prevents oscillation)
HTTP_BOT_CLEAR_CONN="150"

# Emergency: immediate block (sustained extreme abuse)
HTTP_BOT_EMERGENCY_CONN="500"

# -----------------------------------------------------------------------------
# KERNEL SUSPECT MARKING (nftables meter)
# -----------------------------------------------------------------------------
# These values are INFORMATIONAL — actual enforcement is in nft rules.
# Change these and run `nftban botguard reload` to regenerate nft fragment.
#
# Rate threshold: IPs exceeding this are added to suspect set
HTTP_BOT_SUSPECT_RATE="30/second"
HTTP_BOT_SUSPECT_BURST="60"

# Auto-expire suspects after this duration (nft timeout format)
HTTP_BOT_SUSPECT_TIMEOUT="5m"

# Meter name in nftables
HTTP_BOT_SUSPECT_METER="http_bot_meter"

# -----------------------------------------------------------------------------
# CLASSIFICATION TTLs (how long each decision lasts)
# -----------------------------------------------------------------------------
# Allow: verified good crawler (seconds)
HTTP_BOT_ALLOW_TTL="86400"

# Ban: confirmed bad bot (seconds, 96 hours)
HTTP_BOT_BAN_TTL="345600"

# Grey: suspicious, throttled via penalty ladder (seconds, 30 minutes)
HTTP_BOT_GREY_TTL="1800"

# Emergency: extreme pressure block (seconds, 30 minutes)
HTTP_BOT_EMERGENCY_TTL="1800"

# Pending: awaiting classification, light throttle (seconds)
HTTP_BOT_PENDING_TTL="60"

# -----------------------------------------------------------------------------
# AUTO-TUNING (Based on System Resources)
# -----------------------------------------------------------------------------
# Scale thresholds by CPU cores and RAM (same as DDoS classic auto-tune)
HTTP_BOT_AUTO_TUNE="true"

# Auto-tune scaling:
#   High  (4+ cores, 4+ GB): trip=300, clear=225, emergency=750
#   Medium (2+ cores, 2+ GB): trip=200, clear=150, emergency=500
#   Low   (<2 cores):         trip=100, clear=75,  emergency=250

# -----------------------------------------------------------------------------
# BATCH INTEGRATION (Clock 3 - Shell Botscan)
# -----------------------------------------------------------------------------
# Signal file written by shell botscan (JSONL format)
HTTP_BOT_BATCH_SIGNAL_FILE="/var/lib/nftban/botguard/batch_signals.jsonl"

# Batch interval (seconds, 10 minutes)
HTTP_BOT_BATCH_INTERVAL="600"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log level: DEBUG, INFO, WARN, ERROR
HTTP_BOT_LOG_LEVEL="INFO"

# Log classification decisions (allow/ban/grey transitions)
HTTP_BOT_LOG_DECISIONS="true"

# =============================================================================
# END OF HTTP BOT GUARD CONFIGURATION
# =============================================================================
