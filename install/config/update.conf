# Git repository location (where nftban was cloned)
NFTBAN_GIT_REPO="/opt/nftban"

# Git remote name
NFTBAN_GIT_REMOTE="origin"

# Git branch to track
NFTBAN_GIT_BRANCH="main"

# Number of backups to keep (before cleanup)
NFTBAN_UPDATE_BACKUP_COUNT="3"

# Cooldown period after auto-update failure (seconds)
# Default: 604800 (7 days). Set to 0 to disable.
NFTBAN_UPDATE_FAILURE_COOLDOWN="604800"

# Update log file location
# NFTBAN_UPDATE_LOG="/var/log/nftban/update.log"
