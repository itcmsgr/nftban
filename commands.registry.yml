firewall:
  category: infrastructure
  description: "Firewall structure validation, statistics, and log analysis"
  risk: advanced
  audience: [cli]
  capability: enforcement
  mutates: conditional
  supports_dry_run: false
  requires_root: conditional
  panel_expose: false
