# =============================================================================
# NFTBan - Login Alert Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# File: /etc/nftban/conf.d/login_alert.conf
# Purpose: Configure login monitoring and alerting
#
# meta:name="login_alert.conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:description="Configure login monitoring and alerting"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/login_alert.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# NOTE: Email recipient is configured globally in /etc/nftban/conf.d/mail.conf
#       using NFTBAN_MAIL_RECIPIENT - no need to configure email here!
#
# To override any setting, create /etc/nftban/conf.d/login_alert.conf.local
# and set your custom values there (they will override these defaults).
# =============================================================================

# =============================================================================
# MASTER SWITCH
# =============================================================================

# Enable/disable login monitoring (master switch)
# Default: false (must be explicitly enabled)
NFTBAN_LOGIN_ALERT_ENABLED="false"

# =============================================================================
# MONITORING TARGETS
# =============================================================================
# What login types to monitor
# Enable via CLI: nftban login enable ssh|su|sudo|console|all

# Monitor SSH logins (successful and failed)
# Default: false
NFTBAN_LOGIN_ALERT_SSH="false"

# Monitor su command usage
# Default: false
NFTBAN_LOGIN_ALERT_SU="false"

# Monitor sudo command usage
# Default: false
NFTBAN_LOGIN_ALERT_SUDO="false"

# Monitor console/TTY logins
# Default: false
NFTBAN_LOGIN_ALERT_CONSOLE="false"

# =============================================================================
# GEOIP ENRICHMENT
# =============================================================================

# Include GeoIP location information in alerts
# Requires: GeoIP database installed (/var/lib/nftban/geoip/)
# Default: true
NFTBAN_LOGIN_ALERT_GEOIP="true"

# =============================================================================
# EMAIL ALERT MODE
# =============================================================================
# How to send login alerts:
#   realtime - Send email immediately on each trigger (default)
#   digest   - Collect alerts and send daily summary only
#   both     - Send realtime alerts AND include in daily digest
# Default: realtime
NFTBAN_LOGIN_ALERT_MODE="realtime"

# Digest schedule time (only used when mode=digest or both)
# Format: HH:MM (24-hour)
# Default: 08:00 (8 AM)
NFTBAN_LOGIN_DIGEST_TIME="08:00"

# Digest data file (stores alerts for daily summary)
# Default: /var/lib/nftban/login_digest.json
NFTBAN_LOGIN_DIGEST_FILE="/var/lib/nftban/login_digest.json"

# =============================================================================
# ALERT FORMAT
# =============================================================================

# Email alert format: html or text
# Default: html
NFTBAN_LOGIN_ALERT_FORMAT="html"

# =============================================================================
# LOGGING
# =============================================================================

# Log file location for login events
# Default: /var/log/nftban/login_alert.log
NFTBAN_LOGIN_ALERT_LOG="/var/log/nftban/login_alert.log"

# =============================================================================
# MONITORING SETTINGS
# =============================================================================

# Interval between login checks (seconds)
# Lower values = more responsive but higher CPU
# Default: 5
NFTBAN_LOGIN_MONITOR_INTERVAL="5"

# =============================================================================
# WHITELIST
# =============================================================================

# IP addresses that won't trigger alerts (space-separated)
# Example: NFTBAN_LOGIN_WHITELIST="192.168.1.0/24 10.0.0.1"
# Default: empty
NFTBAN_LOGIN_WHITELIST=""

# =============================================================================
# FAILED LOGIN TRACKING & AUTO-BAN
# =============================================================================
# Default: 10 failures in 5 minutes = Auto-ban
# Same threshold applies to ALL services (SSH, Postfix, Dovecot, WordPress, etc.)

# Alert on failed login attempts
# Default: true
NFTBAN_LOGIN_ALERT_FAILED="true"

# Number of failed attempts before auto-ban
# Default: 10
NFTBAN_LOGIN_FAILED_THRESHOLD="10"

# Time window for counting failed attempts (seconds)
# Default: 300 (5 minutes)
NFTBAN_LOGIN_FAILED_WINDOW="300"

# =============================================================================
# PER-SERVICE THRESHOLD OVERRIDES (optional)
# =============================================================================
# Uncomment to customize thresholds for specific services:
#
# LOGIN_SERVICE_SSH_FAIL_THRESHOLD=3         # Stricter for SSH
# LOGIN_SERVICE_POSTFIX_FAIL_THRESHOLD=10    # More lenient for email
# LOGIN_SERVICE_DOVECOT_FAIL_THRESHOLD=10
# LOGIN_SERVICE_WORDPRESS_FAIL_THRESHOLD=10
# LOGIN_SERVICE_ROUNDCUBE_FAIL_THRESHOLD=10
# LOGIN_SERVICE_PUREFTPD_FAIL_THRESHOLD=5
# LOGIN_SERVICE_VSFTPD_FAIL_THRESHOLD=5
# LOGIN_SERVICE_PROFTPD_FAIL_THRESHOLD=5

# =============================================================================
# USAGE
# =============================================================================
#
# Quick Start (one command):
#   nftban login enable
#
# This will:
#   - Install the systemd service (if needed)
#   - Enable login monitoring
#   - Start monitoring SSH logins
#
# Commands:
#   nftban login enable          - Enable monitoring (auto-installs + SSH)
#   nftban login disable         - Disable monitoring
#   nftban login enable all      - Enable all monitoring (ssh, su, sudo)
#   nftban login enable ssh      - Enable SSH monitoring only
#   nftban login disable ssh     - Disable SSH only (keep others)
#   nftban login status          - Show current status
#   nftban login test            - Send a test alert
#   nftban login logs            - View recent logs
#
# For more help:
#   nftban login help
#
# =============================================================================
