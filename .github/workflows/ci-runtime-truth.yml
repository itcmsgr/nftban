# =============================================================================
# NFTBan — CI: Runtime Truth + Install Truth Gate (G-CI-1)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enforce the v1.98.2 correctness contract in CI.
#
# Gate sections:
#   G1  validate exit-code truth
#   G2  health failure-path resilience
#   G3  payload inventory truth
#   G4  payload summary logging
#   G5  source-install parity representative
#   G6  idempotency
#   G7  package non-regression (delegated to build-packages.yml)
#
# Forbidden patterns (any = automatic fail):
#   - validate error text with exit 0
#   - health bash trap / unbound / raw shell crash
#   - missing VERSION / nftables.conf / canonical logrotate after source install
# =============================================================================

name: Runtime Truth Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cli/**'
      - 'cmd/**'
      - 'internal/**'
      - 'install/**'
      - 'packaging/**'
      - 'VERSION'
      - '.github/workflows/ci-runtime-truth.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-runtime-truth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-truth:
    name: Runtime Truth (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            runner: ubuntu-24.04
            container: ''
          - label: almalinux-9
            runner: ubuntu-24.04
            container: almalinux:9
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install system dependencies (DEB)
        if: matrix.label == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq systemd util-linux coreutils

      - name: Install system dependencies (RPM)
        if: matrix.label == 'almalinux-9'
        run: |
          dnf -y install epel-release
          # Note: coreutils-single is preinstalled; omit coreutils to avoid
          # a file-conflict error on almalinux:9 minimal image.
          dnf -y install nftables jq systemd util-linux git tar gzip which procps-ng findutils sudo
          dnf -y install golang

      - name: Set up Go (DEB only — RPM uses dnf-installed)
        if: matrix.label == 'ubuntu-24.04'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      - name: Build binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin
          # For this gate we only need the binaries on the critical path
          # (validator + installer). nftban-core/nftband are stubbed below
          # to keep this job CGO-free.
          go build -trimpath -o bin/nftban-validate ./cmd/nftban-validate/
          go build -trimpath -o bin/nftban-installer ./cmd/nftban-installer/
          test -x bin/nftban-validate
          test -x bin/nftban-installer

      - name: Stage minimal source layout for validate + CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d /usr/lib/nftban/bin /usr/lib/nftban/cli /usr/lib/nftban/core \
                           /usr/lib/nftban/helpers /usr/lib/nftban/lib /usr/lib/nftban/data \
                           /usr/lib/nftban/health /etc/nftban /etc/logrotate.d
          sudo cp bin/nftban-validate /usr/lib/nftban/bin/nftban-validate
          sudo cp bin/nftban-installer /usr/lib/nftban/bin/nftban-installer
          # Stub the CGO-required binaries (nftban-core + nftband) so
          # VerifyInventory's required-files check passes. We only need
          # existence, not functionality, for the post-install assertion.
          sudo install -m 0755 /bin/true /usr/lib/nftban/bin/nftban-core
          sudo install -m 0755 /bin/true /usr/lib/nftban/bin/nftband
          sudo cp -r cli/lib/nftban/* /usr/lib/nftban/
          sudo cp cli/sbin/nftban /usr/sbin/nftban
          sudo chmod 0750 /usr/sbin/nftban
          sudo cp VERSION /usr/lib/nftban/VERSION
          # Minimum config + logrotate so inventory assertion would pass on
          # a source install (used for G5/G6 sanity only; G3 tampers with it).
          sudo cp install/config/nftban.conf /etc/nftban/nftban.conf 2>/dev/null || echo "# placeholder" | sudo tee /etc/nftban/nftban.conf >/dev/null
          sudo cp install/nftables/nftables.conf /etc/nftban/nftables.conf 2>/dev/null || echo "# placeholder" | sudo tee /etc/nftban/nftables.conf >/dev/null
          sudo cp install/config/nftban.logrotate /etc/logrotate.d/nftban

      # ------------------------------------------------------------------
      # G1: validate exit-code truth
      # ------------------------------------------------------------------
      - name: G1 — validate exit non-zero on forced validator error
        shell: bash
        run: |
          set -Eeuo pipefail
          # Shim nft so it exits non-zero → validator reports Status: ERROR /
          # StatusDown. The shell CLI MUST translate that into a non-zero exit.
          sudo mv /usr/sbin/nft /usr/sbin/nft.real 2>/dev/null || mv /usr/sbin/nft /usr/sbin/nft.real
          sudo tee /usr/sbin/nft >/dev/null <<'NFT'
          #!/bin/bash
          echo "nft: G1 simulated failure" >&2
          exit 1
          NFT
          sudo chmod +x /usr/sbin/nft

          RC=0
          sudo -E nftban validate || RC=$?
          echo "G1 observed exit code: $RC"

          # Restore nft before evaluating so later gates get a clean tool.
          sudo mv /usr/sbin/nft.real /usr/sbin/nft

          if [[ "$RC" -eq 0 ]]; then
            echo "::error::G1 FAIL: nftban validate returned 0 while validator was broken"
            exit 1
          fi
          echo "G1 PASS"

      # ------------------------------------------------------------------
      # G2: health failure-path resilience (no trap crash)
      # ------------------------------------------------------------------
      - name: G2 — health survives validator failure (no bash trap)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mv /usr/sbin/nft /usr/sbin/nft.real
          sudo tee /usr/sbin/nft >/dev/null <<'NFT'
          #!/bin/bash
          echo "nft: G2 simulated failure" >&2
          exit 1
          NFT
          sudo chmod +x /usr/sbin/nft

          RC=0
          OUT=$(sudo -E nftban health check 2>&1) || RC=$?
          echo "--- health check output ---"
          echo "$OUT"
          echo "--- end ---"

          sudo mv /usr/sbin/nft.real /usr/sbin/nft

          # Forbidden patterns — any match is automatic fail.
          if echo "$OUT" | grep -qE 'ERROR: Script failed|Function: nftban_health_cmd_truth|line:|unbound variable'; then
            echo "::error::G2 FAIL: bash trap or unbound-variable crash detected"
            exit 1
          fi
          if [[ "$RC" -eq 0 ]]; then
            echo "::error::G2 FAIL: health check returned 0 while validator was broken"
            exit 1
          fi
          echo "G2 PASS"

      # ------------------------------------------------------------------
      # G3: payload inventory truth
      # ------------------------------------------------------------------
      - name: G3 — payload_inventory_ok fails when required artifact missing
        shell: bash
        run: |
          set -Eeuo pipefail
          # Run the inventory assertion unit test under the native Go toolchain.
          # This exercises the exact code path phaseValidate uses in production.
          go test -run 'TestRunAssertions_PayloadInventoryMissing' -v ./internal/installer/validate/...
          echo "G3 PASS"

      # ------------------------------------------------------------------
      # G4: payload summary logging (category totals visible at INFO)
      # ------------------------------------------------------------------
      - name: G4 — payload summary log format present in source
        shell: bash
        run: |
          set -Eeuo pipefail
          # Structural check: the category-totals line must exist in the
          # Go source as a declared log format. Invoking a real source
          # install in CI would require a writable sandbox we don't have
          # in a container job — the unit test suite covers the dynamic
          # code path. Here we just lock in the log format contract.
          if ! grep -q 'payload: category=' internal/installer/payload/payload.go; then
            echo "::error::G4 FAIL: payload category-summary log format missing"
            exit 1
          fi
          echo "G4 PASS (structural) — log format declared in payload.go"

      # ------------------------------------------------------------------
      # G5: source-install parity representative
      # ------------------------------------------------------------------
      - name: G5 — source install end-state includes required artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          REQUIRED=(
            /usr/sbin/nftban
            /usr/lib/nftban/bin/nftban-validate
            /usr/lib/nftban/bin/nftban-installer
            /usr/lib/nftban/VERSION
            /etc/nftban/nftban.conf
            /etc/nftban/nftables.conf
            /etc/logrotate.d/nftban
          )
          MISSING=0
          for p in "${REQUIRED[@]}"; do
            if ! sudo test -e "$p"; then
              echo "::error::G5: missing $p"
              MISSING=$((MISSING+1))
            fi
          done
          # /usr/sbin/nftban must be 0750.
          MODE=$(sudo stat -c '%a' /usr/sbin/nftban 2>/dev/null || echo '')
          if [[ "$MODE" != "750" ]]; then
            echo "::error::G5: /usr/sbin/nftban mode=$MODE, expected 750"
            MISSING=$((MISSING+1))
          fi
          if (( MISSING > 0 )); then
            echo "::error::G5 FAIL: $MISSING required artifact(s) missing or wrong mode"
            exit 1
          fi
          echo "G5 PASS"

      # ------------------------------------------------------------------
      # G6: idempotency
      # ------------------------------------------------------------------
      - name: G6 — payload stage is idempotent (no rewrites on second pass)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Run payload idempotency Go test — directly exercises copyIfChanged
          # identity behaviour used by StageAll.
          go test -run 'TestCopyIfChanged_IdenticalContent|TestStageAll_OperatorConfigPreserved' -v ./internal/installer/payload/...
          echo "G6 PASS"

      # ------------------------------------------------------------------
      # G7: package non-regression (advisory — real enforcement in build-packages.yml)
      # ------------------------------------------------------------------
      - name: G7 — advisory notice
        shell: bash
        run: |
          echo "G7 enforcement lives in .github/workflows/build-packages.yml"
          echo "(RPM + DEB build + install matrix must also stay green for merge)"

      # ------------------------------------------------------------------
      # G8: PKG-EFFECTIVE-PARITY L4 tmpfiles-managed coverage (Slot 5 / row 14)
      # ------------------------------------------------------------------
      # Runtime Truth runs on real OS images with full systemd. This step
      # verifies the 6 tmpfiles-managed critical paths (which Test RPM/DEB
      # install jobs in build-packages.yml cannot reliably exercise inside
      # vanilla Docker without systemd PID 1).
      #
      # Path-set coverage:
      #   - /run/nftban (0755 nftban:nftban)
      #   - /var/cache/nftban (0755 nftban:nftban)
      #   - /var/lib/nftban (0750 root:nftban)
      #   - /var/lib/nftban/reports/auditors (0770 root:nftban-auditor)
      #   - /var/log/nftban (0750 nftban:nftban)
      #   (Note: /var/lib/nftban/community is package-shipped, NOT tmpfiles —
      #   asserted in build-packages.yml Test * install jobs)
      - name: G8 — PKG-EFFECTIVE-PARITY L4 tmpfiles parity (real-systemd)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== G8: tmpfiles-managed path parity ==="

          # Slot 5b Stage 1 diagnostics — V107_G8_AUDITOR_DIR_UBUNTU_SCOPE.md.
          # Captures evidence for Ubuntu-vs-AlmaLinux divergence on
          # /var/lib/nftban/reports/auditors creation. Pure additive diagnostic
          # output; final assertions are NOT weakened.
          echo "--- diag.0: runner+systemd version banners ---"
          uname -a || true
          if [ -r /etc/os-release ]; then . /etc/os-release && echo "OS: $PRETTY_NAME ($ID $VERSION_ID)" || true; fi
          systemd --version 2>&1 | head -2 || true
          systemd-tmpfiles --version 2>&1 | head -2 || echo "(systemd-tmpfiles --version not supported)"

          # ─────────────────────────────────────────────────────────────────
          # PATH-CLARITY: NFTBan has THREE files named `nftban.conf` in
          # different namespaces. Their authority and meaning differ; the
          # directory is the namespace.
          #
          #   /etc/nftban/nftban.conf
          #     → NFTBan APPLICATION config (operator-editable runtime config).
          #     → THIS WORKFLOW DOES NOT TOUCH /etc/nftban/nftban.conf except
          #       in the source-install staging block above (G1-G6 setup);
          #       it is NOT what this G8 step exercises.
          #
          #   install/systemd/sysusers.d/nftban.conf  →  /usr/lib/sysusers.d/nftban.conf
          #     → systemd IDENTITY recipe (declares nftban + nftban-auditor groups
          #       and the nftban user). Generated from build/fhs-spec.yaml.
          #
          #   install/systemd/tmpfiles.d/nftban.conf  →  /usr/lib/tmpfiles.d/nftban.conf
          #     → systemd DIRECTORY recipe (declares /var/lib/nftban/reports*,
          #       /run/nftban, /var/cache/nftban, /var/log/nftban with mode +
          #       owner). Generated from build/fhs-spec.yaml.
          #
          # G8 below tests that the installed (sysusers + tmpfiles) recipes
          # produce the expected on-disk state. It does NOT test
          # /etc/nftban/nftban.conf.
          # ─────────────────────────────────────────────────────────────────

          # 1. Create system users/groups via groupadd/useradd.
          # Note: an earlier Stage 2 attempt (PR #579 commit 1e4bf69e, since
          # reverted) tried `systemd-sysusers install/systemd/sysusers.d/nftban.conf`
          # to align CI with the runtime authority model. That attempt failed
          # because the shipped sysusers.d/nftban.conf currently has GECOS
          # strings on `g` lines — a syntax `systemd-sysusers` rejects on both
          # systemd 252 (AlmaLinux) and 255 (Ubuntu). Production DEB postinst
          # uses groupadd/useradd directly (build_nftban.sh:837-852) and does
          # not invoke systemd-sysusers, so the malformed file is dormant in
          # production. That sysusers.d defect is tracked separately
          # (proposed worklog row SYSUSERS-GECOS-G-LINES) and is NOT in scope
          # for this G8 diagnostic step. We use groupadd/useradd here to keep
          # Stage 1's working baseline so the original Bucket-E systemd 255
          # symptom on /var/lib/nftban/reports/auditors remains observable
          # under the SYSTEMD_LOG_LEVEL=debug capture below.
          sudo getent group nftban >/dev/null 2>&1 || sudo groupadd --system nftban
          sudo getent group nftban-auditor >/dev/null 2>&1 || sudo groupadd --system nftban-auditor
          sudo getent group suricata >/dev/null 2>&1 || sudo groupadd --system suricata
          sudo getent passwd nftban >/dev/null 2>&1 || \
            sudo useradd --system --gid nftban --groups nftban-auditor \
              --home-dir /var/lib/nftban --no-create-home --shell /usr/sbin/nologin nftban

          echo "--- diag.1: identity resolution (after groupadd/useradd) ---"
          echo "getent group nftban:           $(getent group nftban || echo '<unresolved>')"
          echo "getent group nftban-auditor:   $(getent group nftban-auditor || echo '<unresolved>')"
          echo "getent passwd nftban:          $(getent passwd nftban || echo '<unresolved>')"
          echo "/etc/group nftban entries:"
          grep -E "^nftban|^nftban-auditor|^nftban-panel|^suricata" /etc/group || echo "  (no nftban entries in /etc/group)"
          echo "/etc/passwd nftban entries:"
          grep -E "^nftban" /etc/passwd || echo "  (no nftban entries in /etc/passwd)"
          if command -v systemd-userdbd >/dev/null 2>&1 || systemctl list-unit-files systemd-userdbd.service >/dev/null 2>&1; then
            echo "systemd-userdbd: present (may cache identity resolution differently than nss-files)"
          fi
          if command -v userdbctl >/dev/null 2>&1; then
            userdbctl group nftban-auditor 2>&1 | head -5 || true
          fi

          # 2. Stage tmpfiles config (single source of truth)
          sudo install -m 0644 install/systemd/tmpfiles.d/nftban.conf /usr/lib/tmpfiles.d/nftban.conf
          echo "--- diag.2: tmpfiles.d/nftban.conf staged at /usr/lib/tmpfiles.d/nftban.conf ---"
          echo "auditor-related lines in staged config:"
          grep -n "reports" /usr/lib/tmpfiles.d/nftban.conf || true

          # 3. Run systemd-tmpfiles --create with verbose diagnostics if supported.
          # Probe --debug and --cat-config support; fall back to plain --create on
          # versions that don't accept the verbose flags. Capture all output via
          # tee to a known artifact path so the next step can stat against it.
          echo "--- diag.3: systemd-tmpfiles --create (with verbose probes) ---"
          tmpfiles_supports_debug=0
          if sudo systemd-tmpfiles --help 2>&1 | grep -q -- "--debug"; then
            tmpfiles_supports_debug=1
          fi
          tmpfiles_supports_cat=0
          if sudo systemd-tmpfiles --help 2>&1 | grep -q -- "--cat-config"; then
            tmpfiles_supports_cat=1
          fi
          echo "--debug supported: $tmpfiles_supports_debug; --cat-config supported: $tmpfiles_supports_cat"

          if [ "$tmpfiles_supports_cat" = "1" ]; then
            echo "--- diag.3a: cat-config view ---"
            sudo systemd-tmpfiles --cat-config /usr/lib/tmpfiles.d/nftban.conf 2>&1 | grep -E "reports|auditors" | head -10 || true
          fi

          tmpfiles_args=("--create")
          if [ "$tmpfiles_supports_debug" = "1" ]; then
            tmpfiles_args=(--debug "${tmpfiles_args[@]}")
          fi
          # Slot 5b Stage 1.5 — SYSTEMD_LOG_LEVEL=debug exposes the per-line
          # processing trace inside systemd-tmpfiles. systemd-tmpfiles itself
          # has no --debug CLI flag (we keep the probe above for older systemd
          # versions that may add one); the canonical way to make it verbose
          # is the env var, set per-call via `sudo VAR=value cmd` syntax.
          # Goal: capture the per-rule decision systemd 255 makes for the
          # /var/lib/nftban/reports* subtree on Ubuntu 24.04 (Stage 1 evidence
          # showed the leaf is silently missing post-call with exit=0 and
          # zero log output — debug should make the silent skip visible).
          tmpfiles_rc=0
          sudo SYSTEMD_LOG_LEVEL=debug systemd-tmpfiles "${tmpfiles_args[@]}" /usr/lib/tmpfiles.d/nftban.conf 2>&1 \
            | sudo tee /tmp/g8-tmpfiles.log \
            || tmpfiles_rc=$?
          echo "--- diag.3b: systemd-tmpfiles exit=$tmpfiles_rc, log size=$(sudo wc -l < /tmp/g8-tmpfiles.log) lines ---"
          if [ "$tmpfiles_rc" != "0" ]; then
            echo "::warning::G8 systemd-tmpfiles exited $tmpfiles_rc; full log captured at /tmp/g8-tmpfiles.log"
          fi

          # 4. Diagnostic stat of the parent + leaf BEFORE the assertion loop.
          # Reveals whether the auditor dir was skipped entirely or created with
          # wrong owner/mode.
          echo "--- diag.4: post-tmpfiles stat (parent + leaf) ---"
          # Slot 5b Stage 2-F (Bucket F fix): wrap path-existence tests with
          # `sudo` because /var/lib/nftban is 0750 root:nftban and the runner
          # user is not in the nftban group on the bare Ubuntu 24.04 runner.
          # Without sudo, the runner-user `[ -d ]` test cannot traverse the
          # parent and falsely reports MISSING for /var/lib/nftban/reports*.
          # AlmaLinux 9 PASSed without sudo only because the container job
          # runs as root (which bypasses POSIX mode checks). systemd-tmpfiles
          # itself created the directories correctly on both — the test was
          # the broken thing, not the product.
          for p in /var/lib/nftban /var/lib/nftban/reports /var/lib/nftban/reports/auditors; do
            if sudo test -d "$p"; then
              echo "$(sudo stat -c '%n: type=dir mode=%a owner=%U:%G uid=%u gid=%g' "$p")"
            elif sudo test -e "$p"; then
              echo "$p: type=non-directory ($(sudo stat -c '%F' "$p"))"
            else
              echo "$p: MISSING (does not exist)"
            fi
          done
          echo "--- diag.4b: lines in tmpfiles log mentioning auditors/reports ---"
          sudo grep -E "reports|auditors|nftban-auditor|skip|ignor|Failed|fail|denied|invalid" /tmp/g8-tmpfiles.log 2>/dev/null \
            | head -40 || echo "(no relevant lines in tmpfiles log)"

          # 5. Assert each of the 6 tmpfiles-managed critical paths (UNCHANGED).
          # Diagnostics above are purely additive; the contract this step enforces
          # is identical to before — failure on missing/mismatched dirs.
          fail=0
          # Format: path|expected_mode|expected_owner|expected_group
          for entry in \
              "/run/nftban|0755|nftban|nftban" \
              "/var/cache/nftban|0755|nftban|nftban" \
              "/var/lib/nftban|0750|root|nftban" \
              "/var/lib/nftban/reports/auditors|0770|root|nftban-auditor" \
              "/var/log/nftban|0750|nftban|nftban" \
          ; do
            IFS='|' read -r p exp_mode exp_owner exp_group <<< "$entry"
            # Slot 5b Stage 2-F: sudo-wrap path-existence + stat checks.
            # See diag.4 comment block above — same Bucket F mechanism. The
            # 5-path mode/owner/group contract below is unchanged; only the
            # privilege context of the verifier changes so it can traverse
            # the 0750 root:nftban parent.
            if ! sudo test -d "$p"; then
              echo "::error::G8 missing dir: $p"
              fail=1
              continue
            fi
            actual_mode=$(sudo stat -c '%a' "$p")
            [[ ${#actual_mode} -eq 3 ]] && actual_mode="0$actual_mode"
            actual_owner=$(sudo stat -c '%U' "$p")
            actual_group=$(sudo stat -c '%G' "$p")
            if [[ "$actual_mode" != "$exp_mode" || "$actual_owner" != "$exp_owner" || "$actual_group" != "$exp_group" ]]; then
              echo "::error::G8 mismatch on $p"
              echo "::error::  expected: $exp_mode $exp_owner:$exp_group"
              echo "::error::  observed: $actual_mode $actual_owner:$actual_group"
              fail=1
            else
              echo "[PASS] $p: $actual_mode $actual_owner:$actual_group"
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "G8 PASS: tmpfiles-managed path parity verified on real systemd"

      # ------------------------------------------------------------------
      # G9: nftban-core-geoip.service runtime-fatal-trace assertion (#525)
      # ------------------------------------------------------------------
      # Slot 7 / Lane G regression guard. Closes #525 silent-recurrence:
      # the geoip service emitted a Go runtime fatal trace
      # ("runtime.(*cleanupQueue)..." with status=2/INVALIDARGUMENT) at
      # startup on a canonical install. No CI step previously asserted
      # geoip startup was crash-free, so the panic class could recur
      # silently on any change to the unit file, the Go binary, or the
      # maxminddb-golang dependency.
      #
      # Contract: invoking the geoip updater (via real systemd on the
      # ubuntu-24.04 leg, or directly on the alma9 container leg where
      # systemd PID 1 is unavailable) MUST NOT emit any of the documented
      # Go runtime fatal-trace patterns. Normal command failure caused by
      # network / config / download conditions is tolerated as long as no
      # fatal trace appears in the captured output.
      - name: G9 — nftban-core-geoip startup runtime-fatal-trace assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== G9: nftban-core-geoip runtime-fatal-trace assertion (#525) ==="

          # Build the real nftban-core binary. Earlier setup (line 111)
          # stubbed /usr/lib/nftban/bin/nftban-core with /bin/true to keep
          # G1-G8 CGO-free; G9 needs the real binary. nftban-core +
          # github.com/oschwald/maxminddb-golang are pure Go (no CGO).
          go build -trimpath -o bin/nftban-core ./cmd/nftban-core/
          sudo install -m 0755 bin/nftban-core /usr/lib/nftban/bin/nftban-core

          # Stage the systemd unit so systemctl can resolve it on the
          # ubuntu-24.04 leg (real systemd PID 1).
          sudo mkdir -p /etc/systemd/system
          sudo install -m 0644 install/systemd/nftban-core-geoip.service \
                                /etc/systemd/system/nftban-core-geoip.service

          # Detect whether systemd PID 1 is available. ubuntu-24.04 runner
          # has it; almalinux:9 container does not (PID 1 is the runner
          # agent, not systemd). systemctl daemon-reload returns non-zero
          # when there is no D-Bus to systemd; we use that as the probe.
          have_systemd=0
          if sudo systemctl daemon-reload 2>/dev/null; then
            have_systemd=1
          fi
          echo "systemd PID 1 available: $have_systemd"

          output_file=/tmp/g9-output.log
          : > "$output_file"
          rc=0

          if [ "$have_systemd" = "1" ]; then
            # Path A: real systemd. Apply unit verbatim, capture journal.
            echo "--- G9 path A: systemctl start nftban-core-geoip.service ---"
            sudo systemctl start nftban-core-geoip.service 2>&1 \
              | sudo tee -a "$output_file" \
              || rc=$?
            sudo journalctl -u nftban-core-geoip.service --no-pager 2>&1 \
              | sudo tee -a "$output_file" \
              || true
          else
            # Path B: no systemd PID 1 (alma9 container). Run the binary
            # directly under prlimit --nproc=64 to mirror TasksMax=64.
            # The fatal-trace assertion is the contract; the unit's
            # full sandbox cannot be applied here, but the runtime path
            # the panic class follows (clone(2) under cgroup pids limit
            # in #525, runtime cleanup-queue interaction generally) is
            # still exercised by running the binary through `geoip
            # update`. Network/download failure is tolerated.
            echo "--- G9 path B: direct exec under prlimit --nproc=64 ---"
            sudo prlimit --nproc=64 -- /usr/lib/nftban/bin/nftban-core geoip update 2>&1 \
              | sudo tee -a "$output_file" \
              || rc=$?
          fi

          echo "G9 nftban-core-geoip exit=$rc, output captured at $output_file"
          echo "--- output (last 80 lines) ---"
          sudo tail -80 "$output_file" || true
          echo "--- end ---"

          # Assert NO Go runtime fatal trace patterns. These are the
          # signatures the #525 reproduction emitted (and adjacent
          # signatures the runtime emits on related fatal paths).
          fatal_patterns=(
            'runtime\.fatalpanic'
            'runtime\.gopanic'
            'runtime\.\(\*cleanupQueue\)'
            'fatal error:'
            '^panic:'
            'goroutine 1 \[running\]:'
          )
          fail=0
          for pat in "${fatal_patterns[@]}"; do
            if sudo grep -E -q "$pat" "$output_file"; then
              echo "::error::G9 FAIL: Go runtime fatal trace detected: pattern=$pat"
              echo "::error::  matching lines:"
              sudo grep -E -n "$pat" "$output_file" | head -5 \
                | sed 's/^/::error::    /' || true
              fail=1
            fi
          done

          if [ "$fail" = "1" ]; then
            echo "::error::G9 FAIL — see #525; geoip emitted Go runtime fatal trace"
            exit 1
          fi

          # Tolerate non-zero exit codes when no fatal trace was found.
          # Network/download/config failures produce fmt.Errorf strings
          # (exit 1) which is acceptable in this CI environment; the
          # contract this step enforces is "no Go runtime fatal trace,"
          # not "successful download."
          echo "G9 PASS: no Go runtime fatal trace in geoip startup output (exit=$rc)"

      # ------------------------------------------------------------------
      # G10: install/systemd/sysusers.d/nftban.conf parse-validation
      # ------------------------------------------------------------------
      # Row 16 ONE-SHOT regression guard. Closes the SYSUSERS-GECOS-G-LINES
      # dormant defect: prior generator emitted `g name - "comment"` which
      # systemd-sysusers rejects ("Lines of type 'g' don't take a GECOS
      # field") on systemd 252 (AlmaLinux 9), 255 (Ubuntu 24.04), and 259
      # (verified locally during the fix). Production never noticed
      # because postinst uses groupadd directly, not systemd-sysusers —
      # but the shipped file was syntactically invalid and any future
      # operator running `systemd-sysusers --replace=…` would have hit it.
      #
      # Contract: `systemd-sysusers --dry-run` MUST exit 0 on the shipped
      # file. --dry-run parses + would-create messages without touching
      # /etc/{passwd,group,shadow}. Runs on both systemd-252-class
      # (AlmaLinux 9 container) and systemd-255-class (ubuntu-24.04
      # runner) legs.
      - name: G10 — sysusers.d/nftban.conf parse-validation (row 16 one-shot guard)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== G10: systemd-sysusers parse-validation ==="

          which systemd-sysusers
          systemd-sysusers --version 2>&1 | head -1

          # Resolve the sysusers file to an absolute path. `sudo` runs
          # systemd-sysusers with a sanitized environment, so a relative
          # path is resolved against root's CWD (or simply not found),
          # not the runner's CWD — observed on both ubuntu-24.04 (systemd
          # 255) and almalinux-9 container (systemd 252) as
          # "Failed to open 'install/systemd/sysusers.d/nftban.conf',
          #  ignoring: No such file or directory" with exit=1. Using
          # $GITHUB_WORKSPACE keeps this a source-tree parse-validation;
          # we deliberately do NOT install the file into /usr/lib/sysusers.d
          # for this check.
          file="${GITHUB_WORKSPACE:-$(pwd)}/install/systemd/sysusers.d/nftban.conf"
          sudo test -f "$file" || { echo "::error::G10: $file not found"; exit 1; }

          rc=0
          out=$(sudo systemd-sysusers --dry-run "$file" 2>&1) || rc=$?
          echo "--- systemd-sysusers --dry-run output ---"
          echo "$out"
          echo "--- end (exit=$rc) ---"

          if [ "$rc" != "0" ]; then
            echo "::error::G10 FAIL: systemd-sysusers rejected $file (exit=$rc)"
            exit 1
          fi

          # Belt-and-braces: even if exit=0, fail if the diagnostic message
          # for malformed g-lines appears in output (in case a future
          # systemd version downgrades the rejection from error to warning).
          if echo "$out" | grep -qE "Lines of type 'g' don't take a GECOS field"; then
            echo "::error::G10 FAIL: malformed g-line GECOS detected in $file"
            exit 1
          fi

          echo "G10 PASS: $file parses cleanly under systemd-sysusers"

  summary:
    name: Runtime Truth summary
    needs: runtime-truth
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          if [[ "${{ needs.runtime-truth.result }}" != "success" ]]; then
            echo "::error::Runtime Truth Gate FAILED — see matrix job output"
            exit 1
          fi
          echo "Runtime Truth Gate PASSED on all matrix targets"
