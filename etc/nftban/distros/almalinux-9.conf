[distro]
id = almalinux
name = AlmaLinux
version = 9
family = rhel
version_codename = teal-serval

[package_manager]
type = dnf
install_cmd = dnf install -y
update_cmd = dnf update -y
upgrade_cmd = dnf upgrade -y
search_cmd = dnf search
info_cmd = dnf info

[packages]
nftables = nftables
curl = curl
iproute = iproute
bash = bash
systemd = systemd
suricata = suricata
suricata_update = suricata-update
mail = s-nail
golang = golang
golang_min_version = 1.21
# Build dependencies (for compiling from source)
gcc = gcc
pam_dev = pam-devel
jq = jq
socat = socat
wget = wget
git = git
prometheus = golang-github-prometheus
node_exporter = golang-github-prometheus-node-exporter
ncat = nmap-ncat

[services]
cron = crond
rsyslog = rsyslog
suricata = suricata
suricata_update = suricata-update
nftables = nftables
sshd = sshd
polkit = polkit
prometheus = prometheus
node_exporter = prometheus-node-exporter

[paths]
# Auth log path (RHEL uses /var/log/secure)
auth_log = /var/log/secure

# === Mail / MTA (BUG-14) ===
maillog = /var/log/maillog
exim_log = /var/log/exim/mainlog
exim_reject_log = /var/log/exim/rejectlog
dovecot_log = /var/log/maillog

# === DirectAdmin (BUG-14, RHEL family only) ===
directadmin_login_log = /var/log/directadmin/login.log
directadmin_security_log = /var/log/directadmin/security.log

# === FTP (BUG-14) ===
pureftpd_log = /var/log/messages

nft = /usr/sbin/nft
nftban_cli = /usr/sbin/nftban
mail = /usr/bin/mail
systemctl = /usr/bin/systemctl
journalctl = /usr/bin/journalctl
cron_d = /etc/cron.d
systemd_system = /usr/lib/systemd/system
suricata = /usr/sbin/suricata
suricatasc = /usr/bin/suricatasc
suricata_conf = /etc/suricata
suricata_yaml = /etc/suricata/suricata.yaml
suricata_eve_log = /var/log/nftban/suricata/eve-alerts.json
suricata_log_dir = /var/log/nftban/suricata
suricata_rules_dir = /var/lib/suricata/rules
suricata_stats_log = /var/log/suricata/stats.log
suricata_iface_config = /etc/nftban/conf.d/suricata/interfaces.conf
suricata_socket = /var/run/suricata/suricata-command.socket
nftables_conf = /etc/sysconfig/nftables.conf
nftables_conf_primary = /etc/nftables.conf
# Polkit rules directory (RHEL/Fedora: /etc/polkit-1/rules.d)
polkit_rules_dir = /etc/polkit-1/rules.d

[repository]
epel_required = true
epel_package = epel-release
epel_install_cmd = dnf install -y epel-release

[features]
systemd_support = true
firewalld_default = true
selinux_default = enforcing

[tier]
level = 0
description = Focus / CI-Required
ci_build = true
ci_test = true
