# =============================================================================
# NFTBan v1.0.0 - SLSA Level 3 Go Builder
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Build Go binaries with SLSA Level 3 compliance and provenance
# Triggers: After Release Packages workflow completes OR manual dispatch
#
# This workflow uses OpenSSF's SLSA Go builder instead of manual go build.
# Benefits:
#   - Isolated, hermetic build environment
#   - Signed provenance (.intoto.jsonl files)
#   - Cryptographically verifiable artifacts
#   - SLSA Level 3 compliance (high security standard)
#
# Builds:
#   - nftban-core (main CLI for firewall operations)
#
# COORDINATION: This workflow runs AFTER Release Packages completes to avoid
# race conditions when uploading assets to the same GitHub release.
# =============================================================================

name: SLSA Go Releaser

on:
  # Run after Release Packages workflow completes (avoids race condition)
  workflow_run:
    workflows: ["Release Packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: slsa-${{ github.ref }}
  cancel-in-progress: false

# Minimal top-level permissions (OpenSSF Scorecard compliance)
# Job-level permissions are set for each job that needs write access
permissions:
  contents: read
  actions: read

jobs:
  # ============================================================================
  # Job 0: Get release tag from triggering workflow
  # ============================================================================
  get-tag:
    name: Get Release Tag
    runs-on: ubuntu-latest
    # Only run if Release Packages succeeded AND was a tag push (for workflow_run
    # trigger). v1.221.1: the `event == 'push'` guard ensures a successful manual
    # Release Packages DRY-RUN (workflow_dispatch, publish=false) does NOT trigger
    # SLSA publication — SLSA provenance + nftban-core upload happen only for real
    # tag releases. A manual SLSA re-run (this workflow's own workflow_dispatch) is
    # still allowed.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get tag from event
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # workflow_run: get tag from the triggering workflow's head branch
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"

  # ============================================================================
  # Job 1: Build nftban-core with SLSA provenance
  # ============================================================================
  build-nftban-core:
    name: Build nftban-core (SLSA3)
    needs: get-tag
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.13`) so the SLSA
      # builder selects the same toolchain patch. GOTOOLCHAIN cannot be injected
      # into this third-party reusable workflow, so it is left to the builder.
      go-version: "1.25.13"
      # Config file specifies build parameters
      config-file: .github/slsa/nftban-core.yml
      evaluated-envs: "VERSION:${{ needs.get-tag.outputs.tag }}"
      # Upload provenance directly to release (fixes workflow_run trigger skip)
      upload-tag-name: ${{ needs.get-tag.outputs.tag }}

  # ============================================================================
  # Job 2: Assemble all artifacts and upload to release
  # ============================================================================
  assemble-release:
    name: Assemble Release Artifacts
    needs: [get-tag, build-nftban-core]
    runs-on: ubuntu-latest
    # Run for workflow_run (after Release Packages) but not for manual dispatch
    if: ${{ github.event_name == 'workflow_run' }}
    permissions:
      contents: write  # To upload release assets

    steps:
      # v1.229.4 VAF-0 Stage 1: the declared SLSA subject population lives in the repo, so
      # this job must have the repo. ⛔ MUST BE THE FIRST STEP — actions/checkout cleans the
      # workspace by default and would delete dist/ if it ran after the downloads.
      - name: Checkout (for the declared SLSA subject population)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download nftban-core artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-nftban-core.outputs.go-binary-name }}
          path: dist/

      - name: Download nftban-core provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-nftban-core.outputs.go-provenance-name }}
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      # NOTE: SHA256SUMS not generated here - Release Packages workflow provides
      # complete checksums for all packages. SLSA provenance (.intoto.jsonl)
      # provides cryptographic verification for these binaries.

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get-tag.outputs.tag }}
          # Use single pattern to avoid duplicates (nftban-* matches .intoto.jsonl too)
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v1.19.0: Verify SLSA provenance after build (R26)
      - name: Install SLSA Verifier
        run: |
          curl -sSfL https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.0/slsa-verifier-linux-amd64 \
            -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier

      - name: Verify SLSA Provenance
        run: |
          # =================================================================
          # v1.229.4 VAF-0 Stage 1 — SLSA_VALIDATION_FALSE_GREEN
          # =================================================================
          # THREE WITNESSES AGAINST ONE VALIDATOR. The previous form was:
          #
          #     VERIFY_FAILED=0
          #     for binary in dist/nftban-*; do
          #       if [ -f "$provenance" ]; then slsa-verifier ... || VERIFY_FAILED=1; fi
          #     done
          #     [[ $VERIFY_FAILED -ne 0 ]] && exit 1
          #
          #   L1 ZERO_SUBJECT_ITERATION           glob matches nothing -> 0 iterations ->
          #                                       VERIFY_FAILED stays 0 -> "verified"
          #   L2 REQUIRED_SUBJECT_ABSENCE_SKIPPED no else on the -f test -> A SHIPPED BINARY
          #                                       WITH NO PROVENANCE PASSED THE PROVENANCE
          #                                       CHECK. This was a live FALSE SECURITY
          #                                       CLAIM about a specific artifact, not a
          #                                       missing defence.
          #   L3 EXPECTED_POPULATION_NOT_ASSERTED nothing declared what SHOULD be verified
          #
          # ⛔ Adding an `else` alone would close L2 and leave L1 and L3. The population must
          #    come from a DECLARATION THAT REALITY CANNOT EDIT:
          #        PROVENANCE_FILES_FOUND must NOT define PROVENANCE_FILES_EXPECTED
          set -uo pipefail
          DECL="scripts/ci/data/slsa-subjects.tsv"
          VERIFIER="${SLSA_VERIFIER_BIN:-slsa-verifier}"
          [[ -f "$DECL" ]] || { echo "::error title=SLSA subject declaration missing::$DECL is absent. The expected population cannot be established, so nothing can be verified. ⛔ A MISSING DECLARATION IS NOT AN EMPTY POPULATION."; exit 1; }

          EXPECTED_COUNT="$(awk -F'\t' '$1=="expected_count"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          SOURCE_URI="$(awk -F'\t' '$1=="source_uri"{print $2; exit}' "$DECL" | tr -d '[:space:]')"
          [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]] || { echo "::error title=SLSA declaration invalid::expected_count is missing or non-numeric."; exit 1; }
          [[ -n "$SOURCE_URI" ]] || { echo "::error title=SLSA declaration invalid::source_uri is missing."; exit 1; }

          # ---- CARDINALITY PRECONDITION: a zero-subject run is never a pass -------------
          DECLARED=$(awk -F'\t' '$1=="subject" && NF>=3' "$DECL" | wc -l | tr -d ' ')
          echo "declared SLSA subjects: ${DECLARED} (expected_count=${EXPECTED_COUNT})"
          if [[ "$DECLARED" -eq 0 ]]; then
            echo "::error title=SLSA population empty::The declaration lists ZERO subjects. ⛔ 0 SUBJECTS != 0 FAILURES, and 0 FAILURES != PASS."
            exit 1
          fi
          if [[ "$DECLARED" -ne "$EXPECTED_COUNT" ]]; then
            echo "::error title=SLSA declaration incoherent::${DECLARED} subject row(s) but expected_count=${EXPECTED_COUNT}. A subject was added or removed without updating the count."
            exit 1
          fi

          # ---- verify EACH DECLARED subject; absence is a FAILURE, never a skip ---------
          VERIFIED=0
          FAILED=0
          while IFS=$'\t' read -r _tag binary provenance; do
            [[ -n "${binary:-}" ]] || continue
            echo "--- declared subject: ${binary}"
            if [[ ! -f "dist/${binary}" ]]; then
              echo "::error title=SLSA subject binary missing::Declared subject '"${binary}"' is not present in dist/. It was expected to ship. ⛔ ABSENCE IS NOT A SKIP."
              FAILED=$((FAILED+1)); continue
            fi
            if [[ ! -f "dist/${provenance}" ]]; then
              echo "::error title=SLSA provenance missing::Declared subject '"${binary}"' SHIPS WITHOUT PROVENANCE ('"${provenance}"' absent). ⛔ This is the exact state the previous validator passed silently."
              FAILED=$((FAILED+1)); continue
            fi
            if "$VERIFIER" verify-artifact "dist/${binary}" \
                 --provenance-path "dist/${provenance}" \
                 --source-uri "$SOURCE_URI"; then
              VERIFIED=$((VERIFIED+1))
              echo "    provenance verified and bound to ${binary}"
            else
              echo "::error title=SLSA provenance binding failed::Provenance did not verify against '"${binary}"'."
              FAILED=$((FAILED+1))
            fi
          done < <(awk -F'\t' '$1=="subject" && NF>=3 {print $1"\t"$2"\t"$3}' "$DECL")

          # ---- OBSERVED-COUNT POSTCONDITION -------------------------------------------
          echo "verified ${VERIFIED}/${EXPECTED_COUNT} declared subject(s); failures=${FAILED}"
          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error title=SLSA verification failed::${FAILED} declared subject(s) could not be verified."
            exit 1
          fi
          if [[ "$VERIFIED" -ne "$EXPECTED_COUNT" ]]; then
            echo "::error title=SLSA coverage incomplete::verified ${VERIFIED} of ${EXPECTED_COUNT} declared subjects. ⛔ EVERY DECLARED SUBJECT MUST BE ACCOUNTED FOR — a partial pass is not a pass."
            exit 1
          fi
          echo "SLSA provenance verified for all ${VERIFIED} declared subject(s)."

      - name: Generate SLSA Summary
        run: |
          echo "## SLSA Level 3 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Built" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Architecture | Provenance |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------------|------------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/nftban-*; do
            if [[ ! "$f" =~ \.intoto\.jsonl$ ]] && [[ ! "$f" =~ SHA256SUMS$ ]]; then
              basename=$(basename "$f")
              provenance="${basename}.intoto.jsonl"
              if [ -f "dist/$provenance" ]; then
                echo "| $basename | linux | ✅ Signed |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $basename | linux | ❌ Missing |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "Users can verify provenance using:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'slsa-verifier verify-artifact nftban-core-linux-amd64 \' >> $GITHUB_STEP_SUMMARY
          echo '  --provenance-path nftban-core-linux-amd64.intoto.jsonl \' >> $GITHUB_STEP_SUMMARY
          echo '  --source-uri github.com/itcmsgr/nftban' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
