# Fail2ban Filter - NFTBan Persistent Offenders
#
# Detects repeat offenders by monitoring the NFTBan fail2ban action log.
# Triggers when an IP gets banned multiple times across any jail.
#
# This filter parses log entries created by the nftban fail2ban action:
#   "2025-10-31 10:30:45 - Jail: sshd - Banned IP: 8.8.8.8 - Banned for: 3600 seconds..."
#
# Author: NFTBan Project
# Date: 2025-10-31
# Based on DirectAdmin itcmsgr-persistent-offenders filter

[Definition]

# Match any line containing "Banned IP: <IP>"
# This captures bans from ALL jails
failregex = Banned IP:\s+<HOST>

# No exclusions
ignoreregex =
