# =============================================================================
# NFTBan Cloudflare Integration Configuration
# =============================================================================
# Version: 0.10.0
# Module: nftban_cloudflare
# Purpose: Cloudflare IP range whitelisting for proxied services
# Loaded by: /usr/lib/nftban/cli/cmd_cloudflare.sh
#
# User overrides: /etc/nftban/nftban.conf.local
#
# When enabled, this module automatically downloads Cloudflare's IP ranges
# and adds them to your system whitelist. This is essential if you:
# - Use Cloudflare as a CDN/proxy
# - Want to see real client IPs (not Cloudflare IPs) in logs
# - Need to whitelist Cloudflare to prevent blocking legitimate traffic
# =============================================================================

# =============================================================================
# CLOUDFLARE MASTER SWITCH
# =============================================================================
# Enable/disable Cloudflare integration globally
# Values: true | false
#
# When enabled:
#   - Downloads IPv4 and IPv6 ranges from Cloudflare
#   - Adds them to system whitelist
#   - Integrates with Fail2ban (if FAIL2BAN_CLOUDFLARE_IP_WHITELIST_* enabled)
#   - Updates periodically if auto-update enabled
#
CLOUDFLARE_ENABLED="false"

# =============================================================================
# FAIL2BAN INTEGRATION
# =============================================================================
# Control whether Cloudflare IPs are whitelisted in Fail2ban
# Values: true | false
#
# When true:
#   - Cloudflare IPs added to Fail2ban ignoreip (IPv4)
#   - Prevents Fail2ban from banning Cloudflare IPs
#   - Required if you use Cloudflare as proxy/CDN
#
# When false:
#   - Cloudflare IPs NOT added to Fail2ban
#   - Only added to NFTban's system whitelist
#
FAIL2BAN_CLOUDFLARE_IP_WHITELIST_IPV4="true"
FAIL2BAN_CLOUDFLARE_IP_WHITELIST_IPV6="true"

# =============================================================================
# IPv4/IPv6 CONTROL
# =============================================================================
# Enable/disable IPv4 and IPv6 separately
# Values: true | false
#
# If your server doesn't support IPv6, set CLOUDFLARE_IPV6_ENABLED="false"
#
CLOUDFLARE_IPV4_ENABLED="true"
CLOUDFLARE_IPV6_ENABLED="true"

# =============================================================================
# CLOUDFLARE IP RANGE SOURCES
# =============================================================================
# Official Cloudflare IP list URLs
# DO NOT CHANGE unless Cloudflare updates their endpoints
#
CLOUDFLARE_IPV4_URL="https://www.cloudflare.com/ips-v4"
CLOUDFLARE_IPV6_URL="https://www.cloudflare.com/ips-v6"

# =============================================================================
# AUTO-UPDATE SETTINGS
# =============================================================================
# Automatically update Cloudflare IP ranges periodically
# Values: true | false
#
# Recommended: true (Cloudflare occasionally updates their ranges)
#
CLOUDFLARE_AUTO_UPDATE="true"

# Update interval (seconds)
# Default: 86400 (24 hours)
# Recommended: Check once per day
#
CLOUDFLARE_UPDATE_INTERVAL="86400"

# =============================================================================
# FHS PATHS (v0.10.0)
# =============================================================================
# Cache directory for downloaded IP ranges
CLOUDFLARE_CACHE_DIR="/var/cache/nftban/cloudflare"

# Data directory for processed IP lists
CLOUDFLARE_DATA_DIR="/var/lib/nftban/cloudflare"

# Whitelist file location (persistent storage)
CLOUDFLARE_WHITELIST_FILE="/etc/nftban/whitelist.d/20-cloudflare.conf"

# Log file
CLOUDFLARE_LOG_FILE="/var/log/nftban/cloudflare.log"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Verify SSL certificates when downloading (recommended: true)
CLOUDFLARE_VERIFY_SSL="true"

# Timeout for downloads (seconds)
CLOUDFLARE_DOWNLOAD_TIMEOUT="30"

# Retry failed downloads
CLOUDFLARE_RETRY_ON_FAILURE="true"
CLOUDFLARE_MAX_RETRIES="3"

# =============================================================================
# NOTIFICATION SETTINGS (Optional)
# =============================================================================
# Send email notification on update (requires mail module configured)
CLOUDFLARE_NOTIFY_ON_UPDATE="false"
CLOUDFLARE_NOTIFY_EMAIL=""

# Notify on download failure
CLOUDFLARE_NOTIFY_ON_FAILURE="true"

# =============================================================================
# EXPECTED IP COUNTS (Validation)
# =============================================================================
# Minimum expected IP ranges (validation check)
# If downloaded list has fewer IPs, it's considered invalid
#
# As of 2025-10-28:
#   - Cloudflare has ~18 IPv4 ranges
#   - Cloudflare has ~6 IPv6 ranges
#
CLOUDFLARE_MIN_IPV4_RANGES="10"
CLOUDFLARE_MIN_IPV6_RANGES="5"

# Maximum expected ranges (sanity check)
CLOUDFLARE_MAX_IPV4_RANGES="100"
CLOUDFLARE_MAX_IPV6_RANGES="50"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
