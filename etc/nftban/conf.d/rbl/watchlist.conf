# =============================================================================
# NFTBan RBL Watchlist Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Monitor external IPs of interest (customers, partners, etc.)
#
# meta:name="watchlist.conf"
# meta:type="config"
# meta:description="RBL watchlist for monitoring external IPs"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="root"
#
# Format: One entry per line
#   IP|description|tags|notify_email
#
# Fields:
#   IP           - IPv4 or IPv6 address to monitor
#   description  - Human-readable description (no pipes allowed)
#   tags         - Comma-separated tags: customer,partner,mail,web,critical
#   notify_email - Optional email override (uses default if empty)
#
# Examples:
#   203.0.113.10|Customer ABC mail server|customer,mail,critical|
#   198.51.100.5|Partner XYZ web server|partner,web|alerts@partner.com
#   192.0.2.100|Backup DNS server|infrastructure,dns|
#
# Management Commands:
#   nftban rbl watchlist list              - Show all watched IPs
#   nftban rbl watchlist add <IP> [desc]   - Add IP to watchlist
#   nftban rbl watchlist remove <IP>       - Remove IP from watchlist
#   nftban rbl watchlist check             - Check all watched IPs
#   nftban rbl watchlist check --alert     - Check and send alerts
#
# =============================================================================

