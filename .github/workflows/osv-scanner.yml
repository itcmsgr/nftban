# =============================================================================
# NFTBan - OSV-Scanner (Open Source Vulnerabilities)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Scan dependencies for known vulnerabilities using Google OSV database
#
# Runs on:
#   - Push to main branch
#   - Pull requests to main
#   - Weekly on Monday at 6:00 AM UTC
#
# Features:
#   - Scans Go modules (go.mod/go.sum)
#   - SARIF output for GitHub Security tab integration
# =============================================================================

name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --version

      - name: Run OSV-Scanner
        run: |
          # Scan only go.mod/go.sum (lockfile mode)
          # Using --experimental-call-analysis=false to skip compilation
          ./osv-scanner scan --lockfile=go.mod --format=sarif --output=osv-results.sarif || true

      - name: Check SARIF output
        run: |
          if [ -f osv-results.sarif ]; then
            echo "SARIF file created successfully"
            cat osv-results.sarif | head -50
          else
            echo "Creating empty SARIF for upload"
            cat > osv-results.sarif << 'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool": {"driver": {"name": "osv-scanner", "version": "2.3.3"}}, "results": []}]
          }
          EOF
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
        if: always()
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
