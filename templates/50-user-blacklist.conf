# ═══════════════════════════════════════════════════════════════════════════════
# NFTBan User Blacklist - Manual Entries
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
#   Manually block IPs (persistent offenders, known attackers, etc.)
#
# PRIORITY:
#   ⚠️  Whitelist wins - IPs in whitelist.d/ will NOT be blocked
#
# FORMAT:
#   <IP_ADDRESS>  # <COMMENT>
#
# EXAMPLES:
#   1.2.3.4                    # Brute force attacker
#   5.6.7.8                    # Spam bot
#   192.168.100.0/24           # Untrusted network segment
#   2001:db8::bad:1            # IPv6 attacker
#
# IMPORTANT:
#   • One IP per line
#   • Comments start with #
#   • Supports both IPv4 and IPv6
#   • Supports CIDR notation (e.g., 192.168.1.0/24)
#   • Changes take effect after: nftban reload
#   • System IPs are automatically removed (can't ban yourself!)
#
# QUICK COMMANDS:
#   # Temporarily ban an IP (expires after timeout)
#   sudo nftban ban 1.2.3.4
#
#   # Permanently ban an IP (add to this file)
#   sudo nftban ban 1.2.3.4 --permanent
#
#   # Check if IP is banned
#   sudo nftban search 1.2.3.4
#
#   # Unban an IP
#   sudo nftban unban 1.2.3.4
#
#   # Reload to apply changes
#   sudo nftban reload
#
