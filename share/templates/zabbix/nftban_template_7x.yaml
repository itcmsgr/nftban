zabbix_export:
  version: '7.0'
  template_groups:
  - name: Templates/Security
  templates:
  - template: NFTBan
    name: NFTBan Firewall
    description: |
      NFTBan monitoring template for Zabbix 7.x

      Monitors:
      - Daemon status, version, uptime
      - Ban statistics (total, 24h, rate)
      - Memory usage, goroutines, GC stats
      - Module status per enabled module
      - Watchdog pressure scores
      - Feed status and IP counts
      - GeoIP statistics
      - nftables rule counts

      Requirements:
      - NFTBan v1.3.0+
      - Zabbix Agent 2 or Trapper items

      Documentation: https://nftban.com/docs/zabbix
    vendor:
      name: NFTBan
      version: 1.3.0
    groups:
    - name: Templates/Security
    macros:
    - macro: '{$NFTBAN.BAN.RATE.WARN}'
      value: '100'
      description: Ban rate per minute warning threshold
    - macro: '{$NFTBAN.BAN.RATE.HIGH}'
      value: '500'
      description: Ban rate per minute high threshold
    - macro: '{$NFTBAN.MEMORY.WARN}'
      value: '524288000'
      description: Memory warning threshold (500MB)
    - macro: '{$NFTBAN.MEMORY.HIGH}'
      value: '1073741824'
      description: Memory high threshold (1GB)
    - macro: '{$NFTBAN.GEOIP.AGE.WARN}'
      value: '30'
      description: GeoIP database age warning (days)
    - macro: '{$NFTBAN.UPDATE.INTERVAL}'
      value: 1m
      description: Metric update interval
    items:
    - name: 'NFTBan: Daemon status'
      type: TRAP
      key: nftban.status
      value_type: UNSIGNED
      description: 'Daemon status: 1=running, 0=stopped'
      tags:
      - tag: component
        value: daemon
      - tag: scope
        value: availability
      triggers:
      - expression: last(/NFTBan/nftban.status)=0
        name: NFTBan daemon is down
        priority: DISASTER
        description: NFTBan daemon is not running. Firewall protection may be compromised.
        tags:
        - tag: scope
          value: availability
      - expression: nodata(/NFTBan/nftban.status,5m)=1
        name: NFTBan metrics not received for 5 minutes
        priority: HIGH
        description: No metrics received from NFTBan exporter. Check if the Zabbix exporter is running and network connectivity.
        tags:
        - tag: scope
          value: availability
        - tag: component
          value: metrics
    - name: 'NFTBan: Version'
      type: TRAP
      key: nftban.version
      value_type: CHAR
      description: NFTBan daemon version
      tags:
      - tag: component
        value: daemon
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Uptime'
      type: TRAP
      key: nftban.uptime
      value_type: FLOAT
      units: s
      description: Daemon uptime in seconds
      tags:
      - tag: component
        value: daemon
      triggers:
      - expression: last(/NFTBan/nftban.uptime)<300
        name: NFTBan daemon restarted recently
        priority: INFO
        description: NFTBan daemon uptime is less than 5 minutes.
        manual_close: 'YES'
    - name: 'NFTBan: PID'
      type: TRAP
      key: nftban.pid
      value_type: UNSIGNED
      description: Daemon process ID
      tags:
      - tag: component
        value: daemon
    - name: 'NFTBan: Operating mode'
      type: TRAP
      key: nftban.mode
      value_type: CHAR
      description: 'Operating mode: normal, degraded, survival'
      tags:
      - tag: component
        value: daemon
      triggers:
      - expression: last(/NFTBan/nftban.mode)<>"normal" and length(last(/NFTBan/nftban.mode))>0
        name: NFTBan in {ITEM.VALUE} mode
        priority: WARNING
        description: NFTBan is running in degraded or survival mode due to resource pressure.
    - name: 'NFTBan: Active bans'
      type: TRAP
      key: nftban.active.count
      value_type: UNSIGNED
      description: Currently active ban count
      tags:
      - tag: component
        value: bans
    - name: 'NFTBan: Bans (24h)'
      type: TRAP
      key: nftban.bans.24h
      value_type: UNSIGNED
      description: Bans in last 24 hours
      tags:
      - tag: component
        value: bans
      triggers:
      - expression: last(/NFTBan/nftban.bans.24h)>1000
        name: High ban rate (>{ITEM.VALUE}/24h)
        priority: WARNING
        description: More than 1000 bans in the last 24 hours indicates increased attack activity.
      - expression: last(/NFTBan/nftban.bans.24h)>5000
        name: Mass attack detected (>{ITEM.VALUE}/24h)
        priority: HIGH
        description: More than 5000 bans in 24 hours suggests a coordinated attack.
    - name: 'NFTBan: Bans (1h)'
      type: TRAP
      key: nftban.bans.1h
      value_type: UNSIGNED
      description: Bans in last hour
      tags:
      - tag: component
        value: bans
    - name: 'NFTBan: Ban rate'
      type: TRAP
      key: nftban.bans.rate
      value_type: FLOAT
      units: /min
      description: Current ban rate per minute
      tags:
      - tag: component
        value: bans
      triggers:
      - expression: last(/NFTBan/nftban.bans.rate)>{$NFTBAN.BAN.RATE.WARN}
        name: NFTBan ban rate warning ({ITEM.VALUE}/min)
        priority: WARNING
        description: Ban rate exceeds warning threshold.
      - expression: last(/NFTBan/nftban.bans.rate)>{$NFTBAN.BAN.RATE.HIGH}
        name: NFTBan ban rate critical ({ITEM.VALUE}/min)
        priority: HIGH
        description: Ban rate exceeds critical threshold - possible attack in progress.
    - name: 'NFTBan: Total bans'
      type: TRAP
      key: nftban.bans.total
      value_type: UNSIGNED
      description: Total bans since daemon start
      tags:
      - tag: component
        value: bans
    - name: 'NFTBan: Permanent bans'
      type: TRAP
      key: nftban.permanent.count
      value_type: UNSIGNED
      description: Permanent ban count
      tags:
      - tag: component
        value: bans
    - name: 'NFTBan: Whitelist count'
      type: TRAP
      key: nftban.whitelist.count
      value_type: UNSIGNED
      description: Whitelist entry count
      tags:
      - tag: component
        value: bans
    - name: 'NFTBan: Memory RSS'
      type: TRAP
      key: nftban.memory.rss
      value_type: UNSIGNED
      units: B
      description: Process resident set size
      tags:
      - tag: component
        value: memory
      triggers:
      - expression: last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.WARN}
        name: NFTBan memory usage high (>{ITEM.VALUE})
        priority: WARNING
        description: NFTBan memory usage exceeds warning threshold.
      - expression: last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.HIGH}
        name: NFTBan memory usage critical (>{ITEM.VALUE})
        priority: HIGH
        description: NFTBan memory usage exceeds critical threshold.
    - name: 'NFTBan: Open file descriptors'
      type: TRAP
      key: nftban.fds.open
      value_type: UNSIGNED
      description: Open file descriptors
      tags:
      - tag: component
        value: memory
      triggers:
      - expression: last(/NFTBan/nftban.fds.open)>1000
        name: NFTBan open FDs > 1000
        priority: WARNING
        description: High number of open file descriptors may indicate a leak.
    - name: 'NFTBan: Goroutines'
      type: TRAP
      key: nftban.goroutines
      value_type: UNSIGNED
      description: Active goroutine count
      tags:
      - tag: component
        value: memory
      triggers:
      - expression: last(/NFTBan/nftban.goroutines)>500
        name: NFTBan goroutine count high ({ITEM.VALUE})
        priority: WARNING
        description: High goroutine count may indicate a leak or high load.
    - name: 'NFTBan: Threads'
      type: TRAP
      key: nftban.threads
      value_type: UNSIGNED
      description: OS thread count
      tags:
      - tag: component
        value: memory
    - name: 'NFTBan: Modules enabled'
      type: TRAP
      key: nftban.modules.enabled
      value_type: UNSIGNED
      description: Number of enabled modules
      tags:
      - tag: component
        value: modules
    - name: 'NFTBan: Modules active'
      type: TRAP
      key: nftban.modules.active
      value_type: UNSIGNED
      description: Number of currently active modules
      tags:
      - tag: component
        value: modules
    - name: 'NFTBan: Modules failed'
      type: TRAP
      key: nftban.modules.failed
      value_type: UNSIGNED
      description: Number of failed modules
      tags:
      - tag: component
        value: modules
      triggers:
      - expression: last(/NFTBan/nftban.modules.failed)>0
        name: NFTBan module(s) failed ({ITEM.VALUE})
        priority: HIGH
        description: One or more NFTBan modules have failed.
    - name: 'NFTBan: nftables sets'
      type: TRAP
      key: nftban.nft.sets_total
      value_type: UNSIGNED
      description: Total nftables sets
      tags:
      - tag: component
        value: nftables
    - name: 'NFTBan: nftables elements'
      type: TRAP
      key: nftban.nft.elements_total
      value_type: UNSIGNED
      description: Total set elements across all sets
      tags:
      - tag: component
        value: nftables
      triggers:
      - expression: last(/NFTBan/nftban.nft.elements_total)>100000
        name: NFTBan large ruleset (>{ITEM.VALUE} elements)
        priority: WARNING
        description: Large number of set elements may impact performance.
    - name: 'NFTBan: nftables rules'
      type: TRAP
      key: nftban.nft.rules_total
      value_type: UNSIGNED
      description: Total nftables rules
      tags:
      - tag: component
        value: nftables
    - name: 'NFTBan: Packets blocked (IPv4)'
      type: TRAP
      key: nftban.nft.packets_blocked_ipv4
      value_type: UNSIGNED
      description: Total packets blocked (IPv4)
      tags:
      - tag: component
        value: nftables
    - name: 'NFTBan: Packets blocked (IPv6)'
      type: TRAP
      key: nftban.nft.packets_blocked_ipv6
      value_type: UNSIGNED
      description: Total packets blocked (IPv6)
      tags:
      - tag: component
        value: nftables
    - name: 'NFTBan: Feeds enabled'
      type: TRAP
      key: nftban.feeds.enabled
      value_type: UNSIGNED
      description: Number of enabled threat feeds
      tags:
      - tag: component
        value: feeds
    - name: 'NFTBan: Feeds loaded'
      type: TRAP
      key: nftban.feeds.loaded
      value_type: UNSIGNED
      description: Number of successfully loaded feeds
      tags:
      - tag: component
        value: feeds
    - name: 'NFTBan: Feeds failed'
      type: TRAP
      key: nftban.feeds.failed
      value_type: UNSIGNED
      description: Number of failed feed loads
      tags:
      - tag: component
        value: feeds
      triggers:
      - expression: last(/NFTBan/nftban.feeds.failed)>0
        name: NFTBan feed load failures ({ITEM.VALUE})
        priority: WARNING
        description: One or more threat feeds failed to load.
    - name: 'NFTBan: Feeds total IPs'
      type: TRAP
      key: nftban.feeds.ips_total
      value_type: UNSIGNED
      description: Total IPs from all feeds
      tags:
      - tag: component
        value: feeds
    - name: 'NFTBan: GeoIP database age'
      type: TRAP
      key: nftban.geoip.database_age
      value_type: UNSIGNED
      units: days
      description: Age of GeoIP database in days
      tags:
      - tag: component
        value: geoip
      triggers:
      - expression: last(/NFTBan/nftban.geoip.database_age)>{$NFTBAN.GEOIP.AGE.WARN}
        name: NFTBan GeoIP database outdated ({ITEM.VALUE} days)
        priority: WARNING
        description: GeoIP database should be updated for accurate geolocation.
    - name: 'NFTBan: Countries blocked'
      type: TRAP
      key: nftban.geoip.countries_blocked
      value_type: UNSIGNED
      description: Number of blocked countries
      tags:
      - tag: component
        value: geoip
    - name: 'NFTBan: Watchdog status'
      type: TRAP
      key: nftban.watchdog.status
      value_type: FLOAT
      description: 'Watchdog status: 1=ok, 0=disabled, -1=error'
      tags:
      - tag: component
        value: watchdog
    - name: 'NFTBan: CPU pressure score'
      type: TRAP
      key: nftban.watchdog.cpu_score
      value_type: FLOAT
      description: CPU pressure score (0-100)
      tags:
      - tag: component
        value: watchdog
      triggers:
      - expression: last(/NFTBan/nftban.watchdog.cpu_score)>80
        name: NFTBan CPU pressure high ({ITEM.VALUE})
        priority: WARNING
        description: High CPU pressure may cause NFTBan to enter degraded mode.
    - name: 'NFTBan: Memory pressure score'
      type: TRAP
      key: nftban.watchdog.mem_score
      value_type: FLOAT
      description: Memory pressure score (0-100)
      tags:
      - tag: component
        value: watchdog
      triggers:
      - expression: last(/NFTBan/nftban.watchdog.mem_score)>80
        name: NFTBan memory pressure high ({ITEM.VALUE})
        priority: WARNING
        description: High memory pressure may cause NFTBan to enter degraded mode.
    - name: 'NFTBan: I/O pressure score'
      type: TRAP
      key: nftban.watchdog.io_score
      value_type: FLOAT
      description: I/O pressure score (0-100)
      tags:
      - tag: component
        value: watchdog
    - name: 'NFTBan: Health status'
      type: TRAP
      key: nftban.health.status
      value_type: UNSIGNED
      description: 'Overall health: 1=healthy, 0=unhealthy'
      tags:
      - tag: component
        value: health
      triggers:
      - expression: last(/NFTBan/nftban.health.status)=0
        name: NFTBan health check failed
        priority: HIGH
        description: NFTBan health check reporting unhealthy status.
    - name: 'NFTBan: Health checks passed'
      type: TRAP
      key: nftban.health.passed
      value_type: UNSIGNED
      description: Number of health checks passed
      tags:
      - tag: component
        value: health
    - name: 'NFTBan: Health checks failed'
      type: TRAP
      key: nftban.health.failed
      value_type: UNSIGNED
      description: Number of health checks failed
      tags:
      - tag: component
        value: health
    - name: 'NFTBan: Server hostname'
      type: TRAP
      key: nftban.server.hostname
      value_type: CHAR
      description: Server hostname (short)
      inventory_link: NAME
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server FQDN'
      type: TRAP
      key: nftban.server.fqdn
      value_type: CHAR
      description: Fully qualified domain name
      inventory_link: ALIAS
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server OS'
      type: TRAP
      key: nftban.server.os
      value_type: CHAR
      description: Operating system name and version
      inventory_link: OS
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server OS release'
      type: TRAP
      key: nftban.server.os_release
      value_type: CHAR
      description: OS release/distribution (e.g., Ubuntu 24.04, Fedora 42)
      inventory_link: OS_SHORT
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server kernel'
      type: TRAP
      key: nftban.server.kernel
      value_type: CHAR
      description: Kernel version
      inventory_link: SOFTWARE
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server architecture'
      type: TRAP
      key: nftban.server.arch
      value_type: CHAR
      description: System architecture (x86_64, aarch64, etc.)
      inventory_link: TYPE
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server CPU cores'
      type: TRAP
      key: nftban.server.cpu_cores
      value_type: UNSIGNED
      description: Number of CPU cores
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server CPU model'
      type: TRAP
      key: nftban.server.cpu_model
      value_type: CHAR
      description: CPU model name
      inventory_link: HARDWARE
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server memory total'
      type: TRAP
      key: nftban.server.memory_total
      value_type: UNSIGNED
      units: B
      description: Total physical memory
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server memory available'
      type: TRAP
      key: nftban.server.memory_available
      value_type: UNSIGNED
      units: B
      description: Available physical memory
      tags:
      - tag: component
        value: server
    - name: 'NFTBan: Server uptime'
      type: TRAP
      key: nftban.server.uptime
      value_type: UNSIGNED
      units: s
      description: Server uptime in seconds
      tags:
      - tag: component
        value: server
    - name: 'NFTBan: Server boot time'
      type: TRAP
      key: nftban.server.boot_time
      value_type: UNSIGNED
      units: unixtime
      description: Server boot timestamp
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server primary IP'
      type: TRAP
      key: nftban.server.primary_ip
      value_type: CHAR
      description: Primary IPv4 address
      inventory_link: HOST_ROUTER
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server public IP'
      type: TRAP
      key: nftban.server.public_ip
      value_type: CHAR
      description: Public/external IP address
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server interfaces'
      type: TRAP
      key: nftban.server.interfaces
      value_type: CHAR
      description: Network interfaces (JSON array)
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server timezone'
      type: TRAP
      key: nftban.server.timezone
      value_type: CHAR
      description: System timezone
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server virtualization'
      type: TRAP
      key: nftban.server.virtualization
      value_type: CHAR
      description: Virtualization type (kvm, vmware, docker, none)
      inventory_link: TYPE_FULL
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server cloud provider'
      type: TRAP
      key: nftban.server.cloud_provider
      value_type: CHAR
      description: Cloud provider (aws, gcp, azure, digitalocean, none)
      inventory_link: VENDOR
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Server region'
      type: TRAP
      key: nftban.server.region
      value_type: CHAR
      description: Cloud region or datacenter location
      inventory_link: LOCATION
      tags:
      - tag: component
        value: inventory
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
    - name: 'NFTBan: Load average (1m)'
      type: TRAP
      key: nftban.server.load_1m
      value_type: FLOAT
      description: 1-minute load average
      tags:
      - tag: component
        value: server
    - name: 'NFTBan: Load average (5m)'
      type: TRAP
      key: nftban.server.load_5m
      value_type: FLOAT
      description: 5-minute load average
      tags:
      - tag: component
        value: server
    - name: 'NFTBan: Load average (15m)'
      type: TRAP
      key: nftban.server.load_15m
      value_type: FLOAT
      description: 15-minute load average
      tags:
      - tag: component
        value: server
    discovery_rules:
    - name: 'NFTBan: Module discovery'
      type: TRAP
      key: nftban.discovery.modules
      description: Discover all NFTBan modules
      item_prototypes:
      - name: 'NFTBan: Module {#MODULE} status'
        type: TRAP
        key: nftban.module.status[{#MODULE}]
        value_type: FLOAT
        description: 'Module {#MODULE} status: 1=ok, 0=error, -1=disabled'
        tags:
        - tag: component
          value: modules
        - tag: module
          value: '{#MODULE}'
      - name: 'NFTBan: Module {#MODULE} bans'
        type: TRAP
        key: nftban.module.bans[{#MODULE}]
        value_type: UNSIGNED
        description: Bans from module {#MODULE}
        tags:
        - tag: component
          value: modules
        - tag: module
          value: '{#MODULE}'
      trigger_prototypes:
      - expression: last(/NFTBan/nftban.module.status[{#MODULE}])=0
        name: NFTBan module {#MODULE} failed
        priority: HIGH
        description: Module {#MODULE} is in error state.
    - name: 'NFTBan: Feed discovery'
      type: TRAP
      key: nftban.discovery.feeds
      description: Discover configured threat feeds
      item_prototypes:
      - name: 'NFTBan: Feed {#FEED} status'
        type: TRAP
        key: nftban.feed.status[{#FEED}]
        value_type: UNSIGNED
        description: 'Feed {#FEED} status: 1=ok, 0=error'
        tags:
        - tag: component
          value: feeds
        - tag: feed
          value: '{#FEED}'
      - name: 'NFTBan: Feed {#FEED} IPs'
        type: TRAP
        key: nftban.feed.ips[{#FEED}]
        value_type: UNSIGNED
        description: IPs loaded from {#FEED}
        tags:
        - tag: component
          value: feeds
        - tag: feed
          value: '{#FEED}'
      - name: 'NFTBan: Feed {#FEED} last update'
        type: TRAP
        key: nftban.feed.last_update[{#FEED}]
        value_type: UNSIGNED
        units: unixtime
        description: Last update timestamp for {#FEED}
        tags:
        - tag: component
          value: feeds
        - tag: feed
          value: '{#FEED}'
      trigger_prototypes:
      - expression: last(/NFTBan/nftban.feed.status[{#FEED}])=0
        name: NFTBan feed {#FEED} failed
        priority: WARNING
        description: Threat feed {#FEED} failed to load.
    - name: 'NFTBan: Country discovery'
      type: TRAP
      key: nftban.discovery.countries
      description: Discover countries with ban activity
      item_prototypes:
      - name: 'NFTBan: Country {#COUNTRY} bans'
        type: TRAP
        key: nftban.country.bans[{#COUNTRY}]
        value_type: UNSIGNED
        description: Active bans from {#COUNTRY}
        tags:
        - tag: component
          value: geoip
        - tag: country
          value: '{#COUNTRY}'
      - name: 'NFTBan: Country {#COUNTRY} bans (24h)'
        type: TRAP
        key: nftban.country.bans_24h[{#COUNTRY}]
        value_type: UNSIGNED
        description: 24h bans from {#COUNTRY}
        tags:
        - tag: component
          value: geoip
        - tag: country
