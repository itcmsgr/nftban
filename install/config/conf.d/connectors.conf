# =============================================================================
# NFTBan v1.3.0 - Generic Connectors Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Export to Elasticsearch, Kafka, NDJSON file, syslog, webhook
#
# IMPORTANT: Do NOT edit this file - it will be overwritten on updates!
# Create /etc/nftban/conf.d/connectors.conf.local for your customizations.
#
# For complex setups, use YAML configs in /etc/nftban/connectors/
# See example files: elasticsearch.yaml.example, kafka.yaml.example
#
# meta:name="connectors.conf"
# meta:type="config"
# meta:description="Default connector settings"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units="nftban-unified-exporter.timer"
# meta:inventory.network="outbound:9200/tcp,outbound:9092/tcp,outbound:514/udp"
# meta:inventory.privileges="user"
# =============================================================================
#
# FIREWALL REQUIREMENTS:
# ----------------------
# Connectors need OUTBOUND access to their respective services:
#   - Elasticsearch: TCP 9200 (default)
#   - Kafka: TCP 9092 (default)
#   - Syslog: UDP/TCP 514 (default)
#   - Webhook: TCP 443/80 (depends on URL)
#
# When NFTBAN_CONNECTOR_FIREWALL_AUTO=true AND a connector is ENABLED:
#   - NFTBan automatically adds outbound firewall rules
#   - Rules are added when connector is ENABLED (not during install)
#   - Rules are removed when connector is disabled
#
# QUICK SETUP:
# ------------
# 1. Create /etc/nftban/conf.d/connectors.conf.local with your settings
# 2. Enable the timer: systemctl enable --now nftban-unified-exporter.timer
# 3. Test: nftban connector test
#
# =============================================================================

# =============================================================================
# CONNECTOR FRAMEWORK - MAIN SETTINGS
# =============================================================================

# Enable generic connector framework
NFTBAN_CONNECTOR_ENABLED="false"

# Auto-configure firewall for connector outbound connections
NFTBAN_CONNECTOR_FIREWALL_AUTO="true"

# Export interval in seconds
NFTBAN_CONNECTOR_INTERVAL="60"

# =============================================================================
# ELASTICSEARCH CONNECTOR
# =============================================================================

# Enable Elasticsearch export
NFTBAN_CONNECTOR_ES_ENABLED="false"

# Elasticsearch server addresses (comma-separated for cluster)
NFTBAN_CONNECTOR_ES_ADDRESSES="http://localhost:9200"

# Authentication (basic auth)
NFTBAN_CONNECTOR_ES_USERNAME=""
NFTBAN_CONNECTOR_ES_PASSWORD=""

# OR use API key authentication (preferred)
NFTBAN_CONNECTOR_ES_API_KEY=""

# TLS settings
NFTBAN_CONNECTOR_ES_TLS_ENABLED="false"
NFTBAN_CONNECTOR_ES_TLS_SKIP_VERIFY="false"

# Index settings
NFTBAN_CONNECTOR_ES_INDEX="nftban-metrics"
NFTBAN_CONNECTOR_ES_INDEX_PATTERN="nftban-metrics-%Y.%m.%d"

# Performance tuning
NFTBAN_CONNECTOR_ES_BULK_SIZE="1000"
NFTBAN_CONNECTOR_ES_FLUSH_INTERVAL="5"

# =============================================================================
# KAFKA CONNECTOR
# =============================================================================

# Enable Kafka export
NFTBAN_CONNECTOR_KAFKA_ENABLED="false"

# Kafka brokers (comma-separated)
NFTBAN_CONNECTOR_KAFKA_BROKERS="localhost:9092"

# Topic for metrics
NFTBAN_CONNECTOR_KAFKA_TOPIC="nftban-metrics"

# TLS
NFTBAN_CONNECTOR_KAFKA_TLS_ENABLED="false"

# SASL authentication
NFTBAN_CONNECTOR_KAFKA_SASL_ENABLED="false"
NFTBAN_CONNECTOR_KAFKA_SASL_MECHANISM="PLAIN"
NFTBAN_CONNECTOR_KAFKA_SASL_USERNAME=""
NFTBAN_CONNECTOR_KAFKA_SASL_PASSWORD=""

# Producer settings
NFTBAN_CONNECTOR_KAFKA_BATCH_SIZE="16384"
NFTBAN_CONNECTOR_KAFKA_ACKS="1"

# =============================================================================
# NDJSON FILE CONNECTOR
# =============================================================================

# Enable file export (NDJSON format)
NFTBAN_CONNECTOR_FILE_ENABLED="false"

# Output directory
NFTBAN_CONNECTOR_FILE_DIR="/var/log/nftban/metrics"

# File prefix
NFTBAN_CONNECTOR_FILE_PREFIX="nftban"

# Rotation settings
NFTBAN_CONNECTOR_FILE_ROTATE_DAILY="true"
NFTBAN_CONNECTOR_FILE_ROTATE_SIZE="104857600"

# Retention in days
NFTBAN_CONNECTOR_FILE_RETENTION_DAYS="30"

# Compress rotated files
NFTBAN_CONNECTOR_FILE_COMPRESS="true"

# =============================================================================
# SYSLOG CONNECTOR
# =============================================================================

# Enable syslog export (RFC 5424)
NFTBAN_CONNECTOR_SYSLOG_ENABLED="false"

# Syslog server
NFTBAN_CONNECTOR_SYSLOG_SERVER="localhost"
NFTBAN_CONNECTOR_SYSLOG_PORT="514"
NFTBAN_CONNECTOR_SYSLOG_PROTOCOL="udp"

# Facility and severity
NFTBAN_CONNECTOR_SYSLOG_FACILITY="local0"
NFTBAN_CONNECTOR_SYSLOG_SEVERITY="info"

# =============================================================================
# WEBHOOK CONNECTOR
# =============================================================================

# Enable webhook export (HTTP POST)
NFTBAN_CONNECTOR_WEBHOOK_ENABLED="false"

# Webhook URL
NFTBAN_CONNECTOR_WEBHOOK_URL=""

# HTTP headers (JSON format)
NFTBAN_CONNECTOR_WEBHOOK_HEADERS='{}'

# Timeout in seconds
NFTBAN_CONNECTOR_WEBHOOK_TIMEOUT="30"

# =============================================================================
# DEBUG
# =============================================================================

# Enable debug logging for connectors
NFTBAN_CONNECTOR_DEBUG="false"
