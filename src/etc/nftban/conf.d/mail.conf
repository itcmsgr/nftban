# =============================================================================
# NFTBan Mail Module Configuration
# =============================================================================
# Version: 0.31.0
# Module: nftban_mail
# Purpose: Email sending mechanism for all modules
#
# This file is OVERWRITTEN on package upgrades!
# Use /etc/nftban/nftban.conf.local for your customizations
# =============================================================================

# =============================================================================
# MAIL SYSTEM
# =============================================================================

# Auto-detect mail system or specify manually
# Values: "auto", "postfix", "sendmail", "exim", "msmtp", "mailx"
# Default: "auto" (auto-detect)
NFTBAN_MAIL_SYSTEM="auto"

# Mail command path (auto-detected if blank)
# Leave blank for auto-detection
NFTBAN_MAIL_COMMAND=""

# =============================================================================
# RECIPIENT SETTINGS
# =============================================================================

# Default recipient for all emails
# IMPORTANT: Change this to your email address!
NFTBAN_MAIL_RECIPIENT="admin@yourdomain.com"

# CC recipients (comma-separated, optional)
# Leave blank to disable
NFTBAN_MAIL_CC=""

# Report-specific recipient (for reports from modules)
# If blank, uses NFTBAN_MAIL_RECIPIENT
NFTBAN_MAIL_REPORT_RECIPIENT=""

# Report-specific CC (comma-separated, optional)
# Leave blank to disable
NFTBAN_MAIL_REPORT_CC=""

# =============================================================================
# SENDER SETTINGS
# =============================================================================

# Sender email address
# Uses hostname if not specified
NFTBAN_SENDER="nftban@$(hostname -f)"

# From name (displayed in email client)
NFTBAN_FROM_NAME="NFTBan Security System"

# Reply-To address (optional)
# Leave blank to use NFTBAN_SENDER
NFTBAN_REPLY_TO=""

# =============================================================================
# EMAIL TEMPLATE SETTINGS
# =============================================================================

# Include NFTBan version in emails
# Values: "YES", "NO"
NFTBAN_VERSION_INCLUDE="YES"

# Company name (used in email header/footer)
# Leave blank for no company name
NFTBAN_COMPANY_NAME=""

# Company logo location (for HTML emails)
# Can be: path to image file, URL, or blank
# Examples: "/usr/share/nftban/assets/logo.png", "https://example.com/logo.png"
NFTBAN_LOGO_LOCATION=""

# Email header template
# Values: "default", "minimal", or path to custom template
NFTBAN_MAIL_HEADER="default"

# Email footer template
# Values: "default", "minimal", or path to custom template
NFTBAN_MAIL_FOOTER="default"

# =============================================================================
# ALERT SETTINGS
# =============================================================================

# Send email alerts for root logins
# Values: "YES", "NO"
NFTBAN_LOGIN_ALERT="YES"

# Send alerts for failed login attempts (threshold)
# Number of failed attempts before sending alert
NFTBAN_FAILED_LOGIN_ALERT_THRESHOLD="5"

# =============================================================================
# SECURITY SETTINGS
# =============================================================================

# Allowed directories for file attachments (colon-separated)
# Only files in these directories can be sent via email
NFTBAN_MAIL_ALLOWED_PATHS="/var/lib/nftban/reports:/var/lib/nftban/backup"

# Maximum file size to send (KB)
# Default: 10 MB
NFTBAN_MAIL_MAX_FILE_SIZE="10240"

# Validate email addresses before sending
# Values: "YES", "NO"
NFTBAN_MAIL_VALIDATE_RECIPIENTS="YES"

# =============================================================================
# MAIL PORTS (For Firewall Status Checks)
# =============================================================================

# SMTP outbound ports
NFTBAN_MAIL_SMTP_PORT="25"
NFTBAN_MAIL_SUBMISSION_PORT="587"
NFTBAN_MAIL_SMTPS_PORT="465"

# IMAP/POP3 inbound ports (for Dovecot checks)
NFTBAN_MAIL_IMAP_PORT="143"
NFTBAN_MAIL_IMAPS_PORT="993"
NFTBAN_MAIL_POP3_PORT="110"
NFTBAN_MAIL_POP3S_PORT="995"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Email encoding
NFTBAN_MAIL_ENCODING="UTF-8"

# Use HTML emails
# Values: "YES", "NO"
NFTBAN_MAIL_USE_HTML="YES"

# Fallback to plain text if HTML fails
# Values: "YES", "NO"
NFTBAN_MAIL_PLAINTEXT_FALLBACK="YES"

# Email subject prefix
# Prepended to all email subjects
NFTBAN_MAIL_SUBJECT_PREFIX="[NFTBan]"

# =============================================================================
# DEBUG SETTINGS
# =============================================================================

# Debug mail sending (logs full email content)
# Controlled by NFTBAN_DEBUG_MODE, can override here
# Values: "true", "false", "auto" (follows DEBUG_MODE)
NFTBAN_MAIL_DEBUG="auto"

# Save sent emails to directory (for debugging)
# Leave blank to disable
# Example: "/var/log/nftban/sent_emails"
NFTBAN_MAIL_SAVE_SENT=""

# =============================================================================
# AUTO-ESCALATION FOR DEBUG MODE
# =============================================================================

# When NFTBAN_DEBUG_MODE=true, automatically enable mail debugging
if [[ "${NFTBAN_DEBUG_MODE:-false}" == "true" ]]; then
    [[ "${NFTBAN_MAIL_DEBUG:-auto}" == "auto" ]] && NFTBAN_MAIL_DEBUG="true"
fi

# =============================================================================
# USER CUSTOMIZATIONS
# =============================================================================
# DO NOT edit this file for customizations!
# Use /etc/nftban/nftban.conf.local instead:
#
# Example:
#   NFTBAN_MAIL_RECIPIENT="myemail@company.com"
#   NFTBAN_COMPANY_NAME="Acme Corporation"
#   NFTBAN_LOGO_LOCATION="/usr/share/nftban/assets/company_logo.png"
#
# =============================================================================

# End of mail.conf
