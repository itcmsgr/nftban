# =============================================================================
# Node Exporter - Textfile Collector Configuration
# =============================================================================
# Location: /etc/systemd/system/node_exporter.service.d/textfile-collector.conf
#
# This override configures Node Exporter to:
# 1. Enable textfile collector for NFTBan metrics
# 2. Bind to localhost only (security)
#
# Installation:
#   sudo cp textfile-collector.conf /etc/systemd/system/node_exporter.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart node_exporter
# =============================================================================

[Service]
# Clear existing ExecStart (required before setting new value)
ExecStart=

# Set new ExecStart with textfile collector and localhost binding
# Note: Adjust binary path if needed (/usr/bin or /usr/local/bin)
ExecStart=/usr/bin/node_exporter \
  --web.listen-address=127.0.0.1:9100 \
  --collector.textfile.directory=/var/lib/node_exporter/textfile_collector

# Optional: Add additional collectors or disable unwanted ones
# --collector.disable-defaults \
# --collector.textfile \
# --collector.cpu \
# --collector.meminfo \
# --collector.diskstats
