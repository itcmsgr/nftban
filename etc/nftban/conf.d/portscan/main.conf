# -----------------------------------------------------------------------------
# MODULE ENABLE/DISABLE
# -----------------------------------------------------------------------------
# Master switch for portscan detection (disabled by default)
PORTSCAN_ENABLED="false"

# -----------------------------------------------------------------------------
# MODE SELECTION
# -----------------------------------------------------------------------------
# Choose portscan detection mode:
#
#   auto     - Auto-detect: use Suricata if available, otherwise Classic
#   classic  - Force Classic mode (nftables log-based detection)
#   suricata - Force Suricata mode (requires Suricata installed & running)
#   hybrid   - Use both: Classic logging + Suricata analysis
#
PORTSCAN_MODE="auto"

# -----------------------------------------------------------------------------
# AUTO-DETECTION SETTINGS
# -----------------------------------------------------------------------------
# How to detect if Suricata is available (same as DDOS module)

# Check if Suricata service is running
PORTSCAN_AUTO_CHECK_SERVICE="true"

# Check if Suricata binary exists
PORTSCAN_AUTO_CHECK_BINARY="true"

# Check if EVE JSON file exists and is being written to
PORTSCAN_AUTO_CHECK_EVE_FILE="true"

# Suricata service name (for systemctl check)
PORTSCAN_SURICATA_SERVICE_NAME="suricata"

# Suricata binary path (for existence check)
PORTSCAN_SURICATA_BINARY="/usr/bin/suricata"

# EVE file freshness threshold (seconds) - file must be updated within this time
PORTSCAN_EVE_FRESHNESS_THRESHOLD="60"

# -----------------------------------------------------------------------------
# HYBRID MODE SETTINGS
# -----------------------------------------------------------------------------
# When PORTSCAN_MODE="hybrid", both Classic and Suricata run together

# Classic mode provides nftables logging for audit trail
# Suricata mode provides intelligent portscan detection

# Enable Classic logging even in Suricata mode
PORTSCAN_HYBRID_CLASSIC_LOGGING="true"

# In hybrid mode, use Suricata for detection, Classic for logging only
PORTSCAN_HYBRID_SURICATA_DETECT="true"

# -----------------------------------------------------------------------------
# NFTABLES SETTINGS
# -----------------------------------------------------------------------------
# Chain and table names

PORTSCAN_NFT_TABLE_IPV4="ip nftban"
PORTSCAN_NFT_TABLE_IPV6="ip6 nftban"
PORTSCAN_NFT_CHAIN="portscan_detection"

# Position in input chain (after which rule to insert jump)
# Options: "established" (after ct state established,related)
#          "whitelist"   (after whitelist check)
#          "ddos"        (after ddos protection)
#          "first"       (at the beginning)
PORTSCAN_NFT_JUMP_POSITION="ddos"

# -----------------------------------------------------------------------------
# WHITELIST
# -----------------------------------------------------------------------------
# IPs/networks that should NEVER be flagged for portscan
#
# NOTE: Whitelist is now CENTRALIZED in /etc/nftban/whitelist.d/*.conf
# Use: nftban whitelist add <ip> [comment]
# All modules share the same whitelist (SINGLE SOURCE OF TRUTH)

# Auto-whitelist localhost
PORTSCAN_WHITELIST_LOCALHOST="true"

# Auto-whitelist private networks (RFC1918)
PORTSCAN_WHITELIST_PRIVATE="true"

# Auto-whitelist known monitoring services (Nagios, Zabbix, etc.)
PORTSCAN_WHITELIST_MONITORING="true"

# -----------------------------------------------------------------------------
# GLOBAL LIMITS (Safety Net)
# -----------------------------------------------------------------------------
# Maximum IPs to block (prevent runaway blocking)
PORTSCAN_MAX_BLOCKED_IPS="5000"

# Maximum block duration (seconds) - safety cap
PORTSCAN_MAX_BAN_DURATION="86400"

# Minimum time between blocks of same IP (seconds)
PORTSCAN_MIN_REBLOCK_INTERVAL="300"

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
# Alert on significant events

# Enable email notifications
PORTSCAN_NOTIFY_EMAIL="false"
PORTSCAN_NOTIFY_EMAIL_TO=""

# Enable webhook notifications
PORTSCAN_NOTIFY_WEBHOOK="false"
PORTSCAN_NOTIFY_WEBHOOK_URL=""

# Threshold for notification (minimum ports or score)
PORTSCAN_NOTIFY_THRESHOLD="10"

# =============================================================================
# END OF MAIN CONFIGURATION
# =============================================================================
