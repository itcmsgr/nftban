name: Generate SHA256 Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate SHA256SUMS.txt
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating SHA256SUMS.txt for all tracked files..."

          # Gather metadata
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Generate checksums for all tracked files except SHA256SUMS.txt itself
          # Format: <hash>  <filepath> (two spaces, sorted by filepath)
          {
            echo "# nftban SHA256 Checksums"
            echo "# Generated: $TIMESTAMP"
            echo "# Commit: $COMMIT_SHORT ($COMMIT_HASH)"
            echo "# Branch: $BRANCH"
            echo "#"
            echo "# This file contains SHA256 checksums for all tracked files in the repository."
            echo "# Use 'sha256sum -c SHA256SUMS.txt' to verify file integrity (ignores comment lines)."
            echo "# Format: <hash>  <filepath> (standard SHA256 format, two spaces)"
            echo "#"

            while IFS= read -r file; do
              sha256sum "$file"
            done < <(git ls-files ':!:SHA256SUMS.txt') | sort -k2
          } > SHA256SUMS.txt.tmp

          # Count files (excluding header lines)
          file_count=$(grep -v '^#' SHA256SUMS.txt.tmp | wc -l)

          # Add file count to header (insert before the blank line)
          sed -i "4a# Total files: $file_count" SHA256SUMS.txt.tmp

          # Check if file changed (compare content only, ignoring timestamp changes)
          content_changed=true
          if [[ -f SHA256SUMS.txt ]]; then
            # Compare only the checksum lines (not the header with timestamps)
            if diff -q <(grep -v '^#' SHA256SUMS.txt.tmp) <(grep -v '^#' SHA256SUMS.txt) >/dev/null 2>&1; then
              echo "No changes to file checksums (only metadata updated)"
              content_changed=false
            fi
          fi

          if [[ "$content_changed" == "false" ]]; then
            echo "No file changes detected, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm -f SHA256SUMS.txt.tmp
          else
            mv SHA256SUMS.txt.tmp SHA256SUMS.txt
            echo "SHA256SUMS.txt updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Total files tracked: $file_count"
          fi

      - name: Commit and push changes
        if: steps.generate.outputs.changed == 'true'
        run: |
          git add SHA256SUMS.txt
          git commit -m "chore: update SHA256SUMS.txt (automated)

          - Reflects current state of all tracked files
          - Deletions/additions automatically included
          - Sorted by filepath for stability
          - Generated via GitHub Actions workflow

          🤖 Automated checksum update"

          git push origin main
