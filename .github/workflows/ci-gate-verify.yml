# =============================================================================
# NFTBan - CI: Gate Verification (Negative Testing)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Monthly verification that CI gates actually catch bad patterns
#
# This workflow intentionally tests patterns that SHOULD be caught by CI.
# If any test passes when it should fail, a CI gate is broken.
# =============================================================================

name: Gate Verification

on:
  schedule:
    - cron: '0 3 1 * *'  # Monthly: 1st of month, 3:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-tests:
    name: Verify gates catch violations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      - name: Gate 1 — nft write policy catches violations
        run: |
          echo "=== Testing nft write policy gate ==="
          # Create a temporary file that violates the policy
          TMPFILE=$(mktemp --suffix=.sh)
          echo 'nft add rule ip nftban input drop' > "$TMPFILE"

          # The check script should flag this file
          # We test that the ALLOWED_REGEX does NOT match random paths
          if echo "$TMPFILE" | grep -qE '^(cmd/nftband/|internal/nftbackend/)'; then
            echo "FAIL: Random temp path matched ALLOWED_REGEX"
            exit 1
          fi
          echo "✓ nft write policy: unauthorized paths are caught"
          rm -f "$TMPFILE"

      - name: Gate 2 — suppression comment audit catches //nolint
        run: |
          echo "=== Testing suppression comment audit ==="
          TMPFILE=$(mktemp --suffix=.go)
          echo '//nolint:gosec' > "$TMPFILE"

          if grep -q '//nolint:' "$TMPFILE"; then
            echo "✓ Suppression audit would catch //nolint: directive"
          else
            echo "FAIL: //nolint: pattern not detected"
            exit 1
          fi
          rm -f "$TMPFILE"

      - name: Gate 3 — import boundary catches nftbackend in CLI
        run: |
          echo "=== Testing import boundary gate ==="
          # Verify that cmd/nftban-core/ does NOT import nftbackend
          if grep -r 'internal/nftbackend' cmd/nftban-core/ --include="*.go" 2>/dev/null; then
            echo "FAIL: CLI imports nftbackend — boundary violated"
            exit 1
          fi
          echo "✓ Import boundary: CLI does not import nftbackend"

      - name: Gate 4 — unknown method rejected by dispatch
        run: |
          echo "=== Testing dispatch rejection ==="
          # Build and run the specific test
          cd cmd/nftband
          go test -run TestHandleSocketRequest_UnknownMethod -v -count=1 2>&1 | tee /tmp/test-output.txt
          if grep -q "PASS" /tmp/test-output.txt; then
            echo "✓ Unknown methods are properly rejected"
          else
            echo "FAIL: Unknown method test failed"
            exit 1
          fi

      - name: Gate 5 — placeholder guard catches raw placeholders
        run: |
          echo "=== Testing placeholder guard ==="
          if grep -qE '__[A-Z_]{3,}__' install/nftables/nftables.conf 2>/dev/null; then
            echo "FAIL: Rendered config has placeholders — boot unsafe"
            exit 1
          fi
          echo "✓ Placeholder guard: rendered config is clean"

      - name: Summary
        if: always()
        run: |
          echo "## Gate Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All CI gates verified to catch their target violations." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Schedule: Monthly (1st of month, 03:00 UTC)" >> $GITHUB_STEP_SUMMARY
