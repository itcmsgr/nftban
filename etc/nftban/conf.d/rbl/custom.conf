# Purpose: Enable/disable specific RBL providers
#
# **Format**
# enablerbl:domain[:url]  - Enable/add specific RBL provider
# disablerbl:domain       - Disable specific RBL provider (exclude from checks)
#
# **Examples**
#
# Disable slow/unreliable RBL:
# disablerbl:slow.rbl.example.com
#
# Add custom RBL:
# enablerbl:my.custom.rbl.net:https://example.com/info
# =============================================================================

# Custom RBL enable/disable entries
# (One per line)

