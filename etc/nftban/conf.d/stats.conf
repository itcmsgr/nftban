# =============================================================================
# NFTBan v1.0 - Statistics & Reports Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Configuration for statistics collection and report generation
# =============================================================================

# -----------------------------------------------------------------------------
# REPORT GENERATION
# -----------------------------------------------------------------------------

# Enable/disable report generation (true/false)
STATS_ENABLED="true"

# Reports storage directory
STATS_REPORTS_DIR="/var/log/nftban/reports"   # v1.228.5: moved from /var/lib (logrotate-managed; nftban_log_t)

# Report retention (days)
STATS_RETENTION_DAYS="90"

# Default report format (html, json, csv, all)
STATS_DEFAULT_FORMAT="html"

# Include graphs in HTML reports (true/false)
STATS_INCLUDE_GRAPHS="true"

# -----------------------------------------------------------------------------
# EMAIL REPORTS
# -----------------------------------------------------------------------------

# Enable automated email reports (true/false)
# When enabled, scheduled reports will be emailed automatically
STATS_EMAIL_ENABLED="false"

# Email recipients for reports (comma-separated)
# Falls back to NFTBAN_MAIL_RECIPIENT from mail.conf if not set
STATS_EMAIL_RECIPIENTS=""

# Email format (html, text)
STATS_EMAIL_FORMAT="html"

# Attach CSV data to emails (true/false)
STATS_EMAIL_ATTACH_CSV="false"

# Email subject prefix
STATS_EMAIL_SUBJECT_PREFIX="[NFTBan Report]"

# -----------------------------------------------------------------------------
# SCHEDULED REPORTS
# -----------------------------------------------------------------------------

# Daily report time (HH:MM format)
# Leave empty to disable
STATS_DAILY_TIME=""

# Weekly report day (monday, tuesday, etc.)
# Leave empty to disable
STATS_WEEKLY_DAY=""

# Monthly report day (1-31)
# Leave empty to disable
STATS_MONTHLY_DAY=""

# Time period for scheduled reports (7d, 30d, etc.)
STATS_REPORT_PERIOD="7d"

# -----------------------------------------------------------------------------
# METRICS COLLECTION
# -----------------------------------------------------------------------------

# Collect detailed statistics (true/false)
# When enabled, gathers more granular data (higher disk usage)
STATS_DETAILED="false"

# Statistics collection interval (minutes)
STATS_INTERVAL="60"

# Include geo-location data in reports (true/false)
STATS_INCLUDE_GEO="true"

# Include port statistics (true/false)
STATS_INCLUDE_PORTS="true"

# Include service statistics (true/false)
STATS_INCLUDE_SERVICES="true"

# -----------------------------------------------------------------------------
# REPORT CUSTOMIZATION
# -----------------------------------------------------------------------------

# Company name shown in reports
STATS_COMPANY_NAME="${NFTBAN_COMPANY_NAME:-}"

# Logo URL for HTML reports
STATS_LOGO_URL="${NFTBAN_LOGO_LOCATION:-}"

# Report theme (light, dark)
STATS_THEME="light"

# Include version info in reports (true/false)
STATS_INCLUDE_VERSION="true"

# Custom report footer text
STATS_FOOTER_TEXT=""

# =============================================================================
# NOTES
# =============================================================================
#
# Configuration Priority:
#   1. stats.conf.local  (highest - git-ignored)
#   2. stats.conf        (this file - version controlled)
#   3. mail.conf         (fallback for email settings)
#   4. Built-in defaults (lowest)
#
# Create /etc/nftban/conf.d/stats.conf.local to override these settings
# without modifying the version-controlled file.
#
# =============================================================================
