# =============================================================================
# NFTBan v1.3.0 - Zabbix Integration Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Configuration for Zabbix trapper export with LLD support
#
# meta:name="zabbix_conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2026-01-22"
# meta:description="Zabbix trapper export configuration for NFTBan metrics"
#
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars="NFTBAN_ZABBIX_ENABLED,NFTBAN_ZABBIX_SERVER,NFTBAN_ZABBIX_PORT"
# meta:inventory.config_files="/etc/nftban/conf.d/zabbix.conf"
# meta:inventory.systemd_units="nftban-unified-exporter.timer"
# meta:inventory.network="outbound:10051/tcp"
# meta:inventory.privileges="none"
#
# Copy this file to /etc/nftban/conf.d/zabbix.conf and customize
# =============================================================================

# -----------------------------------------------------------------------------
# ZABBIX EXPORT SETTINGS
# -----------------------------------------------------------------------------

# Enable/disable Zabbix export (true/false)
NFTBAN_ZABBIX_ENABLED="false"

# Zabbix server hostname or IP address
NFTBAN_ZABBIX_SERVER=""

# Zabbix trapper port for OUTBOUND metrics push (default: 10051)
NFTBAN_ZABBIX_PORT="10051"

# Hostname as registered in Zabbix (must match exactly)
# Use "auto" or leave empty to use system hostname
NFTBAN_ZABBIX_HOSTNAME="auto"

# -----------------------------------------------------------------------------
# AUTHENTICATION
# -----------------------------------------------------------------------------

# Enable TLS encryption (true/false)
NFTBAN_ZABBIX_TLS_ENABLED="false"

# Enable PSK authentication (true/false) - mutually exclusive with TLS
NFTBAN_ZABBIX_PSK_ENABLED="false"

# PSK identity (required if PSK_ENABLED=true)
NFTBAN_ZABBIX_PSK_IDENTITY=""

# PSK key file path (required if PSK_ENABLED=true)
NFTBAN_ZABBIX_PSK_FILE=""

# TLS certificate file (required if TLS_ENABLED=true)
NFTBAN_ZABBIX_TLS_CERT=""

# TLS key file (required if TLS_ENABLED=true)
NFTBAN_ZABBIX_TLS_KEY=""

# TLS CA file (optional, for certificate verification)
NFTBAN_ZABBIX_TLS_CA=""

# -----------------------------------------------------------------------------
# FIREWALL
# -----------------------------------------------------------------------------

# Automatically allow outbound traffic to Zabbix server (true/false)
# When enabled, NFTBan adds nftables rule to allow Zabbix trapper port
NFTBAN_ZABBIX_FIREWALL_AUTO="true"

# -----------------------------------------------------------------------------
# MULTI-TARGET SUPPORT (DR/Backup)
# -----------------------------------------------------------------------------
# Configure secondary Zabbix server for redundancy
# Metrics are sent to both targets when enabled

# Enable secondary target (true/false)
NFTBAN_ZABBIX_SECONDARY_ENABLED="false"

# Secondary Zabbix server
NFTBAN_ZABBIX_SECONDARY_SERVER=""

# Secondary port (default: 10051)
NFTBAN_ZABBIX_SECONDARY_PORT="10051"

# Secondary TLS enabled (inherits primary settings if empty)
NFTBAN_ZABBIX_SECONDARY_TLS_ENABLED=""

# -----------------------------------------------------------------------------
# EXPORT OPTIONS
# -----------------------------------------------------------------------------

# Export interval in seconds (default: 60)
NFTBAN_ZABBIX_INTERVAL="60"

# Enable Low-Level Discovery (LLD) for modules, feeds, countries (true/false)
NFTBAN_ZABBIX_LLD_ENABLED="true"

# LLD discovery interval in seconds (default: 3600 = 1 hour)
NFTBAN_ZABBIX_LLD_INTERVAL="3600"

# Send timestamps with metrics (true/false)
NFTBAN_ZABBIX_SEND_TIMESTAMPS="true"

# Batch size for sending metrics (default: 100)
NFTBAN_ZABBIX_BATCH_SIZE="100"

# -----------------------------------------------------------------------------
# METRIC SELECTION
# -----------------------------------------------------------------------------
# Control which metrics are exported to Zabbix (true/false)

# Core daemon metrics (uptime, version, etc.)
NFTBAN_ZABBIX_METRICS_DAEMON="true"

# Ban statistics (total, active, by country)
NFTBAN_ZABBIX_METRICS_BANS="true"

# Memory usage metrics
NFTBAN_ZABBIX_METRICS_MEMORY="true"

# Module status metrics
NFTBAN_ZABBIX_METRICS_MODULES="true"

# Feed statistics
NFTBAN_ZABBIX_METRICS_FEEDS="true"

# NFTables rule counts
NFTBAN_ZABBIX_METRICS_NFTABLES="true"

# GeoIP statistics
NFTBAN_ZABBIX_METRICS_GEOIP="true"

# Server info (hostname, kernel, etc.)
NFTBAN_ZABBIX_METRICS_SERVER="true"

# -----------------------------------------------------------------------------
# TROUBLESHOOTING
# -----------------------------------------------------------------------------

# Enable debug logging for Zabbix export (true/false)
NFTBAN_ZABBIX_DEBUG="false"

# Timeout for Zabbix connections in seconds
NFTBAN_ZABBIX_TIMEOUT="10"

# Retry count on failure
NFTBAN_ZABBIX_RETRIES="3"
