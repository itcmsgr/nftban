#
# NFTBan Event Rule Engine — Web Path Probes
# ===========================================
# Detects common web path probing patterns.
# Operates on normalized events only — no payload inspection.

name: web_paths
rules:
  - id: WP-001
    name: "xmlrpc.php burst"
    match:
      event_type: http_probe
      metadata:
        uri:
          contains: "/xmlrpc.php"
    threshold:
      count: 10
      window: 60s
      per: src_ip
    score: 30
    action: ban_short

  - id: WP-002
    name: "wp-login brute force"
    match:
      event_type: http_probe
      metadata:
        uri:
          contains: "/wp-login.php"
        method:
          exact: "POST"
    threshold:
      count: 20
      window: 120s
      per: src_ip
    score: 50
    action: ban_long

  - id: WP-003
    name: "wp-admin probe"
    match:
      event_type: http_probe
      metadata:
        uri:
          prefix: "/wp-admin"
    threshold:
      count: 15
      window: 60s
      per: src_ip
    score: 25
    action: ban_short

  - id: WP-004
    name: "phpmyadmin probe"
    match:
      event_type: http_probe
      metadata:
        uri:
          contains: "phpmyadmin"
    threshold:
      count: 5
      window: 60s
      per: src_ip
    score: 40
    action: ban_short

  - id: WP-005
    name: "env file probe"
    match:
      event_type: http_probe
      metadata:
        uri:
          contains: ".env"
    threshold:
      count: 3
      window: 60s
      per: src_ip
    score: 50
    action: ban_long

  - id: WP-006
    name: "git directory probe"
    match:
      event_type: http_probe
      metadata:
        uri:
          contains: "/.git/"
    threshold:
      count: 3
      window: 60s
      per: src_ip
    score: 50
    action: ban_long
