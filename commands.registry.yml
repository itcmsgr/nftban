emulate:
  category: developer_sysadmin
  description: "Simulate firewall rule evaluation (test inbound and outbound packets)"
  risk: advanced
  audience: [cli]
  capability: debug_internal
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  options:
    --out:
      type: string
      description: "Test outbound connection to IP:PORT (egress testing)"
      examples: ["--out 8.8.8.8:443", "--out :3306"]
    --proto:
      type: enum
      values: [tcp, udp]
      description: "Protocol to test (default: tcp)"
    --port:
      type: int
      description: "Destination port (for inbound tests)"
    --direction:
      type: enum
      values: [in, out]
      description: "Direction to test (default: in)"
    --json:
      type: bool
      description: "Output in JSON format"
  examples:
    - "nftban emulate 1.2.3.4                    # Test inbound from IP"
    - "nftban emulate 1.2.3.4 --proto tcp --port 22  # Test SSH from IP"
    - "nftban emulate --out 8.8.8.8:443         # Test outbound HTTPS"
    - "nftban emulate --out :3306               # Test outbound MySQL (any dest)"
    - "nftban emulate --out 10.0.0.1:25         # Test outbound SMTP to IP"
  notes:
    - "Inbound (default): Tests if IP can connect TO this server"
    - "Outbound (--out): Tests if this server can connect OUT to IP:port"
    - "Use --out before 'nftban port egress enforce' to verify ports"

