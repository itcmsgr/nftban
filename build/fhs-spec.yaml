# =============================================================================
# CONDITIONAL DIRECTORIES (feature-gated, not in base tmpfiles)
# =============================================================================
conditional:
  # Metrics feature directories - created by 'nftban metrics enable'
  metrics:
    condition: "metrics_enabled"
    directories:
      - path: /etc/nftban/metrics
        artifact_class: config
        mode: "0750"
        owner: root
        group: nftban
        description: "Metrics configuration (VictoriaMetrics, Prometheus)"
        created_by: feature_enable

      - path: /var/lib/node_exporter
        artifact_class: external
        mode: "0755"
        owner: node_exporter
        group: node_exporter
        description: "Node exporter textfile directory"
        created_by: feature_enable
        note: "External service - only create if node_exporter installed"

  # GUI feature was retired in v1.139.2 (PR #722) and the feature-directory
  # entry was removed in v1.144.0 PR-A (FHS-SPEC-GUI-MENTION). There is no
  # cmd_gui.sh and no `nftban gui enable` command. The /etc/nftban/gui
  # directory is not created by base nftban.

  # Panel directories - created during panel detection/install
  panels:
    condition: "panel_detected"
    note: "Panel plugin directories are created by panel integration installers, not by base nftban"

# =============================================================================
# DISTRO-SPECIFIC PATH RESOLUTION
# =============================================================================
distro_paths:
  note: "Resolved at runtime from /etc/nftban/distros/*.conf"
  keys:
    - polkit_rules_dir
    - polkit_actions_dir
    - systemd_unit_dir
    - bash_completion_dir
    - logrotate_dir

# =============================================================================
# FILE PERMISSIONS (Single Source of Truth)
# =============================================================================
# Defines file permission rules. Used by health fix and permissions enforcement.
# Format: path|pattern|mode|owner|group|recursive|exclude|capabilities
# =============================================================================
file_permissions:
  # /etc/nftban - config files readable by daemon
  - path: /etc/nftban
    artifact_class: config
    pattern: "*.conf"
    mode: "0640"
    owner: root
    group: nftban
    recursive: true

  - path: /etc/nftban
    artifact_class: config
    pattern: "*.local"
    mode: "0640"
    owner: root
    group: nftban
    recursive: true

  # /usr/lib/nftban - shell scripts executable
  - path: /usr/lib/nftban
    artifact_class: program
    pattern: "*.sh"
    mode: "0755"
    owner: root
    group: root
    recursive: true

  # /usr/lib/nftban/bin - Go binaries with CAP_NET_ADMIN
  - path: /usr/lib/nftban/bin
    artifact_class: program
    pattern: "*"
    mode: "0755"
    owner: root
    group: root
    capabilities: "cap_net_admin+ep:nftban-core,nftband"

  # /usr/lib/nftban/sbin - helper binaries executable
  - path: /usr/lib/nftban/sbin
    artifact_class: program
    pattern: "*"
    mode: "0755"
    owner: root
    group: root

  # /usr/sbin/nftban* - CLI binaries group-restricted
  - path: /usr/sbin
    artifact_class: program
    pattern: "nftban*"
    mode: "0750"
    owner: root
    group: nftban

  # /var/lib/nftban - state files
  - path: /var/lib/nftban
    artifact_class: state
    pattern: "*"
    mode: "0640"
    owner: nftban
    group: nftban
    recursive: true
    exclude: "/var/lib/nftban/reports/auditors"

  # /var/lib/nftban/reports/auditors - auditor access
  - path: /var/lib/nftban/reports/auditors
    artifact_class: state
    pattern: "*"
    mode: "0660"
    owner: root
    group: nftban-auditor
    recursive: true

  # /var/log/nftban - log files
  - path: /var/log/nftban
    artifact_class: log
    retention_owner: logrotate
    pattern: "*"
    mode: "0640"
    owner: nftban
    group: nftban
    recursive: true
    exclude: "/var/log/nftban/suricata"
    # v1.139 PR-B (FHS-UNGEN-LOGROTATE-CREATE): authoritative for the
    # logrotate `create` directive on stanzas covering /var/log/nftban/*
    # (excluding /var/log/nftban/suricata/*). Bridge-tested by
    # internal/nftbanconf/logs_logrotate_create_parity_test.go — every
    # matching `create MODE OWNER GROUP` line in
    # install/config/nftban.logrotate must equal this triple.
    logrotate_create: true

  # /var/log/nftban/suricata - suricata writes
  - path: /var/log/nftban/suricata
    artifact_class: log
    retention_owner: logrotate
    pattern: "*"
    mode: "0640"
    owner: suricata
    group: nftban
    recursive: true
    # v1.139 PR-B: authoritative for the logrotate `create` directive on
    # stanzas under /var/log/nftban/suricata/* in
    # install/config/nftban-suricata.logrotate. Parity-tested.
    logrotate_create: true
