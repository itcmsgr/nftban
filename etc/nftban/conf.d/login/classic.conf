# =============================================================================
# NFTBan Login Monitor - CLASSIC MODE Configuration
# =============================================================================
# Configuration for Classic mode (journalctl/log file parsing).
# Used when Suricata is not available or in hybrid mode.
#
# File: /etc/nftban/conf.d/login/classic.conf
# =============================================================================

# -----------------------------------------------------------------------------
# LOG SOURCE SELECTION
# -----------------------------------------------------------------------------
# How to read authentication logs

# Primary source: "journalctl" (recommended) or "file"
LOGIN_CLASSIC_SOURCE="journalctl"

# Use JSON output from journalctl (requires jq)
LOGIN_CLASSIC_JOURNALCTL_JSON="true"

# Fallback to file parsing if journalctl fails
LOGIN_CLASSIC_FALLBACK_FILE="true"

# -----------------------------------------------------------------------------
# JOURNALCTL SETTINGS
# -----------------------------------------------------------------------------
# Settings for journalctl-based monitoring

# Follow mode (real-time monitoring)
LOGIN_CLASSIC_JOURNALCTL_FOLLOW="true"

# Include cursor for resuming after restart
LOGIN_CLASSIC_JOURNALCTL_CURSOR="/var/lib/nftban/login-journal-cursor"

# Priority filter (0=emerg to 7=debug, empty=all)
LOGIN_CLASSIC_JOURNALCTL_PRIORITY=""

# -----------------------------------------------------------------------------
# LOG FILE PATHS
# -----------------------------------------------------------------------------
# Used when LOGIN_CLASSIC_SOURCE="file" or as fallback

# Auth log path (varies by distro)
LOGIN_CLASSIC_AUTH_LOG="/var/log/auth.log"
LOGIN_CLASSIC_SECURE_LOG="/var/log/secure"

# Mail logs
LOGIN_CLASSIC_MAIL_LOG="/var/log/mail.log"
LOGIN_CLASSIC_MAILLOG="/var/log/maillog"

# Web server logs (for WordPress detection)
LOGIN_CLASSIC_APACHE_ERROR="/var/log/apache2/error.log"
LOGIN_CLASSIC_APACHE_ACCESS="/var/log/apache2/access.log"
LOGIN_CLASSIC_HTTPD_ERROR="/var/log/httpd/error_log"
LOGIN_CLASSIC_HTTPD_ACCESS="/var/log/httpd/access_log"
LOGIN_CLASSIC_NGINX_ERROR="/var/log/nginx/error.log"
LOGIN_CLASSIC_NGINX_ACCESS="/var/log/nginx/access.log"

# FTP logs
LOGIN_CLASSIC_PUREFTPD_LOG="/var/log/pureftpd.log"
LOGIN_CLASSIC_VSFTPD_LOG="/var/log/vsftpd.log"

# Control panel logs
LOGIN_CLASSIC_DIRECTADMIN_LOG="/var/log/directadmin/login.log"

# -----------------------------------------------------------------------------
# GLOBAL THRESHOLDS
# -----------------------------------------------------------------------------
# Default thresholds (can be overridden per-service in services.conf)

# Failed attempts before action
LOGIN_CLASSIC_FAIL_THRESHOLD="5"

# Time window for counting failures (seconds)
LOGIN_CLASSIC_FAIL_WINDOW="300"

# Reset failure count after successful login
LOGIN_CLASSIC_RESET_ON_SUCCESS="true"

# -----------------------------------------------------------------------------
# PATTERN MATCHING
# -----------------------------------------------------------------------------
# Common auth failure patterns (service-specific in services.conf)

# Patterns are extended regex, case-insensitive by default
LOGIN_CLASSIC_CASE_INSENSITIVE="true"

# Generic failed authentication patterns
LOGIN_CLASSIC_PATTERN_FAILED="[Ff]ailed|[Aa]uthentication [Ff]ailure|[Ii]nvalid [Pp]assword|[Aa]ccess [Dd]enied"

# Generic invalid user patterns
LOGIN_CLASSIC_PATTERN_INVALID_USER="[Ii]nvalid user|[Uu]nknown user|[Nn]o such user"

# Connection closed patterns (often indicates password failure)
LOGIN_CLASSIC_PATTERN_DISCONNECT="[Cc]onnection closed|[Dd]isconnected|[Pp]reauth"

# Banned/blocked patterns (other security systems)
LOGIN_CLASSIC_PATTERN_BANNED="[Bb]anned|[Bb]locked|[Dd]enied"

# -----------------------------------------------------------------------------
# SCORING ENGINE
# -----------------------------------------------------------------------------
# Calculate risk score for each event (0.0 - 1.0 scale)

# Base score per failed attempt
LOGIN_CLASSIC_SCORE_FAILED="0.10"

# Invalid user attempt (higher risk)
LOGIN_CLASSIC_SCORE_INVALID_USER="0.15"

# Root/admin login attempt (critical)
LOGIN_CLASSIC_SCORE_ROOT_ATTEMPT="0.25"

# Attempt during off-hours (configurable in services.conf)
LOGIN_CLASSIC_SCORE_OFF_HOURS="0.10"

# Multiple services targeted from same IP
LOGIN_CLASSIC_SCORE_MULTI_SERVICE="0.15"

# Rapid attempts (faster than normal typing)
LOGIN_CLASSIC_SCORE_RAPID="0.10"
LOGIN_CLASSIC_RAPID_THRESHOLD_MS="500"

# Repetition bonuses
LOGIN_CLASSIC_SCORE_REPEAT_3="0.10"    # 3+ failures
LOGIN_CLASSIC_SCORE_REPEAT_5="0.15"    # 5+ failures
LOGIN_CLASSIC_SCORE_REPEAT_10="0.25"   # 10+ failures

# Known bad username patterns (honeypot indicators)
LOGIN_CLASSIC_SCORE_HONEYPOT_USER="0.20"
LOGIN_CLASSIC_HONEYPOT_USERS="admin,root,test,guest,user,administrator,oracle,mysql,postgres"

# -----------------------------------------------------------------------------
# ACTION THRESHOLDS
# -----------------------------------------------------------------------------
# What to do based on final risk score

# Observe only (log, no block)
LOGIN_CLASSIC_THRESHOLD_OBSERVE="0.25"

# Short block (temporary)
LOGIN_CLASSIC_THRESHOLD_BLOCK_SHORT="0.45"

# Long block (extended)
LOGIN_CLASSIC_THRESHOLD_BLOCK_LONG="0.65"

# Permanent block candidate
LOGIN_CLASSIC_THRESHOLD_BLOCK_PERMANENT="0.85"

# -----------------------------------------------------------------------------
# BAN DURATIONS
# -----------------------------------------------------------------------------
# Block durations for each threshold level

LOGIN_CLASSIC_BAN_DURATION_SHORT="900"        # 15 minutes
LOGIN_CLASSIC_BAN_DURATION_LONG="3600"        # 1 hour
LOGIN_CLASSIC_BAN_DURATION_PERMANENT="86400"  # 24 hours

# Score decay time (seconds) - how long before score resets
LOGIN_CLASSIC_SCORE_DECAY="1800"

# -----------------------------------------------------------------------------
# STATE MANAGEMENT
# -----------------------------------------------------------------------------
# Tracking login attempts across restarts

# State file for tracking failed attempts
LOGIN_CLASSIC_STATE_FILE="/var/lib/nftban/login-classic-state.db"

# Maximum tracked IPs (memory limit)
LOGIN_CLASSIC_MAX_TRACKED_IPS="50000"

# State file save interval (seconds)
LOGIN_CLASSIC_STATE_SAVE_INTERVAL="60"

# Cleanup old entries interval (seconds)
LOGIN_CLASSIC_CLEANUP_INTERVAL="300"

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------
# Processing settings

# Batch size for processing log entries
LOGIN_CLASSIC_BATCH_SIZE="100"

# Poll interval for log files (milliseconds)
LOGIN_CLASSIC_POLL_INTERVAL_MS="500"

# Maximum log lines to process per second
LOGIN_CLASSIC_MAX_LINES_PER_SEC="1000"

# Journal reader buffer size
LOGIN_CLASSIC_JOURNAL_BUFFER="8192"

# -----------------------------------------------------------------------------
# SPECIAL HANDLING
# -----------------------------------------------------------------------------
# Service-specific quirks

# Ignore PAM authentication (some services double-log)
LOGIN_CLASSIC_IGNORE_PAM_DUPLICATES="true"

# Aggregate IPv4/IPv6 from same host (dual-stack)
LOGIN_CLASSIC_AGGREGATE_DUAL_STACK="true"

# Follow symlinks for log files
LOGIN_CLASSIC_FOLLOW_SYMLINKS="true"

# Handle log rotation gracefully
LOGIN_CLASSIC_HANDLE_ROTATION="true"

# =============================================================================
# END OF CLASSIC MODE CONFIGURATION
# =============================================================================
