# Fail2ban filter for Dovecot IMAP/POP3 authentication failures
# Detects failed login attempts to email services
#
# Author: NFTBan Project
# Date: 2025-10-30

[Definition]

# Match "Login aborted" messages from Dovecot
# Covers both IMAP and POP3 protocols
# Example log line:
# Oct 30 14:23:45 server dovecot[12345]: imap-login: Login aborted: Maximum number of connections from host exceeded: rip=1.2.3.4
failregex = ^.*dovecot\[\d+\]: (?:imap|pop3)-login: Login aborted: .*rip=<HOST>

# Optional: Ignore known good IPs
ignoreregex =

# For systemd journal integration
journalmatch = _SYSTEMD_UNIT=dovecot.service

# Use system default date pattern
datepattern = {^LN-BEG}

[Init]
# Default values
# maxretry = 9
# findtime = 600 (10 minutes)
# bantime = 3600 (1 hour)
