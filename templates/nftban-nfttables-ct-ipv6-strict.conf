# Per-service connection caps (IPv6)
tcp dport {22,2222} ct count over 5 { ip6 saddr } log prefix "nftables: ssh6-connlimit " drop
tcp dport {25,465,587,110,143,993,995} ct count over 20 { ip6 saddr } log prefix "nftables: mail6-connlimit " drop
tcp dport {80,443,853} ct count over 200 { ip6 saddr } log prefix "nftables: web6-connlimit " drop
tcp dport {20,21,35000-35999,700,800} ct count over 50 { ip6 saddr } log prefix "nftables: misc6-connlimit " drop

# Per-source SYN flood protection
tcp flags syn ct state new ip6 saddr limit rate over 20/second burst 40 packets drop
