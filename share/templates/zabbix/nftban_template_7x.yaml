zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b3621348568c4022b3a783846bc8a1aa
      name: 'Templates/Security'

  templates:
    - uuid: 76c37c2a70dc451a9298e9bb80c930ec
      template: 'NFTBan'
      name: 'NFTBan Firewall Monitoring'
      description: |
        NFTBan monitoring template for Zabbix 7.x

        Monitors:
        - Daemon status, version, uptime
        - Ban statistics (total, 24h, rate, throughput)
        - Runtime metrics (heap, GC, goroutines) via IPC
        - IPC statistics (requests, latency, errors)
        - Network connections (active, established, wait states)
        - System metrics (memory%, iowait%, disk%)
        - Module status per enabled module
        - Feed status and IP counts
        - GeoIP statistics
        - nftables rule/packet counts
        - Full server inventory (OS, IPs, hardware)

        Smart Update Intervals:
        - Critical (30s): daemon status
        - Dynamic (1m): bans, memory, load
        - Semi-static (5m): runtime, IPC
        - Inventory (1h): OS, IPs, hardware

        Requirements:
        - NFTBan v1.4.0+
        - Zabbix 7.x with Trapper support

        Documentation: https://nftban.com/docs/zabbix
      vendor:
        name: NFTBan
        version: '1.4.0'
      groups:
        - name: 'Templates/Security'

      # =======================================================================
      # MACROS
      # =======================================================================
      macros:
        - macro: '{$NFTBAN.BAN.RATE.WARN}'
          value: '100'
          description: 'Ban rate per minute warning threshold'
        - macro: '{$NFTBAN.BAN.RATE.HIGH}'
          value: '500'
          description: 'Ban rate per minute high threshold'
        - macro: '{$NFTBAN.MEMORY.WARN}'
          value: '524288000'
          description: 'Memory warning threshold (500MB)'
        - macro: '{$NFTBAN.MEMORY.HIGH}'
          value: '1073741824'
          description: 'Memory high threshold (1GB)'
        - macro: '{$NFTBAN.GEOIP.AGE.WARN}'
          value: '30'
          description: 'GeoIP database age warning (days)'
        - macro: '{$NFTBAN.UPDATE.INTERVAL}'
          value: '1m'
          description: 'Metric update interval'

      # =======================================================================
      # ITEMS - DAEMON INFO
      # =======================================================================
      items:
        # --- Daemon Status ---
        - uuid: ecd5f00d352d4a888f67a1a92e6bff02
          name: 'NFTBan: Daemon status'
          type: TRAP
          key: nftban.daemon.up
          value_type: UNSIGNED
          description: 'Daemon status: 1=running, 0=stopped'
          tags:
            - tag: component
              value: daemon
            - tag: scope
              value: availability
          triggers:
            - uuid: eb2ef6488a784bce8733ddeb163045b0
              expression: 'last(/NFTBan/nftban.daemon.up)=0'
              name: 'NFTBan daemon is down'
              priority: DISASTER
              description: 'NFTBan daemon is not running. Firewall protection may be compromised.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 751aef14149a4a41a90162b49446a382
              expression: 'nodata(/NFTBan/nftban.daemon.up,5m)=1'
              name: 'NFTBan metrics not received for 5 minutes'
              priority: HIGH
              description: 'No metrics received from NFTBan exporter. Check if the Zabbix exporter is running and network connectivity.'
              tags:
                - tag: scope
                  value: availability
                - tag: component
                  value: metrics

        - uuid: 7fe3f0a788b34d1caf6d25f112dc52c5
          name: 'NFTBan: Version'
          type: TRAP
          key: nftban.version
          value_type: CHAR
          description: 'NFTBan daemon version'
          tags:
            - tag: component
              value: daemon
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '1d'

        - uuid: 4847ad4a222b4e70a5ca7c7a5b971782
          name: 'NFTBan: Uptime'
          type: TRAP
          key: nftban.uptime
          value_type: FLOAT
          units: s
          description: 'Daemon uptime in seconds'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: 6c6b3585ac094b1dbfee25627a7a4178
              expression: 'last(/NFTBan/nftban.uptime)<300'
              name: 'NFTBan daemon restarted recently'
              priority: INFO
              description: 'NFTBan daemon uptime is less than 5 minutes.'
              manual_close: 'YES'

        - uuid: 209290b441f643dbb79b84600a4b4202
          name: 'NFTBan: PID'
          type: TRAP
          key: nftban.pid
          value_type: UNSIGNED
          description: 'Daemon process ID'
          tags:
            - tag: component
              value: daemon

        - uuid: 6258109ce0824583813fdac966b9375e
          name: 'NFTBan: Operating mode'
          type: TRAP
          key: nftban.mode
          value_type: CHAR
          description: 'Operating mode: normal, degraded, survival'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: 62d1f42e2554478b9b91545d4d91bb48
              expression: 'last(/NFTBan/nftban.mode)<>"normal" and length(last(/NFTBan/nftban.mode))>0'
              name: 'NFTBan in {ITEM.VALUE} mode'
              priority: WARNING
              description: 'NFTBan is running in degraded or survival mode due to resource pressure.'

        # --- Ban Statistics ---
        - uuid: 4d7c8fb6193a447fa8ef1c5368dbbc45
          name: 'NFTBan: Active bans'
          type: TRAP
          key: nftban.blocks.total
          value_type: UNSIGNED
          description: 'Currently active ban count'
          tags:
            - tag: component
              value: bans

        - uuid: 774f2c7f089a49eeaf9260227064bad0
          name: 'NFTBan: Bans (24h)'
          type: TRAP
          key: nftban.bans.last.24h
          value_type: UNSIGNED
          description: 'Bans in last 24 hours'
          tags:
            - tag: component
              value: bans
          triggers:
            - uuid: 6c249a5b93e146fe88b803db2138c0f4
              expression: 'last(/NFTBan/nftban.bans.last.24h)>1000'
              name: 'High ban rate (>{ITEM.VALUE}/24h)'
              priority: WARNING
              description: 'More than 1000 bans in the last 24 hours indicates increased attack activity.'
            - uuid: 382c46ca44904d90bdc49ecff9c16981
              expression: 'last(/NFTBan/nftban.bans.last.24h)>5000'
              name: 'Mass attack detected (>{ITEM.VALUE}/24h)'
              priority: HIGH
              description: 'More than 5000 bans in 24 hours suggests a coordinated attack.'

        - uuid: 073cbb5222414c45a9514ff41eab0a7d
          name: 'NFTBan: Bans (1h)'
          type: TRAP
          key: nftban.bans.last.1h
          value_type: UNSIGNED
          description: 'Bans in last hour'
          tags:
            - tag: component
              value: bans

        - uuid: c9604ea2ba874ec5939986b4758d21a2
          name: 'NFTBan: Ban rate'
          type: TRAP
          key: nftban.throughput.bans.per.minute
          value_type: FLOAT
          units: '/min'
          description: 'Current ban rate per minute'
          tags:
            - tag: component
              value: bans
          triggers:
            - uuid: 8f1ae00ad4894c5c814dde8d5bb70d6a
              expression: 'last(/NFTBan/nftban.throughput.bans.per.minute)>{$NFTBAN.BAN.RATE.WARN}'
              name: 'NFTBan ban rate warning ({ITEM.VALUE}/min)'
              priority: WARNING
              description: 'Ban rate exceeds warning threshold.'
            - uuid: 16192e3a5dba4df98ba72a1f81ead3e7
              expression: 'last(/NFTBan/nftban.throughput.bans.per.minute)>{$NFTBAN.BAN.RATE.HIGH}'
              name: 'NFTBan ban rate critical ({ITEM.VALUE}/min)'
              priority: HIGH
              description: 'Ban rate exceeds critical threshold - possible attack in progress.'

        - uuid: 731eaad794954d89b86e13872210c130
          name: 'NFTBan: Total bans'
          type: TRAP
          key: nftban.bans.total
          value_type: UNSIGNED
          description: 'Total bans since daemon start'
          tags:
            - tag: component
              value: bans

        - uuid: a3213a82a7204746bd627ec287352672
          name: 'NFTBan: Permanent bans (IPv4)'
          type: TRAP
          key: nftban.blacklist.ipv4.perm
          value_type: UNSIGNED
          description: 'Permanent IPv4 ban count'
          tags:
            - tag: component
              value: bans

        - uuid: a3213a82a7204746bd627ec287352673
          name: 'NFTBan: Permanent bans (IPv6)'
          type: TRAP
          key: nftban.blacklist.ipv6.perm
          value_type: UNSIGNED
          description: 'Permanent IPv6 ban count'
          tags:
            - tag: component
              value: bans

        - uuid: cc61d2bc79444c619bd53bee5048bde7
          name: 'NFTBan: Whitelist count'
          type: TRAP
          key: nftban.whitelist.total
          value_type: UNSIGNED
          description: 'Total whitelist entry count (IPv4 + IPv6)'
          tags:
            - tag: component
              value: bans

        # --- Memory Metrics ---
        - uuid: d3132fbbb12e491998cdc1ea0c398fe1
          name: 'NFTBan: Memory RSS'
          type: TRAP
          key: nftban.memory.rss
          value_type: UNSIGNED
          units: B
          description: 'Process resident set size'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: cbf397832c4047c98202da9494390545
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.WARN}'
              name: 'NFTBan memory usage high (>{ITEM.VALUE})'
              priority: WARNING
              description: 'NFTBan memory usage exceeds warning threshold.'
            - uuid: 4844595759324951aa4e1d54e9f3f66e
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.HIGH}'
              name: 'NFTBan memory usage critical (>{ITEM.VALUE})'
              priority: HIGH
              description: 'NFTBan memory usage exceeds critical threshold.'

        - uuid: d86e7c8c851c43a8819f43790d524bbd
          name: 'NFTBan: Open file descriptors'
          type: TRAP
          key: nftban.fds.open
          value_type: UNSIGNED
          description: 'Open file descriptors'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 36990932d0ef4c52aaa9463f09acef50
              expression: 'last(/NFTBan/nftban.fds.open)>1000'
              name: 'NFTBan open FDs > 1000'
              priority: WARNING
              description: 'High number of open file descriptors may indicate a leak.'

        - uuid: 0c2af91a438c468db9678f053df3e0af
          name: 'NFTBan: Goroutines'
          type: TRAP
          key: nftban.goroutines
          value_type: UNSIGNED
          description: 'Active goroutine count'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 628254e5e62c4164ad28c6d650d9770e
              expression: 'last(/NFTBan/nftban.goroutines)>500'
              name: 'NFTBan goroutine count high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High goroutine count may indicate a leak or high load.'

        - uuid: 19fbf4513ab44aea84bf45c3b7757977
          name: 'NFTBan: Threads'
          type: TRAP
          key: nftban.threads
          value_type: UNSIGNED
          description: 'OS thread count'
          tags:
            - tag: component
              value: memory

        # --- Module Metrics ---
        - uuid: 70f3f4c07fa346d18abab504460ccc36
          name: 'NFTBan: Modules enabled'
          type: TRAP
          key: nftban.modules.enabled
          value_type: UNSIGNED
          description: 'Number of enabled modules'
          tags:
            - tag: component
              value: modules

        - uuid: f1b63344e27b43df8ae48efa51c779b1
          name: 'NFTBan: Modules active'
          type: TRAP
          key: nftban.modules.active
          value_type: UNSIGNED
          description: 'Number of currently active modules'
          tags:
            - tag: component
              value: modules

        - uuid: 8af20790f2594aadb6877514bd53669f
          name: 'NFTBan: Modules failed'
          type: TRAP
          key: nftban.modules.failed
          value_type: UNSIGNED
          description: 'Number of failed modules'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 070a5090dfc643d4afbafeb0a34e357c
              expression: 'last(/NFTBan/nftban.modules.failed)>0'
              name: 'NFTBan module(s) failed ({ITEM.VALUE})'
              priority: HIGH
              description: 'One or more NFTBan modules have failed.'

        # --- Individual Module Status ---
        - uuid: 3c7a1b5d8e2f4a6b9c0d1e3f5a7b9c0d
          name: 'NFTBan: Module - Login status'
          type: TRAP
          key: nftban.module.login.status
          value_type: SIGNED
          description: 'Login module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 4d8b2c6e1f3a5b7c9d0e2f4a6b8c0d1e
              expression: 'last(/NFTBan/nftban.module.login.status)=-1'
              name: 'NFTBan Login module failed'
              priority: HIGH
              description: 'The Login module has failed and is not protecting against brute-force login attempts.'
              tags:
                - tag: component
                  value: modules

        - uuid: 5e9c3d7f2a4b6c8d0e1f3a5b7c9d1e2f
          name: 'NFTBan: Module - Portscan status'
          type: TRAP
          key: nftban.module.portscan.status
          value_type: SIGNED
          description: 'Portscan module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 6f0d4e8a3b5c7d9e1f2a4b6c8d0e2f3a
              expression: 'last(/NFTBan/nftban.module.portscan.status)=-1'
              name: 'NFTBan Portscan module failed'
              priority: HIGH
              description: 'The Portscan module has failed and is not detecting port scanning activity.'
              tags:
                - tag: component
                  value: modules

        - uuid: 7a1e5f9b4c6d8e0f2a3b5c7d9e1f3a4b
          name: 'NFTBan: Module - DDoS status'
          type: TRAP
          key: nftban.module.ddos.status
          value_type: SIGNED
          description: 'DDoS module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 8b2f6a0c5d7e9f1a3b4c6d8e0f2a4b5c
              expression: 'last(/NFTBan/nftban.module.ddos.status)=-1'
              name: 'NFTBan DDoS module failed'
              priority: HIGH
              description: 'The DDoS module has failed and is not protecting against distributed denial-of-service attacks.'
              tags:
                - tag: component
                  value: modules

        - uuid: 9c3a7b1d6e8f0a2b4c5d7e9f1a3b5c6d
          name: 'NFTBan: Module - Suricata status'
          type: TRAP
          key: nftban.module.suricata.status
          value_type: SIGNED
          description: 'Suricata module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 0d4b8c2e7f9a1b3c5d6e8f0a2b4c6d7e
              expression: 'last(/NFTBan/nftban.module.suricata.status)=-1'
              name: 'NFTBan Suricata module failed'
              priority: HIGH
              description: 'The Suricata module has failed and is not processing IDS/IPS alerts.'
              tags:
                - tag: component
                  value: modules

        - uuid: 1e5c9d3f8a0b2c4d6e7f9a1b3c5d7e8f
          name: 'NFTBan: Module - Feeds status'
          type: TRAP
          key: nftban.module.feeds.status
          value_type: SIGNED
          description: 'Feeds module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 2f6d0e4a9b1c3d5e7f8a0b2c4d6e8f9a
              expression: 'last(/NFTBan/nftban.module.feeds.status)=-1'
              name: 'NFTBan Feeds module failed'
              priority: HIGH
              description: 'The Feeds module has failed and is not loading threat intelligence feeds.'
              tags:
                - tag: component
                  value: modules

        - uuid: 3a7e1f5b0c2d4e6f8a9b1c3d5e7f9a0b
          name: 'NFTBan: Module - Geoban status'
          type: TRAP
          key: nftban.module.geoban.status
          value_type: SIGNED
          description: 'Geoban module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 4b8f2a6c1d3e5f7a9b0c2d4e6f8a1b2c
              expression: 'last(/NFTBan/nftban.module.geoban.status)=-1'
              name: 'NFTBan Geoban module failed'
              priority: HIGH
              description: 'The Geoban module has failed and is not blocking traffic by geographic location.'
              tags:
                - tag: component
                  value: modules

        - uuid: 5c9a3b7d2e4f6a8b0c1d3e5f7a9b1c2d
          name: 'NFTBan: Module - Watchdog status'
          type: TRAP
          key: nftban.module.watchdog.status
          value_type: SIGNED
          description: 'Watchdog module status: 1=active, 0=disabled, -1=failed'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: 6d0b4c8e3f5a7b9c1d2e4f6a8b0c2d3e
              expression: 'last(/NFTBan/nftban.module.watchdog.status)=-1'
              name: 'NFTBan Watchdog module failed'
              priority: HIGH
              description: 'The Watchdog module has failed and is not monitoring system pressure.'
              tags:
                - tag: component
                  value: modules

        # --- nftables Metrics ---
        - uuid: d57a5ac275bf4c81b8b57ad93aeb6cc3
          name: 'NFTBan: nftables sets'
          type: TRAP
          key: nftban.nft.sets.total
          value_type: UNSIGNED
          description: 'Total nftables sets'
          tags:
            - tag: component
              value: nftables

        - uuid: 2293bf7a361e4a94aecb302d0e19f7e6
          name: 'NFTBan: nftables elements'
          type: TRAP
          key: nftban.nft.elements.total
          value_type: UNSIGNED
          description: 'Total set elements across all sets'
          tags:
            - tag: component
              value: nftables
          triggers:
            - uuid: dd123ecf3f5a4f94891bd4e680fd82c8
              expression: 'last(/NFTBan/nftban.nft.elements.total)>100000'
              name: 'NFTBan large ruleset (>{ITEM.VALUE} elements)'
              priority: WARNING
              description: 'Large number of set elements may impact performance.'

        - uuid: 82c385c3a6284477b9c15aa797190864
          name: 'NFTBan: nftables rules'
          type: TRAP
          key: nftban.nftables.rules.total
          value_type: UNSIGNED
          description: 'Total nftables rules'
          tags:
            - tag: component
              value: nftables

        - uuid: 7c23d72575c74bdbb2e93d8b97edd6df
          name: 'NFTBan: nftables set elements (blacklist_ipv4)'
          type: TRAP
          key: 'nftban.nftables.set.elements[blacklist_ipv4]'
          value_type: UNSIGNED
          description: 'Elements in blacklist_ipv4 set'
          tags:
            - tag: component
              value: nftables

        - uuid: a5276e6e45d04d1dabb3c0cdb78634b2
          name: 'NFTBan: nftables set elements (blacklist_ipv6)'
          type: TRAP
          key: 'nftban.nftables.set.elements[blacklist_ipv6]'
          value_type: UNSIGNED
          description: 'Elements in blacklist_ipv6 set'
          tags:
            - tag: component
              value: nftables

        - uuid: 7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
          name: 'NFTBan: nftables apply latency'
          type: TRAP
          key: nftban.nftables.apply.latency.ms
          value_type: FLOAT
          units: ms
          description: 'Time taken to apply nftables changes (milliseconds)'
          tags:
            - tag: component
              value: nftables
          triggers:
            - uuid: 8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c
              expression: 'last(/NFTBan/nftban.nftables.apply.latency.ms)>100'
              name: 'NFTBan nftables apply latency high ({ITEM.VALUE}ms)'
              priority: WARNING
              description: 'nftables rule application is taking longer than 100ms. This may indicate performance issues.'
              tags:
                - tag: component
                  value: nftables

        - uuid: 9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
          name: 'NFTBan: nftables apply errors'
          type: TRAP
          key: nftban.nftables.apply.errors.total
          value_type: UNSIGNED
          description: 'Total nftables apply errors'
          tags:
            - tag: component
              value: nftables
          triggers:
            - uuid: 0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e
              expression: 'last(/NFTBan/nftban.nftables.apply.errors.total)>0'
              name: 'NFTBan nftables apply errors detected ({ITEM.VALUE})'
              priority: HIGH
              description: 'Errors occurred when applying nftables rules. Firewall protection may be incomplete.'
              tags:
                - tag: component
                  value: nftables

        - uuid: 1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f
          name: 'NFTBan: nftables commands'
          type: TRAP
          key: nftban.nftables.commands.total
          value_type: UNSIGNED
          description: 'Total nftables commands executed'
          tags:
            - tag: component
              value: nftables

        # --- Event Bus Metrics ---
        - uuid: 2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a
          name: 'NFTBan: Event bus events total'
          type: TRAP
          key: nftban.eventbus.events.total
          value_type: UNSIGNED
          description: 'Total events processed by the event bus'
          tags:
            - tag: component
              value: eventbus

        - uuid: 3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b
          name: 'NFTBan: Event bus events dropped'
          type: TRAP
          key: nftban.eventbus.events.dropped.total
          value_type: UNSIGNED
          description: 'Total events dropped by the event bus due to queue overflow or errors'
          tags:
            - tag: component
              value: eventbus
          triggers:
            - uuid: 4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
              expression: 'last(/NFTBan/nftban.eventbus.events.dropped.total)>0'
              name: 'NFTBan event bus dropping events ({ITEM.VALUE})'
              priority: WARNING
              description: 'Events are being dropped by the event bus. This may indicate system overload or handler issues.'
              tags:
                - tag: component
                  value: eventbus

        - uuid: 5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d
          name: 'NFTBan: Event bus queue size'
          type: TRAP
          key: nftban.eventbus.queue.size
          value_type: UNSIGNED
          description: 'Current number of events queued in the event bus'
          tags:
            - tag: component
              value: eventbus
          triggers:
            - uuid: 6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e
              expression: 'last(/NFTBan/nftban.eventbus.queue.size)>1000'
              name: 'NFTBan event bus queue backlog ({ITEM.VALUE})'
              priority: WARNING
              description: 'Event bus queue has more than 1000 pending events. This may indicate handlers are not keeping up with event rate.'
              tags:
                - tag: component
                  value: eventbus

        - uuid: 7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
          name: 'NFTBan: Event bus handlers'
          type: TRAP
          key: nftban.eventbus.handlers
          value_type: UNSIGNED
