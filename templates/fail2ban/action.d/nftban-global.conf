# nftban-managed: yes
# nftban-templates-version: 1
# File: action.d/nftban-global.conf
# Purpose: Add/remove <ip> in inet nftban_global temp_ban_v4/temp_ban_v6 with timeout=bantime.
# NOTE: This action assumes the table/sets already exist (created by nftban_init_nftables_conf.sh).

[Definition]

# Validate that sets exist; do NOT create them here.
actionstart = sh -c '
  T="@@NFTBAN_NFT_TABLE@@" ; S4="@@NFTBAN_TEMP_SET_V4@@" ; S6="@@NFTBAN_TEMP_SET_V6@@";
  nft list set inet "$T" "$S4" >/dev/null 2>&1 && nft list set inet "$T" "$S6" >/dev/null 2>&1 || {
    echo "nftban-global: required sets missing: inet ${T} { ${S4}, ${S6} }" >&2; exit 1; }
'

# Nothing to remove on stop; sets persist.
actionstop = :

# Ban: add with timeout=<bantime> seconds
actionban = sh -c '
  IP="<ip>"; T="@@NFTBAN_NFT_TABLE@@" ; S4="@@NFTBAN_TEMP_SET_V4@@" ; S6="@@NFTBAN_TEMP_SET_V6@@";
  BT="%(bantime)s";
  case "$IP" in
    *:*) nft add element inet "$T" "$S6" { "$IP" timeout ${BT}s } ;;
    *.*) nft add element inet "$T" "$S4" { "$IP" timeout ${BT}s } ;;
    *) exit 0 ;;
  esac
'

# Unban: best-effort delete from both
actionunban = sh -c '
  IP="<ip>"; T="@@NFTBAN_NFT_TABLE@@" ; S4="@@NFTBAN_TEMP_SET_V4@@" ; S6="@@NFTBAN_TEMP_SET_V6@@";
  case "$IP" in
    *:*) nft delete element inet "$T" "$S6" { "$IP" } >/dev/null 2>&1 || true ;;
    *.*) nft delete element inet "$T" "$S4" { "$IP" } >/dev/null 2>&1 || true ;;
    *) exit 0 ;;
  esac
'

[Init]
# These default to your global table/sets; kept as placeholders so your installer can override if you ever rename.
name = nftban-global
