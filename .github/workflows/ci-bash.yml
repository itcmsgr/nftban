# =============================================================================
# NFTBan - CI: Bash Validation
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Shell script syntax checking and static analysis
#
# Checks:
#   - bash -n syntax validation on all .sh files
#   - ShellCheck at warning severity (-S warning) with source following (-x)
#   - Covers: core/, cli/, lib/, setup/, install/, build.sh, install.sh
# =============================================================================

name: Bash Validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-bash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-check:
    name: Shell Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check all bash scripts
        run: |
          echo "=== Checking bash syntax ==="
          find cli install packaging -name "*.sh" -type f | while read -r script; do
            bash -n "$script" || { echo "FAIL: $script"; exit 1; }
          done
          bash -n build.sh install.sh
          echo "✓ All bash syntax valid"

      - name: ShellCheck core scripts
        run: |
          echo "=== ShellCheck: Core ==="
          shellcheck -x -S warning cli/lib/nftban/core/*.sh

      - name: ShellCheck CLI scripts
        run: |
          echo "=== ShellCheck: CLI ==="
          shellcheck -x -S warning cli/lib/nftban/cli/*.sh

      - name: ShellCheck lib scripts
        run: |
          echo "=== ShellCheck: Lib ==="
          shellcheck -x -S warning cli/lib/nftban/lib/*.sh

      - name: ShellCheck setup scripts
        run: |
          echo "=== ShellCheck: Setup ==="
          shellcheck -x -S warning cli/lib/nftban/setup/*.sh

      - name: ShellCheck install scripts
        run: |
          echo "=== ShellCheck: Install ==="
          shellcheck -x -S warning install/*.sh
          shellcheck -x -S warning install.sh build.sh

      # ----------------------------------------------------------------------
      # v1.229.0 R0 — EXECUTE the CSF observation-purity gate.
      #
      # This workflow previously only linted; it never EXECUTED a *_test.sh.
      # A test file that is merely present is inert (TEST-DISCOVERY GAP:
      # 182/225 shell tests not CI-wired), and the R0 spec makes
      # TEST_PRESENT_IN_REQUIRED_CI release-blocking — "test file added" is
      # explicitly insufficient.
      #
      # Scope note: this step is deliberately an explicit single-file
      # invocation, NOT a glob over tests/. Auto-discovering every shell test
      # here would turn a lint gate into an unreviewed test runner and drag in
      # the known-red baseline. Broad discovery belongs to the test-authority
      # lane, not to this hotfix.
      - name: CSF observation purity (v1.229.0 R0 gate)
        run: |
          echo "=== Executing: csf_observation_purity_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/csf_observation_purity_v1229_test.sh
          bash cli/lib/nftban/tests/csf_observation_purity_v1229_test.sh

      # v1.229.x R2 (O1) — the legacy restore path must stay neutralized.
      # Explicit single-file invocation, consistent with the R0 gate above:
      # this workflow is a lint gate that executes named tests, not a
      # discovery-based runner.
      - name: Legacy restore neutralized (v1.229.x R2 gate)
        run: |
          echo "=== Executing: legacy_restore_neutralized_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/legacy_restore_neutralized_v1229_test.sh
          bash cli/lib/nftban/tests/legacy_restore_neutralized_v1229_test.sh

      # UNINSTALL-PR1 — uninstall.sh critical safety (D2/D4/D5).
      # Explicit single-file invocation, same rationale as the gates above.
      # D2's arm is BEHAVIOURAL: it executes uninstall_package_manager() with
      # dpkg/rpm mocked, because a text scan cannot distinguish a purge in the
      # PURGE_DATA branch from one in the else branch 8 lines below it.
      - name: Uninstall critical safety (UNINSTALL-PR1 gate)
        run: |
          echo "=== Executing: uninstall_sh_critical_safety_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/uninstall_sh_critical_safety_v1229_test.sh
          bash cli/lib/nftban/tests/uninstall_sh_critical_safety_v1229_test.sh

      # UNINSTALL-PR2 — RPM preserve-by-default (D1) + operator-config
      # ownership (D3). Generates the real RPM spec from packaging/build_nftban.sh
      # and runs the real DEB conffiles generator, so the assertions land on the
      # produced artifacts rather than on the generator's source text.
      - name: Operator config not package-owned (UNINSTALL-PR2 gate)
        run: |
          echo "=== Executing: operator_config_not_package_owned_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/operator_config_not_package_owned_v1229_test.sh
          bash cli/lib/nftban/tests/operator_config_not_package_owned_v1229_test.sh

      # UNINSTALL-PR2 D5 — removal messaging truth contract (DEB↔RPM parity on
      # MEANING, not on a literal string). Gate is policy-gates for this test;
      # executed here too so a wording regression fails fast on every PR.
      # UNINSTALL-PR3 — lifecycle-matrix observation semantics (A1-A6).
      # Hermetic: it drives the shipped probes/classifiers directly, no root,
      # no packages. Guards the rule that a missing systemd/nft observation
      # authority can never be reported as a passing removal assertion.
      - name: Lifecycle matrix observation semantics (UNINSTALL-PR3)
        run: |
          echo "=== Executing: lifecycle_matrix_observation_semantics_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/lifecycle_matrix_observation_semantics_v1229_test.sh
          bash cli/lib/nftban/tests/lifecycle_matrix_observation_semantics_v1229_test.sh

      # PORTSCAN-CURSOR (v1.229.x) — replay elimination. Hermetic: drives the
      # shipped cursor helpers and the wired journald pipeline with a stubbed
      # journalctl; no root, no live logs. Two arms exist specifically because
      # the implementation's own bugs were in the WIRING, not the helpers.
      - name: PortScan cursor replay elimination (v1.229.x)
        run: |
          echo "=== Executing: portscan_cursor_replay_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/portscan_cursor_replay_v1229_test.sh
          bash cli/lib/nftban/tests/portscan_cursor_replay_v1229_test.sh

      # A6 — the maintenance step that prevents ADMIN LOCKOUT was proven inert
      # FLEET-WIDE by runtime witness (srv2 :55000, srv3 :22, both v1.228.11):
      # the peer address was read as $5 while `ss -tn state established` omits
      # the State column, and the port filter was hardcoded to :22. Defect 1
      # masked defect 2, so fixing either alone still whitelists nothing — each
      # arm therefore carries a control asserting the PRE-FIX pipeline returns
      # EMPTY on the same fixture. Hermetic: stubbed ss, no root/network.
      - name: Active-SSH auto-whitelist peer extraction (A6)
        run: |
          echo "=== Executing: maint_active_ssh_peers_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/maint_active_ssh_peers_v1229_test.sh
          bash cli/lib/nftban/tests/maint_active_ssh_peers_v1229_test.sh

      - name: Uninstall firewall-ownership message (UNINSTALL-PR2 D5)
        run: |
          echo "=== Executing: uninstall_firewall_ownership_message_v225_test.sh ==="
          chmod +x cli/lib/nftban/tests/uninstall_firewall_ownership_message_v225_test.sh
          bash cli/lib/nftban/tests/uninstall_firewall_ownership_message_v225_test.sh

      # ------------------------------------------------------------------
      # v1.229.15 - EXECUTE the reporting-subsystem tests.
      #
      # A 2026-09-06 audit of the reporting subsystem (frozen at 80e4766a)
      # found three generators emitting structurally wrong output on every
      # run, and established that NO test would have caught any of them: the
      # affected functions are never invoked by any test, and not one of the
      # tests guarding this surface was executed by CI.
      #
      # Every test below was measured on 2026-09-08 at v1.229.14: all pass,
      # and all declare meta:ta.hermetic="true" with
      # ta.execution_class="CI_HERMETIC_SHELL". They are wired as named
      # invocations, consistent with the R0 gate above and NOT as a glob over
      # tests/ - this workflow executes declared tests, it is not a
      # discovery-based runner.
      #
      # WIRING MUST COME BEFORE THE FIXES. A regression test added for a
      # defect in a subsystem whose tests do not run is inert, and "test file
      # added" is explicitly insufficient under the R0 spec.
      #
      # CENSUS RECONCILIATION - 10 vs 9. The reporting audit's census counted TEN
      # tests; NINE are wired here. The difference is named, not rounded off:
      #
      #   original census                10
      #   enforceable reporting population 9
      #   difference                       fhs_lane_v175_test.sh
      #   classification                   MISCLASSIFIED BY THE CENSUS
      #
      # It was swept in by a filename match on "fhs". Its subject is the FHS
      # INSTALL LAYOUT, not the FHS REPORT: it locks tmpfiles.d ownership and the
      # systemd-tmpfiles "unsafe path transition" / exit-73 class, and it contains
      # zero references to any report generator. It is already registered in
      # scripts/ci/test-authority-index.tsv, so it has an owner -- wiring it here
      # would claim another lane's subject under a reporting gate.
      #
      # Not removed, not renamed, not non-hermetic, not duplicate. The census was
      # wrong; the population is 9.
      # ------------------------------------------------------------------
      - name: Reporting - writer truth and output validation (v1.228.5)
        run: |
          echo "=== Executing: report_writer_truth_v1228_5_test.sh ==="
          chmod +x cli/lib/nftban/tests/report_writer_truth_v1228_5_test.sh
          bash cli/lib/nftban/tests/report_writer_truth_v1228_5_test.sh

      - name: Reporting - JSON-in-script breakout safety (v1.227)
        run: |
          echo "=== Executing: report_html_json_script_safe_v1227_test.sh ==="
          chmod +x cli/lib/nftban/tests/report_html_json_script_safe_v1227_test.sh
          bash cli/lib/nftban/tests/report_html_json_script_safe_v1227_test.sh

      - name: Reporting - retention cleanup call-graph reachability (v1.229.3)
        run: |
          echo "=== Executing: cleanup_reachability_v1229_3_test.sh ==="
          chmod +x cli/lib/nftban/tests/cleanup_reachability_v1229_3_test.sh
          bash cli/lib/nftban/tests/cleanup_reachability_v1229_3_test.sh

      - name: Reporting - mail delivery wording honesty (v1.227)
        run: |
          echo "=== Executing: mail_honest_wording_v1227_test.sh ==="
          chmod +x cli/lib/nftban/tests/mail_honest_wording_v1227_test.sh
          bash cli/lib/nftban/tests/mail_honest_wording_v1227_test.sh

      - name: Reporting - mail subject authority (v1.227)
        run: |
          echo "=== Executing: mail_subject_authority_v1227_test.sh ==="
          chmod +x cli/lib/nftban/tests/mail_subject_authority_v1227_test.sh
          bash cli/lib/nftban/tests/mail_subject_authority_v1227_test.sh

      - name: Reporting - FHS report long-tail code bugs (V131 PR-A)
        run: |
          echo "=== Executing: v131_pr_a_long_tail_code_bug_fix_test.sh ==="
          chmod +x cli/lib/nftban/tests/v131_pr_a_long_tail_code_bug_fix_test.sh
          bash cli/lib/nftban/tests/v131_pr_a_long_tail_code_bug_fix_test.sh

      - name: Reporting - module report write-guard refusal (V133 PR-B)
        run: |
          echo "=== Executing: v133_pr_b_write_guard_refusal_test.sh ==="
          chmod +x cli/lib/nftban/tests/v133_pr_b_write_guard_refusal_test.sh
          bash cli/lib/nftban/tests/v133_pr_b_write_guard_refusal_test.sh

      - name: Reporting - module meta-tag parser hardening (v150)
        run: |
          echo "=== Executing: cli_hardening_v150_test.sh ==="
          chmod +x cli/lib/nftban/tests/cli_hardening_v150_test.sh
          bash cli/lib/nftban/tests/cli_hardening_v150_test.sh

      - name: Reporting - port report ssh_ports exposure invariant (V145 PR-G)
        run: |
          echo "=== Executing: v145_pr_g_ssh_ports_invariants_test.sh ==="
          chmod +x cli/lib/nftban/tests/v145_pr_g_ssh_ports_invariants_test.sh
          bash cli/lib/nftban/tests/v145_pr_g_ssh_ports_invariants_test.sh
