# NFTBan Fail2ban Jail - Exim Spam Detection
#
# Monitors Exim logs for spam patterns and suspicious behavior.
# Separate from authentication failures to detect spam bots.
#
# Configuration:
# - maxretry: 15 attempts
# - findtime: 10 minutes
# - bantime: 1 day (default from config)
#
# Based on DirectAdmin production configuration

[nftban-exim-spam]

# Disabled by default - enable if Exim is installed
enabled   = false

# Monitor mail service ports
port      = smtp,ssmtp,pop3,pop3s,imap,imaps,submission

# Use Exim spam filter
filter    = exim-spam

# Exim main log location
logpath   = /var/log/exim/mainlog
            /var/log/exim4/mainlog

# Spam detection threshold
maxretry  = 15
findtime  = 10m

# Default bantime from config
bantime   = 1d

# Use NFTBan action
action    = nftban[name=exim-spam]
