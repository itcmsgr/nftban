# =============================================================================
# NFTBan Security Profile: Web Server
# =============================================================================
# Optimized for: nginx, Apache, high HTTP/HTTPS traffic
# Best for: Web applications, API servers, content delivery
# =============================================================================

PROFILE_NAME="web-server"
PROFILE_DESCRIPTION="Web Server - High HTTP/HTTPS traffic"

# =============================================================================
# DDOS PROTECTION
# =============================================================================

DDOS_PROTECTION_ENABLED="true"

# SYN Flood: Disabled (only enable during attack)
DDOS_SYNFLOOD_ENABLED="false"
DDOS_SYNFLOOD_RATE="100/second"
DDOS_SYNFLOOD_BURST="150"

# Connection Limits: High for web traffic
DDOS_CONNLIMIT_ENABLED="true"
DDOS_CONNLIMIT_SSH="5"          # Management only
DDOS_CONNLIMIT_HTTP="50"        # High for web
DDOS_CONNLIMIT_HTTPS="50"       # High for web
DDOS_CONNLIMIT_FTP="0"          # Disabled (no FTP)
DDOS_CONNLIMIT_SMTP="0"         # Disabled (no mail)
DDOS_CONNLIMIT_POP3="0"         # Disabled
DDOS_CONNLIMIT_IMAP="0"         # Disabled
DDOS_CONNLIMIT_MYSQL="0"        # Disabled (remote DB)
DDOS_CONNLIMIT_POSTGRESQL="0"   # Disabled

# Port Flood: Protect web ports
DDOS_PORTFLOOD_ENABLED="true"
DDOS_PORTFLOOD_RATE="1000/second"
DDOS_PORTFLOOD_BURST="2000"
DDOS_PORTFLOOD_SSH="5/300"
DDOS_PORTFLOOD_HTTP="50/5"
DDOS_PORTFLOOD_HTTPS="50/5"

# ICMP Flood: Always enabled
DDOS_ICMPFLOOD_ENABLED="true"
DDOS_ICMPFLOOD_RATE="50/second"
DDOS_ICMPFLOOD_BURST="100"

# =============================================================================
# PORT SCAN DETECTION
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="300"      # 5 minutes
PORTSCAN_THRESHOLD="10"         # 10 different ports
PORTSCAN_DIVERSITY="true"
PORTSCAN_AUTO_BAN="true"
PORTSCAN_BAN_TYPE="temporary"
PORTSCAN_BAN_TIME="3600"        # 1 hour
PORTSCAN_MONITOR_PORTS="closed" # Only monitor closed ports
PORTSCAN_MONITOR_ICMP="true"

# =============================================================================
# OPTIONAL INTEGRATIONS
# =============================================================================

# Cloudflare Integration (uncomment to enable)
# CLOUDFLARE_ENABLED="true"
