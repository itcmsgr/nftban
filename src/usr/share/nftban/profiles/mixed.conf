# =============================================================================
# NFTBan Security Profile: Mixed Server (Web + Mail + DB)
# =============================================================================
# Optimized for: Multiple services on same server
# Best for: Shared hosting, multi-purpose servers
# =============================================================================

PROFILE_NAME="mixed"
PROFILE_DESCRIPTION="Mixed Server - Multiple services"

# =============================================================================
# DDOS PROTECTION
# =============================================================================

DDOS_PROTECTION_ENABLED="true"

# SYN Flood: Disabled by default
DDOS_SYNFLOOD_ENABLED="false"

# Connection Limits: All services enabled
DDOS_CONNLIMIT_ENABLED="true"
DDOS_CONNLIMIT_SSH="5"
DDOS_CONNLIMIT_HTTP="30"        # Moderate for web
DDOS_CONNLIMIT_HTTPS="30"
DDOS_CONNLIMIT_FTP="3"
DDOS_CONNLIMIT_SMTP="5"
DDOS_CONNLIMIT_POP3="5"
DDOS_CONNLIMIT_IMAP="5"
DDOS_CONNLIMIT_MYSQL="3"
DDOS_CONNLIMIT_POSTGRESQL="3"

# Port Flood: All common ports
DDOS_PORTFLOOD_ENABLED="true"
DDOS_PORTFLOOD_RATE="500/second"
DDOS_PORTFLOOD_BURST="1000"
DDOS_PORTFLOOD_SSH="5/300"
DDOS_PORTFLOOD_HTTP="30/5"
DDOS_PORTFLOOD_HTTPS="30/5"

# ICMP Flood
DDOS_ICMPFLOOD_ENABLED="true"
DDOS_ICMPFLOOD_RATE="50/second"
DDOS_ICMPFLOOD_BURST="100"

# =============================================================================
# PORT SCAN DETECTION: Balanced
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="300"
PORTSCAN_THRESHOLD="10"
PORTSCAN_DIVERSITY="true"
PORTSCAN_AUTO_BAN="true"
PORTSCAN_BAN_TYPE="temporary"
PORTSCAN_BAN_TIME="3600"
PORTSCAN_MONITOR_PORTS="closed"
PORTSCAN_MONITOR_ICMP="true"
