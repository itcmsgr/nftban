# -----------------------------------------------------------------------------
# DATABASE SOURCE
# -----------------------------------------------------------------------------

# GeoIP database provider
# dbip     = DB-IP.com (free, no registration required)
# maxmind  = MaxMind GeoLite2 (requires free license key)
GEOIP_PROVIDER="dbip"

# MaxMind license key (only needed if GEOIP_PROVIDER=maxmind)
# Get free key: https://www.maxmind.com/en/geolite2/signup
# GEOIP_MAXMIND_KEY=""

# -----------------------------------------------------------------------------
# DATABASE PATHS
# -----------------------------------------------------------------------------

# Directory where GeoIP database is stored
# Default: ${NFTBAN_DATA_DIR}/geoip
# GEOIP_DB_DIR="${NFTBAN_DATA_DIR}/geoip"

# Database filename
GEOIP_DB_FILE="dbip-country-lite.mmdb"

# -----------------------------------------------------------------------------
# AUTO-UPDATE
# -----------------------------------------------------------------------------

# Enable automatic database updates
GEOIP_AUTO_UPDATE="true"

# Update interval (uses systemd timer: nftban-core-geoip.timer)
# weekly   = Every Sunday at 3 AM
# monthly  = First Sunday of each month
GEOIP_UPDATE_INTERVAL="weekly"

# Verify database after download
GEOIP_VERIFY_DOWNLOAD="true"

# -----------------------------------------------------------------------------
# LOOKUP SETTINGS
# -----------------------------------------------------------------------------

# Enable caching for repeated lookups
GEOIP_CACHE_LOOKUPS="true"

# Cache TTL in seconds (default: 1 hour)
GEOIP_CACHE_TTL="3600"

# Return "XX" for private/reserved IPs
GEOIP_PRIVATE_COUNTRY="XX"

# Return "--" for unknown IPs
GEOIP_UNKNOWN_COUNTRY="--"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Log database updates
GEOIP_LOG_UPDATES="true"

# Log lookup failures (can be verbose)
GEOIP_LOG_FAILURES="false"
