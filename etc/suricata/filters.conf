[global]
enabled = true
default_threshold = 100
default_ban_time = 30m
default_action = ban
score_decay = 1h

# ============================================================================
# FILTERS - Default Configuration
# ============================================================================

[filters]
# ──────────────────────────────────────────────────────────────────────────
# Network Services (Enabled by default with escalation)
# ──────────────────────────────────────────────────────────────────────────
ssh       = true  | ssh,brute,bruteforce                           | 80  | 30m | ban | escalate:3:24h  | SSH brute-force (temp 30m, perm after 3x)
http      = true  | http,web,wordpress,sqli,xss,rfi,lfi           | 100 | 1h  | ban | escalate:3:24h  | Web exploits (temp 1h, perm after 3x)
mail      = true  | smtp,imap,pop3,sasl,postfix,dovecot           | 90  | 45m | ban | escalate:3:24h  | Mail abuse (temp 45m, perm after 3x)
dns       = true  | dns,query,amplification,nxdomain              | 120 | 2h  | observe | temporary   | DNS anomalies (observe mode)
ftp       = false | ftp,vsftpd,proftpd,file transfer              | 85  | 1h  | log | temporary       | FTP attacks (disabled, log mode)
rdp       = false | rdp,3389,remote desktop,terminal              | 85  | 1h  | log | temporary       | RDP attacks (disabled, log mode)
mysql     = false | mysql,mariadb,3306,database                   | 90  | 2h  | log | temporary       | MySQL attacks (disabled)
postgresql= false | postgresql,postgres,pgsql,5432                | 90  | 2h  | log | temporary       | PostgreSQL attacks (disabled)

# ──────────────────────────────────────────────────────────────────────────
# Attack Types (Enabled by default - aggressive escalation)
# ──────────────────────────────────────────────────────────────────────────
scan      = true  | scan,probe,reconnaissance,portscan,nmap,masscan,zmap           | 70  | 15m | ban | escalate:2:1h   | Port scans (temp 15m, perm after 2x in 1h)
exploit   = true  | exploit,cve,vulnerability,shellcode,rce                        | 60  | 24h | ban | permanent       | Exploits (PERMANENT immediately)
ddos      = true  | flood,amplification,reflection,syn flood                       | 50  | 6h  | ban | escalate:2:24h  | DDoS (temp 6h, perm after 2x)
malware   = true  | malware,trojan,backdoor,botnet,c2,c&c,cnc,kernel,kthread,rootkit,dropper,loader,miner,cryptominer,mirai,gafgyt,xorddos,billgates,tsunami | 40  | 48h | ban | permanent       | Comprehensive malware detection (PERMANENT immediately)
botnet    = true  | botcc,bot,linux botnet,linux malware,netupdater,systemd-network | 50  | 48h | ban | permanent       | Linux botnet behavior (PERMANENT immediately)

# ──────────────────────────────────────────────────────────────────────────
# Application-Specific (Mixed: some enabled with escalation)
# ──────────────────────────────────────────────────────────────────────────
# CMS Protection (split by confidence level - SAFE defaults, temp bans first)
wp_xmlrpc = true  | xmlrpc,multicall,pingback                      | 90  | 2h  | ban | escalate:5:24h  | WordPress XML-RPC (temp 2h, perm after 5x)
wp_login  = true  | wp-login,wp-admin                              | 120 | 1h  | ban | escalate:5:24h  | WordPress login (temp 1h, perm after 5x)
joomla    = true  | joomla,com_,administrator                      | 120 | 1h  | ban | escalate:5:24h  | Joomla admin (temp 1h, perm after 5x)
drupal    = true  | drupal,user/login,node                         | 120 | 1h  | ban | escalate:5:24h  | Drupal login (temp 1h, perm after 5x)
phpmyadmin= false | phpmyadmin,pma,mysql admin                     | 95  | 3h  | log | temporary       | phpMyAdmin (disabled by default)

# ──────────────────────────────────────────────────────────────────────────
# Additional Services (Disabled by default - enable if you use these)
# ──────────────────────────────────────────────────────────────────────────
smb       = false | smb,cifs,445,samba,netbios                    | 80  | 6h  | log | escalate:2:24h  | SMB/CIFS (disabled)
ldap      = false | ldap,389,636,active directory                 | 85  | 4h  | log | escalate:3:48h  | LDAP (disabled)
voip      = false | sip,voip,5060,asterisk                        | 80  | 2h  | log | temporary       | VoIP/SIP (disabled)
