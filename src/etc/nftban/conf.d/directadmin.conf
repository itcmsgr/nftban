# =============================================================================
# NFTBan DirectAdmin Control Panel Configuration
# =============================================================================
# Version: 0.31.0
# Module: DirectAdmin Panel Support
# Purpose: Define DirectAdmin required ports for firewall configuration
#
# This file is OVERWRITTEN on package upgrades!
# Use /etc/nftban/nftban.conf.local for your customizations
# =============================================================================

# =============================================================================
# DIRECTADMIN INSTALLATION
# =============================================================================

# DirectAdmin installation path
# ⚠️  THIS FILE IS OVERWRITTEN DURING UPDATES
# ⚠️  USE /etc/nftban/nftban.conf.local FOR CUSTOM VALUES
#
# DO NOT EDIT THIS FILE FOR PERMANENT CHANGES!
# Your changes will be lost during package updates.
#
# TO CUSTOMIZE:
#   1. Copy setting to /etc/nftban/nftban.conf.local
#   2. Uncomment and modify in .local file
#   3. .local file is NEVER overwritten by updates
#

NFTBAN_DIRECTADMIN_PATH="/usr/local/directadmin"

# Auto-detect DirectAdmin installation
# Values: "YES", "NO"
NFTBAN_DIRECTADMIN_AUTO_DETECT="YES"

# =============================================================================
# TCP PORTS (IPv4 and IPv6)
# =============================================================================
# Source: DirectAdmin official CSF policy
# Reference: DirectAdmin Support - Default port policy
#
# IMPORTANT: DirectAdmin licensing requires CloudFlare IP whitelist!
# See CLOUDFLARE section below.

# TCP INPUT ports (incoming connections)
# 20/21      - FTP (data/control)
# 22         - SSH
# 25         - SMTP (mail)
# 53         - DNS over TCP
# 80         - HTTP
# 110        - POP3
# 143        - IMAP
# 443        - HTTPS
# 465        - SMTPS (SMTP over SSL)
# 587        - Submission (SMTP with STARTTLS)
# 853        - DNS over TLS (DoT)
# 993        - IMAPS (IMAP over SSL)
# 995        - POP3S (POP3 over SSL)
# 2222       - DirectAdmin Web Panel
# 35000:35999 - Passive FTP port range
NFTBAN_DIRECTADMIN_TCP_IN="20,21,22,25,53,853,80,110,143,443,465,587,993,995,2222,35000:35999"

# TCP OUTPUT ports (outgoing connections)
# Same as INPUT (except FTP passive range) plus:
# 113     - IDENT protocol
NFTBAN_DIRECTADMIN_TCP_OUT="20,21,22,25,53,853,80,110,113,143,443,465,587,993,995,2222"

# =============================================================================
# UDP PORTS (IPv4 and IPv6)
# =============================================================================

# UDP INPUT ports
# 20/21  - FTP
# 53     - DNS
# 80     - HTTP/3 (QUIC)
# 443    - HTTPS/3 (QUIC)
# 853    - DNS over TLS (DoT)
NFTBAN_DIRECTADMIN_UDP_IN="20,21,53,853,80,443"

# UDP OUTPUT ports
# Same as INPUT plus:
# 113    - IDENT protocol
# 123    - NTP (Network Time Protocol)
NFTBAN_DIRECTADMIN_UDP_OUT="20,21,53,853,113,123,443"

# =============================================================================
# ADDITIONAL PORTS
# =============================================================================

# Additional custom TCP INPUT ports (comma-separated)
# Add your custom ports here if needed
NFTBAN_DIRECTADMIN_CUSTOM_TCP_IN=""

# Additional custom TCP OUTPUT ports (comma-separated)
NFTBAN_DIRECTADMIN_CUSTOM_TCP_OUT=""

# Additional custom UDP INPUT ports (comma-separated)
NFTBAN_DIRECTADMIN_CUSTOM_UDP_IN=""

# Additional custom UDP OUTPUT ports (comma-separated)
NFTBAN_DIRECTADMIN_CUSTOM_UDP_OUT=""

# =============================================================================
# CLOUDFLARE INTEGRATION (REQUIRED FOR DIRECTADMIN LICENSING)
# =============================================================================
# DirectAdmin licensing servers are behind CloudFlare CDN.
# You MUST whitelist CloudFlare IP ranges for licensing to work!
#
# CloudFlare IP ranges are automatically updated by NFTBan's cloudflare module.
# Run: nftban cloudflare update
#
# Manual whitelist locations:
#   IPv4: https://www.cloudflare.com/ips-v4/
#   IPv6: https://www.cloudflare.com/ips-v6/

# Automatically enable CloudFlare whitelist when configuring DirectAdmin
# Values: "YES", "NO", "ASK"
# YES  = Auto-enable CloudFlare whitelist (recommended)
# NO   = Do not auto-enable (manual configuration required)
# ASK  = Prompt user during configuration
NFTBAN_DIRECTADMIN_AUTO_CLOUDFLARE="ASK"

# Automatically update CloudFlare IP ranges
# Values: "YES", "NO"
# YES = Download latest CloudFlare IPs during configuration
# NO  = Use existing CloudFlare IPs (must be manually updated)
NFTBAN_DIRECTADMIN_UPDATE_CLOUDFLARE="YES"

# =============================================================================
# FIREWALL BEHAVIOR
# =============================================================================

# Add rules to beginning of chain (higher priority)
# Values: "YES", "NO"
# YES = Rules added to top (processed first)
# NO = Rules added to bottom (processed last)
NFTBAN_DIRECTADMIN_PRIORITY_HIGH="NO"

# Verbose output during port configuration
# Values: "YES", "NO"
NFTBAN_DIRECTADMIN_VERBOSE="YES"

# =============================================================================
# USER CUSTOMIZATIONS
# =============================================================================
# DO NOT edit this file for customizations!
# Use /etc/nftban/nftban.conf.local instead:
#
# Example:
#   NFTBAN_DIRECTADMIN_TCP_IN="20,21,22,25,53,80,110,143,443,465,587,853,993,995,2222,8080"
#   NFTBAN_DIRECTADMIN_CUSTOM_TCP_IN="8080,8443"
#
# =============================================================================

