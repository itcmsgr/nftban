# NFTBan Fail2ban Jail - DirectAdmin Control Panel
#
# Monitors DirectAdmin control panel login attempts.
# Protects against brute force attacks on the admin interface.
#
# Configuration:
# - maxretry: 5 failed logins
# - findtime: 10 minutes
# - bantime: 1 hour
#
# Based on DirectAdmin production configuration

[nftban-directadmin]

# Disabled by default - enable if DirectAdmin is installed
enabled   = false

# DirectAdmin default port
port      = 2222

# Use DirectAdmin filter (standard fail2ban filter)
filter    = directadmin

# DirectAdmin login log location
logpath   = /var/log/directadmin/login.log
            /var/log/directadmin/error.log

# Standard retry threshold for control panels
maxretry  = 5
findtime  = 10m

# Shorter ban for control panel (1 hour)
bantime   = 1h

# Use NFTBan action
action    = nftban[name=directadmin]
