# =============================================================================
# NFTBan — CI: Uninstall Canonization Gate (v1.100 PR-22 slice)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enforce v1.100 PR-22 scope lock:
#   G3-UN-PLAN-RENDERS   — dry-run output contains mandatory contract
#                          language (headers + fields + scope-boundary block)
#   G3-UN-NO-MUTATION    — structural grep on the uninstall package +
#                          dispatcher rejecting any mutation-flavored call
#
# Future sub-gates (G3-UN-5..17 + G3-UN-VERIFY) land in PR-23..PR-26.
# PR-22 ships only these two gates because that is the entire claim
# surface of the PR.
#
# Authorization basis: V1100_LIFECYCLE_COMPLETION_CONTRACT.md §13 frozen
# 2026-04-19.
# =============================================================================

name: Uninstall Canonization Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cmd/nftban-installer/**'
      - 'internal/installer/uninstall/**'
      - 'internal/installer/state/**'
      - '.github/workflows/ci-uninstall-canonization.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-uninstall-canonization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uninstall-canonization:
    name: Uninstall Canonization (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            runner: ubuntu-24.04
            container: ''
          - label: almalinux-9
            runner: ubuntu-24.04
            container: almalinux:9
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install system dependencies (DEB)
        if: matrix.label == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq

      - name: Install system dependencies (RPM)
        if: matrix.label == 'almalinux-9'
        run: |
          dnf -y install epel-release
          dnf -y install nftables jq git tar gzip procps-ng findutils sudo golang

      - name: Set up Go (DEB only)
        if: matrix.label == 'ubuntu-24.04'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      # ------------------------------------------------------------------
      # G3-UN-NO-MUTATION — structural grep on the uninstall package +
      # dispatcher rejecting mutation-flavored Go calls. This is the PR-22
      # scope-lock enforcement: if any commit introduces kernel mutation,
      # service lifecycle, filesystem writes under protected paths, or
      # external-firewall touches into the uninstall code, CI fails BEFORE
      # the unit tests even run.
      # ------------------------------------------------------------------
      - name: G3-UN-NO-MUTATION — structural audit of uninstall package
        shell: bash
        run: |
          set -Eeuo pipefail
          # Narrow search scope to PR-22's claim surface.
          files=$(find \
            internal/installer/uninstall \
            cmd/nftban-installer/uninstall_dryrun.go \
            -type f -name '*.go' 2>/dev/null || true)
          if [[ -z "$files" ]]; then
            echo "::error::G3-UN-NO-MUTATION: uninstall scope files not found"
            exit 1
          fi
          fail=0
          # PR-22A audit fix: the original grep missed os.WriteFile /
          # os.Create / os.MkdirAll / os.Rename, which is exactly how
          # the uninstall_plan.json write slipped past PR-22 review.
          # Direct os.* filesystem writers are now enumerated here.
          for pat in \
              'exec\.Run\("nft"[^)]*add' \
              'exec\.Run\("nft"[^)]*flush' \
              'exec\.Run\("nft"[^)]*delete' \
              'exec\.Run\("nft"[^)]*create' \
              'exec\.Run\("systemctl"[^)]*stop' \
              'exec\.Run\("systemctl"[^)]*start' \
              'exec\.Run\("systemctl"[^)]*restart' \
              'exec\.Run\("systemctl"[^)]*reload' \
              'exec\.Run\("systemctl"[^)]*enable' \
              'exec\.Run\("systemctl"[^)]*disable' \
              'exec\.Run\("systemctl"[^)]*mask' \
              'exec\.Run\("systemctl"[^)]*unmask' \
              'exec\.Run\("ufw"' \
              'exec\.Run\("iptables"[^-]' \
              'exec\.Run\("csf"' \
              'exec\.Run\("apt-get"[^)]*remove' \
              'exec\.Run\("apt-get"[^)]*purge' \
              'exec\.Run\("dnf"[^)]*remove' \
              'exec\.Run\("dnf"[^)]*erase' \
              'exec\.WriteFileAtomic\(' \
              'os\.WriteFile\(' \
              'os\.Create\(' \
              'os\.MkdirAll\(' \
              'os\.Mkdir\(' \
              'os\.Rename\(' \
              'os\.Remove\(' \
              'os\.RemoveAll\(' \
              'sf\.Transition\('; do
            # Note: ".conf.local" is NOT in this list — the contract
            # language in plan.go + contract.md LEGITIMATELY mentions
            # .conf.local when describing the §4.4 artifact policy.
            # The mutation danger is write/delete operations, which
            # the os.*/exec.WriteFileAtomic patterns above cover
            # regardless of which file they target.
            #
            # sf.Transition is forbidden in PR-22 scope because it
            # persists install_state under /var/lib/nftban/state. PR-22
            # is observational only — no state transitions during
            # dry-run.
            if grep -nE "$pat" $files 2>/dev/null; then
              echo "::error::G3-UN-NO-MUTATION FAIL: forbidden pattern '$pat' in PR-22 uninstall scope"
              fail=1
            fi
          done
          if (( fail > 0 )); then
            echo "::error::PR-22 contract violation — uninstall code contains mutation-flavored calls"
            exit 1
          fi
          echo "G3-UN-NO-MUTATION PASS — no mutation-flavored call detected in PR-22 scope"

      # ------------------------------------------------------------------
      # Unit tests — exercise BuildPlan rendering + classifier + probe.
      # The structural no-mutation grep above already ran, so if Go code
      # somehow bypassed the grep (unlikely), unit tests are the second
      # line of defence.
      # ------------------------------------------------------------------
      - name: Unit tests — internal/installer/uninstall
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -v ./internal/installer/uninstall/...

      # PR-22A boundary repair: the orchestrator-level purity test lives
      # in cmd/nftban-installer/uninstall_dryrun_test.go. It falsifies
      # the "no mutation" claim directly by calling runUninstallDryRun
      # with a MockExecutor + real tempdir and asserting zero writes,
      # zero directory creates, and zero mutation-flavored commands.
      - name: Unit tests — runUninstallDryRun purity (R4)
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -v -run 'TestRunUninstallDryRun_' ./cmd/nftban-installer/...

      # ------------------------------------------------------------------
      # Build the installer binary so we can exercise end-to-end.
      # ------------------------------------------------------------------
      - name: Build nftban-installer
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin
          go build -trimpath -o bin/nftban-installer ./cmd/nftban-installer/
          test -x bin/nftban-installer

      - name: Prepare minimal host state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d /var/lib/nftban/state

      # ------------------------------------------------------------------
      # G3-UN-PLAN-RENDERS — end-to-end dry-run produces the mandatory
      # contract-language output. The unit tests already verified the
      # Render function in isolation; this confirms the dispatcher path
      # wires it up correctly.
      # ------------------------------------------------------------------
      - name: G3-UN-PLAN-RENDERS — dry-run emits contract language
        shell: bash
        run: |
          set -Eeuo pipefail
          # PR-22A boundary repair: snapshot /var/lib/nftban/ truth
          # surfaces BEFORE the dry-run. After the dry-run, the snapshot
          # must be byte-identical. Any difference is a PR-22 contract
          # Stop Condition violation.
          before_varlib=$(find /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          before_etcnftban=$(find /etc/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          # PR-P2-3 (G3-KS-SNAPSHOT): capture kernel nft tables +
          # firewall-adjacent service states BEFORE the dry-run so we
          # can hard-assert they remain byte-identical afterward.
          # Filesystem snapshot alone (above) misses a regression that
          # mutates kernel tables or service states without touching
          # tracked files — exactly the class of drift this gate closes.
          before_ks=$(bash scripts/ci-snapshot-kernel-service.sh)
          set +e
          sudo ./bin/nftban-installer --mode=uninstall --dry-run \
              --state-dir=/var/lib/nftban/state 2>&1 | tee /tmp/uninstall-dryrun.out
          rc=${PIPESTATUS[0]}
          set -e
          echo "dry-run exit code: $rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::uninstall dry-run must exit 0 even on a host with no firewall authority"
            exit 1
          fi
          after_varlib=$(find /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          after_etcnftban=$(find /etc/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          after_ks=$(bash scripts/ci-snapshot-kernel-service.sh)
          if [[ "$before_varlib" != "$after_varlib" ]]; then
            echo "::error::PR-22 Stop Condition violated — uninstall dry-run modified /var/lib/nftban/"
            diff <(echo "$before_varlib") <(echo "$after_varlib") || true
            exit 1
          fi
          if [[ "$before_etcnftban" != "$after_etcnftban" ]]; then
            echo "::error::PR-22 Stop Condition violated — uninstall dry-run modified /etc/nftban/"
            diff <(echo "$before_etcnftban") <(echo "$after_etcnftban") || true
            exit 1
          fi
          # PR-P2-3 hard assertion — no `|| true` on the diff check.
          if [[ "$before_ks" != "$after_ks" ]]; then
            echo "::error::G3-KS-SNAPSHOT FAIL: kernel or service state changed during uninstall --dry-run"
            diff <(echo "$before_ks") <(echo "$after_ks") || true
            exit 1
          fi
          echo "G3-UN-NO-WRITES PASS — /var/lib/nftban, /etc/nftban, kernel, and service state all unchanged after dry-run"
          # Mandatory contract-language elements — each one corresponds
          # to a row PR-22 promised to render.
          for needle in \
              "NFTBan Uninstall — Plan" \
              "Requested mode" \
              "Artifact policy" \
              "Current authority" \
              "Target authority" \
              "Restore requested" \
              "Restore authorized" \
              "Prior-authority record" \
              "Phases that would mutate (NOT IMPLEMENTED in PR-22):" \
              "Scope boundary:" \
              "Running this command does NOT uninstall nftban"; do
            if ! grep -q "$needle" /tmp/uninstall-dryrun.out; then
              echo "::error::G3-UN-PLAN-RENDERS FAIL: missing mandatory contract-language element: $needle"
              exit 1
            fi
          done
          echo "G3-UN-PLAN-RENDERS PASS — all mandatory contract-language elements present"

      # ------------------------------------------------------------------
      # G3-UN-PLAN-RENDERS negative path — invoking --mode=uninstall
      # WITHOUT --dry-run must still not mutate. The flags validator
      # forces --dry-run on in PR-22; this confirms that elevation works.
      # ------------------------------------------------------------------
      - name: G3-UN-PLAN-RENDERS — no-mutation even without explicit dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          # PR-22A boundary repair: the earlier gate only snapshot
          # /etc/nftban + /usr/lib/nftban + /usr/sbin/nftban*. It did
          # NOT cover /var/lib/nftban/ — the exact directory that leaked
          # three writes in PR #480. The snapshot now includes all
          # three protected trees. No exceptions.
          before=$(find /etc/nftban /usr/lib/nftban /usr/sbin/nftban* /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          set +e
          sudo ./bin/nftban-installer --mode=uninstall \
              --state-dir=/var/lib/nftban/state 2>&1 | tee /tmp/uninstall-implicit.out
          rc=${PIPESTATUS[0]}
          set -e
          after=$(find /etc/nftban /usr/lib/nftban /usr/sbin/nftban* /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          if [[ "$before" != "$after" ]]; then
            echo "::error::PR-22 contract violation — --mode=uninstall touched protected filesystem"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::--mode=uninstall (no explicit dry-run) must exit 0 in PR-22 scope"
            exit 1
          fi
          echo "G3-UN-PLAN-RENDERS no-mutation PASS — no files changed under /etc/nftban, /usr/lib/nftban, /usr/sbin/nftban*, /var/lib/nftban"

      # ------------------------------------------------------------------
      # G3-UN-HISTORY-PURITY — regression guard for audit finding A.3.
      # Seeds a realistic update-history.json, runs the dry-run twice
      # (explicit + implicit), then asserts the history file is byte-
      # identical. Before PR-22A, each dry-run appended an install_fail
      # entry here.
      # ------------------------------------------------------------------
      - name: G3-UN-HISTORY-PURITY — history file unchanged by dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          hist=/var/lib/nftban/update-history.json
          sudo mkdir -p /var/lib/nftban
          echo '{"schema_version":"1.0","entries":[{"from":"1.99.0","to":"1.100.0","status":"success","type":"rpm","duration":1,"hostname":"ci","timestamp":"2026-04-19T00:00:00Z"}]}' | sudo tee "$hist" >/dev/null
          before_hash=$(sha256sum "$hist" | awk '{print $1}')
          sudo ./bin/nftban-installer --mode=uninstall --dry-run --state-dir=/var/lib/nftban/state >/dev/null 2>&1 || true
          sudo ./bin/nftban-installer --mode=uninstall --state-dir=/var/lib/nftban/state >/dev/null 2>&1 || true
          after_hash=$(sha256sum "$hist" | awk '{print $1}')
          if [[ "$before_hash" != "$after_hash" ]]; then
            echo "::error::G3-UN-HISTORY-PURITY FAIL — uninstall dry-run modified update-history.json"
            echo "before: $before_hash"
            echo "after:  $after_hash"
            cat "$hist"
            exit 1
          fi
          echo "G3-UN-HISTORY-PURITY PASS — update-history.json byte-identical after 2 dry-runs"

  summary:
    name: Uninstall Canonization summary
    needs: uninstall-canonization
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          if [[ "${{ needs.uninstall-canonization.result }}" != "success" ]]; then
            echo "::error::Uninstall Canonization Gate FAILED — see matrix job output"
            exit 1
          fi
          echo "Uninstall Canonization Gate PASSED on all matrix targets"
