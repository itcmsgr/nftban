# =============================================================================
# NFTBan Security Profile: CUSTOM (User-Defined)
# =============================================================================
# This is a CUSTOM PROFILE template for users to create their own security
# configuration tailored to their specific needs.
#
# Unlike the pre-configured profiles (web-server, mail-server, database, etc.),
# this profile is EMPTY by default and allows you to manually configure every
# setting according to your requirements.
#
# USAGE:
#   1. Copy this file to: /usr/share/nftban/profiles/custom.conf
#   2. Edit the settings below to match your needs
#   3. Apply with: sudo nftban profile apply custom
#
# Or use interactive selection:
#   sudo nftban profile select
#   → Choose "Custom (User-Defined)"
#
# =============================================================================

# Profile metadata
PROFILE_NAME="custom"
PROFILE_DESCRIPTION="Custom - User-defined security configuration"

# =============================================================================
# DDOS PROTECTION CONFIGURATION
# =============================================================================
# Configure DDoS protection settings according to your server's role and
# traffic patterns. See other profiles for examples:
#
#   /usr/share/nftban/profiles/web-server.conf       - Web server example
#   /usr/share/nftban/profiles/mail-server.conf      - Mail server example
#   /usr/share/nftban/profiles/database.conf         - Database server example
#   /usr/share/nftban/profiles/mixed.conf            - Mixed server example
#   /usr/share/nftban/profiles/development.conf      - Development server example
#   /usr/share/nftban/profiles/maximum.conf          - Maximum security example
#
# Full configuration reference: /etc/nftban/conf.d/ddos.conf
# =============================================================================

# Master DDoS Protection Switch
# Set to "true" to enable DDoS protection, "false" to disable
# Example: DDOS_PROTECTION_ENABLED="true"
DDOS_PROTECTION_ENABLED=""

# -----------------------------------------------------------------------------
# SYN FLOOD PROTECTION
# -----------------------------------------------------------------------------
# Protects against TCP SYN flood attacks
# ⚠️  Only enable during active attack (adds connection latency)
#
# Example configuration:
#   DDOS_SYNFLOOD_ENABLED="false"        # Disable by default
#   DDOS_SYNFLOOD_RATE="100/second"      # Rate limit
#   DDOS_SYNFLOOD_BURST="150"            # Burst allowance
#
# Your settings:
DDOS_SYNFLOOD_ENABLED=""
DDOS_SYNFLOOD_RATE=""
DDOS_SYNFLOOD_BURST=""

# -----------------------------------------------------------------------------
# CONNECTION LIMIT PROTECTION
# -----------------------------------------------------------------------------
# Limits concurrent connections per IP to prevent exhaustion attacks
# Set to "0" to disable limit for specific service
#
# Example configuration (web server):
#   DDOS_CONNLIMIT_ENABLED="true"
#   DDOS_CONNLIMIT_SSH="5"               # Management only
#   DDOS_CONNLIMIT_HTTP="50"             # High for web traffic
#   DDOS_CONNLIMIT_HTTPS="50"            # High for web traffic
#   DDOS_CONNLIMIT_FTP="0"               # Disabled (no FTP)
#   DDOS_CONNLIMIT_SMTP="0"              # Disabled (no mail)
#   DDOS_CONNLIMIT_POP3="0"              # Disabled
#   DDOS_CONNLIMIT_IMAP="0"              # Disabled
#   DDOS_CONNLIMIT_MYSQL="0"             # Disabled (remote DB)
#   DDOS_CONNLIMIT_POSTGRESQL="0"        # Disabled
#
# Your settings:
DDOS_CONNLIMIT_ENABLED=""
DDOS_CONNLIMIT_SSH=""
DDOS_CONNLIMIT_HTTP=""
DDOS_CONNLIMIT_HTTPS=""
DDOS_CONNLIMIT_FTP=""
DDOS_CONNLIMIT_SMTP=""
DDOS_CONNLIMIT_POP3=""
DDOS_CONNLIMIT_IMAP=""
DDOS_CONNLIMIT_MYSQL=""
DDOS_CONNLIMIT_POSTGRESQL=""

# -----------------------------------------------------------------------------
# PORT FLOOD PROTECTION
# -----------------------------------------------------------------------------
# Rate limits new connection attempts to specific ports
#
# Example configuration (web server):
#   DDOS_PORTFLOOD_ENABLED="true"
#   DDOS_PORTFLOOD_RATE="1000/second"    # High for web traffic
#   DDOS_PORTFLOOD_BURST="2000"
#   DDOS_PORTFLOOD_PORTS="80,443"        # Web ports only
#
# Example configuration (mail server):
#   DDOS_PORTFLOOD_ENABLED="true"
#   DDOS_PORTFLOOD_RATE="500/second"
#   DDOS_PORTFLOOD_BURST="1000"
#   DDOS_PORTFLOOD_PORTS="25,110,143,465,587,993,995"  # Mail ports
#
# Your settings:
DDOS_PORTFLOOD_ENABLED=""
DDOS_PORTFLOOD_RATE=""
DDOS_PORTFLOOD_BURST=""
DDOS_PORTFLOOD_PORTS=""

# -----------------------------------------------------------------------------
# ICMP FLOOD PROTECTION
# -----------------------------------------------------------------------------
# Rate limits ICMP (ping) packets to prevent ping floods
#
# Example configuration:
#   DDOS_ICMPFLOOD_ENABLED="true"
#   DDOS_ICMPFLOOD_RATE="50/second"      # Allow legitimate pings
#   DDOS_ICMPFLOOD_BURST="100"
#
# Your settings:
DDOS_ICMPFLOOD_ENABLED=""
DDOS_ICMPFLOOD_RATE=""
DDOS_ICMPFLOOD_BURST=""

# =============================================================================
# PORT SCAN DETECTION CONFIGURATION
# =============================================================================
# Configure port scan detection and auto-banning behavior
# Full configuration reference: /etc/nftban/conf.d/portscan.conf
# =============================================================================

# Master Port Scan Detection Switch
# Set to "true" to enable detection, "false" to disable
# Example: PORTSCAN_ENABLED="true"
PORTSCAN_ENABLED=""

# -----------------------------------------------------------------------------
# DETECTION PARAMETERS
# -----------------------------------------------------------------------------
# Controls how port scans are detected
#
# Example configuration (balanced):
#   PORTSCAN_TIME_WINDOW="300"           # 5 minutes
#   PORTSCAN_THRESHOLD="10"              # 10 different ports triggers detection
#   PORTSCAN_DIVERSITY="true"            # Require diversity across port ranges
#
# Example configuration (aggressive):
#   PORTSCAN_TIME_WINDOW="120"           # 2 minutes
#   PORTSCAN_THRESHOLD="5"               # 5 ports triggers detection
#   PORTSCAN_DIVERSITY="false"           # Strict detection
#
# Your settings:
PORTSCAN_TIME_WINDOW=""
PORTSCAN_THRESHOLD=""
PORTSCAN_DIVERSITY=""

# -----------------------------------------------------------------------------
# AUTO-BAN SETTINGS
# -----------------------------------------------------------------------------
# Controls automatic banning of detected scanners
#
# Example configuration (auto-ban enabled):
#   PORTSCAN_AUTO_BAN="true"
#   PORTSCAN_BAN_TYPE="temporary"        # or "permanent"
#   PORTSCAN_BAN_TIME="3600"             # 1 hour (if temporary)
#
# Example configuration (monitoring only - no bans):
#   PORTSCAN_AUTO_BAN="false"            # Log only, don't ban
#   PORTSCAN_BAN_TYPE="temporary"
#   PORTSCAN_BAN_TIME="300"              # 5 minutes if manual ban
#
# Your settings:
PORTSCAN_AUTO_BAN=""
PORTSCAN_BAN_TYPE=""
PORTSCAN_BAN_TIME=""

# -----------------------------------------------------------------------------
# MONITORING SCOPE
# -----------------------------------------------------------------------------
# Controls which ports are monitored for scanning
#
# Options:
#   "closed" - Monitor only closed ports (recommended, fewer false positives)
#   "all"    - Monitor all ports (aggressive, may cause false positives)
#   "custom" - Monitor specific ports (set PORTSCAN_CUSTOM_PORTS)
#
# Example configuration:
#   PORTSCAN_MONITOR_PORTS="closed"      # Recommended
#   PORTSCAN_MONITOR_ICMP="true"         # Include ICMP in detection
#
# Your settings:
PORTSCAN_MONITOR_PORTS=""
PORTSCAN_MONITOR_ICMP=""
PORTSCAN_CUSTOM_PORTS=""

# =============================================================================
# OPTIONAL INTEGRATIONS
# =============================================================================

# Cloudflare Integration (optional)
# Uncomment to enable Cloudflare IP whitelisting
# CLOUDFLARE_ENABLED="true"

# GeoIP Blocking (optional)
# Uncomment to enable country-based blocking
# GEOIP_ENABLED="true"
# GEOIP_BLOCK_COUNTRIES="CN,RU"  # Example: Block China and Russia

# =============================================================================
# USAGE NOTES
# =============================================================================
#
# 1. SETTING VALUES:
#    - Remove the empty quotes ("") and provide your value
#    - Example: DDOS_CONNLIMIT_HTTP="50"
#
# 2. LEAVING SETTINGS UNDEFINED:
#    - Empty settings ("") will use package defaults from /etc/nftban/conf.d/
#    - To explicitly disable a feature, set to "false" or "0"
#
# 3. GETTING HELP:
#    - View other profiles for examples: /usr/share/nftban/profiles/
#    - Read full documentation: nftban ddos help
#    - Check current settings: nftban profile show
#
# 4. TESTING YOUR CONFIGURATION:
#    - Test DDoS rules: nftban ddos status
#    - Test port scan detection: nftban portscan status
#    - View logs: tail -f /var/log/nftban/ddos.log
#
# 5. APPLYING CHANGES:
#    - After editing this file, apply with: sudo nftban profile apply custom
#    - Or use interactive selection: sudo nftban profile select
#
# =============================================================================
# PROFILE COMPARISON TABLE
# =============================================================================
#
# ┌─────────────┬────────────┬──────────────┬──────────┬──────────┬──────────┐
# │ Feature     │ Web Server │ Mail Server  │ Database │ Mixed    │ Maximum  │
# ├─────────────┼────────────┼──────────────┼──────────┼──────────┼──────────┤
# │ SYN Flood   │ Disabled   │ Enabled      │ Disabled │ Disabled │ Enabled  │
# │ HTTP Limit  │ 50         │ 0 (disabled) │ 0        │ 30       │ 20       │
# │ HTTPS Limit │ 50         │ 0 (disabled) │ 0        │ 30       │ 20       │
# │ SSH Limit   │ 5          │ 5            │ 5        │ 5        │ 3        │
# │ SMTP Limit  │ 0          │ 10           │ 0        │ 5        │ 3        │
# │ DB Limit    │ 0          │ 0            │ 5        │ 3        │ 2        │
# │ Port Scan   │ 10 ports   │ 8 ports      │ 5 ports  │ 10 ports │ 3 ports  │
# │ Scan Window │ 5 min      │ 3 min        │ 2 min    │ 5 min    │ 1 min    │
# │ Auto-Ban    │ 1 hour     │ 2 hours      │ Permanent│ 1 hour   │ Permanent│
# └─────────────┴────────────┴──────────────┴──────────┴──────────┴──────────┘
#
# Use this table as a reference when creating your custom configuration.
#
# =============================================================================
# END OF CUSTOM PROFILE TEMPLATE
# =============================================================================
