# =============================================================================
# NFTBan v1.0.0 - CI Pipeline
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Comprehensive CI for pull request validation
#
# Runs on:
#   - All pull requests to main/master
#   - Pushes to main/master/develop
#
# Checks:
#   - ShellCheck (bash linting)
#   - Go build & tests
#   - Go security scanning (gosec, staticcheck)
#   - Syntax validation for all scripts
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # ARCHITECTURE POLICY CHECK
  # ===========================================================================
  architecture-check:
    name: Architecture Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check nft write policy
        run: |
          echo "=== Checking nft write architecture policy ==="
          # Two-tier enforcement:
          #   WRITE operations: enforced (blocks PR)
          #   READ operations: warned only
          #
          # Wave 1-2 complete, Wave 3 in progress (2026-01-02):
          #   - Socket: root:nftban 0660 (systemd-managed)
          #   - maintenance.sh + sync.go + portscan_classic.sh migrated to IPC
          #   - Remaining: ddos_classic.sh, cmd_port.sh, geoban.sh, etc.
          #
          # Using --warn-all until Wave 3 complete (58 violations remaining)
          # TODO: Remove --warn-all when all migrations done
          ./scripts/ci/check-nft-writes.sh --warn-all

      - name: Check netlink import policy
        run: |
          echo "=== Checking netlink import architecture policy ==="
          # Single-writer architecture: only nftband daemon may use netlink
          #
          # Allowed paths:
          #   cmd/nftband/       - the daemon itself
          #   pkg/nftbackend/    - daemon's nft backend
          #   pkg/sync/          - nft operations library (used by daemon)
          #
          # Forbidden in CLI:
          #   cmd/nftban-core/   - CLI must use IPC, not netlink
          #
          VIOLATIONS=0

          echo "Checking cmd/nftban-core for forbidden netlink imports..."
          if grep -r "github.com/google/nftables" cmd/nftban-core/ 2>/dev/null; then
            echo "❌ FAIL: cmd/nftban-core imports netlink directly!"
            echo "   CLI must use IPC (pkg/ipc) to communicate with daemon."
            VIOLATIONS=1
          else
            echo "✓ cmd/nftban-core: No direct netlink imports"
          fi

          # Verify daemon is allowed
          echo ""
          echo "Verifying daemon uses netlink (expected)..."
          if grep -q "github.com/google/nftables" cmd/nftband/main.go 2>/dev/null || \
             grep -q "nftbackend" cmd/nftband/main.go 2>/dev/null; then
            echo "✓ cmd/nftband: Uses nftbackend (correct - daemon owns nft writes)"
          fi

          if [[ $VIOLATIONS -gt 0 ]]; then
            echo ""
            echo "=== NETLINK IMPORT POLICY VIOLATION ==="
            echo "The CLI (cmd/nftban-core) must not import netlink libraries."
            echo "Use pkg/ipc to send requests to nftband daemon instead."
            exit 1
          fi

          echo ""
          echo "✓ Netlink import policy: PASSED"

  # ===========================================================================
  # BASH VALIDATION
  # ===========================================================================
  bash-check:
    name: Bash Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check all bash scripts
        run: |
          echo "=== Checking bash syntax ==="
          find cli install packaging -name "*.sh" -type f | while read -r script; do
            bash -n "$script" || { echo "FAIL: $script"; exit 1; }
          done
          bash -n build.sh install.sh
          echo "✓ All bash syntax valid"

      - name: ShellCheck core scripts
        run: |
          echo "=== ShellCheck: Core ==="
          shellcheck -x -S warning cli/lib/nftban/core/*.sh || true

      - name: ShellCheck CLI scripts
        run: |
          echo "=== ShellCheck: CLI ==="
          shellcheck -x -S warning cli/lib/nftban/cli/*.sh || true

      - name: ShellCheck lib scripts
        run: |
          echo "=== ShellCheck: Lib ==="
          shellcheck -x -S warning cli/lib/nftban/lib/*.sh || true

      - name: ShellCheck setup scripts
        run: |
          echo "=== ShellCheck: Setup ==="
          shellcheck -x -S warning cli/lib/nftban/setup/*.sh || true

      - name: ShellCheck install scripts
        run: |
          echo "=== ShellCheck: Install ==="
          shellcheck -x -S warning install/*.sh || true
          shellcheck -x -S warning install.sh build.sh

  # ===========================================================================
  # GO VALIDATION
  # ===========================================================================
  go-check:
    name: Go Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.23'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate templ files
        run: $(go env GOPATH)/bin/templ generate

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error ::Run 'go mod tidy' and commit changes"
            exit 1
          }

      - name: Run go vet
        run: |
          go vet ./... 2>&1 | tee /tmp/vet.out
          if [ -s /tmp/vet.out ]; then
            echo "::error ::go vet found issues:"
            cat /tmp/vet.out
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Run tests (including IPC integration tests)
        run: go test -race -v ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.5.1

      - name: Run staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec
        run: $(go env GOPATH)/bin/gosec -quiet ./... || true

  # ===========================================================================
  # BUILD VERIFICATION
  # ===========================================================================
  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [bash-check, go-check]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.23'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate templ files
        run: $(go env GOPATH)/bin/templ generate

      - name: Build Go binaries
        run: |
          mkdir -p bin
          go build -o bin/nftban-core ./cmd/nftban-core
          go build -o bin/nftban-ui ./cmd/nftban-ui
          go build -o bin/nftban-ui-auth ./cmd/nftban-ui-auth
          go build -o bin/nftband ./cmd/nftband

      - name: Verify binaries
        run: |
          echo "=== Built binaries ==="
          ls -lh bin/
          file bin/nftban-core
          file bin/nftban-ui
          file bin/nftban-ui-auth
          file bin/nftband

      - name: Verify CLI structure
        run: |
          echo "=== Verifying CLI structure ==="
          test -f cli/sbin/nftban || { echo "FAIL: cli/sbin/nftban missing"; exit 1; }
          test -f cli/lib/nftban/nftban_help.sh || { echo "FAIL: nftban_help.sh missing"; exit 1; }
          test -d cli/lib/nftban/core || { echo "FAIL: core/ missing"; exit 1; }
          test -d cli/lib/nftban/cli || { echo "FAIL: cli/ missing"; exit 1; }
          test -d cli/lib/nftban/lib || { echo "FAIL: lib/ missing"; exit 1; }
          echo "✓ CLI structure valid"

  # ===========================================================================
  # DOCUMENTATION VALIDATION
  # ===========================================================================
  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install yq
        run: |
          pip3 install yq

      - name: Check for error messages in documentation
        run: |
          echo "=== Checking documentation for build errors ==="

          # List of critical documentation files that must not contain error messages
          DOC_FILES=(
            "docs/wiki/OPERATOR_GUIDE.md"
            "docs/README.md"
            "README.md"
          )

          ERRORS_FOUND=0

          for doc in "${DOC_FILES[@]}"; do
            if [[ -f "$doc" ]]; then
              echo "Checking $doc..."

              # Check for common error patterns
              if grep -qE "^ERROR:|^FATAL:|yq is required|pip install|brew install" "$doc"; then
                echo "❌ FAIL: $doc contains error messages!"
                grep -n "ERROR:\|FATAL:\|yq is required\|pip install\|brew install" "$doc"
                ERRORS_FOUND=1
              else
                echo "✓ $doc is clean"
              fi
            fi
          done

          if [[ $ERRORS_FOUND -eq 1 ]]; then
            echo ""
            echo "=== DOCUMENTATION BUILD ERRORS DETECTED ==="
            echo "Documentation files contain build error messages."
            echo "This indicates a failed documentation generation process."
            echo ""
            echo "To fix:"
            echo "  1. Install yq: pip3 install yq"
            echo "  2. Regenerate docs: ./scripts/generate-wiki-operator.sh > docs/wiki/OPERATOR_GUIDE.md"
            echo "  3. Commit the corrected files"
            exit 1
          fi

          echo "✓ All documentation files are error-free"

      - name: Validate documentation can be generated
        run: |
          echo "=== Validating documentation generation ==="

          # Test that scripts can run without errors
          ./scripts/generate-wiki-operator.sh > /tmp/operator-test.md

          # Verify output is substantial (not just an error message)
          lines=$(wc -l < /tmp/operator-test.md)
          if [[ $lines -lt 100 ]]; then
            echo "❌ FAIL: Generated documentation is suspiciously short ($lines lines)"
            echo "First 20 lines:"
            head -20 /tmp/operator-test.md
            exit 1
          fi

          echo "✓ Documentation generation successful ($lines lines)"

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  ci-summary:
    name: CI
    runs-on: ubuntu-latest
    needs: [architecture-check, bash-check, go-check, build-verify, documentation-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture Policy | ${{ needs.architecture-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bash Validation | ${{ needs.bash-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Validation | ${{ needs.go-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build-verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Validation | ${{ needs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
