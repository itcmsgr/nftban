#
# nftban Suricata Rule Enable Configuration
# =========================================
# This file specifies rules to ENABLE that would otherwise be disabled.
# Use this to override defaults or re-enable rules disabled by category.
#
# Syntax options:
#   <sid>                    - Enable a specific rule by SID
#   <sid1>-<sid2>            - Enable a range of SIDs
#   re:<regex>               - Enable rules matching regex pattern
#
# Examples:
#   2100498                  - Enable SID 2100498
#   2100000-2100999          - Enable SID range
#   re:.*MALWARE.*           - Enable all MALWARE rules
#
# Use cases:
#   - Enable specific rules from a disabled category
#   - Force-enable rules that are off by default
#   - Override disable.conf for specific SIDs
#
# Processing order:
#   1. Category enables/disables (categories.enabled)
#   2. disable.conf (disables specific rules)
#   3. enable.conf (re-enables specific rules) <- highest priority
#
# This file is processed by suricata-update.
# See: https://suricata-update.readthedocs.io/en/latest/

