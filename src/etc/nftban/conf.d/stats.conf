# =============================================================================
# NFTBan v0.32.6 - Statistics & Metrics Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Statistics collection, reporting, and automated email alerts
#
# This configuration integrates with:
# - /etc/nftban/conf.d/mail.conf (for email settings)
# - nftban_mail.sh (for email delivery)
# - /var/log/nftban/ban.log (primary data source)
#
# =============================================================================

# =============================================================================
# CORE SETTINGS
# =============================================================================

# Master switch for statistics system
STATS_ENABLED="true"

# Statistics database type
# Values: "json" (default), "sqlite" (future)
STATS_DB_TYPE="json"

# Data retention period (days)
# Old logs and snapshots will be deleted after this period
STATS_RETENTION_DAYS="90"

# Enable caching for performance
# Expensive queries cached for faster repeated access
STATS_CACHE_ENABLED="true"

# Cache time-to-live (seconds)
# Default: 300 seconds (5 minutes)
STATS_CACHE_TTL="300"

# =============================================================================
# PATHS (FHS Compliant)
# =============================================================================

# Metrics database storage
STATS_DB_DIR="/var/lib/nftban/metrics"

# Cache directory
STATS_CACHE_DIR="/var/cache/nftban/stats"

# Hourly snapshots for trending
STATS_SNAPSHOTS_DIR="/var/lib/nftban/snapshots"

# Generated reports
STATS_REPORTS_DIR="/var/lib/nftban/reports"

# Log file (stats module specific)
STATS_LOG_FILE="/var/log/nftban/stats.log"

# Primary data source (ban events)
STATS_BAN_LOG="/var/log/nftban/ban.log"

# =============================================================================
# DATA COLLECTION
# =============================================================================

# Enable GeoIP-based country analysis
# Requires: nftban-geoip binary installed
# If disabled or binary not found, country field shows "--"
STATS_GEOIP_ENABLED="true"

# Track repeat offenders (IPs banned multiple times)
STATS_TRACK_REPEAT_OFFENDERS="true"

# Repeat offender threshold (number of bans)
STATS_REPEAT_OFFENDER_THRESHOLD="5"

# Track attack patterns (time-based analysis)
STATS_TRACK_ATTACK_PATTERNS="true"

# Track feed effectiveness
STATS_TRACK_FEED_EFFECTIVENESS="true"

# Track Fail2Ban jail statistics
STATS_TRACK_JAIL_STATS="true"

# =============================================================================
# DASHBOARD SETTINGS
# =============================================================================

# Default refresh interval for monitor mode (seconds)
STATS_MONITOR_REFRESH="5"

# Top N items to show (IPs, countries, jails)
STATS_TOP_N="10"

# Show detailed metrics in dashboard
STATS_SHOW_DETAILED="true"

# =============================================================================
# REPORT GENERATION
# =============================================================================

# Enable report generation
REPORTS_ENABLED="true"

# Default report format
# Values: "html", "json", "csv", "all"
REPORTS_DEFAULT_FORMAT="html"

# Report theme
# Values: "dark", "light", "auto"
REPORTS_THEME="dark"

# Include interactive charts in HTML reports
# Requires: Chart.js (loaded from CDN or local)
REPORTS_INCLUDE_CHARTS="true"

# Chart library
# Values: "chartjs" (default), "apexcharts" (future)
REPORTS_CHART_LIBRARY="chartjs"

# Chart.js CDN URL (or local path)
REPORTS_CHARTJS_URL="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"

# Include executive summary
REPORTS_INCLUDE_SUMMARY="true"

# Include security recommendations
REPORTS_INCLUDE_RECOMMENDATIONS="true"

# Compress old reports (gzip after N days)
REPORTS_COMPRESS_AFTER_DAYS="7"

# Delete old reports (after N days)
REPORTS_DELETE_AFTER_DAYS="90"

# =============================================================================
# EMAIL REPORTS
# =============================================================================
# NOTE: Email delivery uses /etc/nftban/conf.d/mail.conf settings
# NFTBAN_MAIL_RECIPIENT, NFTBAN_SENDER, etc. are inherited
# =============================================================================

# Enable email reports
STATS_EMAIL_ENABLED="true"

# Email recipients for stats reports (comma-separated)
# Leave blank to use NFTBAN_MAIL_RECIPIENT from mail.conf
STATS_EMAIL_RECIPIENTS=""

# CC recipients (comma-separated, optional)
STATS_EMAIL_CC=""

# Email format
# Values: "html" (inline HTML), "text" (plain text), "both"
STATS_EMAIL_FORMAT="html"

# Attach CSV data to email
STATS_EMAIL_ATTACH_CSV="true"

# Attach full HTML report to email
STATS_EMAIL_ATTACH_HTML="false"

# Email subject prefix
# Will be: "[NFTBan Stats] Daily Report - 2025-10-29"
STATS_EMAIL_SUBJECT_PREFIX="[NFTBan Stats]"

# =============================================================================
# AUTOMATED REPORTS (CRON SCHEDULING)
# =============================================================================

# Daily report
STATS_DAILY_REPORT_ENABLED="true"
STATS_DAILY_REPORT_TIME="08:00"              # HH:MM format (24-hour)
STATS_DAILY_REPORT_FORMAT="html"
STATS_DAILY_REPORT_EMAIL="true"

# Weekly report
STATS_WEEKLY_REPORT_ENABLED="true"
STATS_WEEKLY_REPORT_DAY="Monday"             # Monday, Tuesday, etc.
STATS_WEEKLY_REPORT_TIME="09:00"
STATS_WEEKLY_REPORT_FORMAT="html"
STATS_WEEKLY_REPORT_EMAIL="true"

# Monthly report
STATS_MONTHLY_REPORT_ENABLED="true"
STATS_MONTHLY_REPORT_DAY="1"                 # Day of month (1-31)
STATS_MONTHLY_REPORT_TIME="10:00"
STATS_MONTHLY_REPORT_FORMAT="html"
STATS_MONTHLY_REPORT_EMAIL="true"

# =============================================================================
# ALERTS & THRESHOLDS
# =============================================================================

# Enable threshold-based alerts
STATS_ALERTS_ENABLED="true"

# High ban rate alert (bans per hour)
STATS_ALERT_HIGH_BAN_RATE="100"

# Send email notification for high ban rate
STATS_ALERT_HIGH_BAN_RATE_EMAIL="true"

# Repeat offender alert threshold
STATS_ALERT_REPEAT_OFFENDER_THRESHOLD="10"

# Send email notification for repeat offenders
STATS_ALERT_REPEAT_OFFENDER_EMAIL="true"

# Alert for failed feed updates
STATS_ALERT_FEED_FAILURE_EMAIL="true"

# Disk space alert threshold (percentage)
STATS_ALERT_DISK_SPACE_THRESHOLD="90"

# Alert cooldown period (seconds)
# Prevents alert spam - minimum time between alerts of same type
STATS_ALERT_COOLDOWN="3600"                  # 1 hour

# =============================================================================
# PERFORMANCE & OPTIMIZATION
# =============================================================================

# Enable parallel processing (faster report generation)
STATS_PARALLEL_PROCESSING="true"

# Maximum concurrent jobs
STATS_MAX_PARALLEL_JOBS="4"

# Log rotation
STATS_LOG_MAX_SIZE="100"                     # MB - rotate when exceeded
STATS_LOG_COMPRESS_DAYS="7"                  # Compress logs older than N days

# =============================================================================
# ADVANCED ANALYTICS
# =============================================================================

# Enable attack pattern detection
STATS_ANALYTICS_PATTERNS="true"

# Time window for pattern analysis (hours)
STATS_ANALYTICS_PATTERN_WINDOW="24"

# Enable effectiveness metrics
STATS_ANALYTICS_EFFECTIVENESS="true"

# Calculate false positive rate
STATS_ANALYTICS_FALSE_POSITIVE_RATE="false"

# Track mean time to ban (detection → ban time)
STATS_ANALYTICS_MEAN_TIME_TO_BAN="true"

# Enable predictive analytics (ML-based, future feature)
STATS_ANALYTICS_PREDICTIVE="false"

# =============================================================================
# EXTERNAL INTEGRATIONS (FUTURE)
# =============================================================================

# Export to Grafana
STATS_EXPORT_GRAFANA="false"
STATS_GRAFANA_URL=""

# Export to Prometheus
STATS_EXPORT_PROMETHEUS="false"
STATS_PROMETHEUS_PORT="9090"

# Export to Splunk
STATS_EXPORT_SPLUNK="false"
STATS_SPLUNK_URL=""

# Export to syslog
STATS_EXPORT_SYSLOG="false"
STATS_SYSLOG_SERVER=""

# Webhook for real-time notifications
STATS_WEBHOOK_ENABLED="false"
STATS_WEBHOOK_URL=""
STATS_WEBHOOK_SECRET=""

# API endpoint for external access
STATS_API_ENABLED="false"
STATS_API_PORT="8080"
STATS_API_TOKEN=""

# =============================================================================
# COMPLIANCE & PRIVACY
# =============================================================================

# GDPR compliance mode
# Anonymizes IPs in reports (replaces last octet with XXX)
STATS_GDPR_COMPLIANCE="false"

# Anonymize IPs in reports
STATS_ANONYMIZE_IPS="false"

# Enforce data retention policy
STATS_ENFORCE_RETENTION_POLICY="true"

# Include privacy notice in reports
STATS_INCLUDE_PRIVACY_NOTICE="true"

# Privacy notice text (or path to file)
STATS_PRIVACY_NOTICE="This report contains IP addresses for security purposes only. Data retained for ${STATS_RETENTION_DAYS} days."

# =============================================================================
# DEBUG & LOGGING
# =============================================================================

# Debug mode (verbose logging)
# Auto-enabled if NFTBAN_DEBUG_MODE=true
STATS_DEBUG="false"

# Log level
# Values: "error", "warn", "info", "debug"
STATS_LOG_LEVEL="info"

# Log to syslog (in addition to file)
STATS_LOG_SYSLOG="false"

# Syslog facility
STATS_SYSLOG_FACILITY="local0"

# Save generated reports for debugging
# Leave blank to disable
STATS_SAVE_GENERATED_REPORTS=""

# =============================================================================
# AUTO-ESCALATION FOR DEBUG MODE
# =============================================================================

# When NFTBAN_DEBUG_MODE=true, automatically enable verbose stats logging
if [[ "${NFTBAN_DEBUG_MODE:-false}" == "true" ]]; then
    [[ "${STATS_DEBUG:-false}" == "false" ]] && STATS_DEBUG="true"
    [[ "${STATS_LOG_LEVEL:-info}" == "info" ]] && STATS_LOG_LEVEL="debug"
fi

# =============================================================================
# CRON AUTOMATION
# =============================================================================
# Cron jobs are managed by:
#   nftban report schedule daily --time "08:00"
#   nftban report schedule weekly --day Monday --time "09:00"
#   nftban report schedule monthly --day 1 --time "10:00"
#
# Cron file location: /etc/cron.d/nftban-stats
#
# Manual trigger:
#   nftban report run daily
#   nftban report run weekly
#   nftban report run monthly
# =============================================================================

# =============================================================================
# USER CUSTOMIZATIONS
# =============================================================================
# DO NOT edit this file for customizations!
# Use /etc/nftban/nftban.conf.local instead:
#
# Example:
#   STATS_EMAIL_RECIPIENTS="admin@company.com,security@company.com"
#   STATS_DAILY_REPORT_TIME="07:00"
#   STATS_ALERT_HIGH_BAN_RATE="50"
#   STATS_TOP_N="20"
#
# Your customizations in nftban.conf.local will override these defaults
# =============================================================================

# End of stats.conf
