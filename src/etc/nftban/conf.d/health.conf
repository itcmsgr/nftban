# =============================================================================
# NFTBan v0.30.0 - Health Check Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Configure health check thresholds for system resource monitoring
# Location: /etc/nftban/conf.d/health.conf
#
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY!
# Create /etc/nftban/conf.d/health.conf.local to override settings
# The .local file will be preserved during upgrades
# =============================================================================

# =============================================================================
# DISK USAGE THRESHOLDS
# =============================================================================
# Disk usage thresholds for critical filesystems (/, /var, /var/log, /tmp)

# Warning threshold (percentage)
NFTBAN_DISK_WARN_THRESHOLD=85

# Critical threshold (percentage)
NFTBAN_DISK_CRIT_THRESHOLD=95

# =============================================================================
# MEMORY (RAM) USAGE THRESHOLDS
# =============================================================================
# RAM usage thresholds based on available memory

# Warning threshold (percentage)
NFTBAN_RAM_WARN_THRESHOLD=90

# Critical threshold (percentage)
NFTBAN_RAM_CRIT_THRESHOLD=95

# =============================================================================
# CPU LOAD THRESHOLDS
# =============================================================================
# CPU load thresholds (as percentage of total CPU cores)
# Example: On 4-core system, 80% = load average of 3.2

# Warning threshold (percentage)
NFTBAN_CPU_WARN_THRESHOLD=80

# Critical threshold (percentage)
NFTBAN_CPU_CRIT_THRESHOLD=95

# =============================================================================
# ALERT THROTTLING
# =============================================================================
# Prevent alert spam by limiting frequency

# Minimum time between alerts for the same issue (in seconds)
# Default: 3600 (1 hour) - only send same alert once per hour
NFTBAN_ALERT_THROTTLE_SECONDS=3600

# Maximum alerts per day for resource issues
# Default: 24 (once per hour maximum)
NFTBAN_ALERT_MAX_PER_DAY=24

# Alert state file location
NFTBAN_ALERT_STATE_FILE="/var/lib/nftban/state/health_alerts.state"

# =============================================================================
# USAGE NOTES
# =============================================================================
#
# 1. These thresholds are used by the health check system to determine
#    when to issue warnings or errors.
#
# 2. Adjust these values based on your environment:
#    - Production servers: Keep conservative (85/95 for disk)
#    - Development servers: Can be more relaxed (90/98)
#
# 3. Resource checks include:
#    - Disk usage (/, /var, /var/log, /tmp)
#    - Inode usage (can fill up even with free disk space)
#    - RAM usage (based on available memory)
#    - CPU load average (1-minute, relative to core count)
#    - Swap usage (high swap indicates memory pressure)
#
# 4. Test your settings:
#    nftban health check
#
# 5. View detailed resource status:
#    nftban-health --inventory | jq '.resources'
#
# =============================================================================
# THRESHOLD EXAMPLES FOR DIFFERENT ENVIRONMENTS
# =============================================================================
#
# Conservative (Production):
#   NFTBAN_DISK_WARN_THRESHOLD=80
#   NFTBAN_DISK_CRIT_THRESHOLD=90
#   NFTBAN_RAM_WARN_THRESHOLD=85
#   NFTBAN_RAM_CRIT_THRESHOLD=93
#   NFTBAN_CPU_WARN_THRESHOLD=75
#   NFTBAN_CPU_CRIT_THRESHOLD=90
#
# Balanced (Default):
#   NFTBAN_DISK_WARN_THRESHOLD=85
#   NFTBAN_DISK_CRIT_THRESHOLD=95
#   NFTBAN_RAM_WARN_THRESHOLD=90
#   NFTBAN_RAM_CRIT_THRESHOLD=95
#   NFTBAN_CPU_WARN_THRESHOLD=80
#   NFTBAN_CPU_CRIT_THRESHOLD=95
#
# Relaxed (Development/Testing):
#   NFTBAN_DISK_WARN_THRESHOLD=90
#   NFTBAN_DISK_CRIT_THRESHOLD=98
#   NFTBAN_RAM_WARN_THRESHOLD=93
#   NFTBAN_RAM_CRIT_THRESHOLD=98
#   NFTBAN_CPU_WARN_THRESHOLD=85
#   NFTBAN_CPU_CRIT_THRESHOLD=98
#
# =============================================================================
