# =============================================================================
# NFTBan - Build Packages
# =============================================================================
# SPDX-License-Identifier: MPL-2.0

name: Build NFTBan Packages

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # ==========================================================================
  # VALIDATE BUNDLED DEPENDENCIES (yq checksum consistency)
  # ==========================================================================
  validate-dependencies:
    name: Validate bundled dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate yq checksums are consistent
        run: |
          echo "Checking yq SHA256 checksums across build files..."

          # Extract all YQ_SHA256 values
          CHECKSUMS=$(grep -roh 'YQ_SHA256="[a-f0-9]\{64\}"' packaging/ | sort -u)
          COUNT=$(echo "$CHECKSUMS" | wc -l)

          echo "Found $COUNT unique YQ_SHA256 definitions:"
          echo "$CHECKSUMS"

          if [[ $COUNT -ne 1 ]]; then
            echo "ERROR: Multiple different yq checksums found!"
            echo "All checksums must match. Found:"
            grep -rn 'YQ_SHA256=' packaging/
            exit 1
          fi

          # Extract the checksum value
          YQ_SHA256=$(echo "$CHECKSUMS" | head -1 | cut -d'"' -f2)
          echo "Verifying checksum: $YQ_SHA256"

          # Download yq and verify
          YQ_VERSION=$(grep -oh 'YQ_VERSION="[0-9.]*"' packaging/build_nftban.sh | head -1 | cut -d'"' -f2)
          echo "yq version: $YQ_VERSION"

          curl -sL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq_linux_amd64
          ACTUAL_SHA=$(sha256sum /tmp/yq_linux_amd64 | cut -d' ' -f1)

          echo "Expected: $YQ_SHA256"
          echo "Actual:   $ACTUAL_SHA"

          if [[ "$YQ_SHA256" != "$ACTUAL_SHA" ]]; then
            echo "ERROR: yq checksum mismatch!"
            echo "The bundled checksum is outdated. Update with:"
            echo "  YQ_SHA256=\"$ACTUAL_SHA\""
            exit 1
          fi

          echo "✅ yq checksum validated successfully"

  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    needs: validate-dependencies
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la bin/

      - name: Validate binaries are real ELF files
        run: |
          echo "Validating Go binaries..."
          for binary in bin/nftban-core bin/nftband bin/nftban-installer; do
            if [[ -f "$binary" ]]; then
              file_type=$(file -b "$binary")
              if [[ "$file_type" != *"ELF"* ]]; then
                echo "ERROR: $binary is NOT an ELF binary!"
                echo "Got: $file_type"
                exit 1
              fi
              size=$(stat -c%s "$binary")
              if [[ $size -lt 100000 ]]; then
                echo "ERROR: $binary is too small ($size bytes) - likely corrupted"
                exit 1
              fi
              echo "✓ $binary: valid ELF ($size bytes)"
            else
              echo "ERROR: $binary not found!"
              exit 1
            fi
          done
          echo "All binaries validated successfully"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EL family (covers Rocky, Alma, RHEL, CentOS Stream)
          # Tier 0: el9 (primary/required)
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          # Tier 1: el10 (future/planned)
          - distro: el10
            container: almalinux:10
            name_suffix: el10
          # Note: Fedora removed - rolling release, not LTS

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # MFST-HOTFIX-B2: strict mode — surface rpmbuild failures to CI
            # instead of swallowing them. Mirror release.yml's pattern.
            set -euo pipefail

            # Install build dependencies (curl required for yq download)
            # Note: --allowerasing handles curl-minimal vs curl conflict on Rocky/Alma
            dnf -y install --allowerasing rpm-build rpmdevtools tar gzip systemd-rpm-macros make curl

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh rpm || { echo '❌ RPM build failed!'; exit 1; }

            # Verify at least one RPM was created (catches silent rpmbuild failures)
            if ! ls /workspace/build/packages/RPMS/*/*.rpm 2>/dev/null; then
              echo '❌ No RPM files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              # Rename: nftban-core-1.0.0-1.el10.x86_64.rpm -> nftban-el10-x86_64.rpm
              newname="nftban-${{ matrix.name_suffix }}-x86_64.rpm"
              cp "$rpm" "dist/packages/$newname"
              echo "Renamed: $(basename "$rpm") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate RPM package contains valid binaries
        run: |
          echo "Validating RPM package binaries..."
          for rpm in dist/packages/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Checking: $rpm"
              mkdir -p /tmp/rpm-check
              cd /tmp/rpm-check
              rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idmv 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-installer; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in RPM is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/rpm-check
            fi
          done
          echo "All RPM packages validated successfully"

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 0: Primary/Required
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12
          # Tier 1: Future/Planned
          - distro: debian13
            container: debian:trixie
            name_suffix: debian13
          # Tier 2: Legacy/Best-Effort
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # MFST-C6 / F-1: strict mode — surface dpkg-deb failures to CI
            # instead of swallowing them. Mirror RPM step pattern (post-#571).
            set -euo pipefail

            # Install build dependencies (curl required for yq download)
            for i in 1 2 3; do
              apt-get update && apt-get install -y dpkg-dev build-essential file curl && break
              echo \"Retry \$i: apt-get failed, retrying in 5s...\"
              sleep 5
            done

            # Build DEB
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh deb || { echo '❌ DEB build failed!'; exit 1; }

            # Verify at least one DEB was created (catches silent dpkg-deb failures)
            if ! ls /workspace/build/packages/*.deb 2>/dev/null; then
              echo '❌ No DEB files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              # Rename: nftban-core_1.0.0_amd64.deb -> nftban-ubuntu22.04-amd64.deb
              newname="nftban-${{ matrix.name_suffix }}-amd64.deb"
              cp "$deb" "dist/packages/$newname"
              echo "Renamed: $(basename "$deb") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate DEB package contains valid binaries
        run: |
          echo "Validating DEB package binaries..."
          for deb in dist/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Checking: $deb"
              mkdir -p /tmp/deb-check
              cd /tmp/deb-check
              ar x "$GITHUB_WORKSPACE/$deb"
              tar -xf data.tar.* 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-installer; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in DEB is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/deb-check
            fi
          done
          echo "All DEB packages validated successfully"

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

  # ==========================================================================
  # TEST INSTALLATION (RPM - CentOS Stream)
  # ==========================================================================
  test-rpm-install:
    name: Test RPM install (${{ matrix.distro }})
    needs: build-rpm
    runs-on: ubuntu-latest
    # Tier 0 distros (EL9) are required; Tier 1 (EL10) are advisory
    continue-on-error: ${{ matrix.tier != 0 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: centos-stream9
            container: quay.io/centos/centos:stream9
            rpm_artifact: rpm-el9
            tier: 0
          - distro: centos-stream10
            container: quay.io/centos/centos:stream10
            rpm_artifact: rpm-el10
            tier: 1
          - distro: rocky9
            container: rockylinux:9
            rpm_artifact: rpm-el9
            tier: 0
          - distro: alma9
            container: almalinux:9
            rpm_artifact: rpm-el9
            tier: 0

    steps:
      - name: Download RPM packages (with retry)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.rpm_artifact }}
          path: ./packages
        id: download
        continue-on-error: true

      - name: Retry artifact download if needed
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Artifact download failed - likely due to partial rerun"
          echo "Artifacts are only available when full workflow runs"
          echo "This is a known GitHub Actions limitation"
          exit 0

      - name: Test installation on ${{ matrix.distro }}
        if: steps.download.outcome == 'success'
        run: |
          docker run --rm -v $(pwd)/packages:/packages ${{ matrix.container }} bash -c '
            set -euo pipefail
            INSTALL_LOG=$(mktemp)

            echo "=== Phase 1: Package Installation ==="
            if dnf install -y --allowerasing /packages/*.rpm > "$INSTALL_LOG" 2>&1; then
              echo "[PASS] Package installed cleanly"
              INSTALL_CLEAN=true
            else
              INSTALL_EXIT=$?
              echo "[WARN] Package install exited $INSTALL_EXIT (postinst may have failed)"
              cat "$INSTALL_LOG"
              INSTALL_CLEAN=false
            fi

            echo "=== Phase 2: Artifact Validation (HARD FAIL) ==="
            echo -n "CLI wrapper exists: "
            test -x /usr/sbin/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "CLI runs: "
            /usr/sbin/nftban version && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Library dir exists: "
            test -d /usr/lib/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Config dir exists: "
            test -d /etc/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Systemd units installed: "
            ls /usr/lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 2b: Installer Binary (G5 — HARD FAIL) ==="
            echo -n "Installer binary exists: "
            test -x /usr/lib/nftban/bin/nftban-installer && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 3: Postinst Health (SOFT — expected to fail in Docker) ==="
            if [[ "$INSTALL_CLEAN" == "true" ]]; then
              echo "[INFO] Postinst succeeded — full install in container"
            else
              if grep -qE "nftables|nft:|RTNETLINK|Operation not permitted" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing nftables kernel (Docker limitation)"
              elif grep -qE "Failed to connect.*D-Bus|systemctl.*not found|Failed to.*service" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing systemd (Docker limitation)"
              else
                echo "[UNEXPECTED] Postinst failed for unknown reason — INVESTIGATE"
                cat "$INSTALL_LOG"
                exit 1
              fi
            fi

            echo "=== Phase 3b: Installer Log (G6 — SOFT) ==="
            if [[ -f /var/log/nftban/installer.log ]]; then
              tail -5 /var/log/nftban/installer.log || true
              grep -q "\[RUN\]" /var/log/nftban/installer.log && echo "[PASS] RUN marker" || echo "[WARN] No RUN marker"
              grep -q "state=" /var/log/nftban/installer.log && echo "[PASS] state marker" || echo "[WARN] No state marker"
            else
              echo "[EXPECTED] No installer.log (Docker has no systemd/nftables)"
            fi

            rm -f "$INSTALL_LOG"
            echo "=== Install test PASSED ==="
          '

  # ==========================================================================
  # TEST INSTALLATION (DEB)
  # ==========================================================================
  test-deb-install:
    name: Test DEB install (${{ matrix.distro }})
    needs: build-deb
    runs-on: ubuntu-latest
    # Tier 0 distros (Debian 12) are required; Tier 1 are advisory
    continue-on-error: ${{ matrix.tier != 0 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            deb_artifact: deb-ubuntu22.04
            tier: 1
          - distro: ubuntu24.04
            container: ubuntu:24.04
            deb_artifact: deb-ubuntu24.04
            tier: 0
          - distro: debian12
            container: debian:12
            deb_artifact: deb-debian12
            tier: 0
          - distro: debian13
            container: debian:trixie
            deb_artifact: deb-debian13
            tier: 1

    steps:
      - name: Download DEB packages (with retry)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.deb_artifact }}
          path: ./packages
        id: download
        continue-on-error: true

      - name: Retry artifact download if needed
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Artifact download failed - likely due to partial rerun"
          echo "Artifacts are only available when full workflow runs"
          echo "This is a known GitHub Actions limitation"
          exit 0

      - name: Test installation on ${{ matrix.distro }}
        if: steps.download.outcome == 'success'
        run: |
          docker run --rm -v $(pwd)/packages:/packages ${{ matrix.container }} bash -c '
            set -euo pipefail
            INSTALL_LOG=$(mktemp)

            echo "=== Phase 1: Package Installation ==="
            apt-get update -qq > /dev/null 2>&1
            if apt-get install -y /packages/*.deb > "$INSTALL_LOG" 2>&1; then
              echo "[PASS] Package installed cleanly"
              INSTALL_CLEAN=true
            else
              INSTALL_EXIT=$?
              echo "[WARN] Package install exited $INSTALL_EXIT (postinst may have failed)"
              cat "$INSTALL_LOG"
              INSTALL_CLEAN=false
            fi

            echo "=== Phase 2: Artifact Validation (HARD FAIL) ==="
            echo -n "CLI wrapper exists: "
            test -x /usr/sbin/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "CLI runs: "
            /usr/sbin/nftban version && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Library dir exists: "
            test -d /usr/lib/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Config dir exists: "
            test -d /etc/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Systemd units installed: "
            ls /lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              || ls /usr/lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 2b: Installer Binary (G5 — HARD FAIL) ==="
            echo -n "Installer binary exists: "
            test -x /usr/lib/nftban/bin/nftban-installer && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 3: Postinst Health (SOFT — expected to fail in Docker) ==="
            if [[ "$INSTALL_CLEAN" == "true" ]]; then
              echo "[INFO] Postinst succeeded — full install in container"
            else
              if grep -qE "nftables|nft:|RTNETLINK|Operation not permitted" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing nftables kernel (Docker limitation)"
              elif grep -qE "Failed to connect.*D-Bus|systemctl.*not found|Failed to.*service" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing systemd (Docker limitation)"
              else
                echo "[UNEXPECTED] Postinst failed for unknown reason — INVESTIGATE"
                cat "$INSTALL_LOG"
                exit 1
              fi
            fi

            echo "=== Phase 3b: Installer Log (G6 — SOFT) ==="
            if [[ -f /var/log/nftban/installer.log ]]; then
              tail -5 /var/log/nftban/installer.log || true
              grep -q "\[RUN\]" /var/log/nftban/installer.log && echo "[PASS] RUN marker" || echo "[WARN] No RUN marker"
              grep -q "state=" /var/log/nftban/installer.log && echo "[PASS] state marker" || echo "[WARN] No state marker"
            else
              echo "[EXPECTED] No installer.log (Docker has no systemd/nftables)"
            fi

            rm -f "$INSTALL_LOG"
            echo "=== Install test PASSED ==="
          '

  # ==========================================================================
  # CONSOLIDATE ALL PACKAGES
  # ==========================================================================
  consolidate-packages:
    name: Consolidate all packages
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: List all packages
        run: |
          echo "=== All packages built ==="
          find all-packages -name "*.rpm" -o -name "*.deb" | sort
          echo ""
          echo "=== Package counts ==="
          echo "DEB: $(find all-packages -name '*.deb' | wc -l)"
          echo "RPM: $(find all-packages -name '*.rpm' | wc -l)"

      - name: Generate package summary
        run: |
          echo "## Built Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RPM Packages (EL + Fedora)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for rpm in $(find all-packages -name "*.rpm" | sort); do
            name=$(basename "$rpm")
            echo "| $(dirname "$rpm" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DEB Packages (Ubuntu + Debian)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for deb in $(find all-packages -name "*.deb" | sort); do
            name=$(basename "$deb")
            echo "| $(dirname "$deb" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================================================
  # VALIDATE BINARY CONSISTENCY ACROSS ALL PACKAGES
  # ==========================================================================
  validate-binary-consistency:
    name: Validate binary consistency (RPM vs DEB)
    needs: [consolidate-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: Download source binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: source-binaries/

      - name: Validate all packages contain identical binaries
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "BINARY CONSISTENCY CHECK"
          echo "============================================================"
          echo ""

          # Get source binary hashes (the canonical reference)
          echo "=== Source Binary Hashes (Reference) ==="
          declare -A SOURCE_HASHES
          for binary in nftband nftban-core nftban-installer; do
            if [[ -f "source-binaries/$binary" ]]; then
              hash=$(sha256sum "source-binaries/$binary" | cut -d' ' -f1)
              SOURCE_HASHES[$binary]="$hash"
              size=$(stat -c%s "source-binaries/$binary")
              echo "  $binary: $hash ($size bytes)"
            fi
          done
          echo ""

          ERRORS=0
          PACKAGES_CHECKED=0

          # Extract and check all RPM packages
          echo "=== Checking RPM Packages ==="
          for rpm in $(find all-packages -name "*.rpm" | sort); do
            pkg_name=$(basename "$rpm")
            echo "  Checking: $pkg_name"

            mkdir -p /tmp/rpm-extract
            cd /tmp/rpm-extract
            rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idmv 2>/dev/null

            for binary in nftband nftban-core nftban-installer; do
              pkg_binary="usr/lib/nftban/bin/$binary"
              if [[ -f "$pkg_binary" ]]; then
                pkg_hash=$(sha256sum "$pkg_binary" | cut -d' ' -f1)
                pkg_size=$(stat -c%s "$pkg_binary")

                if [[ "${SOURCE_HASHES[$binary]:-}" != "$pkg_hash" ]]; then
                  echo "    ❌ MISMATCH: $binary"
                  echo "       Source:  ${SOURCE_HASHES[$binary]:-NOT_FOUND}"
                  echo "       Package: $pkg_hash ($pkg_size bytes)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "    ✓ $binary: matches source"
                fi
              fi
            done

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/rpm-extract
            PACKAGES_CHECKED=$((PACKAGES_CHECKED + 1))
          done
          echo ""

          # Extract and check all DEB packages
          echo "=== Checking DEB Packages ==="
          for deb in $(find all-packages -name "*.deb" | sort); do
            pkg_name=$(basename "$deb")
            echo "  Checking: $pkg_name"

            mkdir -p /tmp/deb-extract
            cd /tmp/deb-extract
            ar x "$GITHUB_WORKSPACE/$deb"
            tar -xf data.tar.* 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null || true

            for binary in nftband nftban-core nftban-installer; do
              pkg_binary="usr/lib/nftban/bin/$binary"
              if [[ -f "$pkg_binary" ]]; then
                pkg_hash=$(sha256sum "$pkg_binary" | cut -d' ' -f1)
                pkg_size=$(stat -c%s "$pkg_binary")

                if [[ "${SOURCE_HASHES[$binary]:-}" != "$pkg_hash" ]]; then
                  echo "    ❌ MISMATCH: $binary"
                  echo "       Source:  ${SOURCE_HASHES[$binary]:-NOT_FOUND}"
                  echo "       Package: $pkg_hash ($pkg_size bytes)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "    ✓ $binary: matches source"
                fi
              fi
            done

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/deb-extract
            PACKAGES_CHECKED=$((PACKAGES_CHECKED + 1))
          done
          echo ""

          # Summary
          echo "============================================================"
          echo "SUMMARY"
          echo "============================================================"
          echo "Packages checked: $PACKAGES_CHECKED"
          echo "Errors found: $ERRORS"
          echo ""

          if [[ $ERRORS -gt 0 ]]; then
            echo "❌ FATAL: Binary consistency check FAILED!"
            echo ""
            echo "Some packages contain binaries that don't match the source."
            echo "This indicates a serious build/packaging issue."
            echo ""
            echo "Root causes to check:"
            echo "  1. Go build cache contamination"
            echo "  2. Package build using wrong bin/ directory"
            echo "  3. Artifact download/upload race conditions"
            exit 1
          fi

          echo "✅ All packages contain identical binaries matching source"

      - name: Generate consistency report
        run: |
          echo "## Binary Consistency Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All RPM and DEB packages contain identical Go binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validated Binaries" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | SHA256 (first 16 chars) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------------|" >> $GITHUB_STEP_SUMMARY
          for binary in source-binaries/*; do
            name=$(basename "$binary")
            hash=$(sha256sum "$binary" | cut -c1-16)
            echo "| $name | \`$hash...\` |" >> $GITHUB_STEP_SUMMARY
          done

