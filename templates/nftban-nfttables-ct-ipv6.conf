# --- Connection Tracking Limits for IPv4 ---

# SSH: safe limits
#tcp dport 22 ct count over 5 drop
#tcp dport 22 ct state new limit rate 8/minute accept

# HTTP
#tcp dport 80 ct count over 75 drop
#tcp dport 80 ct state new limit rate 150/10 seconds accept

# HTTPS
#tcp dport 443 ct count over 150 drop
#tcp dport 443 ct state new limit rate 300/10 seconds accept

# DNS (optional if server provides DNS)
#udp dport 53 ct count over 45 drop
#udp dport 53 ct state new limit rate 75/10 seconds accept
