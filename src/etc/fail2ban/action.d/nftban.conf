# NFTBan Fail2ban Action
# Temporary bans via nftables timeout (no unban action needed)
#
# This action is called by Fail2ban when an IP should be banned.
# It passes the ban to NFTBan CLI which adds the IP to the runtime
# temp_ban set with the jail's configured bantime as the timeout.
#
# nftables automatically removes the IP after timeout expires.

[Definition]

# Nothing to do on jail start/stop
actionstart = :
actionstop  = :

# No check needed (we rely on nftables set membership)
actioncheck = :

# Ban action: add IP to temp_ban set with timeout
# <ip>      - IP address (IPv4 or IPv6)
# <bantime> - Duration from jail config (e.g., 3600 for 1h)
# <name>    - Jail name (e.g., sshd, http-auth)
actionban = /usr/sbin/nftban ban <ip> --temp --timeout <bantime> --source fail2ban --jail <name>
            /bin/bash -c 'echo "$(date "+%%Y-%%m-%%d %%H:%%M:%%S") - Jail: <name> - Banned IP: <ip> - Banned for: <bantime> seconds - Expires at: $(date -d "@$(( $(date +%%s) + <bantime> ))" "+%%Y-%%m-%%d %%H:%%M:%%S")" >> /var/log/nftban/fail2ban.log'

# NO actionunban - nftables timer handles automatic expiry!
# This is intentional and critical for the design.
# The log entry above enables persistent offender detection.

[Init]
# Reserved for future configuration options
