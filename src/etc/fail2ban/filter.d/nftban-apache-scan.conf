# Fail2ban filter for web reconnaissance and file enumeration attacks
# Detects multiple 403/404 responses in short time (scanning behavior)
#
# Author: NFTBan Project
# Date: 2025-10-30

[Definition]

# Exclude legitimate automated tasks from detection
# wp-cron.php is WordPress's scheduled task system
ignoreregex = "POST /wp-cron\.php.*"

# Match any GET or POST request resulting in 404 (Not Found) or 403 (Forbidden)
# This pattern indicates:
# - File enumeration attacks
# - Directory scanning
# - Vulnerability scanners
# - Automated probing
failregex = ^<HOST> .*"(?:GET|POST).*".*"(?:404|403)".*

[Init]
# Aggressive settings for scanning detection
# maxretry = 10  (10 failed requests)
# findtime = 60  (within 1 minute - rapid scanning)
# bantime = 3600 (1 hour)
