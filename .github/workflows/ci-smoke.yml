# =============================================================================
# NFTBan - CI: Smoke Test
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Minimal runtime validation — CLI runs, JSON output valid
# =============================================================================

name: Smoke Test

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cli/**'
      - 'cmd/**'
      - 'internal/**'
      - 'install/**'
      - 'packaging/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.25'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq libpam0g-dev

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Generate templ files
        run: $(go env GOPATH)/bin/templ generate

      - name: Build CLI binary
        run: go build -trimpath -o bin/nftban-core ./cmd/nftban-core/

      - name: Install shell components
        run: |
          # Minimal install — CLI scripts + config only (no systemd, no daemon)
          sudo mkdir -p /usr/lib/nftban/bin /usr/lib/nftban/cli /etc/nftban
          sudo cp bin/nftban-core /usr/lib/nftban/bin/
          sudo cp -r cli/lib/nftban/* /usr/lib/nftban/
          sudo cp cli/sbin/nftban /usr/sbin/nftban
          sudo chmod +x /usr/sbin/nftban /usr/lib/nftban/bin/nftban-core
          # Minimal config
          sudo cp -r etc/nftban/* /etc/nftban/ 2>/dev/null || true
          # VERSION file
          sudo cp VERSION /usr/lib/nftban/

      - name: Smoke test — version
        run: |
          # CLI may exit non-zero without daemon — check output, not exit code
          OUTPUT=$(nftban version 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "version" || { echo "::error::version produced no output"; exit 1; }

      - name: Smoke test — version JSON
        run: |
          # CLI wrapper appends "# NFTBAN_CMD_EXIT: ..." to stdout — strip before jq
          nftban version --json 2>/dev/null | grep -v '^#' > /tmp/version.json || true
          if [[ -s /tmp/version.json ]]; then
            if jq empty /tmp/version.json 2>/dev/null; then
              echo "✓ version --json: valid JSON"
              jq . /tmp/version.json
            else
              echo "::warning::version --json output is not valid JSON"
              cat /tmp/version.json
            fi
          else
            echo "[SKIP] version --json produced no output"
          fi

      - name: Smoke test — help
        run: |
          OUTPUT=$(nftban help 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "usage\|command\|help" || { echo "::error::help produced no output"; exit 1; }

      - name: Smoke test — fhs verify
        run: nftban fhs verify 2>&1 | head -20 || true

      - name: "G20 Smoke Gate — registry-driven smoke"
        run: |
          # Run Go registry-driven smoke. CI environment will SKIP daemon/module
          # checks (no systemd, no live daemon) — that's correct behavior.
          # FAIL on: runtime errors, contract violations, malformed output.
          SMOKE_OUTPUT=$(bin/nftban-core smoke --json 2>&1) || true
          echo "$SMOKE_OUTPUT"

          # Validate JSON parseable
          if ! echo "$SMOKE_OUTPUT" | jq empty 2>/dev/null; then
            echo "::error::G20 Smoke Gate: smoke --json output is not valid JSON"
            exit 1
          fi

          # Check for FAIL or INTERNAL_ERROR
          FAIL_COUNT=$(echo "$SMOKE_OUTPUT" | jq -r '.summary.fail // 0')
          if [ "$FAIL_COUNT" != "0" ]; then
            echo "::error::G20 Smoke Gate: $FAIL_COUNT test(s) FAILED"
            echo "$SMOKE_OUTPUT" | jq '.tests[] | select(.status == "FAIL")'
            exit 1
          fi

          PASS_COUNT=$(echo "$SMOKE_OUTPUT" | jq -r '.summary.pass // 0')
          SKIP_COUNT=$(echo "$SMOKE_OUTPUT" | jq -r '.summary.skip // 0')
          echo "G20 Smoke Gate: PASS ($PASS_COUNT pass, $SKIP_COUNT skip, 0 fail)"
