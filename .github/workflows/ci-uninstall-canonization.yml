# =============================================================================
# NFTBan — CI: Uninstall Canonization Gate (v1.100 PR-22 slice)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enforce v1.100 PR-22 scope lock:
#   G3-UN-PLAN-RENDERS   — dry-run output contains mandatory contract
#                          language (headers + fields + scope-boundary block)
#   G3-UN-NO-MUTATION    — structural grep on the uninstall package +
#                          dispatcher rejecting any mutation-flavored call
#
# Future sub-gates (G3-UN-5..17 + G3-UN-VERIFY) land in PR-23..PR-26.
# PR-22 ships only these two gates because that is the entire claim
# surface of the PR.
#
# Authorization basis: V1100_LIFECYCLE_COMPLETION_CONTRACT.md §13 frozen
# 2026-04-19.
# =============================================================================

name: Uninstall Canonization Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'cmd/nftban-installer/**'
      - 'internal/installer/uninstall/**'
      - 'internal/installer/state/**'
      - '.github/workflows/ci-uninstall-canonization.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-uninstall-canonization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uninstall-canonization:
    name: Uninstall Canonization (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            runner: ubuntu-24.04
            container: ''
          - label: almalinux-9
            runner: ubuntu-24.04
            container: almalinux:9
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies (DEB)
        if: matrix.label == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables jq strace

      - name: Install system dependencies (RPM)
        if: matrix.label == 'almalinux-9'
        run: |
          dnf -y install epel-release
          dnf -y install nftables jq git tar gzip procps-ng findutils sudo golang strace

      - name: Set up Go (DEB only)
        if: matrix.label == 'ubuntu-24.04'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.11`).
          # GOTOOLCHAIN=local intentionally NOT set here: the RPM matrix legs
          # build with dnf-installed Go (not this step), whose patch may differ.
          go-version: '1.25.11'

      # ------------------------------------------------------------------
      # G3-UN-NO-MUTATION — structural grep on the uninstall package +
      # dispatcher rejecting mutation-flavored Go calls. This is the PR-22
      # scope-lock enforcement: if any commit introduces kernel mutation,
      # service lifecycle, filesystem writes under protected paths, or
      # external-firewall touches into the uninstall code, CI fails BEFORE
      # the unit tests even run.
      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # G3-UN-SHIM-LOCK (PR-P2-5) — lifecycle transition safety lock.
      #
      # The `flags.go` auto-elevate shim silently forces --dry-run when
      # `--mode=uninstall` is invoked without an explicit --dry-run.
      # This is correct ONLY during PR-22's scaffold era, when no
      # mutation code exists in the uninstall package. The moment
      # real mutation code lands (PR-23 Switch phase / authority
      # release), the shim MUST be removed or converted to an explicit
      # refusal. Leaving both in place teaches operators "--mode=
      # uninstall is safe by default" right up until a silent semantic
      # flip to mutation — the exact UX-drift attack the contract
      # warns against.
      #
      # This gate fires BEFORE tests so any reviewer sees the coupling
      # immediately. The rule:
      #
      #   shim_present  ∧  mutation_present  →  FAIL
      #   shim_present  ∧ ¬mutation_present  →  PASS (PR-22 scaffold state)
      #  ¬shim_present  ∧  mutation_present  →  PASS (post-PR-23, shim removed)
      #  ¬shim_present  ∧ ¬mutation_present  →  PASS (trivial)
      #
      # Contract: internal/installer/uninstall/contract.md
      #           §"Audit C regression note" and §"Pre-PR-23 blockers"
      # ------------------------------------------------------------------
      - name: G3-UN-SHIM-LOCK — auto-elevate shim may not coexist with uninstall mutation
        shell: bash
        run: |
          set -Eeuo pipefail

          # Part 1 — shim presence signature. Two independent markers,
          # both introduced by PR-22's flags.go block. Presence of
          # EITHER is sufficient — this ensures trivial renames don't
          # accidentally hide the shim from the gate.
          shim_present=0
          if grep -qE 'auto-elevated to --dry-run' cmd/nftban-installer/flags.go 2>/dev/null; then
            shim_present=1
          fi
          if grep -qE 'NO MUTATION WILL OCCUR \(v1\.100 PR-22 scope\)' cmd/nftban-installer/flags.go 2>/dev/null; then
            shim_present=1
          fi

          # Part 2 — mutation presence in the uninstall scope. Scope is
          # the uninstall package + the uninstall dispatcher, Go files
          # only, excluding tests (which may contain mutation strings
          # as fixtures).
          mutation_scope_files=$(find \
            internal/installer/uninstall \
            cmd/nftban-installer/uninstall_dryrun.go \
            -type f -name '*.go' 2>/dev/null | grep -vE '_test\.go$' || true)

          # Mutation-flavored patterns. Each targets a specific kernel /
          # service / filesystem / external-firewall write path. Match
          # any = mutation code has landed.
          mutation_patterns=(
              'exec\.Run\("nft"[^)]*add'
              'exec\.Run\("nft"[^)]*create'
              'exec\.Run\("nft"[^)]*delete'
              'exec\.Run\("nft"[^)]*flush'
              'exec\.Run\("systemctl"[^)]*stop'
              'exec\.Run\("systemctl"[^)]*start'
              'exec\.Run\("systemctl"[^)]*restart'
              'exec\.Run\("systemctl"[^)]*reload'
              'exec\.Run\("systemctl"[^)]*enable'
              'exec\.Run\("systemctl"[^)]*disable'
              'exec\.Run\("systemctl"[^)]*mask'
              'exec\.Run\("systemctl"[^)]*unmask'
              'exec\.ServiceStop\('
              'exec\.ServiceStart\('
              'exec\.ServiceEnable\('
              'exec\.ServiceDisable\('
              'exec\.ServiceMask\('
              'exec\.ServiceUnmask\('
              'exec\.Run\("ufw"'
              'exec\.Run\("firewall-cmd"'
              'exec\.Run\("iptables-restore"'
              'exec\.WriteFileAtomic\('
              'os\.WriteFile\('
              'os\.Create\('
              'os\.Remove\('
              'os\.RemoveAll\('
              'os\.MkdirAll\('
              'os\.Rename\('
              'sf\.Transition\('
          )
          mutation_present=0
          if [[ -n "$mutation_scope_files" ]]; then
            for pat in "${mutation_patterns[@]}"; do
              if grep -nE "$pat" $mutation_scope_files 2>/dev/null; then
                mutation_present=1
              fi
            done
          fi

          echo "G3-UN-SHIM-LOCK state: shim_present=$shim_present mutation_present=$mutation_present"

          # Gate rule: the coupling is the failure.
          if [[ "$shim_present" -eq 1 && "$mutation_present" -eq 1 ]]; then
            echo "::error::G3-UN-SHIM-LOCK FAIL: uninstall mutation code present AND auto-elevate shim still exists in cmd/nftban-installer/flags.go"
            echo "::error::The shim must be REMOVED or CONVERTED TO REFUSAL before any mutation code lands in internal/installer/uninstall/."
            echo "::error::See internal/installer/uninstall/contract.md §'Audit C regression note' for the two acceptable remediations."
            exit 1
          fi

          if [[ "$mutation_present" -eq 1 ]]; then
            echo "G3-UN-SHIM-LOCK PASS — uninstall mutation has landed AND shim was correctly removed (post-PR-23 state)"
          elif [[ "$shim_present" -eq 1 ]]; then
            echo "G3-UN-SHIM-LOCK PASS — no uninstall mutation yet; auto-elevate shim allowed during PR-22/P2-x scaffold era"
          else
            echo "G3-UN-SHIM-LOCK PASS — neither shim nor uninstall mutation present"
          fi

      - name: G3-UN-NO-MUTATION — structural audit of uninstall observational scope
        shell: bash
        run: |
          set -Eeuo pipefail
          # Narrow search scope to the OBSERVATIONAL uninstall surface.
          #
          # PR-23 introduced the one legitimate uninstall mutation path
          # (internal/installer/uninstall/apply.go — the authority
          # release orchestrator). That file is explicitly excluded
          # from this grep scope because it MUST contain the kernel +
          # service mutation calls the release sequence performs.
          #
          # v1.100.4 (UPSTREAM-UNINSTALL-INCOMPLETE-001) added
          # internal/installer/uninstall/artifacts.go as the
          # filesystem-cleanup counterpart of payload.StageAll —
          # symmetric mutation by contract, also excluded from this
          # structural audit. Its safety boundary is enforced inside
          # the file (paths bounded to payload.Destinations() +
          # explicit runtime list) rather than by absence of mutation
          # syscalls.
          #
          # G3-UN-SHIM-LOCK (separate gate in this workflow) is the
          # invariant that ensures apply.go's mutation cannot coexist
          # with the auto-elevate shim. G3-EXEC-TRACE (all 3 workflows)
          # catches forbidden mutators at the dry-run path's syscall
          # layer. Together those three gates cover the "no mutation
          # during dry-run + mutation only in the sanctioned apply
          # file" contract.
          files=$(find \
            internal/installer/uninstall \
            cmd/nftban-installer/uninstall_dryrun.go \
            -type f -name '*.go' 2>/dev/null | grep -vE '/(apply|artifacts)\.go$' || true)
          if [[ -z "$files" ]]; then
            echo "::error::G3-UN-NO-MUTATION: uninstall scope files not found"
            exit 1
          fi
          fail=0
          # PR-22A audit fix: the original grep missed os.WriteFile /
          # os.Create / os.MkdirAll / os.Rename, which is exactly how
          # the uninstall_plan.json write slipped past PR-22 review.
          # Direct os.* filesystem writers are now enumerated here.
          for pat in \
              'exec\.Run\("nft"[^)]*add' \
              'exec\.Run\("nft"[^)]*flush' \
              'exec\.Run\("nft"[^)]*delete' \
              'exec\.Run\("nft"[^)]*create' \
              'exec\.Run\("systemctl"[^)]*stop' \
              'exec\.Run\("systemctl"[^)]*start' \
              'exec\.Run\("systemctl"[^)]*restart' \
              'exec\.Run\("systemctl"[^)]*reload' \
              'exec\.Run\("systemctl"[^)]*enable' \
              'exec\.Run\("systemctl"[^)]*disable' \
              'exec\.Run\("systemctl"[^)]*mask' \
              'exec\.Run\("systemctl"[^)]*unmask' \
              'exec\.Run\("ufw"' \
              'exec\.Run\("iptables"[^-]' \
              'exec\.Run\("csf"' \
              'exec\.Run\("apt-get"[^)]*remove' \
              'exec\.Run\("apt-get"[^)]*purge' \
              'exec\.Run\("dnf"[^)]*remove' \
              'exec\.Run\("dnf"[^)]*erase' \
              'exec\.WriteFileAtomic\(' \
              'os\.WriteFile\(' \
              'os\.Create\(' \
              'os\.MkdirAll\(' \
              'os\.Mkdir\(' \
              'os\.Rename\(' \
              'os\.Remove\(' \
              'os\.RemoveAll\(' \
              'sf\.Transition\('; do
            # Note: ".conf.local" is NOT in this list — the contract
            # language in plan.go + contract.md LEGITIMATELY mentions
            # .conf.local when describing the §4.4 artifact policy.
            # The mutation danger is write/delete operations, which
            # the os.*/exec.WriteFileAtomic patterns above cover
            # regardless of which file they target.
            #
            # sf.Transition is forbidden in PR-22 scope because it
            # persists install_state under /var/lib/nftban/state. PR-22
            # is observational only — no state transitions during
            # dry-run.
            if grep -nE "$pat" $files 2>/dev/null; then
              echo "::error::G3-UN-NO-MUTATION FAIL: forbidden pattern '$pat' in PR-22 uninstall scope"
              fail=1
            fi
          done
          if (( fail > 0 )); then
            echo "::error::PR-22 contract violation — uninstall code contains mutation-flavored calls"
            exit 1
          fi
          echo "G3-UN-NO-MUTATION PASS — no mutation-flavored call detected in PR-22 scope"

      # ------------------------------------------------------------------
      # Unit tests — exercise BuildPlan rendering + classifier + probe.
      # The structural no-mutation grep above already ran, so if Go code
      # somehow bypassed the grep (unlikely), unit tests are the second
      # line of defence.
      # ------------------------------------------------------------------
      - name: Unit tests — internal/installer/uninstall
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -v ./internal/installer/uninstall/...

      # PR-22A boundary repair: the orchestrator-level purity test lives
      # in cmd/nftban-installer/uninstall_dryrun_test.go. It falsifies
      # the "no mutation" claim directly by calling runUninstallDryRun
      # with a MockExecutor + real tempdir and asserting zero writes,
      # zero directory creates, and zero mutation-flavored commands.
      - name: Unit tests — runUninstallDryRun purity (R4)
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -v -run 'TestRunUninstallDryRun_' ./cmd/nftban-installer/...

      # ------------------------------------------------------------------
      # Build the installer binary so we can exercise end-to-end.
      # ------------------------------------------------------------------
      - name: Build nftban-installer
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin
          go build -trimpath -o bin/nftban-installer ./cmd/nftban-installer/
          test -x bin/nftban-installer

      - name: Prepare minimal host state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo install -d /var/lib/nftban/state

      # ------------------------------------------------------------------
      # G3-UN-PLAN-RENDERS — end-to-end dry-run produces the mandatory
      # contract-language output. The unit tests already verified the
      # Render function in isolation; this confirms the dispatcher path
      # wires it up correctly.
      # ------------------------------------------------------------------
      - name: G3-UN-PLAN-RENDERS — dry-run emits contract language
        shell: bash
        run: |
          set -Eeuo pipefail
          # PR-22A boundary repair: snapshot /var/lib/nftban/ truth
          # surfaces BEFORE the dry-run. After the dry-run, the snapshot
          # must be byte-identical. Any difference is a PR-22 contract
          # Stop Condition violation.
          before_varlib=$(find /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          before_etcnftban=$(find /etc/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          # PR-P2-3 (G3-KS-SNAPSHOT): capture kernel nft tables +
          # firewall-adjacent service states BEFORE the dry-run so we
          # can hard-assert they remain byte-identical afterward.
          # Filesystem snapshot alone (above) misses a regression that
          # mutates kernel tables or service states without touching
          # tracked files — exactly the class of drift this gate closes.
          before_ks=$(bash scripts/ci-snapshot-kernel-service.sh)
          # PR-P2-4 (G3-EXEC-TRACE): wrap the dry-run under strace.
          # Uninstall is the most scope-sensitive mode — verifying that
          # no mutation process ever spawns during dry-run is the
          # strongest proof that PR-23's future mutation code will be
          # the ONLY mutation surface.
          set +e
          sudo bash scripts/ci-exec-trace-assert.sh \
              ./bin/nftban-installer --mode=uninstall --dry-run \
              --state-dir=/var/lib/nftban/state 2>&1 | tee /tmp/uninstall-dryrun.out
          rc=${PIPESTATUS[0]}
          set -e
          echo "dry-run exit code: $rc"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::uninstall dry-run must exit 0 even on a host with no firewall authority"
            exit 1
          fi
          after_varlib=$(find /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          after_etcnftban=$(find /etc/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          after_ks=$(bash scripts/ci-snapshot-kernel-service.sh)
          if [[ "$before_varlib" != "$after_varlib" ]]; then
            echo "::error::PR-22 Stop Condition violated — uninstall dry-run modified /var/lib/nftban/"
            diff <(echo "$before_varlib") <(echo "$after_varlib") || true
            exit 1
          fi
          if [[ "$before_etcnftban" != "$after_etcnftban" ]]; then
            echo "::error::PR-22 Stop Condition violated — uninstall dry-run modified /etc/nftban/"
            diff <(echo "$before_etcnftban") <(echo "$after_etcnftban") || true
            exit 1
          fi
          # PR-P2-3 hard assertion — no `|| true` on the diff check.
          if [[ "$before_ks" != "$after_ks" ]]; then
            echo "::error::G3-KS-SNAPSHOT FAIL: kernel or service state changed during uninstall --dry-run"
            diff <(echo "$before_ks") <(echo "$after_ks") || true
            exit 1
          fi
          echo "G3-UN-NO-WRITES PASS — /var/lib/nftban, /etc/nftban, kernel, and service state all unchanged after dry-run"
          # Mandatory contract-language elements — each one corresponds
          # to a row PR-22 promised to render.
          for needle in \
              "NFTBan Uninstall — Plan" \
              "Requested mode" \
              "Artifact policy" \
              "Current authority" \
              "Target authority" \
              "Restore requested" \
              "Restore authorized" \
              "Prior-authority record" \
              "Phases that would mutate (NOT IMPLEMENTED in PR-22):" \
              "Scope boundary:" \
              "Running this command does NOT uninstall nftban"; do
            if ! grep -q "$needle" /tmp/uninstall-dryrun.out; then
              echo "::error::G3-UN-PLAN-RENDERS FAIL: missing mandatory contract-language element: $needle"
              exit 1
            fi
          done
          echo "G3-UN-PLAN-RENDERS PASS — all mandatory contract-language elements present"

      # ------------------------------------------------------------------
      # G3-UN-CONSENT-REQUIRED (PR-23) — --mode=uninstall with NEITHER
      # --dry-run NOR --confirm-mutation must REFUSE explicitly (exit
      # non-zero) and touch NOTHING. This replaces the PR-22-era
      # "auto-elevate" gate: the shim was removed in PR-23, and the
      # correct post-PR-23 behaviour for this bare invocation is a
      # hard refusal.
      # ------------------------------------------------------------------
      - name: G3-UN-CONSENT-REQUIRED — --mode=uninstall without consent flag refuses
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(find /etc/nftban /usr/lib/nftban /usr/sbin/nftban* /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          set +e
          out=$(sudo ./bin/nftban-installer --mode=uninstall \
              --state-dir=/var/lib/nftban/state 2>&1)
          rc=$?
          set -e
          echo "$out"
          after=$(find /etc/nftban /usr/lib/nftban /usr/sbin/nftban* /var/lib/nftban -type f 2>/dev/null | sort | xargs -r sha256sum 2>/dev/null | sort || true)
          if [[ "$before" != "$after" ]]; then
            echo "::error::G3-UN-CONSENT-REQUIRED FAIL — refused run touched protected filesystem"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          if [[ "$rc" -eq 0 ]]; then
            echo "::error::G3-UN-CONSENT-REQUIRED FAIL — bare --mode=uninstall exited 0, must REFUSE"
            exit 1
          fi
          if ! echo "$out" | grep -qE "requires exactly one of --dry-run OR --confirm-mutation"; then
            echo "::error::G3-UN-CONSENT-REQUIRED FAIL — refusal message did not mention the two-flag choice"
            exit 1
          fi
          echo "G3-UN-CONSENT-REQUIRED PASS — bare --mode=uninstall refused cleanly, no filesystem changes"

      # ------------------------------------------------------------------
      # G3-UN-CONSENT-BOTH-FLAGS (PR-23) — --mode=uninstall with BOTH
      # --dry-run AND --confirm-mutation must also refuse. The two
      # flags are semantically incompatible; accepting both would be
      # a silent contract drift.
      # ------------------------------------------------------------------
      - name: G3-UN-CONSENT-BOTH-FLAGS — --dry-run + --confirm-mutation refuses
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          out=$(sudo ./bin/nftban-installer --mode=uninstall --dry-run --confirm-mutation \
              --state-dir=/var/lib/nftban/state 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [[ "$rc" -eq 0 ]]; then
            echo "::error::G3-UN-CONSENT-BOTH-FLAGS FAIL — passing both flags exited 0, must REFUSE"
            exit 1
          fi
          if ! echo "$out" | grep -qE "mutually exclusive"; then
            echo "::error::G3-UN-CONSENT-BOTH-FLAGS FAIL — refusal message did not mention mutual exclusion"
            exit 1
          fi
          echo "G3-UN-CONSENT-BOTH-FLAGS PASS — both-flag combination refused"

      # ------------------------------------------------------------------
      # G3-UN-HISTORY-PURITY — regression guard for audit finding A.3.
      # Seeds a realistic update-history.json, runs the dry-run twice
      # (explicit + implicit), then asserts the history file is byte-
      # identical. Before PR-22A, each dry-run appended an install_fail
      # entry here.
      # ------------------------------------------------------------------
      - name: G3-UN-HISTORY-PURITY — history file unchanged by dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          hist=/var/lib/nftban/update-history.json
          sudo mkdir -p /var/lib/nftban
          echo '{"schema_version":"1.0","entries":[{"from":"1.99.0","to":"1.100.0","status":"success","type":"rpm","duration":1,"hostname":"ci","timestamp":"2026-04-19T00:00:00Z"}]}' | sudo tee "$hist" >/dev/null
          before_hash=$(sha256sum "$hist" | awk '{print $1}')
          sudo ./bin/nftban-installer --mode=uninstall --dry-run --state-dir=/var/lib/nftban/state >/dev/null 2>&1 || true
          sudo ./bin/nftban-installer --mode=uninstall --state-dir=/var/lib/nftban/state >/dev/null 2>&1 || true
          after_hash=$(sha256sum "$hist" | awk '{print $1}')
          if [[ "$before_hash" != "$after_hash" ]]; then
            echo "::error::G3-UN-HISTORY-PURITY FAIL — uninstall dry-run modified update-history.json"
            echo "before: $before_hash"
            echo "after:  $after_hash"
            cat "$hist"
            exit 1
          fi
          echo "G3-UN-HISTORY-PURITY PASS — update-history.json byte-identical after 2 dry-runs"

  summary:
    name: Uninstall Canonization summary
    needs: uninstall-canonization
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          if [[ "${{ needs.uninstall-canonization.result }}" != "success" ]]; then
            echo "::error::Uninstall Canonization Gate FAILED — see matrix job output"
            exit 1
          fi
          echo "Uninstall Canonization Gate PASSED on all matrix targets"
