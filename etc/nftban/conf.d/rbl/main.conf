# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/rbl/main.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# **Description**
# Configure automated RBL checking to monitor if server IPs are blacklisted
# for spam, abuse, or malicious activity. Based on CSF RBL implementation.
#
# **Cache Location**
# Cache files stored in: /var/cache/nftban/rbl/{IP}.cache
# =============================================================================

# Enable/disable RBL monitoring
# Note: RBL checking is monitoring only - it does not make any firewall changes.
# Safe to enable; it simply checks if your IPs appear on blacklists.
NFTBAN_RBL_ENABLED="NO"

# Monitoring schedule (via systemd timer)
# Options: 12hours (every 12 hours), daily, hourly, disabled
NFTBAN_RBL_SCHEDULE="daily"
NFTBAN_RBL_SCHEDULE_TIME="02:00"  # For daily (02:00 AM)

# Alert email address
NFTBAN_RBL_ALERT_EMAIL=""

# Alert triggers
NFTBAN_RBL_ALERT_ON_NEW_LISTING="YES"  # Alert when IP newly listed
NFTBAN_RBL_ALERT_ON_DEGRADED="NO"      # Alert when many RBLs timeout

# DNS timeout per RBL query (seconds)
NFTBAN_RBL_TIMEOUT="4"

# Cache TTL (hours) - how long to cache results
NFTBAN_RBL_CACHE_TTL="24"

# Auto-discover public IPs from network interfaces?
NFTBAN_RBL_AUTO_DISCOVER_IPS="YES"

# Check IPv6 addresses (in addition to IPv4)?
NFTBAN_RBL_CHECK_IPV6="YES"

# Critical IPs to monitor (comma-separated)
# Tag format: IP:tag (e.g., "1.2.3.4:mail,5.6.7.8:web")
NFTBAN_RBL_CRITICAL_IPS=""

# Example:
# NFTBAN_RBL_CRITICAL_IPS="203.0.113.10:mail,203.0.113.20:web,203.0.113.30:panel"

# Severity by tag (affects alert priority)
NFTBAN_RBL_SEVERITY_MAIL="critical"    # Mail server IPs
NFTBAN_RBL_SEVERITY_WEB="high"         # Web server IPs
NFTBAN_RBL_SEVERITY_PANEL="high"       # Control panel IPs
NFTBAN_RBL_SEVERITY_DEFAULT="medium"   # Other IPs

# Cache directory (default: /var/cache/nftban/rbl)
# v1.150 (11.4): canonicalized to /var/cache (cache belongs under /var/cache,
# not /var/log) to match the code default in nftban_rbl.sh
# (NFTBAN_RBL_CACHE_DIR=${NFTBAN_CACHE_DIR:-/var/cache/nftban}/rbl). The two
# defaults previously diverged, splitting cache/state across two trees.
NFTBAN_RBL_CACHE_DIR="${NFTBAN_CACHE_DIR:-/var/cache/nftban}/rbl"

# RBL providers list file
NFTBAN_RBL_PROVIDERS_FILE="${NFTBAN_CONFIG_DIR}/conf.d/rbl/rbls.conf"

# Custom RBL configuration (enable/disable specific RBLs/IPs)
NFTBAN_RBL_CUSTOM_FILE="${NFTBAN_CONFIG_DIR}/conf.d/rbl/custom.conf"
