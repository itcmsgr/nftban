# =============================================================================
#
# DETECTION POLICY
# ================
# These toggles control which Suricata alert CATEGORIES NFTBan processes.
# Disabled categories are filtered out — alerts are still logged by Suricata
# but NFTBan does not act on them.
#
# This controls NFTBan's response, NOT Suricata's detection behavior.
# Suricata always runs its full ruleset regardless of these settings.
#
# To customize: copy to detection.conf.local and edit.
# =============================================================================

# --- Authentication attacks ---
DETECT_SSH_BRUTEFORCE="true"
DETECT_AUTH_BYPASS="true"

# --- Network attacks ---
DETECT_PORTSCAN="true"
DETECT_DDOS="true"

# --- Web application attacks ---
DETECT_WEB_ATTACKS="true"
DETECT_SQLI="true"
DETECT_XSS="false"

# --- Exploit / RCE ---
DETECT_EXPLOIT="true"
DETECT_RCE="true"

# --- Malware / C2 ---
DETECT_MALWARE="false"
DETECT_C2="false"

# --- Information leak ---
DETECT_INFO_LEAK="false"

# --- Policy violations ---
DETECT_POLICY="false"
