# meta:inventory.config_files=""
# meta:inventory.systemd_units="nftband.service,nftban-health.service,nftban-metrics-exporter.service,nftban-ui.service"
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# meta:created_date="2026-01-10"
# meta:updated_date="2026-01-10"
#
# This file defines the expected Linux capabilities for each systemd service.
# It is used by CI validation and receipt-based auditing.
#
# Format: SERVICE_NAME=CAP1 CAP2 CAP3
# Services without entries have no capability restrictions.
#
# Capability Reference:
# - CAP_NET_ADMIN: Modify nftables rules (firewalling)
# - CAP_DAC_OVERRIDE: Bypass file permission checks (write to nftban dirs as root)
#
# Architecture Note (2026 Contract):
# - /var/lib/nftban is root:nftban 0750 (security boundary)
# - Subdirectories are nftban:nftban (daemon-writable)
# - Services running as root with capability restrictions need CAP_DAC_OVERRIDE
#   to write to nftban-owned subdirectories
# - Services running as User=nftban do NOT need CAP_DAC_OVERRIDE
# =============================================================================

# Core daemon - runs as root, needs CAP_DAC_OVERRIDE for stats/metrics
nftband=CAP_NET_ADMIN CAP_DAC_OVERRIDE

# Health service - runs as nftban user, only needs CAP_NET_ADMIN for nft queries
nftban-health=CAP_NET_ADMIN

# Metrics exporter - runs as nftban user, only needs CAP_NET_ADMIN for nft queries
nftban-metrics-exporter=CAP_NET_ADMIN

# UI service - partial capability restriction (CAP_NET_ADMIN only documented)
nftban-ui=CAP_NET_ADMIN
