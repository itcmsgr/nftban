# =============================================================================
# NFTBAN LOGGING CONFIGURATION
# =============================================================================
# Version: 0.30.0
# Purpose: All logging-related settings
# Loaded by: nftban core during initialization
# Referenced from: /etc/nftban/nftban.conf (NFTBAN_DEBUG_MODE)
#
# To customize logging settings:
#   Add overrides to /etc/nftban/nftban.conf.local
#
# Example overrides in nftban.conf.local:
#   NFTBAN_DEBUG_MODE="true"
#   NFTBAN_DEBUG_LOG_LEVEL="DEBUG"
#   NFTBAN_LOG_RETENTION_DAYS="60"
# =============================================================================

# =============================================================================
# LOG FILES (FHS-compliant paths)
# =============================================================================

# Main application log (human-readable, INFO level and above)
# Used by: All modules for standard logging
# Format: [YYYY-MM-DD HH:MM:SS] [LEVEL] [module] message
NFTBAN_LOG_FILE="/var/log/nftban/nftban.log"

# Structured events log (JSONL format)
# Used by: All modules for machine-readable event logging
# Format: {"ts":"2025-10-26T12:00:00Z","level":"info","tool":"feeds","action":"update","status":"ok"}
NFTBAN_EVENTS_LOG="/var/log/nftban/events.jsonl"

# Debug log (only written when NFTBAN_DEBUG_MODE=true)
# Used by: All modules when debug mode is enabled
# Format: [YYYY-MM-DD HH:MM:SS] [DEBUG] [module:function:line] detailed message
NFTBAN_DEBUG_FILE="/var/log/nftban/nftban_debug.log"

# Cron/timer wrapper output log
# Used by: Systemd timer jobs and cron wrappers
# Format: [YYYY-MM-DD HH:MM:SS] cron output
NFTBAN_CRON_LOG="/var/log/nftban/cron.log"

# AI module audit trail (if AI module is enabled)
# Used by: AI module for decision tracking and audit
# Format: JSONL with AI decisions and reasoning
NFTBAN_AI_LOG="/var/log/nftban/ai.log"

# =============================================================================
# LOG LEVELS
# =============================================================================

# Main log level for nftban.log
# Values: DEBUG, INFO, WARN, ERROR
# - DEBUG: All messages (very verbose)
# - INFO:  Informational messages and above (default)
# - WARN:  Warnings and errors only
# - ERROR: Errors only
NFTBAN_DEBUG_LOG_LEVEL="INFO"

# CLI log level (when nftban run from command line)
# Typically more verbose than daemon
NFTBAN_CLI_LOG_LEVEL="INFO"

# Daemon log level (when nftband daemon is running)
# Typically less verbose than CLI
NFTBAN_DAEMON_LOG_LEVEL="WARN"

# =============================================================================
# LOG ROTATION
# =============================================================================

# Maximum log file size before rotation
# Format: <number>M (megabytes) or <number>G (gigabytes)
# Examples: "10M", "100M", "1G"
NFTBAN_LOG_MAX_SIZE="10M"

# Number of rotated log files to keep
# Example: 5 means keep nftban.log.1 through nftban.log.5
NFTBAN_LOG_ROTATION_COUNT="5"

# Number of days to retain logs
# Old logs are deleted after this many days
NFTBAN_LOG_RETENTION_DAYS="30"

# Compress rotated logs (gzip)
# Values: "true" or "false"
# Compressed logs: nftban.log.1.gz, nftban.log.2.gz, etc.
NFTBAN_LOG_COMPRESS="true"

# Compression delay (days)
# Delay compression for this many days (0 = compress immediately)
NFTBAN_LOG_COMPRESS_DELAY="1"

# =============================================================================
# LOG FORMATTING
# =============================================================================

# Include timestamps in log messages
# Values: "true" or "false"
NFTBAN_LOG_TIMESTAMPS="true"

# Timestamp format (strftime format string)
# Default: ISO 8601 format
# Examples:
#   "%Y-%m-%d %H:%M:%S"          → 2025-10-26 19:30:45
#   "%Y-%m-%dT%H:%M:%S%z"        → 2025-10-26T19:30:45+0000
#   "%b %d %H:%M:%S"             → Oct 26 19:30:45
NFTBAN_LOG_TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"

# Include hostname in log messages
# Values: "true" or "false"
# Useful when aggregating logs from multiple servers
NFTBAN_LOG_HOSTNAME="true"

# Include process ID (PID) in log messages
# Values: "true" or "false"
# Useful for debugging multi-process scenarios
NFTBAN_LOG_PID="true"

# Include log level in messages
# Values: "true" or "false"
NFTBAN_LOG_LEVEL_PREFIX="true"

# Colorize log output (for interactive CLI use)
# Values: "true" or "false"
# Automatically disabled when output is not a terminal
NFTBAN_LOG_COLORS="true"

# =============================================================================
# STRUCTURED LOGGING (JSONL)
# =============================================================================

# Enable structured event logging to events.jsonl
# Values: "true" or "false"
NFTBAN_EVENTS_ENABLED="true"

# Fields to include in JSONL event records
# Comma-separated list
# Available fields: ts, level, tool, action, status, duration_ms, output, error, user, ip
NFTBAN_EVENTS_FIELDS="ts,level,tool,action,status,duration_ms,output"

# Include full stack trace in error events
# Values: "true" or "false"
NFTBAN_EVENTS_STACK_TRACE="false"

# =============================================================================
# DEBUG MODE
# =============================================================================
# Note: Debug mode is controlled by NFTBAN_DEBUG_MODE in nftban.conf
#
# When NFTBAN_DEBUG_MODE="true":
#   - Log level automatically set to DEBUG
#   - Writes to NFTBAN_DEBUG_FILE in addition to main log
#   - Logs module load/unload events
#   - Traces function entry/exit (if NFTBAN_TRACE_MODE=true)
#   - Logs variable values at key points
# =============================================================================

# Enable debug output for specific modules only
# Comma-separated list of module names
# Example: "feeds,fail2ban,geoip"
# Empty = debug all modules when DEBUG_MODE=true
NFTBAN_DEBUG_MODULES=""

# Enable trace mode (extremely verbose - function call tracing)
# Values: "true" or "false"
# ⚠️  WARNING: Generates massive logs! Use only for deep debugging.
NFTBAN_TRACE_MODE="false"

# Log function entry/exit
# Values: "true" or "false"
# Requires: NFTBAN_DEBUG_MODE="true"
NFTBAN_LOG_FUNCTION_TRACE="false"

# Log variable dumps at key points
# Values: "true" or "false"
# Requires: NFTBAN_DEBUG_MODE="true"
NFTBAN_LOG_VARIABLE_DUMP="false"

# =============================================================================
# SYSLOG INTEGRATION (OPTIONAL)
# =============================================================================

# Send logs to syslog in addition to files
# Values: "true" or "false"
# Useful for centralized log management
NFTBAN_SYSLOG_ENABLED="false"

# Syslog facility
# Values: user, daemon, local0-local7
# Common choice: local0 (for custom applications)
NFTBAN_SYSLOG_FACILITY="local0"

# Syslog tag (prefix for all syslog messages)
# Shows up in syslog as: <tag>: message
NFTBAN_SYSLOG_TAG="nftban"

# Syslog server (if using remote syslog)
# Format: hostname:port or IP:port
# Empty = use local syslog only
NFTBAN_SYSLOG_SERVER=""

# Syslog protocol
# Values: udp, tcp, tls
NFTBAN_SYSLOG_PROTOCOL="udp"

# =============================================================================
# LOG SANITIZATION
# =============================================================================

# Sanitize sensitive data from logs
# Values: "true" or "false"
# Redacts: passwords, API keys, tokens
NFTBAN_LOG_SANITIZE="true"

# Redaction string for sanitized data
# What to show instead of sensitive data
NFTBAN_LOG_REDACTION_STRING="[REDACTED]"

# Patterns to redact (regex patterns, comma-separated)
# Default patterns redact common sensitive data
NFTBAN_LOG_REDACTION_PATTERNS="password=.*,api[_-]?key=.*,token=.*,secret=.*"

# =============================================================================
# PERFORMANCE SETTINGS
# =============================================================================

# Buffer log writes for performance
# Values: "true" or "false"
# When true, logs are written in batches
NFTBAN_LOG_BUFFERED="false"

# Log buffer size (number of lines)
# Only used if NFTBAN_LOG_BUFFERED=true
NFTBAN_LOG_BUFFER_SIZE="100"

# Async logging (write logs in background)
# Values: "true" or "false"
# Improves performance but may lose logs on crash
NFTBAN_LOG_ASYNC="false"

# =============================================================================
# MODULE-SPECIFIC LOG SETTINGS
# =============================================================================

# Enable per-module log files (in addition to main log)
# Values: "true" or "false"
# Creates: /var/log/nftban/modules/<module_name>.log
NFTBAN_LOG_PER_MODULE="false"

# Modules that always log even if disabled
# Comma-separated list
# Example: "core,installer"
NFTBAN_LOG_ALWAYS_MODULES="core"

# =============================================================================
# LOG ANALYSIS & ALERTS
# =============================================================================

# Enable automatic log analysis
# Values: "true" or "false"
# Scans logs for errors and patterns
NFTBAN_LOG_ANALYSIS="false"

# Alert on repeated errors
# Values: "true" or "false"
# Sends alert if same error appears N times in M minutes
NFTBAN_LOG_ALERT_ON_REPEAT="false"

# Repeated error threshold
# Number of identical errors to trigger alert
NFTBAN_LOG_ALERT_THRESHOLD="5"

# Repeated error window (minutes)
# Time window for counting repeated errors
NFTBAN_LOG_ALERT_WINDOW="10"

# =============================================================================
# END OF LOGGING CONFIGURATION
# =============================================================================
