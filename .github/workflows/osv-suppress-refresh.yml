# SPDX-License-Identifier: MPL-2.0
#
# Refresh osv-scanner.toml suppress list weekly.
#
# Runs tools/refresh-osv-suppressions.sh against the OSV API and opens a PR
# with any new stdlib CVE entries. Manual review is still required (the PR
# has to be approved and merged), but the data collection and toml editing
# is automated.
#
# Trigger:
#   - weekly schedule (Monday 06:00 UTC)
#   - manual workflow_dispatch

name: OSV Suppress List Refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      target_go_version:
        description: 'Target Go version for suppression policy'
        required: false
        default: '1.25.8'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq

      - name: Run refresh script (apply mode)
        id: refresh
        env:
          OSV_TARGET_GO_VERSION: ${{ github.event.inputs.target_go_version || '1.25.8' }}
        run: |
          set +e
          ./tools/refresh-osv-suppressions.sh --apply
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # exit 0 = no changes, exit 2 = changes applied, anything else = error
          if [[ "$rc" -eq 0 ]]; then
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ "$rc" -eq 2 ]]; then
              echo "no_changes=false" >> "$GITHUB_OUTPUT"
          else
              echo "::error::refresh script failed with exit $rc"
              exit "$rc"
          fi

      - name: Open PR with refreshed suppressions
        if: steps.refresh.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            chore(security): refresh OSV stdlib suppress list

            Auto-generated by tools/refresh-osv-suppressions.sh on
            ${{ github.event.repository.updated_at }}.

            Review the new entries before merging. Each entry includes
            the OSV summary and the patched Go version. The current
            build profile is documented in osv-scanner.toml header.
          branch: chore/osv-suppress-refresh
          delete-branch: true
          title: 'chore(security): refresh OSV stdlib suppress list'
          body: |
            Automated refresh of `osv-scanner.toml` against the OSV API.

            **Build-target policy:** NFTBan builds for older distros (RHEL 8/9/10,
            Debian 11/12/13/14, Ubuntu 22.04/24.04). Build runners use Go
            ${{ github.event.inputs.target_go_version || '1.25.8' }}+, which
            includes all stdlib fixes up to that version. Newer stdlib CVEs are
            out of scope for the current build profile and are auto-suppressed
            here for visibility, not for action.

            **Review checklist:**
            - [ ] Each new entry's `reason` field accurately reflects the OSV summary
            - [ ] No CVE in this list affects the current build profile (compile-time Go)
            - [ ] If a toolchain bump is desired, update build workflows separately
            - [ ] Merge to clear the OSV-Scanner CI gate on subsequent PRs

            Generated by `.github/workflows/osv-suppress-refresh.yml`.
          labels: |
            chore
            security
            automated
