# =============================================================================
# NFTBan VestaCP Panel Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: VestaCP control panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/vesta/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# VESTACP INSTALLATION
# -----------------------------------------------------------------------------

# VestaCP installation path
NFTBAN_VESTA_PATH="/usr/local/vesta"

# VestaCP panel port
NFTBAN_VESTA_PANEL_PORT="8083"  # VestaCP Admin Panel

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
# -----------------------------------------------------------------------------
# Based on VestaCP recommended firewall rules
# See: https://vestacp.com/

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995), VestaCP Panel(8083)
NFTBAN_VESTA_TCP_IN="20,21,22,25,53,80,110,143,443,465,587,993,995,8083"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        Ident(113), HTTPS(443), Submission(587), IMAPS(993), POP3S(995)
NFTBAN_VESTA_TCP_OUT="20,21,22,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_VESTA_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123)
NFTBAN_VESTA_UDP_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

# TCP INPUT (incoming connections) - IPv6
NFTBAN_VESTA_TCP6_IN="20,21,22,25,53,80,110,143,443,465,587,993,995,8083"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_VESTA_TCP6_OUT="20,21,22,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_VESTA_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_VESTA_UDP6_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_VESTA_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_VESTA_CUSTOM_TCP_IN=""
NFTBAN_VESTA_CUSTOM_TCP_OUT=""
NFTBAN_VESTA_CUSTOM_UDP_IN=""
NFTBAN_VESTA_CUSTOM_UDP_OUT=""

NFTBAN_VESTA_CUSTOM_TCP6_IN=""
NFTBAN_VESTA_CUSTOM_TCP6_OUT=""
NFTBAN_VESTA_CUSTOM_UDP6_IN=""
NFTBAN_VESTA_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# VestaCP login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_VESTA_ENABLED="true"

# Log file location
LOGIN_SERVICE_VESTA_LOG="/var/log/vesta/auth.log"
LOGIN_SERVICE_VESTA_SYSTEM="/var/log/vesta/system.log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Use SSL/TLS for panel access (HTTPS on port 8083)
# • Enable login monitoring (automatic brute-force protection)
# • Configure fail2ban for additional protection
# • Restrict admin panel access to specific IPs if possible
# • Enable two-factor authentication if available
# • Keep VestaCP updated to latest version
# • Disable root login via SSH
# • Configure ModSecurity for web application firewall
# • Note: VestaCP is deprecated, consider migrating to HestiaCP

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
