# =============================================================================
# NFTBan - Temporary Files Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Create runtime directories at boot
# Location: /usr/lib/tmpfiles.d/nftban.conf
#
# Format: type path mode user group age argument
# See: man tmpfiles.d
# =============================================================================

# Runtime directory (tmpfs)
d /run/nftban 0755 nftban nftban -

# Lock directory
d /run/nftban/locks 0755 nftban nftban -

# Cache directories (may need recreation after cleanup)
d /var/cache/nftban 0755 nftban nftban -
d /var/cache/nftban/geoip 0755 nftban nftban -
d /var/cache/nftban/geoban 0755 nftban nftban -
d /var/cache/nftban/feeds 0755 nftban nftban -
d /var/cache/nftban/tmp 0755 nftban nftban -

# Persistent data directories
d /var/lib/nftban 0750 nftban nftban -
d /var/lib/nftban/state 0750 nftban nftban -
d /var/lib/nftban/snapshots 0750 nftban nftban -
d /var/lib/nftban/feeds 0750 nftban nftban -
d /var/lib/nftban/keyring 0750 nftban nftban -
d /var/lib/nftban/backup 0750 nftban nftban -
d /var/lib/nftban/reports 0750 nftban nftban -
d /var/lib/nftban/reports/baseline 0750 nftban nftban -
d /var/lib/nftban/reports/auditors 0770 nftban nftban -
d /var/lib/nftban/metrics 0750 nftban nftban -
d /var/lib/nftban/config 0750 nftban nftban -
d /var/lib/nftban/geoip 0750 nftban nftban -
d /var/lib/nftban/geoban 0750 nftban nftban -
d /var/lib/nftban/geoban/tracking 0750 nftban nftban -

# Log directory
d /var/log/nftban 0750 nftban nftban -
