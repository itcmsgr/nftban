# =============================================================================
# NFTBan InterWorx Panel Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: InterWorx control panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/interworx/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# INTERWORX INSTALLATION
# -----------------------------------------------------------------------------

# InterWorx installation path
NFTBAN_INTERWORX_PATH="/usr/local/interworx"

# InterWorx panel ports
NFTBAN_INTERWORX_NODEWORX_PORT="2443"  # NodeWorx (Admin) HTTPS
NFTBAN_INTERWORX_SITEWORX_PORT="2080"  # SiteWorx (User) HTTP

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
# -----------------------------------------------------------------------------
# Based on InterWorx recommended firewall rules
# See: https://www.interworx.com/

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SSH(22), ICMP Echo(24), SMTP(25), DNS(53), HTTP(80),
#        POP3(110), IMAP(143), HTTPS(443), SMTPS(465), Submission(587),
#        IMAPS(993), POP3S(995), SiteWorx(2080), NodeWorx(2443)
NFTBAN_INTERWORX_TCP_IN="20,21,22,24,25,53,80,110,143,443,465,587,993,995,2080,2443"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        Ident(113), HTTPS(443), Submission(587), IMAPS(993), POP3S(995),
#        SiteWorx(2080), NodeWorx(2443)
NFTBAN_INTERWORX_TCP_OUT="20,21,22,25,53,80,110,113,443,587,993,995,2080,2443"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_INTERWORX_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123)
NFTBAN_INTERWORX_UDP_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

# TCP INPUT (incoming connections) - IPv6
NFTBAN_INTERWORX_TCP6_IN="20,21,22,24,25,53,80,110,143,443,465,587,993,995,2080,2443"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_INTERWORX_TCP6_OUT="20,21,22,25,53,80,110,113,443,587,993,995,2080,2443"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_INTERWORX_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_INTERWORX_UDP6_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_INTERWORX_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_INTERWORX_CUSTOM_TCP_IN=""
NFTBAN_INTERWORX_CUSTOM_TCP_OUT=""
NFTBAN_INTERWORX_CUSTOM_UDP_IN=""
NFTBAN_INTERWORX_CUSTOM_UDP_OUT=""

NFTBAN_INTERWORX_CUSTOM_TCP6_IN=""
NFTBAN_INTERWORX_CUSTOM_TCP6_OUT=""
NFTBAN_INTERWORX_CUSTOM_UDP6_IN=""
NFTBAN_INTERWORX_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# InterWorx login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_INTERWORX_ENABLED="true"

# Log file location
LOGIN_SERVICE_INTERWORX_LOG="/var/log/interworx/iworx.log"
LOGIN_SERVICE_INTERWORX_ACCESS="/var/log/httpd/access_log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Use SSL/TLS for panel access (NodeWorx port 2443)
# • Enable login monitoring (automatic brute-force protection)
# • Configure firewall rules for additional protection
# • Restrict NodeWorx access to specific IPs if possible
# • Enable two-factor authentication in InterWorx
# • Keep InterWorx updated to latest version
# • Disable root login via SSH
# • Configure ModSecurity for web application firewall

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
