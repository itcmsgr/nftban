# meta:name="service-security"
# meta:type="config"
# meta:header="Service Security Contract"
# meta:version="1.0.0"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:homepage="https://nftban.com"
#
# meta:description="Security invariants for systemd services"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units="nftband.service,nftban-health.service,nftban-unified-exporter.service"
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# meta:created_date="2026-01-10"
# meta:updated_date="2026-01-10"
#
# This file defines the complete security contract for each systemd service.
# It is used by CI validation and receipt-based auditing.
#
# Format: INI-style sections per service
#
# Fields:
#   user          - Expected User= (root or nftban)
#   group         - Expected Group= (root or nftban)
#   caps          - Expected CapabilityBoundingSet
#   protectsystem - Expected ProtectSystem= (strict/full/true)
#   readwrite     - Expected ReadWritePaths (space-separated)
#   nonewprivs    - Expected NoNewPrivileges= (true/false)
#   privatetmp    - Expected PrivateTmp= (true/false)
#   dynamicuser   - Expected DynamicUser= (must be false for our model)
#
# Architecture Note (2026 Contract):
# - /var/lib/nftban is root:nftban 0750 (security boundary)
# - Subdirectories are nftban:nftban (daemon-writable)
# - Services running as root with capability restrictions need CAP_DAC_OVERRIDE
#   to write to nftban-owned subdirectories
# - Services running as User=nftban are granted write access only through
#   explicit state/log/cache/run directories via systemd sandboxing
# =============================================================================

[nftband]
# Core daemon - runs as root, single nftables writer
# CAP_DAC_OVERRIDE needed to write stats to nftban-owned directories
user=root
group=root
caps=CAP_NET_ADMIN CAP_DAC_OVERRIDE
protectsystem=strict
readwrite=/etc/nftban/blacklist.d /etc/nftban/rules.d /var/lib/nftban /var/log/nftban /run/nftban /var/cache/nftban
nonewprivs=true
privatetmp=true
dynamicuser=false

[nftban-health]
# Health check service - runs as nftban user
user=nftban
group=nftban
caps=CAP_NET_ADMIN
protectsystem=strict
readwrite=/var/lib/nftban /var/cache/nftban /var/log/nftban /run/nftban
nonewprivs=true
privatetmp=true
dynamicuser=false

[nftban-unified-exporter]
# Unified metrics exporter - runs as nftban user
# Needs access to /var/lib/node_exporter for textfile collector
user=nftban
group=nftban
caps=CAP_NET_ADMIN
protectsystem=strict
readwrite=/var/lib/nftban /var/log/nftban /run/nftban /var/lib/node_exporter
nonewprivs=true
privatetmp=true
dynamicuser=false
