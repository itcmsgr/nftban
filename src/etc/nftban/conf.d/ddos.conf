# =============================================================================
# NFTBan v0.10.0 - DDoS Protection Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
#
# This file contains default DDoS protection settings for NFTBan v0.10.0.
# User overrides should be placed in: /etc/nftban/nftban.conf.local
#
# Owner: Antonios Voulvoulis <contact@nftban.com>
# Homepage: https://nftban.com
# Version: 0.10.0
# =============================================================================
#
# CONFIGURATION OVERRIDE HIERARCHY:
#   1. Package defaults (this file) - Lowest priority
#   2. Profile templates (/usr/share/nftban/profiles/*.conf) - Medium priority
#   3. User overrides (/etc/nftban/nftban.conf.local) - Highest priority
#
# =============================================================================

# =============================================================================
# GLOBAL DDOS PROTECTION SETTINGS
# =============================================================================

# Master switch for all DDoS protection features
# Set to "true" to enable all DDoS protection, "false" to disable
# Default: true
DDOS_PROTECTION_ENABLED="true"

# Log all DDoS protection actions
# Set to "true" to enable logging, "false" to disable
# Default: true
DDOS_LOGGING_ENABLED="true"

# Send email alerts for DDoS attacks
# Requires mail system to be configured (see: nftban mail configure)
# Set to "true" to enable email alerts, "false" to disable
# Default: true
DDOS_EMAIL_ALERTS="true"

# =============================================================================
# SYN FLOOD PROTECTION
# =============================================================================
# Protects against TCP SYN flood attacks by rate limiting new TCP connections
# with the SYN flag set. This is one of the most common DDoS attack types.
#
# ⚠️  IMPORTANT: This should ONLY be enabled if you are under active SYN flood
# attack, as it will add latency to all new connections from any IP address.
#
# When to enable:
#   ✅ Under active SYN flood attack
#   ❌ Normal operation (causes connection latency)
# =============================================================================

# Enable/disable SYN flood protection
# Set to "false" to disable, "true" to enable
# Default: false (only enable during active attack)
DDOS_SYNFLOOD_ENABLED="false"

# Rate limit for SYN packets
# Format: X/time_unit (time units: second, minute, hour, day)
# Example: "100/second" allows 100 SYN packets per second per IP
# Recommended:
#   - 100/second for high-traffic servers
#   - 50/second for normal use
# Default: 100/second
DDOS_SYNFLOOD_RATE="100/second"

# Burst allowance - number of packets allowed before rate limiting kicks in
# This allows legitimate connection bursts without triggering protection
# Recommended:
#   - 150 packets for high-traffic servers
#   - 100 for normal use
# Default: 150
DDOS_SYNFLOOD_BURST="150"

# Log dropped SYN flood packets
# Set to "true" to log, "false" to silently drop
# Default: true
DDOS_SYNFLOOD_LOG="true"

# =============================================================================
# CONNECTION LIMIT PROTECTION
# =============================================================================
# Limits the number of concurrent connections per IP address to specific ports.
# This prevents connection exhaustion attacks and resource abuse.
#
# Uses nftables connection tracking (conntrack) to count active connections
# per IP address. Works on all modern Linux kernels (3.13+).
#
# ✅ Recommended: Enable this protection for all servers
# ✅ Per-service granularity: Set to "0" to disable limit for specific service
#
# When to enable:
#   ✅ Always (recommended for all servers)
#   ✅ Prevents connection exhaustion attacks
#   ✅ Only enable limits for services you actually run
# =============================================================================

# Enable/disable connection limit protection
# Set to "false" to disable, "true" to enable
# Default: true
DDOS_CONNLIMIT_ENABLED="true"

# SSH connection limit per IP address (port 22)
# Recommended: 3-5 to allow legitimate reconnections
# Set to "0" to disable limit for SSH
# Default: 5
DDOS_CONNLIMIT_SSH="5"

# HTTP connection limit per IP address (port 80)
# Recommended: 20-50 depending on legitimate traffic patterns
# Web servers: 30-50
# Non-web servers: 0 (disabled)
# Set to "0" to disable limit for HTTP
# Default: 20
DDOS_CONNLIMIT_HTTP="20"

# HTTPS connection limit per IP address (port 443)
# Recommended: 20-50 depending on legitimate traffic patterns
# Web servers: 30-50
# Non-web servers: 0 (disabled)
# Set to "0" to disable limit for HTTPS
# Default: 20
DDOS_CONNLIMIT_HTTPS="20"

# FTP connection limit per IP address (port 21)
# Recommended: 3-5 for FTP servers
# Set to "0" to disable limit for FTP
# Default: 3
DDOS_CONNLIMIT_FTP="3"

# SMTP connection limit per IP address (port 25)
# Recommended: 5-10 for mail servers
# Set to "0" to disable limit for SMTP
# Default: 5
DDOS_CONNLIMIT_SMTP="5"

# POP3 connection limit per IP address (port 110)
# Recommended: 5-10 for mail servers
# Set to "0" to disable limit for POP3
# Default: 5
DDOS_CONNLIMIT_POP3="5"

# IMAP connection limit per IP address (port 143)
# Recommended: 5-10 for mail servers
# Set to "0" to disable limit for IMAP
# Default: 5
DDOS_CONNLIMIT_IMAP="5"

# MySQL/MariaDB connection limit per IP address (port 3306)
# Recommended: 3-10 for database servers
# Set to "0" to disable limit for MySQL
# Default: 10
DDOS_CONNLIMIT_MYSQL="10"

# PostgreSQL connection limit per IP address (port 5432)
# Recommended: 3-10 for database servers
# Set to "0" to disable limit for PostgreSQL
# Default: 10
DDOS_CONNLIMIT_POSTGRESQL="10"

# Custom connection limits for additional ports
# Format: "port;limit,port;limit,..."
# Example: "8080;30,9000;15" sets:
#   - Port 8080: max 30 concurrent connections per IP
#   - Port 9000: max 15 concurrent connections per IP
# Leave empty to disable custom limits
# Default: empty
DDOS_CONNLIMIT_CUSTOM=""

# Log connection limit violations
# Set to "true" to log, "false" to silently reject
# Default: true
DDOS_CONNLIMIT_LOG="true"

# Action when connection limit is exceeded
# Options:
#   "reject" - Send TCP RST (recommended - frees resources immediately)
#   "drop"   - Silently drop (hides firewall presence but ties up resources)
# Default: reject
DDOS_CONNLIMIT_ACTION="reject"

# =============================================================================
# PORT FLOOD PROTECTION
# =============================================================================
# Rate limits new connections to specific ports over time. Unlike connection
# limits which count concurrent connections, this limits the rate of new
# connection attempts per time period.
#
# Effective against:
#   ✅ Slowloris attacks
#   ✅ Brute force attempts
#   ✅ Rapid connection attacks
#
# When to enable:
#   ✅ High-traffic servers (web, API)
#   ✅ Services vulnerable to brute force (SSH)
# =============================================================================

# Enable/disable port flood protection
# Set to "false" to disable, "true" to enable
# Default: true
DDOS_PORTFLOOD_ENABLED="true"

# SSH port flood protection (port 22)
# Format: "max_connections/time_in_seconds"
# Example: "5/300" allows 5 new connections per 300 seconds (5 minutes)
# Recommended: 5/300 for SSH (prevents brute force while allowing reconnections)
# Set to "0" to disable for SSH
# Default: 5/300
DDOS_PORTFLOOD_SSH="5/300"

# HTTP port flood protection (port 80)
# Format: "max_connections/time_in_seconds"
# Example: "20/5" allows 20 new connections per 5 seconds
# Recommended:
#   - 20/5 for normal sites
#   - 50/5 for high-traffic sites
#   - 0 for non-web servers
# Set to "0" to disable for HTTP
# Default: 20/5
DDOS_PORTFLOOD_HTTP="20/5"

# HTTPS port flood protection (port 443)
# Format: "max_connections/time_in_seconds"
# Recommended: Same as HTTP
# Set to "0" to disable for HTTPS
# Default: 20/5
DDOS_PORTFLOOD_HTTPS="20/5"

# FTP port flood protection (port 21)
# Format: "max_connections/time_in_seconds"
# Recommended: 10/60 for FTP
# Set to "0" to disable for FTP
# Default: 10/60
DDOS_PORTFLOOD_FTP="10/60"

# SMTP port flood protection (port 25)
# Format: "max_connections/time_in_seconds"
# Recommended: 5/300 for SMTP (prevents spam bots)
# Set to "0" to disable for SMTP
# Default: 5/300
DDOS_PORTFLOOD_SMTP="5/300"

# Custom port flood limits for additional ports
# Format: "port;rate/time,port;rate/time,..."
# Example: "8080;30/10,9000;15/60" sets:
#   - Port 8080: max 30 connections per 10 seconds
#   - Port 9000: max 15 connections per 60 seconds
# Leave empty to disable custom limits
# Default: empty
DDOS_PORTFLOOD_CUSTOM=""

# Log port flood violations
# Set to "true" to log, "false" to silently drop
# Default: true
DDOS_PORTFLOOD_LOG="true"

# =============================================================================
# ICMP FLOOD PROTECTION
# =============================================================================
# Rate limits ICMP echo requests (ping) to prevent ICMP flood attacks.
# Also provides options to drop ICMP timestamp/address mask requests.
#
# ✅ Recommended: Always enable (allows legitimate pings but blocks floods)
#
# When to enable:
#   ✅ Always (prevents ping floods)
#   ✅ Allows legitimate monitoring but blocks abuse
# =============================================================================

# Enable/disable ICMP rate limiting
# Set to "false" to disable, "true" to enable
# Note: Disabling ICMP completely may break external uptime monitoring
# Default: true
DDOS_ICMPFLOOD_ENABLED="true"

# Incoming ICMP echo request (ping) rate limit
# Format: "X/time_unit" where time unit is: second, minute, hour, day
# Example: "1/second" allows 1 ping per second per IP
# Recommended:
#   - 1/second for strict protection
#   - 5/second for relaxed protection
# Set to "0" to disable incoming ICMP rate limiting
# Default: 1/second
DDOS_ICMPFLOOD_RATE="1/second"

# Burst allowance for ICMP packets
# Allows burst of ICMP packets before rate limiting kicks in
# Recommended: 10-100 packets
# Default: 10
DDOS_ICMPFLOOD_BURST="10"

# Outgoing ICMP echo request (ping) rate limit
# Usually not needed unless preventing abuse from local users
# Recommended: "0" (disabled) unless you have specific requirements
# Set to "0" to disable outgoing ICMP rate limiting
# Default: 0
DDOS_ICMPFLOOD_OUT_RATE="0"

# Drop ICMP timestamp requests (type 13)
# PCI compliance tools may require this to be enabled
# However, it has minimal security benefit and may impact network performance
# Recommended: "false" (disabled) unless required for PCI compliance
# Set to "true" to drop ICMP timestamp requests
# Default: false
DDOS_ICMP_TIMESTAMP_DROP="false"

# Drop ICMP address mask requests (type 17)
# Rarely used, can be dropped for security
# Recommended: "true" (enabled)
# Set to "true" to drop ICMP address mask requests
# Default: true
DDOS_ICMP_ADDRESSMASK_DROP="true"

# Log ICMP rate limit violations
# Set to "true" to log, "false" to silently drop
# Note: Can generate a lot of log entries during ping floods
# Default: false
DDOS_ICMPFLOOD_LOG="false"

# =============================================================================
# UDP FLOOD PROTECTION
# =============================================================================
# Limits outbound UDP packet floods, typically originating from exploit scripts
# uploaded through vulnerable web applications.
#
# ⚠️  IMPORTANT: Use with caution on servers running UDP-intensive services:
#   - DNS (named/bind)
#   - NTP (ntpd)
#   - SNMP
#   - VoIP services
# You may need to adjust limits or add services to the allowlist.
#
# When to enable:
#   ✅ Web servers without UDP services
#   ❌ DNS servers, NTP servers, or any UDP-heavy service
# =============================================================================

# Enable/disable UDP flood protection
# Set to "false" to disable, "true" to enable
# Recommended: "false" (disabled by default) - enable only if needed
# Default: false
DDOS_UDPFLOOD_ENABLED="false"

# UDP packet rate limit
# Format: "X/time_unit"
# Example: "100/second" allows 100 UDP packets per second per process
# Recommended: 100/second for normal use, adjust if running UDP services
# Default: 100/second
DDOS_UDPFLOOD_RATE="100/second"

# UDP burst allowance
# Allows burst of UDP packets before rate limiting kicks in
# Recommended: 500 packets
# Default: 500
DDOS_UDPFLOOD_BURST="500"

# Usernames/services to exclude from UDP flood protection
# Comma-separated list of usernames that should not be rate limited
# Common exclusions: named (DNS), ntpd (NTP), snmpd (SNMP)
# Note: root (UID 0) is always excluded
# Example: "named,ntpd,snmpd"
# Default: named,ntpd
DDOS_UDPFLOOD_ALLOWUSER="named,ntpd"

# Log UDP flood violations
# Set to "true" to log, "false" to silently drop
# Default: true
DDOS_UDPFLOOD_LOG="true"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Minimum time between DDoS rule updates (seconds)
# Prevents excessive rule changes that could impact performance
# Recommended: 60 seconds
# Default: 60
DDOS_UPDATE_INTERVAL="60"

# Maximum entries in DDoS tracking tables
# Limits memory usage for connection tracking
# Recommended: 65536 for most systems
# Default: 65536
DDOS_MAX_ENTRIES="65536"

# Enable experimental DDoS features
# Set to "true" to enable experimental/testing features
# Recommended: "false" for production systems
# Default: false
DDOS_EXPERIMENTAL="false"

# =============================================================================
# FHS COMPLIANT PATHS
# =============================================================================

# DDoS module data directory
# Used for storing DDoS statistics and tracking data
# Default: /var/lib/nftban/ddos
DDOS_DATA_DIR="/var/lib/nftban/ddos"

# DDoS module cache directory
# Used for temporary DDoS tracking data
# Default: /var/cache/nftban/ddos
DDOS_CACHE_DIR="/var/cache/nftban/ddos"

# DDoS module log file
# All DDoS protection actions are logged here
# Default: /var/log/nftban/ddos.log
DDOS_LOG_FILE="/var/log/nftban/ddos.log"

# DDoS statistics file
# Real-time DDoS statistics (JSON format)
# Default: /var/lib/nftban/ddos/stats.json
DDOS_STATS_FILE="/var/lib/nftban/ddos/stats.json"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# For user overrides, create: /etc/nftban/nftban.conf.local
# Example:
#   DDOS_CONNLIMIT_HTTP="50"    # Override HTTP limit to 50
#   DDOS_SYNFLOOD_ENABLED="true"  # Enable SYN flood protection
#
# =============================================================================
