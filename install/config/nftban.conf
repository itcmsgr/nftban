# =============================================================================
# NFTBan Main Configuration File
# =============================================================================
# This file contains system-wide configuration settings for NFTBan.
# User-specific overrides can be placed in /etc/nftban/conf.d/*.conf
#
# Format: KEY="value"
# Lines starting with # are comments
# =============================================================================

# Prevent double-sourcing (for bash scripts)
[[ -n "${_NFTBAN_CONF_LOADED:-}" ]] && return 0 2>/dev/null || true
_NFTBAN_CONF_LOADED=1

# -----------------------------------------------------------------------------
# SYSTEM INFORMATION
# -----------------------------------------------------------------------------
NFTBAN_VERSION="1.0.0"
NFTBAN_CONFIG_VERSION="2"

# -----------------------------------------------------------------------------
# METRICS BACKEND
# -----------------------------------------------------------------------------
# Choose metrics collection backend:
#   - prometheus       (default, industry standard)
#   - victoriametrics  (10x compression, 20x faster queries, 12-month retention)
#
NFTBAN_METRICS_BACKEND="prometheus"

# Metrics collection enabled
NFTBAN_METRICS_ENABLED="false"

# Metrics endpoints (used by health checks and status commands)
NFTBAN_METRICS_PROMETHEUS_ADDR="localhost:9090"
NFTBAN_METRICS_NODE_EXPORTER_ADDR="localhost:9100"
NFTBAN_METRICS_VICTORIA_ADDR="localhost:8428"

# -----------------------------------------------------------------------------
# GEOIP CONFIGURATION
# -----------------------------------------------------------------------------
# Enable GeoIP blocking functionality
NFTBAN_GEOIP_ENABLED="false"

# MaxMind License Key (required for GeoIP database updates)
# Get your free key at: https://www.maxmind.com/en/geolite2/signup
#NFTBAN_GEOIP_LICENSE_KEY=""

# -----------------------------------------------------------------------------
# THREAT FEEDS
# -----------------------------------------------------------------------------
# Enable threat intelligence feeds
NFTBAN_FEEDS_ENABLED="false"

# Automatic feed updates
NFTBAN_FEEDS_AUTO_UPDATE="true"

# -----------------------------------------------------------------------------
# SURICATA IDS INTEGRATION
# -----------------------------------------------------------------------------
# Enable Suricata IDS integration (replaces fail2ban in v1.0)
NFTBAN_SURICATA_ENABLED="true"

# Suricata eve.json monitoring (under NFTBan control)
NFTBAN_SURICATA_EVE_LOG="/var/log/nftban/suricata/eve.json"
NFTBAN_SURICATA_LOG_DIR="/var/log/nftban/suricata"

# IP scoring threshold (ban after this score)
NFTBAN_SURICATA_BAN_THRESHOLD="100"

# Score decay time (seconds)
NFTBAN_SURICATA_SCORE_DECAY="3600"

# Cloudflare IP whitelist
NFTBAN_SURICATA_CLOUDFLARE_WHITELIST="false"

# -----------------------------------------------------------------------------
# WEB GUI
# -----------------------------------------------------------------------------
# Enable web GUI
NFTBAN_GUI_ENABLED="false"

# GUI listen address
NFTBAN_GUI_ADDR="127.0.0.1:3940"

# -----------------------------------------------------------------------------
# SECURITY FEATURES
# -----------------------------------------------------------------------------
# Enable port scan detection
NFTBAN_PORTSCAN_ENABLED="false"

# Enable DDoS protection
NFTBAN_DDOS_ENABLED="false"

# Enable login monitoring (built-in, no fail2ban dependency)
# Monitors /var/log/auth.log or /var/log/secure for SSH brute force attacks
NFTBAN_LOGIN_MONITOR_ENABLED="true"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log level: DEBUG, INFO, WARN, ERROR
NFTBAN_LOG_LEVEL="INFO"

# Enable colored output
NFTBAN_COLOR_OUTPUT="true"

# -----------------------------------------------------------------------------
# DEBUG TRACE (For troubleshooting stuck/failed scripts)
# -----------------------------------------------------------------------------
# When enabled, each script logs START/END with unique trace ID
# If a script has START without matching END = script is stuck/crashed
# Debug trace log: /var/log/nftban/debug_trace.log
NFTBAN_DEBUG_TRACE="false"

# Debug trace log file
NFTBAN_DEBUG_TRACE_LOG="/var/log/nftban/debug_trace.log"

# -----------------------------------------------------------------------------
# TIMEOUTS (seconds)
# -----------------------------------------------------------------------------
# Network and command timeouts - used across CLI and Go components
NFTBAN_TIMEOUT_FAST="5"           # Quick operations (curl connect, simple checks)
NFTBAN_TIMEOUT_MEDIUM="30"        # Standard operations (nft commands, API calls)
NFTBAN_TIMEOUT_SLOW="120"         # Long operations (large feed downloads)
NFTBAN_TIMEOUT_HTTP_DEFAULT="60"  # Default HTTP client timeout
NFTBAN_TIMEOUT_HTTP_LONG="300"    # Extended HTTP timeout (GeoIP downloads)

# -----------------------------------------------------------------------------
# HEALTH CHECK PARAMETERS
# -----------------------------------------------------------------------------
# Health monitoring thresholds
NFTBAN_HEALTH_FILE_AGE_THRESHOLD="600"    # seconds - max age for monitored files
NFTBAN_HEALTH_MEMORY_WARNING="600"        # MB - memory usage warning threshold
NFTBAN_ALERT_THROTTLE_SECONDS="3600"      # seconds - throttle repeated alerts

# -----------------------------------------------------------------------------
# CACHE CONTROL
# -----------------------------------------------------------------------------
# Cache TTL settings (seconds)
NFTBAN_STATS_CACHE_TTL="300"              # Stats cache (5 minutes)
NFTBAN_BANDWIDTH_CACHE_TTL="10"           # Bandwidth metrics cache

# -----------------------------------------------------------------------------
# NFTABLES TABLE CONFIGURATION
# -----------------------------------------------------------------------------
# Canonical nftables table names - used by all components
# Default: Separate ip/ip6 tables (cleaner, better performance)
# Alternative: Single inet table (set NFTBAN_TABLE_FAMILY="inet")
#
NFTBAN_TABLE_FAMILY="ip"
NFTBAN_TABLE_NAME="nftban"
NFTBAN_TABLE_IPV4="ip nftban"
NFTBAN_TABLE_IPV6="ip6 nftban"

# For inet family (single table with _v4/_v6 suffixed sets):
# NFTBAN_TABLE_FAMILY="inet"
# NFTBAN_TABLE_INET="inet nftban"

# -----------------------------------------------------------------------------
# PATHS (DO NOT MODIFY UNLESS YOU KNOW WHAT YOU'RE DOING)
# -----------------------------------------------------------------------------
# Canonical binary paths - used by all scripts for consistency
NFTBAN_BIN="/usr/bin/nftban"
NFTBAN_CORE_BIN="/usr/lib/nftban/bin/nftban-core"
NFTBAN_UI_BIN="/usr/sbin/nftban-ui"
NFTBAN_AUTH_BIN="/usr/libexec/nftban-ui-auth"

# Directory paths
NFTBAN_LIB_DIR="/usr/lib/nftban"
NFTBAN_SHARE_DIR="/usr/share/nftban"
NFTBAN_TESTS_DIR="/usr/lib/nftban/tests"
NFTBAN_CONFIG_DIR="/etc/nftban"
NFTBAN_DATA_DIR="/var/lib/nftban"
NFTBAN_LOG_DIR="/var/log/nftban"
NFTBAN_CACHE_DIR="/var/cache/nftban"
NFTBAN_RUN_DIR="/run/nftban"
NFTBAN_POLKIT_RULES_DIR="/etc/polkit-1/rules.d"

# Log files (all under NFTBAN_LOG_DIR)
NFTBAN_BAN_LOG="${NFTBAN_LOG_DIR}/bans.log"
NFTBAN_ACTIONS_LOG="${NFTBAN_LOG_DIR}/nftban-actions.log"
NFTBAN_PORTSCAN_LOG="${NFTBAN_LOG_DIR}/portscan.log"
NFTBAN_LOGIN_MONITOR_LOG="${NFTBAN_LOG_DIR}/login_alert.log"
NFTBAN_CLOUDFLARE_LOG="${NFTBAN_LOG_DIR}/cloudflare.log"
NFTBAN_MAINTENANCE_LOG="${NFTBAN_LOG_DIR}/maintenance.log"
NFTBAN_CLI_ERROR_LOG="${NFTBAN_LOG_DIR}/cli-errors.log"

# -----------------------------------------------------------------------------
# DISTRO CONFIGURATION
# -----------------------------------------------------------------------------
# Distro config directory (auto-detected distro config loaded from here)
NFTBAN_DISTRO_CONF_DIR="/etc/nftban/distros"

# -----------------------------------------------------------------------------
# NFTBAN SYSTEMD SERVICE NAMES (Central Reference)
# -----------------------------------------------------------------------------
# NFTBan's own services - same across all distros
# External services (prometheus, node_exporter) are in distros/*.conf

# Core services
NFTBAN_SERVICE_CORE="nftban-core.service"
NFTBAN_SERVICE_UI="nftban-ui.service"

# Timer-based services
NFTBAN_SERVICE_QUEUE="nftban-queue.service"
NFTBAN_SERVICE_MAINTENANCE="nftban-maintenance.service"
NFTBAN_SERVICE_HEALTH="nftban-health.service"
NFTBAN_SERVICE_METRICS_EXPORTER="nftban-metrics-exporter.service"
NFTBAN_SERVICE_BANDWIDTH_EXPORTER="nftban-bandwidth-exporter.service"

# Feature services
NFTBAN_SERVICE_LOGIN_MONITOR="nftban-login-monitor.service"
NFTBAN_SERVICE_SURICATA="nftban-suricata.service"

# Timers
NFTBAN_TIMER_QUEUE="nftban-queue.timer"
NFTBAN_TIMER_MAINTENANCE="nftban-maintenance.timer"
NFTBAN_TIMER_HEALTH="nftban-health.timer"
NFTBAN_TIMER_METRICS_EXPORTER="nftban-metrics-exporter.timer"
NFTBAN_TIMER_BANDWIDTH_EXPORTER="nftban-bandwidth-exporter.timer"
NFTBAN_TIMER_FEEDS="nftban-core-feeds.timer"
NFTBAN_TIMER_GEOIP="nftban-core-geoip.timer"
NFTBAN_TIMER_SURICATA_UPDATE="nftban-suricata-update.timer"
NFTBAN_TIMER_WATCHDOG="nftban-watchdog.timer"
NFTBAN_SERVICE_WATCHDOG="nftban-watchdog.service"

# -----------------------------------------------------------------------------
# SYSTEM WATCHDOG (Resource Monitoring)
# -----------------------------------------------------------------------------
# Monitor system resources (load, memory, I/O, disk) for troubleshooting
# Does NOT overlap with DDoS (connections) or Health (services)
NFTBAN_WATCHDOG_ENABLED="false"
NFTBAN_WATCHDOG_INTERVAL="90"
NFTBAN_WATCHDOG_ALERT_THROTTLE="3600"

# Watchdog paths
NFTBAN_WATCHDOG_LOG="${NFTBAN_LOG_DIR}/watchdog.log"
NFTBAN_WATCHDOG_REPORT_DIR="${NFTBAN_DATA_DIR}/reports/watchdog"
NFTBAN_WATCHDOG_METRICS_FILE="${NFTBAN_DATA_DIR}/metrics/watchdog.prom"
NFTBAN_WATCHDOG_REPORT_RETENTION="7"

# -----------------------------------------------------------------------------
# EXTERNAL SERVICE REFERENCES (mapped per-distro in distros/*.conf)
# -----------------------------------------------------------------------------
# These vary by distro - use nftban_distro_get_service() to resolve:
#   - prometheus        : Metrics collection (or victoriametrics)
#   - node_exporter     : System metrics (prometheus-node-exporter on RHEL)
#   - suricata          : Suricata IDS
#   - nftables          : Kernel firewall
#   - cron              : Cron daemon (crond on RHEL, cron on Debian)

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
