# =============================================================================
# NFTBan - System Users Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Define nftban system user and groups
# Location: /usr/lib/sysusers.d/nftban.conf
#
# Format: type name id gecos home
# See: man sysusers.d
# =============================================================================

# Create nftban system user (no fixed UID - system auto-assigns)
u nftban - "NFTBan Service" /nonexistent /usr/sbin/nologin

# Create nftban-cli group (for CLI access control)
g nftban-cli -

# Create nftban-auditors group (for v0.30 inventory helpers)
g nftban-auditors -
