# NFTBan Fail2ban Jail - SSH Protection
#
# This jail monitors SSH authentication failures and bans
# offending IPs using the NFTBan action.
#
# Configuration:
# - maxretry: Number of failures before ban (default: 5)
# - findtime: Time window for counting failures (default: 10 minutes)
# - bantime:  How long to ban (default: 1 hour)
#
# The bantime is passed to nftban as the nftables timeout value.

[nftban-sshd]

# Enable this jail
enabled   = true

# Use standard SSH filter
filter    = sshd

# Monitor systemd journal for SSH logs
backend   = systemd
logpath   = %(sshd_log)s

# Ban after 5 failed attempts within 10 minutes
maxretry  = 5
findtime  = 10m

# Ban for 1 hour (passed to nftban as timeout)
bantime   = 1h

# Use NFTBan action (passes jail name 'sshd' to action)
action    = nftban[name=sshd]
