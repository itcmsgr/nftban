# =============================================================================
# SYSTEM USERS AND GROUPS (sysusers.d)
# =============================================================================
sysusers:
  groups:
    - name: nftban
      system: true
      comment: "NFTBan service group"
    - name: nftban-auditor
      system: true
      comment: "NFTBan auditor group (read-only report access)"
    # nftban-panel group RETIRED — v1.137 (OPEN_V1_137_BLOCKER_PANEL_GROUP_RETIREMENT).
    # This formally SUPERSEDES the prior D-NEW-11 (Slot 6 / 2026-05-09) "KEEP, do NOT
    # decommission" note that lived here. The KEEP rationale ("live consumer:
    # cli/sbin/nftban-panelctl wrapper") is obsolete: the GOTH GUI redesign retired
    # panel integration (panel mgmt via CLI; GUI is display-only), and nftban-panelctl
    # has NO live invoker (it was only shipped + install-asserted, never executed).
    # The three-tier polkit model collapses to two surviving tiers:
    #   - nftban         (operator, 10-nftban-systemd.rules)
    #   - nftban-auditor (read-only, 20-nftban-auditor.rules)
    # 30-nftban-panel.rules, the nftban-panelctl wrapper, and every panel-group
    # create/ship/assert/health/CI surface are removed in this one coordinated lane.
    # NOTE: hosting-panel firewall takeover (--panel-auto-takeover / --no-panel /
    # cmd_panel.sh / cPanel·Plesk·DirectAdmin) is a DIFFERENT subsystem — unaffected.

  users:
    - name: nftban
      system: true
      group: nftban
      groups:
        - nftban-auditor
      home: /var/lib/nftban
      shell: /usr/sbin/nologin
      comment: "NFTBan service account"

