# =============================================================================
# Suricata Rule Enable Configuration - NFTBan Optimized (DEFAULT)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enable only the rules you need (saves CPU and RAM)
# Location: /etc/suricata/enable.conf
#
# ⚠️  DO NOT EDIT THIS FILE - Your changes will be overwritten on updates!
# ✅  Create /etc/suricata/enable.conf.local for custom additions
#
# Format: re:<pattern>  or  group:<groupname>
# Patterns are matched against rule files and rule metadata
#
# Usage: suricata-update --enable-conf /etc/suricata/enable.conf \
#                        --enable-conf /etc/suricata/enable.conf.local
# =============================================================================

# =============================================================================
# CORE PROTECTION (Always Recommended)
# =============================================================================
# These rules are essential for basic server security
# CPU Impact: LOW (5-10%)
# RAM Impact: LOW (50-100 MB)

# SSH Protection (brute-force, scanning, known exploits)
re:ssh
re:SSH
re:brute.*ssh

# Web Server Protection (generic attacks, exploits)
re:web
re:http
re:sqli
re:xss
re:rfi
re:lfi
re:injection

# Scanning Detection (port scans, network reconnaissance)
re:scan
re:SCAN
re:ET SCAN
re:nmap
re:masscan

# Brute-force Detection (all protocols)
re:brute

# Your Custom Local Rules
group:local


# =============================================================================
# WEB APPLICATION PROTECTION (Recommended for Web Servers)
# =============================================================================
# Enable these if you run web applications
# CPU Impact: LOW-MEDIUM (5-15%)
# RAM Impact: LOW (50-150 MB)

# WordPress Protection (login attacks, plugin exploits, xmlrpc abuse)
re:wordpress
re:wp-login
re:xmlrpc
re:wp-admin

# Generic CMS/Web exploits
re:directory.*traversal
re:path.*traversal
re:remote.*code.*execution


# =============================================================================
# BOTNET & CRYPTOMINER DETECTION (RECOMMENDED - After kthreadadd64 Incident)
# =============================================================================
# Detects compromised servers, outbound attacks, cryptominers
# CPU Impact: MEDIUM (10-15%)
# RAM Impact: MEDIUM (100-150 MB)

# Botnet Command & Control
re:botnet
re:Botnet
re:ET BOTCC
re:c2
re:c&c
re:beacon

# Linux-specific botnets
re:Mirai
re:Gafgyt
re:XORDDoS
re:BillGates
re:Tsunami

# Cryptominers (common in compromised servers)
re:cryptominer
re:miner
re:xmrig
re:monero
re:mining.*pool

# Fake process names (malware mimicry)
re:kthread
re:systemd.*network


# =============================================================================
# DNS PROTECTION (Recommended)
# =============================================================================
# Detects DNS tunneling, exfiltration, DGA domains
# CPU Impact: LOW (5%)
# RAM Impact: LOW (30-50 MB)

re:dns
re:DNS
re:DGA
re:domain.*generation


# =============================================================================
# TLS/SSL MONITORING (Recommended)
# =============================================================================
# Analyzes certificates and handshakes (not decryption)
# CPU Impact: LOW (5%)
# RAM Impact: LOW (30-50 MB)

re:tls
re:TLS
re:JA3


# =============================================================================
# EXPLOIT DETECTION (Recommended)
# =============================================================================
# Detects exploit attempts and CVE exploitation
# CPU Impact: MEDIUM (10%)
# RAM Impact: MEDIUM (80-100 MB)

re:exploit
re:CVE-
re:vulnerability
re:shellcode


# =============================================================================
# MAIL SERVER PROTECTION (Enable if running Postfix/Exim/Dovecot)
# =============================================================================
# Uncomment these lines if you run a mail server
# CPU Impact: MEDIUM (10-20%)
# RAM Impact: MEDIUM (100-200 MB)

# re:smtp
# re:SMTP
# re:imap
# re:IMAP
# re:pop3
# re:POP3
# re:mail


# =============================================================================
# FTP PROTECTION (Enable if running FTP server)
# =============================================================================
# Uncomment if you run ProFTPD, vsftpd, Pure-FTPd, etc.
# CPU Impact: LOW (5%)
# RAM Impact: LOW (20-50 MB)

# re:ftp
# re:FTP


# =============================================================================
# ADVANCED MALWARE DETECTION (Optional - Use Selectively)
# =============================================================================
# Enable specific malware families if you have specific threats

# --- Trojans & RATs ---
# CPU Impact: MEDIUM (15%)
# RAM Impact: MEDIUM (100-150 MB)
# re:ET TROJAN
# re:trojan
# re:Trojan
# re:RAT
# re:remote.*access.*tool

# --- Exploit Kits ---
# CPU Impact: MEDIUM (10%)
# RAM Impact: MEDIUM (80-100 MB)
# re:exploit.*kit
# re:Angler
# re:Magnitude
# re:RIG

# --- Ransomware ---
# CPU Impact: LOW (5%)
# RAM Impact: LOW (30-50 MB)
# re:ransomware


# =============================================================================
# NOT RECOMMENDED (Disable or Use Very Selectively)
# =============================================================================

# --- General Malware Rules (TOO BROAD - use specific categories instead) ---
# Contains thousands of signatures, many outdated, high false positives
# CPU Impact: VERY HIGH (30-60%)
# RAM Impact: HIGH (500MB-1GB)
# re:ET MALWARE
# re:MALWARE

# --- Policy Violations (NOT FOR SERVERS) ---
# For corporate networks monitoring user behavior (P2P, streaming, etc.)
# CPU Impact: MEDIUM (10-20%)
# RAM Impact: MEDIUM (150-250 MB)
# re:policy
# re:Policy
# re:ET POLICY

# --- Windows-Specific Protocols (NOT NEEDED on Linux) ---
# CPU Impact: MEDIUM (10%)
# RAM Impact: MEDIUM (100 MB)
# re:smb
# re:SMB
# re:dcerpc
# re:DCERPC
# re:rdp
# re:RDP

# --- Chat/IM Protocols (NOT NEEDED for servers) ---
# re:chat
# re:irc
# re:xmpp

# --- P2P File Sharing (NOT NEEDED for servers) ---
# re:p2p
# re:torrent
# re:bittorrent


# =============================================================================
# CONFIGURATION PROFILES
# =============================================================================
#
# MINIMAL (VPS/Cloud Servers):
# CPU: 5-15%, RAM: 300-500 MB
#   ✅ Core protection (ssh, web, scan, brute)
#   ✅ WordPress
#   ✅ Botnet + Cryptominer
#   ✅ DNS + TLS
#   ✅ Exploits
#   ✅ Local rules
#
# FULL HOSTING (cPanel/DirectAdmin/Plesk):
# CPU: 15-30%, RAM: 500-800 MB
#   ✅ All minimal rules
#   ✅ Mail (smtp, imap, pop3) - UNCOMMENT above
#   ✅ FTP - UNCOMMENT above
#
# MAXIMUM SECURITY (High-Value Targets):
# CPU: 30-50%, RAM: 800MB-1.2GB
#   ✅ All full hosting rules
#   ✅ Trojan detection - UNCOMMENT above
#   ✅ Ransomware - UNCOMMENT above
#   ✅ Exploit kits - UNCOMMENT above
#
# =============================================================================
