# Fail2ban filter for WordPress xmlrpc.php attacks
# Detects POST requests to xmlrpc.php (common brute force target)
#
# Author: NFTBan Project
# Date: 2025-10-30

[Definition]

# Match POST requests to xmlrpc.php (with or without leading slash)
# The /? makes the second slash optional to catch both:
# - "POST /xmlrpc.php"
# - "POST //xmlrpc.php"
failregex = ^<HOST> -.*"POST //?xmlrpc\.php.*

# Optional: Ignore known good IPs
ignoreregex =

[Init]
# Default values
# maxretry = 9
# findtime = 1200 (20 minutes)
# bantime = 7200 (2 hours)
