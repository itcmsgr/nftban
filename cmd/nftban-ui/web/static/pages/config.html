<h2><i class="fa fa-gear"></i> Configuration</h2>
<p class="text-muted">Manage NFTBan configuration settings</p>

<div class="card">
    <h3><i class="fa fa-list"></i> Configuration Modules</h3>
    <div id="config-modules" style="display: grid; gap: 15px;">
        <p class="text-center text-muted"><i class="fa fa-spinner fa-spin"></i> Loading modules...</p>
    </div>
</div>

<div id="config-editor" class="card" style="display: none;">
    <h3><i class="fa fa-file-code"></i> Edit Configuration</h3>
    <div style="margin-bottom: 15px;">
        <strong id="config-module-name"></strong>
        <button onclick="closeConfigEditor()" class="btn-secondary" style="float: right;">
            <i class="fa fa-xmark"></i> Close
        </button>
    </div>

    <textarea id="config-content" style="width: 100%; min-height: 400px; font-family: monospace; padding: 15px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;"></textarea>

    <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button onclick="saveConfig()" class="btn-primary">
            <i class="fa fa-save"></i> Save Configuration
        </button>
        <button onclick="resetConfig()" class="btn-danger">
            <i class="fa fa-rotate-left"></i> Reset to Default
        </button>
    </div>
</div>

<script>
// Avoid redeclaration errors when navigating between pages
if (typeof window.currentModule === 'undefined') {
    window.currentModule = null;
}

async function loadConfigModules() {
    try {
        const modules = ['main', 'firewall', 'feeds', 'fail2ban', 'portscan', 'ddos', 'geoip'];
        let html = '';

        modules.forEach(module => {
            html += `
                <div style="background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h4>${module.charAt(0).toUpperCase() + module.slice(1)} Configuration</h4>
                        <p style="font-size: 13px; color: var(--text-muted);">/etc/nftban/${module}.conf</p>
                    </div>
                    <button onclick="editConfig('${module}')" class="btn-primary">
                        <i class="fa fa-edit"></i> Edit
                    </button>
                </div>
            `;
        });

        document.getElementById('config-modules').innerHTML = html;
    } catch (error) {
        console.error('Failed to load config modules:', error);
    }
}

async function editConfig(module) {
    window.currentModule = module;

    try {
        const response = await apiRequest(`/config/${module}`);

        document.getElementById('config-module-name').textContent = `${module}.conf`;
        document.getElementById('config-content').value = response.data || '';
        document.getElementById('config-editor').style.display = 'block';

        // Scroll to editor
        document.getElementById('config-editor').scrollIntoView({ behavior: 'smooth' });
    } catch (error) {
        alert(`Failed to load configuration: ${error.message}`);
    }
}

function closeConfigEditor() {
    document.getElementById('config-editor').style.display = 'none';
    window.currentModule = null;
}

async function saveConfig() {
    if (!window.currentModule) return;

    const content = document.getElementById('config-content').value;

    if (!confirm('Save configuration changes?')) return;

    try {
        await apiRequest(`/config/${window.currentModule}`, {
            method: 'POST',
            body: JSON.stringify({ content })
        });

        alert('Configuration saved successfully. You may need to reload NFTBan for changes to take effect.');
        closeConfigEditor();
    } catch (error) {
        alert(`Failed to save configuration: ${error.message}`);
    }
}

async function resetConfig() {
    if (!window.currentModule) return;

    if (!confirm(`Reset ${window.currentModule}.conf to default settings? This cannot be undone.`)) return;

    try {
        await apiRequest(`/config/${window.currentModule}/reset`, { method: 'POST' });
        alert('Configuration reset to defaults');
        editConfig(window.currentModule); // Reload
    } catch (error) {
        alert(`Failed to reset configuration: ${error.message}`);
    }
}

// Initialize
loadConfigModules();
</script>
