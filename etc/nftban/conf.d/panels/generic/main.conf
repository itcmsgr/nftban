# =============================================================================
# NFTBan Generic Web Hosting Server Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Generic web hosting server firewall configuration (no control panel)
#
# File: /etc/nftban/conf.d/panels/generic/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# GENERIC SERVER CONFIGURATION
# -----------------------------------------------------------------------------

# Generic server type (custom/manual)
NFTBAN_GENERIC_TYPE="generic"

# Custom panel port (if any)
NFTBAN_GENERIC_PANEL_PORT=""

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
#
# -----------------------------------------------------------------------------
# Based on standard web hosting server requirements
# Minimal set of ports for basic web/email/DNS services

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995)
NFTBAN_GENERIC_TCP_IN="20,21,25,53,80,110,143,443,465,587,993,995"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SSH(22), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        Ident(113), HTTPS(443), Submission(587), IMAPS(993), POP3S(995)
NFTBAN_GENERIC_TCP_OUT="20,21,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_GENERIC_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123)
NFTBAN_GENERIC_UDP_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
#
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

# TCP INPUT (incoming connections) - IPv6
NFTBAN_GENERIC_TCP6_IN="20,21,25,53,80,110,143,443,465,587,993,995"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_GENERIC_TCP6_OUT="20,21,25,53,80,110,113,443,587,993,995"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_GENERIC_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_GENERIC_UDP6_OUT="20,21,53,113,123"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_GENERIC_CUSTOM_TCP_IN="3306,5432,8080"  # MySQL, PostgreSQL, Custom

NFTBAN_GENERIC_CUSTOM_TCP_IN=""
NFTBAN_GENERIC_CUSTOM_TCP_OUT=""
NFTBAN_GENERIC_CUSTOM_UDP_IN=""
NFTBAN_GENERIC_CUSTOM_UDP_OUT=""

NFTBAN_GENERIC_CUSTOM_TCP6_IN=""
NFTBAN_GENERIC_CUSTOM_TCP6_OUT=""
NFTBAN_GENERIC_CUSTOM_UDP6_IN=""
NFTBAN_GENERIC_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# Generic SSH login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_SSH_ENABLED="true"

# Log file location
LOGIN_SERVICE_SSH_LOG="/var/log/auth.log"
LOGIN_SERVICE_SSH_SECURE="/var/log/secure"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Enable SSH key-based authentication
# • Disable root login via SSH
# • Enable login monitoring (automatic brute-force protection)
# • Configure fail2ban for additional protection
# • Use SSL/TLS for all services (HTTPS, SMTPS, IMAPS, POP3S)
# • Keep system and packages updated regularly
# • Configure ModSecurity for web application firewall
# • Implement rate limiting for web services
# • Monitor logs regularly for suspicious activity
# • Use strong passwords and consider 2FA where available

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
