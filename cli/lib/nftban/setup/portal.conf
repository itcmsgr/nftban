#
# NFTBan Portal Configuration (pro.nftban.com)
# =============================================================================
# This file configures export to the NFTBan Portal for centralized metrics
# aggregation, fleet management, and cross-server analytics.
#
# Copy to /etc/nftban/conf.d/portal.conf and configure your API key.
# =============================================================================

# Enable/disable portal export (default: false)
NFTBAN_PORTAL_ENABLED="false"

# Portal API endpoint
# Default: https://pro.nftban.com/api/v1/ingest
NFTBAN_PORTAL_URL="https://pro.nftban.com/api/v1/ingest"

# API key for authentication (required)
# Obtain from: https://pro.nftban.com/settings/api-keys
NFTBAN_PORTAL_API_KEY=""

# Request timeout in seconds (default: 30)
NFTBAN_PORTAL_TIMEOUT="30"

# Server location (optional, for inventory)
# Example: "US-East", "Frankfurt DC1", "AWS us-east-1"
# NFTBAN_SERVER_LOCATION=""

# =============================================================================
# Export Frequency
# =============================================================================
# Portal export follows the unified exporter schedule:
# - LIVE metrics:      Every 60 seconds
# - EXTENDED metrics:  Every 5 minutes (300 seconds)
# - INVENTORY metrics: Every 1 hour (3600 seconds)
#
# The portal receives all metric categories in a single payload per export.
# Server inventory (hardware, OS, network) is included hourly.

# =============================================================================
# ACK Semantics
# =============================================================================
# Portal uses REAL_ACK: HTTP 2xx response confirms successful ingestion.
# Failed exports are logged and counted in reconciliation metrics:
#   - nftban_export_attempts_total{target="portal"}
#   - nftban_export_success_total{target="portal"}
#   - nftban_export_failures_total{target="portal"}
#   - nftban_export_last_success_timestamp{target="portal"}
#   - nftban_export_duration_ms{target="portal"}

# =============================================================================
# Host Identification
# =============================================================================
# Each server is identified by a unique host_key:
# 1. /etc/machine-id (preferred, stable across reboots)
# 2. SHA256(MAC address + hostname) (fallback)
#
# The host_key is sent in X-NFTBan-Host-Key header and used for:
# - Server inventory upsert (nftban_host table)
# - Module status tracking (nftban_host_module table)
# - Export result correlation (nftban_host_export_target table)
