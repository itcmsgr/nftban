# -----------------------------------------------------------------------------
# MODULE ENABLE/DISABLE
# -----------------------------------------------------------------------------
# Master switch for DDoS protection
# Default: false (enable with 'nftban ddos enable')
DDOS_ENABLED="false"

# -----------------------------------------------------------------------------
# MODE SELECTION
# -----------------------------------------------------------------------------
# Choose DDoS detection mode:
#
#   auto     - Auto-detect: use Suricata if available, otherwise Classic
#   classic  - Force Classic mode (nftables-only, no IDS)
#   suricata - Force Suricata mode (requires Suricata installed & running)
#   hybrid   - Use both: Classic as Layer 0 + Suricata as Layer 1
#
DDOS_MODE="auto"

# -----------------------------------------------------------------------------
# AUTO-DETECTION SETTINGS
# -----------------------------------------------------------------------------
# How to detect if Suricata is available

# Check if Suricata service is running
DDOS_AUTO_CHECK_SERVICE="true"

# Check if Suricata binary exists
DDOS_AUTO_CHECK_BINARY="true"

# Check if EVE JSON file exists and is being written to
DDOS_AUTO_CHECK_EVE_FILE="true"

# Suricata service name (for systemctl check)
DDOS_SURICATA_SERVICE_NAME="suricata"

# Suricata binary path (for existence check)
DDOS_SURICATA_BINARY="/usr/bin/suricata"

# EVE file freshness threshold (seconds) - file must be updated within this time
DDOS_EVE_FRESHNESS_THRESHOLD="60"

# -----------------------------------------------------------------------------
# HYBRID MODE SETTINGS
# -----------------------------------------------------------------------------
# When DDOS_MODE="hybrid", both Classic and Suricata run together

# Classic mode acts as Layer 0 (hard rate limits)
# Suricata mode acts as Layer 1 (signature-based detection)

# Enable Classic Layer 0 even in Suricata mode
DDOS_HYBRID_CLASSIC_LAYER0="true"

# Classic Layer 0 uses stricter thresholds (multiplier)
DDOS_HYBRID_CLASSIC_MULTIPLIER="0.5"

# -----------------------------------------------------------------------------
# NFTABLES SETTINGS
# -----------------------------------------------------------------------------
# Chain and table names

DDOS_NFT_TABLE_IPV4="ip nftban"
DDOS_NFT_TABLE_IPV6="ip6 nftban"
DDOS_NFT_CHAIN="ddos_protection"

# Position in input chain (after which rule to insert jump)
# Options: "established" (after ct state established,related)
#          "whitelist"   (after whitelist check)
#          "first"       (at the beginning)
DDOS_NFT_JUMP_POSITION="established"

# -----------------------------------------------------------------------------
# WHITELIST
# -----------------------------------------------------------------------------
# IPs/networks that should NEVER be blocked by DDoS protection
#
# NOTE: Whitelist is now CENTRALIZED in /etc/nftban/whitelist.d/*.conf
# Use: nftban whitelist add <ip> [comment]
# All modules share the same whitelist (SINGLE SOURCE OF TRUTH)

# Auto-whitelist localhost
DDOS_WHITELIST_LOCALHOST="true"

# Auto-whitelist private networks (RFC1918)
DDOS_WHITELIST_PRIVATE="false"

# Auto-whitelist Cloudflare IPs
DDOS_WHITELIST_CLOUDFLARE="false"

# -----------------------------------------------------------------------------
# GLOBAL LIMITS (Safety Net)
# -----------------------------------------------------------------------------
# Maximum IPs to block (prevent runaway blocking)
DDOS_MAX_BLOCKED_IPS="10000"

# Maximum block duration (seconds) - safety cap
DDOS_MAX_BAN_DURATION="86400"

# Minimum time between blocks of same IP (seconds)
DDOS_MIN_REBLOCK_INTERVAL="60"

# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
# Alert on significant events

# Enable email notifications
DDOS_NOTIFY_EMAIL="false"
DDOS_NOTIFY_EMAIL_TO=""

# Enable webhook notifications
DDOS_NOTIFY_WEBHOOK="false"
DDOS_NOTIFY_WEBHOOK_URL=""

# Threshold for notification (minimum score or block count)
DDOS_NOTIFY_THRESHOLD="0.80"

# =============================================================================
# END OF MAIN CONFIGURATION
# =============================================================================
