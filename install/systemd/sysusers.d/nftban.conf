# =============================================================================
# NFTBan 3-Group Security Model
# =============================================================================
#   nftban:         Admin/Operator (full access, config, service management)
#   nftban-auditor: Read-only (reports, logs, status - NO actions)
#   nftban-panel:   Panel Operator (ban/unban/status - NO config/restart)
# =============================================================================

# Groups
g nftban - "NFTBan admin/operator group (full access)"
g nftban-auditor - "NFTBan auditor group (read-only report access)"
g nftban-panel - "NFTBan panel integration group (operator actions only)"

# Users
u nftban - "NFTBan service account" /var/lib/nftban /usr/sbin/nologin

# Group memberships
# - nftban service user is member of nftban-auditor for log access
m nftban nftban-auditor
