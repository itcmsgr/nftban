# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Master switch for trust module
# When false, all trusted provider whitelists are ignored
TRUST_ENABLED="true"

# Auto-update enabled providers (daily via cron/timer)
TRUST_AUTO_UPDATE="true"

# Auto-update interval in hours (default: 24 = daily)
TRUST_AUTO_UPDATE_INTERVAL="24"

# Log file location
TRUST_LOG_FILE="/var/log/nftban/trust.log"

# Cache directory for downloaded IP ranges
TRUST_CACHE_DIR="/var/cache/nftban/trust"

# Data directory for persistent state
TRUST_DATA_DIR="/var/lib/nftban/trust"

# =============================================================================
# CLOUDFLARE SETTINGS
# =============================================================================

# Enable Cloudflare IP whitelist
# Use: nftban trust enable CLOUDFLARE
TRUST_CLOUDFLARE_ENABLED="false"

# Cloudflare IPv4 source URL
TRUST_CLOUDFLARE_IPV4_URL="https://www.cloudflare.com/ips-v4"

# Cloudflare IPv6 source URL
TRUST_CLOUDFLARE_IPV6_URL="https://www.cloudflare.com/ips-v6"

# Enable IPv4 ranges
TRUST_CLOUDFLARE_IPV4="true"

# Enable IPv6 ranges
TRUST_CLOUDFLARE_IPV6="true"

# =============================================================================
# AWS SETTINGS
# =============================================================================

# Enable AWS IP whitelist
# Use: nftban trust enable AWS
TRUST_AWS_ENABLED="false"

# AWS IP ranges source URL (JSON format)
TRUST_AWS_URL="https://ip-ranges.amazonaws.com/ip-ranges.json"

# Filter by AWS service (empty = all services)
# Examples: CLOUDFRONT, EC2, S3, ROUTE53
TRUST_AWS_SERVICES=""

# Filter by AWS region (empty = all regions)
# Examples: us-east-1, eu-west-1, ap-southeast-1
TRUST_AWS_REGIONS=""

# =============================================================================
# GOOGLE CLOUD SETTINGS
# =============================================================================

# Enable Google Cloud IP whitelist
# Use: nftban trust enable GOOGLE
TRUST_GOOGLE_ENABLED="false"

# Google Cloud IP ranges source URL
TRUST_GOOGLE_URL="https://www.gstatic.com/ipranges/cloud.json"

# =============================================================================
# AZURE SETTINGS
# =============================================================================

# Enable Microsoft Azure IP whitelist
# Use: nftban trust enable AZURE
TRUST_AZURE_ENABLED="false"

# Azure IP ranges source URL (updated weekly by Microsoft)
# Note: URL changes monthly, check Microsoft docs for latest
TRUST_AZURE_URL=""

# =============================================================================
# DIGITALOCEAN SETTINGS
# =============================================================================

# Enable DigitalOcean IP whitelist
# Use: nftban trust enable DIGITALOCEAN
TRUST_DIGITALOCEAN_ENABLED="false"

# DigitalOcean IP ranges source URL
TRUST_DIGITALOCEAN_URL="https://digitalocean.com/geo/google.csv"

# =============================================================================
# FASTLY SETTINGS
# =============================================================================

# Enable Fastly CDN IP whitelist
# Use: nftban trust enable FASTLY
TRUST_FASTLY_ENABLED="false"

# Fastly IP ranges source URL
TRUST_FASTLY_URL="https://api.fastly.com/public-ip-list"

# =============================================================================
# QUIC.CLOUD / LITESPEED SETTINGS
# =============================================================================

# Enable QUIC.cloud (LiteSpeed CDN) IP whitelist
# Use: nftban trust enable QUICCLOUD
TRUST_QUICCLOUD_ENABLED="false"

# QUIC.cloud IP ranges source URL (HTML format, individual IPs)
TRUST_QUICCLOUD_URL="https://quic.cloud/ips"

# =============================================================================
# VALIDATION SETTINGS
# =============================================================================

# Minimum number of IP ranges to accept (prevents empty/broken downloads)
TRUST_MIN_RANGES="5"

# Maximum number of IP ranges to accept (prevents garbage data)
TRUST_MAX_RANGES="50000"

# Timeout for HTTP downloads in seconds
TRUST_DOWNLOAD_TIMEOUT="60"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
