# =============================================================================
# NFTBan Commands Registry v1.0
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Single source of truth for all CLI commands
#
# This registry drives:
#   - CLI help output (task-grouped)
#   - Wiki documentation (operator/auditor/panel)
#   - Bash completion
#   - RBAC enforcement
#   - Man page generation
#
# Schema Version: 1.1
# Last Updated: 2026-02-09
# =============================================================================

# =============================================================================
# SCHEMA REFERENCE
# =============================================================================
# category: setup_discovery | immediate_action | active_protection |
#           infrastructure | intelligence_reporting | developer_sysadmin
#
# risk: core (safe, essential) | setup (one-time) | advanced (use with caution)
#
# audience: [cli, auditor, panel] - who can see this command
#
# capability: status_read | stats_read | report_read | logs_read |
#             config_view | service_control | enforcement | policy_change |
#             debug_internal
#
# mutates: true (changes state) | false (read-only) | conditional
#
# supports_dry_run: true | false - can preview without executing
#
# requires_root: true | false - needs root/sudo privileges
#
# panel_expose: true | false - can hosting panels call this?
#
# output_modes: [json, text] - supported output formats
#
# has_json: true | false - current --json implementation status
# =============================================================================

# =============================================================================
# GLOBAL OPTIONS (inherited by all commands)
# =============================================================================
# These options are available to ALL commands and don't need to be repeated
# in each command's options section. CLI parsers should handle these first.

global_options:
  --help:
    aliases: ["-h", "help"]
    type: bool
    description: "Show command help and usage information"
    pattern: "help|-h|--help"
  --version:
    aliases: ["-V"]
    type: bool
    description: "Show version information"
    note: "Use -V to avoid conflict with -v for verbose"
  --json:
    aliases: ["-j"]
    type: bool
    description: "Output in JSON format (machine-readable)"
    pattern: "--json|-j"
  --quiet:
    aliases: ["-q"]
    type: bool
    description: "Suppress informational messages and tips"
    pattern: "--quiet|-q"
  --verbose:
    type: bool
    description: "Enable verbose/debug output"
  --dry-run:
    type: bool
    description: "Preview changes without executing (where supported)"
  --force:
    aliases: ["-f"]
    type: bool
    description: "Skip confirmation prompts"
    pattern: "--force|-f"

# Standard parameter patterns (for reference in command definitions)
standard_params:
  time_range:
    --since: {type: string, format: "YYYY-MM-DD", description: "Start date"}
    --until: {type: string, format: "YYYY-MM-DD", description: "End date"}
    --last:
      type: string
      values: ["1h", "24h", "7d", "30d"]
      description: "Relative time period"
  output:
    --format:
      type: enum
      values: ["json", "csv", "text", "html"]
      description: "Output format"
    --output: {aliases: ["-o"], type: string, description: "Output file path"}
  filtering:
    --type: {aliases: ["-t"], type: string, description: "Filter by type"}
    --source: {type: string, description: "Filter by source module"}

# =============================================================================
# GROUP 0: SETUP & DISCOVERY
# =============================================================================

setup:
  category: setup_discovery
  description: "Initial system setup and configuration"
  risk: setup
  audience: [cli]
  capability: policy_change
  mutates: true
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban setup"
    - "nftban setup --auto"
  subcommands:
    - install
    - configure
    - wizard

wizard:
  category: setup_discovery
  description: "Interactive setup wizard for first-time configuration"
  risk: setup
  audience: [cli]
  capability: policy_change
  mutates: true
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [text]
  has_json: false
  examples:
    - "nftban wizard"

menu:
  category: setup_discovery
  description: "Interactive TUI menu for system management"
  risk: core
  audience: [cli]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: false
  output_modes: [text]
  has_json: false
  examples:
    - "nftban menu"

status:
  category: setup_discovery
  description: "Global system status overview"
  risk: core
  audience: [cli, auditor, panel]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  # options: inherits global_options (--json, --quiet)
  examples:
    - "nftban status"
    - "nftban status --json"
    - "nftban status --quiet"

health:
  category: setup_discovery
  description: "System health check and auto-repair diagnostics"
  risk: core
  audience: [cli, auditor, panel]
  capability: status_read
  mutates: conditional
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  # options: inherits global_options (--json)
  examples:
    - "nftban health check"
    - "nftban health fix"
    - "nftban health summary"
    - "nftban health registries"
    - "nftban health install"
    - "nftban health conflicts"
    - "nftban health conflicts --fix"
    - "nftban health --json"
  subcommands:
    check:
      mutates: false
      description: "Run health diagnostics"
      options:
        --auto-heal:
          type: bool
          description: "Auto-fix issues via polkit"
        --quiet:
          type: bool
          description: "Minimal output for cron"
        --cache-status:
          type: bool
          description: "Write status to cache"
    fix:
      mutates: true
      description: "Auto-repair detected issues"
      requires_root: true
      arguments:
        target:
          type: enum
          required: false
          values: [permissions, directories, services, config, all]
          default: all
    summary:
      mutates: false
      description: "One-line health summary"
    services:
      mutates: false
      description: "Check service status"
    permissions:
      mutates: false
      description: "Verify file permissions"
    geoip:
      mutates: false
      description: "Check GeoIP system status"
    pro:
      mutates: false
      description: "Check Pro subscription status"
    registries:
      mutates: false
      description: "Validate registry files (commands, config, reports)"
      options:
        --json: {type: bool, description: "Machine-readable output"}
    install:
      mutates: false
      description: "Verify installation completeness"
      options:
        --verbose:
          type: bool
          alias: "-v"
          description: "Show detailed output"
    conflicts:
      mutates: conditional
      description: "Detect and remove conflicting firewalls"
      requires_root: true
      options:
        --fix:
          type: bool
          description: "Remove detected conflicts"
        --yes:
          type: bool
          alias: "-y"
          description: "Auto-confirm"
    config:
      mutates: false
      description: "Show enabled modules and config status"
      options:
        --verbose:
          type: bool
          alias: "-v"
          description: "Include config paths"
    analysis:
      mutates: false
      description: "Run deep health analysis with recommendations"
      options:
        --json: {type: bool, description: "Output in JSON format"}
        --verbose: {type: bool, description: "Show detailed analysis"}
    components:
      mutates: false
      description: "Check health of individual NFTBan components"
      options:
        --json: {type: bool, description: "Output in JSON format"}
    core:
      mutates: false
      description: "Check core system health (nftables, services, permissions)"
      options:
        --json: {type: bool, description: "Output in JSON format"}

version:
  category: setup_discovery
  description: "Display NFTBan version information"
  risk: core
  audience: [cli, auditor, panel]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  options:
    # Global: --json (inherited)
    --short:
      type: bool
      required: false
      description: "Output version number only"
  examples:
    - "nftban version"
    - "nftban version --json"

validate:
  category: setup_discovery
  description: "Validate firewall structure and configuration"
  risk: core
  audience: [cli, auditor]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban validate"
    - "nftban validate all"
    - "nftban validate firewall"
    - "nftban validate --json"
  subcommands:
    - all
    - firewall
    - config
    - permissions

sync:
  category: setup_discovery
  description: "Synchronize and apply firewall rules"
  risk: advanced
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [text]
  has_json: false
  examples:
    - "nftban sync"
    - "nftban sync --dry-run"

modes:
  category: setup_discovery
  description: "Show detection modes overview across all protection modules"
  risk: core
  audience: [cli]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban modes"
    - "nftban modes --json"

preflight:
  category: setup_discovery
  description: "Pre-installation system checks and compatibility validation"
  risk: core
  audience: [cli]
  capability: status_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban preflight"
    - "nftban preflight --strict"
    - "nftban preflight --json"
  options:
    --strict:
      type: bool
      description: "Fail on any warning (not just errors)"
    --json:
      type: bool
      description: "Output in JSON format"
  subcommands:
    check:
      mutates: false
      description: "Run all preflight checks"
    firewall:
      mutates: false
      description: "Check for conflicting firewall software"
    dependencies:
      mutates: false
      description: "Verify required dependencies are installed"
    permissions:
      mutates: false
      description: "Check filesystem permissions"
    network:
      mutates: false
      description: "Validate network configuration"

# =============================================================================
# GROUP 1: IMMEDIATE ACTION
# =============================================================================

ban:
  category: immediate_action
  description: "Ban an IP address immediately"
  risk: core
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  arguments:
    ip:
      type: string
      required: true
      description: "IP address to ban (IPv4 or IPv6)"
  options:
    # Global: --json (inherited)
    --timeout:
      type: int
      required: false
      description: "Temporary ban duration in seconds (omit for permanent)"
    --reason:
      type: string
      required: false
      description: "Ban reason (stored as comment)"
    --source:
      type: string
      required: false
      default: "manual"
      description: "Ban source (login, portscan, ddos, manual)"
  examples:
    - "nftban ban 1.2.3.4"
    - "nftban ban 1.2.3.4 --timeout 3600"
    - "nftban ban 1.2.3.4 --reason 'brute force attack'"
    - "nftban ban 1.2.3.4 --source manual --json"

unban:
  category: immediate_action
  description: "Remove IP ban"
  risk: core
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  arguments:
    ip:
      type: string
      required: true
      description: "IP address to unban (IPv4 or IPv6)"
  options:
    --json:
      type: bool
      required: false
      description: "Output in JSON format"
  examples:
    - "nftban unban 1.2.3.4"
    - "nftban unban 1.2.3.4 --json"

check:
  category: immediate_action
  description: "Check if IP or port is blocked"
  risk: core
  audience: [cli, auditor, panel]
  capability: logs_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  arguments:
    target:
      type: string
      required: true
      description: "IP address or 'port' keyword with port number"
  options:
    --json:
      type: bool
      required: false
      description: "Output in JSON format"
  examples:
    - "nftban check 1.2.3.4"
    - "nftban check port 22"
    - "nftban check 1.2.3.4 --json"

search:
  category: immediate_action
  description: "Search for IP across all sets and logs"
  risk: core
  audience: [cli, auditor, panel]
  capability: logs_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  arguments:
    ip:
      type: string
      required: true
      description: "IP address to search for"
  options:
    --json:
      type: bool
      required: false
      description: "Output in JSON format"
  examples:
    - "nftban search 1.2.3.4"
    - "nftban search 1.2.3.4 --json"

list:
  category: immediate_action
  description: "List banned/whitelisted IPs"
  risk: core
  audience: [cli, auditor, panel]
  capability: logs_read
  mutates: false
  supports_dry_run: false
  requires_root: false
  panel_expose: true
  output_modes: [json, text]
  has_json: true
  arguments:
    type:
      type: enum
      required: false
      default: "banned"
      values: [banned, whitelist, all]
      description: "List type"
  # options: inherits global_options (--json)
  examples:
    - "nftban list banned"
    - "nftban list whitelist"
    - "nftban list all"
    - "nftban list --json"

whitelist:
  category: immediate_action
  description: "Manage IP whitelist (never block)"
  risk: core
  audience: [cli]
  capability: policy_change
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  subcommands:
    add:
      mutates: true
      description: "Add IP to whitelist"
      arguments:
        ip:
          type: string
          required: true
          description: "IP address to whitelist"
    remove:
      mutates: true
      description: "Remove IP from whitelist"
      aliases: [rm, del, delete]
      arguments:
        ip:
          type: string
          required: true
          description: "IP address to remove"
    list:
      mutates: false
      description: "Show all whitelisted IPs"
      aliases: [show]
      options:
        --json: {type: bool, description: "Output in JSON format"}
    sync:
      mutates: true
      description: "Auto-detect and whitelist system IPs"
  examples:
    - "nftban whitelist add 10.0.0.1"
    - "nftban whitelist remove 10.0.0.1"
    - "nftban whitelist list"
    - "nftban whitelist show --json"

whitelist-system:
  category: immediate_action
  description: "Auto-whitelist system infrastructure IPs"
  risk: advanced
  audience: [cli]
  capability: policy_change
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban whitelist-system"
    - "nftban whitelist-system --dry-run"
    - "nftban whitelist-system --json"

flush:
  category: immediate_action
  description: "Emergency flush/reset of nftables sets"
  risk: advanced
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban flush blacklist"
    - "nftban flush whitelist"
    - "nftban flush feeds"
    - "nftban flush geoban"
    - "nftban flush all"
    - "nftban flush blacklist --dry-run"
  subcommands:
    blacklist: {description: "Flush all banned IPs from blacklist set"}
    whitelist: {description: "Flush all whitelisted IPs"}
    feeds: {description: "Flush all threat feed IPs"}
    geoban: {description: "Flush all geoban entries"}
    all: {description: "Flush all nftables sets (emergency reset)"}

cleanup:
  category: immediate_action
  description: "Manage and evict old permanent bans to free memory"
  risk: advanced
  audience: [cli]
  capability: enforcement
  mutates: conditional
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  options:
    --stats:
      type: bool
      description: "Show permanent ban statistics"
    --dry-run:
      type: bool
      description: "Preview which IPs would be evicted"
    --execute:
      type: bool
      description: "Actually evict old bans"
    --count: {type: int, required: false, description: "Process up to N IPs"}
    --json: {type: bool, required: false, description: "Output in JSON format"}
  examples:
    - "nftban cleanup --stats"
    - "nftban cleanup --dry-run"
    - "nftban cleanup --execute --count 100"

protect:
  category: immediate_action
  description: "Mark a permanent ban as protected from auto-eviction"
  risk: core
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  arguments:
    ip: {type: string, required: true, description: "IP address to protect"}
  examples:
    - "nftban protect 1.2.3.4"
    - "nftban protect 1.2.3.4 --json"

unprotect:
  category: immediate_action
  description: "Remove protection from a permanent ban to allow auto-eviction"
  risk: core
  audience: [cli]
  capability: enforcement
  mutates: true
  supports_dry_run: false
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  arguments:
    ip: {type: string, required: true, description: "IP address to unprotect"}
  examples:
    - "nftban unprotect 1.2.3.4"
    - "nftban unprotect 1.2.3.4 --json"

# =============================================================================
