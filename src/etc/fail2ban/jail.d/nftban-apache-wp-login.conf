# NFTBan Fail2ban Jail - WordPress Login Attacks
#
# Monitors Apache logs for WordPress wp-login.php brute force attacks.
# Detects repeated POST requests to the WordPress login page.
#
# Configuration:
# - maxretry: 10 POST requests to wp-login.php
# - findtime: 20 minutes (1200 seconds)
# - bantime: 2 hours
#
# Uses custom NFTBan filter
# Based on DirectAdmin production configuration

[nftban-apache-wp-login]

# Disabled by default - enable if WordPress is hosted
enabled   = false

# HTTP/HTTPS ports
port      = http,https

# Use NFTBan custom wp-login filter
filter    = nftban-apache-wp-login

# Apache access log location (supports wildcards)
logpath   = /var/log/httpd/domains/*.log
            /var/log/apache2/domains/*.log
            /var/log/httpd/*access*.log
            /var/log/httpd/*access_log
            /var/log/apache2/*access*.log
            /var/log/apache2/*access_log

# Slightly higher threshold for login page
maxretry  = 10
findtime  = 20m

# Medium ban (2 hours)
bantime   = 2h

# Use NFTBan action
action    = nftban[name=apache-wp-login]
