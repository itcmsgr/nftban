# NFTBan Fail2ban Jail - Exim Mail Server
#
# Monitors Exim mail server logs for authentication failures
# and spam attempts. Protects SMTP, POP3, and IMAP ports.
#
# Configuration:
# - maxretry: 15 (more lenient for legitimate mail servers)
# - findtime: 10 minutes
# - bantime: 1 day
#
# Based on DirectAdmin production configuration

[nftban-exim]

# Disabled by default - enable if Exim is installed
enabled   = false

# Monitor multiple mail service ports
port      = smtp,ssmtp,pop3,pop3s,imap,imaps,submission

# Use standard Exim filter
filter    = exim

# Exim main log location
logpath   = /var/log/exim/mainlog
            /var/log/exim4/mainlog

# More lenient for mail servers (legitimate retries are common)
maxretry  = 15
findtime  = 10m

# Longer ban for mail abuse (1 day)
bantime   = 1d

# Use NFTBan action
action    = nftban[name=exim]
