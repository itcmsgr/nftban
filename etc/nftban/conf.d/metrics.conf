# =============================================================================
# NFTBan v1.5.0 - Unified Metrics Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Centralized metrics collection and export settings
#
# IMPORTANT: Do NOT edit this file - it will be overwritten on updates!
# Create /etc/nftban/conf.d/metrics.conf.local for your customizations.
#
# meta:name="metrics.conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2026-01-25"
# meta:description="Unified metrics collection and export configuration"
# meta:inventory.files="/var/cache/nftban/metrics/"
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units="nftban-unified-exporter.timer"
# meta:inventory.network=""
# meta:inventory.privileges="user"
# =============================================================================
#
# QUICK SETUP:
# ------------
# 1. Create /etc/nftban/conf.d/metrics.conf.local with your settings
# 2. Enable the timer: systemctl enable --now nftban-unified-exporter.timer
# 3. Check status: nftban metrics status
#
# Example metrics.conf.local:
#   NFTBAN_METRICS_ENABLED="true"
#   NFTBAN_COLLECT_SURICATA="disabled"   # Suricata not installed
#
# =============================================================================

# =============================================================================
# UNIFIED COLLECTOR - MAIN SETTINGS
# =============================================================================

# Master switch for metrics collection
# When false, all collection is disabled
NFTBAN_METRICS_ENABLED="false"

# Collection mode: unified (recommended) or legacy
# - unified:  Single collector, export to all targets (66% less overhead)
# - legacy:   Separate collectors per target (deprecated)
NFTBAN_METRICS_MODE="unified"

# =============================================================================
# METRICS BACKEND CONFIGURATION
# =============================================================================
# Prometheus is the supported metrics backend.

# Backend type: prometheus
NFTBAN_METRICS_BACKEND="prometheus"

# Backend endpoints (for health checks and status commands)
NFTBAN_METRICS_PROMETHEUS_ADDR="localhost:9090"
NFTBAN_METRICS_NODE_EXPORTER_ADDR="localhost:9100"

# External TSDB hint (informational - configure actual retention in your TSDB)
NFTBAN_METRICS_RETENTION_HINT="90d"

# =============================================================================
# REMOTE METRICS SUBMISSION
# =============================================================================
# Remote mode controls how metrics data leaves this host:
#   none  - Local only (default). Data stays on this server.
#   user  - Custom backend. You provide a Prometheus remote_write endpoint.
#   pro   - NFTBan Pro. Managed by the nftban-pro module.
#           Pro mode is automatically set when nftban-pro is installed.
#           Do NOT set this manually - use: nftban pro enable
#
# Note: In "pro" mode, the nftban-pro module reads local data files
# (bans.log, metrics cache, reports) and submits aggregated context
# bundles to pro.nftban.com. The unified exporter is NOT involved
# in Pro submission - it continues to collect and export locally.
# Pro configuration is in /etc/nftban/nftban.conf (NFTBAN_PRO_* vars).
NFTBAN_METRICS_REMOTE_MODE="none"

# For remote mode "user" - custom Prometheus remote_write backend
# Ignored when mode is "none" or "pro"
NFTBAN_METRICS_REMOTE_WRITE_URL=""
NFTBAN_METRICS_REMOTE_WRITE_TOKEN_FILE=""
NFTBAN_METRICS_EXTERNAL_LABELS=""

# =============================================================================
# COLLECTION INTERVALS
# =============================================================================

# Base collection interval in seconds (live metrics)
# Metrics: daemon, bans, memory, nftables, connections
NFTBAN_COLLECT_INTERVAL="60"

# Extended metrics multiplier (default: 5 = every 5th run = 5 min)
# Metrics: module_status, feed_health, watchdog, eventbus
NFTBAN_COLLECT_EXTENDED_MULT="5"

# Inventory metrics multiplier (default: 60 = every 60th run = 1 hour)
# Metrics: kernel, geoip, server_info, static config
NFTBAN_COLLECT_INVENTORY_MULT="60"

# =============================================================================
# COMPONENT AUTO-DETECTION
# =============================================================================
# Controls which metrics are collected
# Options: auto, enabled, disabled
#   - auto:     Detect if component is installed/enabled (recommended)
#   - enabled:  Always collect (even if component not detected)
#   - disabled: Never collect
#
# "auto" detection checks:
#   - Suricata: /usr/bin/suricata AND /etc/nftban/modules/suricata.conf
#   - Feeds:    /etc/nftban/feeds/*.conf exists
#   - GeoIP:    /etc/nftban/modules/geoban.conf AND mmdb database
#   - Watchdog: /run/nftban/watchdog.status exists
#   - Portscan: /etc/nftban/modules/portscan.conf
#   - EventBus: nftban daemon running with eventbus enabled

# Suricata IDS metrics (alerts, rules, categories)
NFTBAN_COLLECT_SURICATA="auto"

# Threat feeds metrics (sync status, IP counts)
NFTBAN_COLLECT_FEEDS="auto"

# GeoIP/Geoban metrics (database age, blocked countries)
NFTBAN_COLLECT_GEOIP="auto"

# Watchdog metrics (pressure scores, mode changes)
NFTBAN_COLLECT_WATCHDOG="auto"

# Port scan detection metrics
NFTBAN_COLLECT_PORTSCAN="auto"

# Event bus metrics (queue size, event counts)
NFTBAN_COLLECT_EVENTBUS="auto"

# Kernel metrics (conntrack, softnet stats)
NFTBAN_COLLECT_KERNEL="auto"

# Network metrics (bandwidth, connections)
NFTBAN_COLLECT_NETWORK="enabled"

# =============================================================================
# EXPORT TARGETS
# =============================================================================
# Each target can be enabled/disabled independently
# When NFTBAN_METRICS_MODE="unified", all targets share same collection data

# --- Prometheus Export ---
# Prometheus export is an OPTIONAL compatibility adapter for users who want to
# integrate NFTBan metrics into their existing Prometheus/Grafana stack.
# NFTBan does NOT require Prometheus - it includes its own complete metrics
# system (stats.json + bans.log) that works out of the box.
#
# Auto-detection: If node_exporter textfile_collector directory exists and this
# setting is not explicitly configured, Prometheus export will auto-enable.
# Set to "false" to disable even when node_exporter is detected.
#
# Writes to node_exporter textfile collector
NFTBAN_EXPORT_PROMETHEUS="false"
NFTBAN_PROMETHEUS_TEXTFILE_DIR="/var/lib/node_exporter/textfile_collector"
NFTBAN_PROMETHEUS_OUTPUT_FILE="nftban.prom"

# --- JSON Cache Export ---
# Always enabled - used by CLI and API
NFTBAN_EXPORT_JSON="true"
NFTBAN_JSON_CACHE_DIR="/var/cache/nftban/metrics"
NFTBAN_JSON_DYNAMIC_FILE="dynamic.json"
NFTBAN_JSON_INVENTORY_FILE="inventory.json"
NFTBAN_JSON_COMBINED_FILE="combined.json"

# --- Connectors Export ---
# Custom backends (Elasticsearch, Kafka, InfluxDB, file)
# See /etc/nftban/conf.d/connectors.conf for connector configuration
NFTBAN_EXPORT_CONNECTORS="false"

# =============================================================================
# LOCAL RETENTION
# =============================================================================
# NFTBan stores local stats/history files with capped retention.
# Options: 1w, 2w, 3w, 4w (weeks)
# Default: 2w
# Hard maximum: 4w (cannot be overridden - design decision)
# Note: For long-term storage, use your external TSDB (Prometheus, VM, etc.)
NFTBAN_LOCAL_RETENTION="2w"

# History files retention (daily snapshots)
NFTBAN_HISTORY_RETENTION_DAYS="14"
NFTBAN_HISTORY_MAX_COUNT="30"

# Profile files retention (pprof captures)
NFTBAN_PROFILE_RETENTION_DAYS="7"
NFTBAN_PROFILE_MAX_COUNT="10"

# =============================================================================
# REPORTS
# =============================================================================
# Daily report generation from collected metrics

# Enable daily report generation
NFTBAN_REPORTS_ENABLED="true"

# Reports output directory
NFTBAN_REPORTS_DIR="/var/lib/nftban/reports"

# Reports retention (same 4-week max as history)
NFTBAN_REPORTS_RETENTION_DAYS="14"

# Top N items in reports (default: 10)
NFTBAN_REPORTS_TOP_N="10"

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Hostname-based jitter for distributed collection
# Prevents thundering herd when many hosts start simultaneously
NFTBAN_COLLECT_JITTER_ENABLED="true"
NFTBAN_COLLECT_JITTER_MAX="30"

# Lock timeout for preventing concurrent collection (seconds)
NFTBAN_COLLECT_LOCK_TIMEOUT="10"

# Use stale cache if lock times out (prevents monitoring gaps)
NFTBAN_COLLECT_USE_STALE_CACHE="true"
NFTBAN_COLLECT_STALE_MAX_AGE="300"

# Batch nftables queries (reduces system calls)
NFTBAN_COLLECT_NFT_BATCH="true"

# Single-pass log parsing (reduces I/O)
NFTBAN_COLLECT_LOG_SINGLE_PASS="true"

# =============================================================================
# DEBUG
# =============================================================================

# Enable debug logging for collectors
NFTBAN_COLLECT_DEBUG="false"

# Log collection timing (helps identify slow collectors)
NFTBAN_COLLECT_LOG_TIMING="false"

# Verbose component detection logging
NFTBAN_COLLECT_LOG_DETECTION="false"
