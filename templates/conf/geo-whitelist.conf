# =============================================================================
# NFTBan GEO Whitelist Configuration Template
# Version: init 1.0
# Template Name: geo-whitelist.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
#
# Description:
# This file contains a list of country codes (ISO 3166-1 alpha-2) to WHITELIST.
# Countries listed here are ALWAYS allowed, even if in blacklist.
#
# Two use cases:
# 1. Protection Mode (GEO_BLOCKING_MODE="blacklist"):
#    - Whitelist ensures specific countries NEVER get blocked
#    - Even if added to blacklist, whitelist takes precedence
#    - Use for: Your home country, customer countries, partner countries
#
# 2. Strict Mode (GEO_BLOCKING_MODE="whitelist"):
#    - ONLY countries listed here are allowed
#    - ALL other countries are BLOCKED
#    - Use for: Services serving specific regions only
#    - ⚠️  DANGER: Empty file = block entire world!
#
# Behavior:
# - This file is NEVER overwritten by NFTBan (user-managed)
# - Users may edit manually or via CLI
# - Changes take effect after: nftban geo reload
#
# Format:
# - One country code per line (2-letter ISO code)
# - Comments start with #
# - Empty lines ignored
# - Case insensitive (US = us = Us)
#
# Priority:
# - Whitelist ALWAYS wins over blacklist
# - If country in both files → ALLOWED
#
# Commands:
# - Add to whitelist:    nftban geo whitelist add US
# - Remove from whitelist: nftban geo whitelist remove US
# - List whitelisted:    nftban geo whitelist list
# - Reload:              nftban geo reload
#
# Warning:
# - IN WHITELIST MODE: Empty file blocks THE ENTIRE WORLD!
# - Add countries BEFORE enabling whitelist mode
# - Test with DRY_RUN="TRUE" first
# - Keep backup of this file
# =============================================================================

# =============================================================================
# CRITICAL COUNTRIES (ALWAYS ALLOW)
# =============================================================================
# ⚠️  IMPORTANT: Add countries where you MUST maintain access!
#
# Always whitelist:
# 1. Your server's country (or set GEO_ALLOW_SERVER_COUNTRY="TRUE")
# 2. Countries where you have paying customers
# 3. Countries where your employees/admins are located
# 4. Business partner countries
# 5. Countries of your main CDN/infrastructure providers
#
# Example workflow:
# 1. Analyze logs: nftban stats country --top 20
# 2. Identify legitimate traffic sources
# 3. Add those countries here
# 4. Then enable GEO-blocking
# =============================================================================

