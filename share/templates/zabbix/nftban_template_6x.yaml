zabbix_export:
  version: '6.0'
  groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: 'Templates/Security'

  templates:
    - uuid: f7fec24f152446a5ae1602ccab01000a
      template: 'NFTBan'
      name: 'NFTBan Firewall'
      description: |
        NFTBan monitoring template for Zabbix 6.x

        Monitors:
        - Daemon status, version, uptime
        - Ban statistics (total, 24h, rate)
        - Memory usage, goroutines, GC stats
        - Module status per enabled module
        - Watchdog pressure scores
        - Feed status and IP counts
        - GeoIP statistics
        - nftables rule counts

        Requirements:
        - NFTBan v1.3.0+
        - Zabbix Agent or Trapper items

        Documentation: https://nftban.com/docs/zabbix
      groups:
        - name: 'Templates/Security'

      # =======================================================================
      # MACROS
      # =======================================================================
      macros:
        - macro: '{$NFTBAN.BAN.RATE.WARN}'
          value: '100'
          description: 'Ban rate per minute warning threshold'
        - macro: '{$NFTBAN.BAN.RATE.HIGH}'
          value: '500'
          description: 'Ban rate per minute high threshold'
        - macro: '{$NFTBAN.MEMORY.WARN}'
          value: '524288000'
          description: 'Memory warning threshold (500MB)'
        - macro: '{$NFTBAN.MEMORY.HIGH}'
          value: '1073741824'
          description: 'Memory high threshold (1GB)'
        - macro: '{$NFTBAN.GEOIP.AGE.WARN}'
          value: '30'
          description: 'GeoIP database age warning (days)'

      # =======================================================================
      # ITEMS - DAEMON INFO
      # =======================================================================
      items:
        # --- Daemon Status ---
        - uuid: 6d2e51c5b65b48fcaaebf56ceade4937
          name: 'NFTBan: Daemon status'
          type: TRAP
          key: nftban.status
          delay: '0'
          value_type: UNSIGNED
          description: 'Daemon status: 1=running, 0=stopped'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: 2e38a44a29614ca3b6dfa4cc52d3dafd
              expression: 'last(/NFTBan/nftban.status)=0'
              name: 'NFTBan daemon is down'
              priority: DISASTER
              description: 'NFTBan daemon is not running. Firewall protection may be compromised.'
              tags:
                - tag: scope
                  value: availability

        - uuid: b3eea81035534225970f8b9a87b6c05e
          name: 'NFTBan: Version'
          type: TRAP
          key: nftban.version
          delay: '0'
          value_type: CHAR
          description: 'NFTBan daemon version'
          tags:
            - tag: component
              value: daemon

        - uuid: 5fe526be45364c2b83103e33ff79ef60
          name: 'NFTBan: Uptime'
          type: TRAP
          key: nftban.uptime
          delay: '0'
          value_type: FLOAT
          units: s
          description: 'Daemon uptime in seconds'
          tags:
            - tag: component
              value: daemon

        - uuid: 14cf511ce06b4decbd0f7ace4adfd000
          name: 'NFTBan: PID'
          type: TRAP
          key: nftban.pid
          delay: '0'
          value_type: UNSIGNED
          description: 'Daemon process ID'
          tags:
            - tag: component
              value: daemon

        - uuid: 8cd5c7b3ad9b446d9368042d57c0ef2f
          name: 'NFTBan: Operating mode'
          type: TRAP
          key: nftban.mode
          delay: '0'
          value_type: CHAR
          description: 'Operating mode: normal, degraded, survival'
          tags:
            - tag: component
              value: daemon
          triggers:
            - uuid: 3e5202730bbb49ed8421676803814311
              expression: 'last(/NFTBan/nftban.mode)<>"normal" and length(last(/NFTBan/nftban.mode))>0'
              name: 'NFTBan in {ITEM.VALUE} mode'
              priority: WARNING
              description: 'NFTBan is running in degraded or survival mode due to resource pressure.'

        # --- Ban Statistics ---
        - uuid: 67ac2e68a1184a1782b0c05e6a710498
          name: 'NFTBan: Active bans'
          type: TRAP
          key: nftban.active.count
          delay: '0'
          value_type: UNSIGNED
          description: 'Currently active ban count'
          tags:
            - tag: component
              value: bans

        - uuid: a2b04e31b7de4a9b8911ef651c7f7e05
          name: 'NFTBan: Bans (24h)'
          type: TRAP
          key: nftban.bans.24h
          delay: '0'
          value_type: UNSIGNED
          description: 'Bans in last 24 hours'
          tags:
            - tag: component
              value: bans
          triggers:
            - uuid: 6bae59ee5e7f4f9faebd0e3ae9f0cfce
              expression: 'last(/NFTBan/nftban.bans.24h)>1000'
              name: 'High ban rate (>{ITEM.VALUE}/24h)'
              priority: WARNING
              description: 'More than 1000 bans in the last 24 hours indicates increased attack activity.'
            - uuid: 6278a83ce8164cf8aaff3923d0fe33fc
              expression: 'last(/NFTBan/nftban.bans.24h)>5000'
              name: 'Mass attack detected (>{ITEM.VALUE}/24h)'
              priority: HIGH
              description: 'More than 5000 bans in 24 hours suggests a coordinated attack.'

        - uuid: 748f5e95504b416697740ced14e82c71
          name: 'NFTBan: Bans (1h)'
          type: TRAP
          key: nftban.bans.1h
          delay: '0'
          value_type: UNSIGNED
          description: 'Bans in last hour'
          tags:
            - tag: component
              value: bans

        - uuid: 67d21152bba74b0283b0668d4de851e8
          name: 'NFTBan: Ban rate'
          type: TRAP
          key: nftban.bans.rate
          delay: '0'
          value_type: FLOAT
          units: '/min'
          description: 'Current ban rate per minute'
          tags:
            - tag: component
              value: bans

        - uuid: 9dfcfb7a357c4c289afd9a90610befef
          name: 'NFTBan: Total bans'
          type: TRAP
          key: nftban.bans.total
          delay: '0'
          value_type: UNSIGNED
          description: 'Total bans since daemon start'
          tags:
            - tag: component
              value: bans

        - uuid: af8c98b3050045918f0d93de6cd86f10
          name: 'NFTBan: Permanent bans'
          type: TRAP
          key: nftban.permanent.count
          delay: '0'
          value_type: UNSIGNED
          description: 'Permanent ban count'
          tags:
            - tag: component
              value: bans

        # --- Memory Metrics ---
        - uuid: 296fe7c6c28c4e04aed5054fd88f94f9
          name: 'NFTBan: Memory RSS'
          type: TRAP
          key: nftban.memory.rss
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: 'Process resident set size'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 641244fb538e441fad8611f3ffc4bd0c
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.WARN}'
              name: 'NFTBan memory usage high (>{ITEM.VALUE})'
              priority: WARNING
              description: 'NFTBan memory usage exceeds warning threshold.'
            - uuid: 3d26c35ff7614e938540792ef34f2914
              expression: 'last(/NFTBan/nftban.memory.rss)>{$NFTBAN.MEMORY.HIGH}'
              name: 'NFTBan memory usage critical (>{ITEM.VALUE})'
              priority: HIGH
              description: 'NFTBan memory usage exceeds critical threshold.'

        - uuid: 64761dbd1c8b419895ea537bbf06a4ad
          name: 'NFTBan: Open file descriptors'
          type: TRAP
          key: nftban.fds.open
          delay: '0'
          value_type: UNSIGNED
          description: 'Open file descriptors'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 946a5c29d5bc4e31b8758c138a2fcf55
              expression: 'last(/NFTBan/nftban.fds.open)>1000'
              name: 'NFTBan open FDs > 1000'
              priority: WARNING
              description: 'High number of open file descriptors may indicate a leak.'

        - uuid: e5b42b433d424454beaff459d443166b
          name: 'NFTBan: Threads'
          type: TRAP
          key: nftban.threads
          delay: '0'
          value_type: UNSIGNED
          description: 'OS thread count'
          tags:
            - tag: component
              value: memory

        # --- Module Metrics ---
        - uuid: e60be91f20ba4a86be0b47d9066b195b
          name: 'NFTBan: Modules enabled'
          type: TRAP
          key: nftban.modules.enabled
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of enabled modules'
          tags:
            - tag: component
              value: modules

        - uuid: 9617e92cea814541bf3d0e414077c54b
          name: 'NFTBan: Modules active'
          type: TRAP
          key: nftban.modules.active
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of currently active modules'
          tags:
            - tag: component
              value: modules

        - uuid: 8675412cf0bd42e2aeb370099cd397cf
          name: 'NFTBan: Modules failed'
          type: TRAP
          key: nftban.modules.failed
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of failed modules'
          tags:
            - tag: component
              value: modules
          triggers:
            - uuid: f2fdf7f808d44f33b3217a1672a7a3b2
              expression: 'last(/NFTBan/nftban.modules.failed)>0'
              name: 'NFTBan module(s) failed ({ITEM.VALUE})'
              priority: HIGH
              description: 'One or more NFTBan modules have failed.'

        # --- nftables Metrics ---
        - uuid: 9c1e3f877660488baa1637a0d16e13af
          name: 'NFTBan: nftables sets'
          type: TRAP
          key: nftban.nft.sets_total
          delay: '0'
          value_type: UNSIGNED
          description: 'Total nftables sets'
          tags:
            - tag: component
              value: nftables

        - uuid: ed37e38bfb7945e1b163a7b349ad8384
          name: 'NFTBan: nftables elements'
          type: TRAP
          key: nftban.nft.elements_total
          delay: '0'
          value_type: UNSIGNED
          description: 'Total set elements across all sets'
          tags:
            - tag: component
              value: nftables
          triggers:
            - uuid: 3f230c78c6c047ea99b9f72fe4d7e9fb
              expression: 'last(/NFTBan/nftban.nft.elements_total)>100000'
              name: 'NFTBan large ruleset (>{ITEM.VALUE} elements)'
              priority: WARNING
              description: 'Large number of set elements may impact performance.'

        - uuid: 931b15bfd9fb4f9fa8f01fa34d2cfd33
          name: 'NFTBan: nftables rules'
          type: TRAP
          key: nftban.nft.rules_total
          delay: '0'
          value_type: UNSIGNED
          description: 'Total nftables rules'
          tags:
            - tag: component
              value: nftables

        # --- Feeds Metrics ---
        - uuid: 17e1684e466b41f29e93ebed250d7795
          name: 'NFTBan: Feeds enabled'
          type: TRAP
          key: nftban.feeds.enabled
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of enabled threat feeds'
          tags:
            - tag: component
              value: feeds

        - uuid: fbfd9ac70d0e437f9033576e0eb08dec
          name: 'NFTBan: Feeds loaded'
          type: TRAP
          key: nftban.feeds.loaded
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of successfully loaded feeds'
          tags:
            - tag: component
              value: feeds

        - uuid: bbefc1c3cd3943e9be0f9abd39985bd6
          name: 'NFTBan: Feeds failed'
          type: TRAP
          key: nftban.feeds.failed
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of failed feed loads'
          tags:
            - tag: component
              value: feeds
          triggers:
            - uuid: a4fe1b6cfadc49c6b1f724019670d3ba
              expression: 'last(/NFTBan/nftban.feeds.failed)>0'
              name: 'NFTBan feed load failures ({ITEM.VALUE})'
              priority: WARNING
              description: 'One or more threat feeds failed to load.'

        - uuid: 7d3cbac398c94343bd048a967af2d6f5
          name: 'NFTBan: Feeds total IPs'
          type: TRAP
          key: nftban.feeds.ips_total
          delay: '0'
          value_type: UNSIGNED
          description: 'Total IPs from all feeds'
          tags:
            - tag: component
              value: feeds

        # --- GeoIP Metrics ---
        - uuid: 05a27e959afa416b9a3e1bb8c05e0960
          name: 'NFTBan: GeoIP database age'
          type: TRAP
          key: nftban.geoip.database_age
          delay: '0'
          value_type: UNSIGNED
          units: days
          description: 'Age of GeoIP database in days'
          tags:
            - tag: component
              value: geoip
          triggers:
            - uuid: 9660d3e17ccb403aba648e39dc00dd05
              expression: 'last(/NFTBan/nftban.geoip.database_age)>{$NFTBAN.GEOIP.AGE.WARN}'
              name: 'NFTBan GeoIP database outdated ({ITEM.VALUE} days)'
              priority: WARNING
              description: 'GeoIP database should be updated for accurate geolocation.'

        - uuid: 950213a9857540b6aeba70ebdcca1230
          name: 'NFTBan: Countries blocked'
          type: TRAP
          key: nftban.geoip.countries_blocked
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of blocked countries'
          tags:
            - tag: component
              value: geoip

        # --- Watchdog Metrics ---
        - uuid: 417b010d245540a4ae47a893115df5f5
          name: 'NFTBan: Watchdog status'
          type: TRAP
          key: nftban.watchdog.status
          delay: '0'
          value_type: FLOAT
          description: 'Watchdog status: 1=ok, 0=disabled, -1=error'
          tags:
            - tag: component
              value: watchdog

        - uuid: 8a9f6220994a4c5fb067095da0d0aada
          name: 'NFTBan: CPU pressure score'
          type: TRAP
          key: nftban.watchdog.cpu_score
          delay: '0'
          value_type: FLOAT
          description: 'CPU pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog
          triggers:
            - uuid: 6a177fc0fd8847b9aa286a15a05c4945
              expression: 'last(/NFTBan/nftban.watchdog.cpu_score)>80'
              name: 'NFTBan CPU pressure high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High CPU pressure may cause NFTBan to enter degraded mode.'

        - uuid: ab0aa90a447f42c695f909c3053d30ab
          name: 'NFTBan: Memory pressure score'
          type: TRAP
          key: nftban.watchdog.mem_score
          delay: '0'
          value_type: FLOAT
          description: 'Memory pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog
          triggers:
            - uuid: e6f601164bec440b8b5ff6a2c9f2d2a9
              expression: 'last(/NFTBan/nftban.watchdog.mem_score)>80'
              name: 'NFTBan memory pressure high ({ITEM.VALUE})'
              priority: WARNING
              description: 'High memory pressure may cause NFTBan to enter degraded mode.'

        - uuid: 91e3c72f5d704df4b0441ccd01260da3
          name: 'NFTBan: I/O pressure score'
          type: TRAP
          key: nftban.watchdog.io_score
          delay: '0'
          value_type: FLOAT
          description: 'I/O pressure score (0-100)'
          tags:
            - tag: component
              value: watchdog

        # --- Server Inventory ---
        - uuid: 6020731795f14c788a715f6a249dc957
          name: 'NFTBan: Server hostname'
          type: TRAP
          key: nftban.server.hostname
          delay: '0'
          value_type: CHAR
          description: 'Server hostname (short)'
          inventory_link: NAME
          tags:
            - tag: component
              value: inventory

        - uuid: 8e79d97e7c694ef0a89f4d10283a9db6
          name: 'NFTBan: Server FQDN'
          type: TRAP
          key: nftban.server.fqdn
          delay: '0'
          value_type: CHAR
          description: 'Fully qualified domain name'
          tags:
            - tag: component
              value: inventory

        - uuid: 2dea80639772490781263189b4da14d4
          name: 'NFTBan: Server OS'
          type: TRAP
          key: nftban.server.os
          delay: '0'
          value_type: CHAR
          description: 'Operating system ID'
          inventory_link: OS
          tags:
            - tag: component
              value: inventory

        - uuid: cdf80c6f3fac466c8982de8bf7aea29b
          name: 'NFTBan: Server OS release'
          type: TRAP
          key: nftban.server.os_release
          delay: '0'
          value_type: CHAR
          description: 'OS release/distribution (e.g., Ubuntu 24.04)'
          inventory_link: OS_SHORT
          tags:
            - tag: component
              value: inventory

        - uuid: 82210f6d62794919bd9adc9f04e287fc
          name: 'NFTBan: Server kernel'
          type: TRAP
          key: nftban.server.kernel
          delay: '0'
          value_type: CHAR
          description: 'Kernel version'
          inventory_link: SOFTWARE
          tags:
            - tag: component
              value: inventory

        - uuid: e083ec287b3a4d6997bf378a988b8b81
          name: 'NFTBan: Server architecture'
          type: TRAP
          key: nftban.server.arch
          delay: '0'
          value_type: CHAR
          description: 'System architecture (x86_64, aarch64)'
          inventory_link: TYPE
          tags:
            - tag: component
              value: inventory

        - uuid: b72b399fbc5346f8820d5632db1e0800
          name: 'NFTBan: CPU cores'
          type: TRAP
          key: nftban.server.cpu_cores
          delay: '0'
          value_type: UNSIGNED
          description: 'Number of CPU cores'
          tags:
            - tag: component
              value: inventory

        - uuid: f0642c3ec7ed4d61a495be8006b64f81
          name: 'NFTBan: Server CPU model'
          type: TRAP
          key: nftban.server.cpu_model
          delay: '0'
          value_type: CHAR
          description: 'CPU model name'
          inventory_link: HARDWARE
          tags:
            - tag: component
              value: inventory

        - uuid: 71b2af32298846658d05440d6532fb09
          name: 'NFTBan: Server memory total'
          type: TRAP
          key: nftban.server.memory_total
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: 'Total physical memory'
          tags:
            - tag: component
              value: inventory

        - uuid: 13e9e83be9504f07974cad6ca64be4e6
          name: 'NFTBan: Server memory available'
          type: TRAP
          key: nftban.server.memory_available
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: 'Available physical memory'
          tags:
            - tag: component
              value: server

        - uuid: c9b59026ae414424935c59da092d2a8c
          name: 'NFTBan: Server uptime'
          type: TRAP
          key: nftban.server.uptime
          delay: '0'
          value_type: UNSIGNED
          units: s
          description: 'Server uptime in seconds'
          tags:
            - tag: component
              value: server

        - uuid: 66fcf2ba20fd4f4c8feeb5a7b32ccb39
          name: 'NFTBan: Server primary IP'
          type: TRAP
          key: nftban.server.primary_ip
          delay: '0'
          value_type: CHAR
          description: 'Primary IPv4 address'
          inventory_link: HOST_ROUTER
          tags:
            - tag: component
              value: inventory

        - uuid: 1cf39410c7044d42a8b3e8c4aa8c9501
          name: 'NFTBan: Server timezone'
          type: TRAP
          key: nftban.server.timezone
          delay: '0'
          value_type: CHAR
          description: 'System timezone'
          tags:
            - tag: component
              value: inventory

        - uuid: 084edb24ebf7460e9e9b7d09fffaa6f1
          name: 'NFTBan: Server virtualization'
          type: TRAP
          key: nftban.server.virtualization
          delay: '0'
          value_type: CHAR
          description: 'Virtualization type (kvm, vmware, docker, none)'
          inventory_link: TYPE_FULL
          tags:
            - tag: component
              value: inventory

        - uuid: 3685f9040369483dbbbeaaeca359e773
          name: 'NFTBan: Server cloud provider'
          type: TRAP
          key: nftban.server.cloud_provider
          delay: '0'
          value_type: CHAR
          description: 'Cloud provider (aws, gcp, azure, digitalocean, none)'
          inventory_link: VENDOR
          tags:
            - tag: component
              value: inventory

        - uuid: 6cb9ceb676774b23a93035cade4ccb94
          name: 'NFTBan: Load average (1m)'
          type: TRAP
          key: nftban.server.load_1m
          delay: '0'
          value_type: FLOAT
          description: '1-minute load average'
          tags:
            - tag: component
              value: server

        - uuid: ff1dffc54a174ca6b234e39147b7b234
          name: 'NFTBan: Load average (5m)'
          type: TRAP
          key: nftban.server.load_5m
          delay: '0'
          value_type: FLOAT
          description: '5-minute load average'
          tags:
            - tag: component
              value: server

        - uuid: 2e5840238baf4ab4a4519004201ef041
          name: 'NFTBan: Load average (15m)'
          type: TRAP
          key: nftban.server.load_15m
          delay: '0'
          value_type: FLOAT
          description: '15-minute load average'
          tags:
            - tag: component
              value: server

      # =======================================================================
      # DISCOVERY RULES (LLD)
      # =======================================================================
      discovery_rules:
        # --- Module Discovery ---
        - uuid: 549706ce5857483b8dbedfb17e5d546a
          name: 'NFTBan: Module discovery'
          type: TRAP
          key: nftban.discovery.modules
          delay: '0'
          description: 'Discover all NFTBan modules'
          item_prototypes:
            - uuid: 1ef7b737a35c4d19a2f10ed38cb6a88c
              name: 'NFTBan: Module {#MODULE} status'
              type: TRAP
              key: 'nftban.module.status[{#MODULE}]'
              delay: '0'
              value_type: FLOAT
              description: 'Module {#MODULE} status: 1=ok, 0=error, -1=disabled'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
            - uuid: d7d59b16875c44c28a97649f78d49f45
              name: 'NFTBan: Module {#MODULE} bans'
              type: TRAP
              key: 'nftban.module.bans[{#MODULE}]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Bans from module {#MODULE}'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
          trigger_prototypes:
            - uuid: fda1102229e24971b3c18c98bb17f3cf
              expression: 'last(/NFTBan/nftban.module.status[{#MODULE}])=0'
              name: 'NFTBan module {#MODULE} failed'
              priority: HIGH
              description: 'Module {#MODULE} is in error state.'

        # --- Feed Discovery ---
        - uuid: eac3195a443b43d1bcda79bbd2423844
          name: 'NFTBan: Feed discovery'
          type: TRAP
          key: nftban.discovery.feeds
          delay: '0'
          description: 'Discover configured threat feeds'
          item_prototypes:
            - uuid: deaece984e154ff0819e57d5ab609223
              name: 'NFTBan: Feed {#FEED} status'
              type: TRAP
              key: 'nftban.feed.status[{#FEED}]'
              delay: '0'
              value_type: UNSIGNED
              description: 'Feed {#FEED} status: 1=ok, 0=error'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: a7e56476e5a44366be5f635d66c59cba
              name: 'NFTBan: Feed {#FEED} IPs'
              type: TRAP
