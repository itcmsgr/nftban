# Template Name: user-whitelist_ips.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
#
# Description:
# This template allows users to manually define their own whitelist IP addresses.
# It is intended for persistent user-defined IPs that should never be blocked.
# Both IPv4 and IPv6 addresses are supported.
#
# Behavior:
# - This file is **NEVER** overwritten by NFTBan or its automated scripts.
# - Users may update it manually or via the NFTBan CLI interface.
# - All entries here are treated as trusted and permanently excluded from blocking.
# - Changes take effect after: nftban whitelist reload OR nftban setup
#
# Usage:
# - Add one IP address per line
# - Comments start with #
# - Empty lines are ignored
# - Supports individual IPs and CIDR ranges
#
# Examples:
# 192.168.1.100          # Home office IP
# 203.0.113.0/24         # Company network range
# 2001:db8::1            # IPv6 address
# 10.0.0.0/8             # Private network range
#
# Commands:
# - Add IP:     nftban whitelist add <IP> "reason"
# - Remove IP:  nftban whitelist remove <IP>
# - List IPs:   nftban whitelist list
# - Reload:     nftban whitelist reload
#
# Warning:
# - DO NOT rename or relocate this file.
# - DO NOT add IPs you don't trust - they will bypass ALL security rules.
# - NFTBan relies on this file's presence for user-level IP whitelisting.
