name: Project Health

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # weekly check (Mon 03:17 UTC)

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used by optional auto-commit step below
    steps:
      - uses: actions/checkout@v4

      # Node is needed for jscpd / markdownlint
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install linters & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt yamllint jq devscripts nftables
          npm i -g markdownlint-cli2

      - name: Run health check
        run: .ci/health_check.sh
      - name: Upload STATUS.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-status
          path: STATUS.md

      # --- Optional: auto-commit STATUS.md changes back to the branch ---
      - name: Commit STATUS.md (only on push, not PRs)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add STATUS.md
            git commit -m "chore: update STATUS.md [skip ci]"
            git push
          fi
