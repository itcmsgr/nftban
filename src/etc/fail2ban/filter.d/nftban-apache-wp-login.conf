# Fail2ban filter for WordPress wp-login.php brute force attacks
# Detects POST requests to WordPress login page
#
# Author: NFTBan Project
# Date: 2025-10-30

[Definition]

# Match POST requests to wp-login.php (with or without leading slash)
failregex = ^<HOST> -.*"POST //?wp-login\.php.*

# Optional: Ignore known good IPs or patterns
ignoreregex =

[Init]
# Default values (can be overridden in jail.conf)
# maxretry = 10
# findtime = 1200 (20 minutes)
# bantime = 7200 (2 hours)
