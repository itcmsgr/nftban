# meta:name="nftban-conf-panel-plesk"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:description="Plesk control-panel firewall + security port surface (sourced by panel_loader and nftban_panel_plesk shell library)"
# meta:inventory.files="/etc/nftban/conf.d/panels/plesk/main.conf"
# meta:inventory.binaries=""
# meta:inventory.env_vars="NFTBAN_PLESK_TCP_IN,NFTBAN_PLESK_TCP_OUT,NFTBAN_PLESK_UDP_IN,NFTBAN_PLESK_UDP_OUT,NFTBAN_PLESK_TCP6_IN,NFTBAN_PLESK_TCP6_OUT,NFTBAN_PLESK_UDP6_IN,NFTBAN_PLESK_UDP6_OUT"
# meta:inventory.config_files="/etc/nftban/conf.d/panels/plesk/main.conf,/etc/nftban/conf.d/panels/plesk/main.conf.local"
# meta:inventory.systemd_units=""
# meta:inventory.network="tcp/8443 (Plesk HTTPS panel control plane)"
# meta:inventory.privileges="none"
# Purpose: Plesk control panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/plesk/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# PLESK INSTALLATION
# -----------------------------------------------------------------------------

# Plesk installation path
NFTBAN_PLESK_PATH="/usr/local/psa"

# Plesk panel ports
NFTBAN_PLESK_PANEL_PORT="8880"       # Plesk HTTP
NFTBAN_PLESK_PANEL_SSL_PORT="8443"   # Plesk HTTPS

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
# -----------------------------------------------------------------------------
# Based on Plesk recommended firewall rules
# See: https://support.plesk.com/hc/en-us/articles/213932745
#
# NOTE: SSH port 22 is AUTOMATICALLY managed by NFTBan
#       DO NOT add port 22 to panel configs - it's handled separately

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995), Sieve/managesieve(4190), Plesk HTTP(8880),
#        Plesk HTTPS(8443), Passive FTP(49152-65535)
#
# 4190 (managesieve, RFC 5804) — dovecot mail-filter management for
# Plesk mail users. Confirmed listening on Plesk Obsidian 18.0.76 by
# the 192.0.2.229 read-only audit (sha256 c1a72266e2eb...).
NFTBAN_PLESK_TCP_IN="20,21,25,53,80,110,143,443,465,587,993,995,4190,8443,8880"

# TCP OUTPUT (outgoing connections)
NFTBAN_PLESK_TCP_OUT="20,21,25,53,80,110,113,443,587,993,995,8443"

# UDP INPUT (incoming connections)
# Ports: DNS(53), HTTP/3(443)
NFTBAN_PLESK_UDP_IN="53,443"

# UDP OUTPUT (outgoing connections)
# Ports: DNS(53), NTP(123)
NFTBAN_PLESK_UDP_OUT="53,123,443"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4

NFTBAN_PLESK_TCP6_IN="20,21,25,53,80,110,143,443,465,587,993,995,4190,8443,8880"
NFTBAN_PLESK_TCP6_OUT="20,21,25,53,80,110,113,443,587,993,995,8443"
NFTBAN_PLESK_UDP6_IN="53,443"
NFTBAN_PLESK_UDP6_OUT="53,123,443"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_PLESK_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_PLESK_CUSTOM_TCP_IN=""
NFTBAN_PLESK_CUSTOM_TCP_OUT=""
NFTBAN_PLESK_CUSTOM_UDP_IN=""
NFTBAN_PLESK_CUSTOM_UDP_OUT=""

NFTBAN_PLESK_CUSTOM_TCP6_IN=""
NFTBAN_PLESK_CUSTOM_TCP6_OUT=""
NFTBAN_PLESK_CUSTOM_UDP6_IN=""
NFTBAN_PLESK_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# PLESK LICENSE SERVERS
# -----------------------------------------------------------------------------
# Plesk requires access to license verification servers

# Auto-enable Plesk license server whitelist? (YES|NO|ASK)
NFTBAN_PLESK_AUTO_LICENSE_WHITELIST="ASK"

# Update Plesk license server list automatically? (YES|NO)
NFTBAN_PLESK_UPDATE_LICENSE_SERVERS="YES"

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# Plesk login failure monitoring configuration
# Full configuration in: /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default
LOGIN_SERVICE_PLESK_ENABLED="true"

# Log file locations
LOGIN_SERVICE_PLESK_LOG="/var/log/plesk/panel.log"
LOGIN_SERVICE_PLESK_ERROR="/var/log/sw-cp-server/error_log"
LOGIN_SERVICE_PLESK_ACCESS="/var/log/plesk/httpsd_access_log"

# -----------------------------------------------------------------------------
# DETECTION MARKERS (Auto-Discovery)
# -----------------------------------------------------------------------------
# Used by nftban to detect if Plesk is installed

NFTBAN_PLESK_MARKER_DIR="/usr/local/psa"
NFTBAN_PLESK_MARKER_BIN="/usr/local/psa/admin/bin/httpdmng"
NFTBAN_PLESK_MARKER_SERVICE="plesk"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# - Enable Fail2Ban integration in Plesk (Tools & Settings > Security)
# - Use SSL/TLS for all panel access (port 8443)
# - Enable two-factor authentication
# - Restrict panel access to specific IPs if possible
# - Keep Plesk updated to latest version
# - Configure SMTP restrictions to prevent email abuse
# - Enable ModSecurity in Plesk

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
