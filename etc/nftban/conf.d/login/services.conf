# =============================================================================
# NFTBan Login Monitor - SERVICES Configuration
# =============================================================================
# Per-service configuration for login/authentication monitoring.
# Each service can be individually enabled/disabled and tuned.
# Services are only active if detected on the system when LOGIN_AUTO_DETECT_SERVICES="true"
#
# File: /etc/nftban/conf.d/login/services.conf
# =============================================================================

# -----------------------------------------------------------------------------
# SSH (Secure Shell)
# -----------------------------------------------------------------------------
# Monitors: sshd login failures
# Source: journalctl -u sshd / journalctl -u ssh
# Replaces: fail2ban [nftban-sshd] jail

LOGIN_SERVICE_SSH_ENABLED="true"

# Journalctl unit names (varies by distro)
LOGIN_SERVICE_SSH_UNITS="sshd,ssh"

# Detection patterns (extended regex)
LOGIN_SERVICE_SSH_PATTERN_FAILED="Failed password|authentication failure|Invalid user.*from"
LOGIN_SERVICE_SSH_PATTERN_PREAUTH="Disconnected from.*preauth|Connection closed.*preauth"
LOGIN_SERVICE_SSH_PATTERN_INVALID="Invalid user|User .* not allowed"
LOGIN_SERVICE_SSH_PATTERN_ROOT="Failed password for root|Invalid user root"

# Thresholds (override global)
LOGIN_SERVICE_SSH_FAIL_THRESHOLD="5"
LOGIN_SERVICE_SSH_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_SSH_BAN_SHORT="900"
LOGIN_SERVICE_SSH_BAN_LONG="3600"

# Persistent offender: X bans in period -> permanent
LOGIN_SERVICE_SSH_PERM_THRESHOLD="12"
LOGIN_SERVICE_SSH_PERM_PERIOD="86400"

# Risk score multiplier (1.0 = normal, higher = more critical)
LOGIN_SERVICE_SSH_RISK_MULTIPLIER="1.2"

# Special: root login attempts get extra penalty
LOGIN_SERVICE_SSH_ROOT_PENALTY="0.25"

# -----------------------------------------------------------------------------
# DOVECOT (IMAP/POP3 Mail Server)
# -----------------------------------------------------------------------------
# Monitors: dovecot auth failures
# Source: journalctl -u dovecot / /var/log/mail.log
# Replaces: fail2ban [nftban-dovecot] jail

LOGIN_SERVICE_DOVECOT_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_DOVECOT_UNITS="dovecot"

# Detection patterns
LOGIN_SERVICE_DOVECOT_PATTERN_FAILED="auth failed|authentication failure|password mismatch"
LOGIN_SERVICE_DOVECOT_PATTERN_UNKNOWN="unknown user|user not found"
LOGIN_SERVICE_DOVECOT_PATTERN_DISCONNECT="Disconnected.*no auth|Connection closed.*AUTHENTICATE"

# Thresholds
LOGIN_SERVICE_DOVECOT_FAIL_THRESHOLD="5"
LOGIN_SERVICE_DOVECOT_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_DOVECOT_BAN_SHORT="900"
LOGIN_SERVICE_DOVECOT_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_DOVECOT_PERM_THRESHOLD="15"
LOGIN_SERVICE_DOVECOT_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_DOVECOT_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# EXIM (Mail Transfer Agent)
# -----------------------------------------------------------------------------
# Monitors: exim SMTP auth failures
# Source: journalctl -u exim / /var/log/exim/mainlog
# Replaces: fail2ban [nftban-exim] jail

LOGIN_SERVICE_EXIM_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_EXIM_UNITS="exim,exim4"

# Detection patterns
LOGIN_SERVICE_EXIM_PATTERN_FAILED="authenticator failed|AUTH.*failed|login failed"
LOGIN_SERVICE_EXIM_PATTERN_SPAM="rejected MAIL|refused relay"
LOGIN_SERVICE_EXIM_PATTERN_UNKNOWN="unknown user"

# Thresholds
LOGIN_SERVICE_EXIM_FAIL_THRESHOLD="5"
LOGIN_SERVICE_EXIM_FAIL_WINDOW="300"

# Spam attempts (stricter)
LOGIN_SERVICE_EXIM_SPAM_THRESHOLD="3"
LOGIN_SERVICE_EXIM_SPAM_WINDOW="300"

# Ban durations
LOGIN_SERVICE_EXIM_BAN_SHORT="900"
LOGIN_SERVICE_EXIM_BAN_LONG="7200"

# Persistent offender (stricter for mail abuse)
LOGIN_SERVICE_EXIM_PERM_THRESHOLD="8"
LOGIN_SERVICE_EXIM_PERM_PERIOD="43200"

# Spam offender (very strict)
LOGIN_SERVICE_EXIM_SPAM_PERM_THRESHOLD="5"
LOGIN_SERVICE_EXIM_SPAM_PERM_PERIOD="21600"

# Risk multiplier
LOGIN_SERVICE_EXIM_RISK_MULTIPLIER="1.1"

# -----------------------------------------------------------------------------
# POSTFIX (Mail Transfer Agent)
# -----------------------------------------------------------------------------
# Monitors: postfix SMTP auth failures
# Source: journalctl -u postfix / /var/log/mail.log
# Replaces: fail2ban [nftban-postfix] jail

LOGIN_SERVICE_POSTFIX_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_POSTFIX_UNITS="postfix,postfix@-"

# Detection patterns
LOGIN_SERVICE_POSTFIX_PATTERN_FAILED="SASL.*authentication failed|warning.*authentication failure"
LOGIN_SERVICE_POSTFIX_PATTERN_UNKNOWN="unknown user|user unknown"
LOGIN_SERVICE_POSTFIX_PATTERN_SPAM="reject.*relay|blocked using"

# Thresholds
LOGIN_SERVICE_POSTFIX_FAIL_THRESHOLD="5"
LOGIN_SERVICE_POSTFIX_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_POSTFIX_BAN_SHORT="900"
LOGIN_SERVICE_POSTFIX_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_POSTFIX_PERM_THRESHOLD="10"
LOGIN_SERVICE_POSTFIX_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_POSTFIX_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# ROUNDCUBE (Webmail)
# -----------------------------------------------------------------------------
# Monitors: roundcube login failures
# Source: journalctl -u php-fpm / /var/log/roundcube/errors
# Replaces: fail2ban [nftban-roundcube] jail

LOGIN_SERVICE_ROUNDCUBE_ENABLED="true"

# Log file path (journalctl doesn't capture well)
LOGIN_SERVICE_ROUNDCUBE_LOG="/var/log/roundcubemail/errors.log"
LOGIN_SERVICE_ROUNDCUBE_LOG_ALT="/var/log/roundcube/errors"

# Detection patterns
LOGIN_SERVICE_ROUNDCUBE_PATTERN_FAILED="Login failed|IMAP error.*login|Authentication failed"

# Thresholds (webmail gets many automated attacks)
LOGIN_SERVICE_ROUNDCUBE_FAIL_THRESHOLD="5"
LOGIN_SERVICE_ROUNDCUBE_FAIL_WINDOW="600"

# Ban durations
LOGIN_SERVICE_ROUNDCUBE_BAN_SHORT="1800"
LOGIN_SERVICE_ROUNDCUBE_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_ROUNDCUBE_PERM_THRESHOLD="20"
LOGIN_SERVICE_ROUNDCUBE_PERM_PERIOD="172800"

# Risk multiplier
LOGIN_SERVICE_ROUNDCUBE_RISK_MULTIPLIER="0.9"

# -----------------------------------------------------------------------------
# WORDPRESS (wp-login.php)
# -----------------------------------------------------------------------------
# Monitors: WordPress login failures
# Source: Apache/Nginx access logs
# Replaces: fail2ban [nftban-apache-wp-login] jail

LOGIN_SERVICE_WORDPRESS_ENABLED="true"

# Log source (Apache or Nginx access logs)
LOGIN_SERVICE_WORDPRESS_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_WORDPRESS_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_WORDPRESS_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns (POST to wp-login.php)
LOGIN_SERVICE_WORDPRESS_PATTERN_LOGIN="POST.*/wp-login\\.php"
LOGIN_SERVICE_WORDPRESS_PATTERN_FAILED="wp-login\\.php.*200|wp-login\\.php.*302"

# Thresholds (WordPress brute force is common)
LOGIN_SERVICE_WORDPRESS_FAIL_THRESHOLD="10"
LOGIN_SERVICE_WORDPRESS_FAIL_WINDOW="600"

# Ban durations
LOGIN_SERVICE_WORDPRESS_BAN_SHORT="900"
LOGIN_SERVICE_WORDPRESS_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_WORDPRESS_PERM_THRESHOLD="20"
LOGIN_SERVICE_WORDPRESS_PERM_PERIOD="172800"

# Risk multiplier (lower - high false positive rate)
LOGIN_SERVICE_WORDPRESS_RISK_MULTIPLIER="0.8"

# -----------------------------------------------------------------------------
# XML-RPC (WordPress API)
# -----------------------------------------------------------------------------
# Monitors: xmlrpc.php abuse (common brute force vector)
# Source: Apache/Nginx access logs
# Replaces: fail2ban [nftban-apache-xmlrpc] jail

LOGIN_SERVICE_XMLRPC_ENABLED="true"

# Uses same logs as WordPress
LOGIN_SERVICE_XMLRPC_LOG_APACHE="/var/log/apache2/access.log"
LOGIN_SERVICE_XMLRPC_LOG_HTTPD="/var/log/httpd/access_log"
LOGIN_SERVICE_XMLRPC_LOG_NGINX="/var/log/nginx/access.log"

# Detection patterns (POST to xmlrpc.php)
LOGIN_SERVICE_XMLRPC_PATTERN_POST="POST.*/xmlrpc\\.php"
LOGIN_SERVICE_XMLRPC_PATTERN_MULTICALL="system\\.multicall"

# Thresholds (xmlrpc is heavily abused - stricter)
LOGIN_SERVICE_XMLRPC_FAIL_THRESHOLD="5"
LOGIN_SERVICE_XMLRPC_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_XMLRPC_BAN_SHORT="1800"
LOGIN_SERVICE_XMLRPC_BAN_LONG="7200"

# Persistent offender (strict - often automated)
LOGIN_SERVICE_XMLRPC_PERM_THRESHOLD="10"
LOGIN_SERVICE_XMLRPC_PERM_PERIOD="43200"

# Risk multiplier (higher - rarely legitimate)
LOGIN_SERVICE_XMLRPC_RISK_MULTIPLIER="1.3"

# -----------------------------------------------------------------------------
# DIRECTADMIN (Control Panel)
# -----------------------------------------------------------------------------
# Monitors: DirectAdmin login failures
# Source: /var/log/directadmin/login.log
# Replaces: fail2ban [nftban-directadmin] jail

LOGIN_SERVICE_DIRECTADMIN_ENABLED="true"

# Log file path
LOGIN_SERVICE_DIRECTADMIN_LOG="/var/log/directadmin/login.log"
LOGIN_SERVICE_DIRECTADMIN_ERROR="/var/log/directadmin/errortaskq.log"

# Detection patterns
LOGIN_SERVICE_DIRECTADMIN_PATTERN_FAILED="FAILED LOGIN|login failure"
LOGIN_SERVICE_DIRECTADMIN_PATTERN_BRUTEFORCE="IP .* has been blocked"

# Thresholds
LOGIN_SERVICE_DIRECTADMIN_FAIL_THRESHOLD="5"
LOGIN_SERVICE_DIRECTADMIN_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_DIRECTADMIN_BAN_SHORT="900"
LOGIN_SERVICE_DIRECTADMIN_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_DIRECTADMIN_PERM_THRESHOLD="10"
LOGIN_SERVICE_DIRECTADMIN_PERM_PERIOD="86400"

# Risk multiplier (control panel = high value target)
LOGIN_SERVICE_DIRECTADMIN_RISK_MULTIPLIER="1.5"

# -----------------------------------------------------------------------------
# PURE-FTPD (FTP Server)
# -----------------------------------------------------------------------------
# Monitors: Pure-FTPd auth failures
# Source: journalctl -u pure-ftpd / /var/log/pureftpd.log
# Replaces: fail2ban [nftban-pure-ftpd] jail

LOGIN_SERVICE_PUREFTPD_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_PUREFTPD_UNITS="pure-ftpd"

# Log file path (fallback)
LOGIN_SERVICE_PUREFTPD_LOG="/var/log/pureftpd.log"

# Detection patterns
LOGIN_SERVICE_PUREFTPD_PATTERN_FAILED="Authentication failed|Login failed"
LOGIN_SERVICE_PUREFTPD_PATTERN_UNKNOWN="unknown user|user not found"

# Thresholds
LOGIN_SERVICE_PUREFTPD_FAIL_THRESHOLD="5"
LOGIN_SERVICE_PUREFTPD_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_PUREFTPD_BAN_SHORT="900"
LOGIN_SERVICE_PUREFTPD_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_PUREFTPD_PERM_THRESHOLD="12"
LOGIN_SERVICE_PUREFTPD_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_PUREFTPD_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# VSFTPD (FTP Server)
# -----------------------------------------------------------------------------
# Monitors: vsftpd auth failures
# Source: journalctl -u vsftpd / /var/log/vsftpd.log

LOGIN_SERVICE_VSFTPD_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_VSFTPD_UNITS="vsftpd"

# Log file path (fallback)
LOGIN_SERVICE_VSFTPD_LOG="/var/log/vsftpd.log"

# Detection patterns
LOGIN_SERVICE_VSFTPD_PATTERN_FAILED="FAIL LOGIN|authentication failure"

# Thresholds
LOGIN_SERVICE_VSFTPD_FAIL_THRESHOLD="5"
LOGIN_SERVICE_VSFTPD_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_VSFTPD_BAN_SHORT="900"
LOGIN_SERVICE_VSFTPD_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_VSFTPD_PERM_THRESHOLD="12"
LOGIN_SERVICE_VSFTPD_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_VSFTPD_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# PROFTPD (FTP Server)
# -----------------------------------------------------------------------------
# Monitors: ProFTPD auth failures
# Source: journalctl -u proftpd / /var/log/proftpd/proftpd.log

LOGIN_SERVICE_PROFTPD_ENABLED="true"

# Journalctl unit names
LOGIN_SERVICE_PROFTPD_UNITS="proftpd"

# Log file path (fallback)
LOGIN_SERVICE_PROFTPD_LOG="/var/log/proftpd/proftpd.log"

# Detection patterns
LOGIN_SERVICE_PROFTPD_PATTERN_FAILED="USER.*no such user|Login failed"

# Thresholds
LOGIN_SERVICE_PROFTPD_FAIL_THRESHOLD="5"
LOGIN_SERVICE_PROFTPD_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_PROFTPD_BAN_SHORT="900"
LOGIN_SERVICE_PROFTPD_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_PROFTPD_PERM_THRESHOLD="12"
LOGIN_SERVICE_PROFTPD_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_PROFTPD_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# APACHE (HTTP Auth)
# -----------------------------------------------------------------------------
# Monitors: HTTP Basic/Digest auth failures
# Source: Apache error logs

LOGIN_SERVICE_APACHE_AUTH_ENABLED="true"

# Log file paths
LOGIN_SERVICE_APACHE_ERROR="/var/log/apache2/error.log"
LOGIN_SERVICE_APACHE_ERROR_ALT="/var/log/httpd/error_log"

# Detection patterns
LOGIN_SERVICE_APACHE_PATTERN_FAILED="user .* authentication failure|client denied by server"
LOGIN_SERVICE_APACHE_PATTERN_NOUSER="user .* not found"

# Thresholds
LOGIN_SERVICE_APACHE_FAIL_THRESHOLD="5"
LOGIN_SERVICE_APACHE_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_APACHE_BAN_SHORT="900"
LOGIN_SERVICE_APACHE_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_APACHE_PERM_THRESHOLD="15"
LOGIN_SERVICE_APACHE_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_APACHE_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# NGINX (HTTP Auth)
# -----------------------------------------------------------------------------
# Monitors: HTTP Basic auth failures
# Source: Nginx error logs

LOGIN_SERVICE_NGINX_AUTH_ENABLED="true"

# Log file paths
LOGIN_SERVICE_NGINX_ERROR="/var/log/nginx/error.log"

# Detection patterns
LOGIN_SERVICE_NGINX_PATTERN_FAILED="user .* was not found|no user/password was provided"

# Thresholds
LOGIN_SERVICE_NGINX_FAIL_THRESHOLD="5"
LOGIN_SERVICE_NGINX_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_NGINX_BAN_SHORT="900"
LOGIN_SERVICE_NGINX_BAN_LONG="3600"

# Persistent offender
LOGIN_SERVICE_NGINX_PERM_THRESHOLD="15"
LOGIN_SERVICE_NGINX_PERM_PERIOD="86400"

# Risk multiplier
LOGIN_SERVICE_NGINX_RISK_MULTIPLIER="1.0"

# -----------------------------------------------------------------------------
# MODSECURITY (Web Application Firewall)
# -----------------------------------------------------------------------------
# Monitors: ModSecurity rule triggers (auth bypass attempts)
# Source: ModSecurity audit log

LOGIN_SERVICE_MODSECURITY_ENABLED="true"

# Log file paths
LOGIN_SERVICE_MODSECURITY_LOG="/var/log/modsec_audit.log"
LOGIN_SERVICE_MODSECURITY_LOG_ALT="/var/log/apache2/modsec_audit.log"

# Detection patterns (SQL injection, auth bypass attempts)
LOGIN_SERVICE_MODSECURITY_PATTERN_SQLI="SQL Injection|Access denied with code 403"
LOGIN_SERVICE_MODSECURITY_PATTERN_AUTH="Authentication|Login|Password"

# Thresholds (ModSecurity already filtered - lower threshold)
LOGIN_SERVICE_MODSECURITY_FAIL_THRESHOLD="3"
LOGIN_SERVICE_MODSECURITY_FAIL_WINDOW="300"

# Ban durations
LOGIN_SERVICE_MODSECURITY_BAN_SHORT="1800"
LOGIN_SERVICE_MODSECURITY_BAN_LONG="7200"

# Persistent offender (WAF triggers = serious)
LOGIN_SERVICE_MODSECURITY_PERM_THRESHOLD="5"
LOGIN_SERVICE_MODSECURITY_PERM_PERIOD="43200"

# Risk multiplier (WAF = pre-filtered, high confidence)
LOGIN_SERVICE_MODSECURITY_RISK_MULTIPLIER="1.5"

# =============================================================================
# END OF SERVICES CONFIGURATION
# =============================================================================
