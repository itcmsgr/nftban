# =============================================================================
# NFTBan - OSV-Scanner (Open Source Vulnerabilities)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Scan dependencies for known vulnerabilities using Google OSV database
#
# Runs on:
#   - Push to main branch
#   - Pull requests to main
#   - Weekly on Monday at 6:00 AM UTC
#
# Features:
#   - Scans Go modules (go.mod/go.sum)
#   - SARIF output for GitHub Security tab integration
# =============================================================================

name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 AM UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.12`).
          # GOTOOLCHAIN=local intentionally NOT set: this job installs the
          # third-party osv-scanner tool, whose go directive may require a
          # newer toolchain; local would block that auto-fetch.
          go-version: '1.25.12'

      # v1.229 CI hardening: the scanner binary download sat on the critical path
      # of this required job. An upstream releases 503 meant the tool was never
      # provisioned, nothing produced a SARIF, and the failure then surfaced from
      # the UPLOAD step as "Path does not exist" — attributing a provisioning
      # outage to a path bug.  NETWORK_TRANSIENT != RANDOM_REQUIRED_CI_FAILURE
      - name: Restore pinned OSV-Scanner (cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: osv-scanner
          key: osv-scanner-2.3.3-linux-amd64

      - name: Install OSV-Scanner
        id: install_scanner
        run: |
          set -uo pipefail
          # SCANNER_PROVISIONED is the single fact every later step keys on, so a
          # provisioning outage is never mistaken for a scan result.
          if [ -x osv-scanner ] && ./osv-scanner --version >/dev/null 2>&1; then
            echo "cached osv-scanner is usable: $(./osv-scanner --version 2>&1 | head -1)"
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # v1.161: retry/fail-fast hardening (mirrors v1.157 fetch_verified policy) —
          # transient github.com blips (HTTP 5xx) no longer hard-fail on first try.
          if curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
               --connect-timeout 10 --max-time 120 -sS \
               https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64 -o osv-scanner; then
            chmod +x osv-scanner
            ./osv-scanner --version
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            rm -f osv-scanner
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::error::SCANNER_NOT_PROVISIONED — osv-scanner v2.3.3 could not be downloaded after bounded retries. This is a provisioning failure, NOT a scan result and NOT a SARIF path problem."
            exit 1
          fi

      - name: Run OSV-Scanner
        id: scan
        if: steps.install_scanner.outputs.provisioned == 'true'
        run: |
          # Scan go.mod in lockfile mode.
          # Exit 0 = clean · 1 = findings AND/OR unused ignores · 128 = scan error
          #
          # ⛔ v1.229.4 PR-A — THE OBSERVABILITY DEFECT THIS FIXES.
          # GitHub runs `run:` blocks under `bash -e`. The previous form was
          #     ./osv-scanner …; OSV_EXIT=$?
          # and a simple command returning non-zero TERMINATES the script under -e.
          # So on every non-clean scan the step died AT the scanner line:
          #   · scanner_ran was never written -> the SARIF step reported
          #     "did not complete a scan"
          #   · the SARIF (which EXISTS on disk, containing the findings) was
          #     never uploaded
          #   · every classification branch below was DEAD CODE — the
          #     "found vulnerabilities" message never actually printed
          # Measured: 25/25 runs from 2026-08-13 produced no finding data, while a
          # diagnostic scan of the same tree reported 7 findings.
          #
          # `set +e` around the invocation is the whole fix: capture the status
          # instead of dying on it.
          set +e
          ./osv-scanner scan --config=osv-scanner.toml --lockfile=go.mod \
            --format=sarif --output=osv-results.sarif
          OSV_EXIT=$?
          set -e
          echo "scanner_ran=true" >> "$GITHUB_OUTPUT"
          echo "osv_exit=${OSV_EXIT}" >> "$GITHUB_OUTPUT"
          echo "osv exit=${OSV_EXIT}"
          if [[ "$OSV_EXIT" -eq 128 ]]; then
            # SCANNER_FAILURE: no vulnerability conclusion is possible.
            # ⛔ OBSERVATION FAILURE != CLEAN.
            echo "::error::SCANNER_FAILURE — OSV-Scanner exited 128 (scan error). No vulnerability conclusion can be drawn from this run."
            exit 1
          fi
          # ⛔ NO VERDICT HERE. rc=1 means findings AND/OR unused ignores, and the
          # exit code cannot tell them apart. The verdict is issued AFTER the SARIF
          # is validated and uploaded, from the scanner-native result count — so a
          # run containing real findings can never be lost or mislabelled as drift.

      # Runs even when an earlier step failed, so the SARIF contract is decided
      # HERE with attribution, rather than surfacing later as a path error.
      #   SCANNER_NOT_PROVISIONED != SCANNER_FAILED != NO_FINDINGS != PATH_WRONG
      # Not continue-on-error: a genuine provisioning/scan failure still fails
      # the job — it is simply reported as what it is.
      - name: Check SARIF output
        id: sarif
        if: always()
        run: |
          if [ "${{ steps.install_scanner.outputs.provisioned }}" != "true" ]; then
            echo "PROVISIONING_FAILURE — the scanner was never provisioned, so no scan ran."
            echo "Refusing to synthesise an empty SARIF: an empty result set would"
            echo "publish 'no vulnerabilities found' for a scan that never happened."
            echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.scan.outputs.scanner_ran }}" != "true" ]; then
            echo "SCANNER_FAILURE — the scanner was provisioned but did not complete a scan."
            echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f osv-results.sarif ]; then
            echo "SARIF produced by a scan that actually ran (osv exit ${{ steps.scan.outputs.osv_exit }})"
            echo "sarif_ready=true" >> "$GITHUB_OUTPUT"
            head -50 osv-results.sarif
            exit 0
          fi
          # The scanner ran successfully and was told --output=osv-results.sarif,
          # so the file MUST exist. Its absence is a broken producer/consumer
          # contract, not a clean result — and synthesising an empty SARIF here
          # would publish "no findings" for output we never actually saw.
          echo "::error::ARTIFACT_CONTRACT_FAILURE — osv-scanner exited ${{ steps.scan.outputs.osv_exit }} but produced no osv-results.sarif. The output contract was violated; no vulnerability conclusion can be drawn."
          echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
          exit 1

      # Uploads only a SARIF that actually represents a scan. Without this guard
      # the uploader failed on a missing path and MASKED the real cause.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        if: always() && steps.sarif.outputs.sarif_ready == 'true'
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      # v1.229.4 PR-A. The verdict is issued LAST, from the scanner-native SARIF,
      # so the finding evidence is uploaded before any failure is raised.
      #
      #   FINDINGS DOMINATE. rc=1 can mean findings, unused ignores, or BOTH. The
      #   count of scanner-native results decides — never the exit code, and never
      #   a message match. A run with 7 findings and 34 unused ignores is a
      #   SECURITY FINDING, not configuration drift.
      #
      #   ⛔ UNUSED_IGNORE != VULNERABILITY   ⛔ OBSERVATION FAILURE != CLEAN
      - name: OSV verdict (scanner-native results)
        if: always() && steps.install_scanner.outputs.provisioned == 'true'
        env:
          OSV_EXIT: ${{ steps.scan.outputs.osv_exit }}
          SARIF_READY: ${{ steps.sarif.outputs.sarif_ready }}
        run: |
          if [[ "$SARIF_READY" != "true" ]]; then
            echo "::error::OBSERVATION_FAILURE — no validated SARIF for this scan (osv exit ${OSV_EXIT}). No vulnerability conclusion can be drawn; this is NOT a clean result."
            exit 1
          fi
          RESULTS=$(python3 - <<'PY'
          import json,sys
          try:
              d=json.load(open('osv-results.sarif'))
          except Exception as e:
              print("PARSE_FAILURE", file=sys.stderr); sys.exit(2)
          print(sum(len(r.get('results',[])) for r in d.get('runs',[])))
          PY
          ) || {
            echo "::error::OBSERVATION_FAILURE — osv-results.sarif exists but is not parseable. ⛔ An unparseable artifact is NOT an empty one."
            exit 1
          }
          echo "scanner-native SARIF results: ${RESULTS}"
          if [[ "$RESULTS" -gt 0 ]]; then
            echo "::error title=OSV vulnerability findings::OSV-Scanner reported ${RESULTS} finding(s) in Go dependencies/stdlib. See the Security tab (category osv-scanner) for the uploaded SARIF. Coincident suppression drift, if any, does NOT downgrade this."
            exit 1
          fi
          if [[ "$OSV_EXIT" -ne 0 ]]; then
            echo "::error title=OSV suppression drift::The scan reported ZERO findings but exited ${OSV_EXIT} — osv-scanner.toml lists ignores that match nothing. This is CONFIGURATION DRIFT, not a vulnerability. ⛔ UNUSED_IGNORE != VULNERABILITY."
            exit 1
          fi
          echo "CLEAN — scan completed, SARIF validated, zero scanner-native results."
