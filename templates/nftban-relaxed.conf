# nftban-relaxed.conf
# Relaxed per-source limits

# ICMP flood protection (more generous)
ip saddr limit rate over 20/second burst 40 packets drop
icmp type echo-request accept
ip6 saddr limit rate over 20/second burst 40 packets drop
icmpv6 type echo-request accept

# DNS per-source limit
udp dport 53 ip saddr limit rate over 100/second burst 200 packets drop
udp dport 53 accept
udp dport 53 ip6 saddr limit rate over 100/second burst 200 packets drop
udp dport 53 accept

# Per-service connection caps (IPv4)
tcp dport {22,2222} ct count over 10 { ip saddr } log prefix "nftables: ssh-connlimit " drop
tcp dport {25,465,587,110,143,993,995} ct count over 40 { ip saddr } log prefix "nftables: mail-connlimit " drop
tcp dport {80,443,853} ct count over 500 { ip saddr } log prefix "nftables: web-connlimit " drop
tcp dport {20,21,139,445,35000-35999,55000,10050,10051,700,800} ct count over 100 { ip saddr } log prefix "nftables: misc-connlimit " drop

# Per-service connection caps (IPv6)
tcp dport {22,2222} ct count over 10 { ip6 saddr } log prefix "nftables: ssh6-connlimit " drop
tcp dport {25,465,587,110,143,993,995} ct count over 40 { ip6 saddr } log prefix "nftables: mail6-connlimit " drop
tcp dport {80,443,853} ct count over 500 { ip6 saddr } log prefix "nftables: web6-connlimit " drop
tcp dport {20,21,35000-35999,700,800} ct count over 100 { ip6 saddr } log prefix "nftables: misc6-connlimit " drop

# Per-source SYN flood protection
tcp flags syn ct state new ip saddr limit rate over 50/second burst 100 packets drop
tcp flags syn ct state new ip6 saddr limit rate over 50/second burst 100 packets drop
