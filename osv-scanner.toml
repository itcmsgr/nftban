# === Build-target policy ===
# NFTBan builds RPM/DEB packages for older distros (RHEL 8/9/10, Debian 11/12/13/14,
# Ubuntu 22.04/24.04). Build runners use Go 1.25.8+, which includes all stdlib
# fixes up to and including the entries above.
#
# Newer stdlib CVEs (post-1.25.8) are tracked in the section below. Because
# Go binaries embed their compile-time stdlib, the runtime Go version on the
# end-user system does not affect the binary's exposure — the compile-time
# Go is what matters. Bumping past 1.25.8 is a release-policy decision and
# does not happen automatically; this section gets refreshed by
# tools/refresh-osv-suppressions.sh and should be reviewed each release cut.

# === Stdlib CVEs published after 1.25.8 ===
