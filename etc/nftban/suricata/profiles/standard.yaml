# =============================================================================
# NFTBan Suricata Profile: Standard (DEFAULT)
# =============================================================================
# Target: 4 cores, 4-8 GB RAM
# Focus: Balanced coverage and performance
# Use Case: Most servers, recommended default
#
# BASELINE CORRECTIONS (v1.12.6):
# - tpacket-v3: yes (75-81% memory savings on RHEL-family)
# - mpm-algo: hs (Hyperscan pattern matching, auto-fallback safe)
# - stream.inline: yes (faster alert emission per Victor Julien)
# - checksum-validation: no (kernel/NIC already validates)
# - stream.bypass: yes with depth: 1mb (skip long-session deep inspection)
# - CPU affinity: yes (prevents scheduler jitter)
# =============================================================================

%YAML 1.1
---

# Packet capture interface
af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    ring-size: 100000          # BALANCED
    use-mmap: yes
    tpacket-v3: yes            # BASELINE: 75-81% memory savings on RHEL

# Threading configuration
threading:
  set-cpu-affinity: yes        # BASELINE: prevents scheduler jitter
  detect-thread-ratio: 1.5     # Balanced
  cpu-affinity:
    management-cpu-set:
      cpu: [ 0 ]
    worker-cpu-set:
      cpu: [ 1, 2, 3 ]

# Flow timeout settings (ALIGNED: 60s established per NFTBan constraint)
flow:
  memcap: 128mb                # Moderate memory
  hash-size: 131072
  prealloc: 20000
  timeout:
    new: 30
    established: 60            # ALIGNED with NFTBan constraint (was 120)
    closed: 0
    bypassed: 100
    emergency-new: 10
    emergency-established: 30
    emergency-closed: 0

# Stream engine
stream:
  memcap: 64mb
  checksum-validation: no      # BASELINE: kernel/NIC already validates
  inline: yes                  # BASELINE: faster alert emission (Victor Julien)
  bypass: yes                  # BASELINE: skip long-session deep inspection
  reassembly:
    depth: 1mb                 # BASELINE: bypass after 1MB transferred
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

# HTTP configuration (LIMITED body inspection)
app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 20kb       # LIMITED inspection (10-30KB range)
          response-body-limit: 0         # DISABLED per NFTBan constraint
          request-body-minimal-inspect-size: 4096
          request-body-inspect-window: 4096
          response-body-minimal-inspect-size: 4096
          response-body-inspect-window: 4096
          double-decode-path: no
          double-decode-query: no

    tls:
      enabled: yes
      detection-ports:
        dp: 443
      ja3-fingerprints: yes

    ssh:
      enabled: yes

    dns:
      enabled: yes
      tcp:
        enabled: yes
      udp:
        enabled: yes

    smtp:
      enabled: yes
      raw-extraction: no

    mysql:
      enabled: yes

    # Still disabled for performance
    smb:
      enabled: no
    dcerpc:
      enabled: no
    ftp:
      enabled: no

# Logging configuration
outputs:
  - fast:
      enabled: no

  # 1) NFTBan daemon reads ONLY this file (alert-only, minimal I/O)
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/nftban/suricata/eve-alerts.json
      threaded: yes

      types:
        - alert:
            payload: no          # DISABLED per NFTBan constraint
            packet: no           # DISABLED per NFTBan constraint
            metadata: yes

  # 2) Optional admin/audit log (OFF by default to avoid I/O storms)
  - eve-log:
      enabled: no
      filetype: regular
      filename: /var/log/nftban/suricata/eve-audit.json
      threaded: yes

      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
        - anomaly:
            enabled: yes
        - http:
            extended: yes
        - dns:
            query: yes
            answer: yes
        - tls:
            extended: yes
            session-resumption: yes
        - ssh

# Detection engine
detect:
  profile: medium              # MEDIUM CPU usage
  mpm-algo: hs                 # BASELINE: Hyperscan (auto-fallback if unavailable)
  custom-values:
    toclient-groups: 3
    toserver-groups: 3
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

# Profiling
profiling:
  rules:
    enabled: no
  keywords:
    enabled: no

# Detection engine configuration
detect-engine:
  - profile: medium
  - sgh-mpm-context: auto
  - inspection-recursion-limit: 3000
  - rule-reload: true

# Default rule path
default-rule-path: /var/lib/suricata/rules

# Rule files (managed by NFTBan)
rule-files:
  - /etc/nftban/suricata/rules/enabled.list

# Classification file
classification-file: /etc/suricata/classification.config

# Reference config file
reference-config-file: /etc/suricata/reference.config

# GeoIP database
geoip-database: /var/lib/GeoIP/GeoLite2-Country.mmdb

# =============================================================================
# NFTBan Integration Notes:
# - This is the DEFAULT profile (auto-selected for 4+ cores / 4-8GB RAM)
# - HTTP request body inspection ENABLED (20KB), response body DISABLED
# - Flow timeouts: ALIGNED (60s established per NFTBan constraint)
# - Most protocols enabled (HTTP, TLS, SSH, DNS, SMTP, MySQL)
# - Ring size: 100k frames
# - Detection profile: MEDIUM
# - JA3 fingerprinting enabled for TLS
# - Output: alert-only to eve-alerts.json (daemon path)
# - Audit log: disabled by default (eve-audit.json)
#
# BASELINE CORRECTIONS (v1.12.6):
# - tpacket-v3: yes - Recommended by Suricata, 75-81% memory savings on RHEL
# - mpm-algo: hs - Hyperscan pattern matching, auto-fallback safe
# - stream.inline: yes - Faster alert emission per Victor Julien guidance
# - checksum-validation: no - Kernel/NIC already validates, avoid redundant work
# - stream.bypass: yes - Skip long-session deep inspection (NFTBan uses early signals)
# - CPU affinity: yes - Prevents scheduler jitter on multi-core systems
# =============================================================================
