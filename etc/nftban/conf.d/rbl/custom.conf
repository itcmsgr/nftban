# =============================================================================
# NFTBan RBL Custom Overrides
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Enable/disable specific RBLs and IPs
#
# **Format**
# enablerbl:domain     - Enable specific RBL (add to check list)
# disablerbl:domain    - Disable specific RBL (exclude from checks)
# enableip:IP          - Force check specific IP
# disableip:IP         - Exclude specific IP from checks
#
# **Examples**
#
# Disable slow/unreliable RBL:
# disablerbl:slow.rbl.example.com
#
# Add custom RBL:
# enablerbl:my.custom.rbl.net:https://example.com/info
#
# Force check specific IP:
# enableip:203.0.113.50
#
# Exclude management IP from checks:
# disableip:10.0.0.1
# =============================================================================

# Custom RBL enable/disable entries
# (One per line)

