# nftban-strict.conf
# Strict per-source limits

# ICMP flood protection
# Per-service connection caps (IPv4)
tcp dport {22,2222} ct count over 5 { ip saddr } log prefix "nftables: ssh-connlimit " drop
tcp dport {25,465,587,110,143,993,995} ct count over 20 { ip saddr } log prefix "nftables: mail-connlimit " drop
tcp dport {80,443,853} ct count over 200 { ip saddr } log prefix "nftables: web-connlimit " drop
tcp dport {20,21,139,445,35000-35999,55000,10050,10051,700,800} ct count over 50 { ip saddr } log prefix "nftables: misc-connlimit " drop

# Per-source SYN flood protection
tcp flags syn ct state new ip saddr limit rate over 20/second burst 40 packets drop
