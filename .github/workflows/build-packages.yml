# =============================================================================
# NFTBan - Build Packages
# =============================================================================
# SPDX-License-Identifier: MPL-2.0

name: Build NFTBan Packages

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # ==========================================================================
  # VALIDATE BUNDLED DEPENDENCIES (yq checksum consistency)
  # ==========================================================================
  validate-dependencies:
    name: Validate bundled dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate yq checksums are consistent
        run: |
          echo "Checking yq SHA256 checksums across build files..."

          # Extract all YQ_SHA256 values
          CHECKSUMS=$(grep -roh 'YQ_SHA256="[a-f0-9]\{64\}"' packaging/ | sort -u)
          COUNT=$(echo "$CHECKSUMS" | wc -l)

          echo "Found $COUNT unique YQ_SHA256 definitions:"
          echo "$CHECKSUMS"

          if [[ $COUNT -ne 1 ]]; then
            echo "ERROR: Multiple different yq checksums found!"
            echo "All checksums must match. Found:"
            grep -rn 'YQ_SHA256=' packaging/
            exit 1
          fi

          # Extract the checksum value
          YQ_SHA256=$(echo "$CHECKSUMS" | head -1 | cut -d'"' -f2)
          echo "Verifying checksum: $YQ_SHA256"

          # Download yq and verify
          YQ_VERSION=$(grep -oh 'YQ_VERSION="[0-9.]*"' packaging/build_nftban.sh | head -1 | cut -d'"' -f2)
          echo "yq version: $YQ_VERSION"

          curl -sL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq_linux_amd64
          ACTUAL_SHA=$(sha256sum /tmp/yq_linux_amd64 | cut -d' ' -f1)

          echo "Expected: $YQ_SHA256"
          echo "Actual:   $ACTUAL_SHA"

          if [[ "$YQ_SHA256" != "$ACTUAL_SHA" ]]; then
            echo "ERROR: yq checksum mismatch!"
            echo "The bundled checksum is outdated. Update with:"
            echo "  YQ_SHA256=\"$ACTUAL_SHA\""
            exit 1
          fi

          echo "✅ yq checksum validated successfully"

  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    needs: validate-dependencies
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          go-version: '1.24'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Install templ code generator
        run: go install github.com/a-h/templ/cmd/templ@v0.3.977

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la bin/

      - name: Validate binaries are real ELF files
        run: |
          echo "Validating Go binaries..."
          for binary in bin/nftban-core bin/nftband bin/nftban-ui bin/nftban-ui-auth; do
            if [[ -f "$binary" ]]; then
              file_type=$(file -b "$binary")
              if [[ "$file_type" != *"ELF"* ]]; then
                echo "ERROR: $binary is NOT an ELF binary!"
                echo "Got: $file_type"
                exit 1
              fi
              size=$(stat -c%s "$binary")
              if [[ $size -lt 100000 ]]; then
                echo "ERROR: $binary is too small ($size bytes) - likely corrupted"
                exit 1
              fi
              echo "✓ $binary: valid ELF ($size bytes)"
            else
              echo "ERROR: $binary not found!"
              exit 1
            fi
          done
          echo "All binaries validated successfully"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EL family (covers Rocky, Alma, RHEL, CentOS Stream)
          # Tier 0: el9 (primary/required)
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          # Tier 1: el10 (future/planned)
          - distro: el10
            container: almalinux:10
            name_suffix: el10
          # Note: Fedora removed - rolling release, not LTS

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # Install build dependencies (curl required for yq download)
            # Note: --allowerasing handles curl-minimal vs curl conflict on Rocky/Alma
            dnf -y install --allowerasing rpm-build rpmdevtools tar gzip systemd-rpm-macros make curl

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh rpm

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              # Rename: nftban-core-1.0.0-1.el10.x86_64.rpm -> nftban-el10-x86_64.rpm
              newname="nftban-${{ matrix.name_suffix }}-x86_64.rpm"
              cp "$rpm" "dist/packages/$newname"
              echo "Renamed: $(basename "$rpm") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate RPM package contains valid binaries
        run: |
          echo "Validating RPM package binaries..."
          for rpm in dist/packages/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Checking: $rpm"
              mkdir -p /tmp/rpm-check
              cd /tmp/rpm-check
              rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idmv 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-ui usr/lib/nftban/bin/nftban-ui-auth; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in RPM is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/rpm-check
            fi
          done
          echo "All RPM packages validated successfully"

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 0: Primary/Required
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12
          # Tier 1: Future/Planned
          - distro: debian13
            container: debian:trixie
            name_suffix: debian13
          # Tier 2: Legacy/Best-Effort
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # Install build dependencies (curl required for yq download)
            for i in 1 2 3; do
              apt-get update && apt-get install -y dpkg-dev build-essential file curl && break
              echo \"Retry \$i: apt-get failed, retrying in 5s...\"
              sleep 5
            done

            # Build DEB
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh deb

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              # Rename: nftban-core_1.0.0_amd64.deb -> nftban-ubuntu22.04-amd64.deb
              newname="nftban-${{ matrix.name_suffix }}-amd64.deb"
              cp "$deb" "dist/packages/$newname"
              echo "Renamed: $(basename "$deb") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate DEB package contains valid binaries
        run: |
          echo "Validating DEB package binaries..."
          for deb in dist/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Checking: $deb"
              mkdir -p /tmp/deb-check
              cd /tmp/deb-check
              ar x "$GITHUB_WORKSPACE/$deb"
              tar -xf data.tar.* 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-ui usr/lib/nftban/bin/nftban-ui-auth; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in DEB is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/deb-check
            fi
          done
          echo "All DEB packages validated successfully"

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

  # ==========================================================================
  # TEST INSTALLATION (RPM - CentOS Stream)
  # ==========================================================================
  test-rpm-install:
    name: Test RPM install (${{ matrix.distro }})
    needs: build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: centos-stream9
            container: quay.io/centos/centos:stream9
            rpm_artifact: rpm-el9
          - distro: centos-stream10
            container: quay.io/centos/centos:stream10
            rpm_artifact: rpm-el10
          - distro: rocky9
            container: rockylinux:9
            rpm_artifact: rpm-el9
          - distro: alma9
            container: almalinux:9
            rpm_artifact: rpm-el9

    steps:
      - name: Wait for artifact availability
        run: sleep 10

      - name: Download RPM packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.rpm_artifact }}
          path: ./packages
        timeout-minutes: 2
        continue-on-error: false

      - name: Test installation on ${{ matrix.distro }}
        run: |
          docker run --rm -v $(pwd)/packages:/packages ${{ matrix.container }} bash -c "
            dnf install -y /packages/*.rpm &&
            nftban --version &&
            systemctl list-unit-files | grep nftban
          " && echo "✅ ${{ matrix.distro }} install test passed" || echo "❌ ${{ matrix.distro }} install test failed"

  # ==========================================================================
  # TEST INSTALLATION (DEB)
  # ==========================================================================
  test-deb-install:
    name: Test DEB install (${{ matrix.distro }})
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            deb_artifact: deb-ubuntu22.04
          - distro: ubuntu24.04
            container: ubuntu:24.04
            deb_artifact: deb-ubuntu24.04
          - distro: debian12
            container: debian:12
            deb_artifact: deb-debian12
          - distro: debian13
            container: debian:trixie
            deb_artifact: deb-debian13

    steps:
      - name: Download DEB packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.deb_artifact }}
          path: ./packages

      - name: Test installation on ${{ matrix.distro }}
        run: |
          docker run --rm -v $(pwd)/packages:/packages ${{ matrix.container }} bash -c "
            apt-get update &&
            apt-get install -y /packages/*.deb &&
            nftban --version &&
            systemctl list-unit-files | grep nftban
          " && echo "✅ ${{ matrix.distro }} install test passed" || echo "❌ ${{ matrix.distro }} install test failed"

  # ==========================================================================
  # CONSOLIDATE ALL PACKAGES
  # ==========================================================================
  consolidate-packages:
    name: Consolidate all packages
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: List all packages
        run: |
          echo "=== All packages built ==="
          find all-packages -name "*.rpm" -o -name "*.deb" | sort
          echo ""
          echo "=== Package counts ==="
          echo "DEB: $(find all-packages -name '*.deb' | wc -l)"
          echo "RPM: $(find all-packages -name '*.rpm' | wc -l)"

      - name: Generate package summary
        run: |
          echo "## Built Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RPM Packages (EL + Fedora)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for rpm in $(find all-packages -name "*.rpm" | sort); do
            name=$(basename "$rpm")
            echo "| $(dirname "$rpm" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DEB Packages (Ubuntu + Debian)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for deb in $(find all-packages -name "*.deb" | sort); do
            name=$(basename "$deb")
            echo "| $(dirname "$deb" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================================================
  # UPLOAD TO GITHUB RELEASE
  # ==========================================================================
  upload-release:
    name: Upload packages to GitHub Release
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Get version from VERSION file
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download all package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-packages/

      - name: Organize packages for release
        run: |
          mkdir -p release/
          # Copy RPM packages
          find release-packages -name "*.rpm" -exec cp {} release/ \;
          # Copy DEB packages
          find release-packages -name "*.deb" -exec cp {} release/ \;
          echo "=== Packages for release ==="
          ls -lh release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NFTBan v${{ steps.version.outputs.version }}
          body: |
            ## NFTBan v${{ steps.version.outputs.version }}

            **Installation packages for multiple distributions**

            ### 📦 RPM Packages (RHEL/Rocky/Alma)
            - `nftban-el9-x86_64.rpm` - RHEL/Rocky/Alma 9 (Tier 0)
            - `nftban-el10-x86_64.rpm` - RHEL/Rocky/Alma 10 (Tier 1)

            ### 📦 DEB Packages (Ubuntu/Debian)
            - `nftban-ubuntu24.04-amd64.deb` - Ubuntu 24.04 LTS (Tier 0)
            - `nftban-debian12-amd64.deb` - Debian 12 (Tier 0)
            - `nftban-debian13-amd64.deb` - Debian 13 (Tier 1)
            - `nftban-ubuntu22.04-amd64.deb` - Ubuntu 22.04 LTS (Tier 2)

            ### ✨ Features
            - **Prerequisite checks** - Validates system before installation
            - **GeoIP database** - Automatically downloads MaxMind GeoLite2-City (FREE)
            - **Auto-updates** - Weekly GeoIP and threat feed updates via systemd timers
            - **No manual config** - Works out of the box

            ### 📖 Documentation
            - [Installation Guide](https://github.com/itcmsgr/nftban/wiki)
            - [GeoIP Database Guide](https://github.com/itcmsgr/nftban/wiki/GeoIP-Database-Guide)
            - [CLI Commands Reference](https://github.com/itcmsgr/nftban/wiki/CLI-Commands-Reference)

            Built from commit: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
