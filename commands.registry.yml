    stats:
      mutates: false
      description: "Show ban/alert statistics"
      options:
        --json: {type: bool, description: "Output in JSON format"}
    logs:
      mutates: false
      description: "View recent login alerts"
      arguments:
        lines:
          type: int
          required: false
