        - uuid: 4b3243bb2867437e9b83e6c0736c955d
          name: 'NFTBan: Connections active'
          type: TRAP
          key: nftban.connections.active
          value_type: UNSIGNED
          description: 'Total active TCP connections'
          tags:
            - tag: component
              value: network

        - uuid: 0e574709817940c2bc181e014bf6aa6c
          name: 'NFTBan: Connections established'
          type: TRAP
          key: nftban.connections.established
          value_type: UNSIGNED
          description: 'Established TCP connections'
          tags:
            - tag: component
              value: network

        - uuid: fe735b43cf8f41eba32680c90fb8a630
          name: 'NFTBan: Connections TIME_WAIT'
          type: TRAP
          key: nftban.connections.time.wait
          value_type: UNSIGNED
          description: 'TCP connections in TIME_WAIT state'
          tags:
            - tag: component
              value: network

        - uuid: a5096753f0b8441c9cc652264076229c
          name: 'NFTBan: Connections CLOSE_WAIT'
          type: TRAP
          key: nftban.connections.close.wait
          value_type: UNSIGNED
          description: 'TCP connections in CLOSE_WAIT state'
          tags:
            - tag: component
              value: network

        # --- System Metrics - Update: 1m ---
        - uuid: d8f1dbdfb1664801a2b74f76472e97cb
          name: 'NFTBan: Memory used percent'
          type: TRAP
          key: nftban.server.mem.used.percent
          value_type: FLOAT
          units: '%'
          description: 'System memory used percentage'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c0675ed4402847d98bc951d512177c95
              expression: 'last(/NFTBan/nftban.server.mem.used.percent)>90'
              name: 'Memory usage critical (>90%)'
              priority: HIGH
              tags:
                - tag: component
                  value: system

        - uuid: db46ec93940a491bacb7242fea516f78
          name: 'NFTBan: I/O wait percent'
          type: TRAP
          key: nftban.server.iowait.percent
          value_type: FLOAT
          units: '%'
          description: 'System I/O wait percentage'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 44a107d4170e44b2b121557d91723039
              expression: 'last(/NFTBan/nftban.server.iowait.percent)>50'
              name: 'High I/O wait (>50%)'
              priority: WARNING
              tags:
                - tag: component
                  value: system

        - uuid: d25d906886c04ed9b2894b36ecfecfd9
          name: 'NFTBan: Disk used percent'
          type: TRAP
          key: nftban.server.disk.used.percent
          value_type: FLOAT
          units: '%'
          description: 'Disk usage percentage (/var/log)'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 18718b80df254f2b815997dced547067
              expression: 'last(/NFTBan/nftban.server.disk.used.percent)>85'
              name: 'Disk usage high (>85%)'
              priority: WARNING
              tags:
                - tag: component
                  value: system

      # =======================================================================
      # DISCOVERY RULES (LLD)
      # =======================================================================
      discovery_rules:
        # --- Module Discovery ---
        - uuid: f7e79fba994e43dab398d9d17609c2ee
          name: 'NFTBan: Module discovery'
          type: TRAP
          key: nftban.discovery.modules
          description: 'Discover all NFTBan modules'
          item_prototypes:
            - uuid: e5dcadc17c7e466b81b4627cc4d1320d
              name: 'NFTBan: Module {#MODULE} status'
              type: TRAP
              key: 'nftban.module.status[{#MODULE}]'
              value_type: FLOAT
              description: 'Module {#MODULE} status: 1=ok, 0=error, -1=disabled'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
            - uuid: a0eb3a7cd5a4486ab05e1a94e52475dc
              name: 'NFTBan: Module {#MODULE} bans'
              type: TRAP
              key: 'nftban.module.bans[{#MODULE}]'
              value_type: UNSIGNED
              description: 'Bans from module {#MODULE}'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
          trigger_prototypes:
            - uuid: 3b5239f4c6f74437abe992e225010f6a
              expression: 'last(/NFTBan/nftban.module.status[{#MODULE}])=0'
              name: 'NFTBan module {#MODULE} failed'
              priority: HIGH
              description: 'Module {#MODULE} is in error state.'

        # --- Feed Discovery ---
        - uuid: 920dbbed25ac46cc9d848ead116f909a
          name: 'NFTBan: Feed discovery'
          type: TRAP
          key: nftban.discovery.feeds
          description: 'Discover configured threat feeds'
          item_prototypes:
            - uuid: 05b16d61cec84407b8075ae1abb60a74
              name: 'NFTBan: Feed {#FEED} status'
              type: TRAP
              key: 'nftban.feed.status[{#FEED}]'
              value_type: UNSIGNED
              description: 'Feed {#FEED} status: 1=ok, 0=error'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: d90f944c487b49dd81eb46eb142b5bfe
              name: 'NFTBan: Feed {#FEED} IPs'
              type: TRAP
              key: 'nftban.feed.ips[{#FEED}]'
              value_type: UNSIGNED
              description: 'IPs loaded from {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: fdc6a81c26e448578d435ce382770ed6
              name: 'NFTBan: Feed {#FEED} last update'
              type: TRAP
              key: 'nftban.feed.last_update[{#FEED}]'
              value_type: UNSIGNED
              units: unixtime
              description: 'Last update timestamp for {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
          trigger_prototypes:
            - uuid: 7f7c98c96759402f83aab17e260521a3
              expression: 'last(/NFTBan/nftban.feed.status[{#FEED}])=0'
              name: 'NFTBan feed {#FEED} failed'
              priority: WARNING
              description: 'Threat feed {#FEED} failed to load.'

        # --- Country Discovery ---
        - uuid: 100063defe5b4dbab12ab837eec447e6
          name: 'NFTBan: Country discovery'
          type: TRAP
          key: nftban.discovery.countries
          description: 'Discover countries with ban activity'
          item_prototypes:
            - uuid: 5e629db058674b7f91c09c6f5611ac8a
              name: 'NFTBan: Country {#COUNTRY} bans'
              type: TRAP
              key: 'nftban.country.bans[{#COUNTRY}]'
              value_type: UNSIGNED
              description: 'Active bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'
            - uuid: ecab83f6916045489c5a8211228f9b8f
              name: 'NFTBan: Country {#COUNTRY} bans (24h)'
              type: TRAP
              key: 'nftban.country.bans_24h[{#COUNTRY}]'
              value_type: UNSIGNED
              description: '24h bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'

