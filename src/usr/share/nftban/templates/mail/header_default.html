<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTBan - {SUBJECT}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #0066cc;
            padding-bottom: 20px;
        }
        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #333333;
            margin: 10px 0;
            font-size: 28px;
        }
        .server-info {
            color: #666666;
            font-size: 14px;
            margin-top: 10px;
        }
        .server-info p {
            margin: 5px 0;
        }
        .content {
            color: #333333;
            font-size: 15px;
        }
        .content h2 {
            color: #0066cc;
            font-size: 22px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .content h3 {
            color: #0066cc;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .content p {
            margin: 10px 0;
        }
        .content ul, .content ol {
            margin: 10px 0;
            padding-left: 25px;
        }
        .content li {
            margin: 5px 0;
        }
        .content code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }
        .content pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }
        .alert {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .alert-success {
            background-color: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
        }
        .alert-warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        .alert-info {
            background-color: #d1ecf1;
            border-left: 4px solid #17a2b8;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            {LOGO_HTML}
            <h1>🛡️ NFTBan Security System</h1>
            <div class="server-info">
                {COMPANY_NAME}
                <p>Server: <strong>{HOSTNAME}</strong></p>
                {VERSION_HTML}
            </div>
        </div>
        <div class="content">
