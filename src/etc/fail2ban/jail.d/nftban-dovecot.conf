# NFTBan Fail2ban Jail - Dovecot IMAP/POP3
#
# Monitors Dovecot mail server authentication failures.
# Protects IMAP and POP3 services from brute force attacks.
#
# Configuration:
# - maxretry: 9 failed attempts
# - findtime: 10 minutes (600 seconds)
# - bantime: 1 hour (3600 seconds)
#
# Uses custom NFTBan filter for better detection
# Based on DirectAdmin production configuration

[nftban-dovecot]

# Disabled by default - enable if Dovecot is installed
enabled   = false

# IMAP and POP3 ports
port      = pop3,pop3s,imap,imaps,submission,sieve

# Use NFTBan custom Dovecot filter
filter    = nftban-dovecot-custom

# Dovecot/mail log location
logpath   = /var/log/maillog
            /var/log/mail.log
            /var/log/dovecot.log

# Moderate threshold
maxretry  = 9
findtime  = 10m

# Short ban (1 hour)
bantime   = 1h

# Auto-detect backend
backend   = auto

# Use NFTBan action
action    = nftban[name=dovecot]
