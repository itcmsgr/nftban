# =============================================================================
# NFTBan v1.0.0 - Persistent Offender Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Auto-escalate repeat temp-ban offenders to permanent bans
#
# IMPORTANT: Do NOT edit this file - it will be overwritten on updates!
# Create /etc/nftban/conf.d/persistent.conf.local for your customizations.
#
# meta:name="persistent.conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2026-01-27"
# meta:description="Persistent offender escalation configuration"
# meta:inventory.files="/var/log/nftban/persistent-offenders.log"
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/persistent.conf.local"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
# =============================================================================
#
# HOW IT WORKS:
# -------------
# When an IP is temp-banned (by any module: loginmon, portscan, ddos, suricata,
# or CLI), the persistent offender tracker logs the event. If the same IP
# accumulates >= threshold temp bans within the configured period, it is
# automatically escalated to a PERMANENT ban.
#
# Permanent bans are:
#   1. Written to /etc/nftban/blacklist.d/30-persistent-offenders.conf
#   2. Added to nftables without timeout (survives reboots via sync)
#   3. Logged to /var/log/nftban/persistent-offenders.log
#
# QUICK SETUP:
# ------------
# 1. Create /etc/nftban/conf.d/persistent.conf.local with your overrides
# 2. Restart nftband: systemctl restart nftband
#
# Example persistent.conf.local:
#   [global]
#   default_threshold = 5       # Stricter: 5 bans instead of 10
#   default_period = 12h        # Shorter window
#
#   [loginmon]
#   threshold = 3               # SSH brute force: 3 strikes permanent
#   period = 6h
#
# =============================================================================

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
# These apply to ALL sources unless overridden by a per-filter section.

[global]

# Enable persistent offender tracking (true/false)
# When false, temp bans never escalate to permanent
enabled = true

# Default number of temp bans before escalation to permanent
# An IP must be temp-banned this many times within default_period
default_threshold = 10

# Default time window for counting bans
# Supported formats: 1h, 6h, 12h, 24h, 48h, 7d
default_period = 24h

# Action when threshold exceeded: permanent (only supported action)
default_action = permanent

# =============================================================================
# PER-FILTER OVERRIDES
# =============================================================================
# Each section name matches a ban source (module name).
# Sources: loginmon, portscan, ddos, suricata, manual
#
# Override any of: threshold, period, action, comment
# Unset values inherit from [global].
#
# Examples (uncomment to enable):
#
# [loginmon]
# threshold = 5
# period = 12h
# comment = "SSH/login brute force - stricter threshold"
#
# [portscan]
# threshold = 3
# period = 6h
# comment = "Port scanners - aggressive escalation"
#
# [ddos]
# threshold = 2
# period = 1h
# comment = "DDoS sources - very aggressive escalation"
#
# [suricata]
# threshold = 5
# period = 24h
# comment = "IDS alert sources"
