# =============================================================================
# NFTBan Security Profile: Mail Server
# =============================================================================
# Optimized for: Postfix, Dovecot, SMTP/POP3/IMAP protection
# Best for: Mail servers, email gateways
# =============================================================================

PROFILE_NAME="mail-server"
PROFILE_DESCRIPTION="Mail Server - SMTP, POP3, IMAP protection"

# =============================================================================
# DDOS PROTECTION
# =============================================================================

DDOS_PROTECTION_ENABLED="true"

# SYN Flood: Enabled (mail servers often targeted)
DDOS_SYNFLOOD_ENABLED="true"
DDOS_SYNFLOOD_RATE="50/second"  # Lower for mail
DDOS_SYNFLOOD_BURST="100"

# Connection Limits: Mail-specific
DDOS_CONNLIMIT_ENABLED="true"
DDOS_CONNLIMIT_SSH="5"
DDOS_CONNLIMIT_HTTP="0"         # No web server
DDOS_CONNLIMIT_HTTPS="0"
DDOS_CONNLIMIT_FTP="0"
DDOS_CONNLIMIT_SMTP="10"        # Mail traffic
DDOS_CONNLIMIT_POP3="10"
DDOS_CONNLIMIT_IMAP="10"
DDOS_CONNLIMIT_MYSQL="0"
DDOS_CONNLIMIT_POSTGRESQL="0"

# Port Flood: Protect mail ports
DDOS_PORTFLOOD_ENABLED="true"
DDOS_PORTFLOOD_RATE="500/second"
DDOS_PORTFLOOD_BURST="1000"
DDOS_PORTFLOOD_SSH="5/300"
DDOS_PORTFLOOD_SMTP="10/60"

# ICMP Flood
DDOS_ICMPFLOOD_ENABLED="true"
DDOS_ICMPFLOOD_RATE="50/second"
DDOS_ICMPFLOOD_BURST="100"

# =============================================================================
# PORT SCAN DETECTION: Aggressive
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="180"      # 3 minutes (faster)
PORTSCAN_THRESHOLD="8"          # Lower threshold
PORTSCAN_DIVERSITY="true"
PORTSCAN_AUTO_BAN="true"
PORTSCAN_BAN_TYPE="temporary"
PORTSCAN_BAN_TIME="7200"        # 2 hours (longer)
PORTSCAN_MONITOR_PORTS="closed"
PORTSCAN_MONITOR_ICMP="true"
