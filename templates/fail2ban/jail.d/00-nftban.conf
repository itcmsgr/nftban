# nftban-managed: yes
# nftban-templates-version: 1
# File: jail.d/00-nftban.conf
# Global defaults for all jails; user overrides live in .local elsewhere.

[DEFAULT]
backend   = @@NFTBAN_F2B_BACKEND@@
bantime   = @@NFTBAN_F2B_DEF_BAN_TIME@@
findtime  = @@NFTBAN_F2B_DEF_FIND_TIME@@
maxretry  = @@NFTBAN_F2B_DEF_MAX_RETRY@@

# Merge your consolidated whitelist into ignoreip (space- or comma-separated list)
ignoreip  = @@NFTBAN_F2B_IGNOREIP@@

# Use our nftables action bound to the global sets by default
banaction = nftban-global
