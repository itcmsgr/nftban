#!/usr/sbin/nft -f
# =============================================================================
# NFTBan v0.7.3 - IPv4 Firewall (Safe Configuration)
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# meta:name="nftables_safe_config"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2025-10-26"
# meta:description="Safe nftables configuration with sets managed by nftban-core"
# meta:input="None"
# meta:output="Safe nftables ruleset for IPv4/IPv6"
# meta:depends=""
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
# =============================================================================

flush ruleset

# =============================================================================
# TABLE: ip nftban (IPv4)
# =============================================================================
table ip nftban {
    # =========================================================================
    # SETS - Will be populated by nftban-core sync
    # =========================================================================
    set whitelist_ipv4 {
        type ipv4_addr
        flags interval
        comment "Permanent IPv4 whitelist (supports CIDR)"
    }

    set blacklist_ipv4 {
        type ipv4_addr
        flags timeout
        comment "IPv4 blacklist (permanent + temporary with timeout)"
    }

    set tcp_ports_in {
        type inet_service
        comment "Allowed TCP ports (inbound)"
        elements = { 22, 80, 443 }
    }

    set tcp_ports_out {
        type inet_service
        comment "Allowed TCP ports (outbound)"
    }

    set udp_ports_in {
        type inet_service
        comment "Allowed UDP ports (inbound)"
    }

    set udp_ports_out {
        type inet_service
        comment "Allowed UDP ports (outbound)"
    }

    # =========================================================================
    # INPUT CHAIN - CORRECT RULE ORDER (security-critical!)
    # =========================================================================
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Drop invalid packets
        ct state invalid counter drop comment "invalid state"

        # 2. Always allow loopback
        iif lo counter accept comment "loopback"

        # 3. Whitelist (bypass all checks) - ADMIN IPs PROTECTED
        ip saddr @whitelist_ipv4 counter accept comment "whitelist - full access"

        # 4. BLACKLIST (⚠️ BEFORE established!) - permanent + temporary with timeout
        ip saddr @blacklist_ipv4 counter drop comment "blacklist (permanent + temporary)"

        # 5. NOW allow established connections (safe after all bans checked)
        ct state established,related counter accept comment "established connections"

        # 7. ICMP (ping, traceroute, etc.)
        ip protocol icmp icmp type { echo-reply, destination-unreachable, echo-request, time-exceeded } counter accept comment "ICMPv4"

        # 8. CT LIMITS (DDoS protection - SSH)
        ct state new tcp dport 22 ct count over 5 counter drop comment "SSH: max 5 concurrent per IP"

        # 9. CT LIMITS (DDoS protection - HTTP/HTTPS)
        ct state new tcp dport { 80, 443 } ct count over 100 counter drop comment "HTTP(S): configurable via ddos.conf"

        # 10. RATE LIMITS (portscan detection)
        tcp flags syn ct state new limit rate 100/second burst 200 packets log prefix "NFTBAN_PORTSCAN: "

        # 11. TCP SERVICES
        tcp dport @tcp_ports_in counter accept comment "TCP services"

        # 12. UDP SERVICES
        udp dport @udp_ports_in counter accept comment "UDP services"

        # 13. DEFAULT DENY (log dropped packets)
        log prefix "nftban: drop: " limit rate 10/minute
        counter drop comment "default deny"
    }

    # =========================================================================
    # FORWARD CHAIN
    # =========================================================================
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    # =========================================================================
    # OUTPUT CHAIN
    # =========================================================================
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# =============================================================================
# TABLE: ip6 nftban (IPv6) - Same structure for IPv6
# =============================================================================
table ip6 nftban {
    set whitelist_ipv6 {
        type ipv6_addr
        flags interval
        comment "Permanent IPv6 whitelist (supports CIDR)"
    }

    set blacklist_ipv6 {
        type ipv6_addr
        flags timeout
        comment "IPv6 blacklist (permanent + temporary with timeout)"
    }

    set tcp_ports_in {
        type inet_service
        comment "Allowed TCP ports (inbound)"
        elements = { 22, 80, 443 }
    }

    set tcp_ports_out {
        type inet_service
        comment "Allowed TCP ports (outbound)"
    }

    set udp_ports_in {
        type inet_service
        comment "Allowed UDP ports (inbound)"
    }

    set udp_ports_out {
        type inet_service
        comment "Allowed UDP ports (outbound)"
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid counter drop comment "invalid state"
        iif lo counter accept comment "loopback"
        ip6 saddr @whitelist_ipv6 counter accept comment "whitelist - full access"
        ip6 saddr @blacklist_ipv6 counter drop comment "blacklist (permanent + temporary)"
        ct state established,related counter accept comment "established connections"
        meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, echo-request, echo-reply, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } counter accept comment "ICMPv6 + NDP"
        ct state new tcp dport 22 ct count over 5 counter drop comment "SSH: max 5 concurrent per IP"
        ct state new tcp dport { 80, 443 } ct count over 100 counter drop comment "HTTP(S): configurable via ddos.conf"
        tcp flags syn ct state new limit rate 100/second burst 200 packets log prefix "NFTBAN_PORTSCAN: "
        tcp dport @tcp_ports_in counter accept comment "TCP services"
        udp dport @udp_ports_in counter accept comment "UDP services"
        log prefix "nftban: drop: " limit rate 10/minute
        counter drop comment "default deny"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
