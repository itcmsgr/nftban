# =============================================================================
# NFTBan v0.30.0 - Mail Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Email notification configuration
#
# Configuration file for NFTBan mail notifications
# Location: /etc/nftban/conf.d/mail.conf
# =============================================================================

# =============================================================================
# TRANSPORT SELECTION
# =============================================================================

# Mail transport method (choose one):
# - curl     : Direct SMTP via curl (no MTA needed, zero installation)
# - sendmail : Use system sendmail (requires sendmail/postfix/exim installed)
# - msmtp    : Use msmtp client (clean alternative to sendmail)
#
# Default: sendmail (if available), fallback to curl
MAIL_TRANSPORT="sendmail"

# =============================================================================
# SMTP CONFIGURATION (for curl transport)
# =============================================================================

# SMTP Server settings
SMTP_SERVER="localhost"
SMTP_PORT="587"                # 587=STARTTLS, 465=SMTPS, 25=Plain
SMTP_SCHEME="smtp"             # smtp or smtps

# SMTP Authentication (leave empty for no auth)
SMTP_USER=""
SMTP_PASS=""
SMTP_PASS_FILE=""              # Path to file containing password (more secure)

# Security
SMTP_REQUIRE_TLS="true"        # Require TLS/STARTTLS

# =============================================================================
# SENDMAIL CONFIGURATION (for sendmail transport)
# =============================================================================

# Path to sendmail binary (auto-detected if empty)
SENDMAIL_PATH=""               # Leave empty for auto-detection

# Sendmail options
SENDMAIL_OPTIONS="-t -oi"      # -t: Read recipients from headers, -oi: Don't treat "." as end

# =============================================================================
# EMAIL ADDRESSING
# =============================================================================

# From address (envelope and header)
MAIL_FROM="nftban@$(hostname -f 2>/dev/null || hostname)"

# From display name
MAIL_FROM_NAME="NFTBan Monitor"

# =============================================================================
# ALERT CONFIGURATION
# =============================================================================

# Enable/disable email alerts
MAIL_ALERTS_ENABLED="false"

# Alert recipients (space-separated)
MAIL_ALERT_RECIPIENTS="admin@example.com ops@example.com"

# Minimum alert level to send (info|warning|error|critical)
MAIL_ALERT_MIN_LEVEL="warning"

# Alert subject prefix
MAIL_SUBJECT_PREFIX="[NFTBan]"

# =============================================================================
# RATE LIMITING
# =============================================================================

# Maximum emails per time window
MAIL_RATE_LIMIT_COUNT="10"

# Rate limit window in seconds (3600 = 1 hour)
MAIL_RATE_LIMIT_WINDOW="3600"

# =============================================================================
# TEMPLATES
# =============================================================================

# Email templates directory
MAIL_TEMPLATES_DIR="/usr/share/nftban/templates/mail"

# Default template for alerts
MAIL_ALERT_TEMPLATE="alert_default.txt"

# =============================================================================
# LOGGING
# =============================================================================

# Log sent emails
MAIL_LOG_ENABLED="true"
MAIL_LOG_FILE="/var/log/nftban/mail.log"

# =============================================================================
# EXAMPLES
# =============================================================================

# Example 1: Direct SMTP via curl (no MTA needed)
# MAIL_TRANSPORT="curl"
# SMTP_SERVER="smtp.gmail.com"
# SMTP_PORT="587"
# SMTP_USER="nftban@gmail.com"
# SMTP_PASS_FILE="/etc/nftban/keys/gmail_app_password"
# SMTP_REQUIRE_TLS="true"

# Example 2: Local sendmail/postfix
# MAIL_TRANSPORT="sendmail"
# MAIL_FROM="nftban@example.com"

# Example 3: Relay via msmtp
# MAIL_TRANSPORT="msmtp"
# (msmtp config in /etc/msmtprc or ~/.msmtprc)
