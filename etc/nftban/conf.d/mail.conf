# -----------------------------------------------------------------------------
# MAIL SYSTEM SETTINGS
# -----------------------------------------------------------------------------

# Enable/disable mail notifications (YES/NO)
NFTBAN_MAIL_ENABLED="NO"

# Default recipient for all mail notifications
# Override per-module with specific settings
NFTBAN_MAIL_RECIPIENT=""

# Sender address (defaults to nftban@hostname)
NFTBAN_SENDER=""

# From name displayed in emails
NFTBAN_FROM_NAME="NFTBan Security System"

# Subject prefix for all emails
NFTBAN_MAIL_SUBJECT_PREFIX="[NFTBan]"

# -----------------------------------------------------------------------------
# SMART MAIL ADAPTER - METHOD SELECTION
# -----------------------------------------------------------------------------
# The mail system auto-detects the best available method.
# You can force a specific method if needed.
#
# Available methods (auto-detected in this priority):
#   postfix   - Local Postfix MTA (fastest)
#   sendmail  - Local Sendmail MTA
#   exim      - Local Exim MTA
#   msmtp     - Lightweight SMTP relay client
#   curl      - Direct SMTP via curl (no local MTA needed)
#   mailx     - Basic mail command (fallback)
#
# Leave empty for auto-detection (recommended)
NFTBAN_MAIL_METHOD=""

# -----------------------------------------------------------------------------
# DIRECT SMTP SETTINGS (for curl method)
# -----------------------------------------------------------------------------
# Configure these if you want to send email via external SMTP server
# without running a local MTA (postfix/sendmail/exim).
#
# When NFTBAN_SMTP_HOST is set and no local MTA is found,
# the mail system will automatically use curl SMTP.

# SMTP server hostname (e.g., smtp.gmail.com, mail.example.com)
NFTBAN_SMTP_HOST=""

# SMTP port: 587 (STARTTLS), 465 (SMTPS), 25 (plain - not recommended)
NFTBAN_SMTP_PORT="587"

# SMTP authentication (leave empty if not required)
NFTBAN_SMTP_USER=""
NFTBAN_SMTP_PASS=""

# -----------------------------------------------------------------------------
# COMPANY BRANDING (Optional)
# -----------------------------------------------------------------------------

# Company name shown in email headers/footers
NFTBAN_COMPANY_NAME=""

# Logo URL (optional - for HTML emails)
NFTBAN_LOGO_LOCATION=""

# Include version in emails (YES/NO)
NFTBAN_VERSION_INCLUDE="YES"

# -----------------------------------------------------------------------------
# TEMPLATE SETTINGS
# -----------------------------------------------------------------------------

# Use HTML emails (YES/NO)
NFTBAN_MAIL_USE_HTML="YES"

# Template directory (defaults to /usr/share/nftban/templates/mail)
# NFTBAN_TEMPLATE_DIR="/usr/share/nftban/templates/mail"

# -----------------------------------------------------------------------------
# SECURITY SETTINGS
# -----------------------------------------------------------------------------

# Validate email addresses (YES/NO)
NFTBAN_MAIL_VALIDATE_RECIPIENTS="YES"

# Allowed paths for file attachments (colon-separated)
NFTBAN_MAIL_ALLOWED_PATHS="/var/lib/nftban:/var/log/nftban"

# Maximum file size in KB for attachments
NFTBAN_MAIL_MAX_FILE_SIZE="10240"

# -----------------------------------------------------------------------------
# DEBUG SETTINGS
# -----------------------------------------------------------------------------

# Enable mail debug mode (true/false)
NFTBAN_MAIL_DEBUG="false"

# Save sent emails to directory (empty to disable)
# NFTBAN_MAIL_SAVE_SENT="/var/lib/nftban/mail-archive"

# -----------------------------------------------------------------------------
# NOTIFICATION TRIGGERS
# -----------------------------------------------------------------------------

# Send email on critical health check failures (YES/NO)
NFTBAN_MAIL_ON_HEALTH_CRITICAL="NO"

# Send daily summary report (YES/NO)
NFTBAN_MAIL_DAILY_REPORT="NO"

# Daily report time (24h format, e.g., 08:00)
# RESERVED: Planned for v2.0 - timer-based mail report feature
NFTBAN_MAIL_DAILY_REPORT_TIME="08:00"

# Send email on new ban (YES/NO) - can be noisy!
NFTBAN_MAIL_ON_BAN="NO"

# Send email on login alert (YES/NO)
NFTBAN_MAIL_ON_LOGIN_ALERT="NO"

# Minimum severity for alerts (info/warning/critical)
# RESERVED: Planned for v2.0 - severity filtering for mail alerts
NFTBAN_MAIL_ALERT_SEVERITY="warning"
