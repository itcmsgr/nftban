# Use critical template for SSH
[sshd]
enabled = true
port = ssh
logpath = %(sshd_log)s
maxretry = 3
bantime = 86400
action = %(critical-template)s[destemail="ssh-admin@example.com"]

# Use basic template for web services
[nginx-badbots]
enabled = true
port = http,https
logpath = /var/log/nginx/access.log
maxretry = 2
action = %(basic-template)s[destemail="web-team@example.com"]

# Use status template for database
[mysql-auth]
enabled = true
port = mysql
logpath = /var/log/mysql/error.log
maxretry = 3
action = %(status-template)s[destemail="dba@example.com"]

# Custom configuration for specific service
[wordpress-auth]
enabled = true
port = http,https
logpath = /var/log/nginx/wordpress.log
maxretry = 4

action = %(action_)s
         advanced-email[
             destemail="wp-admin@example.com",
             notify_ban=true,
             notify_unban=true,
             include_whois=true,
             include_nslookup=false
         ]
