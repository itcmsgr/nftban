# =============================================================================
# NFTBan Security Profile: Development/Testing
# =============================================================================
# Optimized for: Development, staging, testing environments
# Best for: Non-production servers, internal testing
# =============================================================================

PROFILE_NAME="development"
PROFILE_DESCRIPTION="Development - Minimal security for testing"

# =============================================================================
# DDOS PROTECTION: DISABLED
# =============================================================================

DDOS_PROTECTION_ENABLED="false"

# =============================================================================
# PORT SCAN DETECTION: Log Only (No Banning)
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="600"      # 10 minutes (relaxed)
PORTSCAN_THRESHOLD="50"         # Very high threshold
PORTSCAN_DIVERSITY="false"
PORTSCAN_AUTO_BAN="false"       # NO AUTO-BAN (log only!)
PORTSCAN_BAN_TYPE="temporary"
PORTSCAN_BAN_TIME="300"         # 5 minutes if manual ban
PORTSCAN_MONITOR_PORTS="closed"
PORTSCAN_MONITOR_ICMP="false"
