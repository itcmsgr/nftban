# =============================================================================
# NFTBan GEO-Blocking Configuration Template
# Version: init 1.0
# Template Name: geo-blocking.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
# =============================================================================
#
# ⚠️  CRITICAL WARNING - READ BEFORE ENABLING GEO-BLOCKING ⚠️
#
# GEO-blocking can block LEGITIMATE users from allowed countries!
# All GEO-blocking is DISABLED by default for safety.
#
# COMMON RISKS:
# 1. VPNs - Users from allowed countries using VPN appear from blocked countries
# 2. Proxies - Corporate/privacy proxies may route through blocked countries
# 3. Mobile users - International roaming shows IP from foreign countries
# 4. Cloud services - AWS/Azure/GCP IPs may be registered in different countries
# 5. CDNs - Cloudflare/Akamai IPs may appear from unexpected countries
# 6. Incorrect GeoIP data - IP databases are ~95-98% accurate, not 100%
# 7. Shared infrastructure - Datacenters serve multiple countries
# 8. Travelers - Your legitimate users traveling abroad get blocked
#
# BEFORE ENABLING GEO-BLOCKING:
# 1. Understand your user base geographical distribution
# 2. Analyze server logs for legitimate country access patterns
# 3. Whitelist ALL countries where you have legitimate users
# 4. Start with blocking only clearly malicious countries (if any)
# 5. Enable in dry-run/monitoring mode first (logs only, no blocking)
# 6. Monitor logs for 1-2 weeks to identify false positives
# 7. Have a procedure to quickly unblock if issues arise
# 8. Provide alternative access method for blocked users (support contact)
#
# LEGAL CONSIDERATIONS:
# - Some jurisdictions prohibit geographic discrimination
# - GDPR compliance requires legitimate reasons for blocking EU countries
# - Check local laws before blocking countries
# - Document business justification for any country blocks
#
# RECOMMENDED APPROACH:
# 1. Use whitelist approach: Allow only specific countries
# 2. OR use minimal blacklist: Block only proven malicious sources
# 3. Never block countries where you have customers/users
# 4. Regularly review and update country lists
# 5. Provide clear messaging to blocked users with contact info
#
# =============================================================================

# =============================================================================
# MASTER SWITCH - GLOBAL GEO-BLOCKING
# =============================================================================
# ⚠️  WARNING: GEO-blocking affects ALL traffic from entire countries!
#
# When set to "FALSE", ALL GEO-blocking is disabled (SAFE DEFAULT)
# When set to "TRUE", countries in geo-blacklist.conf are blocked
#
# Two blocking modes:
# Mode 1 (WHITELIST): Block all EXCEPT whitelisted countries
#                     Set: GEO_BLOCKING_MODE="whitelist"
#                     Safest for sites serving specific regions only
#
# Mode 2 (BLACKLIST): Allow all EXCEPT blacklisted countries
#                     Set: GEO_BLOCKING_MODE="blacklist"
#                     Less restrictive, blocks known bad sources only
#
# Recommended: Start with blacklist mode, minimal countries
# =============================================================================

# Enable/disable GEO-blocking (master switch)
# "FALSE" = ALL GEO-blocking DISABLED (SAFE DEFAULT)
# "TRUE" = Enable GEO-blocking (uses mode below)
GEO_BLOCKING_ENABLED="FALSE"

# GEO-blocking mode
# "blacklist" = Block countries in geo-blacklist.conf (DEFAULT)
# "whitelist" = Block all EXCEPT countries in geo-whitelist.conf (STRICT)
GEO_BLOCKING_MODE="blacklist"

# =============================================================================
# GEO DATABASE SOURCE
# =============================================================================
# ⚠️  WARNING: Database quality affects blocking accuracy!
#
# GeoIP databases are maintained by various organizations:
# - DB-IP: Free, updated monthly, ~98% accuracy
# - MaxMind: Commercial, updated weekly, ~99% accuracy
# - IP2Location: Commercial, updated daily, ~99% accuracy
#
# Current default: DB-IP (free, good quality)
# Database updated: Automatically on block/update commands
# Update frequency: Recommended monthly minimum
#
# Note: Even best databases have 1-2% error rate!
# =============================================================================

# GeoIP database source URL
# Default: DB-IP community database (free, monthly updates)
# Format: Base URL, country files downloaded as: {BASE_URL}/{COUNTRY_CODE}.cidr
GEO_DATABASE_URL="https://raw.githubusercontent.com/sapics/ip-location-db/main/dbip-country"

# Auto-update GeoIP database
# "TRUE" = Automatically download latest data when blocking countries
# "FALSE" = Use cached data only (manual updates)
GEO_AUTO_UPDATE="TRUE"

# Database cache validity (seconds)
# How old cached data can be before forced update
# 2592000 = 30 days (monthly updates)
# 604800 = 7 days (weekly updates)
# 0 = Always update (not recommended - bandwidth heavy)
GEO_CACHE_VALIDITY="2592000"

# =============================================================================
# IP VERSION SUPPORT
# =============================================================================
# ⚠️  WARNING: IPv4 and IPv6 are separate!
#
# Must block both to be effective:
# - Many users have IPv6 now (especially mobile)
# - Attackers can switch between IPv4/IPv6
# - Cloud services often have both
#
# Blocking only IPv4 leaves IPv6 open!
# Blocking only IPv6 leaves IPv4 open!
#
# Recommended: Enable both unless you have specific reason
# =============================================================================

# Enable IPv4 GEO-blocking
# "TRUE" = Block IPv4 addresses from blacklisted countries
# "FALSE" = Allow all IPv4 (defeats purpose of GEO-blocking)
GEO_BLOCK_IPV4="TRUE"

# Enable IPv6 GEO-blocking
# "TRUE" = Block IPv6 addresses from blacklisted countries
# "FALSE" = Allow all IPv6 (leaves major security hole)
GEO_BLOCK_IPV6="TRUE"

# =============================================================================
# BLOCKING BEHAVIOR
# =============================================================================

# Action when GEO-block triggered
# "drop" = Silently drop packets (hides server presence)
# "reject" = Send TCP RST/ICMP unreachable (faster, cleaner)
GEO_BLOCK_ACTION="drop"

# Log GEO-blocked connections
# "TRUE" = Log every blocked connection (can be very verbose!)
# "FALSE" = Don't log blocks (silent operation)
# "summary" = Log hourly summary only (recommended)
GEO_BLOCK_LOGGING="summary"

# Apply GEO-blocking to
# "all" = All incoming connections
# "new" = Only new connections (allow established)
# "input" = Only server input (not forwarded traffic)
GEO_BLOCK_APPLY_TO="new"

# =============================================================================
# WHITELIST/BLACKLIST FILES
# =============================================================================
# These files contain country codes (ISO 3166-1 alpha-2 format)
#
# GEO Blacklist (geo-blacklist.conf):
# - Used when GEO_BLOCKING_MODE="blacklist"
# - Lists countries to BLOCK
# - Empty file = no blocking
#
# GEO Whitelist (geo-whitelist.conf):
# - Used when GEO_BLOCKING_MODE="whitelist"
# - Lists countries to ALLOW (all others blocked)
# - Empty file = block entire world (dangerous!)
#
# Priority: Whitelist ALWAYS takes precedence over blacklist
# If country in both files: Country is ALLOWED
# =============================================================================

# GEO blacklist file location
# Format: One country code per line (e.g., CN, RU, KP)
# Comments allowed with #
GEO_BLACKLIST_FILE="${NFTBAN_CONFIG_DIR}/geo-blacklist.conf"

# GEO whitelist file location
# Format: One country code per line (e.g., US, GB, GR)
# Comments allowed with #
GEO_WHITELIST_FILE="${NFTBAN_CONFIG_DIR}/geo-whitelist.conf"

# =============================================================================
# PERFORMANCE & RESOURCE LIMITS
# =============================================================================
# ⚠️  WARNING: GEO-blocking uses significant resources!
#
# Each country can have thousands of IP ranges:
# - China (CN): ~15,000 IPv4 ranges
# - United States (US): ~50,000 IPv4 ranges
# - Germany (DE): ~10,000 IPv4 ranges
#
# Blocking multiple large countries requires:
# - Memory: ~50-100MB per large country
# - CPU: Initial load spike when applying rules
# - Disk: ~10-20MB cache per country
#
# System impact:
# - Small server (1-2GB RAM): Limit to 5-10 countries
# - Medium server (4-8GB RAM): Can handle 20-30 countries
# - Large server (16GB+ RAM): Can handle 50+ countries
# =============================================================================

# Maximum countries to block simultaneously
# Prevents resource exhaustion
# "0" = Unlimited (not recommended)
# Recommended: 10-20 for most servers
GEO_MAX_BLOCKED_COUNTRIES="20"

# Maximum IP ranges per country
# Limits memory per country
# "0" = Unlimited (not recommended)
# Recommended: 100000 (100k ranges)
GEO_MAX_RANGES_PER_COUNTRY="100000"

# Batch size for nftables updates
# How many IPs to add per transaction
# Higher = faster loading, more memory
# Lower = slower loading, less memory
# Recommended: 1000-10000
GEO_NFTABLES_BATCH_SIZE="5000"

# =============================================================================
# EXCEPTIONS & BYPASS
# =============================================================================

# Allow IPs in main whitelist bypass GEO-blocking
# "TRUE" = Whitelisted IPs never blocked by GEO rules (recommended)
# "FALSE" = GEO rules apply to everyone
GEO_RESPECT_WHITELIST="TRUE"

# Allow IPs from same country as server bypass GEO-blocking
# "TRUE" = Server's own country never blocked
# "FALSE" = Can block server's country (not recommended)
GEO_ALLOW_SERVER_COUNTRY="TRUE"

# Specific ports exempt from GEO-blocking
# Format: Comma-separated port list
# Example: "22,80,443" = SSH, HTTP, HTTPS exempt
# Empty = No exemptions (GEO-blocking applies to all ports)
# Use case: Allow SSH from anywhere, block other services
GEO_EXEMPT_PORTS=""

# =============================================================================
# NOTIFICATIONS & ALERTS
# =============================================================================

# Send email when countries blocked/unblocked
# "TRUE" = Send email notification
# "FALSE" = Silent operation (recommended)
GEO_EMAIL_NOTIFICATIONS="FALSE"

# Email recipient for GEO notifications
# Empty = Use default from main config
GEO_EMAIL_RECIPIENT=""

# Send alert when many blocks from new country detected
# Helps identify attack sources
# "TRUE" = Alert on unusual activity
# "FALSE" = No alerts
GEO_ALERT_ON_NEW_SOURCE="FALSE"

# Threshold for new source alert (blocks per hour)
# If >N blocks from previously unseen country, send alert
GEO_ALERT_THRESHOLD="100"

# =============================================================================
# AUTOMATIC BLOCKING
# =============================================================================
# ⚠️  DANGER: Auto-blocking can escalate quickly!
#
# Auto-blocking adds countries to blacklist based on attack patterns.
# Risks:
# - False positives can block entire regions
# - Escalation: Block one country → attackers use another → block that → repeat
# - End result: Most of world blocked
#
# Recommended: Keep disabled, manually review and block
# =============================================================================

# Automatically add countries to blacklist based on attacks
# "TRUE" = Auto-add countries exceeding threshold
# "FALSE" = Manual blocking only (SAFE DEFAULT - recommended)
GEO_AUTO_BLOCK="FALSE"

# Attack threshold for auto-blocking (attacks per hour)
# If >N attacks from a country per hour, auto-block it
# Only used if GEO_AUTO_BLOCK="TRUE"
# Recommended: 1000+ to avoid false positives
GEO_AUTO_BLOCK_THRESHOLD="1000"

# Automatically unblock countries after duration
# Useful for temporary blocks
# "0" = Never auto-unblock (permanent blocks)
# Seconds: "86400" = 24 hours, "604800" = 7 days
GEO_AUTO_UNBLOCK_AFTER="0"

# =============================================================================
# REPORTING & STATISTICS
# =============================================================================

# Generate daily GEO-blocking reports
# "TRUE" = Send daily summary
# "FALSE" = No reports
GEO_DAILY_REPORT="FALSE"

# Include top blocked countries in reports
# How many countries to list
GEO_REPORT_TOP_COUNT="10"

# Include blocked IP samples in reports
# "TRUE" = Show example blocked IPs
# "FALSE" = Summary only
GEO_REPORT_INCLUDE_IPS="FALSE"

# =============================================================================
# TESTING & DRY-RUN
# =============================================================================
# ⚠️  IMPORTANT: Use dry-run mode for initial deployment!
#
# Deployment workflow:
# Week 1-2: DRY_RUN="TRUE", ENABLED="TRUE"
#           → Log what WOULD be blocked
#           → Identify false positives
#           → Refine country lists
# Week 3:   DRY_RUN="FALSE", ENABLED="TRUE", monitor closely
#           → Actual blocking begins
#           → Watch for support tickets
# Week 4+:  Normal operation (if <1% complaints)
# =============================================================================

# Dry-run mode: Log blocks but don't actually block
# "TRUE" = Testing mode - show what WOULD be blocked (RECOMMENDED for setup)
# "FALSE" = Production mode - actually block
GEO_DRY_RUN="TRUE"

# Verbose logging for debugging
# "TRUE" = Detailed debug logs
# "FALSE" = Normal logging
GEO_DEBUG="FALSE"

# Test GEO-blocking with specific IP
# When set, this IP is always checked against GEO rules
# Used for testing without affecting real traffic
# Empty = No test IP
GEO_TEST_IP=""

# =============================================================================
# INTEGRATION
# =============================================================================

# Integrate with Fail2Ban
# Add GEO-blocked IPs to Fail2Ban as well
# "TRUE" = Dual blocking (nftables + Fail2Ban)
# "FALSE" = nftables only
GEO_FAIL2BAN_INTEGRATION="FALSE"

# Share GEO blocks across nftban cluster
# If running multiple servers with nftban
# "TRUE" = Share blocks across cluster
# "FALSE" = Local only
GEO_CLUSTER_SYNC="FALSE"

# =============================================================================
# COUNTRY CODE REFERENCE
# =============================================================================
# Common ISO 3166-1 alpha-2 country codes:
#
# North America:
#   US = United States, CA = Canada, MX = Mexico
#
# Europe:
#   GB = United Kingdom, DE = Germany, FR = France, IT = Italy,
#   ES = Spain, NL = Netherlands, GR = Greece, PL = Poland
#
# Asia:
#   CN = China, JP = Japan, KR = South Korea, IN = India,
#   SG = Singapore, HK = Hong Kong, TW = Taiwan
#
# Commonly blocked (high attack sources):
#   CN = China, RU = Russia, KP = North Korea, IR = Iran,
#   VN = Vietnam, UA = Ukraine, BR = Brazil
#
# Full list: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
#
# ⚠️  WARNING: Research your specific threat landscape!
# Attack sources vary by industry and target.
# Don't blindly copy "commonly blocked" lists!
# =============================================================================

# =============================================================================
# QUICK START SCENARIOS
# =============================================================================
#
# SCENARIO 1: Block specific high-risk countries (RECOMMENDED)
# ------------------------------------------------------------
# 1. Edit: /etc/nftban/config/geo-blacklist.conf
# 2. Add country codes: CN, RU, KP (one per line)
# 3. Set: GEO_BLOCKING_ENABLED="TRUE"
# 4. Set: GEO_BLOCKING_MODE="blacklist"
# 5. Set: GEO_DRY_RUN="TRUE" (testing)
# 6. Enable: nftban geo enable
# 7. Monitor: tail -f /var/log/nftban/geo-blocking.log
# 8. After 1 week, if clean: GEO_DRY_RUN="FALSE"
#
# SCENARIO 2: Allow only specific countries (STRICT)
# --------------------------------------------------
# 1. Edit: /etc/nftban/config/geo-whitelist.conf
# 2. Add allowed countries: US, CA, GB, etc.
# 3. Set: GEO_BLOCKING_ENABLED="TRUE"
# 4. Set: GEO_BLOCKING_MODE="whitelist"
# 5. Set: GEO_DRY_RUN="TRUE" (CRITICAL - test first!)
# 6. Enable: nftban geo enable
# 7. Monitor CLOSELY for blocked legitimate users
# 8. Adjust whitelist based on feedback
#
# SCENARIO 3: Temporarily block during attack
# -------------------------------------------
# 1. Identify attack source country from logs
# 2. Quick block: nftban geo block CN (example)
# 3. Attack stops (if from that country)
# 4. Later unblock: nftban geo unblock CN
#
# SCENARIO 4: Disable all GEO-blocking (emergency)
# ------------------------------------------------
# 1. Set: GEO_BLOCKING_ENABLED="FALSE"
# 2. Or: nftban geo disable
# 3. All country blocks removed immediately
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# PROBLEM: Legitimate user blocked
# SOLUTION:
# 1. Check user's IP: nftban geo check <IP>
# 2. Add their country to whitelist
# 3. Or whitelist specific IP: nftban whitelist add <IP>
# 4. Unblock country: nftban geo unblock <COUNTRY>
#
# PROBLEM: High memory usage
# SOLUTION:
# 1. Reduce GEO_MAX_BLOCKED_COUNTRIES
# 2. Reduce GEO_MAX_RANGES_PER_COUNTRY
# 3. Block fewer large countries (US, CN have most IPs)
# 4. Check: nftban geo status (shows memory usage)
#
# PROBLEM: Slow server startup
# SOLUTION:
# 1. Increase GEO_NFTABLES_BATCH_SIZE
# 2. Reduce number of blocked countries
# 3. Consider caching: nftban geo update ALL
#
# PROBLEM: Countries not blocking
# SOLUTION:
# 1. Check enabled: nftban geo status
# 2. Check mode: Should match whitelist/blacklist files
# 3. Verify nftables: nft list sets ip nftban_v4 | grep geo
# 4. Re-sync: nftban geo reload
#
# For support: contact@itcms.gr
#
# =============================================================================
# END OF CONFIGURATION
# =============================================================================
