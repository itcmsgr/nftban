# =============================================================================
# GROUP 3: INFRASTRUCTURE
# =============================================================================

firewall:
  category: infrastructure
  description: "Firewall structure validation, statistics, and log analysis"
  risk: advanced
  audience: [cli]
  capability: enforcement
  mutates: conditional
  supports_dry_run: false
  requires_root: conditional
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  examples:
    - "nftban firewall validate"
    - "nftban firewall check 1.2.3.4"
    - "nftban firewall check 22"
    - "nftban firewall stats"
    - "nftban firewall logs show --live"
    - "nftban firewall logs enable --level drops"
    - "nftban firewall reload"
  subcommands:
    validate:
      mutates: false
      description: "Validate nftables structure"
    check:
      mutates: false
      description: "Check if IP or port is blocked/allowed (alias of the top-level 'nftban check')"
    stats:
      mutates: false
      description: "Show firewall statistics"
    reload:
      mutates: true
      requires_root: true
      description: "Reload nftables ruleset"
    status:
      mutates: false
      description: "Show firewall structure/authority status"
    rebuild:
      mutates: true
      requires_root: true
      capability: enforcement
      description: "Atomically rebuild the live nftables ruleset from rendered config (single nft -f transaction)"
    reset:
      mutates: true
      requires_root: true
      capability: enforcement
      description: "Reset the nftban firewall to a clean baseline (DESTRUCTIVE to current live ruleset state)"
    conflicts:
      mutates: false
      description: "Detect conflicting external firewalls (fail2ban, ufw, firewalld, csf) — delegates to health conflicts"
    restore:
      mutates: true
      requires_root: true
      capability: enforcement
      description: "Re-arm a previously-disarmed external firewall (reverse of takeover). Target required."
      examples:
        - "nftban firewall restore csf"
        - "nftban firewall restore fail2ban"
        - "nftban firewall restore firewalld"
        - "nftban firewall restore ufw"
      arguments:
        target:
          type: enum
          values: [csf, fail2ban, firewalld, ufw]
          required: true
          description: "External firewall to re-arm/unmask (the takeover target)"
    record:
      mutates: true
      requires_root: true
      description: "Record/refresh the firewall ruleset fingerprint baseline (SEC-RULEFP)"
    transition-health:
      mutates: conditional
      requires_root: conditional
      description: "Report or acknowledge the firewall-transition health alarm. 'status' (default) prints the current verdict; 'ack' clears a RESOLVED alarm via the gated reset (refuses if a current breach remains; touches only state JSON, no ban loss). v1.198.2 PR-A."
      examples:
        - "nftban firewall transition-health"
        - "nftban firewall transition-health ack"
    takeover:
      mutates: true
      requires_root: true
      description: "Disarm conflicting external firewalls (CSF/iptables/firewalld); reversible; explicit operator approval required"
      examples:
        - "nftban firewall takeover --panel-auto-takeover"
        - "nftban firewall takeover --dry-run"
      options:
        --panel-auto-takeover:
          type: bool
          default: false
          description: "Allow detected control-panel presence (cPanel/Plesk/DA) to auto-approve takeover. Default OFF (PR-22B gate)."
        --dry-run:
          type: bool
          default: false
          description: "Preview takeover actions without changes"
      notes:
        - "Disarm is REVERSIBLE: external firewall binary renamed to .disabled (sha256-equal), config trees preserved, cron-backup manifest written before any rm"
        - "To reverse: nftban firewall restore csf  (or  /usr/lib/nftban/bin/nftban-installer --mode=restore)"
        - "Env mirror: NFTBAN_PANEL_AUTO_TAKEOVER=1 (useful for cloud-init / Ansible / package %post)"
    whitelist-session:
      mutates: true
      requires_root: true
      description: "Manage time-bounded operator-session whitelist entries (D-UPDATE-OPERATOR-SELF-BAN-GAP-001; v1.120)"
      examples:
        - "nftban firewall whitelist-session add 192.0.2.122 --ttl 30m"
        - "nftban firewall whitelist-session list"
        - "nftban firewall whitelist-session remove 192.0.2.122"
        - "nftban firewall whitelist-session cleanup"
      subcommands:
        add:
          mutates: true
          requires_root: true
          description: "Add a time-bounded whitelist entry with EXPIRES_AT marker"
          options:
            --ttl:
              type: string
              description: "Time-to-live: 30m, 1h, 1h30m, 24h, 3600s (required)"
            --reason:
              type: string
              default: "operator-explicit"
              description: "Short description of why the entry was added"
        list:
          mutates: false
          description: "Show all non-expired session whitelist entries (text-mode only; --json deferred to v1.121)"
        remove:
          mutates: true
          requires_root: true
          description: "Remove a session whitelist entry by IP or CIDR"
        cleanup:
          mutates: true
          requires_root: true
          description: "Manually remove all expired entries from 00-session.conf"
      notes:
        - "File-based mechanism (Shape E.0): writes /etc/nftban/whitelist.d/00-session.conf with inline EXPIRES_AT=<RFC3339> markers"
        - "The whitelist loader skips expired entries at load time (no kernel set, no systemd timer)"
        - "Auto-seeded during nftban update / firewall takeover with --session-whitelist-ttl (default 30m); this subcommand is the explicit operator override"
        - "Permanent operator entries belong in 99-manual.conf, NOT this file"
        - "v1.120 ships text-mode only; --json is REJECTED with operator-actionable error (deferred to v1.121 pending schema-envelope decision)"
        - "Schema 1.83.0 unchanged (per V120_OPERATOR_TEMP_WHITELIST_SCHEMA_IMPACT_DECISION.md verdict SCHEMA_STAYS_FROZEN)"
    logs:
      mutates: conditional
      requires_root: conditional
      description: "On-demand firewall log viewer with filtering"
      subcommands:
        enable:
          mutates: true
          requires_root: true
          description: "Enable firewall logging (modifies nftables rules)"
          options:
            --level:
              type: enum
              values: [drops, accepts, all, alert]
              default: drops
              description: "Logging level"
            --reason:
              type: string
              description: "Comma-separated reasons"
            --rate:
              type: string
              default: "10/second"
              description: "Rate limit for log entries"
            --burst:
              type: string
              default: "50 packets"
              description: "Burst limit for log entries"
        disable:
          mutates: true
          requires_root: true
          description: "Disable firewall logging (zero overhead)"
        status:
          mutates: false
          description: "Show logging configuration and statistics"
        show:
          mutates: false
          description: "View and filter firewall logs"
          options:
            --lines:
              type: int
              alias: "-n"
              default: 50
              description: "Number of entries"
            --since:
              type: string
              description: "Time filter (e.g., '10 min ago')"
            --live:
              type: bool
              alias: "-f"
              description: "Live tail mode"
            --interval:
              type: int
              alias: "-i"
              default: 3
              description: "Refresh interval (seconds)"
            --ip:
              type: string
              description: "Filter by IP"
            --src:
              type: string
              description: "Filter by source IP"
            --dst:
              type: string
              description: "Filter by destination IP"
            --port:
              type: string
              description: "Filter by port"
            --proto:
              type: enum
              values: [tcp, udp, icmp]
