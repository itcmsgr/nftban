# Runtime directories
d /run/nftban 0755 nftban nftban - -

# Configuration directories (created by package, managed here for runtime)
d /etc/nftban 0755 nftban nftban - -
d /etc/nftban/conf.d 0755 nftban nftban - -
d /etc/nftban/whitelist.d 0755 nftban nftban - -
d /etc/nftban/blacklist.d 0755 nftban nftban - -
d /etc/nftban/ports.d 0755 nftban nftban - -
d /etc/nftban/feeds.d 0755 nftban nftban - -
d /etc/nftban/rules.d 0755 nftban nftban - -
d /etc/nftban/secrets.d 0750 nftban nftban - -

# State directories
d /var/lib/nftban 0750 nftban nftban - -
d /var/lib/nftban/state 0750 nftban nftban - -
d /var/lib/nftban/snapshots 0750 nftban nftban - -
d /var/lib/nftban/feeds 0750 nftban nftban - -
d /var/lib/nftban/keyring 0750 nftban nftban - -
d /var/lib/nftban/backup 0750 nftban nftban - -
d /var/lib/nftban/metrics 0750 nftban nftban - -
d /var/lib/nftban/reports 0750 nftban nftban - -

# Cache directories
d /var/cache/nftban 0750 nftban nftban - -
d /var/cache/nftban/tmp 0750 nftban nftban - -
d /var/cache/nftban/geoip 0750 nftban nftban - -
d /var/cache/nftban/templates 0750 nftban nftban - -

# Log directories
d /var/log/nftban 0750 nftban adm - -
