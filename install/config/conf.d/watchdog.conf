# =============================================================================
# NFTBan System Watchdog Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Monitor system resources for troubleshooting and auditing
#
# This module monitors OS-level metrics NOT covered by other modules:
# - Load Average (from /proc/loadavg)
# - Memory/Swap Usage (from /proc/meminfo)
# - I/O Wait % (from /proc/stat)
# - Disk Usage (df command)
# - File Descriptors (from /proc/sys/fs/file-nr)
# - Top Processes (CPU and memory consumers)
#
# What OTHER modules handle (we don't touch):
# - Connection per IP: nftban ddos (ct count in nftables)
# - Ban rate alerts: nftban stats
# - Service health: nftban health
# =============================================================================

# -----------------------------------------------------------------------------
# GENERAL SETTINGS
# -----------------------------------------------------------------------------
# Enable/disable watchdog (use: nftban watchdog enable/disable)
NFTBAN_WATCHDOG_ENABLED="false"

# Check interval in seconds (default: 90s for responsive alerting)
# CSF uses 60s, we use 90s for slightly less overhead
NFTBAN_WATCHDOG_INTERVAL="90"

# Alert throttle - don't repeat same alert within this time (seconds)
# Default: 1 hour (3600s) - same as CSF
NFTBAN_WATCHDOG_ALERT_THROTTLE="3600"

# -----------------------------------------------------------------------------
# LOAD AVERAGE MONITORING
# -----------------------------------------------------------------------------
NFTBAN_WATCHDOG_LOAD_ENABLED="true"

# Which load average to check: 1, 5, or 15 (minute)
# Recommendation: 5 (balances responsiveness with stability)
NFTBAN_WATCHDOG_LOAD_AVG="5"

# Warning threshold (will generate WARNING alert)
NFTBAN_WATCHDOG_LOAD_WARNING="10"

# Critical threshold (will generate CRITICAL alert)
NFTBAN_WATCHDOG_LOAD_CRITICAL="20"

# -----------------------------------------------------------------------------
# MEMORY MONITORING
# -----------------------------------------------------------------------------
NFTBAN_WATCHDOG_MEM_ENABLED="true"

# Memory usage warning threshold (percentage)
NFTBAN_WATCHDOG_MEM_WARNING="80"

# Memory usage critical threshold (percentage)
NFTBAN_WATCHDOG_MEM_CRITICAL="95"

# Swap usage warning threshold (percentage)
# Swap usage often indicates memory pressure
NFTBAN_WATCHDOG_SWAP_WARNING="50"

# -----------------------------------------------------------------------------
# I/O WAIT MONITORING (Disk Bottleneck Detection)
# -----------------------------------------------------------------------------
NFTBAN_WATCHDOG_IOWAIT_ENABLED="true"

# I/O wait warning threshold (percentage)
# High I/O wait indicates disk is bottleneck
NFTBAN_WATCHDOG_IOWAIT_WARNING="20"

# I/O wait critical threshold (percentage)
NFTBAN_WATCHDOG_IOWAIT_CRITICAL="40"

# -----------------------------------------------------------------------------
# DISK USAGE MONITORING
# -----------------------------------------------------------------------------
NFTBAN_WATCHDOG_DISK_ENABLED="true"

# Path to monitor for disk usage (usually log directory)
# Can be comma-separated for multiple paths: "/var/log,/var/lib"
NFTBAN_WATCHDOG_DISK_PATH="/var/log"

# Disk usage warning threshold (percentage)
NFTBAN_WATCHDOG_DISK_WARNING="80"

# Disk usage critical threshold (percentage)
NFTBAN_WATCHDOG_DISK_CRITICAL="95"

# -----------------------------------------------------------------------------
# PROCESS TRACKING (Top Resource Consumers)
# -----------------------------------------------------------------------------
NFTBAN_WATCHDOG_PROC_ENABLED="true"

# Number of top processes to track in reports
NFTBAN_WATCHDOG_PROC_TOP_COUNT="10"

# Alert if single process exceeds this CPU percentage
NFTBAN_WATCHDOG_PROC_CPU_ALERT="80"

# Alert if single process exceeds this memory (in MB)
NFTBAN_WATCHDOG_PROC_MEM_ALERT="2048"

# -----------------------------------------------------------------------------
# ALERTS & LOGGING
# -----------------------------------------------------------------------------
# Watchdog log file
NFTBAN_WATCHDOG_LOG="/var/log/nftban/watchdog.log"

# Directory for saved reports (for auditing)
NFTBAN_WATCHDOG_REPORT_DIR="/var/lib/nftban/reports/watchdog"

# Send email on critical alerts (uses system mail)
NFTBAN_WATCHDOG_ALERT_EMAIL="true"

# Log alerts to syslog (journald)
NFTBAN_WATCHDOG_ALERT_SYSLOG="true"

# -----------------------------------------------------------------------------
# PROMETHEUS METRICS (for History and Graphing)
# -----------------------------------------------------------------------------
# Export metrics in Prometheus format
NFTBAN_WATCHDOG_METRICS_ENABLED="true"

# Prometheus metrics file (picked up by node_exporter textfile collector)
NFTBAN_WATCHDOG_METRICS_FILE="/var/lib/nftban/metrics/watchdog.prom"

# Days to keep reports (for auditing)
NFTBAN_WATCHDOG_REPORT_RETENTION="7"

# =============================================================================
# USAGE
# =============================================================================
# Enable:   nftban watchdog enable
# Disable:  nftban watchdog disable
# Status:   nftban watchdog status
# Check:    nftban watchdog check
# Report:   nftban watchdog report
# History:  nftban watchdog history
# =============================================================================
