# NFTBan Fail2ban Jail - ModSecurity WAF
#
# Monitors ModSecurity Web Application Firewall blocks.
# Bans IPs triggering multiple WAF rules (403/406 responses).
#
# Configuration:
# - maxretry: 9 blocked requests
# - findtime: 10 minutes (600 seconds)
# - bantime: 1 hour (3600 seconds)
#
# Uses custom NFTBan filter for ModSecurity v3 JSON logs
# Based on DirectAdmin production configuration

[nftban-modsecurity]

# Disabled by default - enable if ModSecurity is installed
enabled   = false

# HTTP/HTTPS ports
port      = http,https

# Use NFTBan custom ModSecurity filter (supports JSON format)
filter    = nftban-modsecurity

# ModSecurity audit log location
logpath   = /var/log/httpd/modsec_audit.log
            /var/log/apache2/modsec_audit.log
            /var/log/modsecurity/audit.log

# Threshold for WAF blocks
maxretry  = 9
findtime  = 10m

# Short ban (1 hour)
bantime   = 1h

# Use NFTBan action
action    = nftban[name=modsecurity]
