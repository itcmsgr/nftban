<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFTBan - Login</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <div class="login-box">
            <h1>NFTBan</h1>
            <p class="subtitle">Firewall Management System</p>

            <form id="loginForm" aria-label="Login form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="login-footer">
                <small>NFTBan Web API v2.0 | Port 3940</small>
            </div>
        </div>
    </main>

    <script src="/assets/js/session.js"></script>
    <script>
        // Clear any existing session on login page
        Session.clear();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            // Hide previous errors
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/v1/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const data = await response.json();

                // Save session
                Session.set(data.token);
                Session.setUser(data.user, data.role);

                // Redirect to dashboard
                window.location.href = '/dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Invalid username or password';
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
