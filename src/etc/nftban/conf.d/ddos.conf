#
# QUICK START:
#   1. Read documentation below for each protection type
#   2. Uncomment ONLY the protections you need
#   3. Adjust values for your server type
#   4. Reload: nftban ddos reload
#   5. Monitor: nftban ddos status
#
# IMPORTANT:
#   - Start with HIGH limits, reduce gradually
#   - Always whitelist your office/admin IPs first
#   - Monitor logs: tail -f /var/log/nftban/ddos.log
#   - Test before production: nftban ddos test
#
# AUTO-TUNE:
#   Run: nftban ddos autotune
#   This analyzes your server and suggests optimal limits
#
# =============================================================================

# =============================================================================
# MASTER SWITCH
# =============================================================================

# Master switch for all DDoS protection features
# When disabled, NO ddos rules are applied (safest default)
# Default: false (disabled)
DDOS_PROTECTION_ENABLED="false"

# =============================================================================
# LOGGING AND ALERTS
# =============================================================================

# Log all DDoS protection actions
# Recommended: true (helps diagnose issues)
# Default: true
#DDOS_LOGGING_ENABLED="true"

# Send email alerts for DDoS attacks
# Requires mail system configured (see: nftban mail configure)
# Default: false
#DDOS_EMAIL_ALERTS="false"

# =============================================================================
# WHITELIST (CONFIGURE THIS FIRST!)
# =============================================================================
#
# ⚠️  CRITICAL: Configure whitelists BEFORE enabling any limits!
#
# Always whitelist:
#   - localhost: 127.0.0.1, ::1
#   - Your office/admin IPs
#   - CDN IPs (CloudFlare, etc.)
#   - Monitoring service IPs (UptimeRobot, Pingdom, etc.)
#   - Private networks if applicable: 10.0.0.0/8, 192.168.0.0/16
#
# Format: Comma-separated list of IPs and/or CIDRs
# Example: "127.0.0.1,::1,203.0.113.0/24,YOUR_OFFICE_IP"
#
# Default: empty (no whitelist - NOT SAFE!)
#
#DDOS_WHITELIST="127.0.0.1,::1"
#DDOS_OFFICE_IPS=""              # Your office/VPN network
#DDOS_CDN_IPS=""                 # CloudFlare, etc.

# =============================================================================
# SYN FLOOD PROTECTION
# =============================================================================
# Protects against TCP SYN flood attacks by rate limiting new TCP connections
# with the SYN flag set. One of the most common DDoS attack types.
#
# ⚠️  CAUTION: Adds latency to ALL new connections when enabled
# ONLY enable if under active SYN flood attack
#
# When to enable:
#   ✅ During active SYN flood attack
#   ❌ Normal operation (causes connection latency)
#
# RECOMMENDED VALUES:
#   - High-traffic: 100/second burst 150
#   - Normal use: 50/second burst 100
# =============================================================================

# Enable SYN flood protection
# Default: false (disabled - only enable during active attack)
#DDOS_SYNFLOOD_ENABLED="false"

# Rate limit for SYN packets (format: X/time_unit)
# Time units: second, minute, hour, day
# Default: 100/second
#DDOS_SYNFLOOD_RATE="100/second"

# Burst allowance (packets allowed before rate limiting)
# Default: 150
#DDOS_SYNFLOOD_BURST="150"

# Log dropped SYN flood packets
# Default: true
#DDOS_SYNFLOOD_LOG="true"

# =============================================================================
# CONNECTION LIMIT PROTECTION
# =============================================================================
# Limits concurrent connections per IP address to specific ports.
# Prevents connection exhaustion and resource abuse.
#
# ✅ RECOMMENDED: Enable for services you run
# ✅ GRANULAR: Enable only for ports/services you actually use
# ✅ Set to "0" to disable limit for a specific service
#
# GUIDELINES BY SERVER TYPE:
#
#   MULTI-SITE HOSTING (50+ websites):
#     HTTP/HTTPS: 200-300  SSH: 15-20  SMTP: 40-60  IMAP: 80-120
#
#   SHARED HOSTING (20-50 websites):
#     HTTP/HTTPS: 150-200  SSH: 10-15  SMTP: 25-40  IMAP: 60-80
#
#   SINGLE BUSINESS SITE:
#     HTTP/HTTPS: 100-150  SSH: 8-12  SMTP: 15-25  IMAP: 30-60
#
#   PERSONAL SITE:
#     HTTP/HTTPS: 50-100  SSH: 5-8  SMTP: 10-15  IMAP: 20-30
#
#   API/PROXY SERVER:
#     HTTP/HTTPS: 80-150  SSH: 5-10  (adjust for known patterns)
#
# =============================================================================

# Enable connection limit protection
# Default: false (disabled)
#DDOS_CONNLIMIT_ENABLED="false"

# ─────────────────────────────────────────────────────────────────────────────
# SSH Connection Limit (port 22)
# ─────────────────────────────────────────────────────────────────────────────
#
# CONSIDERATIONS:
#   - Each tmux/screen session = 1 connection
#   - SCP/SFTP transfers = additional connections
#   - Git operations = additional connections
#   - Ansible/automation = multiple parallel connections
#
# RECOMMENDED:
#   - Large DevOps team (10+ admins): 20
#   - Small team (5-10 admins): 15
#   - Tiny team (2-5 admins): 10
#   - Single admin: 5-8
#
# Set to "0" to disable SSH limit
# Default: 5
#DDOS_CONNLIMIT_SSH="10"

# ─────────────────────────────────────────────────────────────────────────────
# HTTP/HTTPS Connection Limits (ports 80, 443)
# ─────────────────────────────────────────────────────────────────────────────
#
# CONSIDERATIONS:
#   - Modern browsers open 6-8 connections per site
#   - Multiple tabs = multiple connections
#   - AJAX/WebSockets = persistent connections
#   - Image-heavy sites need higher limits
#
# Set to "0" to disable HTTP/HTTPS limits
# Defaults: 20 (too low for most servers)
#DDOS_CONNLIMIT_HTTP="150"
#DDOS_CONNLIMIT_HTTPS="150"

# ─────────────────────────────────────────────────────────────────────────────
# Mail Server Connection Limits
# ─────────────────────────────────────────────────────────────────────────────
#
# SMTP (port 25) - Outgoing mail
# CONSIDERATIONS:
#   - Each email account = 1-2 connections
#   - Mailing lists require higher limits
#   - Webmail = multiple connections
#   - Office 365/G Suite relay = burst connections
#
# RECOMMENDED:
#   - Large office (50+ employees): 60
#   - Medium office (20-50): 40
#   - Small office (5-20): 25
#   - Personal: 10-15
#
# Set to "0" to disable SMTP limit
# Default: 5
#DDOS_CONNLIMIT_SMTP="25"

# POP3 (port 110) - Legacy mail retrieval
# Set to "0" to disable POP3 limit
# Default: 5
#DDOS_CONNLIMIT_POP3="20"

# IMAP (port 143) - Mail synchronization
# CONSIDERATIONS:
#   - Each email account = 1-2 connections
#   - Multiple devices per user = 3× connections
#   - IMAP IDLE = persistent connections
#   - Outlook/Thunderbird = aggressive patterns
#
# RECOMMENDED:
#   - Many accounts per user: 120
#   - Office with multiple accounts: 80
#   - Standard office: 60
#   - Personal: 30
#
# Set to "0" to disable IMAP limit
# Default: 5
#DDOS_CONNLIMIT_IMAP="60"

# ─────────────────────────────────────────────────────────────────────────────
# FTP Connection Limit (port 21)
# ─────────────────────────────────────────────────────────────────────────────
#
# RECOMMENDED: 3-10 depending on usage
# Set to "0" to disable FTP limit
# Default: 3
#DDOS_CONNLIMIT_FTP="10"

# ─────────────────────────────────────────────────────────────────────────────
# Database Connection Limits (ports 3306, 5432)
# ─────────────────────────────────────────────────────────────────────────────
#
# ⚠️  WARNING: Database limits are TRICKY!
#   - Only limits REMOTE connections
#   - NEVER limit localhost (127.0.0.1) - handled automatically
#   - Consider connection pooling (pgBouncer, ProxySQL)
#
# RECOMMENDED:
#   - Application server pool: 100
#   - Shared hosting: 50
#   - Single application: 30
#
# Set to "0" to disable database limits
# Defaults: 10
#DDOS_CONNLIMIT_MYSQL="50"
#DDOS_CONNLIMIT_POSTGRESQL="50"

# ─────────────────────────────────────────────────────────────────────────────
# Custom Connection Limits
# ─────────────────────────────────────────────────────────────────────────────
#
# For additional ports not covered above
# Format: "port;limit,port;limit,..."
# Example: "8080;30,9000;15"
#
# Default: empty
#DDOS_CONNLIMIT_CUSTOM=""

# Log connection limit violations
# Default: true
#DDOS_CONNLIMIT_LOG="true"

# Action when limit exceeded: "reject" or "drop"
# reject = Send TCP RST (recommended - frees resources)
# drop = Silent drop (hides firewall but ties up resources)
# Default: reject
#DDOS_CONNLIMIT_ACTION="reject"

# =============================================================================
# PORT FLOOD PROTECTION
# =============================================================================
# Rate limits NEW connections over time (not concurrent connections).
# Prevents rapid connection attacks and brute force attempts.
#
# Format: "max_connections/time_in_seconds"
# Example: "20/5" = max 20 new connections per 5 seconds
#
# ✅ RECOMMENDED: Enable for high-traffic servers
# ✅ Effective against: Slowloris, brute force, rapid connection attacks
# =============================================================================

# Enable port flood protection
# Default: false (disabled)
#DDOS_PORTFLOOD_ENABLED="false"

# SSH port flood (prevents brute force)
# Format: "rate/time"
# Recommended: 5/300 (5 connections per 5 minutes)
# Default: 5/300
#DDOS_PORTFLOOD_SSH="5/300"

# HTTP/HTTPS port flood
# Format: "rate/time"
# RECOMMENDED:
#   - High-traffic: 50/5
#   - Normal: 20/5
#   - Personal: 10/5
# Defaults: 20/5
#DDOS_PORTFLOOD_HTTP="20/5"
#DDOS_PORTFLOOD_HTTPS="20/5"

# FTP port flood
# Default: 10/60
#DDOS_PORTFLOOD_FTP="10/60"

# SMTP port flood (prevents spam bots)
# Default: 5/300
#DDOS_PORTFLOOD_SMTP="5/300"

# Custom port flood limits
# Format: "port;rate/time,port;rate/time,..."
# Example: "8080;30/10,9000;15/60"
# Default: empty
#DDOS_PORTFLOOD_CUSTOM=""

# Log port flood violations
# Default: true
#DDOS_PORTFLOOD_LOG="true"

# =============================================================================
# ICMP FLOOD PROTECTION
# =============================================================================
# Rate limits ICMP echo requests (ping) to prevent ICMP floods.
#
# ✅ RECOMMENDED: Always enable (allows monitoring but blocks abuse)
# =============================================================================

# Enable ICMP rate limiting
# Default: false (disabled)
#DDOS_ICMPFLOOD_ENABLED="false"

# Incoming ping rate limit
# Format: "X/time_unit" (second, minute, hour, day)
# RECOMMENDED:
#   - Strict: 1/second
#   - Relaxed: 5/second
# Default: 1/second
#DDOS_ICMPFLOOD_RATE="1/second"

# Burst allowance
# Default: 10
#DDOS_ICMPFLOOD_BURST="10"

# Outgoing ping rate limit (rarely needed)
# Set to "0" to disable
# Default: 0
#DDOS_ICMPFLOOD_OUT_RATE="0"

# Drop ICMP timestamp requests (PCI compliance)
# Default: false
#DDOS_ICMP_TIMESTAMP_DROP="false"

# Drop ICMP address mask requests (rarely used)
# Default: true
#DDOS_ICMP_ADDRESSMASK_DROP="true"

# Log ICMP violations (can be noisy)
# Default: false
#DDOS_ICMPFLOOD_LOG="false"

# =============================================================================
# UDP FLOOD PROTECTION
# =============================================================================
# Limits outbound UDP floods from compromised web applications.
#
# ⚠️  WARNING: Use with caution on servers running:
#   - DNS (named/bind)
#   - NTP (ntpd)
#   - SNMP
#   - VoIP services
#
# When to enable:
#   ✅ Web servers without UDP services
#   ❌ DNS servers, NTP servers, VoIP servers
# =============================================================================

# Enable UDP flood protection
# Default: false (disabled - use with caution)
#DDOS_UDPFLOOD_ENABLED="false"

# UDP packet rate limit
# Default: 100/second
#DDOS_UDPFLOOD_RATE="100/second"

# Burst allowance
# Default: 500
#DDOS_UDPFLOOD_BURST="500"

# Usernames to exclude (comma-separated)
# Common: named (DNS), ntpd (NTP), snmpd (SNMP)
# Note: root (UID 0) always excluded
# Default: named,ntpd
#DDOS_UDPFLOOD_ALLOWUSER="named,ntpd"

# Log UDP violations
# Default: true
#DDOS_UDPFLOOD_LOG="true"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Minimum time between rule updates (seconds)
# Default: 60
#DDOS_UPDATE_INTERVAL="60"

# Maximum tracking table entries
# Default: 65536
#DDOS_MAX_ENTRIES="65536"

# Enable experimental features
# Default: false (not recommended for production)
#DDOS_EXPERIMENTAL="false"

# =============================================================================
# FHS COMPLIANT PATHS
# =============================================================================

# DDoS data directory
DDOS_DATA_DIR="/var/lib/nftban/ddos"

# DDoS cache directory
DDOS_CACHE_DIR="/var/cache/nftban/ddos"

# DDoS log file
DDOS_LOG_FILE="/var/log/nftban/ddos.log"

# DDoS statistics file
DDOS_STATS_FILE="/var/lib/nftban/ddos/stats.json"

# =============================================================================
# QUICK START EXAMPLES
# =============================================================================
#
# EXAMPLE 1: Small Business Server (5-10 websites, small team)
# ──────────────────────────────────────────────────────────────
# Uncomment these lines:
#
#   DDOS_PROTECTION_ENABLED="true"
#   DDOS_WHITELIST="127.0.0.1,::1,YOUR_OFFICE_IP"
#   DDOS_CONNLIMIT_ENABLED="true"
#   DDOS_CONNLIMIT_HTTP="150"
#   DDOS_CONNLIMIT_HTTPS="150"
#   DDOS_CONNLIMIT_SSH="10"
#   DDOS_CONNLIMIT_SMTP="25"
#   DDOS_CONNLIMIT_IMAP="60"
#
# Then run: nftban ddos reload
#
# ──────────────────────────────────────────────────────────────
#
# EXAMPLE 2: Multi-Site Hosting (50+ websites)
# ──────────────────────────────────────────────────────────────
# Uncomment these lines:
#
#   DDOS_PROTECTION_ENABLED="true"
#   DDOS_WHITELIST="127.0.0.1,::1,YOUR_OFFICE_IP,CDN_IPS"
#   DDOS_CONNLIMIT_ENABLED="true"
#   DDOS_CONNLIMIT_HTTP="300"
#   DDOS_CONNLIMIT_HTTPS="300"
#   DDOS_CONNLIMIT_SSH="20"
#   DDOS_CONNLIMIT_SMTP="60"
#   DDOS_CONNLIMIT_IMAP="120"
#
# Then run: nftban ddos reload
#
# ──────────────────────────────────────────────────────────────
#
# EXAMPLE 3: Personal Website
# ──────────────────────────────────────────────────────────────
# Uncomment these lines:
#
#   DDOS_PROTECTION_ENABLED="true"
#   DDOS_WHITELIST="127.0.0.1,::1,YOUR_HOME_IP"
#   DDOS_CONNLIMIT_ENABLED="true"
#   DDOS_CONNLIMIT_HTTP="100"
#   DDOS_CONNLIMIT_HTTPS="100"
#   DDOS_CONNLIMIT_SSH="5"
#   DDOS_ICMPFLOOD_ENABLED="true"
#
# Then run: nftban ddos reload
#
# =============================================================================
# MONITORING AND TROUBLESHOOTING
# =============================================================================
#
# Check current status:
#   nftban ddos status
#
# View active configuration:
#   nftban ddos show
#
# View statistics:
#   nftban ddos stats
#
# View recent blocks:
#   nftban ddos blocks --recent
#
# Monitor live logs:
#   tail -f /var/log/nftban/ddos.log
#
# Test configuration (dry-run):
#   nftban ddos test
#
# Reload after changes:
#   nftban ddos reload
#
# Auto-tune recommendations:
#   nftban ddos autotune
#
# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# For persistent user overrides, create: /etc/nftban/nftban.conf.local
# Example:
#   DDOS_CONNLIMIT_HTTP="200"
#   DDOS_CONNLIMIT_SSH="15"
#
