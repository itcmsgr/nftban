name: Generate SHA256 Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # allow the GITHUB_TOKEN to push commits

jobs:
  generate-sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          git ls-files -z ':!:SHA256SUMS.txt' \
            | xargs -0 sha256sum \
            | sort -k2 > "$tmpfile"
          if [[ ! -f SHA256SUMS.txt ]]; then
            mv "$tmpfile" SHA256SUMS.txt
          else
            if ! cmp -s "$tmpfile" SHA256SUMS.txt; then
              mv "$tmpfile" SHA256SUMS.txt
            else
              rm -f "$tmpfile"
            fi
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- SHA256SUMS.txt; then
            git add SHA256SUMS.txt
            git commit -m "chore: auto-update SHA256SUMS.txt"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "SHA256SUMS.txt is up to date; skipping commit."
          fi
