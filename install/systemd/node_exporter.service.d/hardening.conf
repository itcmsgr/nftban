[Service]
# Kernel protections
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes

# Capability restrictions
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=

# Namespace restrictions
RestrictNamespaces=yes
RestrictRealtime=yes

# Personality and device restrictions
LockPersonality=yes
PrivateDevices=yes

# Clock protection
ProtectClock=yes

# IPC isolation
PrivateIPC=yes

# Address family restrictions (allow IPv4, IPv6, Unix sockets)
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# System call filtering
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @obsolete
SystemCallErrorNumber=EPERM

# Memory restrictions
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes

# File system restrictions (already in base service, but reinforcing)
ReadOnlyPaths=/var/lib/node_exporter/textfile_collector
