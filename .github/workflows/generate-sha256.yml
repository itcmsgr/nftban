name: Generate SHA256 Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed to create commits on a branch and open a PR
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          git ls-files -z ':!:SHA256SUMS.txt' \
            | xargs -0 sha256sum \
            | sort -k2 > "$tmpfile"

          if [[ ! -f SHA256SUMS.txt ]] || ! cmp -s "$tmpfile" SHA256SUMS.txt; then
            mv "$tmpfile" SHA256SUMS.txt
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$tmpfile"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi
        id: gen

      - name: Commit changes to a PR branch
        if: steps.gen.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B chore/update-sha256sums
          git add SHA256SUMS.txt
          git commit -m "chore: update SHA256SUMS.txt (automated)"
      
      - name: Create Pull Request
        if: steps.gen.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-sha256sums
          base: main
          title: "chore: update SHA256SUMS.txt"
          commit-message: "chore: update SHA256SUMS.txt (automated)"
          body: |
            This PR updates `SHA256SUMS.txt` automatically.

            - Generated from tracked files (`git ls-files`)
            - Excludes the sums file itself
            - Sorted for stability
            - Deletions/renames are reflected automatically
          labels: automation, security
          delete-branch: true
