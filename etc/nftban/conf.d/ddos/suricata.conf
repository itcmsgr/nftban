# =============================================================================
# NFTBan DDoS Protection - SURICATA MODE Configuration
# =============================================================================
# This configuration is used when Suricata IDS is installed and enabled.
# Uses Suricata EVE JSON alerts for intelligent DDoS detection.
#
# File: /etc/nftban/conf.d/ddos/suricata.conf
# =============================================================================

# -----------------------------------------------------------------------------
# SURICATA MODE SETTINGS
# -----------------------------------------------------------------------------
# These settings control Suricata-integrated DDoS detection.
# Provides deep packet inspection and signature-based detection.

# EVE JSON Log Path (Suricata alert output)
DDOS_SURICATA_EVE_FILE="/var/log/suricata/eve.json"

# Alternative: Unix socket for real-time alerts (faster, optional)
DDOS_SURICATA_EVE_SOCKET=""

# -----------------------------------------------------------------------------
# ALERT CATEGORIES TO MONITOR
# -----------------------------------------------------------------------------
# Suricata alert categories that trigger DDoS protection
# These map to Suricata rule categories (ET Open / ET Pro)

# Enable/disable specific detection types
DDOS_SURICATA_DETECT_SYN_FLOOD="true"
DDOS_SURICATA_DETECT_UDP_FLOOD="true"
DDOS_SURICATA_DETECT_ICMP_FLOOD="true"
DDOS_SURICATA_DETECT_DNS_AMPLIFICATION="true"
DDOS_SURICATA_DETECT_NTP_AMPLIFICATION="true"
DDOS_SURICATA_DETECT_SSDP_AMPLIFICATION="true"
DDOS_SURICATA_DETECT_HTTP_FLOOD="true"
DDOS_SURICATA_DETECT_SLOWLORIS="true"

# Signature patterns to match (regex, pipe-separated)
DDOS_SURICATA_SIG_PATTERNS="DDoS|flood|amplification|reflection|slowloris"

# Signature IDs to explicitly monitor (comma-separated)
# Example ET Open SIDs for DDoS detection
DDOS_SURICATA_SIG_IDS="2100366,2100367,2100368,2100369,2008581,2008582"

# Categories to monitor (from Suricata classification.config)
DDOS_SURICATA_CATEGORIES="attempted-dos,successful-dos,denial-of-service"

# -----------------------------------------------------------------------------
# SCORING THRESHOLDS
# -----------------------------------------------------------------------------
# Score-based decision making (0.0 - 1.0 scale)

# Base score per alert severity (Suricata severity 1-4)
DDOS_SURICATA_SCORE_SEVERITY_1="0.10"   # Low
DDOS_SURICATA_SCORE_SEVERITY_2="0.20"   # Medium
DDOS_SURICATA_SCORE_SEVERITY_3="0.35"   # High
DDOS_SURICATA_SCORE_SEVERITY_4="0.50"   # Critical

# Bonus score for specific attack types
DDOS_SURICATA_SCORE_SYN_FLOOD="0.15"
DDOS_SURICATA_SCORE_AMPLIFICATION="0.20"
DDOS_SURICATA_SCORE_HTTP_FLOOD="0.15"

# Repetition multiplier (alerts from same IP in window)
DDOS_SURICATA_SCORE_REPEAT_5="0.10"     # 5+ alerts
DDOS_SURICATA_SCORE_REPEAT_10="0.20"    # 10+ alerts
DDOS_SURICATA_SCORE_REPEAT_20="0.30"    # 20+ alerts

# Feed reputation bonus (if IP is in threat feeds)
DDOS_SURICATA_SCORE_BAD_REPUTATION="0.15"

# GeoIP risk bonus (high-risk countries)
DDOS_SURICATA_SCORE_HIGH_RISK_GEO="0.10"

# -----------------------------------------------------------------------------
# ACTION THRESHOLDS
# -----------------------------------------------------------------------------
# What to do based on final score

# Observe only (log, no block)
DDOS_SURICATA_THRESHOLD_OBSERVE="0.30"

# Short block (temporary)
DDOS_SURICATA_THRESHOLD_BLOCK_SHORT="0.50"

# Long block (extended)
DDOS_SURICATA_THRESHOLD_BLOCK_LONG="0.70"

# Permanent block (until manual review)
DDOS_SURICATA_THRESHOLD_BLOCK_PERMANENT="0.90"

# -----------------------------------------------------------------------------
# BLOCKING POLICY
# -----------------------------------------------------------------------------
# Ban durations for each threshold level

DDOS_SURICATA_BAN_DURATION_SHORT="600"       # 10 minutes
DDOS_SURICATA_BAN_DURATION_LONG="3600"       # 1 hour
DDOS_SURICATA_BAN_DURATION_PERMANENT="86400" # 24 hours

# Score decay time (seconds) - how long before score resets
DDOS_SURICATA_SCORE_DECAY="3600"

# Time window for counting repeated alerts (seconds)
DDOS_SURICATA_ALERT_WINDOW="120"

# -----------------------------------------------------------------------------
# INTEGRATION WITH OTHER MODULES
# -----------------------------------------------------------------------------
# Enable correlation with other nftban modules

# Use threat feeds for reputation scoring
DDOS_SURICATA_USE_FEEDS="true"

# Use GeoIP for risk scoring
DDOS_SURICATA_USE_GEOIP="true"

# Use classic mode as Layer 0 (hard limits before Suricata analysis)
DDOS_SURICATA_USE_CLASSIC_LAYER0="true"

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------
# EVE JSON parsing settings

# Batch size for processing alerts
DDOS_SURICATA_BATCH_SIZE="100"

# Poll interval for EVE file (milliseconds)
DDOS_SURICATA_POLL_INTERVAL_MS="500"

# Maximum alerts to process per second (rate limiting)
DDOS_SURICATA_MAX_ALERTS_PER_SEC="1000"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log file for suricata mode events
DDOS_SURICATA_LOG_FILE="/var/log/nftban/ddos-suricata.log"

# Log level: DEBUG, INFO, WARN, ERROR
DDOS_SURICATA_LOG_LEVEL="INFO"

# Log all alerts (verbose)
DDOS_SURICATA_LOG_ALL_ALERTS="false"

# Log scoring decisions
DDOS_SURICATA_LOG_SCORES="true"

# =============================================================================
# END OF SURICATA MODE CONFIGURATION
# =============================================================================
