# =============================================================================
# These three knobs are read by `nftban-apply` (the commit-confirm apply path:
# apply rules -> start a rollback deadline timer -> `nftban-confirm` cancels it).
#
# Edit operator preferences in /etc/nftban/conf.d/recovery.conf.local (NOT this
# file) so they survive package upgrades. Effective precedence (low -> high):
#   hardcoded default  <  this file  <  /etc/default/nftban (legacy, deprecated)
#   <  recovery.conf.local  <  environment variable at invocation.
#
# v1.201.x RECOVERY_LEGACY_RECONCILE: this file previously documented ~14 keys,
# most of which had no reader in code. The 11 unread keys were deprecated; only
# these 3 (read live by nftban-apply) remain. The rebuild-recovery retry system
# (/var/lib/nftban/state/rebuild_recovery.json) is a SEPARATE mechanism and is
# not configured here.
# =============================================================================

# Grace period before automatic rollback (seconds).
# How long you have to run `nftban-confirm` before rules auto-rollback.
# Examples: 300 (5 min, default) · 600 (10 min) · 120 (quick VM testing).
NFTBAN_REBOOT_GRACE_PERIOD="300"

# SSH connectivity pre-test before applying rules (true/false).
# When true, a local SSH connection test runs before activating the firewall;
# if it fails the rules are NOT applied (fail-safe). Keeps SSH accessible.
NFTBAN_SSH_TEST_BEFORE_APPLY="true"

# SSH test port for the connectivity pre-test (default 22).
# Set to your SSH port if it is non-standard.
NFTBAN_SSH_TEST_PORT="22"
