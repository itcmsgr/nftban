# =============================================================================
# NFTBan v1.0.0 - GitHub Actions Release Workflow
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Automated package building and release on version tags
# Triggers: Push to v* tags (e.g., v1.0.0, v1.0.1)
#
# What this does:
#   1. Builds Go binaries (nftban-core, nftban-api-server) for x86_64
#   2. Creates RPM packages for EL9, EL10, Fedora 42, Fedora 43
#   3. Creates DEB packages for Ubuntu 22.04/24.04, Debian 12
#   4. Generates SHA256SUMS for all artifacts
#   5. Creates distro-specific package names (nftban-el9-x86_64.rpm, etc.)
#   6. Creates MANIFEST.txt (file inventory)
#   7. Uploads everything to GitHub Release
# =============================================================================

name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # Required to create/edit GitHub Releases

jobs:
  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          - distro: el10
            container: almalinux:10
            name_suffix: el10
          - distro: fc42
            container: fedora:42
            name_suffix: fc42
          - distro: fc43
            container: fedora:43
            name_suffix: fc43

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: bin/

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # Install build dependencies
            dnf -y install rpm-build rpmdevtools tar gzip systemd-rpm-macros make

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh rpm

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              # Create distro-specific name: nftban-el9-x86_64.rpm
              cp "$rpm" "dist/packages/nftban-${{ matrix.name_suffix }}-x86_64.rpm"
            fi
          done
          ls -la dist/packages/

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: bin/

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # Install build dependencies
            apt-get update
            apt-get install -y dpkg-dev build-essential

            # Build DEB
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh deb

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              # Create distro-specific name: nftban-ubuntu22.04-amd64.deb
              cp "$deb" "dist/packages/nftban-${{ matrix.name_suffix }}-amd64.deb"
            fi
          done
          ls -la dist/packages/

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

  # ==========================================================================
  # CREATE RELEASE
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-packages/

      - name: Consolidate packages
        run: |
          mkdir -p dist/packages

          # Copy all RPM packages
          find all-packages -name "*.rpm" -exec cp {} dist/packages/ \;

          # Copy all DEB packages
          find all-packages -name "*.deb" -exec cp {} dist/packages/ \;

          echo "=== All packages ==="
          ls -lh dist/packages/

      - name: Generate SHA256SUMS
        run: |
          cd dist/packages
          rm -f SHA256SUMS

          # Generate checksums for all packages
          shopt -s nullglob
          packages=(*.rpm *.deb)
          if [ ${#packages[@]} -gt 0 ]; then
            sha256sum "${packages[@]}" | sort > SHA256SUMS
            echo "=== SHA256SUMS ==="
            cat SHA256SUMS
          else
            echo "WARNING: No packages found"
            touch SHA256SUMS
          fi

      - name: Generate MANIFEST.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > MANIFEST.txt <<EOF
NFTBan ${VERSION} - Release Artifacts
===================================

RPM Packages (EL Family + Fedora):
  nftban-el9-x86_64.rpm      Rocky / Alma / RHEL / CentOS Stream 9
  nftban-el10-x86_64.rpm     Rocky / Alma / RHEL / CentOS Stream 10
  nftban-fc42-x86_64.rpm     Fedora 42
  nftban-fc43-x86_64.rpm     Fedora 43

DEB Packages (Ubuntu + Debian):
  nftban-ubuntu22.04-amd64.deb   Ubuntu 22.04 (Jammy)
  nftban-ubuntu24.04-amd64.deb   Ubuntu 24.04 (Noble)
  nftban-debian12-amd64.deb      Debian 12 (Bookworm)

Package Sizes:
EOF

          for file in *.rpm *.deb; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              printf "  %-35s %12d bytes\n" "$file" "$size" >> MANIFEST.txt
            fi
          done

          echo "=== MANIFEST.txt ==="
          cat MANIFEST.txt

      - name: Create VERIFY.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > VERIFY.txt <<'EOF'
NFTBan - Package Verification & Installation Guide
===================================================

1. Download the package for your distribution:

   # Rocky / Alma / RHEL / CentOS Stream 9
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el9-x86_64.rpm

   # Rocky / Alma / RHEL / CentOS Stream 10
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-el10-x86_64.rpm

   # Fedora 42
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-fc42-x86_64.rpm

   # Fedora 43
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-fc43-x86_64.rpm

   # Ubuntu 22.04
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu22.04-amd64.deb

   # Ubuntu 24.04
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-ubuntu24.04-amd64.deb

   # Debian 12
   wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-debian12-amd64.deb

2. Verify package integrity:

   wget https://github.com/itcmsgr/nftban/releases/latest/download/SHA256SUMS
   sha256sum -c SHA256SUMS --ignore-missing

3. Install package:

   # Rocky / Alma / Fedora / RHEL
   sudo dnf install -y nftban-<distro>-x86_64.rpm

   # Ubuntu / Debian
   sudo dpkg -i nftban-<distro>-amd64.deb
   sudo apt-get install -f -y

4. Enable and verify:

   sudo nftban enable
   nftban --version
   nftban health summary

Documentation: https://github.com/itcmsgr/nftban#readme
EOF

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          if [ -f "CHANGELOG.md" ]; then
            awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | \
              sed '/^## \[/d' | head -n -1 > dist/packages/RELEASE_NOTES.md || \
              echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          else
            echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          fi

          # Add package list to release notes
          cat >> dist/packages/RELEASE_NOTES.md <<'EOF'

## Available Packages

### RPM (x86_64)
| Distribution | Package |
|--------------|---------|
| Rocky / Alma / RHEL / CentOS Stream 9 | `nftban-el9-x86_64.rpm` |
| Rocky / Alma / RHEL / CentOS Stream 10 | `nftban-el10-x86_64.rpm` |
| Fedora 42 | `nftban-fc42-x86_64.rpm` |
| Fedora 43 | `nftban-fc43-x86_64.rpm` |

### DEB (amd64)
| Distribution | Package |
|--------------|---------|
| Ubuntu 22.04 (Jammy) | `nftban-ubuntu22.04-amd64.deb` |
| Ubuntu 24.04 (Noble) | `nftban-ubuntu24.04-amd64.deb` |
| Debian 12 (Bookworm) | `nftban-debian12-amd64.deb` |
EOF

          echo "=== RELEASE_NOTES.md ==="
          cat dist/packages/RELEASE_NOTES.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/packages/*.rpm
            dist/packages/*.deb
            dist/packages/SHA256SUMS
            dist/packages/MANIFEST.txt
            dist/packages/VERIFY.txt
          body_path: dist/packages/RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
