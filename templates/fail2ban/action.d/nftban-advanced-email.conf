[Definition]

# Action for when a ban starts
actionstart = 
    if [ "%(<notify_start>s)" = "true" ]; then
        if [ -x "$(command -v mailx)" ]; then
            printf "Fail2Ban %(<name>)s started at %(timestamp)s\n" | mailx -s "Fail2Ban: %(<name>)s started" -r "%(<sender>)s" "%(<destemail>)s"
        elif [ -x "$(command -v sendmail)" ]; then
            printf "To: %(<destemail>)s\nFrom: %(<sender>)s\nSubject: Fail2Ban: %(<name>)s started\n\nFail2Ban %(<name>)s started at %(timestamp)s\n" | sendmail -t
        fi
    fi

# Action for when a ban stops
actionstop = 
    if [ "%(<notify_stop>s)" = "true" ]; then
        if [ -x "$(command -v mailx)" ]; then
            printf "Fail2Ban %(<name>)s stopped at %(timestamp)s\n" | mailx -s "Fail2Ban: %(<name>)s stopped" -r "%(<sender>)s" "%(<destemail>)s"
        elif [ -x "$(command -v sendmail)" ]; then
            printf "To: %(<destemail>)s\nFrom: %(<sender>)s\nSubject: Fail2Ban: %(<name>)s stopped\n\nFail2Ban %(<name>)s stopped at %(timestamp)s\n" | sendmail -t
        fi
    fi

# Action for when an IP gets banned
actionban = 
    if [ "%(<notify_ban>s)" = "true" ]; then
        IP=<ip>
        SUBJECT="Fail2Ban: %(<name>)s banned $IP"
        BODY="IP: $IP\nHost: %(<host>)s\nFailures: %(<failures>)s\nTime: %(timestamp)s\nJail: %(<name>)s\nLog: %(<logpath>)s\n"
        
        # Add whois info if enabled
        if [ "%(<include_whois>s)" = "true" ] && [ -x "$(command -v whois)" ]; then
            WHOIS=$(whois $IP 2>/dev/null | head -25)
            BODY="$BODY\nWhois Info:\n$WHOIS\n"
        fi
        
        # Add nslookup info if enabled
        if [ "%(<include_nslookup>s)" = "true" ] && [ -x "$(command -v nslookup)" ]; then
            NSLOOKUP=$(nslookup $IP 2>/dev/null | tail -n +3)
            BODY="$BODY\nNSLookup Info:\n$NSLOOKUP\n"
        fi
        
        # Add reverse DNS if enabled
        if [ "%(<include_reverse_dns>s)" = "true" ] && [ -x "$(command -v dig)" ]; then
            REVERSE_DNS=$(dig +short -x $IP 2>/dev/null)
            BODY="$BODY\nReverse DNS: $REVERSE_DNS\n"
        fi
        
        # Send email based on available mail client
        if [ -x "$(command -v mailx)" ]; then
            printf "$BODY" | mailx -s "$SUBJECT" -r "%(<sender>)s" "%(<destemail>)s"
        elif [ -x "$(command -v sendmail)" ]; then
            printf "To: %(<destemail>)s\nFrom: %(<sender>)s\nSubject: $SUBJECT\n\n$BODY" | sendmail -t
        fi
        
        echo "Sent ban notification for IP: $IP"
    fi

# Action for when an IP gets unbanned
actionunban = 
    if [ "%(<notify_unban>s)" = "true" ]; then
        IP=<ip>
        SUBJECT="Fail2Ban: %(<name>)s unbanned $IP"
        BODY="IP: $IP has been unbanned from %(<name>)s at %(timestamp)s\n"
        BODY="$BODY\nOriginal ban time: %(<bantime>)s seconds\n"
        BODY="$BODY\nJail: %(<name>)s\n"
        
        if [ -x "$(command -v mailx)" ]; then
            printf "$BODY" | mailx -s "$SUBJECT" -r "%(<sender>)s" "%(<destemail>)s"
        elif [ -x "$(command -v sendmail)" ]; then
            printf "To: %(<destemail>)s\nFrom: %(<sender>)s\nSubject: $SUBJECT\n\n$BODY" | sendmail -t
        fi
    fi

actioncheck = 

[Init]

# Default parameters - ALL OPTIONS DISABLED BY DEFAULT
destemail = root@localhost
sender = fail2ban@localhost

# Notification switches (true/false)
notify_start = false
notify_stop = false
notify_ban = false
notify_unban = false

# Information inclusion switches (true/false)
include_whois = false
include_nslookup = false
include_reverse_dns = false

# Default ban time for reference
bantime = 3600
