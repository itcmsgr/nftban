# =============================================================================
# NFTBan v1.0 - tmpfiles.d Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Create runtime directories on boot
# Location: /etc/tmpfiles.d/nftban.conf or /usr/lib/tmpfiles.d/nftban.conf
#
# This file ensures NFTBan runtime directories exist after boot.
# Directories in /run are volatile (tmpfs) and need recreation.
#
# Format: Type Path Mode User Group Age Argument
# See: man tmpfiles.d(5)
# =============================================================================

# Runtime directory (volatile - needs recreation on boot)
d /run/nftban 0755 nftban nftban -

# Runtime subdirectories
d /run/nftban/sockets 0750 nftban nftban -

# PID file cleanup (remove stale PID files on boot)
r /run/nftban/*.pid

# Cache directory (persistent but may need cleanup)
d /var/cache/nftban 0755 nftban nftban -

# Ensure log directory exists with correct permissions
d /var/log/nftban 0750 nftban nftban -

# Ensure state directory exists
d /var/lib/nftban 0750 nftban nftban -

# State subdirectories
d /var/lib/nftban/config 0750 nftban nftban -
d /var/lib/nftban/state 0750 nftban nftban -
d /var/lib/nftban/feeds 0750 nftban nftban -
d /var/lib/nftban/geoip 0750 nftban nftban -
d /var/lib/nftban/reports 0750 nftban nftban -
d /var/lib/nftban/metrics 0750 nftban nftban -
d /var/lib/nftban/snapshots 0750 nftban nftban -
d /var/lib/nftban/exports 0750 nftban nftban -

# Auditors directory (special permissions for nftban-auditors group)
d /var/lib/nftban/reports/auditors 0770 root nftban-auditors -

# =============================================================================
# NOTES
# =============================================================================
#
# To apply manually (without reboot):
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/nftban.conf
#
# To verify:
#   ls -la /run/nftban
#   ls -la /var/lib/nftban
#
# Groups (v1.0 simplified model):
#   nftban: All operators (CLI, Web, services)
#   nftban-auditors: Read-only audit access
#
# =============================================================================
