# NFTBan Fail2ban Jail - Roundcube Webmail
#
# Monitors Roundcube webmail authentication failures.
# Protects webmail interface from brute force attacks.
#
# Configuration:
# - maxretry: 9 failed logins
# - findtime: 10 minutes (600 seconds)
# - bantime: 1 hour (3600 seconds)
#
# Based on DirectAdmin production configuration

[nftban-roundcube]

# Disabled by default - enable if Roundcube is installed
enabled   = false

# HTTP/HTTPS ports
port      = http,https

# Use standard roundcube-auth filter
filter    = roundcube-auth

# Roundcube error log location (adjust path as needed)
logpath   = /var/www/html/roundcube/logs/errors.log
            /var/www/roundcube/logs/errors.log
            /usr/share/roundcube/logs/errors.log

# Moderate threshold for webmail
maxretry  = 9
findtime  = 10m

# Short ban for webmail (1 hour)
bantime   = 1h

# Use NFTBan action
action    = nftban[name=roundcube]
