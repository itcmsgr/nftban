        # =====================================================================
        # MODULE STATUS
        # =====================================================================
        - uuid: 70f3f4c0-7fa3-46d1-8aba-b504460ccc36
          name: 'NFTBan: Modules enabled'
          type: TRAPPER
          key: nftban.modules.enabled
          value_type: UNSIGNED
          description: 'Count of enabled modules'
        - uuid: f1b63344-e27b-43df-8ae4-8efa51c779b1
          name: 'NFTBan: Modules active'
          type: TRAPPER
          key: nftban.modules.active
          value_type: UNSIGNED
