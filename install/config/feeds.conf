# =============================================================================
# DYNAMIC DISCOVERY PATTERN (DO NOT MODIFY)
# =============================================================================
# The system automatically discovers feeds by scanning for:
#   FEED_*_URL
#
# For each discovered feed, the system expects:
#   FEED_<name>_ENABLED       (required, default: false)
#   FEED_<name>_CATEGORY      (required, default: "other")
#   FEED_<name>_DESCRIPTION   (required, default: "No description")
#   FEED_<name>_INTERVAL      (optional, default: DAILY)
#   FEED_<name>_SIZE          (optional, for display only)
#
# To add a new feed:
# 1. Add FEED_<name>_URL with the feed URL
# 2. Add FEED_<name>_ENABLED="false"  (MUST be false for safety!)
# 3. Add FEED_<name>_CATEGORY="protection|ssh|web|email"
# 4. Add FEED_<name>_DESCRIPTION="Description here"
# 5. Add FEED_<name>_INTERVAL="HOURLY|DAILY|WEEKLY" (optional)
# 6. Add FEED_<name>_SIZE="~X IPs" (optional, for display)
#
# The system will automatically discover your new feed!
# =============================================================================

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# INTERACTIVE SELECTION (RECOMMENDED):
#   sudo nftban feeds select
#   → Shows beautiful numbered menu
#   → Select by number, range, or category
#
# ENABLE SPECIFIC FEED:
#   sudo nftban feeds enable SPAMHAUS_DROP
#
# ENABLE CATEGORY:
#   sudo nftban feeds enable-category ssh
#
# LIST ALL FEEDS:
#   nftban feeds list
#
# UPDATE ENABLED FEEDS:
#   sudo nftban feeds update
#
# TROUBLESHOOTING:
#   tail -f /var/log/nftban/feeds.log
#   nftban feeds status
#
# =============================================================================
