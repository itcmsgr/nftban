# =============================================================================
# NFTBan - Semgrep Security Scanning
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Static analysis security scanning using Semgrep
#
# Runs on:
#   - Push to main branch
#   - Pull requests to main branch
#   - Weekly on Sunday at 4:00 AM UTC
#
# Outputs:
#   - SARIF report uploaded to GitHub Security tab
#   - Security findings for Go code patterns
#
# Note: Uses --config auto for community-maintained security rules
# covering OWASP Top 10, CWE patterns, and Go-specific vulnerabilities.
# =============================================================================

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'  # Weekly: Sunday 4:00 AM UTC

# Minimal top-level permissions (OpenSSF Scorecard compliance)
permissions: read-all

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload SARIF results
      contents: read          # Required to checkout code
    container:
      image: semgrep/semgrep:latest  # v1.19.0: Pin to tagged version; update as needed (R34)

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Generate summary
        if: always()
        run: |
          echo "## Semgrep Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Semgrep has scanned the codebase for security vulnerabilities:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rules Applied" >> $GITHUB_STEP_SUMMARY
          echo "- **OWASP Top 10**: Common web application security risks" >> $GITHUB_STEP_SUMMARY
          echo "- **CWE Patterns**: Common Weakness Enumeration patterns" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Security**: Language-specific vulnerability patterns" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Categories" >> $GITHUB_STEP_SUMMARY
          echo "- Command injection" >> $GITHUB_STEP_SUMMARY
          echo "- SQL injection" >> $GITHUB_STEP_SUMMARY
          echo "- Path traversal" >> $GITHUB_STEP_SUMMARY
          echo "- Insecure deserialization" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Insecure cryptography" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the **Security** tab for detailed findings." >> $GITHUB_STEP_SUMMARY
