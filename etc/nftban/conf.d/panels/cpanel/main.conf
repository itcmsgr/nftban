# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:description="cPanel/WHM control-panel firewall + security port surface (sourced by panel_loader and the cPanel shell library)"
# meta:inventory.files="/etc/nftban/conf.d/panels/cpanel/main.conf"
# meta:inventory.binaries=""
# meta:inventory.env_vars="NFTBAN_CPANEL_TCP_IN,NFTBAN_CPANEL_TCP_OUT,NFTBAN_CPANEL_UDP_IN,NFTBAN_CPANEL_UDP_OUT,NFTBAN_CPANEL_TCP6_IN,NFTBAN_CPANEL_TCP6_OUT"
# meta:inventory.config_files="/etc/nftban/conf.d/panels/cpanel/main.conf,/etc/nftban/conf.d/panels/cpanel/main.conf.local"
# meta:inventory.systemd_units=""
# meta:inventory.network="tcp/2083 (cPanel HTTPS), tcp/2087 (WHM HTTPS), tcp/4190 (managesieve)"
# meta:inventory.privileges="none"
# Purpose: cPanel/WHM control panel firewall and security configuration
#
# File: /etc/nftban/conf.d/panels/cpanel/main.conf
# =============================================================================

# -----------------------------------------------------------------------------
# CPANEL INSTALLATION
# -----------------------------------------------------------------------------

# cPanel installation path
NFTBAN_CPANEL_PATH="/usr/local/cpanel"

# cPanel/WHM panel ports
NFTBAN_CPANEL_PANEL_PORT="2082"      # cPanel HTTP
NFTBAN_CPANEL_PANEL_SSL_PORT="2083"  # cPanel HTTPS
NFTBAN_WHM_PANEL_PORT="2086"         # WHM HTTP
NFTBAN_WHM_PANEL_SSL_PORT="2087"     # WHM HTTPS

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv4
# -----------------------------------------------------------------------------
# Based on cPanel recommended firewall rules
# See: https://docs.cpanel.net/knowledge-base/security/how-to-configure-your-firewall-for-cpanel/
#
# ⚠️  IMPORTANT: SSH port 22 is AUTOMATICALLY managed by NFTBan
#    SSH is a critical safety port defined in /etc/nftban/ports.d/00-ssh.conf
#    DO NOT add port 22 to panel configs - it's handled separately to prevent lockout
#

# TCP INPUT (incoming connections)
# Ports: FTP(20,21), SMTP(25), DNS(53), HTTP(80), POP3(110),
#        IMAP(143), HTTPS(443), SMTPS(465), Submission(587), IMAPS(993),
#        POP3S(995), cPanel Webmail(2077), cPanel Webmail SSL(2078),
#        cPanel CalDAV(2079), cPanel WebDAV(2080), cPanel(2082),
#        cPanel SSL(2083), WHM(2086), WHM SSL(2087), Webmail(2095),
#        Webmail SSL(2096), WebSocket(8443)
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port
NFTBAN_CPANEL_TCP_IN="20,21,25,53,80,110,143,443,465,587,993,995,4190,2077,2078,2079,2080,2082,2083,2086,2087,2095,2096,8443"

# TCP OUTPUT (outgoing connections)
# Ports: FTP(20,21), SMTP(25), Time(37), WHOIS(43), DNS(53),
#        HTTP(80), POP3(110), Ident(113), HTTPS(443), Submission(587),
#        Rsync(873), IMAPS(993), POP3S(995), WHM(2086), WHM SSL(2087),
#        cpsrvd(2089), License(2703)
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port
NFTBAN_CPANEL_TCP_OUT="20,21,25,37,43,53,80,110,113,443,587,873,993,995,2086,2087,2089,2703"

# UDP INPUT (incoming connections)
# Ports: FTP(20,21), DNS(53), HTTP/3(80), QUIC(443)
NFTBAN_CPANEL_UDP_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections)
# Ports: FTP(20,21), DNS(53), Ident(113), NTP(123), Rsync(873),
#        cPanel dnsadmin(6277), CloudLinux(24441)
NFTBAN_CPANEL_UDP_OUT="20,21,53,113,123,873,6277,24441"

# -----------------------------------------------------------------------------
# FIREWALL PORT CONFIGURATION - IPv6
# -----------------------------------------------------------------------------
# IPv6 uses the same ports as IPv4
# NOTE: Port 22 (SSH) excluded - managed automatically as safety port

# TCP INPUT (incoming connections) - IPv6
NFTBAN_CPANEL_TCP6_IN="20,21,25,53,80,110,143,443,465,587,993,995,4190,2077,2078,2079,2080,2082,2083,2086,2087,2095,2096,8443"

# TCP OUTPUT (outgoing connections) - IPv6
NFTBAN_CPANEL_TCP6_OUT="20,21,25,37,43,53,80,110,113,443,587,873,993,995,2086,2087,2089,2703"

# UDP INPUT (incoming connections) - IPv6
NFTBAN_CPANEL_UDP6_IN="20,21,53,80,443"

# UDP OUTPUT (outgoing connections) - IPv6
NFTBAN_CPANEL_UDP6_OUT="20,21,53,113,123,873,6277,24441"

# -----------------------------------------------------------------------------
# CUSTOM PORTS (OPTIONAL)
# -----------------------------------------------------------------------------
# Add custom ports to the default lists
# Example: NFTBAN_CPANEL_CUSTOM_TCP_IN="3306,5432"  # MySQL, PostgreSQL

NFTBAN_CPANEL_CUSTOM_TCP_IN=""
NFTBAN_CPANEL_CUSTOM_TCP_OUT=""
NFTBAN_CPANEL_CUSTOM_UDP_IN=""
NFTBAN_CPANEL_CUSTOM_UDP_OUT=""

NFTBAN_CPANEL_CUSTOM_TCP6_IN=""
NFTBAN_CPANEL_CUSTOM_TCP6_OUT=""
NFTBAN_CPANEL_CUSTOM_UDP6_IN=""
NFTBAN_CPANEL_CUSTOM_UDP6_OUT=""

# -----------------------------------------------------------------------------
# CPANEL LICENSE SERVERS
# -----------------------------------------------------------------------------
# cPanel license verification requires access to cPanel servers
# See: cpanel.allow file for specific IP whitelisting

# Auto-enable cPanel license server whitelist? (YES|NO|ASK)
# YES  - Automatically enable cPanel server whitelist (recommended)
# NO   - Skip cPanel server whitelist (you must enable manually!)
# ASK  - Prompt user during setup (default)
NFTBAN_CPANEL_AUTO_LICENSE_WHITELIST="ASK"

# Update cPanel license server list automatically? (YES|NO)
NFTBAN_CPANEL_UPDATE_LICENSE_SERVERS="YES"

# -----------------------------------------------------------------------------
# LOGIN MONITORING
# -----------------------------------------------------------------------------
# cPanel login failure monitoring is configured in:
# /etc/nftban/conf.d/login/services.conf

# Login monitoring enabled by default (see login/services.conf)
# LOGIN_SERVICE_CPANEL_ENABLED="true"

# Log file location
LOGIN_SERVICE_CPANEL_LOG="/usr/local/cpanel/logs/login_log"
LOGIN_SERVICE_CPANEL_ACCESS="/usr/local/cpanel/logs/access_log"

# -----------------------------------------------------------------------------
# SECURITY RECOMMENDATIONS
# -----------------------------------------------------------------------------
# • Enable cPanel license server IP whitelist (REQUIRED for licensing)
# • Use SSL/TLS for all panel access (ports 2083, 2087, 2096)
# • Enable login monitoring (automatic brute-force protection)
# • Configure CSF/LFD or fail2ban for additional protection
# • Restrict WHM access to specific IPs if possible
# • Enable two-factor authentication in cPanel/WHM
# • Keep cPanel/WHM updated to latest STABLE version
# • Enable cPHulk brute force protection
# • Configure SMTP restrictions to prevent email abuse

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
