# =============================================================================
#
# INLINE EXCEPTION MODE
# =====================
# By default, Suricata runs in IDS-only mode (alert, never drop).
# Inline Exception Mode allows a NARROW ALLOWLIST of high-confidence
# Suricata rules to drop the current malicious request inline.
#
# This is NOT broad IPS mode. This is NOT "all SQLi inline."
# Only explicitly approved SIDs may drop traffic.
#
# Architecture:
#   Default path:    Suricata alerts → NFTBan decides → kernel enforces
#   Exception path:  Suricata drops current request → NFTBan audits → kernel bans future traffic
#
# See: V192_FINAL_ARCHITECTURE_DECISION.md
# =============================================================================

# --- Master switch (default: false) ---
INLINE_EXCEPTION_ENABLED="false"

# --- Global kill switch (overrides everything) ---
# Set to true to INSTANTLY disable all inline behavior.
# No restart required — next config read will force IDS-only.
NFTBAN_INLINE_DISABLE="false"

# --- Dry-run mode ---
# When true, logs what WOULD be dropped but does not actually drop.
# Recommended: run dry-run for 7 days before enabling inline drops.
INLINE_EXCEPTION_DRY_RUN="false"

# --- SID cap (default: 50, hard maximum: 200) ---
INLINE_EXCEPTION_MAX_SIDS="50"

# --- Require EVE recording for inline drops ---
# If Suricata cannot write EVE, inline mode is auto-disabled.
INLINE_REQUIRE_EVE="true"

# --- Approved SIDs (explicit allowlist) ---
# Format: "SID:category:justification"
# Only SIDs listed here may trigger inline drops.
# Each SID must also have its category enabled below.
#
# Example:
# INLINE_ALLOWED_SIDS=(
#     "2100498:sqli:high-confidence UNION SELECT - near-zero FP"
#     "2027865:exploit:Log4j JNDI injection - CVE-2021-44228"
# )
INLINE_ALLOWED_SIDS=()

# --- Category gates (double-gate: SID must be listed AND category enabled) ---
INLINE_CATEGORY_SQLI="false"
INLINE_CATEGORY_EXPLOIT="false"
INLINE_CATEGORY_MALWARE_HTTP="false"
INLINE_CATEGORY_AUTH_BYPASS="false"

# --- Follow-up action (NFTBan kernel ban after inline drop) ---
# Options: observe | ban_short | ban_long | ban_permanent
INLINE_FOLLOWUP_ACTION="ban_long"
INLINE_FOLLOWUP_DURATION="86400"

# --- Audit ---
INLINE_AUDIT_LOG="true"
INLINE_METRICS="true"
