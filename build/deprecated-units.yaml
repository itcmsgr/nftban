# =============================================================================
# NFTBan deprecated systemd units
# =============================================================================
# Source of truth for retired/legacy unit names. Consumed by
# build/generate-systemd-maintainer-scripts.sh to emit the cleanup logic
# in RPM %preun and DEB prerm.
#
# Active units come from install/packaging/systemd/nftban-systemd-install.list
# (generated by build/generate-systemd-install-list.sh from install/systemd/).
# DO NOT list active units here.
#
# -----------------------------------------------------------------------------
# Per-unit policy
# -----------------------------------------------------------------------------
#   stop_only:
#     Run systemctl stop + disable. No mask. No file removal.
#     Suitable for daemons removed in past releases that may still exist on
#     legacy hosts but never created a /etc/systemd/system mask-residue risk.
#
#   stop_disable_mask_remove:
#     Run stop + disable. Then call mask_if_exists() which:
#       - If a real unit file exists at /usr/lib/systemd/system/$unit or
#         /lib/systemd/system/$unit, mask + remove the unit file.
#       - Else if /etc/systemd/system/$unit is a symlink AND its target is
#         /dev/null (i.e., a mask), remove the residue symlink.
#       - Else: no action.
#     This closes Lane L10 F7_LOW (clean hosts no longer accumulate
#     /etc/systemd/system/$unit -> /dev/null residue from buggy uninstall).
#
#   stop_disable_remove:                                            (v1.228.2)
#     Run stop + disable. Then call remove_unit_file_if_exists() which:
#       - Removes the unit file at /usr/lib/systemd/system/$unit and
#         /lib/systemd/system/$unit if present.
#       - Removes /etc/systemd/system/$unit ONLY when it is an existing
#         /dev/null mask (residue, or a mask an operator applied by hand).
#       - NEVER creates a mask.
#     Same /etc territory boundary as stop_disable_mask_remove; the difference
#     is that no mask is left behind. Use this policy — NOT the mask variant —
#     when the unit NAME is reserved for a possible future release: a permanent
#     /dev/null mask would silently neutralise any future unit shipped under
#     that name, which is precisely the invisible-failure class the retirement
#     is meant to remove.
#
# -----------------------------------------------------------------------------
# /etc/systemd/system territory boundary (A2 — senior audit)
# -----------------------------------------------------------------------------
# This package will only modify /etc/systemd/system/$unit when the existing
# symlink targets /dev/null (i.e., it is a mask). Operator-created custom
# aliases at this path (target != /dev/null) are preserved.
#
# Acknowledged ambiguity: an operator who manually ran `systemctl mask <unit>`
# on a deprecated NFTBan unit (e.g., nftban-ui*) produces a /dev/null symlink
# indistinguishable from buggy-install residue. The package treats both the
# same and removes them on uninstall. This is acceptable because all units
# in this file are permanently retired and never returning; the mask served
# only to suppress errors from leftover unit files, which the cleanup also
# removes.
# =============================================================================

deprecated:
  - name: nftban-login-monitor.service
    policy: stop_only
    removed_in: v1.23.0
    reason: "EVAL-3 retirement; replaced by Go daemon loginmon module (internal/loginmon)"

  - name: nftban-api.service
    policy: stop_only
    removed_in: never-shipped
    reason: "Defensive entry; was referenced in earlier maintainer scripts but never shipped passively"

  - name: nftban-ui.service
    policy: stop_disable_mask_remove
    removed_in: v1.100.1b.A
    reason: "GOTH PR-D4 stage 1 — Web UI removed from package payload"

  - name: nftban-ui-auth.service
    policy: stop_disable_mask_remove
    removed_in: v1.100.1b.A
    reason: "GOTH PR-D4 stage 1 — UI auth daemon removed"

  - name: nftban-ui-auth.socket
    policy: stop_disable_mask_remove
    removed_in: v1.100.1b.A
    reason: "GOTH PR-D4 stage 1 — UI auth socket removed"

  # ---------------------------------------------------------------------------
  # v1.228.2 — Suricata retired from the ACTIVE product surface (owner ruling
  # D1-D6, 2026-07-28). Suricata is a DORMANT PLACEHOLDER for a much later
  # release, not an active protection module. These three units are removed
  # from newly built packages and converged away on upgrade.
  #
  # Timer is listed FIRST so the loop stops the trigger before its service.
  #
  # BOUNDARY: NFTBan touches ONLY nftban-suricata* units. The upstream
  # suricata.service / suricata-update.service / suricata-update.timer and the
  # external suricata package and its independent configuration are NEVER
  # stopped, disabled, removed or altered by this cleanup.
  # ---------------------------------------------------------------------------
  - name: nftban-suricata-stats.service
    policy: stop_disable_remove
    removed_in: v1.228.2
    reason: "D1/D3 — the FOURTH NFTBan Suricata unit. Its ExecStart is a Go command that exists and it carries Requires=suricata.service, so it cannot start without an external Suricata and NFTBan never enables it. Retired anyway: a dormant placeholder must not ship an operational service implying monitoring or protection. Shipping it while claiming Suricata is retired from the active product surface would make the release claim false. The Go stats implementation may remain internally; what is retired is the systemd/operational surface."

  - name: nftban-suricata-update.timer
    policy: stop_disable_remove
    removed_in: v1.228.2
    reason: "D2 — weekly rule-update timer for a retired surface; triggered a service whose ExecStart invokes `nftban suricata rules update`, a CLI token deleted by ff1865b4"

  - name: nftban-suricata-update.service
    policy: stop_disable_remove
    removed_in: v1.228.2
    reason: "D2 — ExecStart=/usr/sbin/nftban suricata rules update; the rules module was deleted by ff1865b4 and rule management is NOT restored. Deliberately not repointed to bare suricata-update: that would assert a NEW claim that NFTBan owns Suricata rule updates"

  - name: nftban-suricata.service
    policy: stop_disable_remove
    removed_in: v1.228.2
    reason: "D1 — ExecStartPre=+/usr/sbin/nftban suricata rules verify --quiet invokes a deleted CLI token; Type=simple + Restart=on-failure with no SuccessExitStatus means an honest non-zero turns unit start into a restart loop. Removed rather than de-fanged: stripping ExecStartPre would leave a service that APPEARS protective while no rule verification exists"
