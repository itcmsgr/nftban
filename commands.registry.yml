        --json: {type: bool, description: "Output in JSON format"}
  examples:
    - "nftban ddos status"
    - "nftban ddos enable"
    - "nftban ddos disable"
    - "nftban ddos test"
    - "nftban ddos config --json"

portscan:
  category: active_protection
  description: "Port scan detection and blocking"
  risk: advanced
  audience: [cli]
  capability: policy_change
  mutates: conditional
  supports_dry_run: true
  requires_root: true
  panel_expose: false
  output_modes: [json, text]
  has_json: true
  subcommands:
    enable:
      mutates: true
      description: "Enable port scan detection"
    disable:
      mutates: true
      description: "Disable port scan detection"
    status:
      mutates: false
      description: "Show detection status and configuration"
      options:
