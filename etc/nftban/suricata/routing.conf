# =============================================================================
# NFTBan Suricata Alert Routing Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# meta:name="routing_config"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2026-02-08"
# meta:description="Deterministic routing of Suricata alerts to modules"
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files=""
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
# =============================================================================
#
# ROUTING PRECEDENCE (highest to lowest):
#   1. SID overrides (explicit SID -> module mapping)
#   2. Category mapping (normalized category -> module)
#   3. Service/port constraints (proto + dest_port -> module)
#   4. Keyword patterns (last resort, with tie-break rules)
#   5. Priority arbitration (ddos > portscan > login > other)
#
# CATEGORY NORMALIZATION:
#   EVE categories are normalized before matching:
#   - Lowercase
#   - Trim whitespace
#   - Replace spaces/underscores with hyphens
#   - Example: "Attempted Administrator Privilege Gain" -> "attempted-administrator-privilege-gain"
#
# MATCHING RULES:
#   - Categories use contains/prefix matching (not exact equals)
#   - Keywords use case-insensitive substring matching
#   - Port constraints are exact match
#
# =============================================================================

[global]
# Enable routing (set to false to use legacy keyword-only matching)
enabled = true

# Priority order (higher priority wins on tie)
# Format: module:priority (higher number = higher priority)
priority_ddos = 100
priority_portscan = 50
priority_login = 25
priority_other = 1

# Event deduplication TTL (seconds) - prevent same event scored twice
dedup_ttl = 3600

# Rate gate for DDoS classification (events per src_ip per window)
ddos_rate_gate_threshold = 10
ddos_rate_gate_window = 10

# =============================================================================
# SID OVERRIDES (Explicit SID -> Module mapping)
# =============================================================================
# Use for hot SIDs you specifically want to route
# Format: sid = module
# These take highest precedence

[sid_override]
# SSH Brute Force -> login (even if signature contains "scan")
2001219 = login
2003068 = login

# FTP Brute Force -> login
2001068 = login
2001069 = login

# SMTP Auth Failure -> login
2005001 = login

# Explicit portscan SIDs -> portscan
2010935 = portscan
2010936 = portscan
2010937 = portscan
2010938 = portscan

# Explicit DDoS SIDs -> ddos
2100366 = ddos
2100367 = ddos
2100368 = ddos
2100369 = ddos
2008581 = ddos
2008582 = ddos

# =============================================================================
# CATEGORY MAPPING (Normalized category -> Module)
# =============================================================================
# Uses contains/prefix matching on normalized category
# Format: category_pattern = module

[category_map]
# Login/Auth categories
attempted-admin = login
unsuccessful-user = login
default-login-attempt = login
credential = login
authentication = login
brute-force = login

# Portscan/Recon categories
attempted-recon = portscan
successful-recon = portscan
network-scan = portscan
information-leak = portscan

# DDoS categories
attempted-dos = ddos
successful-dos = ddos
denial-of-service = ddos
flood = ddos
amplification = ddos

# =============================================================================
# SERVICE/PORT CONSTRAINTS (Proto + DestPort -> Module context)
# =============================================================================
# Provides context for tie-breaking. If dest_port matches a service,
# that module gets priority for ambiguous alerts.
# Format: port = module

[service_ports]
# SSH service ports -> login context
22 = login

# Mail service ports -> login context
25 = login
110 = login
143 = login
465 = login
587 = login
993 = login
995 = login

# FTP -> login context
21 = login

# DNS -> ddos context (amplification attacks)
53 = ddos

# NTP -> ddos context (amplification attacks)
123 = ddos

# =============================================================================
# KEYWORD PATTERNS (Last resort matching)
# =============================================================================
# Only used if SID/category/service rules don't match
# Format: module = keyword1,keyword2,keyword3
# Keywords are case-insensitive substring matches

[keywords]
# Login keywords (NO scan/nmap - those belong to portscan)
login = brute,auth,password,login,credential,invalid user,failed password,dictionary,unauthorized

# Portscan keywords
portscan = portscan,port scan,portsweep,port sweep,nmap,masscan,zmap,shodan,censys,recon

# DDoS keywords
ddos = ddos,flood,amplification,reflection,slowloris,syn flood,udp flood,icmp flood

# =============================================================================
# TIE-BREAK RULES (Explicit conflict resolution)
# =============================================================================
# When an alert matches multiple modules, these rules determine the winner
# Format: condition = winner_module
#
# Conditions:
#   - dest_port:22+keyword:brute -> login (SSH brute force, not scan)
#   - keyword:scan+keyword:brute -> login (brute force takes precedence)
#   - category:dos+rate_gate:false -> other (single event, not DDoS)

[tiebreak]
# SSH port + brute/auth indicators = login wins (not portscan)
dest_port:22+keyword:brute = login
dest_port:22+keyword:auth = login
dest_port:22+keyword:password = login
dest_port:22+keyword:login = login

# FTP port + brute indicators = login wins
dest_port:21+keyword:brute = login

# Mail ports + auth indicators = login wins
dest_port:25+keyword:auth = login
dest_port:587+keyword:auth = login

# Brute force always goes to login, even if "scan" appears
keyword:brute+keyword:scan = login

# DDoS category but no rate gate = downgrade to "other" (single probe)
category:dos+rate_gate:false = other

# =============================================================================
# RATE GATES (Volume thresholds for classification)
# =============================================================================
# Prevent single events from being classified as volume-based attacks
# Format: module = min_events_per_ip:window_seconds

[rate_gate]
# DDoS requires at least 10 events from same IP in 10 seconds
ddos = 10:10

# =============================================================================
# SCORE CAPS (Prevent score inflation across modules)
# =============================================================================
# Maximum score contribution per module per IP per window
# Format: module = max_score:window_seconds

[score_cap]
login = 500:300
portscan = 500:300
ddos = 1000:60

# =============================================================================
# DEDUPLICATION
# =============================================================================
# Event deduplication settings

[dedup]
# Enable event deduplication
enabled = true

# EventID components (hash of these fields)
# timestamp,src_ip,dest_ip,src_port,dest_port,signature_id,proto
event_id_fields = timestamp,src_ip,dest_ip,src_port,dest_port,signature_id,proto

# Time-to-live for processed event IDs (seconds)
ttl = 3600

# Maximum events to track (LRU eviction)
max_events = 100000
