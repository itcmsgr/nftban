#!/bin/bash

################################################################################
# Configuration Init of nfttables : nftban_init.sh
#
# Version: 1.1.0
# Author: ITCMS Team (Antonios Voulvoulis) + Debian/Ubuntu Support
# Description:
# This script automates the installation and configuration of Fail2Ban
# and nftables on Linux systems (RHEL 8+/Fedora/CentOS/Debian/Ubuntu).
# It ensures both packages are installed and removes iptables to avoid conflicts.
# After setup, it initializes the environment by copying all relevant files
# from the GitHub repository into the appropriate system directories.
#
################################################################################


#!/usr/sbin/nft -f

#
# Flush all existing rulesets.
#
flush ruleset

#
# Include the whitelist file first
#
include "/root/nftables/itcms-nftables-whitelist.conf"

#
# IPv4 filter table
#
table ip filter {
    #
    # Define sets
    #
    set tcp_in_ports {
        type inet_service; flags interval;
        elements = { 139, 445, 35000-35999, 20, 21, 22, 25, 53, 853, 80, 110, 143, 443, 465, 587, 993, 995, 2222, 55000, 10050, 10051, 700, 800 }
    }

    set tcp_out_ports {
        type inet_service; flags interval;
        elements = { 445, 143, 20, 21, 22, 25, 43, 53, 853, 80, 110, 113, 443, 587, 993, 995, 2222, 700, 800, 10050, 10051 }
    }

    set udp_out_ports {
        type inet_service; flags interval;
        elements = { 53 }
    }

    # Dynamic set for scanner detection
    set scan_drop {
        type ipv4_addr
        flags timeout
        timeout 5m
    }

    chain INPUT {
        type filter hook input priority filter; policy drop;

        # Allow ICMP time-exceeded (mtr)
        icmp type time-exceeded accept

        # ICMP echo-request (ping) flood protection (per source)
        ip saddr limit rate over 5/second burst 10 packets drop
        icmp type echo-request accept

        # Allow DNS queries, per-source flood protection
        udp dport 53 ip saddr limit rate over 50/second burst 100 packets drop
        udp dport 53 accept

        iif "lo" accept
        ip saddr @whitelist_v4 accept

        ct state { established, related } accept

        # Per-source connection tracking limit (max 200 active connections)
        ct count over 200 { ip saddr } log prefix "nftables: connlimit " drop

        # New TCP connections per-source rate limit
        tcp flags syn tcp dport @tcp_in_ports ct state new ip saddr limit rate over 20/second burst 40 packets drop
        tcp flags syn tcp dport @tcp_in_ports ct state new accept

        # Scanner detection – ban IP for 5m
        tcp dport @tcp_in_ports ct state new add @scan_drop { ip saddr timeout 5m }
        ip saddr @scan_drop log prefix "nftables: scanner " drop

        # Accept allowed TCP services
        tcp dport @tcp_in_ports accept

        # Default log + drop
        ct state invalid log prefix "nftables: invalid " drop
        log prefix "nftables: drop " drop
    }

    chain OUTPUT {
        type filter hook output priority filter; policy drop;

        icmp type echo-request accept

        oif "lo" accept
        ip daddr @whitelist_v4 accept
        ct state { established, related } accept
        tcp dport @tcp_out_ports accept
        udp dport @udp_out_ports accept
    }

    chain FORWARD {
        type filter hook forward priority filter; policy drop;
    }
}

#
# IPv6 filter table
#
table ip6 filter {
    set tcp6_in_ports {
        type inet_service; flags interval;
        elements = { 35000-35999, 20, 21, 22, 25, 53, 853, 80, 110, 143, 443, 465, 587, 993, 995, 2222 }
    }

    set tcp6_out_ports {
        type inet_service; flags interval;
        elements = { 143, 20, 21, 22, 25, 43, 53, 853, 80, 110, 113, 443, 587, 993, 995, 2222 }
    }

    set udp6_out_ports {
        type inet_service; flags interval;
        elements = { 53 }
    }

    # Dynamic set for scanner detection
    set scan6_drop {
        type ipv6_addr
        flags timeout
        timeout 5m
    }

    chain INPUT {
        type filter hook input priority filter; policy drop;

        # ICMP + ICMPv6 time-exceeded (mtr)
        icmp type time-exceeded accept
        icmpv6 type time-exceeded accept

        # ICMPv6 echo-request flood protection (per source)
        ip6 saddr limit rate over 5/second burst 10 packets drop
        icmpv6 type echo-request accept

        # Allow DNS queries, per-source flood protection
        udp dport 53 ip6 saddr limit rate over 50/second burst 100 packets drop
        udp dport 53 accept

        iif "lo" accept
        ip6 saddr @whitelist_v6 accept

        ct state { established, related } accept

        # Per-source connection tracking limit (max 200 active connections)
        ct count over 200 { ip6 saddr } log prefix "nftables: connlimit6 " drop

        # New TCP connections per-source rate limit
        tcp flags syn tcp dport @tcp6_in_ports ct state new ip6 saddr limit rate over 20/second burst 40 packets drop
        tcp flags syn tcp dport @tcp6_in_ports ct state new accept

        # Scanner detection
        tcp dport @tcp6_in_ports ct state new add @scan6_drop { ip6 saddr timeout 5m }
        ip6 saddr @scan6_drop log prefix "nftables: scanner6 " drop

        # Accept allowed TCP services
        tcp dport @tcp6_in_ports accept

        # Default log + drop
        ct state invalid log prefix "nftables: invalid6 " drop
        log prefix "nftables: drop6 " drop
    }

    chain OUTPUT {
        type filter hook output priority filter; policy drop;

        icmp type echo-request accept
        icmpv6 type echo-request accept

        oif "lo" accept
        ip6 daddr @whitelist_v6 accept
        ct state { established, related } accept
        tcp dport @tcp6_out_ports accept
        udp dport @udp6_out_ports accept
    }

    chain FORWARD {
        type filter hook forward priority filter; policy drop;
    }
}
