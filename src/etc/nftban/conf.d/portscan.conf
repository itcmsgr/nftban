# =============================================================================
# NFTBan v0.31.0 - Port Scan Detection Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
#
# This file contains default port scan detection settings for NFTBan v0.31.0.
# User overrides should be placed in: /etc/nftban/nftban.conf.local
#
# Owner: Antonios Voulvoulis <contact@nftban.com>
# Homepage: https://nftban.com
# Version: 0.31.0
# =============================================================================
#
# CONFIGURATION OVERRIDE HIERARCHY:
#   1. Package defaults (this file) - Lowest priority
#   2. Profile templates (/usr/share/nftban/profiles/*.conf) - Medium priority
#   3. User overrides (/etc/nftban/nftban.conf.local) - Highest priority
#
# =============================================================================

# =============================================================================
# GLOBAL PORT SCAN DETECTION SETTINGS
# =============================================================================

# Master switch for port scan detection
# Set to "true" to enable all port scan detection, "false" to disable
# Default: true
PORTSCAN_ENABLED="true"

# Log all port scan detections
# Set to "true" to enable logging, "false" to disable
# Default: true
PORTSCAN_LOGGING="true"

# Send email alerts for detected port scans
# Requires mail system to be configured (see: nftban mail configure)
# Set to "true" to enable email alerts, "false" to disable
# Default: true
PORTSCAN_EMAIL_ALERTS="true"

# =============================================================================
# DETECTION PARAMETERS
# =============================================================================

# Detection interval in seconds
# How often to check logs for port scan activity
# Recommended: 60-300 seconds
# Set to "0" to disable periodic checking (manual only)
# Default: 300
PORTSCAN_CHECK_INTERVAL="300"

# Time window for counting port access attempts (seconds)
# Port scans are detected when an IP accesses multiple distinct ports
# within this time window
# Recommended:
#   - 60-180 seconds for aggressive detection (high security)
#   - 300-600 seconds for balanced detection (normal)
#   - 600-900 seconds for relaxed detection (low false positives)
# Default: 300 (5 minutes)
PORTSCAN_TIME_WINDOW="300"

# Threshold: Number of different ports to trigger detection
# An IP must access this many DIFFERENT ports within the time window
# to be flagged as a port scanner
# Recommended:
#   - 5-8 for high security (aggressive)
#   - 10-15 for normal security (balanced)
#   - 20-30 for low security (relaxed)
# Default: 10
PORTSCAN_THRESHOLD="10"

# Minimum diversity: Require ports to be spread across ranges
# This helps avoid false positives from legitimate services that use
# multiple sequential ports (e.g., FTP passive mode, web applications)
# Set to "true" to require at least 2 different port ranges to be hit
# Set to "false" to count all ports regardless of range
# Default: true (reduces false positives)
PORTSCAN_DIVERSITY="true"

# =============================================================================
# AUTO-BAN SETTINGS
# =============================================================================

# Auto-ban detected scanners
# Set to "true" to automatically ban IPs that trigger detection
# Set to "false" to only log/alert without banning (monitoring mode)
# Default: true
PORTSCAN_AUTO_BAN="true"

# Ban type when port scan detected
# Options:
#   "temporary"  - Temporary ban with timeout
#   "permanent"  - Permanent ban (stays until manually removed)
# Default: temporary
PORTSCAN_BAN_TYPE="temporary"

# Ban duration in seconds (only applies if PORTSCAN_BAN_TYPE="temporary")
# Recommended:
#   - 3600 (1 hour) for normal security
#   - 7200 (2 hours) for high security
#   - 86400 (24 hours) for very high security
# Default: 3600 (1 hour)
PORTSCAN_BAN_TIME="3600"

# =============================================================================
# PORT MONITORING SCOPE
# =============================================================================

# Which ports to monitor for scan detection
# Options:
#   "all"     - Monitor all ports (0-65535) - AGGRESSIVE, may cause false positives
#   "closed"  - Only monitor ports NOT in your allow list - RECOMMENDED
#   "custom"  - Use PORTSCAN_CUSTOM_PORTS list below
#
# Recommended: "closed" to detect scans on ports you don't use
# Default: closed
PORTSCAN_MONITOR_PORTS="closed"

# Custom port list (only used if PORTSCAN_MONITOR_PORTS="custom")
# Format: "port1,port2,port3-port4,..."
# Example: "1-1024,3306,5432,8080-8090"
# Default: empty
PORTSCAN_CUSTOM_PORTS=""

# Monitor ICMP packets as part of scan detection
# Some scanners use ICMP (ping) before port scanning
# Set to "true" to include ICMP in detection, "false" to ignore
# Default: true
PORTSCAN_MONITOR_ICMP="true"

# Monitor invalid packets (malformed, bad checksums, etc.)
# Some scan tools send invalid packets to probe firewall behavior
# Set to "true" to include invalid packets in detection, "false" to ignore
# Default: true
PORTSCAN_MONITOR_INVALID="true"

# =============================================================================
# WHITELIST & EXCEPTIONS
# =============================================================================

# Whitelist file for IPs that should never be flagged for port scanning
# This is separate from the main nftban whitelist
# Format: One IP or CIDR per line, optional comment after #
# File location (will be created if doesn't exist)
# Default: /etc/nftban/portscan_whitelist.conf
PORTSCAN_WHITELIST_FILE="/etc/nftban/portscan_whitelist.conf"

# Automatically whitelist known monitoring/security tools
# Many legitimate security scanners and monitoring tools perform port scans
# Set to "true" to auto-whitelist known good scanners, "false" to detect all
# Default: false (detect all scanners)
PORTSCAN_WHITELIST_KNOWN_SCANNERS="false"

# Known scanner IP ranges to whitelist (if PORTSCAN_WHITELIST_KNOWN_SCANNERS=true)
# Common examples:
#   - Shodan.io: 104.131.0.69, 198.20.69.74, 66.240.219.146, others
#   - Censys.io: 192.35.168.0/23, 162.142.125.0/24
#   - Internet-wide scanners (research institutions)
# Add your monitoring tools here (comma-separated)
# Default: empty
PORTSCAN_KNOWN_SCANNERS=""

# =============================================================================
# LOGGING & DATA STORAGE
# =============================================================================

# Log file location
# Default: /var/log/nftban/portscan.log
PORTSCAN_LOG_FILE="/var/log/nftban/portscan.log"

# Database file for tracking port access patterns
# Default: /var/lib/nftban/portscan/tracker.db
PORTSCAN_DB_FILE="/var/lib/nftban/portscan/tracker.db"

# Maximum log file size (in MB) before rotation
# Set to "0" to disable automatic rotation
# Default: 10 MB
PORTSCAN_MAX_LOG_SIZE="10"

# How long to keep detection records in database (seconds)
# Old records are automatically purged
# Recommended: 86400 (1 day) to 604800 (1 week)
# Default: 86400 (1 day)
PORTSCAN_DB_RETENTION="86400"

# =============================================================================
# ALERTING
# =============================================================================

# Alert rate limiting
# Prevent email spam by limiting alerts per IP
# Maximum alerts per IP per time period
# Default: 3 alerts per hour
PORTSCAN_ALERT_LIMIT="3"
PORTSCAN_ALERT_PERIOD="3600"

# Include detailed port list in alert emails
# Set to "true" to include all accessed ports, "false" for summary only
# Default: true
PORTSCAN_ALERT_INCLUDE_PORTS="true"

# =============================================================================
# ADVANCED DETECTION OPTIONS
# =============================================================================

# SYN scan detection
# Many port scanners use SYN packets without completing handshake
# Set to "true" to weight SYN packets higher in detection
# Default: true
PORTSCAN_DETECT_SYN_SCAN="true"

# UDP scan detection
# UDP scans are common but harder to detect
# Set to "true" to monitor UDP packets, "false" for TCP only
# Default: true
PORTSCAN_DETECT_UDP_SCAN="true"

# Stealth scan detection (FIN, NULL, XMAS scans)
# These scans use unusual flag combinations to evade detection
# Requires deeper packet inspection and logging
# Set to "true" to enable, "false" to disable
# Default: false (disabled - may cause false positives)
PORTSCAN_DETECT_STEALTH="false"

# Aggressive detection mode
# Lower thresholds and faster detection, but may cause false positives
# When enabled:
#   - Reduces PORTSCAN_THRESHOLD by 50%
#   - Reduces PORTSCAN_TIME_WINDOW by 50%
#   - Enables all detection types
# Set to "true" for high-security environments, "false" for normal operation
# Default: false
PORTSCAN_AGGRESSIVE_MODE="false"

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Maximum IPs to track simultaneously
# Limits memory usage for port scan tracking
# Recommended: 1000-10000 depending on server resources
# Default: 5000
PORTSCAN_MAX_TRACKED_IPS="5000"

# Cleanup interval for expired tracking data (seconds)
# How often to purge old entries from memory
# Recommended: 300-900 seconds
# Default: 600 (10 minutes)
PORTSCAN_CLEANUP_INTERVAL="600"

# Use nftables logging for detection
# If enabled, relies on nftables log rules for data collection (faster)
# If disabled, parses system logs (slower but works without nftables logs)
# Set to "true" to use nftables logging, "false" for system log parsing
# Default: true
PORTSCAN_USE_NFTABLES_LOG="true"

# nftables log prefix for port scan detection
# Must match the log prefix in your nftables rules
# Default: "nftban: portscan: "
PORTSCAN_NFT_LOG_PREFIX="nftban: portscan: "

# =============================================================================
# INTEGRATION
# =============================================================================

# Automatically add detected scanners to permanent blacklist after N detections
# Set to "0" to disable auto-blacklisting
# Set to N to blacklist after N scan attempts
# Default: 3 (blacklist after 3 scan attempts)
PORTSCAN_AUTO_BLACKLIST_THRESHOLD="3"

# Notify other nftban instances in cluster (if clustering enabled)
# Set to "true" to share port scan data across cluster, "false" for local only
# Default: false
PORTSCAN_CLUSTER_NOTIFY="false"

# Integration with Fail2Ban
# Create Fail2Ban rules for detected port scanners
# Set to "true" to enable Fail2Ban integration, "false" to disable
# Default: false
PORTSCAN_FAIL2BAN_INTEGRATION="false"

# =============================================================================
# REPORTING
# =============================================================================

# Generate daily port scan reports
# Set to "true" to enable daily reports, "false" to disable
# Default: false
PORTSCAN_DAILY_REPORT="false"

# Report email recipient (uses NFTBAN_EMAIL_RECIPIENT if empty)
# Default: empty (uses global email recipient)
PORTSCAN_REPORT_EMAIL=""

# Include top scanner IPs in reports
# Default: 20
PORTSCAN_REPORT_TOP_COUNT="20"

# Include geographical data in reports (requires GeoIP module)
# Set to "true" to include country/city data, "false" for IP only
# Default: true
PORTSCAN_REPORT_INCLUDE_GEO="true"

# =============================================================================
# TESTING & DEBUGGING
# =============================================================================

# Dry-run mode: Detect but don't ban
# Set to "true" for testing without actual bans, "false" for production
# Default: false
PORTSCAN_DRY_RUN="false"

# Verbose logging for debugging
# Set to "true" for detailed debug logs, "false" for normal operation
# Default: false
PORTSCAN_DEBUG="false"

# Log all port access attempts (very verbose!)
# Only enable for troubleshooting, creates large log files
# Set to "true" to log every port access, "false" for detections only
# Default: false
PORTSCAN_LOG_ALL_ATTEMPTS="false"

# =============================================================================
# FHS COMPLIANT PATHS
# =============================================================================

# Port scan module data directory
# Used for storing detection database and tracking data
# Default: /var/lib/nftban/portscan
PORTSCAN_DATA_DIR="/var/lib/nftban/portscan"

# Port scan module cache directory
# Used for temporary detection data
# Default: /var/cache/nftban/portscan
PORTSCAN_CACHE_DIR="/var/cache/nftban/portscan"

# Port scan statistics file
# Real-time port scan statistics (JSON format)
# Default: /var/lib/nftban/portscan/stats.json
PORTSCAN_STATS_FILE="/var/lib/nftban/portscan/stats.json"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# For user overrides, create: /etc/nftban/nftban.conf.local
# Example:
#   PORTSCAN_THRESHOLD="5"              # Lower threshold (more aggressive)
#   PORTSCAN_BAN_TYPE="permanent"       # Permanent bans for scanners
#   PORTSCAN_AUTO_BAN="false"           # Monitoring mode (no bans)
#
# =============================================================================
