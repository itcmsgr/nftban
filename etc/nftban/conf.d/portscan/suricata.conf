# -----------------------------------------------------------------------------
# SURICATA MODE SETTINGS
# -----------------------------------------------------------------------------
# These settings control Suricata-integrated portscan detection.
# Suricata has sophisticated portscan detection built-in (sfportscan).

# EVE JSON Log Path (Suricata alert output)
PORTSCAN_SURICATA_EVE_FILE="/var/log/suricata/eve.json"

# Alternative: Unix socket for real-time alerts (faster, optional)
PORTSCAN_SURICATA_EVE_SOCKET=""

# -----------------------------------------------------------------------------
# SURICATA PORTSCAN DETECTION TYPES
# -----------------------------------------------------------------------------
# Suricata sfportscan preprocessor detects these scan types

# Enable/disable specific detection types
PORTSCAN_SURICATA_DETECT_PORTSCAN="true"
PORTSCAN_SURICATA_DETECT_PORTSWEEP="true"
PORTSCAN_SURICATA_DETECT_DECOY_PORTSCAN="true"
PORTSCAN_SURICATA_DETECT_DISTRIBUTED_PORTSCAN="true"

# Scan sensitivity (1=low, 2=medium, 3=high)
PORTSCAN_SURICATA_SENSITIVITY="2"

# -----------------------------------------------------------------------------
# ALERT FILTERING
# -----------------------------------------------------------------------------
# Filter Suricata alerts for portscan-related events

# Signature patterns to match (regex, pipe-separated)
PORTSCAN_SURICATA_SIG_PATTERNS="[Pp]ort[Ss]can|[Pp]ort [Ss]weep|SCAN|Nmap|masscan"

# Event types to monitor (from EVE JSON)
PORTSCAN_SURICATA_EVENT_TYPES="alert,anomaly"

# Alert categories to monitor
PORTSCAN_SURICATA_CATEGORIES="attempted-recon,successful-recon,network-scan"

# Signature IDs to explicitly monitor (comma-separated)
# Example Suricata portscan detection SIDs
PORTSCAN_SURICATA_SIG_IDS="2010935,2010936,2010937,2010938"

# -----------------------------------------------------------------------------
# SCORING THRESHOLDS
# -----------------------------------------------------------------------------
# Score-based decision making (0.0 - 1.0 scale)

# Base score per alert severity (Suricata severity 1-4)
PORTSCAN_SURICATA_SCORE_SEVERITY_1="0.10"   # Low
PORTSCAN_SURICATA_SCORE_SEVERITY_2="0.20"   # Medium
PORTSCAN_SURICATA_SCORE_SEVERITY_3="0.35"   # High
PORTSCAN_SURICATA_SCORE_SEVERITY_4="0.50"   # Critical

# Bonus score for specific scan types
PORTSCAN_SURICATA_SCORE_PORTSCAN="0.15"
PORTSCAN_SURICATA_SCORE_PORTSWEEP="0.20"
PORTSCAN_SURICATA_SCORE_DECOY="0.25"
PORTSCAN_SURICATA_SCORE_DISTRIBUTED="0.30"

# Repetition multiplier (alerts from same IP in window)
PORTSCAN_SURICATA_SCORE_REPEAT_5="0.10"     # 5+ alerts
PORTSCAN_SURICATA_SCORE_REPEAT_10="0.20"    # 10+ alerts
PORTSCAN_SURICATA_SCORE_REPEAT_20="0.30"    # 20+ alerts

# Feed reputation bonus (if IP is in threat feeds)
PORTSCAN_SURICATA_SCORE_BAD_REPUTATION="0.15"

# GeoIP risk bonus (high-risk countries)
PORTSCAN_SURICATA_SCORE_HIGH_RISK_GEO="0.10"

# Known scanner tools detected (Nmap, Masscan, etc.)
PORTSCAN_SURICATA_SCORE_KNOWN_TOOL="0.20"

# -----------------------------------------------------------------------------
# ACTION THRESHOLDS
# -----------------------------------------------------------------------------
# What to do based on final score

# Observe only (log, no block)
PORTSCAN_SURICATA_THRESHOLD_OBSERVE="0.25"

# Short block (temporary)
PORTSCAN_SURICATA_THRESHOLD_BLOCK_SHORT="0.45"

# Long block (extended)
PORTSCAN_SURICATA_THRESHOLD_BLOCK_LONG="0.65"

# Permanent block (until manual review)
PORTSCAN_SURICATA_THRESHOLD_BLOCK_PERMANENT="0.85"

# -----------------------------------------------------------------------------
# BLOCKING POLICY
# -----------------------------------------------------------------------------
# Ban durations for each threshold level

PORTSCAN_SURICATA_BAN_DURATION_SHORT="900"        # 15 minutes
PORTSCAN_SURICATA_BAN_DURATION_LONG="3600"        # 1 hour
PORTSCAN_SURICATA_BAN_DURATION_PERMANENT="86400"  # 24 hours

# Score decay time (seconds) - how long before score resets
PORTSCAN_SURICATA_SCORE_DECAY="1800"

# Time window for counting repeated alerts (seconds)
PORTSCAN_SURICATA_ALERT_WINDOW="300"

# -----------------------------------------------------------------------------
# SCAN TOOL SIGNATURES
# -----------------------------------------------------------------------------
# Detect known scanning tools

# Nmap detection patterns
PORTSCAN_SURICATA_NMAP_PATTERNS="Nmap|nmap|NMAP|-sS|-sT|-sU|-sV"

# Masscan detection patterns
PORTSCAN_SURICATA_MASSCAN_PATTERNS="masscan|Masscan|MASSCAN"

# ZMap detection patterns
PORTSCAN_SURICATA_ZMAP_PATTERNS="zmap|ZMap|ZMAP"

# Shodan/Censys patterns
PORTSCAN_SURICATA_INTERNET_SCANNER_PATTERNS="Shodan|Censys|internet-census"

# -----------------------------------------------------------------------------
# INTEGRATION WITH OTHER MODULES
# -----------------------------------------------------------------------------
# Enable correlation with other nftban modules

# Use threat feeds for reputation scoring
PORTSCAN_SURICATA_USE_FEEDS="true"

# Use GeoIP for risk scoring
PORTSCAN_SURICATA_USE_GEOIP="true"

# Cross-reference with login module (was IP trying auth before scan?)
PORTSCAN_SURICATA_USE_LOGIN_CORRELATION="true"

# Use classic mode for logging (hybrid logging)
PORTSCAN_SURICATA_USE_CLASSIC_LOGGING="false"

# -----------------------------------------------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------------------------------------------
# EVE JSON parsing settings

# Batch size for processing alerts
PORTSCAN_SURICATA_BATCH_SIZE="100"

# Poll interval for EVE file (milliseconds)
PORTSCAN_SURICATA_POLL_INTERVAL_MS="500"

# Maximum alerts to process per second (rate limiting)
PORTSCAN_SURICATA_MAX_ALERTS_PER_SEC="500"

# Maximum tracked IPs
PORTSCAN_SURICATA_MAX_TRACKED_IPS="10000"

# State file for persistent tracking
PORTSCAN_SURICATA_STATE_FILE="/var/lib/nftban/portscan-suricata-state.db"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log file for suricata mode events

PORTSCAN_SURICATA_LOG_FILE="/var/log/nftban/portscan-suricata.log"

# Log level: DEBUG, INFO, WARN, ERROR
PORTSCAN_SURICATA_LOG_LEVEL="INFO"

# Log all alerts (verbose)
PORTSCAN_SURICATA_LOG_ALL_ALERTS="false"

# Log scoring decisions
PORTSCAN_SURICATA_LOG_SCORES="true"

# Log detected scanner tools
PORTSCAN_SURICATA_LOG_TOOLS="true"

# =============================================================================
# END OF SURICATA MODE CONFIGURATION
# =============================================================================
