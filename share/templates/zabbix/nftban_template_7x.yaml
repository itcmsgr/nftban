      # =======================================================================
      # DISCOVERY RULES (LLD)
      # =======================================================================
      discovery_rules:
        # --- Module Discovery ---
        - uuid: 2a8eee4e-3ac0-4d6f-8502-4d9fdde9c73d
          name: 'NFTBan: Module discovery'
          type: TRAP
          key: nftban.discovery.modules
          description: 'Discover all NFTBan modules'
          item_prototypes:
            - uuid: ed4c333c-ff2c-4186-8044-e28751c85ee1
              name: 'NFTBan: Module {#MODULE} status'
              type: TRAP
              key: 'nftban.module.status[{#MODULE}]'
              value_type: FLOAT
              description: 'Module {#MODULE} status: 1=ok, 0=error, -1=disabled'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
            - uuid: 59f4ef98-5251-429c-b8ce-a82b45ac6267
              name: 'NFTBan: Module {#MODULE} bans'
              type: TRAP
              key: 'nftban.module.bans[{#MODULE}]'
              value_type: UNSIGNED
              description: 'Bans from module {#MODULE}'
              tags:
                - tag: component
                  value: modules
                - tag: module
                  value: '{#MODULE}'
          trigger_prototypes:
            - uuid: 663c724e-76d3-4e11-9934-8e931ff29954
              expression: 'last(/NFTBan/nftban.module.status[{#MODULE}])=0'
              name: 'NFTBan module {#MODULE} failed'
              priority: HIGH
              description: 'Module {#MODULE} is in error state.'

        # --- Feed Discovery ---
        - uuid: e26ec4b0-85bc-4a97-a21f-95c1753dd764
          name: 'NFTBan: Feed discovery'
          type: TRAP
          key: nftban.discovery.feeds
          description: 'Discover configured threat feeds'
          item_prototypes:
            - uuid: e92145b4-f433-44b5-81fa-f8a2bffaed0e
              name: 'NFTBan: Feed {#FEED} status'
              type: TRAP
              key: 'nftban.feed.status[{#FEED}]'
              value_type: UNSIGNED
              description: 'Feed {#FEED} status: 1=ok, 0=error'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: e5515348-942e-4a6d-b28d-625dd4e8c5e5
              name: 'NFTBan: Feed {#FEED} IPs'
              type: TRAP
              key: 'nftban.feed.ips[{#FEED}]'
              value_type: UNSIGNED
              description: 'IPs loaded from {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
            - uuid: 2c41448a-174f-440b-8da7-97c38bb7df3b
              name: 'NFTBan: Feed {#FEED} last update'
              type: TRAP
              key: 'nftban.feed.last_update[{#FEED}]'
              value_type: UNSIGNED
              units: unixtime
              description: 'Last update timestamp for {#FEED}'
              tags:
                - tag: component
                  value: feeds
                - tag: feed
                  value: '{#FEED}'
          trigger_prototypes:
            - uuid: 77cea394-b8f7-4345-95b1-505178c0a769
              expression: 'last(/NFTBan/nftban.feed.status[{#FEED}])=0'
              name: 'NFTBan feed {#FEED} failed'
              priority: WARNING
              description: 'Threat feed {#FEED} failed to load.'

        # --- Country Discovery ---
        - uuid: b47f0c93-584c-445c-b2d7-2ca1fcb665c8
          name: 'NFTBan: Country discovery'
          type: TRAP
          key: nftban.discovery.countries
          description: 'Discover countries with ban activity'
          item_prototypes:
            - uuid: 5fc198b0-7e8c-4a5f-a57f-18d7779f8f75
              name: 'NFTBan: Country {#COUNTRY} bans'
              type: TRAP
              key: 'nftban.country.bans[{#COUNTRY}]'
              value_type: UNSIGNED
              description: 'Active bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'
            - uuid: 12136025-4a5c-4aa0-b205-8299fd93c4cb
              name: 'NFTBan: Country {#COUNTRY} bans (24h)'
              type: TRAP
              key: 'nftban.country.bans_24h[{#COUNTRY}]'
              value_type: UNSIGNED
              description: '24h bans from {#COUNTRY}'
              tags:
                - tag: component
                  value: geoip
                - tag: country
                  value: '{#COUNTRY}'

      # =======================================================================
      # DASHBOARDS (Zabbix 7.0 format) - Professional NFTBan Monitoring
      # =======================================================================
      dashboards:
        - uuid: fd1b7e0f-6095-40c9-8c7c-562df1f24980
          name: 'NFTBan Overview'
          auto_start: 'YES'
          pages:
            # ===== PAGE 1: STATUS OVERVIEW =====
            - name: 'Status'
              widgets:
                # Row 1: Key Status Indicators
                - type: item_value
                  name: 'Daemon Status'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.status
                        host: NFTBan
                - type: item_value
                  name: 'Mode'
                  x: '6'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.mode
                        host: NFTBan
                - type: item_value
                  name: 'Version'
                  x: '12'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.version
                        host: NFTBan
                - type: item_value
                  name: 'Uptime'
                  x: '18'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.uptime
                        host: NFTBan
                # Row 2: Ban Counts
                - type: item_value
                  name: 'Active Bans'
                  y: '3'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.active.count
                        host: NFTBan
                - type: item_value
                  name: 'Permanent Bans'
                  x: '6'
                  y: '3'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.permanent.count
                        host: NFTBan
                - type: item_value
                  name: 'Total Bans'
                  x: '12'
                  y: '3'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.bans.total
                        host: NFTBan
                - type: item_value
                  name: 'Ban Rate/min'
                  x: '18'
                  y: '3'
                  width: '6'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.bans.rate
                        host: NFTBan
                # Row 3: Main Graph - Ban Activity
                - type: svggraph
                  name: 'Ban Activity (24h / 1h / Active)'
                  y: '6'
                  width: '48'
                  height: '6'
                  fields:
                    - type: ITEM
                      name: ds.0.itemid.0
                      value:
                        host: NFTBan
                        key: nftban.bans.24h
                    - type: STRING
                      name: ds.0.color
                      value: 1A7C11
                    - type: ITEM
                      name: ds.1.itemid.0
                      value:
                        host: NFTBan
                        key: nftban.bans.1h
                    - type: STRING
                      name: ds.1.color
                      value: 2774A4
                    - type: ITEM
                      name: ds.2.itemid.0
                      value:
                        host: NFTBan
                        key: nftban.active.count
                    - type: STRING
                      name: ds.2.color
                      value: F63100
                # Row 4: Problems
                - type: problems
                  name: 'Active Problems'
                  y: '12'
                  width: '48'
                  height: '4'
                  fields:
                    - type: INTEGER
                      name: show_suppressed
                      value: '0'

            # ===== PAGE 2: BANS & SECURITY =====
            - name: 'Bans'
              widgets:
                # Row 1: Ban Statistics
                - type: item_value
                  name: 'Active Bans'
                  width: '8'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.active.count
                        host: NFTBan
                - type: item_value
                  name: 'Bans (1h)'
                  x: '8'
                  width: '8'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.bans.1h
                        host: NFTBan
                - type: item_value
                  name: 'Bans (24h)'
                  x: '16'
                  width: '8'
                  height: '3'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        key: nftban.bans.24h
                        host: NFTBan
