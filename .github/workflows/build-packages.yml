# =============================================================================
# NFTBan - Build Packages
# =============================================================================
# SPDX-License-Identifier: MPL-2.0

name: Build NFTBan Packages

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # ==========================================================================
  # VALIDATE BUNDLED DEPENDENCIES (yq checksum consistency)
  # ==========================================================================
  validate-dependencies:
    name: Validate bundled dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore pinned yq (cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: offline/yq_linux_amd64
          key: yq-pinned-${{ hashFiles('packaging/build_nftban.sh') }}

      - name: Validate yq checksums are consistent
        run: |
          echo "Checking yq SHA256 checksums across build files..."

          # Extract all YQ_SHA256 values
          CHECKSUMS=$(grep -roh 'YQ_SHA256="[a-f0-9]\{64\}"' packaging/ | sort -u)
          COUNT=$(echo "$CHECKSUMS" | wc -l)

          echo "Found $COUNT unique YQ_SHA256 definitions:"
          echo "$CHECKSUMS"

          if [[ $COUNT -ne 1 ]]; then
            echo "ERROR: Multiple different yq checksums found!"
            echo "All checksums must match. Found:"
            grep -rn 'YQ_SHA256=' packaging/
            exit 1
          fi

          # Extract the checksum value
          YQ_SHA256=$(echo "$CHECKSUMS" | head -1 | cut -d'"' -f2)
          echo "Verifying checksum: $YQ_SHA256"

          # Download yq and verify
          YQ_VERSION=$(grep -oh 'YQ_VERSION="[0-9.]*"' packaging/build_nftban.sh | head -1 | cut -d'"' -f2)
          echo "yq version: $YQ_VERSION"

          # v1.157 PR-A: route the fetch through the shared fetch_verified
          # helper (retry + fail-fast + bounded timeouts + atomic write +
          # checksum verify) so a transient blip no longer turns into a hard
          # SHA-mismatch failure on a partial body. The helper verifies the
          # checksum internally; on failure we re-download once to compute the
          # actual SHA for the "bundled checksum is outdated" maintainer hint.
          # shellcheck source=packaging/lib/fetch_verified.sh
          . packaging/lib/fetch_verified.sh
          YQ_URL="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"

          # v1.229 CI hardening: this required job downloaded yq from a live GitHub
          # release, so an upstream 503 failed the merge gate. Two DIFFERENT things
          # were conflated here:
          #   PIN CONSISTENCY  — all YQ_SHA256 in packaging/ agree. Static, offline,
          #                      always blocking. Verified above.
          #   UPSTREAM LIVENESS — the pin still matches the published artifact.
          #                      Needs the network and cannot be made deterministic.
          # Trust is NOT enforced here: provision_yq verifies the sha256 before the
          # binary is ever used, wherever it came from. This step is drift
          # DETECTION, so a network outage must be reported as unverifiable rather
          # than as a pin failure — and must not fail the merge gate.
          #   CANNOT_VERIFY != VERIFIED_BAD
          if [ -f offline/yq_linux_amd64 ] &&
             echo "${YQ_SHA256}  offline/yq_linux_amd64" | sha256sum -c - >/dev/null 2>&1; then
            echo "✅ yq pin matches the cached artifact (no network needed)"
          elif fetch_verified "$YQ_URL" "$YQ_SHA256" /tmp/yq_linux_amd64; then
            echo "✅ yq checksum validated successfully"
            mkdir -p offline && install -m 0755 /tmp/yq_linux_amd64 offline/yq_linux_amd64 || true
          else
            # Attribute the failure instead of exiting 1 for every cause. The old
            # branch failed even when the re-download reported Expected == Actual,
            # i.e. it printed evidence that the pin was CORRECT and failed anyway.
            echo "yq fetch/verify did not succeed — determining why..."
            if curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
                    --connect-timeout 10 --max-time 120 -sS \
                    -o /tmp/yq_linux_amd64.actual "$YQ_URL"; then
              ACTUAL_SHA=$(sha256sum /tmp/yq_linux_amd64.actual | cut -d' ' -f1)
              echo "Expected: $YQ_SHA256"
              echo "Actual:   $ACTUAL_SHA"
              if [[ "$YQ_SHA256" != "$ACTUAL_SHA" ]]; then
                echo "::error::PIN_OUTDATED — the published yq artifact no longer matches the bundled checksum. Update with: YQ_SHA256=\"$ACTUAL_SHA\""
                exit 1
              fi
              echo "::warning::TRANSIENT_FETCH_FAILURE — the pin is CORRECT (expected == actual); the first fetch failed for a transient reason."
              mkdir -p offline && install -m 0755 /tmp/yq_linux_amd64.actual offline/yq_linux_amd64 || true
              exit 0
            fi
            # No authoritative source reachable. Pin CONSISTENCY was already proven
            # offline above, and provision_yq re-verifies the sha before use, so an
            # upstream outage must not fail the merge gate as though the pin were bad.
            echo "::warning::UPSTREAM_VERIFICATION_UNAVAILABLE — could not reach the yq release to re-verify the pin. Pin consistency across packaging/ was verified offline; the build-time checksum gate is unaffected. NOT treated as a pin failure."
            exit 0
          fi

  # ==========================================================================
  # BUILD GO BINARIES
  # ==========================================================================
  build-binaries:
    needs: validate-dependencies
    name: Build Go binaries
    runs-on: ubuntu-latest
    # v1.157 PR-C: setup-go installs the exact go.mod patch (1.25.12); this job
    # only runs ./build.sh (go build of our module), so GOTOOLCHAIN=local avoids
    # a redundant toolchain re-download. Compiler version unchanged (1.25.12),
    # so binary output stays byte-reproducible.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.12`).
          go-version: '1.25.12'

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la bin/

      - name: Validate binaries are real ELF files
        run: |
          echo "Validating Go binaries..."
          for binary in bin/nftban-core bin/nftband bin/nftban-installer; do
            if [[ -f "$binary" ]]; then
              file_type=$(file -b "$binary")
              if [[ "$file_type" != *"ELF"* ]]; then
                echo "ERROR: $binary is NOT an ELF binary!"
                echo "Got: $file_type"
                exit 1
              fi
              size=$(stat -c%s "$binary")
              if [[ $size -lt 100000 ]]; then
                echo "ERROR: $binary is too small ($size bytes) - likely corrupted"
                exit 1
              fi
              echo "✓ $binary: valid ELF ($size bytes)"
            else
              echo "ERROR: $binary not found!"
              exit 1
            fi
          done
          echo "All binaries validated successfully"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-binaries
          path: bin/
          retention-days: 1

  # ==========================================================================
  # PROVENANCE NEGATIVE POLICY — prove a stale bin/* cannot survive a source
  # build, and that verified-prebuilt mode rejects a tampered manifest.
  # ==========================================================================
  provenance-negative:
    name: Provenance negative policy
    needs: validate-dependencies
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5.6.0
        with:
          go-version: '1.25.12'
      - name: Stale bin is OVERWRITTEN by a source build (never packaged)
        run: |
          set -euo pipefail
          mkdir -p bin
          printf 'STALE-NOT-AN-ELF' > bin/nftband
          printf 'STALE-NOT-AN-ELF' > bin/nftban-core
          chmod +x build.sh && ./build.sh >/dev/null
          # shellcheck source=packaging/lib/provenance.sh
          source packaging/lib/provenance.sh
          prov_resolve_source_identity "$PWD"
          ec="$(prov_binary_embedded_commit bin/nftband)"
          [ "$ec" = "$PROV_SOURCE_COMMIT" ] || { echo "::error::stale bin/nftband not overwritten with current source"; exit 1; }
          echo "OK: source build overwrote stale artifacts (embedded $ec)"
      - name: Verified-prebuilt REJECTS a tampered manifest
        run: |
          set -euo pipefail
          source packaging/lib/provenance.sh
          # corrupt one recorded sha in the freshly-written manifest
          jq '.binaries[0].sha256 = "'"$(printf 0%.0s {1..64})"'"' bin/build-manifest.json > bin/tampered.json
          if prov_verify_prebuilt "$PWD" bin bin/tampered.json; then
            echo "::error::tampered manifest was NOT rejected"; exit 1
          fi
          echo "OK: tampered manifest rejected"
      - name: Hermetic provenance guard
        run: ./scripts/ci/check-build-provenance.sh

  # ==========================================================================
  # BUILD RPM PACKAGES
  # ==========================================================================
  build-rpm:
    name: Build RPM (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EL family (covers Rocky, Alma, RHEL, CentOS Stream)
          # Tier 0: el9 (primary/required)
          - distro: el9
            container: rockylinux:9
            name_suffix: el9
          # Tier 1: el10 (future/planned)
          - distro: el10
            container: almalinux:10
            name_suffix: el10
          # Note: Fedora removed - rolling release, not LTS

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      # v1.229 UNINSTALL-PR3 CI hardening: keep the pinned yq out of the critical
      # path of every build. Keyed on the VERSION+SHA pinned in
      # packaging/build_nftban.sh, so a pin change invalidates the cache
      # automatically and a stale binary can never be served for a new pin.
      # provision_yq re-verifies the sha256 regardless of where the file came
      # from — the cache is a latency optimisation, never a trust boundary.
      - name: Restore pinned yq (cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: offline/yq_linux_amd64
          # Keyed on the FILE that defines the version+sha pin, not on the raw
          # digest: a literal 64-hex string in a workflow trips secret scanning
          # as a generic API key. Editing the pin changes the file, so the cache
          # still invalidates automatically and a stale binary is never reused
          # for a new pin. provision_yq re-verifies the sha256 regardless.
          key: yq-pinned-${{ hashFiles('packaging/build_nftban.sh') }}

      - name: Build RPM in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          # v1.157 PR-B: retry the base-image pull (transient registry-1.docker.io
          # timeouts caused exit-125 hard failures). 3 attempts, backoff 3/9/27s.
          ok=0
          for delay in 3 9 27; do
            if docker pull "${{ matrix.container }}"; then ok=1; break; fi
            echo "docker pull ${{ matrix.container }} failed — retrying in ${delay}s..."
            sleep "$delay"
          done
          [ "$ok" -eq 1 ] || { echo "docker pull ${{ matrix.container }} failed after 3 attempts"; exit 125; }
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # MFST-HOTFIX-B2: strict mode — surface rpmbuild failures to CI
            # instead of swallowing them. Mirror release.yml's pattern.
            set -euo pipefail

            # Install build dependencies (curl required for yq download)
            # Note: --allowerasing handles curl-minimal vs curl conflict on Rocky/Alma
            # v1.147: selinux-policy-devel needed to compile the nftban SELinux .pp
            # (spec BuildRequires); without it rpmbuild aborts on Failed build dependencies.
            dnf -y install --allowerasing rpm-build rpmdevtools tar gzip systemd-rpm-macros make curl selinux-policy-devel jq file

            # Build RPM
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh rpm --use-prebuilt --prebuilt-manifest /workspace/bin/build-manifest.json || { echo '❌ RPM build failed!'; exit 1; }

            # Verify at least one RPM was created (catches silent rpmbuild failures)
            if ! ls /workspace/build/packages/RPMS/*/*.rpm 2>/dev/null; then
              echo '❌ No RPM files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename RPM with distro suffix
        run: |
          mkdir -p dist/packages
          for rpm in build/packages/RPMS/*/*.rpm; do
            if [[ -f "$rpm" ]]; then
              # Rename: nftban-core-1.0.0-1.el10.x86_64.rpm -> nftban-el10-x86_64.rpm
              newname="nftban-${{ matrix.name_suffix }}-x86_64.rpm"
              cp "$rpm" "dist/packages/$newname"
              echo "Renamed: $(basename "$rpm") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate RPM package contains valid binaries
        run: |
          echo "Validating RPM package binaries..."
          for rpm in dist/packages/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Checking: $rpm"
              mkdir -p /tmp/rpm-check
              cd /tmp/rpm-check
              rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idmv 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-installer; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in RPM is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/rpm-check
            fi
          done
          echo "All RPM packages validated successfully"

      - name: Upload RPM packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/packages/*.rpm
          retention-days: 30

      # PKG-EFFECTIVE-PARITY (Slot 5 / row 14): extract L3 package metadata
      # from the built RPM artifact. Output is consumed by the
      # validate-package-effective-parity aggregation job for cross-packager diff.
      - name: Extract RPM package metadata (PKG-EFFECTIVE-PARITY L3)
        run: |
          mkdir -p dist/parity
          for rpm in dist/packages/*.rpm; do
            [[ -f "$rpm" ]] || continue
            bash scripts/test-package-effective-parity.sh rpm-meta "$rpm" \
              > "dist/parity/rpm-${{ matrix.distro }}-meta.txt"
            echo "=== RPM metadata table (${{ matrix.distro }}) ==="
            cat "dist/parity/rpm-${{ matrix.distro }}-meta.txt"
          done

      - name: Upload RPM parity metadata (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-rpm-${{ matrix.distro }}
          path: dist/parity/rpm-${{ matrix.distro }}-meta.txt
          retention-days: 30

  # ==========================================================================
  # BUILD DEB PACKAGES
  # ==========================================================================
  build-deb:
    name: Build DEB (${{ matrix.distro }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 0: Primary/Required
          - distro: ubuntu24.04
            container: ubuntu:24.04
            name_suffix: ubuntu24.04
          - distro: ubuntu26.04
            container: ubuntu:26.04
            name_suffix: ubuntu26.04
          - distro: debian12
            container: debian:12
            name_suffix: debian12
          # Tier 1: Future/Planned
          - distro: debian13
            container: debian:trixie
            name_suffix: debian13
          # Tier 2: Legacy/Best-Effort
          - distro: ubuntu22.04
            container: ubuntu:22.04
            name_suffix: ubuntu22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: bin/

      # v1.229 UNINSTALL-PR3 CI hardening: keep the pinned yq out of the critical
      # path of every build. Keyed on the VERSION+SHA pinned in
      # packaging/build_nftban.sh, so a pin change invalidates the cache
      # automatically and a stale binary can never be served for a new pin.
      # provision_yq re-verifies the sha256 regardless of where the file came
      # from — the cache is a latency optimisation, never a trust boundary.
      - name: Restore pinned yq (cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: offline/yq_linux_amd64
          # Keyed on the FILE that defines the version+sha pin, not on the raw
          # digest: a literal 64-hex string in a workflow trips secret scanning
          # as a generic API key. Editing the pin changes the file, so the cache
          # still invalidates automatically and a stale binary is never reused
          # for a new pin. provision_yq re-verifies the sha256 regardless.
          key: yq-pinned-${{ hashFiles('packaging/build_nftban.sh') }}

      - name: Build DEB in ${{ matrix.distro }} container
        run: |
          chmod +x bin/*
          # v1.157 PR-B: retry the base-image pull (transient registry-1.docker.io
          # timeouts caused exit-125 hard failures). 3 attempts, backoff 3/9/27s.
          ok=0
          for delay in 3 9 27; do
            if docker pull "${{ matrix.container }}"; then ok=1; break; fi
            echo "docker pull ${{ matrix.container }} failed — retrying in ${delay}s..."
            sleep "$delay"
          done
          [ "$ok" -eq 1 ] || { echo "docker pull ${{ matrix.container }} failed after 3 attempts"; exit 125; }
          docker run --rm -v "$(pwd):/workspace" -w /workspace ${{ matrix.container }} bash -c "
            # MFST-C6 / F-1: strict mode — surface dpkg-deb failures to CI
            # instead of swallowing them. Mirror RPM step pattern (post-#571).
            set -euo pipefail

            # Install build dependencies (curl required for yq download)
            for i in 1 2 3; do
              apt-get update && apt-get install -y dpkg-dev build-essential file curl jq && break
              echo \"Retry \$i: apt-get failed, retrying in 5s...\"
              sleep 5
            done

            # Build DEB
            chmod +x packaging/build_nftban.sh
            cd packaging
            ./build_nftban.sh deb --use-prebuilt --prebuilt-manifest /workspace/bin/build-manifest.json || { echo '❌ DEB build failed!'; exit 1; }

            # Verify at least one DEB was created (catches silent dpkg-deb failures)
            if ! ls /workspace/build/packages/*.deb 2>/dev/null; then
              echo '❌ No DEB files created!'
              ls -laR /workspace/build/ || true
              exit 1
            fi

            # Fix permissions
            chmod -R a+rX /workspace/build/
          "

      - name: Rename DEB with distro suffix
        run: |
          mkdir -p dist/packages
          for deb in build/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              # Rename: nftban-core_1.0.0_amd64.deb -> nftban-ubuntu22.04-amd64.deb
              newname="nftban-${{ matrix.name_suffix }}-amd64.deb"
              cp "$deb" "dist/packages/$newname"
              echo "Renamed: $(basename "$deb") -> $newname"
            fi
          done
          ls -la dist/packages/

      - name: Validate DEB package contains valid binaries
        run: |
          echo "Validating DEB package binaries..."
          for deb in dist/packages/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Checking: $deb"
              mkdir -p /tmp/deb-check
              cd /tmp/deb-check
              ar x "$GITHUB_WORKSPACE/$deb"
              tar -xf data.tar.* 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null

              for binary in usr/lib/nftban/bin/nftban-core usr/lib/nftban/bin/nftband usr/lib/nftban/bin/nftban-installer; do
                if [[ -f "$binary" ]]; then
                  file_type=$(file -b "$binary")
                  if [[ "$file_type" != *"ELF"* ]]; then
                    echo "ERROR: $binary in DEB is NOT an ELF binary!"
                    echo "Got: $file_type"
                    head -1 "$binary"
                    exit 1
                  fi
                  size=$(stat -c%s "$binary")
                  echo "  ✓ $binary: valid ELF ($size bytes)"
                fi
              done

              cd "$GITHUB_WORKSPACE"
              rm -rf /tmp/deb-check
            fi
          done
          echo "All DEB packages validated successfully"

      - name: Upload DEB packages (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.distro }}
          path: dist/packages/*.deb
          retention-days: 30

      # PKG-EFFECTIVE-PARITY (Slot 5 / row 14): extract L3 package metadata
      # from the built DEB artifact. Output is consumed by the
      # validate-package-effective-parity aggregation job for cross-packager diff.
      - name: Extract DEB package metadata (PKG-EFFECTIVE-PARITY L3)
        run: |
          mkdir -p dist/parity
          for deb in dist/packages/*.deb; do
            [[ -f "$deb" ]] || continue
            bash scripts/test-package-effective-parity.sh deb-meta "$deb" \
              > "dist/parity/deb-${{ matrix.distro }}-meta.txt"
            echo "=== DEB metadata table (${{ matrix.distro }}) ==="
            cat "dist/parity/deb-${{ matrix.distro }}-meta.txt"
          done

      - name: Upload DEB parity metadata (${{ matrix.distro }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-deb-${{ matrix.distro }}
          path: dist/parity/deb-${{ matrix.distro }}-meta.txt
          retention-days: 30

  # ==========================================================================
  # TEST INSTALLATION (RPM - CentOS Stream)
  # ==========================================================================
  test-rpm-install:
    name: Test RPM install (${{ matrix.distro }})
    needs: build-rpm
    runs-on: ubuntu-latest
    # Tier 0 distros (EL9) are required; Tier 1 (EL10) are advisory
    continue-on-error: ${{ matrix.tier != 0 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical RPM install targets only (operator 2026-06-07): EL9 = Rocky 9,
          # EL10 = AlmaLinux 10. CentOS Stream + Alma 9 install legs removed (can be a
          # separate distro-validation lane later, not part of every release matrix).
          - distro: rocky9
            container: rockylinux:9
            rpm_artifact: rpm-el9
            tier: 0
          - distro: alma10
            container: almalinux:10
            rpm_artifact: rpm-el10
            tier: 1

    steps:
      # Checkout required so docker mount of $(pwd)/scripts/ resolves to a real
      # path containing test-package-effective-parity.sh + verify-exceptions.list
      # (PKG-EFFECTIVE-PARITY Phase 4/5/6).
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download RPM packages (with retry)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.rpm_artifact }}
          path: ./packages
        id: download
        continue-on-error: true

      - name: Retry artifact download if needed
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Artifact download failed - likely due to partial rerun"
          echo "Artifacts are only available when full workflow runs"
          echo "This is a known GitHub Actions limitation"
          exit 0

      - name: Test installation on ${{ matrix.distro }}
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p parity-out
          # v1.157 PR-B: retry the base-image pull (transient registry-1.docker.io
          # timeouts caused exit-125 hard failures). 3 attempts, backoff 3/9/27s.
          ok=0
          for delay in 3 9 27; do
            if docker pull "${{ matrix.container }}"; then ok=1; break; fi
            echo "docker pull ${{ matrix.container }} failed — retrying in ${delay}s..."
            sleep "$delay"
          done
          [ "$ok" -eq 1 ] || { echo "docker pull ${{ matrix.container }} failed after 3 attempts"; exit 125; }
          docker run --rm \
            -v $(pwd)/packages:/packages \
            -v $(pwd)/scripts:/scripts:ro \
            -v $(pwd)/parity-out:/parity-out \
            ${{ matrix.container }} bash -c '
            set -euo pipefail
            INSTALL_LOG=$(mktemp)

            echo "=== Phase 1: Package Installation ==="
            if dnf install -y --allowerasing /packages/*.rpm > "$INSTALL_LOG" 2>&1; then
              echo "[PASS] Package installed cleanly"
              INSTALL_CLEAN=true
            else
              INSTALL_EXIT=$?
              echo "[WARN] Package install exited $INSTALL_EXIT (postinst may have failed)"
              cat "$INSTALL_LOG"
              INSTALL_CLEAN=false
            fi

            echo "=== Phase 2: Artifact Validation (HARD FAIL) ==="
            echo -n "CLI wrapper exists: "
            test -x /usr/sbin/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "CLI runs: "
            /usr/sbin/nftban version && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Library dir exists: "
            test -d /usr/lib/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Config dir exists: "
            test -d /etc/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Systemd units installed: "
            ls /usr/lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 2b: Installer Binary (G5 — HARD FAIL) ==="
            echo -n "Installer binary exists: "
            test -x /usr/lib/nftban/bin/nftban-installer && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 3: Postinst Health (SOFT — expected to fail in Docker) ==="
            if [[ "$INSTALL_CLEAN" == "true" ]]; then
              echo "[INFO] Postinst succeeded — full install in container"
            else
              if grep -qE "nftables|nft:|RTNETLINK|Operation not permitted" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing nftables kernel (Docker limitation)"
              elif grep -qE "Failed to connect.*D-Bus|systemctl.*not found|Failed to.*service" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing systemd (Docker limitation)"
              else
                echo "[UNEXPECTED] Postinst failed for unknown reason — INVESTIGATE"
                cat "$INSTALL_LOG"
                exit 1
              fi
            fi

            echo "=== Phase 3b: Installer Log (G6 — SOFT) ==="
            if [[ -f /var/log/nftban/installer.log ]]; then
              tail -5 /var/log/nftban/installer.log || true
              grep -q "\[RUN\]" /var/log/nftban/installer.log && echo "[PASS] RUN marker" || echo "[WARN] No RUN marker"
              grep -q "state=" /var/log/nftban/installer.log && echo "[PASS] state marker" || echo "[WARN] No state marker"
            else
              echo "[EXPECTED] No installer.log (Docker has no systemd/nftables)"
            fi

            # PKG-EFFECTIVE-PARITY Phase 4: fresh-install stat (L4)
            # Best-effort tmpfiles-managed dir creation (vanilla Docker has no
            # systemd PID 1 but systemd-tmpfiles binary works without dbus)
            echo "=== Phase 4: Fresh-install stat (PKG-EFFECTIVE-PARITY L4) ==="
            systemd-tmpfiles --create /usr/lib/tmpfiles.d/nftban.conf 2>/dev/null || true
            bash /scripts/test-package-effective-parity.sh fresh-stat \
              > /parity-out/rpm-${{ matrix.distro }}-fresh-stat.txt
            cat /parity-out/rpm-${{ matrix.distro }}-fresh-stat.txt
            # Assert package-shipped paths match expected (HARD FAIL on mismatch)
            bash /scripts/test-package-effective-parity.sh assert-expected \
              /parity-out/rpm-${{ matrix.distro }}-fresh-stat.txt package

            # PKG-EFFECTIVE-PARITY Phase 5: reinstall preservation (L5)
            echo "=== Phase 5: Reinstall preservation (PKG-EFFECTIVE-PARITY L5) ==="
            dnf reinstall -y nftban-core > /dev/null 2>&1 || dnf install -y --allowerasing /packages/*.rpm > /dev/null 2>&1
            systemd-tmpfiles --create /usr/lib/tmpfiles.d/nftban.conf 2>/dev/null || true
            bash /scripts/test-package-effective-parity.sh reinstall-stat \
              > /parity-out/rpm-${{ matrix.distro }}-reinstall-stat.txt
            bash /scripts/test-package-effective-parity.sh diff \
              /parity-out/rpm-${{ matrix.distro }}-fresh-stat.txt \
              /parity-out/rpm-${{ matrix.distro }}-reinstall-stat.txt

            # PKG-EFFECTIVE-PARITY Phase 6: verify-tool (L6)
            echo "=== Phase 6: rpm -V verify-tool (PKG-EFFECTIVE-PARITY L6) ==="
            bash /scripts/test-package-effective-parity.sh verify-tool rpm \
              > /parity-out/rpm-${{ matrix.distro }}-verify.txt 2>&1 || {
                echo "[FAIL] rpm -V flagged unexpected entries:"
                cat /parity-out/rpm-${{ matrix.distro }}-verify.txt
                exit 1
              }
            cat /parity-out/rpm-${{ matrix.distro }}-verify.txt

            rm -f "$INSTALL_LOG"
            echo "=== Install test PASSED ==="
          '

      - name: Upload RPM parity install artifacts (${{ matrix.distro }})
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-rpm-install-${{ matrix.distro }}
          path: parity-out/rpm-${{ matrix.distro }}-*.txt
          retention-days: 30

  # ==========================================================================
  # TEST INSTALLATION (DEB)
  # ==========================================================================
  test-deb-install:
    name: Test DEB install (${{ matrix.distro }})
    needs: build-deb
    runs-on: ubuntu-latest
    # Tier 0 distros (Debian 12) are required; Tier 1 are advisory
    continue-on-error: ${{ matrix.tier != 0 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22.04
            container: ubuntu:22.04
            deb_artifact: deb-ubuntu22.04
            tier: 1
          - distro: ubuntu24.04
            container: ubuntu:24.04
            deb_artifact: deb-ubuntu24.04
            tier: 0
          - distro: ubuntu26.04
            container: ubuntu:26.04
            deb_artifact: deb-ubuntu26.04
            tier: 0
          - distro: debian12
            container: debian:12
            deb_artifact: deb-debian12
            tier: 0
          - distro: debian13
            container: debian:trixie
            deb_artifact: deb-debian13
            tier: 1

    steps:
      # Checkout required so docker mount of $(pwd)/scripts/ resolves to a real
      # path containing test-package-effective-parity.sh + verify-exceptions.list
      # (PKG-EFFECTIVE-PARITY Phase 4/5/6).
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download DEB packages (with retry)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.deb_artifact }}
          path: ./packages
        id: download
        continue-on-error: true

      - name: Retry artifact download if needed
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Artifact download failed - likely due to partial rerun"
          echo "Artifacts are only available when full workflow runs"
          echo "This is a known GitHub Actions limitation"
          exit 0

      - name: Test installation on ${{ matrix.distro }}
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p parity-out
          # v1.157 PR-B: retry the base-image pull (transient registry-1.docker.io
          # timeouts caused exit-125 hard failures). 3 attempts, backoff 3/9/27s.
          ok=0
          for delay in 3 9 27; do
            if docker pull "${{ matrix.container }}"; then ok=1; break; fi
            echo "docker pull ${{ matrix.container }} failed — retrying in ${delay}s..."
            sleep "$delay"
          done
          [ "$ok" -eq 1 ] || { echo "docker pull ${{ matrix.container }} failed after 3 attempts"; exit 125; }
          docker run --rm \
            -v $(pwd)/packages:/packages \
            -v $(pwd)/scripts:/scripts:ro \
            -v $(pwd)/parity-out:/parity-out \
            ${{ matrix.container }} bash -c '
            set -euo pipefail
            INSTALL_LOG=$(mktemp)

            echo "=== Phase 1: Package Installation ==="
            apt-get update -qq > /dev/null 2>&1
            if apt-get install -y /packages/*.deb > "$INSTALL_LOG" 2>&1; then
              echo "[PASS] Package installed cleanly"
              INSTALL_CLEAN=true
            else
              INSTALL_EXIT=$?
              echo "[WARN] Package install exited $INSTALL_EXIT (postinst may have failed)"
              cat "$INSTALL_LOG"
              INSTALL_CLEAN=false
            fi

            echo "=== Phase 2: Artifact Validation (HARD FAIL) ==="
            echo -n "CLI wrapper exists: "
            test -x /usr/sbin/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "CLI runs: "
            /usr/sbin/nftban version && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Library dir exists: "
            test -d /usr/lib/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Config dir exists: "
            test -d /etc/nftban && echo "PASS" || { echo "FAIL"; exit 1; }

            echo -n "Systemd units installed: "
            ls /lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              || ls /usr/lib/systemd/system/nftban*.service >/dev/null 2>&1 \
              && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 2b: Installer Binary (G5 — HARD FAIL) ==="
            echo -n "Installer binary exists: "
            test -x /usr/lib/nftban/bin/nftban-installer && echo "PASS" || { echo "FAIL"; exit 1; }

            echo "=== Phase 3: Postinst Health (SOFT — expected to fail in Docker) ==="
            if [[ "$INSTALL_CLEAN" == "true" ]]; then
              echo "[INFO] Postinst succeeded — full install in container"
            else
              if grep -qE "nftables|nft:|RTNETLINK|Operation not permitted" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing nftables kernel (Docker limitation)"
              elif grep -qE "Failed to connect.*D-Bus|systemctl.*not found|Failed to.*service" "$INSTALL_LOG"; then
                echo "[EXPECTED] Postinst failed due to missing systemd (Docker limitation)"
              else
                echo "[UNEXPECTED] Postinst failed for unknown reason — INVESTIGATE"
                cat "$INSTALL_LOG"
                exit 1
              fi
            fi

            echo "=== Phase 3b: Installer Log (G6 — SOFT) ==="
            if [[ -f /var/log/nftban/installer.log ]]; then
              tail -5 /var/log/nftban/installer.log || true
              grep -q "\[RUN\]" /var/log/nftban/installer.log && echo "[PASS] RUN marker" || echo "[WARN] No RUN marker"
              grep -q "state=" /var/log/nftban/installer.log && echo "[PASS] state marker" || echo "[WARN] No state marker"
            else
              echo "[EXPECTED] No installer.log (Docker has no systemd/nftables)"
            fi

            # PKG-EFFECTIVE-PARITY Phase 4: fresh-install stat (L4)
            echo "=== Phase 4: Fresh-install stat (PKG-EFFECTIVE-PARITY L4) ==="
            systemd-tmpfiles --create /usr/lib/tmpfiles.d/nftban.conf 2>/dev/null || true
            bash /scripts/test-package-effective-parity.sh fresh-stat \
              > /parity-out/deb-${{ matrix.distro }}-fresh-stat.txt
            cat /parity-out/deb-${{ matrix.distro }}-fresh-stat.txt
            # Assert package-shipped paths match expected (HARD FAIL on mismatch)
            # This is THE D-NEW-12 regression guard: DEB regressing /etc/nftban
            # to root:root 0755 will fail here.
            bash /scripts/test-package-effective-parity.sh assert-expected \
              /parity-out/deb-${{ matrix.distro }}-fresh-stat.txt package

            # PKG-EFFECTIVE-PARITY Phase 5: reinstall preservation (L5)
            echo "=== Phase 5: Reinstall preservation (PKG-EFFECTIVE-PARITY L5) ==="
            apt-get install --reinstall -y nftban-core > /dev/null 2>&1 || apt-get install -y /packages/*.deb > /dev/null 2>&1
            systemd-tmpfiles --create /usr/lib/tmpfiles.d/nftban.conf 2>/dev/null || true
            bash /scripts/test-package-effective-parity.sh reinstall-stat \
              > /parity-out/deb-${{ matrix.distro }}-reinstall-stat.txt
            bash /scripts/test-package-effective-parity.sh diff \
              /parity-out/deb-${{ matrix.distro }}-fresh-stat.txt \
              /parity-out/deb-${{ matrix.distro }}-reinstall-stat.txt

            # PKG-EFFECTIVE-PARITY Phase 6: verify-tool (L6)
            echo "=== Phase 6: dpkg --verify verify-tool (PKG-EFFECTIVE-PARITY L6) ==="
            bash /scripts/test-package-effective-parity.sh verify-tool deb \
              > /parity-out/deb-${{ matrix.distro }}-verify.txt 2>&1 || {
                echo "[FAIL] dpkg --verify flagged unexpected entries:"
                cat /parity-out/deb-${{ matrix.distro }}-verify.txt
                exit 1
              }
            cat /parity-out/deb-${{ matrix.distro }}-verify.txt

            rm -f "$INSTALL_LOG"
            echo "=== Install test PASSED ==="
          '

      - name: Upload DEB parity install artifacts (${{ matrix.distro }})
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-deb-install-${{ matrix.distro }}
          path: parity-out/deb-${{ matrix.distro }}-*.txt
          retention-days: 30

  # ==========================================================================
  # CONSOLIDATE ALL PACKAGES
  # ==========================================================================
  # ===========================================================================
  # UNINSTALL-PR3 LAYER A — package-native remove/purge in a CONTAINER
  # ===========================================================================
  # D6: the lifecycle matrices were the ONLY package-native remove/purge tests
  # and ran in NO workflow, so D1/D2/D3/D5 were SOURCE_PROVEN only. This job
  # removes a REAL built package and asserts on the resulting filesystem.
  #
  # LAYER A != LAYER B. A GitHub container has dpkg/rpm and a real filesystem,
  # so package operations and preservation are genuinely observable here. It has
  # no PID1 systemd and no kernel nftables, so unit and ruleset assertions are
  # NOT observable. Those are declared NOT_IN_SCOPE via
  # NFTBAN_MATRIX_VM_ASSERTIONS=0 — they are NOT executed and NOT weakened, and
  # the matrix prints CLAIMS_SYSTEMD_AUTHORITY=NO so a Layer A PASS can never be
  # read as VM proof.
  #
  #   CONTAINER_PACKAGE_PASS != SYSTEMD_VM_PASS
  #
  # If observation authority goes missing for an IN-SCOPE assertion, the probes
  # emit BLOCKED_ENVIRONMENT and the matrix returns INCOMPLETE (exit 2), which
  # fails this job. Exit 3 means the harness could not produce a trustworthy
  # verdict at all. Closure (UNINSTALL_LIFECYCLE_DEBT_FREE) still requires the
  # Layer B systemd-VM run; this job cannot grant it.
  #
  # NOT REQUIRED YET: making this a required check is a branch-protection change
  # (repo settings), deliberately not done in a code PR.
  lifecycle-layer-a:
    name: Lifecycle Layer A — package-native remove (${{ matrix.label }})
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rpm-el9
            family: rpm
            container: rockylinux:9
            # build-rpm uploads rpm-${distro} where distro is el9/el10 — the
            # artifact is named for the EL generation, not the image vendor.
            # Matches test-rpm-install's rockylinux:9 -> rpm-el9 pairing.
            artifact: rpm-el9
          - label: deb-ubuntu24.04
            family: deb
            container: ubuntu:24.04
            artifact: deb-ubuntu24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          name: ${{ matrix.artifact }}
          path: packages

      - name: Pull base image (retry)
        run: |
          ok=0
          for delay in 3 9 27; do
            if docker pull "${{ matrix.container }}"; then ok=1; break; fi
            echo "docker pull failed - retrying in ${delay}s..."
            sleep "$delay"
          done
          [ "$ok" -eq 1 ] || { echo "docker pull failed after 3 attempts"; exit 125; }

      - name: Package-native remove (${{ matrix.family }}, VM assertions out of scope)
        env:
          FAMILY: ${{ matrix.family }}
          IMAGE: ${{ matrix.container }}
        run: |
          set -euo pipefail
          ls -la packages/
          docker run --rm \
            -v "$(pwd)/packages:/packages:ro" \
            -v "$(pwd)/scripts:/scripts:ro" \
            -e NFTBAN_MATRIX_VM_ASSERTIONS=0 \
            -e NFTBAN_RPM_CASES="R7" \
            -e NFTBAN_LIFECYCLE_CASES="L7" \
            -e FAMILY="$FAMILY" \
            "$IMAGE" bash -c '
              set -uo pipefail
              if [ "$FAMILY" = "rpm" ]; then
                dnf -y install findutils procps-ng util-linux >/dev/null 2>&1 || true
                CAND=$(find /packages -name "*.rpm" | head -1)
                [ -n "$CAND" ] || { echo "no candidate rpm in artifact"; exit 1; }
                bash /scripts/ci/tests/lifecycle_rpm_matrix.sh "$CAND"
              else
                apt-get update -qq >/dev/null 2>&1 || true
                apt-get install -y -qq findutils procps util-linux >/dev/null 2>&1 || true
                CAND=$(find /packages -name "*.deb" | head -1)
                [ -n "$CAND" ] || { echo "no candidate deb in artifact"; exit 1; }
                bash /scripts/ci/tests/lifecycle_deb_matrix.sh "$CAND"
              fi
            ' | tee matrix.log
          rc=${PIPESTATUS[0]}
          echo "matrix rc=$rc"
          # 0 PASS · 1 TEST_FAILURE · 2 INCOMPLETE · 3 HARNESS_FAILURE.
          # INCOMPLETE is NOT a pass: an unobserved property proves nothing.
          if ! grep -q 'CLAIMS_SYSTEMD_AUTHORITY=NO' matrix.log; then
            echo "::error::Layer A run did not disclaim systemd authority - refusing to report success"
            exit 1
          fi
          exit "$rc"

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-layer-a-${{ matrix.label }}
          path: matrix.log
          if-no-files-found: warn

  consolidate-packages:
    name: Consolidate all packages
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: List all packages
        run: |
          echo "=== All packages built ==="
          find all-packages -name "*.rpm" -o -name "*.deb" | sort
          echo ""
          echo "=== Package counts ==="
          echo "DEB: $(find all-packages -name '*.deb' | wc -l)"
          echo "RPM: $(find all-packages -name '*.rpm' | wc -l)"

      - name: Generate package summary
        run: |
          echo "## Built Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RPM Packages (EL + Fedora)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for rpm in $(find all-packages -name "*.rpm" | sort); do
            name=$(basename "$rpm")
            echo "| $(dirname "$rpm" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DEB Packages (Ubuntu + Debian)" >> $GITHUB_STEP_SUMMARY
          echo "| Distro | Package |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for deb in $(find all-packages -name "*.deb" | sort); do
            name=$(basename "$deb")
            echo "| $(dirname "$deb" | xargs basename) | $name |" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================================================
  # VALIDATE BINARY CONSISTENCY ACROSS ALL PACKAGES
  # ==========================================================================
  validate-binary-consistency:
    name: Validate binary consistency (RPM vs DEB)
    needs: [consolidate-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: Download source binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-binaries
          path: source-binaries/

      - name: Validate all packages contain identical binaries
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "BINARY CONSISTENCY CHECK"
          echo "============================================================"
          echo ""

          # Get source binary hashes (the canonical reference)
          echo "=== Source Binary Hashes (Reference) ==="
          declare -A SOURCE_HASHES
          for binary in nftband nftban-core nftban-installer; do
            if [[ -f "source-binaries/$binary" ]]; then
              hash=$(sha256sum "source-binaries/$binary" | cut -d' ' -f1)
              SOURCE_HASHES[$binary]="$hash"
              size=$(stat -c%s "source-binaries/$binary")
              echo "  $binary: $hash ($size bytes)"
            fi
          done
          echo ""

          ERRORS=0
          PACKAGES_CHECKED=0

          # Extract and check all RPM packages
          echo "=== Checking RPM Packages ==="
          for rpm in $(find all-packages -name "*.rpm" | sort); do
            pkg_name=$(basename "$rpm")
            echo "  Checking: $pkg_name"

            mkdir -p /tmp/rpm-extract
            cd /tmp/rpm-extract
            rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idmv 2>/dev/null

            for binary in nftband nftban-core nftban-installer; do
              pkg_binary="usr/lib/nftban/bin/$binary"
              if [[ -f "$pkg_binary" ]]; then
                pkg_hash=$(sha256sum "$pkg_binary" | cut -d' ' -f1)
                pkg_size=$(stat -c%s "$pkg_binary")

                if [[ "${SOURCE_HASHES[$binary]:-}" != "$pkg_hash" ]]; then
                  echo "    ❌ MISMATCH: $binary"
                  echo "       Source:  ${SOURCE_HASHES[$binary]:-NOT_FOUND}"
                  echo "       Package: $pkg_hash ($pkg_size bytes)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "    ✓ $binary: matches source"
                fi
              fi
            done

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/rpm-extract
            PACKAGES_CHECKED=$((PACKAGES_CHECKED + 1))
          done
          echo ""

          # Extract and check all DEB packages
          echo "=== Checking DEB Packages ==="
          for deb in $(find all-packages -name "*.deb" | sort); do
            pkg_name=$(basename "$deb")
            echo "  Checking: $pkg_name"

            mkdir -p /tmp/deb-extract
            cd /tmp/deb-extract
            ar x "$GITHUB_WORKSPACE/$deb"
            tar -xf data.tar.* 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null || true

            for binary in nftband nftban-core nftban-installer; do
              pkg_binary="usr/lib/nftban/bin/$binary"
              if [[ -f "$pkg_binary" ]]; then
                pkg_hash=$(sha256sum "$pkg_binary" | cut -d' ' -f1)
                pkg_size=$(stat -c%s "$pkg_binary")

                if [[ "${SOURCE_HASHES[$binary]:-}" != "$pkg_hash" ]]; then
                  echo "    ❌ MISMATCH: $binary"
                  echo "       Source:  ${SOURCE_HASHES[$binary]:-NOT_FOUND}"
                  echo "       Package: $pkg_hash ($pkg_size bytes)"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "    ✓ $binary: matches source"
                fi
              fi
            done

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/deb-extract
            PACKAGES_CHECKED=$((PACKAGES_CHECKED + 1))
          done
          echo ""

          # Summary
          echo "============================================================"
          echo "SUMMARY"
          echo "============================================================"
          echo "Packages checked: $PACKAGES_CHECKED"
          echo "Errors found: $ERRORS"
          echo ""

          if [[ $ERRORS -gt 0 ]]; then
            echo "❌ FATAL: Binary consistency check FAILED!"
            echo ""
            echo "Some packages contain binaries that don't match the source."
            echo "This indicates a serious build/packaging issue."
            echo ""
            echo "Root causes to check:"
            echo "  1. Go build cache contamination"
            echo "  2. Package build using wrong bin/ directory"
            echo "  3. Artifact download/upload race conditions"
            exit 1
          fi

          echo "✅ All packages contain identical binaries matching source"

      - name: Generate consistency report
        run: |
          echo "## Binary Consistency Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All RPM and DEB packages contain identical Go binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validated Binaries" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | SHA256 (first 16 chars) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------------|" >> $GITHUB_STEP_SUMMARY
          for binary in source-binaries/*; do
            name=$(basename "$binary")
            hash=$(sha256sum "$binary" | cut -c1-16)
            echo "| $name | \`$hash...\` |" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================================================
  # V108 ITEM 1: SYSTEMD ExecStart PAYLOAD-RESOLUTION GATE
  # ==========================================================================
  # Compile-time complement to the runtime assertion `systemd_execstart_paths_ok`
  # (internal/installer/validate/assertions.go::assertSystemdExecStartPaths).
  # The runtime assertion fires after install on a deployed host; this CI job
  # catches the same defect class at PR / release-build time by inspecting
  # built RPM and DEB package payloads.
  #
  # Closes the v1.107.1-class regression where install/systemd/*.service
  # ExecStart= references a path that was never packaged (helper missing
  # from RPM glob), surfacing only at install time as a 203/EXEC failure.
  # ==========================================================================
  validate-systemd-execstart-resolution:
    name: Validate systemd ExecStart payload resolution
    needs: [consolidate-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages/

      - name: Extract representative RPM (el9) + DEB (ubuntu24.04) for validation
        run: |
          set -euo pipefail
          mkdir -p /tmp/rpm-payload /tmp/deb-payload

          # Tier 0 representatives: el9 + ubuntu24.04 (mirror the
          # parity job's Tier 0 selection at lines 1004-1005).
          rpm_file=$(find all-packages -name 'nftban-el9-x86_64*.rpm' -o -name 'nftban-core-*.el9.x86_64.rpm' 2>/dev/null | head -1)
          deb_file=$(find all-packages -name 'nftban-ubuntu24.04-amd64*.deb' -o -name 'nftban-core_*_amd64.deb' -path '*ubuntu24*' 2>/dev/null | head -1)
          # Fallback: pick first available of each type
          [[ -z "$rpm_file" ]] && rpm_file=$(find all-packages -name '*.rpm' | sort | head -1)
          [[ -z "$deb_file" ]] && deb_file=$(find all-packages -name '*.deb' | sort | head -1)

          if [[ -z "$rpm_file" || -z "$deb_file" ]]; then
            echo "::error::Cannot find RPM/DEB artifacts (rpm=$rpm_file deb=$deb_file)"
            find all-packages -type f | head -20
            exit 1
          fi

          echo "RPM artifact: $rpm_file"
          echo "DEB artifact: $deb_file"

          # Extract RPM
          (cd /tmp/rpm-payload && rpm2cpio "$GITHUB_WORKSPACE/$rpm_file" | cpio -idm --quiet)

          # Extract DEB (ar + tar)
          (cd /tmp/deb-payload && ar x "$GITHUB_WORKSPACE/$deb_file" && \
              { tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null || tar -xf data.tar.zst 2>/dev/null || tar -xf data.tar.* 2>/dev/null; } && \
              rm -f control.tar.* data.tar.* debian-binary)

          echo ""
          echo "=== RPM payload tree (top-level) ==="
          ls -la /tmp/rpm-payload/usr/lib/systemd/system/ 2>/dev/null | head -10
          echo ""
          echo "=== DEB payload tree (top-level) ==="
          ls -la /tmp/deb-payload/usr/lib/systemd/system/ 2>/dev/null | head -10

      - name: Run V108 Item 1 ExecStart payload-resolution gate
        run: |
          set -euo pipefail
          bash scripts/ci/test-systemd-execstart-payload-resolution.sh validate \
              --rpm-payload=/tmp/rpm-payload \
              --deb-payload=/tmp/deb-payload \
              --verbose

      - name: Generate gate report
        if: always()
        run: |
          echo "## V108 Item 1 — systemd ExecStart payload resolution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All Exec* paths in installed systemd units resolve to artifacts shipped in both RPM and DEB payloads." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failure(s) detected. Review the gate output above for failure-mode classification." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failure modes (see scripts/ci/test-systemd-execstart-payload-resolution.sh):" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- \`INVALID_MISSING_PATH\` — active unit references a path not present in either packager" >> $GITHUB_STEP_SUMMARY
            echo "- \`DEPRECATED_UNIT_RESIDUE_IN_ACTIVE_UNIT\` — active install ships a unit named in deprecated-units.yaml" >> $GITHUB_STEP_SUMMARY
            echo "- \`PARITY_UNIT_PRESENT_IN_ONE_PACKAGER\` — unit in RPM but not DEB (or vice versa)" >> $GITHUB_STEP_SUMMARY
            echo "- \`PARITY_EXEC_PATH_RESOLUTION_DIVERGENT\` — Exec path resolves in one packager only" >> $GITHUB_STEP_SUMMARY
            echo "- \`STALE_RESIDUE_INCOHERENT_STATE\` — unit in BOTH install/systemd and deprecated-units.yaml" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # PKG-EFFECTIVE-PARITY: cross-packager aggregation (Slot 5 / row 14)
  # ==========================================================================
  # Closes the L3 escape class that lived ~13 releases pre-AUTH-HARDENING:
  # both packages could "ship the same dirs" while recording different
  # ownership/mode in their package DBs. Now we extract metadata from each
  # built artifact + diff cross-packager + assert against expected table.
  # ==========================================================================
  validate-package-effective-parity:
    name: Validate package effective parity (RPM vs DEB)
    needs: [build-rpm, build-deb, test-rpm-install, test-deb-install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all parity artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: parity/
          pattern: parity-*

      - name: Inspect parity artifact tree
        run: |
          echo "=== Parity artifact tree ==="
          find parity -type f | sort
          echo ""

      - name: L3 — assert RPM package metadata matches expected table
        run: |
          set -euo pipefail
          fail=0
          for f in parity/parity-rpm-el9/*.txt parity/parity-rpm-el10/*.txt; do
            [[ -f "$f" ]] || continue
            echo "=== Asserting expected against $f ==="
            cat "$f"
            if ! bash scripts/test-package-effective-parity.sh assert-expected "$f" package; then
              echo "::error::L3 RPM metadata mismatch in $f"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✓ L3 RPM metadata matches expected for all matrix variants"

      - name: L3 — assert DEB package metadata matches expected table
        run: |
          set -euo pipefail
          # PKG-EFFECTIVE-PARITY Slot 5a: DEB archive ships postinst-converged
          # paths as root:root (per V107_PKG_EFFECTIVE_PARITY_DEB_POSTINST_OWNERSHIP_SCOPE.md
          # Option α). Pass the exception list so the L3 assert expects
          # root:root for the 6 converged paths instead of root:nftban etc.
          # L4 (installed-fs stat) and L6 (dpkg --verify) are NOT affected by
          # this exception list — they continue to require by-name parity.
          DEB_L3_EXCEPTIONS="scripts/test-package-deb-l3-exceptions.list"
          [[ -r "$DEB_L3_EXCEPTIONS" ]] || { echo "::error::Missing $DEB_L3_EXCEPTIONS"; exit 1; }
          fail=0
          for f in parity/parity-deb-debian12/*.txt parity/parity-deb-debian13/*.txt parity/parity-deb-ubuntu22.04/*.txt parity/parity-deb-ubuntu24.04/*.txt; do
            [[ -f "$f" ]] || continue
            echo "=== Asserting expected against $f (with DEB L3 postinst-converged exceptions) ==="
            cat "$f"
            if ! bash scripts/test-package-effective-parity.sh assert-expected "$f" package "--deb-l3-exceptions=$DEB_L3_EXCEPTIONS"; then
              echo "::error::L3 DEB metadata mismatch in $f"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✓ L3 DEB metadata matches expected for all matrix variants (postinst-converged paths verified as root:root in archive)"

      - name: L3 — cross-packager parity diff (RPM vs DEB)
        run: |
          set -euo pipefail
          # Pick representative variants (Tier 0): el9 + ubuntu24.04.
          # PKG-EFFECTIVE-PARITY Slot 5a: pass the exception list so the diff
          # tolerates the documented postinst-converged divergence (RPM ships
          # root:nftban via %attr; DEB ships root:root in archive and converges
          # at postinst). All non-exception paths must still match exactly.
          DEB_L3_EXCEPTIONS="scripts/test-package-deb-l3-exceptions.list"
          [[ -r "$DEB_L3_EXCEPTIONS" ]] || { echo "::error::Missing $DEB_L3_EXCEPTIONS"; exit 1; }
          rpm_meta=$(ls parity/parity-rpm-el9/*.txt 2>/dev/null | head -1)
          deb_meta=$(ls parity/parity-deb-ubuntu24.04/*.txt 2>/dev/null | head -1)
          if [[ -z "$rpm_meta" || -z "$deb_meta" ]]; then
            echo "::error::Missing parity metadata artifacts (rpm=$rpm_meta deb=$deb_meta)"
            exit 1
          fi
          echo "=== L3 cross-packager diff: $rpm_meta vs $deb_meta (with $DEB_L3_EXCEPTIONS) ==="
          if ! bash scripts/test-package-effective-parity.sh diff "$rpm_meta" "$deb_meta" "--exceptions=$DEB_L3_EXCEPTIONS"; then
            echo "::error::L3 RPM vs DEB metadata divergence on non-exception paths (postinst-converged paths are tolerated; non-exception divergence is a real packaging bug)"
            exit 1
          fi
          echo "✓ L3 cross-packager metadata parity: RPM == DEB for non-exception critical paths (6 paths converged at postinst)"

      - name: L4+L5 — cross-packager fresh-install stat parity (Tier 0)
        run: |
          set -euo pipefail
          # Pick Tier 0 representatives
          rpm_stat=$(ls parity/parity-rpm-install-rocky9/*-fresh-stat.txt 2>/dev/null | head -1)
          deb_stat=$(ls parity/parity-deb-install-ubuntu24.04/*-fresh-stat.txt 2>/dev/null | head -1)
          if [[ -z "$rpm_stat" || -z "$deb_stat" ]]; then
            echo "::warning::Missing install-stat artifacts (rpm=$rpm_stat deb=$deb_stat) — Tier 0 install jobs may have skipped"
            exit 0
          fi
          echo "=== L4 cross-packager fresh-install stat diff: $rpm_stat vs $deb_stat ==="
          if ! bash scripts/test-package-effective-parity.sh diff "$rpm_stat" "$deb_stat"; then
            echo "::error::L4 RPM vs DEB installed-fs divergence (no AUTHORITY_EXCEPTION)"
            exit 1
          fi
          echo "✓ L4 cross-packager installed-fs parity"

      - name: Generate parity report
        if: always()
        run: |
          echo "## PKG-EFFECTIVE-PARITY Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Layers asserted: L3 (package metadata) + L4 (installed-fs) + L5 (reinstall preservation) + L6 (verify-tool)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Critical paths (11)" >> $GITHUB_STEP_SUMMARY
          bash scripts/test-package-effective-parity.sh list-expected | while IFS='|' read -r path type mode owner group pkg; do
            echo "- \`$path\` → $type $mode $owner:$group (pkg-shipped=$pkg)" >> $GITHUB_STEP_SUMMARY
          done

  # ==========================================================================
  # NOTE: Release upload is handled by release.yml workflow (triggered by tags)
  # This workflow only builds and validates packages, no release upload.
  # Removed upload-release job in v1.21.4 to prevent SHA256SUMS race conditions
  # where this job would overwrite release assets without updating checksums.
  # ==========================================================================
