# =============================================================================
# NFTBan Template File
# Version: init 1.0
# Template Name: user-blacklist_ips.conf
# Author: ITCMS Team (Antonios Voulvoulis)
# Contact: contact@itcms.gr
# Website: https://itcms.gr
# Template Directory: /etc/nftban/templates/conf
# User Customization Path: /etc/nftban/config
#
# Description:
# This template allows users to manually define their own permanent blacklist IP addresses.
# It is intended for persistent user-defined IPs that should always be blocked.
# Both IPv4 and IPv6 addresses are supported.
#
# Behavior:
# - This file is **NEVER** overwritten by NFTBan or its automated scripts.
# - Users may update it manually or via the NFTBan CLI interface.
# - All entries here are permanently blocked at the firewall level.
# - Changes take effect after: nftban blacklist reload OR nftban setup
#
# Usage:
# - Add one IP address per line
# - Comments start with #
# - Empty lines are ignored
# - Supports individual IPs and CIDR ranges
#
# Examples:
# 198.51.100.10          # Known attacker IP
# 203.0.113.0/24         # Malicious network range
# 2001:db8:bad::1        # IPv6 attacker
# 192.0.2.0/24           # Spam source network
#
# Commands:
# - Add IP:     nftban blacklist add <IP> "reason"
# - Remove IP:  nftban blacklist remove <IP>
# - List IPs:   nftban blacklist list
# - Reload:     nftban blacklist reload
#
# Warning:
# - DO NOT rename or relocate this file.
# - Be careful when adding IPs - incorrect entries can block legitimate traffic.
# - Blacklisted IPs are blocked BEFORE whitelist is checked.
# - System IPs and whitelisted IPs cannot be blacklisted (safety mechanism).
