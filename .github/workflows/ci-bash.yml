# =============================================================================
# NFTBan - CI: Bash Validation
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Shell script syntax checking and static analysis
#
# Checks:
#   - bash -n syntax validation on all .sh files
#   - ShellCheck at warning severity (-S warning) with source following (-x)
#   - Covers: core/, cli/, lib/, setup/, install/, build.sh, install.sh
# =============================================================================

name: Bash Validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-bash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-check:
    name: Shell Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check all bash scripts
        run: |
          echo "=== Checking bash syntax ==="
          find cli install packaging -name "*.sh" -type f | while read -r script; do
            bash -n "$script" || { echo "FAIL: $script"; exit 1; }
          done
          bash -n build.sh install.sh
          echo "✓ All bash syntax valid"

      - name: ShellCheck core scripts
        run: |
          echo "=== ShellCheck: Core ==="
          shellcheck -x -S warning cli/lib/nftban/core/*.sh

      - name: ShellCheck CLI scripts
        run: |
          echo "=== ShellCheck: CLI ==="
          shellcheck -x -S warning cli/lib/nftban/cli/*.sh

      - name: ShellCheck lib scripts
        run: |
          echo "=== ShellCheck: Lib ==="
          shellcheck -x -S warning cli/lib/nftban/lib/*.sh

      - name: ShellCheck setup scripts
        run: |
          echo "=== ShellCheck: Setup ==="
          shellcheck -x -S warning cli/lib/nftban/setup/*.sh

      - name: ShellCheck install scripts
        run: |
          echo "=== ShellCheck: Install ==="
          shellcheck -x -S warning install/*.sh
          shellcheck -x -S warning install.sh build.sh

      # ----------------------------------------------------------------------
      # v1.229.0 R0 — EXECUTE the CSF observation-purity gate.
      #
      # This workflow previously only linted; it never EXECUTED a *_test.sh.
      # A test file that is merely present is inert (TEST-DISCOVERY GAP:
      # 182/225 shell tests not CI-wired), and the R0 spec makes
      # TEST_PRESENT_IN_REQUIRED_CI release-blocking — "test file added" is
      # explicitly insufficient.
      #
      # Scope note: this step is deliberately an explicit single-file
      # invocation, NOT a glob over tests/. Auto-discovering every shell test
      # here would turn a lint gate into an unreviewed test runner and drag in
      # the known-red baseline. Broad discovery belongs to the test-authority
      # lane, not to this hotfix.
      - name: CSF observation purity (v1.229.0 R0 gate)
        run: |
          echo "=== Executing: csf_observation_purity_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/csf_observation_purity_v1229_test.sh
          bash cli/lib/nftban/tests/csf_observation_purity_v1229_test.sh

      # v1.229.x R2 (O1) — the legacy restore path must stay neutralized.
      # Explicit single-file invocation, consistent with the R0 gate above:
      # this workflow is a lint gate that executes named tests, not a
      # discovery-based runner.
      - name: Legacy restore neutralized (v1.229.x R2 gate)
        run: |
          echo "=== Executing: legacy_restore_neutralized_v1229_test.sh ==="
          chmod +x cli/lib/nftban/tests/legacy_restore_neutralized_v1229_test.sh
          bash cli/lib/nftban/tests/legacy_restore_neutralized_v1229_test.sh
