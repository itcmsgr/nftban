          type: TRAPPER
          key: nftban.module.feeds.status
          value_type: FLOAT
          description: '1=active, 0=disabled, -1=failed'
        - uuid: 3a7e1f5b-0c2d-4e6f-8a9b-1c3d5e7f9a01
          name: 'NFTBan: Module - Geoban status'
          type: TRAPPER
          key: nftban.module.geoban.status
          value_type: FLOAT
          description: '1=active, 0=disabled, -1=failed'
        - uuid: 5c9a3b7d-2e4f-4a8b-8c1d-3e5f7a9b1c21
          name: 'NFTBan: Module - Watchdog status'
          type: TRAPPER
          key: nftban.module.watchdog.status
          value_type: FLOAT
          description: '1=active, 0=disabled, -1=failed'
        # =====================================================================
        # NFTABLES METRICS
        # =====================================================================
        - uuid: d57a5ac2-75bf-4c81-b8b5-7ad93aeb6cc3
          name: 'NFTBan: nftables sets'
          type: TRAPPER
          key: nftban.nft.sets.total
          value_type: UNSIGNED
          description: 'Total nftables sets'
        - uuid: 2293bf7a-361e-4a94-aecb-302d0e19f7e6
          name: 'NFTBan: nftables elements'
          type: TRAPPER
          key: nftban.nft.elements.total
