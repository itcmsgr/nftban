name: Generate SHA256 Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate SHA256SUMS.txt
        id: gen
        shell: bash
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          git ls-files -z ':!:SHA256SUMS.txt' \
            | xargs -0 sha256sum \
            | sort -k2 > "$tmpfile"

          if [[ ! -f SHA256SUMS.txt ]] || ! cmp -s "$tmpfile" SHA256SUMS.txt; then
            mv "$tmpfile" SHA256SUMS.txt
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$tmpfile"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.gen.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-sha256sums
          base: main
          title: "chore: update SHA256SUMS.txt"
          body: |
            Automated update of `SHA256SUMS.txt`.

            - Tracked files via `git ls-files`
            - Excludes the sums file itself
            - Sorted for stability
            - Deletions/renames reflected automatically
          commit-message: "chore: update SHA256SUMS.txt (automated)"
          add-paths: |
            SHA256SUMS.txt
          reset-branch: false   # <-- avoids the failing 'git reset --hard origin/branch'
          delete-branch: true
