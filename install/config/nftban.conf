# Purpose: System-wide configuration settings for NFTBan
#
# meta:name="nftban_conf"
# meta:type="config"
# meta:owner="Antonios Voulvoulis <contact@nftban.com>"
# meta:created_date="2025-10-26"
#
# meta:description="Main configuration file for NFTBan firewall management"
# meta:input="None"
# meta:output="Environment variables for NFTBan components"
# meta:depends=""
#
# meta:inventory.files=""
# meta:inventory.binaries=""
# meta:inventory.env_vars=""
# meta:inventory.config_files="/etc/nftban/conf.d/*.conf"
# meta:inventory.systemd_units=""
# meta:inventory.network=""
# meta:inventory.privileges="none"
#
# User-specific overrides can be placed in /etc/nftban/conf.d/*.conf
# Format: KEY="value"
# Lines starting with # are comments
# =============================================================================

# Prevent double-sourcing (for bash scripts)
[[ -n "${_NFTBAN_CONF_LOADED:-}" ]] && return 0 2>/dev/null || true
_NFTBAN_CONF_LOADED=1

# -----------------------------------------------------------------------------
# SYSTEM INFORMATION
# -----------------------------------------------------------------------------
# Note: NFTBAN_VERSION is read from VERSION file via version.sh (single source of truth)
NFTBAN_CONFIG_VERSION="2"

# -----------------------------------------------------------------------------
# BOOT & EMERGENCY CONFIGURATION
# -----------------------------------------------------------------------------
# Startup delay in seconds before firewall rules are loaded at boot.
# Use this for troubleshooting if firewall rules cause SSH lockout.
#
# How it works:
#   - DELAY=0 (default): Instant protection, firewall loads immediately at boot
#   - DELAY=300: 5-minute window to SSH in and fix issues before firewall loads
#
# Emergency options:
#   1. Set NFTBAN_STARTUP_DELAY=300 here for boot delay
#   2. Run "nftban disable all" to disable NFTBan completely
#   3. Add "nftban=disabled" to kernel command line at GRUB for single-boot disable
#
# Default: 0 (no delay - recommended for production)
NFTBAN_STARTUP_DELAY="0"

# -----------------------------------------------------------------------------
# DRIFT GUARD CONFIGURATION
# -----------------------------------------------------------------------------
# Drift Guard detects if conflicting firewalls (CSF, UFW, firewalld, fail2ban)
# are installed/enabled AFTER NFTBan is running. Runs every 15 minutes.
#
# Policy options:
#   auto      - Auto-disable conflicts (aggressive, recommended for dedicated servers)
#   alert     - Log warning + send email alert (safe default)
#   quarantine - Stop NFTBan to prevent firewall fight (defensive)
#   none      - Ignore conflicts (not recommended)
#
# Default: alert (safe - notifies admin without making changes)
NFTBAN_DRIFT_POLICY="alert"

# -----------------------------------------------------------------------------
# DAEMON RESOURCE CONFIGURATION
# -----------------------------------------------------------------------------
# Memory and CPU limits for the nftband daemon.
# These are READ by the daemon - systemd limits are just a safety net.
#
# The daemon auto-detects optimal limits based on server RAM tier:
#   - Small (≤4GB): 75K CIDRs, ~300MB memory budget
#   - Medium (4-8GB): 100K CIDRs, ~400MB memory budget
#   - Large (>8GB): 150K CIDRs, ~600MB memory budget
#
# Override only if needed (values in bytes):
# NFTBAN_MAX_MEMORY_BYTES="536870912"    # 512MB override
# NFTBAN_MAX_MEMORY_PERCENT="20"         # Max % of system RAM
# NFTBAN_GOMAXPROCS="2"                  # CPU cores to use
# NFTBAN_MAX_CONCURRENT_CONNS="100"      # Max concurrent connections
# NFTBAN_RATE_LIMIT_PER_MIN="60"         # API rate limit

# -----------------------------------------------------------------------------
# METRICS CONFIGURATION
# -----------------------------------------------------------------------------
# All metrics settings are in conf.d/metrics.conf
# User customizations go in conf.d/metrics.conf.local
#
# Key settings in metrics.conf:
#   NFTBAN_METRICS_ENABLED       - Master switch for metrics collection
#   NFTBAN_METRICS_BACKEND       - Backend type (prometheus)
#   NFTBAN_EXPORT_PROMETHEUS     - Enable Prometheus textfile export
#   NFTBAN_EXPORT_JSON           - Enable JSON cache export
#   NFTBAN_LOCAL_RETENTION       - Local data retention (1w-4w)
#   NFTBAN_METRICS_REMOTE_MODE   - Remote submission (none|user|pro)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# NFTBAN PRO SUBSCRIPTION
# -----------------------------------------------------------------------------
# Pro enabled (managed by nftban pro enable/disable)
# When enabled, the nftban-pro module collects raw data from this server
# (bans.log, metrics cache, reports, watchdog events) and submits
# aggregated context bundles to the Pro portal for AI-powered analysis.
# The free edition continues to operate normally - Pro is read-only.
NFTBAN_PRO_ENABLED="false"

# Pro license and identity
NFTBAN_PRO_TOKEN_FILE="/etc/nftban/pro.token"
NFTBAN_PRO_SERVER_ID_FILE="/etc/nftban/server_id"

# Pro data directory (queue, results, certs)
NFTBAN_PRO_DATA_DIR="/var/lib/nftban/pro"

# Pro API endpoints (override for enterprise/on-prem deployments)
NFTBAN_PRO_INGEST_URL="https://pro.nftban.com/api/v1/ingest"
NFTBAN_PRO_ANALYSIS_URL="https://pro.nftban.com/api/v1/analysis"
NFTBAN_PRO_REMOTE_WRITE_URL="https://pro.nftban.com/api/v1/write"
NFTBAN_PRO_INVENTORY_URL="https://pro.nftban.com/api/v1/inventory"
NFTBAN_PRO_STATUS_URL="https://pro.nftban.com/api/v1/enroll/status"

# Pro submission settings
NFTBAN_PRO_SUBMIT_INTERVAL="300"
NFTBAN_PRO_TIMEOUT="30"

# Pro privacy: hash IPs before sending (default: true)
NFTBAN_PRO_HASH_IPS="true"

# -----------------------------------------------------------------------------
# GEOIP CONFIGURATION
# -----------------------------------------------------------------------------
# Enable GeoIP blocking functionality
NFTBAN_GEOIP_ENABLED="false"

# GeoIP database path (auto-detected if empty)
# Supported: dbip-country-lite.mmdb (free), GeoLite2-City.mmdb, GeoLite2-Country.mmdb
# Leave empty to auto-detect from ${NFTBAN_DATA_DIR}/geoip/
NFTBAN_GEOIP_DATABASE=""

# Supported database files in priority order (for auto-detection)
NFTBAN_GEOIP_DATABASES="dbip-country-lite.mmdb GeoLite2-City.mmdb GeoLite2-Country.mmdb"

# MaxMind License Key (optional - only needed for MaxMind GeoLite2 databases)
# The default free database (DB-IP) does not require a license key
# Get your MaxMind key at: https://www.maxmind.com/en/geolite2/signup
#NFTBAN_GEOIP_LICENSE_KEY=""

# -----------------------------------------------------------------------------
# THREAT FEEDS
# -----------------------------------------------------------------------------
# Enable threat intelligence feeds
NFTBAN_FEEDS_ENABLED="false"

# Automatic feed updates
NFTBAN_FEEDS_AUTO_UPDATE="true"

# -----------------------------------------------------------------------------
# SURICATA IDS INTEGRATION
# -----------------------------------------------------------------------------
# Enable Suricata IDS integration (replaces fail2ban in v1.0)
NFTBAN_SURICATA_ENABLED="false"

# Suricata alert-only EVE output (daemon reads this file)
NFTBAN_SURICATA_EVE_LOG="/var/log/nftban/suricata/eve-alerts.json"
NFTBAN_SURICATA_LOG_DIR="/var/log/nftban/suricata"

# IP scoring threshold (ban after this score)
NFTBAN_SURICATA_BAN_THRESHOLD="100"

# Score decay time (seconds)
NFTBAN_SURICATA_SCORE_DECAY="3600"

# Cloudflare IP whitelist
NFTBAN_SURICATA_CLOUDFLARE_WHITELIST="false"

# -----------------------------------------------------------------------------
# WEB GUI
# -----------------------------------------------------------------------------
# Enable web GUI
NFTBAN_GUI_ENABLED="false"

# GUI listen address
NFTBAN_GUI_ADDR="127.0.0.1:3940"

# -----------------------------------------------------------------------------
# SECURITY FEATURES
# -----------------------------------------------------------------------------
# Enable port scan detection (enabled by default)
NFTBAN_PORTSCAN_ENABLED="true"

# Enable DDoS protection (disabled by default - enable with: nftban ddos enable)
NFTBAN_DDOS_ENABLED="false"

# Enable login monitoring (built-in, no fail2ban dependency)
# Monitors /var/log/auth.log or /var/log/secure for SSH brute force attacks
NFTBAN_LOGIN_MONITOR_ENABLED="true"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
# Log level: DEBUG, INFO, WARN, ERROR
NFTBAN_LOG_LEVEL="INFO"

# Enable colored output
NFTBAN_COLOR_OUTPUT="true"

# -----------------------------------------------------------------------------
# DEBUG TRACE (For troubleshooting stuck/failed scripts)
# -----------------------------------------------------------------------------
# When enabled, each script logs START/END with unique trace ID
# If a script has START without matching END = script is stuck/crashed
# Debug trace log: /var/log/nftban/debug_trace.log
NFTBAN_DEBUG_TRACE="false"

# Debug trace log file
NFTBAN_DEBUG_TRACE_LOG="/var/log/nftban/debug_trace.log"

# -----------------------------------------------------------------------------
# TIMEOUTS (seconds)
# -----------------------------------------------------------------------------
# Network and command timeouts - used across CLI and Go components
NFTBAN_TIMEOUT_FAST="5"           # Quick operations (curl connect, simple checks)
NFTBAN_TIMEOUT_MEDIUM="30"        # Standard operations (nft commands, API calls)
NFTBAN_TIMEOUT_SLOW="120"         # Long operations (large feed downloads)
NFTBAN_TIMEOUT_HTTP_DEFAULT="60"  # Default HTTP client timeout
NFTBAN_TIMEOUT_HTTP_LONG="300"    # Extended HTTP timeout (GeoIP downloads)
NFTBAN_TIMEOUT_IPC_SOCKET="300"   # IPC socket deadline for sync operations (5 min)
NFTBAN_TIMEOUT_SYNC="600"         # Full sync timeout including feeds/geoban (10 min)

# -----------------------------------------------------------------------------
# HEALTH CHECK PARAMETERS
# -----------------------------------------------------------------------------
# Health monitoring thresholds
NFTBAN_HEALTH_FILE_AGE_THRESHOLD="600"    # seconds - max age for monitored files
NFTBAN_HEALTH_MEMORY_WARNING="600"        # MB - memory usage warning threshold
NFTBAN_ALERT_THROTTLE_SECONDS="3600"      # seconds - throttle repeated alerts

# -----------------------------------------------------------------------------
# CACHE CONTROL
# -----------------------------------------------------------------------------
# Cache TTL settings (seconds)
NFTBAN_STATS_CACHE_TTL="300"              # Stats cache (5 minutes)
NFTBAN_BANDWIDTH_CACHE_TTL="10"           # Bandwidth metrics cache

# -----------------------------------------------------------------------------
# NFTABLES TABLE CONFIGURATION
# -----------------------------------------------------------------------------
# Canonical nftables table names - used by all components
# Default: Separate ip/ip6 tables (cleaner, better performance)
# Alternative: Single inet table (set NFTBAN_TABLE_FAMILY="inet")
#
NFTBAN_TABLE_FAMILY="ip"
NFTBAN_TABLE_NAME="nftban"
NFTBAN_TABLE_IPV4="ip nftban"
NFTBAN_TABLE_IPV6="ip6 nftban"

# For inet family (single table with _v4/_v6 suffixed sets):
# NFTBAN_TABLE_FAMILY="inet"
# NFTBAN_TABLE_INET="inet nftban"

# -----------------------------------------------------------------------------
# PATHS (DO NOT MODIFY UNLESS YOU KNOW WHAT YOU'RE DOING)
# -----------------------------------------------------------------------------
# Canonical binary paths - used by all scripts for consistency
NFTBAN_BIN="/usr/sbin/nftban"
NFTBAN_CORE_BIN="/usr/lib/nftban/bin/nftban-core"
NFTBAN_UI_BIN="/usr/sbin/nftban-ui"
NFTBAN_AUTH_BIN="/usr/libexec/nftban-ui-auth"

# Directory paths (FHS standard - do not modify)
# NOTE: Use ':=' pattern to avoid overwriting if scripts already set these as readonly
: "${NFTBAN_LIB_DIR:=/usr/lib/nftban}"
: "${NFTBAN_SHARE_DIR:=/usr/share/nftban}"
: "${NFTBAN_TESTS_DIR:=/usr/lib/nftban/tests}"
: "${NFTBAN_CONFIG_DIR:=/etc/nftban}"
: "${NFTBAN_DATA_DIR:=/var/lib/nftban}"
: "${NFTBAN_LOG_DIR:=/var/log/nftban}"
: "${NFTBAN_CACHE_DIR:=/var/cache/nftban}"
: "${NFTBAN_RUN_DIR:=/run/nftban}"
: "${NFTBAN_POLKIT_RULES_DIR:=/etc/polkit-1/rules.d}"

# Log files (all under NFTBAN_LOG_DIR)
NFTBAN_BAN_LOG="${NFTBAN_LOG_DIR}/bans.log"
NFTBAN_ACTIONS_LOG="${NFTBAN_LOG_DIR}/nftban-actions.log"
NFTBAN_PORTSCAN_LOG="${NFTBAN_LOG_DIR}/portscan.log"
NFTBAN_LOGIN_MONITOR_LOG="${NFTBAN_LOG_DIR}/login_alert.log"
NFTBAN_CLOUDFLARE_LOG="${NFTBAN_LOG_DIR}/cloudflare.log"
NFTBAN_MAINTENANCE_LOG="${NFTBAN_LOG_DIR}/maintenance.log"
NFTBAN_CLI_ERROR_LOG="${NFTBAN_LOG_DIR}/cli-errors.log"

# -----------------------------------------------------------------------------
# DISTRO CONFIGURATION
# -----------------------------------------------------------------------------
# Distro config directory (auto-detected distro config loaded from here)
NFTBAN_DISTRO_CONF_DIR="/etc/nftban/distros"

# -----------------------------------------------------------------------------
# NFTBAN SYSTEMD SERVICE NAMES (Central Reference)
# -----------------------------------------------------------------------------
# NFTBan's own services - same across all distros
# External services (prometheus, node_exporter) are in distros/*.conf

# Core services
NFTBAN_SERVICE_DAEMON="nftband.service"
NFTBAN_SOCKET_DAEMON="nftband.socket"
NFTBAN_SERVICE_CORE="nftban-core.service"
NFTBAN_SERVICE_UI="nftban-ui.service"

# Timer-based services
NFTBAN_SERVICE_QUEUE="nftban-queue.service"
NFTBAN_SERVICE_MAINTENANCE="nftban-maintenance.service"
NFTBAN_SERVICE_HEALTH="nftban-health.service"
NFTBAN_SERVICE_METRICS_EXPORTER="nftban-unified-exporter.service"
NFTBAN_SERVICE_BANDWIDTH_EXPORTER="nftban-bandwidth-exporter.service"

# Feature services
NFTBAN_SERVICE_LOGIN_MONITOR="nftban-login-monitor.service"
NFTBAN_SERVICE_SURICATA="nftban-suricata.service"

# Timers
NFTBAN_TIMER_QUEUE="nftban-queue.timer"
NFTBAN_TIMER_MAINTENANCE="nftban-maintenance.timer"
NFTBAN_TIMER_HEALTH="nftban-health.timer"
NFTBAN_TIMER_METRICS_EXPORTER="nftban-unified-exporter.timer"
NFTBAN_TIMER_BANDWIDTH_EXPORTER="nftban-bandwidth-exporter.timer"
NFTBAN_TIMER_FEEDS="nftban-core-feeds.timer"
NFTBAN_TIMER_GEOIP="nftban-core-geoip.timer"
NFTBAN_TIMER_SURICATA_UPDATE="nftban-suricata-update.timer"
NFTBAN_TIMER_WATCHDOG="nftban-watchdog.timer"
NFTBAN_SERVICE_WATCHDOG="nftban-watchdog.service"

# -----------------------------------------------------------------------------
# WATCHDOG CONFIGURATION
# -----------------------------------------------------------------------------
# All watchdog settings are in conf.d/watchdog.conf
# User customizations go in conf.d/watchdog.conf.local
#
# Key settings in watchdog.conf:
#   NFTBAN_WATCHDOG_ENABLED      - Enable system resource monitoring
#   NFTBAN_WATCHDOG_INTERVAL     - Check interval (seconds)
#   NFTBAN_WATCHDOG_LOAD_*       - Load average thresholds
#   NFTBAN_WATCHDOG_MEM_*        - Memory thresholds
#   NFTBAN_WATCHDOG_DISK_*       - Disk usage thresholds
#   NFTBAN_DYNAMIC_WATCHDOG_*    - Dynamic auto-alignment settings
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# EXTERNAL SERVICE REFERENCES (mapped per-distro in distros/*.conf)
# -----------------------------------------------------------------------------
# These vary by distro - use nftban_distro_get_service() to resolve:
#   - prometheus        : Metrics collection
#   - node_exporter     : System metrics (prometheus-node-exporter on RHEL)
#   - suricata          : Suricata IDS
#   - nftables          : Kernel firewall
#   - cron              : Cron daemon (crond on RHEL, cron on Debian)

# -----------------------------------------------------------------------------
# TASK QUEUE CONFIGURATION (Async processing with retry/DLQ)
# -----------------------------------------------------------------------------
# Maximum retry attempts before moving to dead-letter queue
NFTBAN_QUEUE_MAX_RETRIES="3"

# Exponential backoff: delay = min(max, base * 2^retries)
NFTBAN_QUEUE_BACKOFF_BASE_SECONDS="30"
NFTBAN_QUEUE_BACKOFF_MAX_SECONDS="900"

# Queue directories (subdirs of DATA_DIR/queue)
NFTBAN_QUEUE_PENDING_DIR="${NFTBAN_DATA_DIR}/queue/pending"
NFTBAN_QUEUE_WORK_DIR="${NFTBAN_DATA_DIR}/queue/work"
NFTBAN_QUEUE_DLQ_DIR="${NFTBAN_DATA_DIR}/queue/dlq"

# Stuck lock recovery threshold (seconds) - auto-kill after this
NFTBAN_QUEUE_LOCK_STUCK_THRESHOLD="1200"

# CWE-400 mitigation: Queue capacity limits
NFTBAN_QUEUE_MAX_PENDING="10000"
NFTBAN_QUEUE_DLQ_AUTO_RETENTION_DAYS="7"

# Queue metrics file (for Prometheus)
NFTBAN_QUEUE_METRICS_FILE="${NFTBAN_DATA_DIR}/metrics/queue.prom"

# -----------------------------------------------------------------------------
# MAIL DELIVERY CONFIGURATION (Retry + Spool)
# -----------------------------------------------------------------------------
# Mail retry attempts (inline, before spooling)
NFTBAN_MAIL_RETRY_ATTEMPTS="3"

# Mail retry backoff (seconds): 5, 15, 45
NFTBAN_MAIL_RETRY_BACKOFF="5,15,45"

# SMTP timeouts (used when transport is curl direct SMTP)
# Preferred naming: NFTBAN_SMTP_*
# Legacy alias: NFTBAN_CURL_* (deprecated, kept for compatibility)
NFTBAN_SMTP_CONNECT_TIMEOUT="10"
NFTBAN_SMTP_MAX_TIME="30"

# Mail spool directory (failed mails queued here)
NFTBAN_MAIL_SPOOL_DIR="${NFTBAN_DATA_DIR}/mailspool"

# Mail metrics file (for Prometheus)
NFTBAN_MAIL_METRICS_FILE="${NFTBAN_DATA_DIR}/metrics/mail.prom"

# -----------------------------------------------------------------------------
# ZABBIX EXPORTER CONFIGURATION
# -----------------------------------------------------------------------------
# See conf.d/zabbix.conf for Zabbix export settings

# -----------------------------------------------------------------------------
# CONNECTOR CONFIGURATION
# -----------------------------------------------------------------------------
# All connector settings are in conf.d/connectors.conf
# User customizations go in conf.d/connectors.conf.local
#
# Key settings in connectors.conf:
#   NFTBAN_CONNECTOR_ENABLED         - Master switch for connector framework
#   NFTBAN_CONNECTOR_FIREWALL_AUTO   - Auto-configure firewall rules
#   NFTBAN_CONNECTOR_ES_ENABLED      - Elasticsearch export
#   NFTBAN_CONNECTOR_KAFKA_ENABLED   - Kafka export
#   NFTBAN_CONNECTOR_FILE_ENABLED    - File (NDJSON) export
#   NFTBAN_CONNECTOR_SYSLOG_ENABLED  - Syslog export
#   NFTBAN_CONNECTOR_WEBHOOK_ENABLED - Webhook export
# -----------------------------------------------------------------------------

# Connector config directory (YAML files) - system path reference
NFTBAN_CONNECTOR_CONFIG_DIR="${NFTBAN_CONFIG_DIR}/connectors"

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
