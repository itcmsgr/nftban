# =============================================================================
# BANNER MODE
# =============================================================================
# Controls what banner/header is shown when running nftban commands
# Values: full | simple | minimal | none | auto
#
# full    - Full decorative banner with stats, hostname, kernel
#           ╭───────────────────────────────────────────────╮
#           │  NFTBan v1.0.0 @ lab · 6.6.56-1.el9           │
#           │         ban · unban · protect                 │
#           │    tables 2 · chains 4 · rules 12 · bans 134 │
#           ╰───────────────────────────────────────────────╯
#
# simple  - One-line version banner
#           NFTBan v1.0.0
#
# minimal - No banner, just command output
#
# none    - Suppress all banners (automation-friendly)
#
# auto    - Smart default (RECOMMENDED):
#           - Interactive (TTY):  full banner
#           - Piped/scripted:     minimal (no banner)
#           - DEBUG_MODE=true:    full banner (always)
#
# DO NOT EDIT THIS FILE FOR PERMANENT CHANGES!
# Your changes will be lost during package updates.
#
# TO CUSTOMIZE:
#   1. Copy setting to /etc/nftban/nftban.conf.local
#   2. Uncomment and modify in .local file
#   3. .local file is NEVER overwritten by updates
#

NFTBAN_BANNER_MODE="auto"

# =============================================================================
# MODULE LOAD LEVEL
# =============================================================================
# Controls module load messages visibility
# Values: none | error | info | debug | verbose | auto
#
# none    - Never show module load messages
#
# error   - Only show if module fails to load
#
# info    - Show module name and version (DEFAULT)
#           [INFO] Feed Management Module loaded (v1.0.0)
#
# debug   - Show detailed info (meta fields, timing)
#           [DEBUG] Module loaded in 0.023s:
#             Name:     nftban_feeds
#             Version:  1.0.0
#             Type:     module
#             Depends:  nftban_core, nftban_utils
#
# verbose - Maximum detail (dependencies, load order, functions)
#
# auto    - Smart default (RECOMMENDED):
#           - Normal mode:      info
#           - DEBUG_MODE=true:  debug
#
NFTBAN_MODULE_LOAD_LEVEL="auto"

# Module load message format (for info level)
# Uses meta: fields from module headers
# Available: {name}, {version}, {type}, {header}, {description}
#
# Examples:
#   "[INFO] {header} loaded (v{version})"
#   "[INFO] {name} v{version} ready"
#
NFTBAN_MODULE_LOAD_FORMAT="[INFO] {header} loaded (v{version})"

# =============================================================================
# TROUBLESHOOTING HELPERS (auto = enabled when DEBUG_MODE=true)
# =============================================================================

# Show configuration source (which file set each variable)
# Helps answer: "Why isn't my setting working?"
# auto = show only when DEBUG_MODE=true
NFTBAN_SHOW_CONFIG_SOURCE="auto"

# Show module load timing (how long each module takes to load)
# Helps identify slow modules
# auto = show only when DEBUG_MODE=true
NFTBAN_SHOW_LOAD_TIMING="auto"

# Show dependency chain (which modules depend on what)
# Helps diagnose missing dependencies
# auto = show only when DEBUG_MODE=true
NFTBAN_SHOW_DEPENDENCIES="auto"

# Show environment info (user, permissions, paths)
# Helps diagnose permission issues
# auto = show only when DEBUG_MODE=true
NFTBAN_SHOW_ENVIRONMENT="auto"

# Show quick help/hints in banner
# Helpful commands and tips
NFTBAN_SHOW_HINTS="true"

# Show log file paths
# Where to find detailed logs
# auto = show only when DEBUG_MODE=true
NFTBAN_SHOW_LOG_PATHS="auto"

# =============================================================================
# BANNER COMPONENTS
# =============================================================================

# Show emoji/unicode or ASCII
# auto = detect from locale (UTF-8 = emoji, C = ASCII)
NFTBAN_BANNER_EMOJI="auto"

# Show hostname in banner
NFTBAN_BANNER_HOSTNAME="true"

# Show kernel version in banner
NFTBAN_BANNER_KERNEL="true"

# Show system statistics (tables, chains, rules, bans)
# Queries nftables for current state
NFTBAN_BANNER_STATS="true"

# Show motto/tagline
NFTBAN_BANNER_MOTTO="true"

# Motto text (customize if you want)
NFTBAN_MOTTO="ban · unban · protect"

# Update check (requires network, checks GitHub for new version)
# Disabled by default for privacy/performance
NFTBAN_BANNER_UPDATE_CHECK="false"

# GitHub repository for update check (if enabled)
# Format: owner/repo
NFTBAN_REPO="nftban/nftban"

# Update check cache TTL (seconds)
NFTBAN_UPDATE_TTL="86400"           # 24 hours

# =============================================================================
# OUTPUT FORMATTING
# =============================================================================

# Enable colors in output
# auto = enabled if TTY, disabled if piped
NFTBAN_COLOR="auto"

# Terminal width
# auto = detect from terminal, fallback to 80
NFTBAN_WIDTH="auto"

# Show timestamps in output
NFTBAN_TIMESTAMPS="true"

# Timestamp format (strftime format)
NFTBAN_TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"

# =============================================================================
# ERROR/WARNING DISPLAY
# =============================================================================

# Show error banners (always shown, even in minimal mode)
NFTBAN_ERROR_BANNER="true"

# Error banner style
# box     - Full decorative box with borders
# line    - Single line with [ERROR] prefix
# minimal - Plain text "ERROR: message"
NFTBAN_ERROR_BANNER_STYLE="box"

# Show warning banners
NFTBAN_WARNING_BANNER="true"

# Warning banner style
# line    - Single line with [WARNING] prefix (default)
# minimal - Plain text "WARNING: message"
NFTBAN_WARNING_BANNER_STYLE="line"

# =============================================================================
# PROGRESS INDICATORS
# =============================================================================

# Show progress for long-running operations
# auto = show if TTY
NFTBAN_PROGRESS="auto"

# Progress style
# spinner - Rotating spinner
# bar     - Progress bar [========] 80%
# dots    - Animated dots ...
# minimal - Simple text updates
NFTBAN_PROGRESS_STYLE="spinner"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Honor NO_COLOR environment variable (disables all colors)
# Standard: https://no-color.org/
# This is always respected, regardless of NFTBAN_COLOR setting

# Suppress output for specific commands (space-separated)
# Example: "version help"
NFTBAN_SUPPRESS_BANNER_FOR=""

# =============================================================================
# END OF BANNER CONFIGURATION
# =============================================================================
