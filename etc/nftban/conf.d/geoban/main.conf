#       For user customizations, use: geoban/main.conf.local
# =============================================================================

# -----------------------------------------------------------------------------
# FEATURE TOGGLE
# -----------------------------------------------------------------------------

# Enable/disable GeoBan module
# Default: true (enabled)
GEOBAN_ENABLED="true"

# -----------------------------------------------------------------------------
# BLOCKING MODE
# -----------------------------------------------------------------------------

# Use atomic nftables operations for better performance
# true  = Single atomic transaction (faster, recommended)
# false = Individual rule additions (slower, more logging)
GEOBAN_ATOMIC="true"

# Default policy for unlisted countries
# allow = Allow by default, only block listed countries
# deny  = Deny by default, only allow listed countries
GEOBAN_DEFAULT_POLICY="allow"

# -----------------------------------------------------------------------------
# PATHS (uses central config - rarely need to change)
# -----------------------------------------------------------------------------

# Directory containing country block/allow lists
# Files: blocked.list, allowed.list (one country code per line)
# GEOBAN_FILES_DIR="${NFTBAN_CONFIG_DIR}/geoban.d"

# Cache directory for compiled IP ranges
# GEOBAN_CACHE_DIR="${NFTBAN_CACHE_DIR}/geoban"

# Tracking directory for statistics
# GEOBAN_TRACKING_DIR="${NFTBAN_DATA_DIR}/geoban/tracking"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Enable GeoBan-specific logging
GEOBAN_LOGGING="true"

# Log blocked connections (can be verbose on high-traffic servers)
GEOBAN_LOG_BLOCKS="false"

# =============================================================================
# COUNTRY LISTS
# =============================================================================
# Country lists are managed via files in ${NFTBAN_CONFIG_DIR}/geoban.d/
#
# To block countries:
#   echo "CN" >> /etc/nftban/geoban.d/blocked.list
#   echo "RU" >> /etc/nftban/geoban.d/blocked.list
#   nftban geoban reload
#
# To allow specific countries (when GEOBAN_DEFAULT_POLICY=deny):
#   echo "US" >> /etc/nftban/geoban.d/allowed.list
#   echo "GB" >> /etc/nftban/geoban.d/allowed.list
#   nftban geoban reload
#
# Country codes use ISO 3166-1 alpha-2 format (e.g., US, GB, DE, CN, RU)
# =============================================================================
