# =============================================================================
# NFTBan v0.32.0 - Go Binary Common Configuration
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Unified configuration for all Go-based operations (feeds, geoban, geoip)
#
# This file contains common settings shared across:
#   - nftban-feeds (threat intelligence feeds)
#   - nftban-geoip geoban (country-based blocking)
#   - nftban-geoip lookup (GeoIP lookups)
# =============================================================================

# =============================================================================
# SYSTEM SAFETY SETTINGS (All Go Operations)
# =============================================================================

# CPU Protection
GO_MAX_CPU_PERCENT="80"                         # Max CPU usage before throttling (%)
GO_CPU_CHECK_INTERVAL="5"                       # CPU monitoring interval (seconds)
GO_CPU_THROTTLE_DELAY="100"                     # Throttle delay when over limit (ms)

# Memory Protection
GO_MAX_MEMORY_MB="4096"                         # Max memory usage (MB, 0=unlimited)
GO_MEMORY_PREFLIGHT_CHECK="true"                # Check available memory before large operations
GO_MEMORY_SAFETY_MARGIN="512"                   # Reserve this much RAM for system (MB)

# Network Protection
GO_DOWNLOAD_TIMEOUT="30"                        # HTTP download timeout (seconds)
GO_MAX_DOWNLOAD_SIZE_MB="50"                    # Max file download size (MB)
GO_CONNECTION_TIMEOUT="10"                      # Connection timeout (seconds)
GO_MAX_RETRIES="3"                              # Max retry attempts on failure

# Netlink/NFTables Protection
GO_NFT_CHUNK_SIZE="4096"                        # Elements per nftables transaction
GO_NFT_ENOBUFS_RETRY="true"                     # Retry on ENOBUFS (buffer full) errors
GO_NFT_ENOBUFS_MAX_RETRIES="5"                  # Max ENOBUFS retries
GO_NFT_ENOBUFS_RETRY_DELAY="1000"               # Delay between retries (ms)
GO_NFT_TRANSACTION_TIMEOUT="30"                 # Transaction timeout (seconds)

# Delta Limiting (Prevent massive changes)
GO_DELTA_LIMIT_ENABLED="true"                   # Enable delta limiting
GO_DELTA_MAX_MULTIPLIER="10"                    # Max size increase (10x = 1000%)
GO_DELTA_MIN_ENTRIES="100"                      # Minimum entries before delta check applies

# Logging
GO_LOG_LEVEL="INFO"                             # DEBUG, INFO, WARN, ERROR
GO_LOG_FILE="/var/log/nftban/go-operations.log" # Unified Go operations log
GO_LOG_MAX_SIZE_MB="50"                         # Max log file size before rotation
GO_LOG_MAX_BACKUPS="5"                          # Number of old log files to keep

# =============================================================================
# CACHING SETTINGS (HTTP ETag Support)
# =============================================================================

# HTTP Caching
GO_CACHE_ENABLED="true"                         # Enable ETag-based HTTP caching
GO_CACHE_DIR="/var/cache/nftban/go-cache"       # Cache directory
GO_CACHE_MAX_AGE="86400"                        # Max cache age (seconds, 24h)
GO_CACHE_MAX_SIZE_MB="500"                      # Max total cache size (MB)

# User-Agent
GO_USER_AGENT="NFTBan/0.32.0 (+https://nftban.com)"

# =============================================================================
# THREAT FEEDS SETTINGS
# =============================================================================

# Feeds Master Switch
FEEDS_ENABLED="true"

# Feeds Update Settings
FEEDS_UPDATE_INTERVAL="3600"                    # 1 hour (seconds)
FEEDS_AUTO_UPDATE="true"                        # Auto-update via timer
FEEDS_MIN_ENTRIES="10"                          # Minimum valid entries
FEEDS_MAX_ENTRIES="500000"                      # Maximum entries (truncate if exceeded)

# Feeds Paths
FEEDS_STORAGE_DIR="/var/lib/nftban/feeds"       # Parsed feed files
FEEDS_CACHE_DIR="/var/cache/nftban/feeds"       # Download cache
FEEDS_TRACKING_DIR="/var/lib/nftban/feeds/tracking" # Feed tracking metadata

# Feeds Logging
FEEDS_LOG_DOWNLOADS="true"                      # Log all download attempts
FEEDS_LOG_PARSING="true"                        # Log parsing details

# =============================================================================
# GEOBAN SETTINGS (Country-Based Blocking)
# =============================================================================

# GeoBan Master Switch
GEOBAN_ENABLED="true"

# GeoBan Countries (comma-separated ISO alpha-2 codes)
GEOBAN_BANNED_COUNTRIES=""                      # e.g., "CN,RU,KP" (empty = none)
GEOBAN_WHITELISTED_COUNTRIES=""                 # e.g., "US,GB,DE" (empty = none)

# GeoBan Update Settings
GEOBAN_UPDATE_INTERVAL="86400"                  # 24 hours (seconds)
GEOBAN_AUTO_UPDATE="true"                       # Auto-update via timer
GEOBAN_SOURCE="ipdeny"                          # Source: ipdeny (only option currently)

# GeoBan Paths
GEOBAN_FILES_DIR="/etc/nftban/geoban.d"         # Country IP configuration files
GEOBAN_CACHE_DIR="/var/cache/nftban/geoban"     # HTTP cache for country files
GEOBAN_TRACKING_DIR="/var/lib/nftban/geoban/tracking" # Tracking metadata

# GeoBan Atomic Operations
GEOBAN_ATOMIC="true"                            # Use atomic nftables operations
GEOBAN_VALIDATE_BEFORE_LOAD="true"              # Validate IPs before loading

# GeoBan Logging
GEOBAN_LOG_DOWNLOADS="true"                     # Log country file downloads
GEOBAN_LOG_NFTABLES="true"                      # Log nftables operations

# =============================================================================
# GEOIP SETTINGS (IP Geolocation Lookups)
# =============================================================================

# GeoIP Master Switch
GEOIP_ENABLED="true"

# MaxMind GeoLite2 Database
GEOIP_DATABASE="/var/lib/nftban/geoip/GeoLite2-City.mmdb"
GEOIP_AUTO_UPDATE="true"                        # Auto-update database
GEOIP_UPDATE_INTERVAL="604800"                  # Weekly (seconds)

# MaxMind License (Required for auto-updates)
MAXMIND_LICENSE_KEY=""                          # Get free key from maxmind.com
MAXMIND_ACCOUNT_ID=""                           # Your MaxMind account ID

# GeoIP Cache
GEOIP_CACHE_ENABLED="true"                      # Cache lookup results
GEOIP_CACHE_SIZE="10000"                        # Max cached entries
GEOIP_CACHE_TTL="3600"                          # Cache TTL (seconds, 1h)

# =============================================================================
# NFTABLES INTEGRATION
# =============================================================================

# NFTables Table/Set Names
NFT_TABLE_MAIN="nftban_main"
NFT_TABLE_RUNTIME="nftban_runtime"

# Feed Sets
NFT_SET_FEED_V4="feed_v4"
NFT_SET_FEED_V6="feed_v6"

# GeoBan Sets
NFT_SET_GEOBAN_V4="blacklist_v4"                # Ban list IPv4
NFT_SET_GEOBAN_V6="blacklist_v6"                # Ban list IPv6
NFT_SET_GEOWL_V4="whitelist_v4"                 # Whitelist IPv4
NFT_SET_GEOWL_V6="whitelist_v6"                 # Whitelist IPv6

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# THREAT FEEDS:
#   Enable feeds in feeds.conf, then:
#   sudo nftban feeds update
#
# GEOBAN (Country Blocking):
#   sudo nftban geoip ban CN RU        # Ban China and Russia
#   sudo nftban geoip unban CN         # Remove China ban
#   sudo nftban geoip whitelist US GB  # Whitelist US and UK
#   sudo nftban geoip list             # Show all country blocks
#
# GEOIP (Lookups):
#   nftban geoip lookup 8.8.8.8
#   nftban geoip bulk < ips.txt
#
# MONITORING:
#   tail -f /var/log/nftban/go-operations.log
#   nftban feeds status
#   nftban geoip status
#
# SAFETY TUNING:
#   Adjust GO_MAX_CPU_PERCENT, GO_MAX_MEMORY_MB based on your system
#   Recommended: 80% CPU, 4GB RAM on systems with 8GB+ total RAM
#
# =============================================================================
