    - "nftban firewall validate"
    - "nftban firewall check 1.2.3.4"
    - "nftban firewall check 22"
    - "nftban firewall stats"
    - "nftban firewall logs show --live"
    - "nftban firewall logs enable --level drops"
    - "nftban firewall reload"
  subcommands:
    validate:
      mutates: false
      description: "Validate nftables structure"
    check:
      mutates: false
      description: "Check if IP or port is blocked/allowed"
    stats:
      mutates: false
      description: "Show firewall statistics"
    reload:
      mutates: true
      requires_root: true
      description: "Reload nftables ruleset"
    logs:
      mutates: conditional
      requires_root: conditional
      description: "On-demand firewall log viewer with filtering"
      subcommands:
        enable:
          mutates: true
          requires_root: true
          description: "Enable firewall logging (modifies nftables rules)"
          options:
            --level:
              type: enum
              values: [drops, accepts, all, alert]
              default: drops
              description: "Logging level"
            --reason:
              type: string
              description: "Comma-separated reasons"
            --rate:
              type: string
              default: "10/second"
              description: "Rate limit for log entries"
            --burst:
              type: string
              default: "50 packets"
              description: "Burst limit for log entries"
        disable:
          mutates: true
          requires_root: true
          description: "Disable firewall logging (zero overhead)"
        status:
          mutates: false
          description: "Show logging configuration and statistics"
        show:
          mutates: false
          description: "View and filter firewall logs"
          options:
            --lines:
              type: int
              alias: "-n"
              default: 50
              description: "Number of entries"
            --since:
              type: string
              description: "Time filter (e.g., '10 min ago')"
            --live:
              type: bool
              alias: "-f"
              description: "Live tail mode"
            --interval:
              type: int
              alias: "-i"
              default: 3
              description: "Refresh interval (seconds)"
            --ip:
              type: string
              description: "Filter by IP"
            --src:
              type: string
              description: "Filter by source IP"
            --dst:
              type: string
              description: "Filter by destination IP"
            --port:
              type: string
              description: "Filter by port"
            --proto:
              type: enum
              values: [tcp, udp, icmp]
              description: "Filter by protocol"
            --action:
              type: enum
              values: [drop, accept]
              description: "Filter by action"
            --reason:
              type: string
              description: "Filter by reason"
            --json:
              type: bool
              description: "JSON output format"
            --csv:
              type: bool
              description: "CSV output format"
            --table:
              type: bool
              description: "Plain table output"
            --raw:
              type: bool
              description: "Raw kernel log format"

