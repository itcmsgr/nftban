# =============================================================================
# NFTBan Prometheus Alert Rules
# =============================================================================
# Location: /etc/prometheus/alerts/nftban-metrics.yml
#
# These alert rules monitor NFTBan metrics for issues and anomalies.
#
# Installation:
#   1. Copy to /etc/prometheus/alerts/nftban-metrics.yml
#   2. Add to prometheus.yml:
#      rule_files:
#        - /etc/prometheus/alerts/nftban-metrics.yml
#   3. Reload Prometheus: systemctl reload prometheus
#
# Testing:
#   promtool check rules /etc/prometheus/alerts/nftban-metrics.yml
# =============================================================================

groups:
  # NFTBan Metrics Exporter Health
  - name: nftban_exporter
    interval: 60s
    rules:
      # Alert if metrics exporter is down
      - alert: NFTBanMetricsDown
        expr: up{job="nftban"} == 0
        for: 5m
        labels:
          severity: warning
          component: metrics
          service: nftban-exporter
        annotations:
          summary: "NFTBan metrics exporter is down"
          description: "Node Exporter cannot scrape NFTBan metrics for {{ $labels.instance }}. Last successful scrape was {{ $value | humanizeDuration }} ago."
          action: "Check systemctl status nftban-unified-exporter.service and journalctl -u nftban-unified-exporter.service"

      # Alert if metrics collection is slow
      - alert: NFTBanMetricsCollectionSlow
        expr: nftban_exporter_duration_seconds > 5
        for: 5m
        labels:
          severity: warning
          component: metrics
          service: nftban-exporter
        annotations:
          summary: "NFTBan metrics collection is slow"
          description: "Metrics collection taking {{ $value | humanizeDuration }} (threshold: 5s). Performance issue suspected on {{ $labels.instance }}."
          action: "Check system load, disk I/O, and NFTBan service status"

      # Alert if metrics are stale
      - alert: NFTBanMetricsStale
        expr: (time() - nftban_exporter_last_success_timestamp) > 300
        for: 5m
        labels:
          severity: warning
          component: metrics
          service: nftban-exporter
        annotations:
          summary: "NFTBan metrics are stale"
          description: "Last metrics update was {{ $value | humanizeDuration }} ago on {{ $labels.instance }}. Exporter may be failing."
          action: "Check systemctl status nftban-unified-exporter.timer and nftban-unified-exporter.service"

  # NFTBan Firewall Health
  - name: nftban_firewall
    interval: 60s
    rules:
      # Alert if any component is in critical state
      - alert: NFTBanComponentCritical
        expr: nftban_health_status >= 3
        for: 2m
        labels:
          severity: critical
          component: firewall
          service: nftban
        annotations:
          summary: "NFTBan component in critical state"
          description: "Component {{ $labels.component }} has critical health status ({{ $value }}) on {{ $labels.instance }}. Immediate attention required."
          action: "Run 'nftban health' to diagnose, check journalctl -u nftban"

      # Alert if any component is in error state
      - alert: NFTBanComponentError
        expr: nftban_health_status == 2
        for: 5m
        labels:
          severity: error
          component: firewall
          service: nftban
        annotations:
          summary: "NFTBan component in error state"
          description: "Component {{ $labels.component }} has error status ({{ $value }}) on {{ $labels.instance }}."
          action: "Run 'nftban health' to diagnose"

      # Alert if any component is in warning state
      - alert: NFTBanComponentWarning
        expr: nftban_health_status == 1
        for: 15m
        labels:
          severity: warning
          component: firewall
          service: nftban
        annotations:
          summary: "NFTBan component in warning state"
          description: "Component {{ $labels.component }} has warning status ({{ $value }}) on {{ $labels.instance }}."
          action: "Review component status with 'nftban health'"

  # NFTBan Block Statistics
  - name: nftban_blocks
    interval: 60s
    rules:
      # Alert if block count is very high
      - alert: NFTBanHighBlockCount
        expr: nftban_blocks_total > 10000
        for: 10m
        labels:
          severity: info
          component: firewall
          service: nftban
        annotations:
          summary: "High number of blocked IPs"
          description: "Currently blocking {{ $value }} IPs on {{ $labels.instance }}. Review block list for cleanup."
          action: "Consider running 'nftban firewall unblock --expired' to clean up old blocks"

      # Alert if blocks increasing rapidly
      - alert: NFTBanBlockRateSurge
        expr: rate(nftban_bans_total[5m]) > 10
        for: 10m
        labels:
          severity: warning
          component: firewall
          service: nftban
        annotations:
          summary: "Rapid increase in IP blocks"
          description: "Blocking rate is {{ $value | humanize }} IPs/second on {{ $labels.instance }}. Possible attack in progress."
          action: "Review recent bans with 'nftban firewall list-blocked --recent' and check nftban bans.log"

      # Alert if blocks in last 24h is unusually high
      - alert: NFTBanHighDailyBans
        expr: nftban_bans_last_24h > 1000
        for: 30m
        labels:
          severity: info
          component: firewall
          service: nftban
        annotations:
          summary: "High number of bans in last 24 hours"
          description: "{{ $value }} IPs banned in last 24h on {{ $labels.instance }}. Higher than usual activity."
          action: "Review ban patterns and consider adjusting detection thresholds"

  # NFTBan System Resources
  - name: nftban_system
    interval: 60s
    rules:
      # Alert if nftables rule count is very high
      - alert: NFTBanHighRuleCount
        expr: nftban_nft_rules_total > 10000
        for: 10m
        labels:
          severity: warning
          component: firewall
          service: nftables
        annotations:
          summary: "High nftables rule count"
          description: "nftables has {{ $value }} rules on {{ $labels.instance }}. Performance may be impacted."
          action: "Review and optimize nftables rules, consider cleanup"


  # Geographic Anomalies
  - name: nftban_geographic
    interval: 60s
    rules:
      # Alert if blocks from single country exceed threshold
      - alert: NFTBanHighCountryBlocks
        expr: nftban_bans_by_country_total > 1000
        for: 30m
        labels:
          severity: info
          component: firewall
          service: nftban
        annotations:
          summary: "High block count from single country"
          description: "{{ $value }} IPs blocked from {{ $labels.country }} on {{ $labels.instance }}."
          action: "Review geographic block patterns, consider country-level blocking"

# =============================================================================
# Alert Severity Levels
# =============================================================================
#
# critical (severity: critical)
#   - Immediate action required
#   - Service degradation or failure
#   - Page on-call engineer
#
# error (severity: error)
#   - Requires attention soon
#   - Potential service impact
#   - Send notification
#
# warning (severity: warning)
#   - Should be investigated
#   - No immediate service impact
#   - Create ticket
#
# info (severity: info)
#   - Informational only
#   - Review during business hours
#   - Optional notification
#
# =============================================================================

# =============================================================================
# Alert Actions
# =============================================================================
#
# Each alert includes an "action" annotation with recommended steps.
# Integrate with Alertmanager to send these to:
#   - Email
#   - Slack
#   - PagerDuty
#   - Custom webhook
#
# Example Alertmanager route:
#
#   route:
#     group_by: ['alertname', 'instance']
#     group_wait: 10s
#     group_interval: 10s
#     repeat_interval: 12h
#     receiver: 'nftban-alerts'
#
#     routes:
#       - match:
#           severity: critical
#         receiver: 'pagerduty'
#       - match:
#           severity: error
#         receiver: 'slack-alerts'
#       - match:
#           severity: warning
#         receiver: 'email-alerts'
#
# =============================================================================
