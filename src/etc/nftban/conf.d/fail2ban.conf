# =============================================================================
# NFTBAN FAIL2BAN INTEGRATION CONFIGURATION
# =============================================================================
# Version: 0.32.0
# Purpose: Configure Fail2ban integration with NFTBan
# Loaded by: nftban core during initialization
#
# To customize settings:
#   Add overrides to /etc/nftban/nftban.conf.local
#
# Example overrides in nftban.conf.local:
#   FAIL2BAN_ENABLED="true"
#   FAIL2BAN_JAILS_ENABLED="sshd,nginx-limit-req"
# =============================================================================

# =============================================================================
# FAIL2BAN INTEGRATION
# =============================================================================

# Enable fail2ban integration
# When enabled, NFTBan can manage fail2ban jails and integrate whitelists
# ⚠️  THIS FILE IS OVERWRITTEN DURING UPDATES
# ⚠️  USE /etc/nftban/nftban.conf.local FOR CUSTOM VALUES
#
# DO NOT EDIT THIS FILE FOR PERMANENT CHANGES!
# Your changes will be lost during package updates.
#
# TO CUSTOMIZE:
#   1. Copy setting to /etc/nftban/nftban.conf.local
#   2. Uncomment and modify in .local file
#   3. .local file is NEVER overwritten by updates
#

FAIL2BAN_ENABLED="true"

# Fail2ban configuration directory
FAIL2BAN_JAIL_DIR="/etc/fail2ban/jail.d"

# Fail2ban socket path (for fail2ban-client)
FAIL2BAN_SOCKET="/var/run/fail2ban/fail2ban.sock"

# =============================================================================
# JAIL MANAGEMENT
# =============================================================================

# Available jails (comma-separated)
# These are common fail2ban jails that NFTBan can manage
FAIL2BAN_JAILS_AVAILABLE="sshd,nginx-limit-req,nginx-botsearch,apache-auth,postfix,dovecot,roundcube-auth"

# Enabled jails (comma-separated)
# Jails that should be enabled by default
FAIL2BAN_JAILS_ENABLED="sshd"

# Default ban time for fail2ban jails (seconds)
# 1 hour default
FAIL2BAN_DEFAULT_BANTIME="3600"

# Default find time window (seconds)
# 10 minutes
FAIL2BAN_DEFAULT_FINDTIME="600"

# Default max retry attempts
FAIL2BAN_DEFAULT_MAXRETRY="5"

# =============================================================================
# CLOUDFLARE INTEGRATION
# =============================================================================

# Automatically whitelist Cloudflare IPs in fail2ban
# Prevents blocking Cloudflare when using Cloudflare proxy
FAIL2BAN_CLOUDFLARE_WHITELIST="true"

# Cloudflare whitelist file location
FAIL2BAN_CLOUDFLARE_WHITELIST_FILE="/etc/fail2ban/filter.d/cloudflare-whitelist.conf"

# =============================================================================
# NFTBAN INTEGRATION
# =============================================================================

# Share banned IPs between fail2ban and NFTBan
# When enabled, IPs banned by fail2ban are also added to NFTBan tables
FAIL2BAN_SHARE_BANS="true"

# Sync fail2ban bans to NFTBan nftables
# When enabled, fail2ban banned IPs are added to NFTBan's blacklist
FAIL2BAN_SYNC_TO_NFTABLES="true"

# NFTBan blacklist file for fail2ban sync
FAIL2BAN_NFTBAN_BLACKLIST="/etc/nftban/blacklist.d/fail2ban-auto.list"

# =============================================================================
# LOGGING
# =============================================================================

# Fail2ban integration log file
FAIL2BAN_LOG_FILE="/var/log/nftban/fail2ban.log"

# Log level (DEBUG, INFO, WARN, ERROR)
FAIL2BAN_LOG_LEVEL="INFO"

# =============================================================================
# MONITORING
# =============================================================================

# Check fail2ban status periodically
FAIL2BAN_MONITOR_ENABLED="true"

# Monitoring interval (seconds)
# Check every 5 minutes
FAIL2BAN_MONITOR_INTERVAL="300"

# Alert when fail2ban is not running
FAIL2BAN_ALERT_IF_STOPPED="true"

# Alert method (mail, log, both)
FAIL2BAN_ALERT_METHOD="log"

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Fail2ban client command
FAIL2BAN_CLIENT="/usr/bin/fail2ban-client"

# Fail2ban server command
FAIL2BAN_SERVER="/usr/bin/fail2ban-server"

# Systemd service name
FAIL2BAN_SERVICE="fail2ban"

# Auto-start fail2ban if not running
FAIL2BAN_AUTO_START="false"

# Auto-reload fail2ban after configuration changes
FAIL2BAN_AUTO_RELOAD="true"

# =============================================================================
# JAIL TEMPLATES
# =============================================================================

# Directory containing NFTBan's fail2ban jail templates
FAIL2BAN_TEMPLATE_DIR="/usr/share/nftban/templates/fail2ban"

# =============================================================================
# END OF FAIL2BAN CONFIGURATION
# =============================================================================
