# =============================================================================

# -----------------------------------------------------------------------------
# AUTO-UPDATE MASTER SWITCH
# -----------------------------------------------------------------------------

# Enable/disable auto-updates (true/false)
# IMPORTANT: Requires NFTBAN_UPDATE_NOTIFY_EMAIL to be set
NFTBAN_UPDATE_AUTO_ENABLED="false"

# -----------------------------------------------------------------------------
# UPDATE CHANNEL
# -----------------------------------------------------------------------------

# Update channel determines which versions are eligible for auto-update:
#   stable  - Only patch version updates (1.12.3 -> 1.12.4) - Recommended
#   latest  - All updates including minor/major versions (1.12.x -> 1.13.x)
NFTBAN_UPDATE_CHANNEL="stable"

# -----------------------------------------------------------------------------
# BACKUP & ROLLBACK
# -----------------------------------------------------------------------------

# Create backup before auto-update (true/false)
# Strongly recommended for auto-updates
NFTBAN_UPDATE_BACKUP="true"

# Automatically rollback if health check fails after update (true/false)
NFTBAN_UPDATE_AUTO_ROLLBACK="true"

# Rollback timeout in seconds - time window for automatic rollback decision
NFTBAN_UPDATE_ROLLBACK_TIMEOUT="300"

# -----------------------------------------------------------------------------
# EMAIL NOTIFICATIONS (MANDATORY FOR AUTO-UPDATE)
# -----------------------------------------------------------------------------
# Auto-update cannot be enabled without a valid notification email.
# This ensures you are always notified about update results.

# Notification email address (REQUIRED)
# Options:
#   - Direct email: "admin@example.com"
#   - Panel detection: "panel" (uses nftban_panel_get_admin_email())
#   - Empty: "" (auto-update cannot be enabled)
NFTBAN_UPDATE_NOTIFY_EMAIL=""

# Send email notification on successful update (true/false)
NFTBAN_UPDATE_NOTIFY_SUCCESS="true"

# Send email notification on failed update (true/false)
# Always recommended - failures need immediate attention
NFTBAN_UPDATE_NOTIFY_FAILURE="true"

# -----------------------------------------------------------------------------
# CIRCUIT BREAKER
# -----------------------------------------------------------------------------

# Cooldown period after auto-update failure (seconds)
# During cooldown, auto-update is blocked to prevent repeated failures.
# Default: 604800 (7 days). Set to 0 to disable.
# Clear manually: rm /var/lib/nftban/state/update_failed
NFTBAN_UPDATE_FAILURE_COOLDOWN="604800"

# -----------------------------------------------------------------------------
# SYSTEM LOAD PROTECTION
# -----------------------------------------------------------------------------

# Skip auto-update if system load average exceeds threshold
# Set to "0" to disable load checking
# Example: "4.0" skips update if 1-min load avg > 4.0
NFTBAN_UPDATE_SKIP_HIGH_LOAD="4.0"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------

# Log file for auto-update operations
NFTBAN_UPDATE_LOG_FILE="/var/log/nftban/update.log"

# Enable verbose logging (true/false)
NFTBAN_UPDATE_LOG_VERBOSE="false"

# -----------------------------------------------------------------------------
# USAGE
# -----------------------------------------------------------------------------
#
# Enable auto-updates:
#   nftban update auto enable --email admin@example.com
#   nftban update auto enable --email panel   # Use panel admin email
#
# Check status:
#   nftban update auto status
#
# Disable auto-updates:
#   nftban update auto disable
#
# View logs:
#   tail -f /var/log/nftban/update.log
#   journalctl -u nftban-update.service
#
# Timer schedule: Weekly, Sunday 4:00 AM (with 30min jitter)
#
# =============================================================================
