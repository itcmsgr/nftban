name: "🧪 Beta Feedback (v0.9)"
description: "Share test results and observations from the beta program"
title: "[BETA] "
labels: ["beta-feedback", "needs-triage"]
assignees: ["itcmsgr"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this template
        Report test results from running the beta on supported Linux distros.
        Include what you tested, outcomes, performance notes, and relevant logs.

        **Not for bugs you can already reproduce consistently** — use "🐛 Bug Report" for that.

        Thank you for helping test nftban v0.9!

  - type: dropdown
    id: distro
    attributes:
      label: "Operating System / Distribution"
      options:
        - "Debian 12 (Bookworm)"
        - "Debian 11 (Bullseye)"
        - "Ubuntu 24.04 LTS"
        - "Ubuntu 22.04 LTS"
        - "Ubuntu 20.04 LTS"
        - "RHEL / Rocky / Alma 9"
        - "RHEL / Rocky / Alma 8"
        - "Fedora 35+"
        - "Other (specify below)"
    validations:
      required: true

  - type: input
    id: distro_other
    attributes:
      label: "If Other, specify"
      placeholder: "e.g., Proxmox 8 (Debian base)"
    validations:
      required: false

  - type: input
    id: nftban_version
    attributes:
      label: "nftban Version / Commit"
      placeholder: "e.g., v0.9.0-beta, commit abc1234"
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: "Areas You Tested"
      options:
        - label: "Installer / Upgrade"
        - label: "Core / CLI"
        - label: "Fail2Ban integration"
        - label: "DDoS protections"
        - label: "Port scan detection"
        - label: "GeoIP / Feeds"
        - label: "Whitelist / Blacklist"
        - label: "Cloudflare integration"
        - label: "Smoketest / Stats"
        - label: "Migration from v0.8.5"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: "What You Tested"
      description: "Commands run, scenarios covered, and expected outcomes"
      placeholder: |
        Example:
        - sudo nftban ddos enable
        - sudo nftban portscan enable
        - sudo nftban smoketest run
        - Migrated from v0.8.5 using fresh install method
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: "Results and Observations"
      description: "Successes, failures, surprises, performance impressions"
      placeholder: "Share what worked, what didn't, and any timing or resource notes"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs (optional)"
      placeholder: |
        ```text
        journalctl -u nftban --no-pager -n 200
        ```
    validations:
      required: false

  - type: textarea
    id: suggestions
    attributes:
      label: "Suggestions"
      placeholder: "Improvements to UX, docs, defaults, or safety checks"
    validations:
      required: false
