# =============================================================================
# NFTBan - CI: Go Build & Test
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Go code validation, build verification, and test execution
#
# Checks:
#   - go mod tidy (dependencies clean)
#   - go vet (semantic analysis)
#   - go build (all packages + named binaries)
#   - go test -race (unit + integration tests with race detector)
#   - Binary verification (ELF type, minimum size)
#   - CLI structure validation
# =============================================================================

name: Go Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # v1.157 PR-C: setup-go installs the exact go.mod patch (1.25.11) on the
    # runner, so GOTOOLCHAIN=local prevents a redundant toolchain re-download
    # (and its TLS-handshake flake) mid-build. Safe: requested == go.mod patch.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.6.0
        with:
          # v1.157 PR-C: pin exact patch (matches go.mod `go 1.25.11`) so the
          # toolchain patch never moves under us mid-build.
          go-version: '1.25.11'

      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # B80-8: Schema drift gate. Regenerate Go schema from canonical shell
      # source and fail if the committed schema_generated.go differs.
      - name: Verify Go schema matches canonical shell schema
        run: |
          ./scripts/generate-go-schema.sh
          git diff --exit-code -- internal/validator/schema_generated.go || {
            echo "::error::Schema drift detected. Run './scripts/generate-go-schema.sh' and commit the result."
            echo "::error::Canonical source: cli/lib/nftban/lib/nft_schema.sh"
            exit 1
          }

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::Run 'go mod tidy' and commit changes"
            exit 1
          }

      - name: Run go vet
        run: |
          go vet ./... 2>&1 | tee /tmp/vet.out
          if [ -s /tmp/vet.out ]; then
            echo "::error::go vet found issues:"
            cat /tmp/vet.out
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Build named binaries
        run: |
          mkdir -p bin
          go build -trimpath -o bin/nftban-core ./cmd/nftban-core
          go build -trimpath -o bin/nftband ./cmd/nftband
          go build -trimpath -o bin/nftban-validate ./cmd/nftban-validate

      - name: Verify binaries
        run: |
          echo "=== Built binaries ==="
          ls -lh bin/
          for binary in nftban-core nftband nftban-validate; do
            file bin/$binary
            TYPE=$(file -b bin/$binary)
            if [[ ! "$TYPE" =~ ELF ]]; then
              echo "::error::bin/$binary is not an ELF binary: $TYPE"
              exit 1
            fi
            SIZE=$(stat -c%s "bin/$binary")
            if [[ "$SIZE" -lt 102400 ]]; then
              echo "::error::bin/$binary is suspiciously small ($SIZE bytes)"
              exit 1
            fi
            echo "✓ $binary: ELF, ${SIZE} bytes"
          done

      - name: Run tests with race detector
        run: go test -race -v ./...

      - name: Verify CLI structure
        run: |
          echo "=== Verifying CLI structure ==="
          test -f cli/sbin/nftban || { echo "FAIL: cli/sbin/nftban missing"; exit 1; }
          test -f cli/lib/nftban/nftban_help.sh || { echo "FAIL: nftban_help.sh missing"; exit 1; }
          test -d cli/lib/nftban/core || { echo "FAIL: core/ missing"; exit 1; }
          test -d cli/lib/nftban/cli || { echo "FAIL: cli/ missing"; exit 1; }
          test -d cli/lib/nftban/lib || { echo "FAIL: lib/ missing"; exit 1; }
          echo "✓ CLI structure valid"
