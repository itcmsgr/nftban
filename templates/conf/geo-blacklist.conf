# KE  # Kenya - Mixed traffic
#
# Eastern European countries (examples):
# UA  # Ukraine - Verify need, has legitimate traffic
# BY  # Belarus - Limited legitimate traffic
# MD  # Moldova - Known hosting of malicious services
#
# Asian countries (examples):
# TH  # Thailand - Mixed traffic
# ID  # Indonesia - Large population, mixed traffic
# MY  # Malaysia - Mixed traffic
# =============================================================================



# =============================================================================
# SANCTIONED/RESTRICTED COUNTRIES
# =============================================================================
