name: Web API CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cmd/nftban-api/**'
      - 'pkg/webapi/**'
      - 'web/**'
      - 'install/systemd/nftban-api.service'
      - 'install/pam.d/nftban-api'
      - 'install/packaging/rpm/nftban-api.spec'
      - 'install/packaging/deb/nftban-api.*'
      - '.github/workflows/webapi-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cmd/nftban-api/**'
      - 'pkg/webapi/**'
      - 'web/**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpam0g-dev

    - name: Install dependencies
      run: |
        go mod download
        go mod verify

    - name: Build nftban-api
      run: |
        cd cmd/nftban-api
        CGO_ENABLED=1 go build -v -o nftban-api .
        ls -lh nftban-api
        ./nftban-api --version || true

    - name: Run Go tests
      run: |
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./pkg/webapi/...

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.txt
        flags: webapi

    - name: Check file sizes
      run: |
        echo "Binary size:"
        du -h cmd/nftban-api/nftban-api
        echo ""
        echo "Web assets:"
        du -sh web/
        du -h web/assets/css/*.css
        du -h web/assets/js/*.js

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install PAM headers
      run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m
        working-directory: cmd/nftban-api

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Gosec Security Scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec.sarif ./...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: gosec.sarif

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate HTML
      run: |
        sudo apt-get update
        sudo apt-get install -y tidy
        for file in web/*.html; do
          echo "Checking $file..."
          tidy -q -e --gnu-emacs yes $file || true
        done

    - name: Check CSS
      run: |
        npm install -g stylelint stylelint-config-standard
        echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json
        stylelint "web/assets/css/*.css" || true

    - name: Check JavaScript
      run: |
        npm install -g eslint
        npx eslint web/assets/js/*.js || true

  accessibility:
    name: Accessibility Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Pa11y
      run: npm install -g pa11y-ci

    - name: Run accessibility tests
      run: |
        echo '{ "urls": ["web/index.html", "web/dashboard.html", "web/ban-list.html", "web/metrics.html"] }' > .pa11yci.json
        pa11y-ci || true

  package:
    name: Package Build Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, fedora]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install RPM build tools (Fedora)
      if: matrix.os == 'fedora'
      run: |
        dnf install -y rpm-build rpmdevtools golang

    - name: Install DEB build tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper golang-go

    - name: Test install script
      run: |
        chmod +x install/packaging/install-webapi.sh
        sudo ./install/packaging/install-webapi.sh || true

    - name: Test uninstall script
      run: |
        chmod +x install/packaging/uninstall-webapi.sh
        echo "n" | sudo ./install/packaging/uninstall-webapi.sh || true
