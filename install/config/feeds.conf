#
# IMPORTANT: ALL FEEDS ARE DISABLED BY DEFAULT FOR SAFETY
# Use 'nftban feeds select' to interactively enable feeds
# Use 'nftban feeds enable <name>' to enable specific feeds
#
# ⚠️  WARNING: LARGE FEEDS IMPACT PERFORMANCE!
# Feeds with 100K+ entries make 'nft list ruleset' VERY SLOW (60-90 seconds).
# ALWAYS use 'nft -t list ruleset' (terse mode) instead - it's fast.
# See docs/FEEDS_PERFORMANCE.md for details.
#
# Pattern: FEED_<NAME>_<PROPERTY>="value"
# This file is DYNAMIC - feeds are auto-discovered by scanning for FEED_*_URL
# To add a new feed, just add the 4 required variables below
# =============================================================================

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Master switch for feeds system (disabled by default — opt-in)
# Enable via: nftban feeds enable, or set to "true" in feeds.conf.local
NFTBAN_FEEDS_ENABLED="false"

# Update settings
FEEDS_UPDATE_INTERVAL="3600"                    # 1 hour (seconds)
FEEDS_AUTO_UPDATE="true"                        # Auto-update via timer
FEEDS_DOWNLOAD_TIMEOUT="30"                     # Download timeout (seconds)

# Validation settings
FEEDS_MIN_ENTRIES="10"                          # Minimum valid entries
FEEDS_MAX_ENTRIES="500000"                      # Maximum entries (truncate if exceeded)

# Paths
FEEDS_STORAGE_DIR="/var/lib/nftban/feeds"       # Parsed feed files
FEEDS_CACHE_DIR="/var/cache/nftban/feeds"       # Download cache
FEEDS_LOG_FILE="/var/log/nftban/feeds.log"      # Dedicated feeds log for troubleshooting

# Logging
FEEDS_LOG_LEVEL="INFO"                          # DEBUG, INFO, WARN, ERROR
FEEDS_LOG_DOWNLOADS="true"                      # Log all download attempts
FEEDS_LOG_PARSING="true"                        # Log parsing details

# =============================================================================
# CATEGORY: protection (General Security & Protection)
# =============================================================================

# Spamhaus DROP - Known spam sources (Don't Route Or Peer)
FEED_SPAMHAUS_DROP_URL="https://www.spamhaus.org/drop/drop.txt"
FEED_SPAMHAUS_DROP_ENABLED="false"              # ⚠️ DISABLED BY DEFAULT
FEED_SPAMHAUS_DROP_CATEGORY="protection"
FEED_SPAMHAUS_DROP_DESCRIPTION="Spamhaus DROP - Hijacked/criminal network ranges"
FEED_SPAMHAUS_DROP_INTERVAL="DAILY"
FEED_SPAMHAUS_DROP_SIZE="~1,000 IPs"

# NOTE: Spamhaus EDROP was merged into DROP as of 2024
# Use SPAMHAUS_DROP instead - it now includes all EDROP ranges

# NOTE: DShield (dshield.org/block.txt) uses special tab-delimited format
# that requires custom parsing. Not currently supported.
# Alternative: Use FIREHOL_LEVEL1 which includes DShield data

# Abuse.ch Feodo Tracker - Botnet C&C servers
FEED_ABUSECH_FEODO_URL="https://feodotracker.abuse.ch/downloads/ipblocklist.txt"
FEED_ABUSECH_FEODO_ENABLED="false"              # ⚠️ DISABLED BY DEFAULT
FEED_ABUSECH_FEODO_CATEGORY="protection"
FEED_ABUSECH_FEODO_DESCRIPTION="Abuse.ch Feodo - Botnet C&C servers"
FEED_ABUSECH_FEODO_INTERVAL="DAILY"
FEED_ABUSECH_FEODO_SIZE="~5,000 IPs"

# Abuse.ch SSL Blacklist - SSL/TLS abuse
FEED_ABUSECH_SSL_URL="https://sslbl.abuse.ch/blacklist/sslipblacklist.txt"
FEED_ABUSECH_SSL_ENABLED="false"                # ⚠️ DISABLED BY DEFAULT
FEED_ABUSECH_SSL_CATEGORY="protection"
FEED_ABUSECH_SSL_DESCRIPTION="Abuse.ch SSL - SSL/TLS abuse"
FEED_ABUSECH_SSL_INTERVAL="DAILY"
FEED_ABUSECH_SSL_SIZE="~3,000 IPs"

# FireHOL Level 1 - High-confidence threats
