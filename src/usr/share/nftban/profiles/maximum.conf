# =============================================================================
# NFTBan Security Profile: Maximum Security (Paranoid Mode)
# =============================================================================
# Optimized for: Maximum protection, high-security requirements
# Best for: Sensitive servers, high-value targets, paranoid admins
# =============================================================================

PROFILE_NAME="maximum"
PROFILE_DESCRIPTION="Maximum Security - All protections enabled"

# =============================================================================
# DDOS PROTECTION: ALL ENABLED
# =============================================================================

DDOS_PROTECTION_ENABLED="true"

# SYN Flood: ENABLED
DDOS_SYNFLOOD_ENABLED="true"
DDOS_SYNFLOOD_RATE="50/second"  # Aggressive
DDOS_SYNFLOOD_BURST="75"

# Connection Limits: VERY STRICT
DDOS_CONNLIMIT_ENABLED="true"
DDOS_CONNLIMIT_SSH="3"          # Very low
DDOS_CONNLIMIT_HTTP="20"
DDOS_CONNLIMIT_HTTPS="20"
DDOS_CONNLIMIT_FTP="2"
DDOS_CONNLIMIT_SMTP="3"
DDOS_CONNLIMIT_POP3="3"
DDOS_CONNLIMIT_IMAP="3"
DDOS_CONNLIMIT_MYSQL="2"
DDOS_CONNLIMIT_POSTGRESQL="2"

# Port Flood: AGGRESSIVE
DDOS_PORTFLOOD_ENABLED="true"
DDOS_PORTFLOOD_RATE="300/second"
DDOS_PORTFLOOD_BURST="500"
DDOS_PORTFLOOD_SSH="3/300"
DDOS_PORTFLOOD_HTTP="20/5"
DDOS_PORTFLOOD_HTTPS="20/5"

# ICMP Flood: STRICT
DDOS_ICMPFLOOD_ENABLED="true"
DDOS_ICMPFLOOD_RATE="20/second"
DDOS_ICMPFLOOD_BURST="40"

# =============================================================================
# PORT SCAN DETECTION: MAXIMUM
# =============================================================================

PORTSCAN_ENABLED="true"
PORTSCAN_TIME_WINDOW="60"       # 1 minute!
PORTSCAN_THRESHOLD="3"          # 3 ports triggers ban
PORTSCAN_DIVERSITY="false"
PORTSCAN_AUTO_BAN="true"
PORTSCAN_BAN_TYPE="permanent"   # Permanent bans!
PORTSCAN_MONITOR_PORTS="all"    # Monitor ALL ports
PORTSCAN_MONITOR_ICMP="true"
