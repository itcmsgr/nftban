# =============================================================================
# NFTBan v0.30.1 - GitHub Actions Release Workflow
# =============================================================================
# SPDX-License-Identifier: MPL-2.0
# Purpose: Automated package building and release on version tags
# Triggers: Push to v* tags (e.g., v0.30.1, v0.30.2)
#
# What this does:
#   1. Builds Go binaries (nftban-feeds, nftban-geoip) for x86_64 and aarch64
#   2. Creates RPM packages for Rocky 9, AlmaLinux 9, Fedora
#   3. Creates DEB packages for Ubuntu 22.04/24.04, Debian 12
#   4. Generates SHA256SUMS for all artifacts
#   5. Creates simplified package names (nftban-amd64.deb, nftban-x86_64.rpm)
#   6. Creates MANIFEST.txt (file inventory)
#   7. Uploads everything to GitHub Release
#
# Future enhancements:
#   - GPG signing (infrastructure ready, commented out below)
#   - SBOM generation (SPDX/CycloneDX)
#   - Package repository publishing (COPR/PPA)
# =============================================================================

name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # Required to create/edit GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # =======================================================================
      # 1. CHECKOUT
      # =======================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper version detection

      # =======================================================================
      # 2. SETUP BUILD ENVIRONMENT
      # =======================================================================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            dpkg-dev \
            fakeroot \
            build-essential \
            debhelper \
            devscripts \
            rsync \
            golang

          # Verify rpmbuild is available (comes with rpm package on Ubuntu)
          which rpmbuild || (echo "ERROR: rpmbuild not found" && exit 1)

          # Verify golang is available
          which go || (echo "ERROR: go not found" && exit 1)
          go version

      # =======================================================================
      # 3. BUILD GO BINARIES
      # =======================================================================
      - name: Build Go binaries (x86_64 and aarch64)
        run: |
          chmod +x scripts/build-go-binaries.sh
          ./scripts/build-go-binaries.sh

          echo "=== Verify binaries were built ==="
          ls -lh dist/x86_64/
          ls -lh dist/aarch64/

      # =======================================================================
      # 4. BUILD RPM PACKAGES (using Rocky Linux container)
      # =======================================================================
      - name: Build RPM packages in Rocky Linux container
        run: |
          docker run --rm -v "$(pwd):/workspace" -w /workspace rockylinux:9 bash -c "
            set -e  # Exit on any error

            # CRITICAL: Use distro-sync to align BaseOS/AppStream repo versions
            # This fixes glibc/glibc-devel version mismatches caused by mirror skew
            echo '=== Syncing to consistent repo state (distro-sync) ==='
            dnf clean all
            rm -rf /var/cache/dnf

            # IMPORTANT: Install build dependencies AS PART OF distro-sync to avoid
            # pulling from stale mirrors. This ensures all packages come from the
            # same consistent repo snapshot.
            echo '=== Installing build dependencies in single transaction ==='
            dnf -y --releasever=9 --refresh distro-sync \
              glibc glibc-devel rpm-build rpmdevtools tar gzip which \
              systemd-rpm-macros golang gcc || {
              echo 'ERROR: Failed to sync repos and install build dependencies'
              exit 1
            }

            # Verify rpmbuild is available
            which rpmbuild || { echo 'ERROR: rpmbuild not found after install'; exit 1; }
            echo '✓ rpmbuild available'

            chmod +x scripts/build-rpm.sh
            ./scripts/build-rpm.sh

            # Fix permissions so Ubuntu runner can read AND write to packages directory
            chmod -R a+rwX /workspace/dist/packages/ || true
          "

      - name: Verify RPM packages built
        run: |
          echo "=== RPM packages built ==="
          ls -lh dist/packages/*.rpm

      # =======================================================================
      # 5. BUILD DEB PACKAGES
      # =======================================================================
      - name: Build DEB packages
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

          echo "=== DEB packages built ==="
          ls -lh dist/packages/*.deb

      # =======================================================================
      # 6. GENERATE CHECKSUMS (v0.30.0: SHA256 only, no GPG yet)
      # =======================================================================
      - name: Generate SHA256SUMS
        run: |
          cd dist/packages
          rm -f SHA256SUMS

          # Generate checksums for all packages
          if ls *.rpm *.deb 1> /dev/null 2>&1; then
            sha256sum *.rpm *.deb > SHA256SUMS
            echo "=== SHA256SUMS ==="
            cat SHA256SUMS
          else
            echo "WARNING: No packages found to checksum"
          fi

      # =======================================================================
      # 7. GENERATE MANIFEST
      # =======================================================================
      - name: Generate MANIFEST.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > MANIFEST.txt <<EOF
          NFTBan ${VERSION} - Release Artifacts
          ===================================

          Simplified Package Names (for easy downloads):
          - nftban-x86_64.rpm    (Red Hat/Rocky/Alma/Fedora x86_64)
          - nftban-aarch64.rpm   (Red Hat/Rocky/Alma/Fedora ARM64)
          - nftban-amd64.deb     (Ubuntu/Debian amd64)
          - nftban-arm64.deb     (Ubuntu/Debian ARM64)

          Full Package Names:
          EOF

          for file in nftban-[0-9]* nftban_[0-9]*; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
              printf "%-50s %12d bytes\n" "$file" "$size" >> MANIFEST.txt
            fi
          done

          echo "=== MANIFEST.txt ==="
          cat MANIFEST.txt

      # =======================================================================
      # 8. CREATE VERIFY.txt
      # =======================================================================
      - name: Create VERIFY.txt
        run: |
          cd dist/packages
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > VERIFY.txt <<EOF
          NFTBan ${VERSION} - Package Verification & Installation Guide
          ============================================================

          1. Download using simple links:

             # Rocky/AlmaLinux/Fedora (x86_64)
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-x86_64.rpm

             # Ubuntu/Debian (amd64)
             wget https://github.com/itcmsgr/nftban/releases/latest/download/nftban-amd64.deb

          2. Verify package integrity:

             sha256sum -c SHA256SUMS

          3. Install package:

             # Rocky/AlmaLinux/Fedora
             sudo dnf install -y nftban-x86_64.rpm

             # Ubuntu/Debian
             sudo dpkg -i nftban-amd64.deb
             sudo apt-get install -f

          4. Verify installation:

             nftban --version
             nftban health check

          NOTE: SHA256 checksums provided. GPG signing planned for future release.

          Documentation: https://github.com/itcmsgr/nftban#readme
          EOF

      # =======================================================================
      # 9. EXTRACT RELEASE NOTES FROM CHANGELOG
      # =======================================================================
      - name: Extract release notes
        run: |
          # Extract version section from CHANGELOG.md
          VERSION="${GITHUB_REF#refs/tags/}"

          if [ -f "CHANGELOG.md" ]; then
            # Try to extract section for this version
            awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | \
              sed '/^## \[/d' | head -n -1 > dist/packages/RELEASE_NOTES.md || \
              echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          else
            echo "Release ${VERSION}" > dist/packages/RELEASE_NOTES.md
          fi

          echo "=== RELEASE_NOTES.md ==="
          cat dist/packages/RELEASE_NOTES.md

      # =======================================================================
      # 10. CREATE SIMPLIFIED PACKAGE NAMES (for easy downloads)
      # =======================================================================
      - name: Create simplified package names
        run: |
          cd dist/packages

          # RPM packages - x86_64
          if ls nftban-*.el*.x86_64.rpm 1> /dev/null 2>&1; then
            RPM_X86=$(ls nftban-*.el*.x86_64.rpm | head -n1)
            cp "$RPM_X86" nftban-x86_64.rpm
            echo "✓ Created nftban-x86_64.rpm from $RPM_X86"
          fi

          # RPM packages - aarch64
          if ls nftban-*.el*.aarch64.rpm 1> /dev/null 2>&1; then
            RPM_ARM=$(ls nftban-*.el*.aarch64.rpm | head -n1)
            cp "$RPM_ARM" nftban-aarch64.rpm
            echo "✓ Created nftban-aarch64.rpm from $RPM_ARM"
          fi

          # DEB packages - amd64
          if ls nftban_*_amd64.deb 1> /dev/null 2>&1; then
            DEB_AMD64=$(ls nftban_*_amd64.deb | head -n1)
            cp "$DEB_AMD64" nftban-amd64.deb
            echo "✓ Created nftban-amd64.deb from $DEB_AMD64"
          fi

          # DEB packages - arm64
          if ls nftban_*_arm64.deb 1> /dev/null 2>&1; then
            DEB_ARM64=$(ls nftban_*_arm64.deb | head -n1)
            cp "$DEB_ARM64" nftban-arm64.deb
            echo "✓ Created nftban-arm64.deb from $DEB_ARM64"
          fi

          echo "=== Simplified package names created ==="
          ls -lh nftban-*.{rpm,deb} 2>/dev/null || echo "No simplified packages"

          echo "=== All packages ==="
          ls -lh

      # =======================================================================
      # 11. UPLOAD TO GITHUB RELEASE
      # =======================================================================
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/packages/*.rpm
            dist/packages/*.deb
            dist/packages/SHA256SUMS
            dist/packages/MANIFEST.txt
            dist/packages/VERIFY.txt
          body_path: dist/packages/RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =======================================================================
      # 12. OPTIONAL: GPG SIGNING (v0.10.1+)
      # =======================================================================
      # Uncomment these steps when ready to enable package signing
