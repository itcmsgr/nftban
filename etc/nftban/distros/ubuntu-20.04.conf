# =============================================================================
# NFTBan Distribution Configuration - Ubuntu 20.04 LTS (Focal Fossa)
# =============================================================================

[distro]
id = ubuntu
name = Ubuntu
version = 20.04
family = debian
version_codename = focal

[package_manager]
type = apt
install_cmd = apt-get install -y
update_cmd = apt-get update
upgrade_cmd = apt-get upgrade -y
search_cmd = apt-cache search
info_cmd = apt-cache show

[packages]
victoriametrics = victoriametrics
nftables = nftables
curl = curl
iproute = iproute2
bash = bash
systemd = systemd
suricata = suricata
suricata_update = suricata-update
mail = mailutils
golang = golang-go
golang_min_version = 2:1.13
jq = jq
wget = wget
git = git
prometheus = prometheus
node_exporter = prometheus-node-exporter

[services]
cron = cron
rsyslog = rsyslog
suricata = suricata
suricata_update = suricata-update
nftables = nftables
sshd = ssh
polkit = polkit
prometheus = prometheus
node_exporter = prometheus-node-exporter

[paths]
nft = /usr/sbin/nft
mail = /usr/bin/mail
systemctl = /bin/systemctl
cron_d = /etc/cron.d
systemd_system = /lib/systemd/system
suricata = /usr/bin/suricata
suricatasc = /usr/bin/suricatasc
suricata_conf = /etc/suricata
suricata_yaml = /etc/suricata/suricata.yaml
suricata_eve_log = /var/log/nftban/suricata/eve.json
suricata_log_dir = /var/log/nftban/suricata
suricata_rules_dir = /var/lib/suricata/rules
nftables_conf = /etc/nftables.conf
nftables_conf_primary = /etc/nftables.conf

[repository]
epel_required = false
epel_package =
epel_install_cmd =

[features]
systemd_support = true
firewalld_default = false
ufw_default = true
apparmor_default = enforcing
